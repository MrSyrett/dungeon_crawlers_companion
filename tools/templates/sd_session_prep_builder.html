<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session Prep Builder — Shadowdark RPG</title>
<script src="/dungeon-engine.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&family=MedievalSharp&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<!-- html2canvas + jsPDF (~550KB) load on demand in loadExportLibs() when an
     export button is first clicked, instead of blocking first paint here. -->
<style>
  /* Display faces served from /fonts/ (long-cached) instead of ~124KB of
     inline base64 re-downloaded on every open. Absolute URLs so exported
     HTML still finds them when opened anywhere with a connection; offline,
     exports fall back to the Google-font stack. */
  @font-face{font-family:'JSL Blackletter';font-style:normal;font-weight:400;font-display:swap;src:url(https://www.dccompanion.com/fonts/jsl-blackletter.woff2) format('woff2');}
  @font-face{font-family:'Old Newspaper';font-style:normal;font-weight:400;font-display:swap;src:url(https://www.dccompanion.com/fonts/old-newspaper.woff2) format('woff2');}
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    /* Shadowdark RPG palette — high contrast, clean, brutal */
    --ink: #0a0a0a; --paper: #f8f8f6; --accent: #1a1a1a; --accent-dark: #000000;
    --accent-red: #1a1a1a; --accent-red-dark: #000000;
    --muted: #444; --rule: #c0c0c0; --box-bg: #efefed; --read-bg: #1a1a1a;
    --read-text: #f8f8f6; --highlight: #e8c84a; --green: #1a3a1a; --blue-npc: #1a2a3a;
    --section-hdr: #0a0a0a; --table-hdr: #1a1a1a;
    /* UI sidebar — dark stone */
    --ui-bg: #111112; --ui-panel: #1a1a1c; --ui-border: #2e2e32;
    --ui-text: #e8e8e4; --ui-muted: #7a7a7a; --ui-accent: #e8c84a; --ui-highlight: #e8c84a;
  }
  body { font-family: 'Montserrat', sans-serif; background: var(--ui-bg); color: var(--ui-text); display: flex; height: 100vh; overflow: hidden; }

  /* SIDEBAR */
  .sidebar { width: 320px; min-width: 320px; background: var(--ui-panel); border-right: 1px solid var(--ui-border); display: flex; flex-direction: column; overflow: hidden; transition: width 0.25s, min-width 0.25s; }
  .sidebar { width: 320px; min-width: 320px; background: var(--ui-panel); border-right: 1px solid var(--ui-border); display: flex; flex-direction: column; overflow: hidden; transition: width 0.25s, min-width 0.25s; }
  .sidebar.collapsed { width: 0px; min-width: 0; overflow: hidden; }
  .sidebar-pull-tab {
    position: fixed; top: 50%; left: 320px; transform: translateY(-50%);
    width: 22px; height: 60px; background: #e8c84a; border: none;
    border-radius: 0 6px 6px 0; cursor: pointer; z-index: 300;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 900; color: #1a1a1a;
    transition: left 0.25s ease, background 0.15s;
    box-shadow: 2px 0 8px rgba(0,0,0,0.3);
  }
  .sidebar-pull-tab:hover { background: #f5d860; }
  .sidebar.collapsed .sidebar-content,
  .sidebar.collapsed .sidebar-tabs,
  .sidebar.collapsed .sidebar-footer,
  .sidebar.collapsed .save-indicator,
  .sidebar.collapsed .sidebar-sub,
  .sidebar.collapsed .sidebar-title,
  .sidebar.collapsed .toggle-row { display: none !important; }
  .collapse-btn { background: none; border: none; color: var(--ui-muted); cursor: pointer; font-size: 18px; line-height: 1; padding: 4px 6px; border-radius: 3px; transition: color 0.15s; flex-shrink: 0; }
  .collapse-btn:hover { color: var(--ui-accent); }
  .sidebar-header-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .sidebar-header { padding: 16px; border-bottom: 1px solid var(--ui-border); background: var(--ui-bg); }
  .sidebar-title { font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ui-accent); white-space: nowrap; }
  .sidebar-sub { font-family: 'Montserrat', sans-serif; font-size: 9px; color: var(--ui-muted); letter-spacing: 0.1em; margin-top: 2px; }
  .sidebar-tabs { display: flex; border-bottom: 1px solid var(--ui-border); }
  .tab-btn { flex: 1; padding: 8px 2px; background: none; border: none; color: var(--ui-muted); font-family: 'Montserrat', sans-serif; font-size: 7.5px; letter-spacing: 0.03em; text-transform: uppercase; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; white-space: nowrap; }
  .tab-btn.active { color: var(--ui-highlight); border-bottom-color: var(--ui-highlight); }
  .tab-btn:hover:not(.active) { color: var(--ui-text); }
  .sidebar-content { flex: 1; overflow-y: auto; padding: 12px; }
  .sidebar-content::-webkit-scrollbar { width: 4px; }
  .sidebar-content::-webkit-scrollbar-thumb { background: var(--ui-border); border-radius: 2px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* FORM */
  .field-group { margin-bottom: 12px; }
  .field-label { font-family: 'Montserrat', sans-serif; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ui-muted); margin-bottom: 4px; display: block; }
  .field-label.accent { color: var(--ui-accent); }
  .field-label.gold { color: var(--ui-highlight); }
  .field-label.green { color: #4caf7d; }
  input[type="text"], textarea { width: 100%; background: var(--ui-bg); border: 1px solid var(--ui-border); border-radius: 3px; color: var(--ui-text); font-family: 'Montserrat', sans-serif; font-size: 11px; padding: 6px 8px; outline: none; transition: border-color 0.15s; resize: vertical; }
  input[type="text"]:focus, textarea:focus { border-color: var(--ui-accent); }
  textarea { min-height: 60px; line-height: 1.5; }
  textarea.short { min-height: 40px; }
  .section-divider { font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ui-text); background: var(--ui-border); padding: 4px 8px; margin: 14px -12px 10px; border-left: 3px solid var(--ui-accent); }
  .section-divider.green { border-left-color: #4caf7d; }
  .section-divider.gold { border-left-color: var(--ui-highlight); }
  .entity-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .entity-card { background: var(--ui-bg); border: 1px solid var(--ui-border); border-radius: 3px; padding: 8px; }
  .entity-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .entity-name-input { font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; background: none; border: none; border-bottom: 1px solid var(--ui-border); color: var(--ui-text); padding: 2px 0; width: 180px; outline: none; }
  .entity-name-input:focus { border-bottom-color: var(--ui-accent); }
  .btn-move { background:none;border:none;color:var(--ui-muted);cursor:pointer;font-size:11px;line-height:1;padding:2px 2px;border-radius:2px;width:18px;text-align:center; }
  .btn-move:hover { color:var(--ui-accent); }
  .btn-remove { background: none; border: none; color: var(--ui-muted); cursor: pointer; font-size: 14px; line-height: 1; padding: 2px 4px; border-radius: 2px; }
  .btn-remove:hover { color: var(--ui-accent); }
  .btn-add { width: 100%; background: none; border: 1px dashed var(--ui-border); border-radius: 3px; color: var(--ui-muted); font-family: 'Montserrat', sans-serif; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; padding: 6px; cursor: pointer; transition: all 0.15s; margin-top: 2px; }
  .btn-add:hover { border-color: var(--ui-accent); color: var(--ui-accent); }
  .location-card { background: var(--ui-bg); border: 1px solid var(--ui-border); border-left: 2px solid var(--accent-red); border-radius: 3px; padding: 8px; margin-bottom: 6px; }
  .sidebar-footer { padding: 10px 12px; border-top: 1px solid var(--ui-border); display: flex; gap: 8px; }
  .btn-primary { flex: 1; background: var(--ui-accent); border: none; color: white; font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; padding: 8px; border-radius: 3px; cursor: pointer; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-secondary { flex: 1; background: none; border: 1px solid var(--ui-border); color: var(--ui-text); font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; padding: 8px; border-radius: 3px; cursor: pointer; }
  .btn-secondary:hover { border-color: var(--ui-text); }
  .save-indicator { font-family: 'Montserrat', sans-serif; font-size: 8px; color: var(--ui-muted); letter-spacing: 0.08em; text-align: center; padding: 4px; transition: color 0.3s; }
  .save-indicator.saved { color: #4caf7d; }
  .checkbox-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .checkbox-row label { font-family: 'Montserrat', sans-serif; font-size: 9px; color: var(--ui-muted); text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer; margin: 0; }

  /* Dark mode toggle — label right beside the switch, both pushed to the right
     edge of the header so the fixed "← Home" button (top-left) can't cover them. */
  .toggle-row { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex: 1 1 auto; }
  .toggle-label { font-family: 'Montserrat', sans-serif; font-size: 9px; color: var(--ui-muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .toggle { position: relative; width: 34px; height: 18px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider { position: absolute; inset: 0; background: var(--ui-border); border-radius: 18px; cursor: pointer; transition: background 0.2s; }
  .toggle-slider:before { content: ''; position: absolute; width: 12px; height: 12px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: transform 0.2s; }
  .toggle input:checked + .toggle-slider { background: var(--ui-accent); }
  .toggle input:checked + .toggle-slider:before { transform: translateX(16px); }

  /* Page dark mode */
  .page.dark-mode { background: #1a1a1e; }
  .page.dark-mode .adventure-subtitle { color: #1a1a1a; }
  .page.dark-mode .header-meta { color: #1a1a1a; }
  .page.dark-mode .header-meta span { color: #1a1a1a; }
  .page.dark-mode .page-banner { background: #0a0a0a; }
  .page.dark-mode .adventure-title { color: #1a1a1a; }
  .page.dark-mode .p-text { color: #d0ccc4; }
  .page.dark-mode .entry-name { color: #0a0a0a; }
  .page.dark-mode .entry-desc { color: #222; }
  .page.dark-mode .reward-stats { color: #222; }
  .page.dark-mode .entry-meta { color: #555; }
  .page.dark-mode .loc-tag { color: #888; }
  .page.dark-mode .loc-desc { color: #b0aca4; }
  .page.dark-mode .npc-block { background: var(--box-bg); }
  .page.dark-mode .mob-block { background: var(--box-bg); }
  .page.dark-mode .clue-item { background: #2a2010; color: #d0ccc4; }
  .page.dark-mode .hook-item { background: #1e1a10; color: #d0ccc4; }
  .page.dark-mode .clue-hdr { color: #e8e4dc; }
  .page.dark-mode .stat-block { background: #ffffff; }
  .page.dark-mode .sb-name { color: var(--ink); }
  .page.dark-mode .sb-type { color: #444; }
  .page.dark-mode .sb-table td { background: #ffffff; color: #0a0a0a; border-color: rgba(0,0,0,0.1); }
  .page.dark-mode .sb-ability { color: var(--ink); }
  .page.dark-mode .sb-warning { background: #1a2a3a; color: #7aaadd; border-color: #1a4a8a; }
  .page.dark-mode .sb-notes { color: var(--ink); }
  .page.dark-mode .adventure-title { color: #ffffff; }
  .page.dark-mode .adventure-subtitle { color: #ffffff; }
  .page.dark-mode .header-meta span { color: #ffffff; }
  .page.dark-mode .sl { color: #f8f8f6; background: #000000; }
  .page.dark-mode .location-block { border-bottom-color: #3a3a3e; }
  .page.dark-mode .p-footer { border-top-color: #F7941D; }
  .page.dark-mode .p2-footer { border-top-color: #F7941D; }
  .page.dark-mode .p2-footer p { color: #888; }
  .page.dark-mode .map-placeholder { background: #2a2a2e; color: #F7941D; border-color: #F7941D; }
  .page.dark-mode .columns { color: #d0ccc4; }
  /* Random encounter roll table + flowchart arrows were staying black on the
     dark page. These beat the inline colors set when the table is rendered. */
  .page.dark-mode .randenc-table td { color: #d0ccc4 !important; }
  .page.dark-mode .randenc-text { color: #d0ccc4 !important; }
  .page.dark-mode .randenc-num { color: #6ec46e !important; }
  .page.dark-mode .randenc-table tr { border-bottom-color: #3a3a3e !important; }
  .page.dark-mode .flow-arrow { color: #F7941D; }



  /* PREVIEW */
  .preview-area { flex: 1; overflow: auto; background: #1a1a1c; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .preview-area::-webkit-scrollbar { width: 6px; height: 6px; }
  .preview-area::-webkit-scrollbar-thumb { background: #0e0e10; border-radius: 3px; }

  /* PAGES */
  .page { background: var(--paper); width: 816px; min-width: 816px; min-height: 1056px; padding: 0; box-shadow: 0 4px 24px rgba(0,0,0,0.4); flex-shrink: 0; display: flex; flex-direction: column; }
  .page-inner { padding: 28px 36px 24px; flex: 1; display: flex; flex-direction: column; }
  .page-two { display: flex; flex-direction: column; }

  /* DCW cyan banner header */
  .page-banner { background: var(--accent); padding: 10px 36px 8px; display: flex; justify-content: space-between; align-items: center; }
  .adventure-title { font-family: 'JSL Blackletter', 'UnifrakturMaguntia', cursive; font-size: 26px; font-weight: 400; color: #f8f8f6; line-height: 1; letter-spacing: 0.04em; }
  .adventure-subtitle { font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 500; color: #aaaaaa; text-transform: uppercase; letter-spacing: 0.12em; margin-top: 3px; }
  .header-meta { text-align: right; font-family: 'Montserrat', sans-serif; font-size: 9px; color: rgba(255,255,255,0.85); line-height: 1.7; }
  .header-meta span { display: block; }

  /* Page bottom band */
  .page-bottom-band { background: var(--accent); height: 12px; margin-top: auto; }

  .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  /* Section labels - GMT style: bold condensed orange-red, underlined with orange */
  .sl { font-family: 'Old Newspaper', 'Montserrat', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #f8f8f6; background: #0a0a0a; padding: 3px 8px; margin-bottom: 6px; display: block; border-bottom: none; }
  .sl.dark { color: var(--ink); border-bottom-color: var(--ink); }
  .sl.sl-green { color: var(--green); border-bottom-color: var(--green); }
  .sl.gold { color: #7a5a00; border-bottom-color: #c89020; }

  .p-text { font-size: 9.5px; color: var(--ink); line-height: 1.65; font-family: 'Montserrat', sans-serif; }

  /* Read-aloud: cyan background */
  .read-aloud { background: #1a1a1a; border-left: 4px solid #e8c84a; padding: 8px 10px; margin-bottom: 6px; }
  .read-aloud p { color: #f4edd8; font-size: 9px; font-style: italic; line-height: 1.65; }

  /* Flavor text on stat blocks also cyan */
  .sb-flavor { font-size: 8.5px; font-style: italic; color: #f4edd8; background: #2a1a08; line-height: 1.5; margin-bottom: 7px; padding: 6px 8px; border: none; }

  /* NPC/mob blocks - grey-green GMT boxes */
  .npc-block { background: var(--box-bg); border: none; border-left: 4px solid var(--blue-npc); padding: 7px 9px; margin-bottom: 6px; }
  .mob-block { background: var(--box-bg); border: none; border-left: 4px solid var(--accent-red); padding: 7px 9px; margin-bottom: 6px; }
  .entry-name { font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; color: var(--ink); margin-bottom: 1px; }
  .entry-meta { font-family: 'Montserrat', sans-serif; font-size: 8px; color: var(--accent-dark); letter-spacing: 0.06em; margin-bottom: 4px; }
  .entry-desc { font-size: 9px; color: var(--ink); line-height: 1.55; }

  .location-block { margin-bottom: 9px; padding-bottom: 9px; border-bottom: 1px solid var(--rule); break-inside: avoid; column-break-inside: avoid; }
  .location-block:last-child { border-bottom: none; }
  .p-section { margin-bottom: 12px; break-inside: avoid; column-break-inside: avoid; }
  .loc-name { font-family: 'Old Newspaper', 'Montserrat', sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
  .loc-tag { font-family: 'Montserrat', sans-serif; font-size: 7.5px; color: var(--muted); letter-spacing: 0.08em; margin-bottom: 3px; }
  .loc-desc { font-size: 9px; color: var(--ink); line-height: 1.55; margin-top: 3px; }

  .clue-item { font-size: 9px; color: var(--ink); margin-bottom: 5px; padding: 4px 8px 4px 10px; border-left: 3px solid #0a0a0a; background: #fdf5e8; line-height: 1.5; }
  .hook-item { background: #fdf8ec; }
  .reward-stats { color: var(--ink); }
  .clue-hdr { font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--ink); }

  .p-footer { border-top: 2px solid var(--accent); margin-top: 14px; padding-top: 10px; }
  .flowchart { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 4px; }
  .flow-node { padding: 4px 7px; border-radius: 2px; text-align: center; flex: 1 1 auto; min-width: 64px; max-width: 100%; }
  .flow-label { font-family: 'Montserrat', sans-serif; font-size: 7px; letter-spacing: 0.08em; overflow-wrap: anywhere; }
  .flow-name { font-family: 'Montserrat', sans-serif; font-size: 9px; font-weight: 600; text-transform: uppercase; }
  .flow-arrow { color: var(--accent); font-size: 11px; font-weight: 700; }

  .map-container { margin-bottom: 14px; }
  .map-container img { max-width: 100%; max-height: 860px; height: auto; display: block; margin: 0 auto; border: 2px solid var(--accent); }
  .map-placeholder { width: 100%; height: 280px; background: var(--box-bg); border: 2px dashed var(--accent); display: flex; align-items: center; justify-content: center; font-family: 'Montserrat', sans-serif; font-size: 10px; color: var(--accent); letter-spacing: 0.08em; margin-bottom: 14px; }

  /* Stat blocks - GMT grey-green boxes with dark header rows */
  /* D&D 5e Stat Blocks */
  .statblocks { display: flex; gap: 12px; flex-wrap: wrap; }
  .stat-block { background: var(--box-bg); border: 1px solid var(--rule); border-top: 3px solid #0a0a0a; padding: 10px 12px; width: calc(50% - 6px); flex: 0 0 calc(50% - 6px); }
  .stat-block.full-width { width: 100%; flex: 0 0 100%; }
  .sb-name { font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink); border-bottom: 1.5px solid #0a0a0a; padding-bottom: 3px; margin-bottom: 2px; }
  .sb-type { font-family: 'Montserrat', sans-serif; font-size: 9.5px; font-style: italic; color: var(--muted); margin-bottom: 5px; }
  .sb-stat-line { font-size: 9px; color: var(--ink); margin-bottom: 3px; line-height: 1.45; font-family: 'Montserrat', sans-serif; }
  .sb-stat-line strong { font-weight: 700; font-family: 'Montserrat', sans-serif; font-size: 7.5px; letter-spacing: 0.04em; }
  .sb-divider { border: none; border-top: 1px solid var(--accent-red); margin: 5px 0; }
  .sb-score-table { width: 100%; border-collapse: collapse; margin: 4px 0 5px; }
  .sb-score-table th { font-family: 'Montserrat', sans-serif; font-size: 8px; font-weight: 700; color: #0a0a0a; font-weight: 700; text-align: center; padding: 2px; background: none; border: none; }
  .sb-score-table td { font-family: 'Montserrat', sans-serif; font-size: 9px; text-align: center; color: var(--ink); border: none; padding: 1px 2px; }
  .sb-section-label { font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 700; color: var(--accent-red); border-bottom: 1.5px solid #0a0a0a; display: block; margin: 6px 0 4px; padding-bottom: 1px; }
  .sb-ability { font-size: 9px; color: var(--ink); margin-bottom: 4px; line-height: 1.5; font-family: 'Montserrat', sans-serif; }
  .sb-ability strong { font-style: italic; }
  .sb-flavor { font-size: 9px; font-style: italic; color: #f4f4f2; line-height: 1.5; margin-bottom: 5px; font-family: 'Montserrat', sans-serif; }
  .sb-warning { background: rgba(255,255,255,0.5); border-left: 3px solid var(--blue-npc); padding: 4px 8px; font-size: 8px; color: var(--blue-npc); margin-bottom: 6px; }
  .sb-notes { font-size: 8.5px; color: var(--ink); line-height: 1.6; column-count: 2; column-gap: 16px; font-family: 'Montserrat', sans-serif; }
  .sb-hp-row { display: none; }
  .hp-pip { display: none; }
  .sb-table { display: none; }
  .p2-footer { border-top: 2px solid var(--accent); margin-top: 14px; padding-top: 6px; display: flex; justify-content: space-between; }
  .p2-footer p { font-family: 'Montserrat', sans-serif; font-size: 7.5px; color: var(--muted); letter-spacing: 0.08em; }

  /* Fixed letter-size pages */
  .page { height: 1056px; max-height: 1056px; overflow: hidden; }
  .page-inner { overflow: hidden; flex: 1; min-height: 0; padding: 20px 36px 16px; }
  .page-banner { flex-shrink: 0; }
  .page-bottom-band { flex-shrink: 0; margin-top: 0; }
  /* Continuation pages added by pagination engine */
  .page-cont { margin-top: 20px; }
  .page-cont .page-inner { overflow: hidden; flex: 1; min-height: 0; padding: 20px 36px 16px; }

  /* Bestiary search (Load Monster) — always visible inside the stat block card
     in the sidebar. There's no open/closed panel state: only the results list
     appears and disappears, so there is nothing that can get stuck open. */
  .mon-pick { margin-top: 2px; }
  .mon-pick-row { display: flex; gap: 4px; align-items: stretch; }
  .mon-pick-search { flex: 1 1 auto; min-width: 0; background: var(--ui-bg); border: 1px solid var(--ui-border); border-radius: 3px; color: var(--ui-text); font-family: 'Montserrat', sans-serif; font-size: 11px; padding: 5px 7px; outline: none; }
  .mon-pick-search:focus { border-color: var(--ui-accent); }
  .mon-pick-type { flex: 0 0 88px; min-width: 0; background: var(--ui-bg); border: 1px solid var(--ui-border); border-radius: 3px; color: var(--ui-text); font-family: 'Montserrat', sans-serif; font-size: 10px; padding: 5px 3px; outline: none; }
  .mon-pick-go { flex: 0 0 auto; background: var(--ui-bg); border: 1px solid var(--ui-border); border-radius: 3px; color: var(--ui-text); font-family: 'Montserrat', sans-serif; font-size: 10px; letter-spacing: 0.04em; padding: 5px 8px; cursor: pointer; white-space: nowrap; }
  .mon-pick-go:hover { border-color: var(--ui-accent); color: var(--ui-accent); }
  /* Hidden until there is something to show; scrolls rather than truncating. */
  .mon-pick-list { display: none; max-height: 260px; overflow-y: auto; margin-top: 5px; border: 1px solid var(--ui-border); border-radius: 3px; background: var(--ui-panel); }
  .mon-pick-list.show { display: block; }
  /* Roomy rows: 300 names in a narrow column need air and a visible boundary,
     otherwise they read as one block of text. Zebra striping does most of the
     work — the border alone is too low-contrast at this palette. */
  .mon-pick-item { display: block; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--ui-border); color: var(--ui-text); font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 500; line-height: 1.4; letter-spacing: 0.02em; padding: 9px 11px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mon-pick-item:nth-child(even) { background: rgba(255, 255, 255, 0.03); }
  .mon-pick-item:last-child { border-bottom: none; }
  .mon-pick-item:hover, .mon-pick-item:focus { background: var(--ui-border); color: var(--ui-accent); outline: none; }
  .mon-pick-item.hb { color: var(--ui-accent); }
  .mon-pick-empty { font-family: 'Montserrat', sans-serif; font-size: 10px; color: var(--ui-muted); font-style: italic; padding: 8px 7px; }

@media (max-width: 768px) {
  /* Stack layout */
  body { flex-direction: column; height: 100vh; overflow: hidden; }


  /* Sidebar: full-screen overlay when open */
  .sidebar {
    position: fixed !important;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100vw !important; min-width: 100vw !important;
    height: 100vh !important;
    z-index: 200;
    border-right: none;
    transform: translateY(0);
    transition: transform 0.25s ease;
    overflow-y: auto;
  }
  .sidebar.collapsed {
    transform: translateY(-100%) !important;
    width: 100vw !important; min-width: 100vw !important;
  }

  /* Preview: fills the whole screen when sidebar is collapsed */
  .preview-area {
    flex: 1;
    width: 100%;
    overflow: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Pages: scale down to fit mobile screen width */
  /* Pages reflow to a single fluid column on mobile via body.flow-mode
     (see the flow-mode block below); no fixed-page scaling here anymore. */

  /* Pull-tab on mobile: small pill, always visible, JS moves it */
  .sidebar-pull-tab {
    position: fixed !important;
    left: 50% !important;
    transform: translateX(-50%) !important;
    width: 80px !important;
    height: 28px !important;
    border-radius: 14px !important;
    z-index: 400 !important;
    font-size: 14px !important;
    /* top/bottom set by JS */
    transition: top 0.25s ease, bottom 0.25s ease !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4) !important;
  }

  .sidebar-footer { flex-wrap: wrap; }
  .btn-add, .btn-primary, .btn-secondary { min-height: 40px; font-size: 12px !important; }
}

/* ── FLOW MODE ─────────────────────────────────────────────────────────────
   A screen-first, single-column rendering of the same content. It's toggled on
   the body element by a small script (below the markup) whenever the viewport is narrow
   (editing on a phone) or the page is embedded read-only (?view=preview, e.g.
   the GM Screen's Adventure pane). It deliberately unwinds every fixed-page and
   two-column rule so the content reflows to the available width and scrolls
   naturally. The PDF/HTML export path is untouched: it re-inlines its own fixed
   816x1056 CSS and always renders the paginated pages, so print output is
   identical regardless of what mode the preview is in. */
body.flow-mode .preview-area {
  align-items: stretch;
  padding: 0;
  gap: 0;
  background: var(--paper);
}
body.flow-mode .page {
  width: 100% !important;
  min-width: 0 !important;
  height: auto !important;
  min-height: 0 !important;
  max-height: none !important;
  overflow: visible !important;
  transform: none !important;
  margin: 0 0 0 0 !important;
  box-shadow: none !important;
}
/* Continuation pages are a paged-layout artefact; hide them in flow mode so the
   content isn't duplicated (the originals below already hold everything). */
body.flow-mode .page-cont { display: none !important; }
body.flow-mode .page-inner {
  height: auto !important;
  min-height: 0 !important;
  overflow: visible !important;
  padding: 16px 18px 20px !important;
}
/* Page 1: the two explicit columns stack. */
body.flow-mode #p1-columns { display: block !important; overflow: visible !important; }
body.flow-mode #p1-left,
body.flow-mode #p1-right {
  overflow: visible !important;
  min-width: 0 !important;
  width: 100% !important;
}
/* Page 2 encounters: CSS multi-column collapses to one. */
body.flow-mode #p-locations {
  column-count: 1 !important;
  height: auto !important;
  min-height: 0 !important;
  overflow: visible !important;
}
/* Stat-block "notes" mini-columns also collapse for readability. */
body.flow-mode .sb-notes { column-count: 1 !important; }
/* Un-hide anything the pagination pass may have tucked away, since we're not
   paginating in flow mode. */
body.flow-mode [data-paginated-hidden] { display: revert !important; }
/* A light divider between the logical pages so the sections stay legible when
   they're all stacked in one ribbon. */
body.flow-mode .page + .page {
  border-top: 3px solid var(--accent);
}
</style>

<script>
const DEFAULT_STATE = {
  darkMode:false,
  title:'', subtitle:'', floor:'', session:'', players:'', duration:'',
  overview:'', mappath:'', maps:[],
  randenc:[], clues:[], rewards:[], strongopen:[], locations:[], statblocks:[]
};
let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
let saveTimer = null;

function loadState() {
  var saved = null;
  if (window.__ddState !== undefined) {
    // Deck mode: only use server state; a new document starts empty
    saved = window.__ddState['sd_session'] || null;
  } else {
    // Standalone mode: use localStorage
    saved = localStorage.getItem('dcw_builder_v5');
  }
  if (saved) try { state = {...DEFAULT_STATE,...JSON.parse(saved)}; } catch(e){}
  // Drop placeholder sources left behind by older stripped saves
  if (state.mappath === '__has_map__') state.mappath = '';
  state.maps = (state.maps||[]).filter(m => m && m.src && m.src !== '__has_map__');
}
let _lastSavedFull = null;
function saveState() {
  // Server gets the real state, images and all, so maps survive a reload.
  // localStorage only gets a stripped copy — base64 maps blow its ~5MB quota.
  const full = JSON.stringify(state);
  // Unchanged since the last save (common for the visibilitychange / link-click
  // exit saves) — skip the second stringify, the localStorage write and the
  // network PATCH entirely.
  if (full === _lastSavedFull) return;
  _lastSavedFull = full;
  const stripped = JSON.stringify({...state, mappath:state.mappath?'__has_map__':'', maps:(state.maps||[]).map(m=>({...m,src:m.src?'__has_map__':''}))});
  try { localStorage.setItem('dcw_builder_v5', stripped); } catch(e) {}
  if (window.__ddSave) window.__ddSave({ 'sd_session': full });
  syncDocTitle();
  const ind = document.getElementById('save-indicator');
  ind.textContent='Saved ✓'; ind.classList.add('saved');
  setTimeout(()=>{ ind.textContent='All changes saved'; ind.classList.remove('saved'); },1500);
}

// Rename the document on the desk to match the Adventure Title, so the card on
// the main page is titled correctly when you head back there.
function syncDocTitle() {
  const t = (document.getElementById('f-title')?.value || state.title || '').trim();
  if (t && window.__ddSaveTitle) window.__ddSaveTitle(t);
}

// ── SAVE ON EXIT / BACKGROUND ──
function saveOnExit() {
  try { readFields(); saveState(); } catch(e) {}
}
window.addEventListener('beforeunload', saveOnExit);
window.addEventListener('pagehide', saveOnExit);
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'hidden') saveOnExit();
});
// Leaving via the "← Home" link (or any link out) saves first
document.addEventListener('click', function(e) {
  const a = e.target.closest && e.target.closest('a[href]');
  if (a && !a.target && !a.href.startsWith('javascript:')) saveOnExit();
}, true);
// Debounced: while typing, the full preview rebuild (readFields + renderPreview
// + pagination) runs once ~150ms after the last change instead of on every
// keystroke. renderNow() flushes a pending rebuild for anything that needs the
// preview current immediately (e.g. the PDF export).
let renderTimer = null;
function renderNow() { clearTimeout(renderTimer); renderTimer = null; readFields(); renderPreview(); }
function autosave() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(renderNow, 150);
  clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 600);
}

// ── PAGINATION ENGINE ──
// ── FLOW MODE CONTROLLER ────────────────────────────────────────────────────
// Flow mode = the single-column, screen-width rendering (see the CSS block).
// It's on when the viewport is narrow (editing on a phone) OR the page is served
// read-only for embedding (?view=preview injects <style id="dd-preview-style">,
// which is our signal — the GM Screen's Adventure pane loads it at a fixed 900px
// logical width, so a viewport media query alone wouldn't catch it).
// Flow mode can be driven three ways, in priority order:
//   1. An explicit instruction from an embedding parent (the GM Screen's
//      Adventure pane) via postMessage — it knows the real pane width and picks
//      single vs two-column per view. `_flowOverride` holds true/false/null.
//   2. Direct phone-width editing (the builder open on its own on a narrow
//      screen) — matchMedia.
// When embedded read-only (?view=preview) but before any parent instruction
// arrives, default to the two-column fixed layout (null override, wide-enough
// assumption) so a single/split/focus pane isn't briefly single-column.
let _flowOverride = null;
function _flowWanted() {
  if (_flowOverride !== null) return _flowOverride;                 // parent decides
  if (document.getElementById('dd-preview-style')) return false;   // embedded: wait for parent, assume wide
  return window.matchMedia('(max-width: 820px)').matches;          // phone-width editing
}
function applyFlowMode() {
  const on = _flowWanted();
  document.body.classList.toggle('flow-mode', on);
  return on;
}
// React to rotation / resize (and to the pane resizing, in the embedded case).
window.addEventListener('resize', () => {
  const was = document.body.classList.contains('flow-mode');
  const now = applyFlowMode();
  // Crossing the boundary changes which layout is correct, so re-render to
  // (de)paginate for the new mode.
  if (was !== now && typeof renderPreview === 'function') renderPreview();
});
// Embedding parent (GM Screen) tells us which column layout its pane wants.
window.addEventListener('message', (e) => {
  const d = e && e.data;
  if (!d || d.type !== 'dd-flow') return;
  const want = !!d.flow;
  if (_flowOverride === want) return;
  _flowOverride = want;
  const was = document.body.classList.contains('flow-mode');
  const now = applyFlowMode();
  if (was !== now && typeof renderPreview === 'function') renderPreview();
});

function paginatePages() {
  // Always clear prior pagination artefacts first so switching modes is clean.
  document.querySelectorAll('.page-cont').forEach(p=>p.remove());
  document.querySelectorAll('[data-paginated-hidden]').forEach(el=>{
    el.style.display=''; el.removeAttribute('data-paginated-hidden');
  });

  // In flow mode the content is presented as one fluid, unclipped column, so the
  // fixed-page pagination is skipped entirely. Export/PDF force fixed mode first
  // (see exportHTML/savePDF), so print output is unaffected.
  if (document.body.classList.contains('flow-mode')) return;

  const isDark = document.getElementById('page-one').classList.contains('dark-mode');
  const PAGE_TOTAL = 1056;
  const BANNER_H   = document.querySelector('.page-banner')?.offsetHeight || 52;
  const BAND_H     = 12;
  const PADDING_V  = 40;
  const FOOTER_H   = document.querySelector('.p-footer')?.offsetHeight || 44;
  const USABLE_H   = PAGE_TOTAL - BANNER_H - BAND_H - PADDING_V - 20;
  const COL_H      = USABLE_H - FOOTER_H;

  // PAGE 1: two explicit divs — re-distribute if right column overflows
  const leftEl  = document.getElementById('p1-left');
  const rightEl = document.getElementById('p1-right');
  if(leftEl && rightEl) {
    // Check if right column overflows
    const rightItems = [...rightEl.children].filter(c=>c.offsetHeight>0);
    if(rightItems.length) {
      let rightH = rightItems.reduce((s,c)=>s+c.offsetHeight+getMargin(c),0);
      if(rightH > COL_H) {
        // Find what fits in right column and move rest to continuation page
        const buckets = [[]];
        let cur=0;
        rightItems.forEach(k=>{
          const h=k.offsetHeight+getMargin(k);
          if(cur+h>COL_H && buckets[buckets.length-1].length>0){buckets.push([]);cur=0;}
          buckets[buckets.length-1].push(k); cur+=h;
        });
        if(buckets.length>1){
          const keep=new Set(buckets[0]);
          rightItems.forEach(k=>{if(!keep.has(k)){k.style.display='none';k.setAttribute('data-paginated-hidden','1');}});
          let after=document.getElementById('page-one');
          // Each bucket is one column's worth, so a continuation page takes TWO
          // buckets: the first fills its left column, the second its right.
          for(let i=1;i<buckets.length;i+=2){
            const cp=buildContinuationPage(document.getElementById('page-one'),'p1'+i,isDark,false);
            const cc=cp.querySelector('.cont-container');
            cc.style.cssText='display:flex;gap:14px;flex:1;min-height:0;overflow:hidden;';
            const cLeft=document.createElement('div'); cLeft.style.cssText='flex:1;min-width:0;overflow:hidden;';
            const cRight=document.createElement('div'); cRight.style.cssText='flex:1;min-width:0;overflow:hidden;';
            cc.appendChild(cLeft); cc.appendChild(cRight);
            const fill=(bucket,col)=>{ (bucket||[]).forEach(k=>{const cl=k.cloneNode(true);cl.style.display='';cl.removeAttribute('data-paginated-hidden');col.appendChild(cl);}); };
            fill(buckets[i], cLeft);
            fill(buckets[i+1], cRight);
            const fc=document.createElement('div');fc.className='p-footer';fc.style.flexShrink='0';
            fc.innerHTML='<div class="flowchart">'+(document.getElementById('p-flowchart')?.innerHTML||'')+'</div>';
            cp.querySelector('.page-inner').appendChild(fc);
            after.insertAdjacentElement('afterend',cp); after=cp;
          }
        }
      }
    }
  }

  // PAGE 2: Encounters (working - keep as-is)
  const locsEl=document.getElementById('p-locations');
  if(locsEl) runPagination(locsEl,COL_H*2,'p2',isDark,null,document.getElementById('page-two'),false);

  // PAGE 4: Stat blocks
  // Stat blocks render inline on the main pages; page-four pagination no longer needed

  // PAGE 3: Maps
  const mapsEl=document.getElementById('p-maps-container');
  if(mapsEl) runPagination(mapsEl,USABLE_H,'p3M',isDark,null,document.getElementById('page-three'),false);
}


function measureAndPaginateColumn(containerId, maxH, key, isDark, preview, sourcePage) {
  const container = document.getElementById(containerId);
  if(!container) return;

  const isTwoCol = (key === 'p1' || key === 'p2');
  const maxTotal = isTwoCol ? maxH * 2 : maxH;

  // Get children to measure
  const kids = [...container.children].filter(c => !c.getAttribute('data-paginated-hidden'));
  if(!kids.length) return;

  // Measure each child by temporarily making it position:absolute off-screen
  // inside the actual page so it inherits all CSS correctly
  const pageInner = sourcePage.querySelector('.page-inner');
  if(!pageInner) return;

  // Create a single-column measuring wrapper inside page-inner
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:absolute;visibility:hidden;top:-99999px;left:36px;right:36px;column-count:1;';
  pageInner.appendChild(wrap);
  kids.forEach(k => wrap.appendChild(k.cloneNode(true)));
  void wrap.offsetHeight;

  const heights = [...wrap.children].map(c => {
    const s = getComputedStyle(c);
    return c.offsetHeight + parseFloat(s.marginTop) + parseFloat(s.marginBottom);
  });
  const totalH = heights.reduce((a,b) => a+b, 0);
  pageInner.removeChild(wrap);

  if(totalH <= maxTotal) return;

  // Split into buckets
  const buckets = [[]];
  let cur = 0;
  kids.forEach((kid, i) => {
    const h = heights[i];
    if(cur + h > maxTotal && buckets[buckets.length-1].length > 0) {
      buckets.push([]);
      cur = 0;
    }
    buckets[buckets.length-1].push(kid);
    cur += h;
  });
  if(buckets.length <= 1) return;

  // Hide overflow from original
  const keep = new Set(buckets[0]);
  kids.forEach(k => {
    if(!keep.has(k)) { k.style.display='none'; k.setAttribute('data-paginated-hidden','1'); }
  });

  // Build continuation pages
  let after = sourcePage;
  for(let i=1; i<buckets.length; i++) {
    const cp = buildContinuationPage(sourcePage, key+i, isDark, false);
    const cc = cp.querySelector('.cont-container');
    if(isTwoCol) {
      cc.style.cssText = 'column-count:2;column-gap:14px;column-fill:auto;flex:1;min-height:0;height:'+maxH+'px;overflow:hidden;';
    } else {
      cc.style.cssText = 'flex:1;min-height:0;overflow:hidden;';
    }
    buckets[i].forEach(k => {
      const cl = k.cloneNode(true);
      cl.style.display = '';
      cl.removeAttribute('data-paginated-hidden');
      cc.appendChild(cl);
    });
    if(key==='p1'||key==='p2') {
      const fcId = key==='p1'?'p-flowchart':'p-flowchart-2';
      const fc = document.createElement('div');
      fc.className='p-footer'; fc.style.flexShrink='0';
      fc.innerHTML='<div class="flowchart">'+(document.getElementById(fcId)?.innerHTML||'')+'</div>';
      cp.querySelector('.page-inner').appendChild(fc);
    }
    cp.querySelectorAll('.sb-hp-row').forEach(row=>{
      const pips=row.querySelectorAll('.hp-pip');const tot=pips.length;
      pips.forEach((pip,i)=>{
        const t=tot===1?1:i/(tot-1);let r,g,b=10;
        if(t<0.33){const s=t/0.33;r=170;g=Math.round(50*s);}
        else if(t<0.66){const s=(t-0.33)/0.33;r=170;g=Math.round(50+100*s);}
        else{const s=(t-0.66)/0.34;r=Math.round(170*(1-s));g=160;}
        pip.style.background=`rgb(${r},${g},${b})`;pip.style.borderColor='rgba(0,0,0,0.3)';
      });
    });
    after.insertAdjacentElement('afterend', cp);
    after = cp;
  }
}


// For CSS column containers: measure with column:1 unconstrained, then paginate.
// Called AFTER caller has already reset height/overflow/columnCount to unconstrained state.
function runColumnPagination(container, maxColH, key, isDark, preview, sourcePage) {
  if(!container) return;
  const children = [...container.children].filter(c=>c.offsetHeight>0);
  if(!children.length) return;

  // Total height with single column (already set by caller)
  const totalH = children.reduce((sum,c)=>sum+c.offsetHeight+getMargin(c),0);
  const maxTotal = maxColH * 2;
  if(totalH <= maxTotal) return;

  // Split into page buckets: each bucket fills up to 2 columns (maxColH * 2)
  const buckets = [[]];
  let currentH = 0;
  for(const child of children) {
    const h = child.offsetHeight + getMargin(child);
    if(currentH + h > maxTotal && buckets[buckets.length-1].length > 0) {
      buckets.push([]);
      currentH = 0;
    }
    buckets[buckets.length-1].push(child);
    currentH += h;
  }
  if(buckets.length <= 1) return;

  // Hide overflow items from original container
  const keepSet = new Set(buckets[0]);
  children.forEach(c => {
    if(!keepSet.has(c)){
      c.style.display='none';
      c.setAttribute('data-paginated-hidden','1');
    }
  });

  // Build continuation pages for overflow buckets
  let insertAfter = sourcePage;
  for(let i=1; i<buckets.length; i++) {
    const contPage = buildContinuationPage(sourcePage, key+i, isDark, false);
    const contContainer = contPage.querySelector('.cont-container');
    contContainer.style.columnCount = '2';
    contContainer.style.columnGap = '14px';
    contContainer.style.columnFill = 'auto';
    contContainer.style.flex = '1';
    contContainer.style.minHeight = '0';
    contContainer.style.height = maxColH + 'px';
    contContainer.style.overflow = 'hidden';

    buckets[i].forEach(item=>{
      const clone = item.cloneNode(true);
      clone.style.display='';
      clone.removeAttribute('data-paginated-hidden');
      contContainer.appendChild(clone);
    });

    // Add flowchart footer to overview (p1) and encounter (p2) continuation pages
    if(key==='p1' || key==='p2') {
      const fcSourceId = key==='p1' ? 'p-flowchart' : 'p-flowchart-2';
      const fc = document.createElement('div');
      fc.className = 'p-footer';
      fc.style.flexShrink = '0';
      fc.innerHTML = '<div class="flowchart">'+(document.getElementById(fcSourceId)?.innerHTML||'')+'</div>';
      contPage.querySelector('.page-inner').appendChild(fc);
    }

    insertAfter.insertAdjacentElement('afterend', contPage);
    insertAfter = contPage;
  }
}

function runPagination(container, maxH, key, isDark, preview, sourcePage, isPage2) {
  if(!container) return;
  const children = [...container.children].filter(c=>c.offsetHeight > 0);
  if(!children.length) return;

  // Measure total height of all visible children
  const totalH = children.reduce((sum, c) => sum + c.offsetHeight + getMargin(c), 0);
  if(totalH <= maxH) return; // No overflow, nothing to do

  // Split children into page buckets
  const buckets = [[]];
  let currentH = 0;

  for(const child of children) {
    const h = child.offsetHeight + getMargin(child);
    if(currentH + h > maxH && buckets[buckets.length-1].length > 0) {
      buckets.push([]);
      currentH = 0;
    }
    buckets[buckets.length-1].push(child);
    currentH += h;
  }

  if(buckets.length <= 1) return;

  // Hide overflow items from original container
  const keepItems = new Set(buckets[0]);
  children.forEach(c => {
    if(!keepItems.has(c)) {
      c.style.display = 'none';
      c.setAttribute('data-paginated-hidden', '1');
    }
  });

  // Build a continuation page for each overflow bucket
  let insertAfter = sourcePage;
  for(let i = 1; i < buckets.length; i++) {
    const contPage = buildContinuationPage(sourcePage, key+i, isDark, isPage2);
    const contContainer = contPage.querySelector('.cont-container');

    buckets[i].forEach(item => {
      const clone = item.cloneNode(true);
      clone.style.display = '';
      clone.removeAttribute('data-paginated-hidden');
      contContainer.appendChild(clone);
    });

    insertAfter.insertAdjacentElement('afterend', contPage);
    insertAfter = contPage;

    // Re-apply HP gradients
    contPage.querySelectorAll('.sb-hp-row').forEach(row => {
      const pips=row.querySelectorAll('.hp-pip');const total=pips.length;
      pips.forEach((pip,i)=>{
        const t=total===1?1:i/(total-1);let r,g,b=10;
        if(t<0.33){const s=t/0.33;r=170;g=Math.round(50*s);}
        else if(t<0.66){const s=(t-0.33)/0.33;r=170;g=Math.round(50+100*s);}
        else{const s=(t-0.66)/0.34;r=Math.round(170*(1-s));g=160;}
        pip.style.background=`rgb(${r},${g},${b})`;pip.style.borderColor='rgba(0,0,0,0.3)';
      });
    });
  }
}

function getMargin(el) {
  const style = window.getComputedStyle(el);
  return parseInt(style.marginTop||0) + parseInt(style.marginBottom||0);
}

function buildContinuationPage(sourcePage, key, isDark, isPage2) {
  const page = document.createElement('div');
  page.className = 'page page-cont' + (isDark?' dark-mode':'') + (isPage2?' page-two':'');
  page.setAttribute('data-key', key);

  // Clone banner
  const banner = sourcePage.querySelector('.page-banner').cloneNode(true);
  const sub = banner.querySelector('.adventure-subtitle');
  if(sub) sub.textContent = (sub.textContent||'').replace(' (cont.)','') + ' (cont.)';
  // Remove IDs from cloned banner to avoid duplicates
  banner.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));
  page.appendChild(banner);

  // Inner area
  const inner = document.createElement('div');
  inner.className = 'page-inner';
  inner.style.overflow = 'hidden';
  const contContainer = document.createElement('div');
  contContainer.className = 'cont-container';
  inner.appendChild(contContainer);
  page.appendChild(inner);

  // Bottom band
  const band = document.createElement('div');
  band.className = 'page-bottom-band';
  page.appendChild(band);

  return page;
}

// Shrink an uploaded image to a sane size before we store it. Phone photos and
// VTT exports are often 4000px+, which bloats both the saved document and the
// exported PDF for no visible gain at print size.
const MAP_MAX_PX = 1600;
// Byte ceiling on the stored data URL: the old dimension-only guard let a
// detailed 1600px scan still weigh multiple MB, and that string rides inside
// every save. Quality steps down until it fits (or we accept the last try).
const MAP_MAX_CHARS = 600000;   // ~440KB of image data
// Registry of uploaded map images, keyed by card uid (see addMap).
const _MAPSRC = Object.create(null);
function downscaleImage(dataUrl) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, MAP_MAX_PX / Math.max(img.width, img.height));
      if(scale === 1 && dataUrl.length < MAP_MAX_CHARS) { resolve(dataUrl); return; }
      const c = document.createElement('canvas');
      c.width  = Math.round(img.width  * scale);
      c.height = Math.round(img.height * scale);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      try {
        let out = null;
        for (const q of [0.82, 0.7, 0.58, 0.48]) {
          out = c.toDataURL('image/jpeg', q);
          if (out.length <= MAP_MAX_CHARS) break;
        }
        resolve(out || dataUrl);
      }
      catch(err) { resolve(dataUrl); }
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

function handleMapFileUpload(input) {
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    const card = input.closest('.entity-card');
    const src = await downscaleImage(e.target.result);
    _MAPSRC[card.dataset.mapUid] = src;
    const lbl = card.querySelector('label');
    const status = card.querySelector('.map-img-status');
    lbl.textContent = 'Click to replace image';
    status.textContent = '✓ ' + file.name;
    status.style.color = '#4caf7d';
    // Collect maps into state and re-render
    state.maps = collectMaps();
    renderPreview();
    saveState();
  };
  reader.readAsDataURL(file);
}


function generateDungeonMap(numRooms, style) {
  const CELL = 48;
  const COLS = 22, ROWS = 16;
  const grid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
  // grid values: 0=wall, 1=corridor, 2=room

  // ── Nodes style: separate layout, early return ────────────────────────────
  if(style === 'nodes') {
    const W = COLS*CELL, H = ROWS*CELL;
    const rng = () => Math.random();
    const ri  = (a,b) => Math.floor(rng()*(b-a+1))+a;

    // Place nodes with tighter spacing in a cluster
    const nodes = [];
    const MIN_DIST = 90;   // minimum centre-to-centre distance
    const SPREAD = 280;    // how far from centre nodes can appear
    const cx = W/2, cy = H/2;

    // Entrance node near a random edge of the cluster
    const angle0 = rng() * Math.PI * 2;
    const ex = Math.round(cx + Math.cos(angle0) * (SPREAD * 0.7));
    const ey = Math.round(cy + Math.sin(angle0) * (SPREAD * 0.7));
    nodes.push({ x:ex, y:ey, r:ri(36,54), id:1, isEntrance:true });

    let attempts = 0;
    while(nodes.length < numRooms && attempts < numRooms*400) {
      attempts++;
      // Bias positions toward cluster centre
      const angle = rng() * Math.PI * 2;
      const dist  = rng() * SPREAD;
      const x = Math.round(cx + Math.cos(angle) * dist);
      const y = Math.round(cy + Math.sin(angle) * dist);
      const r = ri(24, 50);
      // Keep within canvas bounds
      if(x-r<10||x+r>W-10||y-r<10||y+r>H-10) continue;
      const tooClose = nodes.some(n => Math.hypot(n.x-x, n.y-y) < MIN_DIST);
      if(!tooClose) nodes.push({ x, y, r, id:nodes.length+1 });
    }

    // Build spanning tree connections
    const edges = [];
    const connected = new Set([0]);
    for(let i=1; i<nodes.length; i++) {
      const a = nodes[i];
      let best=0, bestD=Infinity;
      for(const ci of connected) {
        const b=nodes[ci], d=Math.hypot(a.x-b.x, a.y-b.y);
        if(d<bestD){bestD=d;best=ci;}
      }
      connected.add(i);
      edges.push([i, best]);
    }
    // Extra cross-connections between nearby nodes (~35% chance)
    for(let i=0; i<nodes.length; i++) {
      for(let j=i+2; j<nodes.length; j++) {
        const d=Math.hypot(nodes[i].x-nodes[j].x, nodes[i].y-nodes[j].y);
        if(d < MIN_DIST*2 && rng()<0.35) edges.push([i,j]);
      }
    }

    // ── Renumber nodes in BFS order from entrance so IDs follow a natural path ──
    // Build adjacency list from spanning tree edges only
    const adj = Array.from({length:nodes.length}, ()=>[]);
    for(const [ai,bi] of edges) {
      // Only use spanning tree edges (those where one endpoint was newly connected)
      adj[ai].push(bi);
      adj[bi].push(ai);
    }
    // BFS from node 0 (entrance)
    const visited = new Array(nodes.length).fill(false);
    const queue = [0];
    const bfsOrder = [];
    visited[0] = true;
    while(queue.length) {
      const cur = queue.shift();
      bfsOrder.push(cur);
      // Sort neighbours by distance to entrance for consistent left-to-right feel
      const neighbours = [...new Set(adj[cur])].filter(n=>!visited[n]);
      neighbours.sort((a,b) => {
        // Primary: clockwise angle from entrance
        const en = nodes[0];
        const angA = Math.atan2(nodes[a].y-en.y, nodes[a].x-en.x);
        const angB = Math.atan2(nodes[b].y-en.y, nodes[b].x-en.x);
        return angA - angB;
      });
      for(const n of neighbours) { visited[n]=true; queue.push(n); }
    }
    // Any nodes not reached (isolated, shouldn't happen) append at end
    for(let i=0;i<nodes.length;i++) if(!visited[i]) bfsOrder.push(i);
    // Apply sequential IDs in BFS order
    const newId = new Array(nodes.length);
    bfsOrder.forEach((origIdx, seq) => { newId[origIdx] = seq+1; });
    nodes.forEach((n,i) => { n.id = newId[i]; });

    // ── Center the cluster in the viewport ───────────────────────────────────
    if(nodes.length > 0) {
      const minX = Math.min(...nodes.map(n=>n.x-n.r));
      const maxX = Math.max(...nodes.map(n=>n.x+n.r));
      const minY = Math.min(...nodes.map(n=>n.y-n.r));
      const maxY = Math.max(...nodes.map(n=>n.y+n.r));
      const pad = 40;
      const offX = (W/2) - (minX+maxX)/2;
      const offY = (H/2) - (minY+maxY)/2;
      // Clamp so nothing goes out of bounds
      const clampX = Math.max(pad-minX-offX, Math.min(W-maxX-offX-pad, offX));
      const clampY = Math.max(pad-minY-offY, Math.min(H-maxY-offY-pad, offY));
      for(const n of nodes){ n.x+=clampX; n.y+=clampY; }
    }

    // Build SVG
    const parts = [];
    parts.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`);
    parts.push(`<rect width="${W}" height="${H}" fill="#12121a"/>`);

    // Connecting lines behind nodes
    for(const [ai,bi] of edges) {
      const a=nodes[ai], b=nodes[bi];
      parts.push(`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#4a4a6a" stroke-width="2.5" stroke-linecap="round"/>`);
    }

    // Nodes
    for(const node of nodes) {
      const fill   = node.isEntrance ? '#c8a84a' : '#2a2a4a';
      const stroke = node.isEntrance ? '#e8c86a' : '#6a6a9a';
      parts.push(`<circle cx="${node.x}" cy="${node.y}" r="${node.r}" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>`);
      parts.push(`<text x="${node.x}" y="${node.y+1}" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="monospace" font-weight="bold" font-size="${Math.max(10, node.r*0.55)}">${node.id}</text>`);
    }

    // Entrance dashed ring
    const en=nodes[0];
    parts.push(`<circle cx="${en.x}" cy="${en.y}" r="${en.r+10}" fill="none" stroke="#e8c86a" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7"/>`);

    // Legend
    const legY=H-18;
    parts.push(`<rect x="0" y="${legY-4}" width="${W}" height="22" fill="#12121a" opacity="0.9"/>`);
    parts.push(`<text x="8" y="${legY+10}" fill="white" font-family="monospace" font-size="11" opacity="0.9">Nodes · ${nodes.length} rooms</text>`);
    parts.push(`<text x="${W-8}" y="${legY+10}" text-anchor="end" fill="white" font-family="monospace" font-size="10" opacity="0.6">Dungeon Crawler's Companion</text>`);
    parts.push('</svg>');

    return { svg:parts.join(''), rooms:nodes.length, width:W, height:H };
  }

  // ── Standard grid-based styles below ────────────────────────────────────

  // ── Style palettes ────────────────────────────────────────────────────────
  const STYLES = {
    hud:       { wall:'#2a2a32', floor:'#c8c4b0', corridor:'#b0ac9a',
                 roomStroke:'#3a3a44', doorFill:'#1a1a22',
                 numBg:'rgba(26,26,34,0.75)', numFg:'#fff', title:'HUD' },
    parchment: { wall:'#888888', floor:'#EDE4D0', corridor:'#D5C9B0',
                 roomStroke:'#000000', doorFill:'#000000',
                 numBg:'rgba(0,0,0,0.82)', numFg:'#FFF6E9', title:'Dungeon' },
    cave:      { wall:'#1e2420', floor:'#8a9e82', corridor:'#7a8e72',
                 roomStroke:'#2a3a28', doorFill:'#0e1410',
                 numBg:'rgba(14,20,16,0.8)', numFg:'#d0e8d0', title:'Cave' },
  };
  const S = STYLES[style] || STYLES.parchment;

  // ── Room placement ────────────────────────────────────────────────────────
  const rooms = [];
  const rng = () => Math.random();
  const ri = (a,b) => Math.floor(rng()*(b-a+1))+a;

  function markRoom(r) {
    for(let row=r.y; row<r.y+r.h; row++)
      for(let col=r.x; col<r.x+r.w; col++)
        if(row>=0&&row<ROWS&&col>=0&&col<COLS) grid[row][col]=2;
  }
  function overlapsAny(r, pad) {
    for(const ex of rooms) {
      if(r.x-pad < ex.x+ex.w+pad && r.x+r.w+pad > ex.x-pad &&
         r.y-pad < ex.y+ex.h+pad && r.y+r.h+pad > ex.y-pad) return true;
    }
    return false;
  }

  // Entrance: random position on any of the 4 edges
  const eW = ri(3,5), eH = ri(3,4);
  const edge = ri(0,3); // 0=top, 1=right, 2=bottom, 3=left
  const eX = edge===1 ? COLS-eW-1 : edge===3 ? 1 : ri(1, COLS-eW-2);
  const eY = edge===2 ? ROWS-eH-1 : edge===0 ? 1 : ri(1, ROWS-eH-2);
  const entrance = { x:eX, y:eY, w:eW, h:eH, id:1, isEntrance:true, edge };
  rooms.push(entrance);
  markRoom(entrance);

  // Place remaining rooms — retry with shrinking sizes if needed
  let attempts = 0, maxAttempts = numRooms * 200;
  while(rooms.length < numRooms && attempts < maxAttempts) {
    attempts++;
    // Start with larger rooms, shrink to tiny if stuck
    const progress = attempts / maxAttempts;
    const maxW = Math.max(2, Math.floor(6 - progress*3));
    const maxH = Math.max(2, Math.floor(5 - progress*2));
    const w = ri(2, maxW), h = ri(2, maxH);
    const x = ri(1, COLS-w-2), y = ri(1, ROWS-h-2);
    const pad = progress < 0.5 ? 1 : 0;
    if(!overlapsAny({x,y,w,h}, pad)) {
      rooms.push({x,y,w,h,id:rooms.length+1});
      markRoom({x,y,w,h});
    }
  }

  // ── Corridor routing ──────────────────────────────────────────────────────
  function cx(r){ return Math.floor(r.x + r.w/2); }
  function cy(r){ return Math.floor(r.y + r.h/2); }
  function setCorr(row,col) {
    if(row>=0&&row<ROWS&&col>=0&&col<COLS&&grid[row][col]===0) grid[row][col]=1;
  }
  function carve(a, b) {
    let ax=cx(a), ay=cy(a), bx=cx(b), by=cy(b);
    if(rng()>0.5) {
      for(let x=Math.min(ax,bx);x<=Math.max(ax,bx);x++) setCorr(ay,x);
      for(let y=Math.min(ay,by);y<=Math.max(ay,by);y++) setCorr(y,bx);
    } else {
      for(let y=Math.min(ay,by);y<=Math.max(ay,by);y++) setCorr(y,ax);
      for(let x=Math.min(ax,bx);x<=Math.max(ax,bx);x++) setCorr(by,x);
    }
  }

  const connected = new Set([0]);
  const treeAdj = Array.from({length:rooms.length}, ()=>[]); // adjacency for BFS
  for(let i=1;i<rooms.length;i++) {
    const a = rooms[i];
    let best=0, bestD=Infinity;
    for(const ci of connected) {
      const b=rooms[ci], d=Math.abs(cx(a)-cx(b))+Math.abs(cy(a)-cy(b));
      if(d<bestD){bestD=d;best=ci;}
    }
    connected.add(i);
    treeAdj[i].push(best);
    treeAdj[best].push(i);
    carve(rooms[i], rooms[best]);
  }

  // ── Renumber rooms via BFS from entrance so IDs follow a natural path ────
  {
    const visited = new Array(rooms.length).fill(false);
    const queue = [0];
    const bfsOrder = [];
    visited[0] = true;
    while(queue.length) {
      const cur = queue.shift();
      bfsOrder.push(cur);
      // Sort neighbours by distance from entrance room centre for consistent flow
      const ecx = cx(rooms[0]), ecy = cy(rooms[0]);
      const neighbours = treeAdj[cur].filter(n=>!visited[n]);
      neighbours.sort((a,b)=>{
        // Sort by angle from entrance centre so numbering sweeps predictably
        const angA = Math.atan2(cy(rooms[a])-ecy, cx(rooms[a])-ecx);
        const angB = Math.atan2(cy(rooms[b])-ecy, cx(rooms[b])-ecx);
        return angA - angB;
      });
      for(const n of neighbours){ visited[n]=true; queue.push(n); }
    }
    // Any disconnected rooms appended last (shouldn't happen)
    for(let i=0;i<rooms.length;i++) if(!visited[i]) bfsOrder.push(i);
    // Apply sequential IDs in BFS order
    const newId = new Array(rooms.length);
    bfsOrder.forEach((origIdx, seq) => { newId[origIdx] = seq+1; });
    rooms.forEach((r,i) => { r.id = newId[i]; });
  }

  // ── Find door positions: corridor cells touching room boundary ────────────
  // A door is at the exact wall between a corridor cell and an adjacent room cell.
  const doorSegs = []; // [{x1,y1,x2,y2}] in pixel coords
  const doorPlaced = new Set();
  for(let r=0;r<ROWS;r++) {
    for(let c=0;c<COLS;c++) {
      if(grid[r][c]!==1) continue; // only corridor cells
      // Check all 4 neighbours for a room cell
      const neighbors = [[r-1,c],[r+1,c],[r,c-1],[r,c+1]];
      for(const [nr,nc] of neighbors) {
        if(nr<0||nr>=ROWS||nc<0||nc>=COLS) continue;
        if(grid[nr][nc]!==2) continue;
        // This corridor cell touches a room — place door at the shared wall
        const key = `${Math.min(r,nr)},${Math.min(c,nc)},${Math.max(r,nr)},${Math.max(c,nc)}`;
        if(doorPlaced.has(key)) continue;
        doorPlaced.add(key);
        // Only place door with ~70% chance per junction
        if(rng()<0.3) continue;
        // The shared wall is between (r,c) and (nr,nc)
        if(nr===r-1||nr===r+1) {
          // Vertical adjacency: shared wall is horizontal line between rows
          const wallY = Math.max(r,nr)*CELL; // top of the lower cell
          const wallX = c*CELL;
          // Door = thin horizontal bar across the corridor width
          doorSegs.push({x1:wallX+CELL*0.15, y1:wallY-3, x2:wallX+CELL*0.85, y2:wallY+3});
        } else {
          // Horizontal adjacency: shared wall is vertical line between cols
          const wallX = Math.max(c,nc)*CELL;
          const wallY = r*CELL;
          doorSegs.push({x1:wallX-3, y1:wallY+CELL*0.15, x2:wallX+3, y2:wallY+CELL*0.85});
        }
      }
    }
  }

  // ── Build SVG ────────────────────────────────────────────────────────────
  const W=COLS*CELL, H=ROWS*CELL;
  const parts=[];
  parts.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`);
  parts.push(`<rect width="${W}" height="${H}" fill="${S.wall}"/>`);

  // Draw floor cells
  for(let r=0;r<ROWS;r++) {
    for(let c=0;c<COLS;c++) {
      if(grid[r][c]===0) continue;
      const fill = grid[r][c]===1 ? S.corridor : S.floor;
      parts.push(`<rect x="${c*CELL}" y="${r*CELL}" width="${CELL}" height="${CELL}" fill="${fill}"/>`);
    }
  }

  // Room outlines
  for(const room of rooms) {
    const rx=room.x*CELL, ry=room.y*CELL, rw=room.w*CELL, rh=room.h*CELL;
    if(style==='cave') {
      parts.push(`<rect x="${rx+2}" y="${ry+2}" width="${rw-4}" height="${rh-4}" fill="none" stroke="${S.roomStroke}" stroke-width="2" rx="10"/>`);
    } else {
      // HUD and Dungeon/Parchment: solid rectangle outline
      parts.push(`<rect x="${rx}" y="${ry}" width="${rw}" height="${rh}" fill="none" stroke="${S.roomStroke}" stroke-width="2"/>`);
    }
  }

  // Draw doors — thin filled rectangles straddling the wall line
  for(const d of doorSegs) {
    parts.push(`<rect x="${Math.min(d.x1,d.x2)}" y="${Math.min(d.y1,d.y2)}" width="${Math.abs(d.x2-d.x1)}" height="${Math.abs(d.y2-d.y1)}" fill="${S.doorFill}" rx="1"/>`);
  }

  // Room numbers
  for(const room of rooms) {
    const rx=room.x*CELL, ry=room.y*CELL, rw=room.w*CELL, rh=room.h*CELL;
    const numX=rx+rw/2, numY=ry+rh/2;
    const circR=Math.max(10, Math.min(rw,rh)*0.2);
    parts.push(`<circle cx="${numX}" cy="${numY}" r="${circR}" fill="${S.numBg}"/>`);
    parts.push(`<text x="${numX}" y="${numY+1}" text-anchor="middle" dominant-baseline="middle" fill="${S.numFg}" font-family="monospace" font-weight="bold" font-size="${Math.max(9,circR*1.1)}">${room.id}</text>`);
  }

  // Entrance door — thin bar on the exterior wall of room 1 (edge depends on placement)
  (function() {
    const e = rooms[0];
    const ex=e.x*CELL, ey=e.y*CELL, ew=e.w*CELL, eh=e.h*CELL;
    const ed = e.edge||0;
    if(ed===0) // top
      parts.push(`<rect x="${ex+ew/2-CELL*0.35}" y="${ey-4}" width="${CELL*0.7}" height="8" fill="${S.doorFill}" rx="1"/>`);
    else if(ed===1) // right
      parts.push(`<rect x="${ex+ew-4}" y="${ey+eh/2-CELL*0.35}" width="8" height="${CELL*0.7}" fill="${S.doorFill}" rx="1"/>`);
    else if(ed===2) // bottom
      parts.push(`<rect x="${ex+ew/2-CELL*0.35}" y="${ey+eh-4}" width="${CELL*0.7}" height="8" fill="${S.doorFill}" rx="1"/>`);
    else // left
      parts.push(`<rect x="${ex-4}" y="${ey+eh/2-CELL*0.35}" width="8" height="${CELL*0.7}" fill="${S.doorFill}" rx="1"/>`);
  })();

  // Legend bar
  const legY=H-18;
  parts.push(`<rect x="0" y="${legY-4}" width="${W}" height="22" fill="${S.wall}" opacity="0.9"/>`);
  parts.push(`<text x="8" y="${legY+10}" fill="white" font-family="monospace" font-size="11" opacity="0.9">${S.title} · ${rooms.length} rooms</text>`);
  parts.push(`<text x="${W-8}" y="${legY+10}" text-anchor="end" fill="white" font-family="monospace" font-size="10" opacity="0.6">Dungeon Crawler's Companion</text>`);

  parts.push('</svg>');
  return { svg:parts.join(''), rooms:rooms.length, width:W, height:H };
}

// Expose to init_gen

function randMap() {
  if(!window.DungeonEngine) return;
  const v = id => document.getElementById(id);
  const rooms = parseInt(v('mapgen-rooms')?.value) || 5;
  // Generated by the shared Dungeon Engine — same hand-drawn look as the Map Maker.
  const gen = window.DungeonEngine.generateToPNG({
    rooms,
    size: +(v('mapgen-size')?.value || 3),
    layout: +(v('mapgen-layout')?.value || 3),
    entrances: +(v('mapgen-entrances')?.value || 2),
    corridors: (v('mapgen-corr')?.value || '1') !== '0',
    roundRooms: (v('mapgen-round')?.value || '0') === '1',
    organic: (v('mapgen-organic')?.value || '0') === '1',
    doors: (v('mapgen-doors')?.value || '1') !== '0',
    theme: v('mapgen-look')?.value || 'light'
  });
  if(!gen || !gen.png) return;
  addMap({ title: rooms + '-Room Dungeon', src: gen.png });
  state.maps = collectMaps();
  renderPreview();
  saveState();
}

function collectMaps() {
  // src comes from the registry by uid — same string reference, no copy.
  return [...document.querySelectorAll('#maps-list .entity-card')].map(c=>({
    title: c.querySelector('.map-title-input')?.value.trim()||'',
    src: _MAPSRC[c.dataset.mapUid]||''
  })).filter(m=>m.src);
}
