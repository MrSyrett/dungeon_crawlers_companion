function importHTML(input) {
  const file=input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    const html=e.target.result;
    const match=html.match(/data-spb="([^"]+)"/);
    if(!match){
      alert("This HTML file does not contain Adventure Prep Builder data.\n\nOnly files exported from this builder can be imported.");
      input.value="";
      return;
    }
    try {
      const decoded=decodeURIComponent(escape(atob(match[1])));
      const imported=JSON.parse(decoded);
      // A file exported from this builder holds either a whole multi-chapter
      // adventure ({chapters:[…], active}) or, from an older export, a single
      // flat chapter. Restore every chapter so the full book comes back.
      let incoming;
      let incomingActive = 0;
      if(imported && Array.isArray(imported.chapters) && imported.chapters.length){
        incoming = imported.chapters;
        incomingActive = Math.min(Math.max(0, parseInt(imported.active,10)||0), incoming.length - 1);
      } else {
        incoming = [imported];
      }
      const norm = (ch) => {
        const s = {...DEFAULT_STATE, ...ch};
        ['maps','clues','rewards','hooks','randenc','strongopen','locations','statblocks','rolltables'].forEach(k=>{ if(!Array.isArray(s[k])) s[k]=[]; });
        return s;
      };
      chapters = incoming.map(norm);
      activeChapter = incomingActive;
      state = chapters[activeChapter];
      buildSidebarFromState();
      renderChapterTabs();
      applyDarkModeInit();
      renderPreview();
      saveState();                 // persist the whole book (all chapters)
      const ind=document.getElementById("save-indicator");
      if(ind){ ind.textContent="Imported ✓"; ind.classList.add("saved"); setTimeout(()=>{ ind.textContent="All changes saved"; ind.classList.remove("saved"); },2000); }
    } catch(err) {
      alert("Failed to parse the imported file: "+err.message+" | Stack: "+err.stack);
    }
    input.value="";
  };
  reader.readAsText(file);
}
// Load html2canvas + jsPDF on first use (they were render-blocking in <head>).
// Failures reset the promise so a flaky connection can retry on the next click.
let _exportLibsPromise = null;
function loadExportLibs() {
  if (window.html2canvas && window.jspdf) return Promise.resolve();
  if (_exportLibsPromise) return _exportLibsPromise;
  const add = (src) => new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res;
    s.onerror = () => rej(new Error('could not load export libraries — check your connection'));
    document.head.appendChild(s);
  });
  _exportLibsPromise = Promise.all([
    add('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),
    add('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'),
  ]).catch(err => { _exportLibsPromise = null; throw err; });
  return _exportLibsPromise;
}

function captureScreenshot() {
  readFields();
  if (renderTimer) renderNow();   // flush any pending debounced preview rebuild
  const btn = document.getElementById('screenshot-btn');
  btn.textContent = '⏳ Capturing...';
  btn.disabled = true;

  const advTitle = (chapters[0] && chapters[0].title) || state.title || 'adventure';
  const filename = advTitle.replace(/[^a-z0-9]/gi, '_').toLowerCase();
  const opts = { scale: 2, useCORS: true, allowTaint: true, backgroundColor: null, logging: false };

  // Capture every chapter's pages, in order, into one stacked PNG.
  loadExportLibs().then(() => _withFixedLayout(() => {
    const savedState = state;
    const savedDark = document.getElementById('page-one') && document.getElementById('page-one').classList.contains('dark-mode');
    const canvases = [];
    const captureChapter = (i) => {
      if (i >= chapters.length) return Promise.resolve();
      state = chapters[i];
      renderPreview();
      paginatePages();
      document.querySelectorAll('.preview-area .page').forEach(p => p.classList.toggle('dark-mode', !!state.darkMode));
      const pages = [...document.querySelectorAll('.preview-area .page')].filter(p => p.style.display !== 'none');
      return pages.reduce((chain,p)=>chain.then(()=>html2canvas(p, opts)).then(c=>{ canvases.push(c); }), Promise.resolve())
        .then(()=>captureChapter(i+1));
    };
    return captureChapter(0).then(()=>{
      state = savedState;
      renderPreview();
      paginatePages();
      document.querySelectorAll('.preview-area .page').forEach(p => p.classList.toggle('dark-mode', !!savedDark));
      return canvases;
    });
  })).then(canvases => {
    const gap = 20;
    const totalW = Math.max(...canvases.map(c=>c.width));
    const totalH = canvases.reduce((sum,c)=>sum+c.height,0) + gap*(canvases.length-1);
    const combined = document.createElement('canvas');
    combined.width = totalW; combined.height = totalH;
    const ctx = combined.getContext('2d');
    ctx.fillStyle = '#888888';
    ctx.fillRect(0, 0, totalW, totalH);
    let y = 0;
    canvases.forEach(c => { ctx.drawImage(c, 0, y); y += c.height + gap; });
    combined.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename + '_screenshot.png';
      a.click(); URL.revokeObjectURL(url);
      btn.textContent = 'Save PNG'; btn.disabled = false;
    }, 'image/png');
  }).catch(err => {
    alert('Screenshot failed: ' + err.message);
    btn.textContent = 'Save PNG'; btn.disabled = false;
  });
}

function savePDF() {
  readFields();
  if (renderTimer) renderNow();   // flush any pending debounced preview rebuild
  const btn=document.getElementById('pdf-btn');
  btn.textContent='⏳ Generating...';
  btn.disabled=true;
  const advTitle=(chapters[0] && chapters[0].title) || state.title || 'adventure';
  const filename=advTitle.replace(/[^a-z0-9]/gi,'_').toLowerCase();

  // Force the fixed print layout for the capture (so a phone-width, flow-mode
  // session still yields a correct paginated PDF), then restore the view mode
  // once the canvases are taken.
  loadExportLibs().then(() => _withFixedLayout(() => {
    // Lossless PNG at 2x was producing 25MB+ files. 1.5x JPEG is visually the
    // same on paper and lands around 1-2MB. JPEG has no alpha, so each page is
    // rasterized onto its own background color (works in light and dark mode).
    const shot = (p) => html2canvas(p, {
      scale: 1.5,
      useCORS: true,
      allowTaint: true,
      logging: false,
      backgroundColor: getComputedStyle(p).backgroundColor || '#ffffff'
    });

    // Capture every chapter's pages in order into one PDF.
    const savedState = state;
    const savedDark = document.getElementById('page-one') && document.getElementById('page-one').classList.contains('dark-mode');
    const canvases=[];
    const captureChapter = (i) => {
      if (i >= chapters.length) return Promise.resolve();
      state = chapters[i];
      renderPreview();
      paginatePages();
      document.querySelectorAll('.preview-area .page').forEach(p => p.classList.toggle('dark-mode', !!state.darkMode));
      const pages=[...document.querySelectorAll('.preview-area .page')].filter(p=>p.style.display!=='none');
      return pages.reduce((chain,p)=>chain.then(()=>shot(p)).then(c=>{ canvases.push(c); }), Promise.resolve())
        .then(()=>captureChapter(i+1));
    };

    return captureChapter(0).then(()=>{
      state = savedState;
      renderPreview();
      paginatePages();
      document.querySelectorAll('.preview-area .page').forEach(p => p.classList.toggle('dark-mode', !!savedDark));

      const {jsPDF}=window.jspdf;
      const pdf=new jsPDF({orientation:'portrait',unit:'pt',format:'letter',compress:true});
      const pageW=pdf.internal.pageSize.getWidth();
      const pageH=pdf.internal.pageSize.getHeight();

      canvases.forEach((canvas,i)=>{
        if(i>0) pdf.addPage();
        const img=canvas.toDataURL('image/jpeg', 0.85);
        const ratio=Math.min(pageW/canvas.width, pageH/canvas.height);
        const w=canvas.width*ratio;
        const h=canvas.height*ratio;
        pdf.addImage(img,'JPEG',(pageW-w)/2,(pageH-h)/2,w,h,undefined,'FAST');
      });

      pdf.save(filename+'.pdf');
    });
  })).then(()=>{
    btn.textContent='Save PDF';
    btn.disabled=false;
  }).catch(err=>{
    alert('PDF generation failed: '+err.message);
    btn.textContent='Save PDF';
    btn.disabled=false;
  });
}

function toggleSidebar() {
  const sidebar   = document.querySelector('.sidebar');
  const pullTab   = document.getElementById('sidebar-pull-tab');
  const isMobile  = window.innerWidth <= 768;
  const collapsed = sidebar.classList.toggle('collapsed');
  if(pullTab) {
    pullTab.title = collapsed ? 'Show controls' : 'Hide controls';
    if(isMobile) {
      setPullTabMobile(pullTab, collapsed);
      pullTab.textContent = collapsed ? '▼' : '▲';
    } else {
      pullTab.style.left = collapsed ? '42px' : '320px';
      pullTab.textContent = collapsed ? '▶' : '◀';
    }
  }
}

function setPullTabMobile(pt, collapsed) {
  if(collapsed) {
    pt.style.bottom = 'auto';
    pt.style.top    = '8px';   /* top of screen when collapsed */
  } else {
    pt.style.top    = 'auto';
    pt.style.bottom = '8px';   /* above bottom edge when open */
  }
}

// Update pull-tab position on resize
window.addEventListener('resize', function() {
  const sidebar = document.querySelector('.sidebar');
  const pullTab = document.getElementById('sidebar-pull-tab');
  if(!pullTab || !sidebar) return;
  const isMobile  = window.innerWidth <= 768;
  const collapsed = sidebar.classList.contains('collapsed');
  if(isMobile) {
    setPullTabMobile(pullTab, collapsed);
    pullTab.textContent = collapsed ? '▼' : '▲';
  } else {
    pullTab.style.top    = '';
    pullTab.style.bottom = '';
    pullTab.style.left   = collapsed ? '42px' : '320px';
    pullTab.textContent  = collapsed ? '▶' : '◀';
  }
});

function toggleDarkMode(cb) {
  state.darkMode = cb.checked;                 // remember the choice in saved state
  document.querySelectorAll('.preview-area .page').forEach(p=>{
    p.classList.toggle('dark-mode', cb.checked);
  });
  // Re-run pagination so continuation pages also get dark mode
  requestAnimationFrame(()=>requestAnimationFrame(paginatePages));
  autosave();                                  // persist (survives reload + carries into the GM Screen preview)
}

// Apply the saved dark-mode preference on load. This also runs inside the GM
// Screen's read-only preview iframe, so a session opened there matches how it
// was left in the builder.
function applyDarkModeInit() {
  const on = !!state.darkMode;
  const cb = document.getElementById('dark-mode-toggle');
  if (cb) cb.checked = on;
  if (on) {
    document.querySelectorAll('.preview-area .page').forEach(p=>p.classList.add('dark-mode'));
    requestAnimationFrame(()=>requestAnimationFrame(paginatePages));
  }
}

function clearAll() {
  if(!confirm('Clear all adventure data?')) return;
  state=JSON.parse(JSON.stringify(DEFAULT_STATE));
  const mapStatus=document.getElementById('map-status');
  const mapLbl=document.querySelector('label[for="f-mapfile"]');
  const fileInput=document.getElementById('f-mapfile');

  _lists.forEach(function(id){ const el=document.getElementById(id); if(el) el.innerHTML=''; });
  saveState();buildSidebarFromState();renderPreview();
}

(function(){

<script>

// ── Treasure generator (ported from GM Screen) ───────────────────────────
function _spbGenTreasureItem(tierKey, type) {
  if(type==='random_all') {
    type = _R(['random','random','Weapon','Armor','Wand','Ring','Cloak','Boots','Potion','Scroll','table','mundane','gem','luxury']);
  }
  if(type==='table') {
    const tier = TREASURE_TIERS[tierKey]||TREASURE_T1;
    const item = _R(tier).replace(/^[PNFL]\. /, '');
    return { name: 'Treasure Roll (Tier '+tierKey+')', stats: item };
  }
  if(type==='mundane') { return { name: 'Mundane Loot', stats: _R(MUNDANE_LOOT) }; }
  if(type==='gem')     { return { name: 'Gemstone', stats: _R(GEMS) }; }
  if(type==='luxury')  {
    const pool = _R(LUX_ITEM_POOLS);
    return { name: 'Luxury Item', stats: _R(LUX_FEAT)+' '+_R(pool) };
  }
  const pool = type==='random' ? MAGIC_ITEM_POOLS[_R(LOOT_TYPES)] : (MAGIC_ITEM_POOLS[type]||POTIONS);
  const item = _R(pool);
  return { name: item.name, stats: item.desc };
}

// ── Random encounter table entry (ported from GM Screen) ─────────────────
function _spbGenEncEntry(type) {
  if(type==='random_all') {
    type = _R(['happens','trap','hazard','Arctic','Cave','Deep Tunnels','Desert','Forest','Grassland','Jungle','Mountain','Ocean','River & Coast','Ruins','Swamp']);
  }
  if(type==='happens')  return { hdr:'Something Happens!', text:_R(HAPPENS) };
  if(type==='rumor')    return { hdr:'Rumor', text:_R(RUMORS) };
  if(type==='secret')   return { hdr:'Secret', text:_R(SECRETS_D1)+' '+_R(SECRETS_D2) };
  if(type==='trap') {
    const trap = TRAPS[Math.ceil(Math.random()*12)-1];
    return { hdr:'Trap: '+trap.trap, text:'Trigger: '+trap.trigger+' — '+trap.effect };
  }
  if(type==='hazard') {
    return { hdr:'Hazard', text:_R(HAZARDS_DMG)+' / '+_R(HAZARDS_WKN)+' / '+_R(HAZARDS_MOV) };
  }
  const pool = BIOME_ENC_TABLES[type];
  if(pool) return { hdr: type, text:_R(pool) };
  return { hdr:'Encounter', text:_R(HAPPENS) };
}



// ── Loot ─────────────────────────────────────────────────────────────────
function randReward() {
  const tier = document.getElementById('reward-tier')?.value || '1';
  const type = document.getElementById('reward-type')?.value || 'random_all';
  const t = _spbGenTreasureItem(tier, type);
  addReward({ name: t.name, flavor: '', stats: t.stats });
  autosave();
}

// ── Hooks / Strong Open ───────────────────────────────────────────────────
function randStrongOpen() {
  const allOpens = Object.values(ADV_OPENING_SCENES).flat();
  addStrongOpen({ name: 'Strong Open', type: 'exploration', tag: '', readaloud: _R(allOpens), desc: '' });
  autosave();
}

// ── Encounters ────────────────────────────────────────────────────────────
const ENC_SUBTYPES = {
  guardian: 'Guardian', puzzle: 'Puzzle', setback: 'Setback',
  climax: 'Boss', reward: 'Treasure',
  'Combat Encounter': 'Mooks', 'Exploration Chamber': 'Scenic',
  'Trap Room': 'Trap', 'Treasure Cache': 'Treasure',
  'Side Chamber': 'Scenic', 'Barracks': 'Mooks',
  'Storage Room': 'Scenic', 'Secret Room': 'Secret Area',
  'Sub-Boss Lair': 'Sub-Boss', 'Puzzle Room': 'Puzzle',
  'Shrine': 'Sanctuary', 'Laboratory': 'Scenic',
  'Prison Cells': 'Social', 'Collapsed Section': 'Environmental',
  'Natural Cave': 'Scenic', 'Guard Post': 'Sentry',
  'Armory': 'Treasure', 'Ritual Chamber': 'Environmental',
};
const ROOM_POOL_LABELS = ['Guardian','Puzzle','Setback','Climax','Reward'];
const ROOM_POOL_TYPES  = ['combat','npc','exploration','combat','exploration'];

// The Type dropdown beside Motif. Encounter text is written per motif and per
// ROOM ROLE — the roles *are* the kinds of encounter available, so the dropdown
// lists them directly. Each role carries its own colour via ROOM_POOL_TYPES
// (Guardian/Climax combat, Puzzle npc, Setback/Reward exploration).
// Returns the pool index, or -1 for "Mixed".
function _encRoleIndex() {
  const sel = document.getElementById('enc-type');
  if(!sel || !sel.value) return -1;
  return ROOM_POOL_LABELS.indexOf(sel.value);
}

function randEncounter() {
  const motifSel = document.getElementById('enc-motif');
  const motifs = DUN_MOTIFS.filter(function(m){ return m !== 'none'; });
  const mot = (motifSel && motifSel.value !== 'random') ? motifSel.value : _R(motifs);
  const roomPools = [DUN_R1, DUN_R2, DUN_R3, DUN_R4, DUN_R5];
  const role = _encRoleIndex();
  const poolIdx = role >= 0 ? role : Math.floor(Math.random() * roomPools.length);
  const pool = roomPools[poolIdx];
  const entries = pool[mot] || pool[_R(Object.keys(pool))];
  const desc = _R(entries);
  const biomePool = BIOME_ENC_TABLES[mot];
  const biomeEnc = biomePool ? '\n\n[' + mot + ' Encounter] ' + _R(biomePool) : '';
  const label = ROOM_POOL_LABELS[poolIdx];
  const subtype = ENC_SUBTYPES[label] || label;
  addLocation({
    name: '',
    type: ROOM_POOL_TYPES[poolIdx],
    tag: subtype,
    readaloud: '',
    desc: desc + biomeEnc
  });
  autosave();
}

function _addEnc(mot, poolIdx) {
  const roomPools = [DUN_R1, DUN_R2, DUN_R3, DUN_R4, DUN_R5];
  const labels    = ['Guardian','Puzzle','Setback','Climax','Reward'];
  const types     = ['combat','npc','exploration','combat','exploration'];
  const pool = roomPools[poolIdx];
  const entries = pool[mot] || pool[_R(Object.keys(pool))];
  const desc = _R(entries);
  const biomePool = BIOME_ENC_TABLES[mot];
  const biomeEnc = biomePool ? '\n\n[' + mot + '] ' + _R(biomePool) : '';
  const label = labels[poolIdx];
  const subtype = ENC_SUBTYPES[label] || label;
  addLocation({ name: '', type: types[poolIdx], tag: subtype, readaloud: '', desc: desc + biomeEnc });
}

// Extra room types for middle rooms (indices into a conceptual extra pool)
const ENC_EXTRA_LABELS = ['Side Chamber','Trap Room','Exploration Chamber','Secret Room','Barracks','Shrine','Prison Cells','Guard Post','Collapsed Section','Ritual Chamber'];

function _addExtraEnc(mot) {
  const label = _R(ENC_EXTRA_LABELS);
  const motifs = DUN_MOTIFS.filter(function(m){ return m !== 'none'; });
  const useMot = mot || _R(motifs);
  // Get desc from a random room pool for variety
  const pools = [DUN_R1, DUN_R2, DUN_R3];
  const pool = _R(pools);
  const entries = pool[useMot] || pool[_R(Object.keys(pool))];
  const desc = _R(entries);
  const biomePool = BIOME_ENC_TABLES[useMot];
  const biomeEnc = biomePool ? '\n\n[' + useMot + '] ' + _R(biomePool) : '';
  const subtype = ENC_SUBTYPES[label] || 'Scenic';
  addLocation({ name: '', type: 'exploration', tag: subtype, readaloud: '', desc: desc + biomeEnc });
}

function randEncounterBatch() {
  const countSel = document.getElementById('enc-count');
  const motifSel = document.getElementById('enc-motif');
  const n = parseInt(countSel ? countSel.value : 1) || 1;
  const motifs = DUN_MOTIFS.filter(function(m){ return m !== 'none'; });
  const mot = (motifSel && motifSel.value !== 'random') ? motifSel.value : _R(motifs);

  const role = _encRoleIndex();
  if(role >= 0) {
    // A specific role: every room comes from that pool. The structured
    // Guardian→Climax→Reward run only makes sense for a mixed dungeon.
    for(let i = 0; i < n; i++) _addEnc(mot, role);
    readFields(); renderPreview();
    return;
  }

  if(n === 1) {
    // Single: fully random
    randEncounter();
    readFields(); renderPreview();
    return;
  }

  // Structured dungeon format: Guardian → [extras] → Boss → Reward
  // Always: Room 1=Guardian(0), last=Reward(4), second-to-last=Climax(3)
  // Middle rooms fill with Puzzle(1), Setback(2), then extra room types
  _addEnc(mot, 0); // Guardian

  const midCount = n - 3; // rooms between guardian and climax
  // Mandatory: puzzle then setback in order
  const mid = [];
  if(midCount >= 1) mid.push(1); // Puzzle
  if(midCount >= 2) mid.push(2); // Setback
  // Fill remaining middle slots with extra room types (no shuffle — keep Puzzle→Setback order)
  for(let i = mid.length; i < midCount; i++) mid.push('extra');
  mid.forEach(function(slot) {
    if(slot === 'extra') _addExtraEnc(mot);
    else _addEnc(mot, slot);
  });

  _addEnc(mot, 3); // Climax/Boss
  _addEnc(mot, 4); // Reward
  readFields(); renderPreview();
}

// ── Random NPC ────────────────────────────────────────────────────────────
const NPC_AGE       = ['young (late teens)','young adult (early 20s)','adult (30s)','middle-aged (40s)','older (50s)','elderly (60s+)'];
const NPC_BUILD     = ['stocky','lean','wiry','heavyset','lanky','muscular','slender','broad-shouldered'];
const NPC_DRESS     = ['tattered rags','patched wool','worn leather','sturdy wool','clean linen','simple leather','fine silk','embroidered cloth','well-tailored wool','travelling gear'];
const NPC_FEATURE   = ['a scar across the cheek','a crooked nose','calloused hands','a missing finger','bright eyes','a guarded expression','an easy smile','deep-set eyes','prominent eyebrows','laugh lines','a weathered face'];

// Drops in a stat block already filled with a random monster — the book
// bestiary plus any homebrew, the same pool the search uses.
function randMonster() {
  const pool = (typeof allPrepMonsters === 'function') ? allPrepMonsters() : SD_MONSTERS;
  if(!pool || !pool.length) return;
  const m = pool[Math.floor(Math.random() * pool.length)];
  const card = addStatBlock();
  if(card && typeof fillMonster === 'function') fillMonster(m, card);
  autosave();
}

function randNPC() {
  const anc  = _R(['Human','Human','Human','Dwarf','Elf','Halfling','Half-Orc','Goblin']);
  const name = _R(NPC_NAMES[anc] || NPC_NAMES.Human);
  const role = _R(['Villain','Quest Giver','Rival','Ally','Wild Card','Informant','Prisoner','Guardian']);
  const occ  = _R(OCCUPATIONS);
  const age  = _R(NPC_AGE);
  const build = _R(NPC_BUILD);
  const dress = _R(NPC_DRESS);
  const feature = _R(NPC_FEATURE);
  const demeanor = _R(DEMEANOR);
  const quirk = _R(QUIRKS);
  const want  = _R(WANTS);
  const secret = _R(SECRETS);
  const flavor = age + ', ' + build + ' ' + anc.toLowerCase() +
    '. Dressed in ' + dress + '. ' + feature.charAt(0).toUpperCase() + feature.slice(1) + '. ' +
    demeanor.charAt(0).toUpperCase() + demeanor.slice(1) + ' in manner. ' + quirk.charAt(0).toUpperCase() + quirk.slice(1) + '.';
  addStatBlock({
    sbtype: role === 'Villain' ? 'boss' : role === 'Rival' ? 'boss' : 'npc',
    name: name + ' (' + anc + ')',
    type: occ + ' — ' + role,
    ac: '', hd: '', hp: '', mv: '', atk: '',
    flavor: flavor,
    notes: 'Wants: ' + want + '\nSecret: ' + secret
  });
  autosave();
}

</script>

<script>


function fillMonster(m, card) {
  if(!m || !card) return;
  const g = (cls) => card.querySelector('.'+cls);
  const si = g('sb-name-input');   if(si) si.value = m.name;
  const fi = g('sb-flavor-input'); if(fi) fi.value = 'LV ' + m.lv + ' | AL ' + m.al + ' | MV ' + m.mv;
  const ac = g('sb-hp-val');       if(ac) ac.value = m.ac;
  const hp = g('sb-hp-count');     if(hp) hp.value = m.hp;
  // Movement: map to nearest option
  const mv = g('sb-move');
  if(mv) {
    const mvStr = m.mv.toLowerCase();
    if(mvStr.includes('double')) mv.value = 'Far';
    else if(mvStr.includes('far')) mv.value = 'Far';
    else if(mvStr.includes('near')) mv.value = 'Near';
    else mv.value = 'Close';
  }
  const str = g('sb-str');   if(str) str.value = m.s;
  const dex = g('sb-dex');   if(dex) dex.value = m.d;
  const con = g('sb-con');   if(con) con.value = m.c;
  const int = g('sb-int');   if(int) int.value = m.i;
  const wis = g('sb-evade'); if(wis) wis.value = m.w;
  const cha = g('sb-cha');   if(cha) cha.value = m.ch;
  const abl = g('sb-abilities-input');
  if(abl) abl.value = 'ATK: ' + m.atk + (m.notes ? '\n\n' + m.notes : '');
  // Set type radio based on LV
  const lv = parseInt(m.lv) || 0;
  const typeVal = lv >= 7 ? 'boss' : lv >= 4 ? 'boss' : 'mob';
  const radio = card.querySelector('.sb-type-radio[value="'+typeVal+'"]');
  if(radio) { radio.checked = true; updateSbCardColor(radio); }
  autosave();
}

// ── Bestiary search ───────────────────────────────────────────────────────
// Replaces the old 300-entry dropdown. The panel lives inside the stat block
// card in the sidebar rather than in a floating overlay: the sidebar goes
// full-screen on narrow viewports, so an overlay covered the preview and had to
// out-stack it. Search by name, filter by creature type, click to load.
let _hbMonsters = [];
let _monTypes = { types: [], byName: {} };

// Cached — called on every keystroke of the monster search; the merge only
// changes when homebrew re-syncs.
let _allPrepMonstersCache = null;
function allPrepMonsters() {
  return _allPrepMonstersCache || (_allPrepMonstersCache = SD_MONSTERS.concat(_hbMonsters));
}

function monsterTypeOf(m) {
  if(m && m.ctype) return m.ctype;                    // homebrew carries its own
  return _monTypes.byName[m && m.name] || 'Monster';
}

// The creature-type map is generated from the GM screen into the app; fetching
// it keeps a single copy rather than a third hand-maintained one in here.
async function syncMonsterTypes() {
  try {
    const r = await fetch('/api/monster-types', { credentials: 'same-origin' });
    if(!r.ok) return;
    const data = await r.json();
    if(Array.isArray(data.types)) _monTypes = { types: data.types, byName: data.byName || {} };
    refreshTypeDropdowns();
  } catch(e) {}
}

async function syncHomebrewMonsters() {
  let rows;
  try {
    const r = await fetch('/api/homebrew?type=monster', { credentials: 'same-origin' });
    if(!r.ok) return;
    const data = await r.json();
    rows = Array.isArray(data.items) ? data.items : [];
  } catch(e) { return; }
  const seen = new Set();
  const next = [];
  rows.forEach(row => {
    if(!row || row.type !== 'monster' || !row.data) return;
    const d = row.data;
    const nm = String(d.name || '').trim();
    if(!nm || seen.has(nm.toLowerCase())) return;
    seen.add(nm.toLowerCase());
    next.push({
      name: nm,
      ac: String(d.ac||''), hp: String(d.hp||''), atk: String(d.atk||''),
      mv: String(d.mv||''), lv: String(d.lv||''), al: String(d.al||''),
      s: String(d.s||''), d: String(d.d||''), c: String(d.c||''),
      i: String(d.i||''), w: String(d.w||''), ch: String(d.ch||''),
      notes: String(d.notes||''), ctype: String(d.ctype||'Monster'), homebrew: true
    });
  });
  _hbMonsters = next;
  _allPrepMonstersCache = null;   // merged array is cached — see allPrepMonsters()
  refreshTypeDropdowns();
}

// Options for the Type dropdown. Built from whatever is known right now, so a
// freshly-added card is already populated — the list is fetched at startup, not
// when the search is first used.
function monsterTypeOptions() {
  const pool = allPrepMonsters();
  const present = [];
  (_monTypes.types || []).forEach(function(t) {
    for(let i = 0; i < pool.length; i++) {
      if(monsterTypeOf(pool[i]) === t) { present.push(t); return; }
    }
  });
  pool.forEach(function(m) {                       // homebrew may add its own
    const t = monsterTypeOf(m);
    if(t && present.indexOf(t) === -1) present.push(t);
  });
  let html = '<option value="">All Types</option>';
  present.forEach(function(t) { html += '<option value="' + escA(t) + '">' + escH(t) + '</option>'; });
  return html;
}

// Refresh every card's dropdown once the type list or homebrew arrives, keeping
// each card's current selection.
function refreshTypeDropdowns() {
  const html = monsterTypeOptions();
  document.querySelectorAll('.mon-pick-type').forEach(function(sel) {
    const keep = sel.value;
    sel.innerHTML = html;
    sel.value = keep || '';
  });
}

function hideMonsterResults(card) {
  if(!card) return;
  const out = card.querySelector('.mon-pick-list');
  if(out) { out.classList.remove('show'); out.innerHTML = ''; }
}

// Renders every match — the list scrolls rather than being cut off at 60.
function renderMonsterResults(card) {
  if(!card) return;
  const out = card.querySelector('.mon-pick-list');
  if(!out) return;
  const searchEl = card.querySelector('.mon-pick-search');
  const typeEl = card.querySelector('.mon-pick-type');
  const q = (searchEl && searchEl.value ? searchEl.value : '').trim().toLowerCase();
  const wantType = typeEl && typeEl.value ? typeEl.value : '';

  const found = allPrepMonsters().filter(function(m) {
    if(wantType && monsterTypeOf(m) !== wantType) return false;
    if(q && String(m.name).toLowerCase().indexOf(q) === -1) return false;
    return true;
  }).sort(function(a, b) { return String(a.name).localeCompare(String(b.name)); });

  let html = '';
  if(!found.length) {
    html = '<div class="mon-pick-empty">No monster matches.</div>';
  } else {
    found.forEach(function(m) {
      html += '<button type="button" class="mon-pick-item' + (m.homebrew ? ' hb' : '') + '" data-mon="'
           + escA(m.name) + '">' + escH(m.name) + '</button>';
    });
  }
  out.innerHTML = html;
  out.classList.add('show');
  out.scrollTop = 0;
}

// Delegated off document so every card works — including ones added later or
// rebuilt when a saved session loads.
document.addEventListener('click', function(e) {
  const t = e.target;
  if(!t || !t.closest) return;

  const goBtn = t.closest('.mon-pick-go');
  if(goBtn) { e.preventDefault(); renderMonsterResults(goBtn.closest('.entity-card')); return; }

  const item = t.closest('.mon-pick-item');
  if(item) {
    e.preventDefault();
    const card = item.closest('.entity-card');
    const name = item.getAttribute('data-mon');
    const m = allPrepMonsters().find(function(x) { return x.name === name; });
    if(m && card) fillMonster(m, card);
    hideMonsterResults(card);        // loading a monster closes the search
    return;
  }
});

document.addEventListener('input', function(e) {
  const box = e.target && e.target.closest ? e.target.closest('.mon-pick-search') : null;
  if(box) renderMonsterResults(box.closest('.entity-card'));
});

document.addEventListener('change', function(e) {
  const sel = e.target && e.target.closest ? e.target.closest('.mon-pick-type') : null;
  if(sel) renderMonsterResults(sel.closest('.entity-card'));
});

// Cards restored from a saved session are built by an earlier script block, so
// fill their Type dropdowns now that this one has defined the helper.
refreshTypeDropdowns();

if(document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => { refreshTypeDropdowns(); syncHomebrewMonsters(); syncMonsterTypes(); });
} else { syncHomebrewMonsters(); syncMonsterTypes(); }

</script>
