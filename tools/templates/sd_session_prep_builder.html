// Format text: line breaks → <br>, lines with "Label: text" → bold label
function fmtText(str) {
  if(!str) return '';
  return str.split('\n').map(line => {
    const idx = line.indexOf(':');
    if(idx > 0 && idx < 40) {
      const label = escH(line.slice(0, idx));
      const rest = escH(line.slice(idx + 1).trim());
      return `<strong>${label}:</strong> ${rest}`;
    }
    return escH(line);
  }).join('<br>');
}

function renderPreview() {
  setText('p-title',state.title||'Adventure Title');
  setText('p-subtitle',state.subtitle);

  setText('p-session',state.session?'SESSION: '+state.session:'');
  setText('p-players',state.players?'PLAYERS: '+state.players:'');
  setText('p-duration',state.duration?'DURATION: '+state.duration:'');
  // Page 2
  setText('p2-title',state.title||'Adventure Title');

  setText('p2-session',state.session?'SESSION: '+state.session:'');
  setText('p2-players',state.players?'PLAYERS: '+state.players:'');
  setText('p2-duration',state.duration?'DURATION: '+state.duration:'');
  // Page 3
  setText('p3-title',state.title||'Adventure Title');

  setText('p3-session',state.session?'SESSION: '+state.session:'');
  setText('p3-players',state.players?'PLAYERS: '+state.players:'');
  setText('p3-duration',state.duration?'DURATION: '+state.duration:'');
  // Page 4
  setText('p4-title',state.title||'Adventure Title');

  setText('p4-session',state.session?'SESSION: '+state.session:'');
  setText('p4-players',state.players?'PLAYERS: '+state.players:'');
  setText('p4-duration',state.duration?'DURATION: '+state.duration:'');
  // Overview with formatting
  // Build all p1 items, measure, fill left then right
  (function() {
    const leftEl  = document.getElementById('p1-left');
    const rightEl = document.getElementById('p1-right');
    if(!leftEl || !rightEl) return;

    const sbt={mob:'#C0392B',boss:'#6a2d8a',npc:'#1a4a8a'};
    const soc={'combat':'#cc2222','exploration':'#1a7a1a','npc':'#1a4a8a'};
    const npcs=state.statblocks.filter(s=>s.sbtype==='npc');
    const mobs=state.statblocks.filter(s=>s.sbtype!=='npc');

    // Build HTML strings for each section
    const sections = [];

    // Overview
    sections.push('<div class="p-section"><div class="sl">Overview</div><p class="p-text">'+fmtText(state.overview)+'</p></div>');

    // Random Encounters roll table
    if((state.randenc||[]).length){
      let h='<div class="p-section"><div class="sl" style="color:#f8f8f6;background:#0a0a0a;padding:3px 8px;">Random Encounters</div>';
      h+='<table class="randenc-table" style="width:100%;border-collapse:collapse;font-size:9px;">';
      (state.randenc||[]).forEach((e,i)=>{
        h+='<tr style="border-bottom:1px solid var(--rule);">'
          +'<td class="randenc-num" style="width:22px;padding:3px 4px;font-family:Montserrat,sans-serif;font-weight:900;text-align:center;color:#1a7a1a;vertical-align:top;">'+(i+1)+'</td>'
          +'<td style="padding:3px 4px;">'
          +(e.header?'<div class="clue-hdr">'+escH(e.header)+'</div>':'')
          +(e.text?'<div class="randenc-text" style="font-size:9px;line-height:1.5;color:var(--ink);">'+fmtText(e.text)+'</div>':'')
          +'</td>'
          +'</tr>';
      });
      h+='</table></div>';
      sections.push(h);
    }

    // Secrets & Clues
    if((state.clues||[]).length){
      let h='<div class="p-section"><div class="sl" style="color:#f8f8f6;background:#0a0a0a;padding:3px 8px;">Secrets &amp; Clues</div>';
      (state.clues||[]).forEach(c=>{h+='<div class="clue-item">'+(c.header?'<span class="clue-hdr">'+escH(c.header)+'</span>'+(c.text?' — ':''): '')+fmtText(c.text)+'</div>';});
      sections.push(h+'</div>');
    }

    // Treasure
    if((state.rewards||[]).length){
      let h='<div class="p-section"><div class="sl" style="color:#f8f8f6;background:#0a0a0a;padding:3px 8px;">Treasure</div>';
      (state.rewards||[]).forEach(r=>{h+='<div class="npc-block" style="border-left-color:#C4700A;"><div class="entry-name">'+escH(r.name)+'</div>'+(r.flavor?'<div class="sb-flavor" style="margin-bottom:5px;padding:5px 7px;">'+fmtText(r.flavor)+'</div>':'')+(r.stats?'<p class="entry-desc reward-stats" style="font-family:Montserrat,sans-serif;font-size:8px;margin-top:3px;">'+fmtText(r.stats)+'</p>':'')+'</div>';});
      sections.push(h+'</div>');
    }

    // Encounters inline after hooks on page 1 — headed like the other sections,
    // but only once there is something under it.
    const _typeC={'combat':'#cc2222','exploration':'#1a7a1a','npc':'#1a4a8a'};
    if((state.locations||[]).length){
      sections.push('<div class="p-section"><div class="sl" style="color:#f8f8f6;background:#0a0a0a;padding:3px 8px;">Encounters</div></div>');
    }
    (state.locations||[]).forEach(l=>{
      const c=_typeC[l.type]||_typeC.combat;
      const displayName = l.name || l.tag || '';
      const showTag = l.tag && l.name;
      sections.push('<div class="location-block"><div class="loc-name" style="color:'+c+';border-bottom:1.5px solid '+c+';padding-bottom:1px;font-family:\'Old Newspaper\',Montserrat,sans-serif;font-size:13px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;display:block;margin-bottom:4px;">'+escH(displayName)+'</div>'+(showTag?'<div class="loc-tag">'+escH(l.tag)+'</div>':'')+(l.readaloud?'<div class="read-aloud"><p>'+fmtText(l.readaloud)+'</p></div>':'')+(l.desc?'<p class="loc-desc">'+fmtText(l.desc)+'</p>':'')+'</div>');
    });

    // NPC/Mob full stat blocks after encounters
    if((state.statblocks||[]).length){
      sections.push('<div class="p-section" style="margin-top:4px;"><div class="sl" style="color:#f8f8f6;background:#0a0a0a;padding:3px 8px;">NPCs &amp; Mobs</div></div>');
      state.statblocks.forEach(s=>{
        const sbDiv = buildSB(s);
        sbDiv.classList.add('full-width');
        sbDiv.style.width='100%';
        sbDiv.style.flex='0 0 100%';
        sbDiv.style.marginBottom='8px';
        sections.push(sbDiv.outerHTML);
      });
    }

        // Put all items in left first to measure real heights
    leftEl.innerHTML = sections.join('');
    rightEl.innerHTML = '';

    // Measure each item's actual rendered height
    const items = [...leftEl.children];
    const colH = leftEl.offsetHeight; // flex:1 gives us the correct column height

    // Fill left column, overflow into right
    let leftH = 0;
    let rightStart = -1;
    for(let i=0; i<items.length; i++){
      const h = items[i].offsetHeight + getMargin(items[i]);
      if(rightStart === -1 && leftH + h > colH){
        rightStart = i;
        break;
      }
      leftH += h;
    }

    // Move overflow items to right column
    if(rightStart > 0 && rightStart < items.length){
      const toMove = items.slice(rightStart);
      toMove.forEach(el => rightEl.appendChild(el));
    }
  })();

  // Page 2: encounters that overflowed from page 1
  // We detect overflow by checking what page-1 right column didn't fit
  // Simplest: render all locations on page 2 as a fallback/continuation
  const typeColors={'combat':'#cc2222','exploration':'#1a7a1a','npc':'#1a4a8a'};
  const locsEl2 = document.getElementById('p-locations');
  const pageTwo = document.getElementById('page-two');
  if(locsEl2) {
    // Count how many locations already rendered on page 1
    const p1LocCount = document.querySelectorAll('#p1-left .location-block, #p1-right .location-block').length;
    const overflowLocs = (state.locations||[]).slice(p1LocCount);
    locsEl2.innerHTML = overflowLocs.map(l=>`
      <div class="location-block">
        <div class="loc-name" style="color:${typeColors[l.type]||typeColors.combat};border-bottom:1.5px solid ${typeColors[l.type]||typeColors.combat};padding-bottom:1px;font-family:'Old Newspaper','Montserrat',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;display:block;margin-bottom:4px;">${escH(l.name||l.tag||'')}</div>
        ${l.tag&&l.name?`<div class="loc-tag">${escH(l.tag)}</div>`:''}
        ${l.readaloud?`<div class="read-aloud"><p>${fmtText(l.readaloud)}</p></div>`:''}
        ${l.desc?`<p class="loc-desc">${fmtText(l.desc)}</p>`:''}
      </div>`).join('');
    // Hide page 2 entirely when there is no overflow content
    if(pageTwo) pageTwo.style.display = overflowLocs.length ? '' : 'none';
  }

  // Flowchart - render on both page 1 and page 2
  const renderFlowchart = (fcId) => {
    const fc=document.getElementById(fcId);
    if(!fc) return;
    const locNodes=state.locations.map(l=>({name:l.name||l.tag||'Encounter',tag:l.tag,type:l.type||'combat'}));
    const allNodes=[...locNodes];
    if(!allNodes.length){fc.innerHTML='';return;}
    const typeNodeColors={
      combat:{bg:'#C0392B',lbl:'rgba(255,255,255,0.8)',txt:'white'},
      exploration:{bg:'#2d6a2d',lbl:'rgba(255,255,255,0.8)',txt:'white'},
      npc:{bg:'#1a4a8a',lbl:'rgba(255,255,255,0.8)',txt:'white'},
    };
    fc.innerHTML=allNodes.map((n,i)=>{
      const c=typeNodeColors[n.type]||typeNodeColors.combat;
      const label=(n.name||n.tag||n.type).toUpperCase();
      return `<div class="flow-node" style="background:${c.bg};">
        <div class="flow-label" style="color:${c.lbl}">${label}</div>
      </div>${i<allNodes.length-1?'<div class="flow-arrow">→</div>':''}`;
    }).join('');
  };
  renderFlowchart('p-flowchart');
  renderFlowchart('p-flowchart-2');

  // Hide pages 3 & 4 when no content
  const _p3 = document.getElementById('page-three');
  const _p4 = document.getElementById('page-four');
  if(_p3) _p3.style.display = (state.maps||[]).length ? '' : 'none';
  if(_p4) _p4.style.display = 'none'; // stat blocks now render inline on main pages

  // Maps - render each map on page 3
  // Only rebuilt when the map set actually changed — rebuilding re-escapes the
  // base64 srcs and forces the browser to re-decode every image (cheap
  // signature: title + src length + src prefix per map).
  const mapsContainer=document.getElementById('p-maps-container');
  if(mapsContainer){
    const mapsSig=(state.maps||[]).map(m=>m.title+'|'+(m.src?m.src.length+'|'+m.src.slice(0,40):'')).join(';');
    if(mapsContainer._sig!==mapsSig){
      mapsContainer._sig=mapsSig;
      if(state.maps&&state.maps.length>0){
        mapsContainer.innerHTML=state.maps.map(m=>`
          <div style="margin-bottom:16px;break-inside:avoid;">
            ${m.title?`<div class="sl" style="margin-bottom:6px;">${escH(m.title)}</div>`:''}
            <img src="${escA(m.src)}" alt="${escA(m.title||'Map')}" style="max-width:100%;max-height:860px;height:auto;display:block;margin:0 auto;border:2px solid var(--accent);">
          </div>`).join('');
      } else {
        mapsContainer.innerHTML=`<div class="map-placeholder">MAP IMAGES WILL APPEAR HERE</div>`;
      }
    }
  }

  // Stat blocks now render inline on the main page after encounters
  const sbEl=document.getElementById('p-statblocks');
  if(sbEl) sbEl.innerHTML='';
  applyGradients();
  // Run pagination after DOM has painted
  requestAnimationFrame(()=>requestAnimationFrame(paginatePages));
}

function buildSB(s) {
  const div = document.createElement('div');
  const sbtypeColors = {mob:'#0a0a0a', boss:'#333', npc:'#555'};
  div.className = 'stat-block' + (s.fullwidth ? ' full-width' : '');
  div.style.borderTopColor = sbtypeColors[s.sbtype] || sbtypeColors.mob;

  let html = '';

  // Name
  html += '<div class="sb-name">' + escH(s.name) + '</div>';

  // Flavor / Description — italic, right under name
  if(s.flavor) html += '<div class="sb-flavor">' + fmtText(s.flavor) + '</div>';

  html += '<hr class="sb-divider">';

  // AC / HP / MV on one line
  const acHpParts = [];
  if(s.hpval)   acHpParts.push('<strong>AC</strong> ' + escH(s.hpval));
  if(s.hpcount) acHpParts.push('<strong>HP</strong> ' + escH(s.hpcount));
  if(s.move)    acHpParts.push('<strong>MV</strong> ' + escH(s.move));
  if(acHpParts.length) html += '<div class="sb-stat-line">' + acHpParts.join('&ensp;|&ensp;') + '</div>';

  html += '<hr class="sb-divider">';

  // Six ability scores
  html += '<table class="sb-score-table"><tr><th>STR</th><th>DEX</th><th>CON</th><th>INT</th><th>WIS</th><th>CHA</th></tr>';
  html += '<tr>'
    + '<td>' + escH(s.str||'—') + '</td>'
    + '<td>' + escH(s.dex||'—') + '</td>'
    + '<td>' + escH(s.con||'—') + '</td>'
    + '<td>' + escH(s.int||'—') + '</td>'
    + '<td>' + escH(s.evade||'—') + '</td>'
    + '<td>' + escH(s.cha||'—') + '</td>'
    + '</tr></table>';

  html += '<hr class="sb-divider">';

  // Abilities
  if(s.abilities) {
    s.abilities.split('\n').filter(Boolean).forEach(line => {
      const ci = line.indexOf(':');
      if(ci < 0 || ci === line.length - 1) {
        html += '<span class="sb-section-label">' + escH(line.replace(':','')) + '</span>';
      } else {
        html += '<div class="sb-ability"><strong>' + escH(line.slice(0,ci)) + '.</strong> ' + fmtText(line.slice(ci+1).trim()) + '</div>';
      }
    });
  }

  // NPC notes
  if(s.isnpc && s.notes) {
    html += '<hr class="sb-divider">';
    html += s.fullwidth
      ? '<div class="sb-notes">' + fmtText(s.notes) + '</div>'
      : '<div style="font-size:8.5px;color:var(--ink);line-height:1.6;">' + fmtText(s.notes) + '</div>';
  }

  div.innerHTML = html;
  return div;
}


function applyGradients() {
  document.querySelectorAll('.sb-hp-row').forEach(row=>{
    const pips=row.querySelectorAll('.hp-pip');const total=pips.length;
    pips.forEach((pip,i)=>{
      const t=total===1?1:i/(total-1);let r,g,b=10;
      if(t<0.33){const s=t/0.33;r=170;g=Math.round(50*s);}
      else if(t<0.66){const s=(t-0.33)/0.33;r=170;g=Math.round(50+100*s);}
      else{const s=(t-0.66)/0.34;r=Math.round(170*(1-s));g=160;}
      pip.style.background=`rgb(${r},${g},${b})`;pip.style.borderColor='rgba(0,0,0,0.3)';
    });
  });
}

// Runs `capture` with the fixed 816x1056 paginated layout in force, regardless
// of whether the preview is currently in flow mode, then restores the previous
// mode. This is what guarantees HTML/PDF export is always the print layout even
// when the builder is being used on a phone. `capture` may return a Promise; the
// previous mode is restored once it settles.
function _withFixedLayout(capture) {
  const wasFlow = document.body.classList.contains('flow-mode');
  const restore = () => {
    if (wasFlow && !document.body.classList.contains('flow-mode')) {
      document.body.classList.add('flow-mode');
      paginatePages(); // no-op cleanup in flow mode
    }
  };
  if (wasFlow) {
    document.body.classList.remove('flow-mode');
    void document.body.offsetHeight; // force synchronous reflow before measuring
    paginatePages();
  }
  let result;
  try {
    result = capture();
  } catch (e) {
    restore();
    throw e;
  }
  // Promise result: restore once it settles, either way. Non-promise: restore now.
  if (result && typeof result.then === 'function') {
    return Promise.resolve(result).then(
      (v) => { restore(); return v; },
      (e) => { restore(); throw e; }
    );
  }
  restore();
  return result;
}

// Load html2canvas + jsPDF on first use (they were render-blocking in <head>).
// Failures reset the promise so a flaky connection can retry on the next click.
let _exportLibsPromise = null;
function loadExportLibs() {
  if (window.html2canvas && window.jspdf) return Promise.resolve();
  if (_exportLibsPromise) return _exportLibsPromise;
  const add = (src) => new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res;
    s.onerror = () => rej(new Error('could not load export libraries — check your connection'));
    document.head.appendChild(s);
  });
  _exportLibsPromise = Promise.all([
    add('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),
    add('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'),
  ]).catch(err => { _exportLibsPromise = null; throw err; });
  return _exportLibsPromise;
}

function captureScreenshot() {
  if (renderTimer) renderNow();   // flush any pending debounced preview rebuild
  const btn = document.getElementById('screenshot-btn');
  btn.textContent = '⏳ Capturing...';
  btn.disabled = true;

  const pages = [...document.querySelectorAll('.preview-area .page')];
  const filename = (state.title || 'adventure').replace(/[^a-z0-9]/gi, '_').toLowerCase();
  const opts = { scale: 2, useCORS: true, allowTaint: true, backgroundColor: null, logging: false };

  loadExportLibs().then(() => Promise.all(pages.map(p => html2canvas(p, opts)))).then(canvases => {
    const gap = 20;
    const totalW = Math.max(...canvases.map(c=>c.width));
    const totalH = canvases.reduce((sum,c)=>sum+c.height,0) + gap*(canvases.length-1);
    const combined = document.createElement('canvas');
    combined.width = totalW; combined.height = totalH;
    const ctx = combined.getContext('2d');
    ctx.fillStyle = '#888888';
    ctx.fillRect(0, 0, totalW, totalH);
    let y = 0;
    canvases.forEach(c => { ctx.drawImage(c, 0, y); y += c.height + gap; });
    combined.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename + '_screenshot.png';
      a.click(); URL.revokeObjectURL(url);
      btn.textContent = 'Save PNG'; btn.disabled = false;
    }, 'image/png');
  }).catch(err => {
    alert('Screenshot failed: ' + err.message);
    btn.textContent = 'Save PNG'; btn.disabled = false;
  });
}

function savePDF() {
  if (renderTimer) renderNow();   // flush any pending debounced preview rebuild
  const btn=document.getElementById('pdf-btn');
  btn.textContent='⏳ Generating...';
  btn.disabled=true;
  const filename=(state.title||'adventure').replace(/[^a-z0-9]/gi,'_').toLowerCase();

  // Force the fixed print layout for the capture (so a phone-width, flow-mode
  // session still yields a correct paginated PDF), then restore the view mode
  // once the canvases are taken.
  loadExportLibs().then(() => _withFixedLayout(() => {
    const pages=[...document.querySelectorAll('.preview-area .page')].filter(p=>p.style.display!=='none');

    // Lossless PNG at 2x was producing 25MB+ files. 1.5x JPEG is visually the
    // same on paper and lands around 1-2MB. JPEG has no alpha, so each page is
    // rasterized onto its own background color (works in light and dark mode).
    const shot = (p) => html2canvas(p, {
      scale: 1.5,
      useCORS: true,
      allowTaint: true,
      logging: false,
      backgroundColor: getComputedStyle(p).backgroundColor || '#ffffff'
    });

    return Promise.all(pages.map(shot)).then(canvases=>{
      const {jsPDF}=window.jspdf;
      const pdf=new jsPDF({orientation:'portrait',unit:'pt',format:'letter',compress:true});
      const pageW=pdf.internal.pageSize.getWidth();
      const pageH=pdf.internal.pageSize.getHeight();

      canvases.forEach((canvas,i)=>{
        if(i>0) pdf.addPage();
        const img=canvas.toDataURL('image/jpeg', 0.85);
        const ratio=Math.min(pageW/canvas.width, pageH/canvas.height);
        const w=canvas.width*ratio;
        const h=canvas.height*ratio;
        pdf.addImage(img,'JPEG',(pageW-w)/2,(pageH-h)/2,w,h,undefined,'FAST');
      });

      pdf.save(filename+'.pdf');
    });
  })).then(()=>{
    btn.textContent='Save PDF';
    btn.disabled=false;
  }).catch(err=>{
    alert('PDF generation failed: '+err.message);
    btn.textContent='Save PDF';
    btn.disabled=false;
  });
}

function _encRoleIndex() {

const ENC_EXTRA_LABELS = ['Side Chamber','Trap Room','Exploration Chamber','Secret Room','Barracks','Shrine','Prison Cells','Guard Post','Collapsed Section','Ritual Chamber'];

function _addExtraEnc(mot) {
  const label = _R(ENC_EXTRA_LABELS);
  const motifs = DUN_MOTIFS.filter(function(m){ return m !== 'none'; });
  const useMot = mot || _R(motifs);
  // Get desc from a random room pool for variety
  const pools = [DUN_R1, DUN_R2, DUN_R3];
  const pool = _R(pools);
  const entries = pool[useMot] || pool[_R(Object.keys(pool))];
  const desc = _R(entries);
  const biomePool = BIOME_ENC_TABLES[useMot];
  const biomeEnc = biomePool ? '\n\n[' + useMot + '] ' + _R(biomePool) : '';
  const subtype = ENC_SUBTYPES[label] || 'Scenic';

function randEncounterBatch() {
  const countSel = document.getElementById('enc-count');
  const motifSel = document.getElementById('enc-motif');
  const n = parseInt(countSel ? countSel.value : 1) || 1;
  const motifs = DUN_MOTIFS.filter(function(m){ return m !== 'none'; });
  const mot = (motifSel && motifSel.value !== 'random') ? motifSel.value : _R(motifs);

  const role = _encRoleIndex();
  if(role >= 0) {
    // A specific role: every room comes from that pool. The structured
    // Guardian→Climax→Reward run only makes sense for a mixed dungeon.
    for(let i = 0; i < n; i++) _addEnc(mot, role);
    readFields(); renderPreview();
    return;
  }

  if(n === 1) {
    // Single: fully random
    randEncounter();
    readFields(); renderPreview();
    return;
  }

  // Structured dungeon format: Guardian → [extras] → Boss → Reward
  // Always: Room 1=Guardian(0), last=Reward(4), second-to-last=Climax(3)
  // Middle rooms fill with Puzzle(1), Setback(2), then extra room types
  _addEnc(mot, 0); // Guardian

  const midCount = n - 3; // rooms between guardian and climax
  // Mandatory: puzzle then setback in order
  const mid = [];
  if(midCount >= 1) mid.push(1); // Puzzle
  if(midCount >= 2) mid.push(2); // Setback
  // Fill remaining middle slots with extra room types (no shuffle — keep Puzzle→Setback order)
  for(let i = mid.length; i < midCount; i++) mid.push('extra');
  mid.forEach(function(slot) {
    if(slot === 'extra') _addExtraEnc(mot);
    else _addEnc(mot, slot);
  });

  _addEnc(mot, 3); // Climax/Boss
  _addEnc(mot, 4); // Reward
  readFields(); renderPreview();
}

  const age  = _R(NPC_AGE);
  const build = _R(NPC_BUILD);
  const dress = _R(NPC_DRESS);
  const feature = _R(NPC_FEATURE);
  const demeanor = _R(DEMEANOR);
  const quirk = _R(QUIRKS);
  const want  = _R(WANTS);
  const secret = _R(SECRETS);
  const flavor = age + ', ' + build + ' ' + anc.toLowerCase() +
    '. Dressed in ' + dress + '. ' + feature.charAt(0).toUpperCase() + feature.slice(1) + '. ' +
    demeanor.charAt(0).toUpperCase() + demeanor.slice(1) + ' in manner. ' + quirk.charAt(0).toUpperCase() + quirk.slice(1) + '.';
  addStatBlock({
    sbtype: role === 'Villain' ? 'boss' : role === 'Rival' ? 'boss' : 'npc',
    name: name + ' (' + anc + ')',
    type: occ + ' — ' + role,
    ac: '', hd: '', hp: '', mv: '', atk: '',
    flavor: flavor,
    notes: 'Wants: ' + want + '\nSecret: ' + secret
  });
  autosave();
}

</script>
<button class="sidebar-pull-tab" id="sidebar-pull-tab" onclick="toggleSidebar()" title="Toggle sidebar">◀</button>



<script>


function fillMonster(m, card) {
  if(!m || !card) return;
  const g = (cls) => card.querySelector('.'+cls);
  const si = g('sb-name-input');   if(si) si.value = m.name;
  const fi = g('sb-flavor-input'); if(fi) fi.value = 'LV ' + m.lv + ' | AL ' + m.al + ' | MV ' + m.mv;
  const ac = g('sb-hp-val');       if(ac) ac.value = m.ac;
  const hp = g('sb-hp-count');     if(hp) hp.value = m.hp;
  // Movement: map to nearest option
  const mv = g('sb-move');
  if(mv) {
    const mvStr = m.mv.toLowerCase();
    if(mvStr.includes('double')) mv.value = 'Far';
    else if(mvStr.includes('far')) mv.value = 'Far';
    else if(mvStr.includes('near')) mv.value = 'Near';
    else mv.value = 'Close';
  }
  const str = g('sb-str');   if(str) str.value = m.s;
  const dex = g('sb-dex');   if(dex) dex.value = m.d;
  const con = g('sb-con');   if(con) con.value = m.c;
  const int = g('sb-int');   if(int) int.value = m.i;
  const wis = g('sb-evade'); if(wis) wis.value = m.w;
  const cha = g('sb-cha');   if(cha) cha.value = m.ch;
  const abl = g('sb-abilities-input');
  if(abl) abl.value = 'ATK: ' + m.atk + (m.notes ? '\n\n' + m.notes : '');
  // Set type radio based on LV
  const lv = parseInt(m.lv) || 0;
  const typeVal = lv >= 7 ? 'boss' : lv >= 4 ? 'boss' : 'mob';
  const radio = card.querySelector('.sb-type-radio[value="'+typeVal+'"]');
  if(radio) { radio.checked = true; updateSbCardColor(radio); }
  autosave();
}

// ── Bestiary search ───────────────────────────────────────────────────────
// Replaces the old 300-entry dropdown. The panel lives inside the stat block
// card in the sidebar rather than in a floating overlay: the sidebar goes
// full-screen on narrow viewports, so an overlay covered the preview and had to
// out-stack it. Search by name, filter by creature type, click to load.
let _hbMonsters = [];
let _monTypes = { types: [], byName: {} };

// Cached — called on every keystroke of the monster search; the merge only
// changes when homebrew re-syncs.
let _allPrepMonstersCache = null;
function allPrepMonsters() {
  return _allPrepMonstersCache || (_allPrepMonstersCache = SD_MONSTERS.concat(_hbMonsters));
}

function monsterTypeOf(m) {
  if(m && m.ctype) return m.ctype;                    // homebrew carries its own
  return _monTypes.byName[m && m.name] || 'Monster';
}

// The creature-type map is generated from the GM screen into the app; fetching
// it keeps a single copy rather than a third hand-maintained one in here.
async function syncMonsterTypes() {
  try {
    const r = await fetch('/api/monster-types', { credentials: 'same-origin' });
    if(!r.ok) return;
    const data = await r.json();
    if(Array.isArray(data.types)) _monTypes = { types: data.types, byName: data.byName || {} };
    refreshTypeDropdowns();
  } catch(e) {}
}

async function syncHomebrewMonsters() {
  let rows;
  try {
    const r = await fetch('/api/homebrew?type=monster', { credentials: 'same-origin' });
    if(!r.ok) return;
    const data = await r.json();
    rows = Array.isArray(data.items) ? data.items : [];
  } catch(e) { return; }
  const seen = new Set();
  const next = [];
  rows.forEach(row => {
    if(!row || row.type !== 'monster' || !row.data) return;
    const d = row.data;
    const nm = String(d.name || '').trim();
    if(!nm || seen.has(nm.toLowerCase())) return;
    seen.add(nm.toLowerCase());
    next.push({
      name: nm,
      ac: String(d.ac||''), hp: String(d.hp||''), atk: String(d.atk||''),
      mv: String(d.mv||''), lv: String(d.lv||''), al: String(d.al||''),
      s: String(d.s||''), d: String(d.d||''), c: String(d.c||''),
      i: String(d.i||''), w: String(d.w||''), ch: String(d.ch||''),
      notes: String(d.notes||''), ctype: String(d.ctype||'Monster'), homebrew: true
    });
  });
  _hbMonsters = next;
  _allPrepMonstersCache = null;   // merged array is cached — see allPrepMonsters()
  refreshTypeDropdowns();
}

// Options for the Type dropdown. Built from whatever is known right now, so a
// freshly-added card is already populated — the list is fetched at startup, not
// when the search is first used.
function monsterTypeOptions() {
  const pool = allPrepMonsters();
  const present = [];
  (_monTypes.types || []).forEach(function(t) {
    for(let i = 0; i < pool.length; i++) {
      if(monsterTypeOf(pool[i]) === t) { present.push(t); return; }
    }
  });
  pool.forEach(function(m) {                       // homebrew may add its own
    const t = monsterTypeOf(m);
    if(t && present.indexOf(t) === -1) present.push(t);
  });
  let html = '<option value="">All Types</option>';
  present.forEach(function(t) { html += '<option value="' + escA(t) + '">' + escH(t) + '</option>'; });
  return html;
}

// Refresh every card's dropdown once the type list or homebrew arrives, keeping
// each card's current selection.
function refreshTypeDropdowns() {
  const html = monsterTypeOptions();
  document.querySelectorAll('.mon-pick-type').forEach(function(sel) {
    const keep = sel.value;
    sel.innerHTML = html;
    sel.value = keep || '';
  });
}

function hideMonsterResults(card) {
  if(!card) return;
  const out = card.querySelector('.mon-pick-list');
  if(out) { out.classList.remove('show'); out.innerHTML = ''; }
}

// Renders every match — the list scrolls rather than being cut off at 60.
function renderMonsterResults(card) {
  if(!card) return;
  const out = card.querySelector('.mon-pick-list');
  if(!out) return;
  const searchEl = card.querySelector('.mon-pick-search');
  const typeEl = card.querySelector('.mon-pick-type');
  const q = (searchEl && searchEl.value ? searchEl.value : '').trim().toLowerCase();
  const wantType = typeEl && typeEl.value ? typeEl.value : '';

  const found = allPrepMonsters().filter(function(m) {
    if(wantType && monsterTypeOf(m) !== wantType) return false;
    if(q && String(m.name).toLowerCase().indexOf(q) === -1) return false;
    return true;
  }).sort(function(a, b) { return String(a.name).localeCompare(String(b.name)); });

  let html = '';
  if(!found.length) {
    html = '<div class="mon-pick-empty">No monster matches.</div>';
  } else {
    found.forEach(function(m) {
      html += '<button type="button" class="mon-pick-item' + (m.homebrew ? ' hb' : '') + '" data-mon="'
           + escA(m.name) + '">' + escH(m.name) + '</button>';
    });
  }
  out.innerHTML = html;
  out.classList.add('show');
  out.scrollTop = 0;
}

// Delegated off document so every card works — including ones added later or
// rebuilt when a saved session loads.
document.addEventListener('click', function(e) {
  const t = e.target;
  if(!t || !t.closest) return;

  const goBtn = t.closest('.mon-pick-go');
  if(goBtn) { e.preventDefault(); renderMonsterResults(goBtn.closest('.entity-card')); return; }

  const item = t.closest('.mon-pick-item');
  if(item) {
    e.preventDefault();
    const card = item.closest('.entity-card');
    const name = item.getAttribute('data-mon');
    const m = allPrepMonsters().find(function(x) { return x.name === name; });
    if(m && card) fillMonster(m, card);
    hideMonsterResults(card);        // loading a monster closes the search
    return;
  }
});

document.addEventListener('input', function(e) {
  const box = e.target && e.target.closest ? e.target.closest('.mon-pick-search') : null;
  if(box) renderMonsterResults(box.closest('.entity-card'));
});

document.addEventListener('change', function(e) {
  const sel = e.target && e.target.closest ? e.target.closest('.mon-pick-type') : null;
  if(sel) renderMonsterResults(sel.closest('.entity-card'));
});

// Cards restored from a saved session are built by an earlier script block, so
// fill their Type dropdowns now that this one has defined the helper.
refreshTypeDropdowns();

if(document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => { refreshTypeDropdowns(); syncHomebrewMonsters(); syncMonsterTypes(); });
} else { syncHomebrewMonsters(); syncMonsterTypes(); }

</script>

</body>
</html>
