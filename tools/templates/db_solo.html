<!DOCTYPE html>
<html lang="en">
<head>
<!-- SOLO PLAY — Dragonbane solo campaign page. Part of the removable Solo Play
     feature (see SOLO-REMOVAL.md). Served by app/solo/[id]/route.ts; saved as a
     Document of tool "db-solo" under the "db_solo" key. No Google Fonts: the
     faces come from /tokens.css via the injected head, like every sheet. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dragonbane Solo Campaign</title>
<script src="/tools-data/db-data.js"></script>
<script src="/tools-data/db-gm-tables.js"></script>
<script src="/tools-data/solo/db-solo-tables.js"></script>
<script src="/tools-data/solo/db-solo-deepfall.js"></script>
<script src="/tools-data/solo/db-solo-sinking-tower.js"></script>
<style>
:root{
  --f-disp:"Hideout","EB Garamond",ui-serif,Georgia,serif;
  --f-label:"Minion Pro","EB Garamond",ui-serif,Georgia,serif;
  --f-ui:"EB Garamond",ui-serif,Georgia,serif;
  --bg:#e8e6e2;--card:#fbfbfa;--box:#f0eeeb;--ink:#1d1b19;--muted:#5f5b55;--rule:#cbc7c0;
  --acc:#236855;--acc-dk:#1e5842;--acc-lt:#dce9e3;--gold:#8a6a1f;--gold-lt:#c9a14a;--red:#b3261e;--green:#2f7a46;
  --input-bg:#fff;--input-border:#aaa49a;--shadow:0 2px 8px rgba(20,20,20,.08);
}
body.dark{
  --bg:#141417;--card:#22222a;--box:#28282e;--ink:#e9e7e3;--muted:#9b988f;--rule:#3a3a41;
  --acc:#236855;--acc-dk:#5cb894;--acc-lt:#1f3a30;--gold:#c9a14a;--gold-lt:#e2c37a;--red:#e0614f;--green:#5fae76;
  --input-bg:#171719;--input-border:#3a3a41;--shadow:0 2px 8px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--f-ui);font-variant-numeric:lining-nums;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;font-size:16px;}
button,input,select,textarea{font-family:var(--f-ui);font-size:15px;}
.so-app{flex:none;display:flex;min-height:0;height:calc(100vh - var(--dd-bar-h,52px));}
.so-pane{width:460px;flex-shrink:0;overflow-y:auto;padding:14px 14px 40px;border-right:2px solid var(--acc);}
.so-sheet{flex:1;min-width:0;position:relative;background:var(--bg);display:flex;flex-direction:column;}
.so-frames{flex:1;position:relative;min-height:0;}
.so-frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg);}
.so-heroes{display:flex;gap:4px;padding:6px 8px 0;background:var(--bg);border-bottom:2px solid var(--acc);overflow-x:auto;flex:none;}
.so-heroes .hero{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:96px;padding:6px 12px 7px;border:1px solid var(--rule);border-bottom:0;border-radius:8px 8px 0 0;background:var(--box);color:var(--muted);cursor:pointer;font-family:var(--f-label);font-size:13px;letter-spacing:.03em;}
.so-heroes .hero.on{background:var(--card);color:var(--acc-dk);border-color:var(--acc);font-weight:700;}
.so-heroes .hero i{display:block;height:3px;width:100%;border-radius:2px;background:linear-gradient(90deg,var(--green) var(--hp),var(--rule) var(--hp));}
.so-heroes .hero em{font-style:normal;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--red);}
.so-heroes .hero.dead{opacity:.6;}
.so-sheet .so-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;color:var(--muted);}
.so-tabs{display:none;}
@media (max-width:900px){
  .so-app{flex-direction:column;height:auto;min-height:calc(100vh - var(--dd-bar-h,52px));}
  .so-pane{width:100%;border-right:0;padding-bottom:90px;}
  .so-sheet{height:calc(100vh - var(--dd-bar-h,52px) - 56px);}
  body.party .so-tabs button[data-tab="sheet"]::after{content:" · " attr(data-who);}
  body[data-tab="adventure"] .so-sheet{display:none;}
  body[data-tab="sheet"] .so-pane{display:none;}
  .so-tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:2px solid var(--acc);}
  .so-tabs button{flex:1;padding:14px 4px;background:none;border:0;color:var(--muted);font-family:var(--f-label);letter-spacing:.08em;text-transform:uppercase;font-size:13px;}
  .so-tabs button.on{color:var(--acc-dk);font-weight:700;}
}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px 7px;border-bottom:1px solid var(--rule);}
.card-h h2,.card-h h3{font-family:var(--f-disp);font-weight:400;color:var(--acc-dk);letter-spacing:.04em;}
.card-h h2{font-size:21px;} .card-h h3{font-size:17px;}
.card-b{padding:10px 12px 12px;}
.lbl{font-family:var(--f-label);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.muted{color:var(--muted);} .small{font-size:13.5px;} .tiny{font-size:12px;}
.read{font-style:italic;line-height:1.5;border-left:3px solid var(--gold-lt);padding:2px 0 2px 10px;margin:6px 0 8px;}
p{line-height:1.45;margin:4px 0;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--acc);background:transparent;color:var(--acc-dk);border-radius:7px;padding:6px 11px;cursor:pointer;font-family:var(--f-label);font-size:13px;letter-spacing:.03em;line-height:1.1;}
.btn:hover{background:var(--acc-lt);}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc-dk);} .btn.pri:hover{filter:brightness(1.12);}
.btn.warn{border-color:var(--red);color:var(--red);} .btn.warn:hover{background:rgba(179,38,30,.1);}
.btn.ghost{border-color:var(--rule);color:var(--muted);}
.btn:disabled{opacity:.45;cursor:default;}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.stack{display:flex;flex-direction:column;gap:8px;}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--rule);border-radius:999px;padding:1px 9px;font-size:13px;background:var(--box);}
.chip.bad{border-color:var(--red);color:var(--red);}
.chip .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:11px;line-height:1;padding:0 0 0 3px;}
.chip .x:hover{color:var(--red);}
.chip.good{border-color:var(--green);color:var(--green);}
/* character strip */
.pc{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.pc-name{font-weight:700;font-size:18px;}
.bar{position:relative;height:20px;border-radius:5px;background:var(--box);border:1px solid var(--rule);overflow:hidden;min-width:96px;flex:1;}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--green);} .bar.wp i{background:#3f7fbf;}
.bar span{position:relative;z-index:1;font-size:12px;padding-left:6px;line-height:19px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);white-space:nowrap;}
/* route */
.route{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 10px;}
.route .wp{flex:1 1 0;min-width:34px;text-align:center;font-size:11px;font-family:var(--f-label);padding:5px 2px;border-radius:6px;border:1px solid var(--rule);background:var(--box);color:var(--muted);cursor:default;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.route .wp.done{background:var(--acc-lt);color:var(--acc-dk);}
.route .wp.cur{border-color:var(--acc);border-width:2px;color:var(--ink);font-weight:700;}
.route .wp.obj{border-style:double;border-width:3px;}
.route .wp.sunk{background:repeating-linear-gradient(135deg,rgba(63,127,191,.28) 0 6px,transparent 6px 12px);}
.sink{background:rgba(63,127,191,.12);border:1px solid #3f7fbf;border-radius:8px;padding:8px 10px;margin:6px 0;}
.score-big{font-family:var(--f-disp);font-size:26px;color:var(--acc-dk);}
/* challenges */
.ch{border:1px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--box);}
.ch.ok{border-color:var(--green);} .ch.fail{border-color:var(--red);}
.ch-h{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.ch-h b{font-weight:700;}
.res{margin-top:5px;font-size:14px;}
.res.ok{color:var(--green);} .res.fail{color:var(--red);}
.secret{border:1px dashed var(--gold-lt);border-radius:8px;padding:7px 10px;font-size:14px;}
.sug{font-family:var(--f-label);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);}
/* threat clock */
.clock{display:flex;gap:5px;margin:6px 0;}
.clock span{width:30px;height:30px;border-radius:7px;border:2px solid var(--rule);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted);}
.clock span.on{background:var(--red);border-color:var(--red);color:#fff;}
.trig{background:rgba(179,38,30,.12);border:1px solid var(--red);border-radius:8px;padding:8px 10px;margin:6px 0;}
/* tools */
.tabs{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:8px;}
.tabs button{border:1px solid var(--rule);background:var(--box);color:var(--muted);border-radius:6px;padding:4px 8px;font-family:var(--f-label);font-size:12px;cursor:pointer;}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff;}
.out{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--box);border:1px solid var(--rule);min-height:20px;}
.out b.big{font-size:20px;}
select,input[type=text],input[type=number],textarea{background:var(--input-bg);color:var(--ink);border:1px solid var(--input-border);border-radius:6px;padding:5px 8px;}
textarea{width:100%;min-height:54px;resize:vertical;}
/* journal */
.jr{display:flex;flex-direction:column;gap:6px;height:240px;overflow-y:auto;padding:2px 4px 2px 0;}
.jr .new{background:var(--acc-lt);border-radius:0 6px 6px 0;padding-top:4px;padding-bottom:4px;}
.jr .st.new{font-size:16.5px;}
/* status bar */
.status .card-b{padding:9px 12px 10px;}
.st-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--f-disp);font-size:17px;color:var(--acc-dk);}
.st-h b{font-weight:400;letter-spacing:.04em;}
.status .route{margin:6px 0 6px;}
.st-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;}
.st-cell{display:flex;flex-direction:column;gap:2px;}
.st-cell .clock{margin:0;gap:4px;} .st-cell .clock span{width:24px;height:24px;font-size:13px;border-radius:6px;}
.st-score{margin-left:auto;align-items:flex-end;} .st-score .score-big{line-height:1;}
.sink-n{font-size:14px;color:#3f7fbf;font-weight:600;}
/* the scene */
.wyd{margin-top:10px;padding-top:10px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:6px;}
.wyd-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--f-disp);font-size:17px;color:var(--acc-dk);letter-spacing:.04em;}
.hchip{cursor:pointer;font-family:var(--f-label);} .hchip.on{background:var(--acc);border-color:var(--acc);color:#fff;}
.danger{border:2px solid var(--red);border-radius:8px;padding:8px 10px;background:rgba(179,38,30,.07);display:flex;flex-direction:column;gap:6px;}
.dg-h{font-family:var(--f-label);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);font-weight:700;}
.jr .st{font-style:italic;line-height:1.5;margin:2px 0;padding-left:10px;border-left:3px solid var(--gold-lt);}
.jr .sh{font-family:var(--f-label);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc-dk);margin-top:8px;padding-top:6px;border-top:1px solid var(--rule);}
.jr .sh span{text-transform:none;letter-spacing:0;color:var(--muted);font-family:var(--f-ui);font-size:13px;}
.jr .ln{font-size:12.5px;color:var(--muted);padding-left:10px;border-left:3px solid var(--rule);}
.jr .ln b{font-weight:600;color:var(--ink);}
.jr .ln.k-score{border-color:var(--gold);color:var(--gold);} .jr .ln.k-score b{color:var(--gold);}
.jr .ln.k-roll{border-color:var(--acc);} .jr .ln.k-threat{border-color:var(--red);} .jr .ln.k-combat{border-color:#b56a1f;} .jr .ln.k-note{border-color:var(--gold-lt);}
/* scroll bars in the page's colours */
*{scrollbar-width:thin;scrollbar-color:var(--acc) transparent;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--acc);border-radius:8px;border:2px solid var(--bg);}
::-webkit-scrollbar-thumb:hover{background:var(--acc-dk);}
::-webkit-scrollbar-corner{background:transparent;}
/* combat */
.foe{border:1px solid var(--rule);border-radius:8px;padding:7px 9px;background:var(--box);}
.foe.dead{opacity:.45;} .foe.turn{border-color:#b56a1f;border-width:2px;}
.foe-h{display:flex;justify-content:space-between;gap:6px;align-items:center;}
.cards{display:inline-flex;gap:3px;}
.cardn{display:inline-flex;align-items:center;justify-content:center;width:20px;height:26px;border-radius:3px;background:#f1e7cc;color:#1b1a17;border:1px solid #b89a4e;font-weight:700;font-size:13px;}
.cardn.used{opacity:.35;}
.order{display:flex;flex-direction:column;gap:3px;margin:6px 0;}
.order div{display:flex;gap:8px;align-items:center;padding:3px 6px;border-radius:6px;font-size:14px;}
.order div.cur{background:rgba(181,106,31,.16);font-weight:700;}
.order div.past{opacity:.5;}
.attack{border:1px solid #b56a1f;border-radius:8px;padding:8px 10px;margin:6px 0;background:rgba(181,106,31,.08);}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:14px;}
.dlg.open{display:flex;}
.dlg-b{background:var(--card);color:var(--ink);border-radius:12px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;padding:16px;border:1px solid var(--rule);}
.dlg-b h3{font-family:var(--f-disp);font-weight:400;color:var(--acc-dk);font-size:20px;margin-bottom:8px;}
.list{display:flex;flex-direction:column;gap:6px;}
.list button{text-align:left;justify-content:flex-start;}
.mission{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--box);}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1f1f24;color:#eee;padding:8px 14px;border-radius:8px;font-size:14px;z-index:120;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;}
.toast.on{opacity:1;}
</style>
</head>
<body data-tab="adventure">
<div class="so-app">
  <section class="so-pane" id="so-pane"><div id="so-root"></div></section>
  <section class="so-sheet" id="so-sheet"><div class="so-heroes" id="so-heroes" style="display:none"></div><div class="so-frames" id="so-frames"><div class="so-empty" id="so-sheet-empty">Choose your heroes to play.</div></div></section>
</div>
<nav class="so-tabs"><button data-tab="adventure" class="on">Adventure</button><button data-tab="sheet">Character Sheet</button></nav>
<div class="dlg" id="dlg"><div class="dlg-b" id="dlg-b"></div></div>
<div class="toast" id="toast"></div>
<script>
/* ═══ Dragonbane SOLO CAMPAIGN ══════════════════════════════════════════════
   Runs "Alone in Deepfall Breach"-style solo play entirely in the browser: the
   Fortune Chart, Inspiration, threat clock, waypoints (authored + generated),
   suggested challenges, solo combat with automatic monster/NPC turns, and a
   journal. The player's own sheet is embedded on the right (?embed=1&solo=1)
   and talks to this page through postMessage (the SOLO PLAY BRIDGE block at the
   end of db_character_sheet.html), so every roll uses the sheet's real skills,
   boons/banes, push and armor.
   Part of the removable Solo Play feature — see SOLO-REMOVAL.md. */
(function(){
"use strict";
var T=window.DB_SOLO_TABLES||{}, MODS=window.DB_SOLO_MODULES||[];
var $=function(id){ return document.getElementById(id); };
var A=function(x){ return Array.isArray(x)?x:[]; };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function d(n){ return 1+Math.floor(Math.random()*n); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function rollExpr(expr){ // "2D6", "D4+2", "2D8+D4"
  var total=0, parts=[]; String(expr||'').toUpperCase().replace(/\s+/g,'').split('+').forEach(function(t){ if(!t) return;
    var m=/^(\d*)D(\d+)$/.exec(t); if(m){ var n=+(m[1]||1), s=+m[2], r=[]; for(var i=0;i<n;i++) r.push(d(s)); var sum=r.reduce(function(a,b){ return a+b; },0); total+=sum; parts.push(n+'d'+s+'('+r.join(',')+')'); }
    else if(/^\d+$/.test(t)){ total+=+t; parts.push(t); } });
  return {total:total,text:parts.join(' + ')}; }
function toast(t){ var el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(function(){ el.classList.remove('on'); },2600); }
function uid(){ return Math.random().toString(36).slice(2,9); }

// ── state ──────────────────────────────────────────────────────────────────
var KEY='db_solo';
var S=(function(){ var raw=(window.__ddState||{})[KEY]; var o={}; try{ o=typeof raw==='string'?JSON.parse(raw):(raw||{}); }catch(e){ o={}; } return o; })();
S.v=1; S.name=S.name||'Solo campaign'; S.moduleId=S.moduleId||'db-deepfall';
S.journal=A(S.journal); S.done=S.done||{}; S.m=S.m||null; S.combat=S.combat||null; S.army=!!S.army;
S.summary=S.summary||{};
var MOD=MODS.find(function(m){ return m.id===S.moduleId; })||MODS[0];
// Module wording: a one-shot adventure renames the Breach/chapel words (module.labels).
function L(k,def){ return (MOD&&MOD.labels&&MOD.labels[k])||def; }
function mTitle(i){ var mi=MOD.missions[i]; return MOD.missions.length>1?'Mission '+(i+1)+': '+mi.title:mi.title; }
// ── party (1–4 heroes) ──────────────────────────────────────────────────────
// S.party = [{id,name}] — a lone hero is a party of one. S.acting is the hero who acts
// now (rolls, items); S.character mirrors party[0] for older saves and the campaign cards.
var PCS={}, PC=null; // latest sheet snapshot per hero; PC = the acting hero's
if(!Array.isArray(S.party)) S.party=S.character?[S.character]:[];
S.party=S.party.filter(function(p){ return p&&p.id; }).slice(0,4);
if(!S.acting||!S.party.some(function(p){ return p.id===S.acting; })) S.acting=S.party[0]?S.party[0].id:null;
if(typeof S.marks==='number'){ var _mk=S.marks; S.marks={}; if(_mk&&S.party[0]) S.marks[S.party[0].id]=_mk; }
S.marks=S.marks||{};
function syncChar(){ S.character=S.party[0]||null; }
syncChar();
function solo(){ return S.party.length<=1; }
function heroName(id){ var p=S.party.find(function(x){ return x.id===id; }); var s=PCS[id]; return (s&&s.name)||(p&&p.name)||'Hero'; }
function aliveHeroes(){ return S.party.map(function(p){ return p.id; }).filter(function(id){ var s=PCS[id]; return !(s&&s.dead); }); }
function marksLeft(){ return Object.keys(S.marks).reduce(function(t,k){ return t+(S.marks[k]||0); },0); }
var saveT=null;
function save(){ refreshSummary(); if(saveT) clearTimeout(saveT); saveT=setTimeout(function(){ saveT=null; try{ if(window.__ddSave){ var o={}; o[KEY]=JSON.stringify(S); window.__ddSave(o); } }catch(e){} },500); }
function refreshSummary(){
  var mi=S.m?MOD.missions[S.m.idx]:null;
  var one=MOD.missions.length===1, cw=S.m&&S.m.wps&&S.m.wps[S.m.cur];
  S.summary={ module:MOD?MOD.title:'', mission:mi&&!one?mTitle(S.m.idx):'', party:S.party.map(function(p){ return p.name; }),
    progress: !S.party.length?'No heroes chosen': !S.m? (one?(S.done[MOD.missions[0].id]==='won'?'Adventure complete':S.done[MOD.missions[0].id]==='lost'?'Party lost':'Not started'):(Object.keys(S.done).length+' of '+MOD.missions.length+' missions done')) :
      S.m.status==='briefing'?'Briefing': S.m.status==='won'?(S.m.drowned?'Party lost':one?'Adventure complete':'Mission complete'):
      ((mi&&mi.hideRoute&&cw?('At '+cw.name):('Waypoint '+Math.min(S.m.cur+1,S.m.wps.length)+' of '+S.m.wps.length))+(mi&&mi.scoring?' · score '+scoreTotal():'')+(S.combat?' · in combat':'')) };
}
function jlog(k,h,x){ S.journal.unshift({t:Date.now(),k:k,h:h,x:x||''}); if(S.journal.length>1000) S.journal.length=1000; }
// The Story: narration (read-aloud text, outcomes, story beats) between the mechanical lines.
function story(x){ if(x) jlog('story','',String(x)); }

// ── the embedded sheets (one per hero, bridge) ─────────────────────────────
var frames={}, reqs={}, ORIGIN=window.location.origin;
function mountSheets(){
  var host=$('so-frames'), ids=S.party.map(function(p){ return p.id; });
  Object.keys(frames).forEach(function(id){ if(ids.indexOf(id)<0){ frames[id].remove(); delete frames[id]; delete PCS[id]; } });
  $('so-sheet-empty').style.display=ids.length?'none':'';
  ids.forEach(function(id){ if(frames[id]) return; var f=document.createElement('iframe'); f.title='Character sheet'; f.src='/tools/db-character/'+encodeURIComponent(id)+'?embed=1&solo=1'; host.appendChild(f); frames[id]=f; });
  PC=PCS[S.acting]||null; showSheet(); renderHeroTabs(); }
function showSheet(){ Object.keys(frames).forEach(function(id){ var on=id===S.acting; frames[id].style.visibility=on?'visible':'hidden'; frames[id].style.zIndex=on?'1':'0'; }); }
function setActing(id,quiet){ if(!id||!frames[id]) return; S.acting=id; PC=PCS[id]||null; showSheet(); renderHeroTabs(); if(!quiet) render(); }
function renderHeroTabs(){ var el=$('so-heroes'); if(!el) return;
  if(solo()){ el.style.display='none'; document.body.classList.remove('party'); return; }
  document.body.classList.add('party'); el.style.display=''; var tb=document.querySelector('.so-tabs [data-tab="sheet"]'); if(tb) tb.dataset.who=heroName(S.acting);
  el.innerHTML=S.party.map(function(p){ var s=PCS[p.id], hp=s&&s.hpMax?Math.max(0,Math.min(100,s.hp/s.hpMax*100)):100;
    return '<button type="button" class="hero'+(p.id===S.acting?' on':'')+(s&&s.dead?' dead':'')+'" data-a="hero" data-id="'+esc(p.id)+'" title="Show '+esc(heroName(p.id))+'\'s sheet"><span>'+esc(heroName(p.id))+'</span><i style="--hp:'+hp+'%"></i>'+(s&&s.dead?'<em>dead</em>':s&&s.hp<=0?'<em>dying</em>':'')+'</button>'; }).join(''); }
function send(cmd,extra,cb,who){ var f=frames[who||S.acting]; if(!f||!f.contentWindow){ toast('The character sheet is still loading'); return; }
  var m=Object.assign({src:'db-solo',cmd:cmd},extra||{}); if(cb){ m.req=uid(); reqs[m.req]=cb; }
  f.contentWindow.postMessage(m, ORIGIN); }
window.addEventListener('message',function(e){
  if(e.origin!==ORIGIN) return; var id=Object.keys(frames).find(function(k){ return frames[k].contentWindow===e.source; }); if(!id) return;
  var m=e.data||{}; if(m.src!=='db-sheet') return;
  if(m.kind==='state'){ var first=!PCS[id]; PCS[id]=m; if(id===S.acting) PC=m;
    var p=S.party.find(function(x){ return x.id===id; }); if(p&&m.name&&p.name!==m.name){ p.name=m.name; syncChar(); save(); }
    if(solo()&&m.armyOfOne&&!S.army){ S.army=true; save(); }
    renderHeroTabs(); if(first&&id===S.acting) render(); return; }
  if(m.kind==='roll'){ onRoll(m); return; }
  if(m.kind==='damage'){ onPlayerDamage(m,id); return; }
});
function onRoll(m){
  var cb=m.req&&reqs[m.req]; if(cb){ delete reqs[m.req]; lastReq={cb:cb,label:m.label}; cb(m); return; }
  // a push re-rolls the last requested roll: hand the new result to the same handler
  if(m.pushed&&lastReq&&lastReq.label===m.label.replace(/^Push · /,'')){ lastReq.cb(m); return; }
  if(m.label&&!/^(Death Roll|Fear)/.test(m.label)) { jlog('roll',m.label,(m.dragon?'Dragon!':m.demon?'Demon!':m.ok?'Success':'Failure')+' ('+m.roll+' vs '+m.target+')'); save(); renderJournal(); }
}
var lastReq=null;
// spec: {skill|attr, boons, banes, label}; who = a hero id (default: the acting hero, whose sheet is shown)
function rollSheet(spec,cb,who){ who=who||S.acting;
  if(!PCS[who]){ toast('Waiting for '+heroName(who)+'\'s sheet…'); return; }
  if(who!==S.acting) setActing(who,true);
  send('roll',spec,function(r){ cb&&cb(r); },who);
}
// roll the same thing for several heroes, one after another: done(results[])
function rollEach(ids,spec,done){ var out=[], i=0; (function next(){ if(i>=ids.length){ done(out); return; } var id=ids[i++]; rollSheet(spec,function(r){ r.hero=id; out.push(r); setTimeout(next,450); },id); })(); }
function word(r){ return r.dragon?'Dragon!':r.demon?'Demon!':r.ok?'Success':'Failure'; }

// ── rendering ──────────────────────────────────────────────────────────────
// Before play: the party (and the hub / briefing). In play: one status bar (progress,
// clock, score), the fight if there is one, then the scene — the Story with the newest
// beat at the bottom, and "What do you do?".
var UI={};
function render(){
  var r=$('so-root'); var h='';
  if(!S.party.length) h+=partyCard(true);
  else if(!S.m) h+=hubCard()+partyCard(false);
  else if(S.m.status==='briefing') h+=briefingCard();
  else if(S.m.status==='won') h+=debriefCard();
  else h+=statusBar()+sceneCard();
  r.innerHTML=h; renderJournal(); renderHeroTabs();
  if(!S.m||!S.party.length) loadChars();
}
// The party is chosen in the New Solo Campaign pop-up and stays fixed for the campaign.
// Only an older campaign that never chose anyone gets a one-time picker here.
function partyCard(first){
  if(!first){ return '<div class="card"><div class="card-h"><h3>'+(solo()?'Your hero':'Your party')+'</h3><span class="tiny muted">'+(solo()?'Solo rules':S.party.length+' heroes')+'</span></div><div class="card-b"><div class="row">'+
    S.party.map(function(p){ return '<span class="chip">'+esc(heroName(p.id))+'</span>'; }).join('')+'</div><p class="tiny muted" style="margin-top:6px">Set when the campaign was created.</p></div></div>'; }
  UI.pick=UI.pick||[];
  var h='<div class="card"><div class="card-h"><h3>Choose your heroes</h3><span class="tiny muted">'+UI.pick.length+' of 4</span></div><div class="card-b">';
  h+='<p class="small">Up to four of your Dragonbane characters, chosen once for this campaign. One hero plays by the solo rules; a party plays like the book: fights grow with the party.</p>';
  h+='<div id="so-chars" class="row" style="margin-top:8px">'+charButtons()+'</div>';
  h+='<div class="row" style="margin-top:10px"><button class="btn pri" data-a="party-set"'+(UI.pick.length?'':' disabled')+'>Set the party</button></div>';
  return h+'</div></div>';
}
var CH_LIST=null;
function charButtons(){ if(!CH_LIST) return '<span class="muted small">Loading your characters…</span>'; if(!CH_LIST.length) return '<span class="muted small">You have no Dragonbane characters yet. Create one from the Characters page.</span>';
  var pk=UI.pick||[], full=pk.length>=4; return CH_LIST.map(function(c){ var on=pk.indexOf(c.id)>=0; return '<button class="btn'+(on?' pri':'')+'" data-a="pick" data-id="'+esc(c.id)+'" data-name="'+esc(c.title)+'" aria-pressed="'+on+'"'+(!on&&full?' disabled':'')+'>'+(on?'✓ ':'+ ')+esc(c.title)+'</button>'; }).join(''); }
function loadChars(){ if(CH_LIST||S.party.length) return;
  fetch('/api/documents?tool=db-character',{credentials:'same-origin'}).then(function(r){ return r.ok?r.json():[]; }).then(function(list){ CH_LIST=A(list); var el=$('so-chars'); if(el) el.innerHTML=charButtons(); }).catch(function(){}); }
function hubCard(){
  var h='<div class="card"><div class="card-h"><h3>'+esc(MOD.intro.title)+'</h3></div><div class="card-b">';
  h+='<p class="read">'+esc(MOD.intro.text)+'</p>';
  h+='<div class="lbl" style="margin-top:8px">'+esc(MOD.hub.name)+'</div><p class="small">'+esc(MOD.hub.text)+'</p>';
  h+='<div class="lbl" style="margin-top:10px">'+esc(L('missions','Missions'))+'</div><div class="stack" style="margin-top:4px">';
  MOD.missions.forEach(function(mi,i){ var st=S.done[mi.id];
    h+='<div class="mission"><div><b>'+(MOD.missions.length>1?(i+1)+'. ':'')+esc(mi.title)+'</b><div class="tiny muted">'+esc(mi.objective)+'</div></div>'+
      '<div class="row">'+(st==='won'?'<span class="chip good">Done</span>':st==='lost'?'<span class="chip bad">Lost</span>':'')+'<button class="btn '+(st?'ghost':'pri')+'" data-a="brief" data-i="'+i+'">'+(st?'Replay':'Begin')+'</button></div></div>'; });
  h+='</div>';
  if(marksLeft()>0) h+='<p class="small" style="margin-top:10px"><b>'+marksLeft()+' advancement marks</b> still to place — see the Debrief.</p>';
  if(A(MOD.allies).length) h+='<div class="lbl" style="margin-top:10px">'+esc(L('allies','Allies & places'))+'</div>'+A(MOD.allies).map(function(a){ return '<p class="small"><b>'+esc(a.name)+'</b> — '+esc(a.note)+(a.stats?'<br><span class="tiny muted">'+esc(a.stats)+'</span>':'')+'</p>'; }).join('');
  return h+'</div></div>';
}
function briefingCard(){
  var mi=MOD.missions[S.m.idx];
  var h='<div class="card"><div class="card-h"><h3>'+esc(mTitle(S.m.idx))+'</h3><button class="btn ghost" data-a="hub">Back</button></div><div class="card-b">';
  h+='<p class="read">'+esc(mi.briefing)+'</p><p><b>Objective:</b> '+esc(mi.objective)+'</p>';
  h+='<p><b>'+esc(L('threat','Threat'))+':</b> '+esc(mi.threat.text)+' <i>At 6: '+esc(mi.threat.trigger)+'</i></p>';
  A(mi.notes).forEach(function(n){ h+='<p class="small"><b>'+esc(n[0])+'.</b> '+esc(n[1])+'</p>'; });
  if(mi.hideRoute) h+=(mi.routeNote?'<p class="small muted" style="margin-top:8px">'+esc(mi.routeNote)+'</p>':'');
  else h+='<div class="lbl" style="margin-top:8px">'+esc(L('route','Ingolfr\'s waypoints'))+'</div><ol class="small" style="margin:4px 0 0 20px">'+mi.waypoints.map(function(w){ return '<li>'+(w.unknown?'<i class="muted">Unknown</i>':esc(w.name))+'</li>'; }).join('')+'</ol>';
  h+='<div class="row" style="margin-top:12px"><button class="btn pri" data-a="enter">'+esc(L('enter','Enter the Breach'))+'</button></div>';
  return h+'</div></div>';
}
function curMission(){ return S.m?MOD.missions[S.m.idx]:null; }
function curWp(){ return S.m&&S.m.wps[S.m.cur]; }
function wpDef(w){ var mi=curMission(); return w&&w.def?mi.waypoints.find(function(x){ return x.id===w.def; }):null; }
function wpName(w){ return w.unknown?(w.gen?w.gen.area:'Unknown waypoint'):w.name; }
// One bar for where you are: the mission, the route, the clock (or the sinking) and the
// score. All of it runs itself — the page moves the clock and counts the points.
function statusBar(){
  var mi=curMission(), t=S.m.threat, h='<div class="card status"><div class="card-b">';
  h+='<div class="st-h"><b>'+esc(mTitle(S.m.idx))+'</b>'+(S.m.objective?'<span class="chip good">Objective done</span>':'')+'</div>';
  h+='<div class="tiny muted">'+esc(mi.objective)+'</div>';
  // A branching adventure (hideRoute) shows only the places you have been, in book order.
  var wps=S.m.wps.map(function(w,i){ return {w:w,i:i}; }).filter(function(x){ return !mi.hideRoute||x.w.visited; });
  h+='<div class="route">'+wps.map(function(x){ var w=x.w, i=x.i, sunk=S.m.flags&&S.m.flags['sunk:'+w.def];
    var cls='wp'+((mi.hideRoute?i!==S.m.cur:(i<S.m.cur||w.done))?' done':'')+(i===S.m.cur?' cur':'')+(w.objective&&!mi.hideRoute?' obj':'')+(sunk?' sunk':'');
    var nm=w.unknown&&!w.gen?'?':(w.gen?w.gen.area:(w.short||w.name)); return '<div class="'+cls+'" title="'+esc(nm)+(sunk?' — under water':'')+'">'+(mi.hideRoute?'':(i+1)+'. ')+esc(nm)+'</div>'; }).join('')+'</div>';
  h+='<div class="st-row">';
  if(S.m.sink){ var left=A(mi.sink.order).filter(function(id){ return !S.m.flags['sunk:'+id]; }).length;
    h+='<div class="st-cell"><span class="lbl">'+esc(mi.sink.title||'Sinking')+'</span><span class="sink-n">Round '+S.m.sink.round+' · '+left+' floor'+(left===1?'':'s')+' above water</span></div>'; }
  else if(t){ var fixed=!!mi.threat.stages;
    h+='<div class="st-cell" title="'+esc(t.text+(fixed?'':' At 6: '+t.trigger)+(mi.threat.howTo?' — '+mi.threat.howTo:''))+'"><span class="lbl">'+esc(L('threat','Threat'))+'</span><span class="clock">'+[1,2,3,4,5,6].map(function(n){ return '<span class="'+(n<=t.value?'on':'')+'">'+n+'</span>'; }).join('')+'</span></div>'; }
  if(mi.scoring) h+='<div class="st-cell st-score" title="'+esc(A(S.m.score).slice(-6).reverse().map(function(x){ return (x.n>0?'+':'')+x.n+' '+x.label; }).join('\n')||'No points yet')+'"><span class="lbl">Score</span><span class="score-big">'+scoreTotal()+'</span></div>';
  h+='</div>';
  if(t&&!S.m.sink) h+='<div class="tiny muted" style="margin-top:4px">'+esc(t.text)+'</div>';
  return h+'</div></div>';
}
// The scene: the Story (newest beat at the bottom, scroll up for the rest), then
// "What do you do?" — the fight, an immediate danger, or what you can still do here.
function sceneCard(){
  var w=curWp(); if(!w) return '';
  var sunk=S.m.flags&&S.m.flags['sunk:'+w.def];
  var h='<div class="card scene"><div class="card-h"><h3>'+esc(wpName(w))+'</h3><span class="row">'+(w.extra?'<span class="chip">'+esc(w.extra)+'</span>':'')+(sunk?'<span class="chip bad">Under water</span>':'')+'</span></div><div class="card-b">';
  h+='<div class="jr" id="so-journal"></div>';
  h+='<div class="wyd">';
  if(S.combat){ h+=combatBody(); return h+'</div></div></div>'; }
  h+='<div class="wyd-h"><span>What do you do?</span>'+heroChips()+'</div>';
  var D=dangerHere();
  h+=D?dangerPanel(w,D):actionsHtml(w);
  return h+'</div></div></div>';
}
function heroChips(){ if(solo()) return ''; return '<span class="row">'+S.party.map(function(p){ var s=PCS[p.id]; return '<button type="button" class="chip hchip'+(p.id===S.acting?' on':'')+'" data-a="hero" data-id="'+esc(p.id)+'" title="'+esc(heroName(p.id))+' acts"'+(s&&s.dead?' disabled':'')+'>'+esc(heroName(p.id))+'</button>'; }).join('')+'</span>'; }
// ── immediate dangers: monsters that have turned on you, a sprung trap, a threat come
// due. Nothing else can be done here until it's dealt with.
function dangerHere(){ var w=curWp(); if(!w||!w.danger) return null; var D=w.danger;
  if(D.type==='fight'){ var e=findEncounter(D.enc); if(!e||!encVisible(e,w)){ w.danger=null; return null; } }
  return D; }
function setDanger(w,D){ if(!w) return; if(D.type==='fight'&&w.evaded) delete w.evaded[D.enc]; w.danger=D; }
function clearDanger(){ var w=curWp(); if(w) w.danger=null; }
function scaledN(spec,full){ var all=spec.count||1; if(full||spec.solo==null) return all; var n=Math.max(1,Math.min(4,S.party.length||1)); return Math.max(1,Math.round(spec.solo+(all-spec.solo)*(n-1)/3)); }
function foeTotal(e,full){ return A(e.foes).reduce(function(t,f){ return t+scaledN(f,full); },0); }
function dangerPanel(w,D){
  var def=wpDef(w), h='';
  if(D.type==='trap'){
    h+='<div class="danger"><div class="dg-h">Trap! '+esc(D.name)+'</div><p class="small">It\'s sprung. Throw yourself clear (EVADE) or take it: <b>'+esc(D.sname)+'</b> ('+esc(D.dice)+').'+(D.newWp?' Either way it carries you somewhere new.':'')+'</p>'+
      '<div class="row"><button class="btn pri" data-a="d-trap" data-h="evade">Roll EVADE</button><button class="btn warn" data-a="d-trap" data-h="take">Take '+esc(D.dice)+'</button></div></div>';
    return h; }
  if(D.type==='threat'){
    return '<div class="danger"><div class="dg-h">'+esc(L('threat','Threat'))+' comes due</div><p class="small">'+esc(D.text)+'</p><p class="tiny muted">Play it out on your sheet, then carry on.</p><div class="row"><button class="btn pri" data-a="d-threat">It\'s dealt with</button></div></div>'; }
  var e=findEncounter(D.enc), full=foeTotal(e,true), sc=foeTotal(e,false);
  h+='<div class="danger"><div class="dg-h">'+esc(e.label)+'</div><p class="small">'+esc(foeList(e))+(e.note?' — <span class="muted">'+esc(e.note)+'</span>':'')+'</p>';
  h+='<div class="row"><button class="btn pri" data-a="fight" data-e="'+esc(e.id)+'">Fight ('+sc+')</button>'+(full!==sc?'<button class="btn" data-a="fight" data-e="'+esc(e.id)+'" data-full="1" title="The numbers in the book">As written ('+full+')</button>':'');
  if(e.endable) h+='<button class="btn" data-a="d-calm" title="'+esc(e.endable.note||'')+'">'+esc(e.endable.label)+'</button>';
  if(!e.noSneak&&!D.noSneak) h+='<button class="btn" data-a="sneak" title="'+(solo()?'Roll SNEAKING':'Every hero rolls SNEAKING — one failure and they see you')+'">Sneak past</button>';
  h+='</div>';
  var chs=A(def&&def.challenges).filter(function(c){ return c.danger===e.id&&chOpen(c,w); });
  if(chs.length) h+='<div class="stack" style="margin-top:8px">'+chs.map(function(c){ return chHtml(c,w,def); }).join('')+'</div>';
  if(def&&def.exits&&S.m.trail&&S.m.trail.length){ var bw=S.m.wps[S.m.trail[S.m.trail.length-1]]; h+='<div class="row" style="margin-top:8px"><button class="btn ghost" data-a="retreat">Back off to '+esc(bw?wpName(bw):'where you came from')+'</button></div>'; }
  h+='</div>';
  h+=escapesHtml(w,def);
  return h;
}
// still to do: a challenge vanishes once it's done (its outcome is in the Story)
function chOpen(c,w){ if(!hasReq(c.requires,w)||anyOn(c.hideIf,w)) return false; var res=w.results[c.id];
  if(c.options) return chOptions(c,w).length>0;
  if(!res) return true; if(res.pendingFail) return true; if(c.fortune) return false;
  return !!(c.repeat&&!(res.ok&&!c.repeatOk)); }
function chOptions(c,w){ var used=w.used||{}; return A(c.options).filter(function(o){ return hasReq(o.requires,w)&&!anyOn(o.hideIf,w)&&(o.repeat||!used[c.id+':'+o.id]); }); }
function chHtml(c,w,def){ var res=w.results[c.id];
  var sk=chSkill(c), lvl=sk&&PC?skillLvl(sk):null, again=res&&!res.pendingFail;
  var h='<div class="ch"><div class="ch-h"><b>'+esc(c.label)+'</b>';
  if(res&&res.pendingFail) h+='<button class="btn warn" data-a="ch-accept" data-c="'+esc(c.id)+'">Accept the failure</button>';
  else if(c.fortune) h+='<button class="btn" data-a="ch-fort" data-c="'+esc(c.id)+'">Ask Fortune</button>';
  else if(c.choice) h+='<button class="btn pri" data-a="ch-choice" data-c="'+esc(c.id)+'">'+esc(c.button||'Do it')+'</button>';
  else if(!c.options) h+='<button class="btn pri" data-a="ch" data-c="'+esc(c.id)+'">'+(again?'Again: ':'')+'Roll '+esc(sk?sk.toUpperCase():c.attr)+(lvl!=null?' ('+lvl+')':'')+(c.boon||boonFromSecret(w,def,c)?' · boon':c.bane?' · bane':'')+'</button>';
  h+='</div>';
  if(res&&res.pendingFail) h+='<div class="tiny muted">Failed — push the roll on your sheet to try again, or accept it.</div>';
  else if(c.note) h+='<div class="tiny muted">'+esc(c.note)+'</div>';
  if(c.options) h+='<div class="row" style="margin-top:5px">'+chOptions(c,w).map(function(o){ return '<button class="btn" data-a="ch-opt" data-c="'+esc(c.id)+'" data-o="'+esc(o.id)+'">'+esc(o.label)+'</button>'; }).join('')+'</div>';
  return h+'</div>'; }
function escapesHtml(w,def){ var list=def?A(def.escapes).filter(function(x){ return hasReq(x.requires,w)&&!anyOn(x.hideIf,w); }):[]; if(!list.length) return '';
  return '<div class="sug" style="margin-top:10px">'+esc(L('escapes','Get out'))+'</div><div class="stack" style="margin-top:4px">'+list.map(function(x){ var i=A(def.escapes).indexOf(x);
    return '<div class="ch"><div class="ch-h"><b>'+esc(x.label)+'</b><button class="btn'+(S.m.sink?' pri':'')+'" data-a="escape" data-i="'+i+'">'+esc(x.skill?'Roll '+x.skill.toUpperCase()+(x.bane?' · bane':''):(x.button||'Go'))+'</button></div>'+(x.note?'<div class="tiny muted">'+esc(x.note)+'</div>':'')+'</div>'; }).join('')+'</div>'; }
function actionsHtml(w){
  var def=wpDef(w), mi=curMission(), h='';
  if(w.unknown&&!w.gen){
    h+='<p class="small">'+esc(L('unknownNote','Nobody knows what lies here. Reveal it with the exploration tables — or imagine it yourself.'))+'</p><div class="row" style="margin-top:6px"><button class="btn pri" data-a="gen">Reveal the waypoint</button><button class="btn" data-a="gen-own">I\'ll describe it</button></div>';
    return h+navRow(w); }
  if(w.gen) h+='<p class="small">'+genHtml(w.gen)+'</p><div class="row" style="margin-bottom:6px"><button class="btn ghost" data-a="gen">Re-roll</button>'+(w.gen.inhabitants?'':'<button class="btn ghost" data-a="inh">Who is here?</button>')+'</div>';
  // notes that switch on with a flag (e.g. "this floor is now under water")
  if(def&&def.flagNotes) Object.keys(def.flagNotes).forEach(function(k){ if(flagOn(k,w)) h+='<div class="secret"><span class="sug">Now</span><br>'+esc(def.flagNotes[k])+'</div>'; });
  if(def&&def.everyRoll&&!anyOn(def.everyRoll.unless,w)) h+='<div class="trig small"><b>'+esc(def.everyRoll.label)+'.</b> '+esc(def.everyRoll.note||'Every action here starts with this roll.')+'</div>';
  var sec=def?A(def.secrets).filter(function(s){ return A(w.revealed).indexOf(s.id)>=0||(S.m.flags&&S.m.flags[s.id]&&s.global); }):[];
  if(sec.length) h+='<div class="stack" style="margin:6px 0">'+sec.map(function(s){ return '<div class="secret"><span class="sug">Known</span><br>'+esc(s.text)+'</div>'; }).join('')+'</div>';
  var blocked=def&&anyOn(def.blockIf,w);
  var chs=def?A(def.challenges).filter(function(c){ return (!blocked||c.unblock)&&chOpen(c,w); }):[];
  if(chs.length) h+='<div class="stack">'+chs.map(function(c){ return chHtml(c,w,def); }).join('')+'</div>';
  var encs=blocked?[]:encountersFor(w);

// Objective + continue: the places between waypoints offer nothing of note, so the

// ── mission flow ───────────────────────────────────────────────────────────

// ── flags & requirements: a flag is mission-wide (S.m.flags) or a secret revealed at

function flagOn(x,w){ if(!x) return true; var neg=x.charAt(0)==='!'; var k=neg?x.slice(1):x; var on=!!(S.m&&S.m.flags&&S.m.flags[k])||!!(w&&A(w.revealed).indexOf(k)>=0); return neg?!on:on; }
function hasReq(req,w){ if(!req) return true; return (Array.isArray(req)?req:[req]).every(function(x){ return flagOn(x,w); }); }
function anyOn(list,w){ if(!list) return false; return (Array.isArray(list)?list:[list]).some(function(x){ return flagOn(x,w); }); }
function arr1(x){ return x==null?[]:Array.isArray(x)?x:[x]; }
// `best: [skills]` rolls whichever of them the hero is best at
function chSkill(c){ if(c.best){ var b=null, bl=-1; c.best.forEach(function(k){ var l=skillLvl(k); if(l!=null&&l>bl){ bl=l; b=k; } }); return b||c.best[0]; } return c.skill||null; }
function wpIndex(id){ for(var i=0;i<S.m.wps.length;i++) if(S.m.wps[i].def===id) return i; return -1; }
function goTo(id){ var i=wpIndex(id); if(i<0) return; var from=curWp(); if(from) from.done=true;
  if(S.m.cur!==i) S.m.trail.push(S.m.cur); S.m.cur=i; var w=curWp(), def=wpDef(w);
  jlog('mission',(w.visited?'Back to ':'')+w.name,''); if(!w.visited){ w.visited=true; enterFx(w,def,false); } }
function enterFx(w,def,first){ var mi=curMission(); if(!def) return;
  if(def.text&&!w.told){ w.told=true; story(def.text); }
  if(def.floor) addScore(1,'Floor discovered: '+w.name);
  if(!first&&mi.threat&&mi.threat.onEnter&&!S.m.sink&&def.floor) threatAdd(mi.threat.onEnter,'Time passes: '+w.name);
  if(def.onEnter) applyEffects(def.onEnter,w,def,{label:w.name}); }
function encountersFor(w){ var mi=curMission(); var def=wpDef(w); var list=def?A(def.encounters).filter(function(e){ return encVisible(e,w); }):[];
  if(w.genFoes) list.push(w.genFoes); return list; }
function encVisible(e,w){ if(S.m.flags&&S.m.flags['won:'+e.id]) return false; if(e.hidden&&A(S.m.shown).indexOf(e.id)<0) return false; return hasReq(e.requires,w)&&!anyOn(e.unless,w); }
function findEncounter(id){ var mi=curMission(); if(!mi) return null; var all=A(mi.encountersShared).slice(); mi.waypoints.forEach(function(w){ all=all.concat(A(w.encounters)); });
  var w=curWp(); if(w&&w.genFoes) all.push(w.genFoes); return all.find(function(e){ return e.id===id; })||null; }
function foeCount(e,solo){ return A(e.foes).reduce(function(t,f){ return t+(solo&&f.solo!=null?f.solo:(f.count||1)); },0); }
function foeList(e){ return A(e.foes).map(function(f){ var b=refDef(f); return (f.count>1?f.count+'× ':'')+(f.name||(b&&b.name)||f.template); }).join(', '); }
// foes: "monster:<id>"/"npc:<id>" from the bestiary, a booklet template, or an inline

function refDef(f){ if(f.monster) return f.monster; if(f.npc) return f.npc; if(f.ref){ var p=f.ref.split(':'); var L=p[0]==='monster'?window.DB_MONSTERS:window.DB_NPCS; return A(L).find(function(x){ return x.id===p[1]; })||null; } return f.template?T.templates[f.template]:null; }
function skillLvl(n){ var s=PC&&A(PC.skills).find(function(x){ return x.name===n; }); return s?s.level:null; }
function threatAdd(n,why){ var t=S.m&&S.m.threat; if(!t||S.m.sink) return; var was=t.value; t.value=Math.max(1,Math.min(6,t.value+n)); if(t.value!==was){ jlog('threat',L('threat','Threat')+' '+(n>0?'+':'')+n+' → '+t.value, why||''); if(t.value>=6&&was<6){ if(curMission().threat.stages){ setTimeout(clockStage,60); } else threatStrike(); } } }

  else setDanger(w,{type:'threat',text:t.trigger}); }
function threatResolved(){ var t=S.m&&S.m.threat; if(!t) return;
  if(t.inherent){ t.value=1; jlog('threat',L('threat','Threat')+' reset to 1',t.text); }
  else { var r2=T.threats[d(6)-1]; S.m.threat={text:r2.text,trigger:r2.trigger,inherent:false,encounter:null,value:1}; jlog('threat','A new threat',r2.text); story(r2.text); } }
// A fixed clock (threat.stages) strikes on its own when it fills: the next stage happens.
function clockStage(){ if(!S.m||S.m.status!=='active'||S.m.sink) return; var mi=curMission(), th=S.m.threat; if(!th||th.value<6||!mi.threat.stages) return;
  var st=mi.threat.stages[Math.min(th.hits||0,mi.threat.stages.length-1)]; th.hits=(th.hits||0)+1; jlog('threat',st.title||'The clock strikes',''); story(st.text); toast(st.title||'The clock strikes!');
  if(st.reset!==false) th.value=1;
  applyEffects(st.fx,curWp(),wpDef(curWp()),{label:st.title||'Clock'}); save(); render(); }
// Effects of a challenge, a stage, an escape or a won fight.
function applyEffects(fx,w,def,c){
  if(!fx) return;
  if(fx.say) story(fx.say);
  if(fx.ifFlag!=null){ applyEffects(hasReq(fx.ifFlag,w)?fx.then:fx.else,w,def,c); }
  if(fx.reveal) fx.reveal.forEach(function(s){ if(A(w.revealed).indexOf(s)<0) w.revealed.push(s); });
  arr1(fx.flag).forEach(function(k){ S.m.flags[k]=true; });
  arr1(fx.unflag).forEach(function(k){ delete S.m.flags[k]; });
  if(fx.score) addScore(typeof fx.score==='number'?fx.score:fx.score.n, fx.scoreLabel||(fx.score&&fx.score.label)||(c?c.label:''));
  arr1(fx.item).forEach(function(it){ send('addItem',{name:it.name,note:it.note||'',wt:it.wt||0}); jlog('mission','Gained: '+it.name,it.note||''); });
  if(fx.threat) threatAdd(fx.threat,c?c.label:'');
  if(fx.damage) (fx.all?aliveHeroes():[S.acting]).forEach(function(id){ var r=rollExpr(fx.damage); jlog('roll','Harm'+(solo()?'':' ('+heroName(id)+')')+': '+r.total,fx.damage+' · '+r.text); send('damage',{n:r.total,type:fx.damageType||undefined,ignoreArmor:!!fx.ignoreArmor,label:(c?c.label:'Harm')+' ('+fx.damage+')'},null,id); });
  if(fx.count){ S.m.counters=S.m.counters||{}; var seen={}; arr1(fx.count).forEach(function(cn){ var ck=cn.key; if(!seen[ck]){ S.m.counters[ck]=(S.m.counters[ck]||0)+(cn.by||1); seen[ck]=1; } if(cn.at&&S.m.counters[ck]===cn.at) applyEffects(cn.fx,w,def,c); }); }
  if(fx.fear) (fx.all?aliveHeroes():[S.acting]).forEach(function(id){ send('fear',{},null,id); });
  if(fx.trap) setTimeout(function(){ trapFlow(); },50);
  if(fx.objective){ S.m.objective=true; jlog('mission','Objective achieved',curMission().objective); }
  arr1(fx.show).forEach(function(id){ if(A(S.m.shown).indexOf(id)<0) S.m.shown.push(id); });
  if(fx.goto) goTo(fx.goto);
  if(fx.treasure){ setTimeout(function(){ offerTreasures(fx.treasure); },50); }
  if(fx.encounter){ var e=findEncounter(fx.encounter); if(e&&!S.m.flags['won:'+e.id]){ if(A(S.m.shown).indexOf(e.id)<0) S.m.shown.push(e.id); setDanger(w||curWp(),{type:'fight',enc:e.id}); } }
  if(fx.sink) setTimeout(function(){ startSinking(); },80);

}
function boonFromSecret(w,def,c){ return A(def&&def.secrets).find(function(s){ return s.boonFor===c.id&&A(w.revealed).indexOf(s.id)>=0; })||null; }

function preCheck(w,def,c,then){ var er=def&&def.everyRoll; if(!er||c.noCheck||anyOn(er.unless,w)) return then();

    if(!r.ok) applyEffects(er.onFail,w,def,{label:er.label}); else if(er.onSuccess) applyEffects(er.onSuccess,w,def,{label:er.label});

// One chance per goal outside combat (core rules). A failure waits for the player to
// accept it, so a push on the sheet can still turn it into a success. `repeat` marks a

function doChallenge(cid){
  var w=curWp(), def=wpDef(w); var c=A(def&&def.challenges).find(function(x){ return x.id===cid; }); if(!c) return;
  preCheck(w,def,c,function(){
  var boons=[], banes=[]; if(c.boon) boons.push(c.label); if(c.bane) banes.push(c.label);
  var sb=boonFromSecret(w,def,c); if(sb) boons.push('Revealed: '+sb.id);

    case 'divert': addWaypoints(1,'Diversion'); closeDlg(); save(); render(); break;
    case 'trap': closeDlg(); trapFlow(); break;
    case 'trap-roll': rollSheet({skill:t.dataset.s},function(r){ var el=$('trap-out'); if(el){ el.style.display=''; el.innerHTML='<b>'+esc(word(r))+'</b> ('+r.roll+' vs '+r.target+')'; } jlog('roll','Trap: '+t.dataset.s,word(r)); save(); }); break;
    case 'trap-hurt': { var hd=rollExpr(t.dataset.d); send('damage',{n:hd.total,label:'Trap ('+t.dataset.d+')'}); jlog('roll','Trap damage',hd.total+' ('+hd.text+')'); closeDlg(); save(); render(); break; }
    case 'leave': leaveFlow(); break;
    case 'leave-clear': finishMission(); break;
    case 'leave-danger': rollSheet({skill:t.dataset.s},function(r){ if(r.ok){ jlog('mission','Out of the Breach',t.dataset.s+' '+word(r)); finishMission(); } else { var dg=T.subtables.danger[d(20)-1]; jlog('mission','Trouble on the way out',dg+' at an earlier waypoint — overcome it first'); dlg('<h3>Trouble on the way out</h3><p>At an earlier waypoint: <b>'+esc(dg)+'</b>. Overcome it, then you\'re out.</p><div class="row" style="margin-top:8px"><button class="btn pri" data-a="leave-clear">Overcome — leave</button><button class="btn ghost" data-a="close">Not yet</button></div>'); save(); } }); break;
    case 'leave-noroute': { var nr=d(4)+2; S.m.wps.splice(S.m.cur+1); addWaypoints(nr,'Way back'); S.m.wps[S.m.wps.length-1].exit=true; closeDlg(); save(); render(); break; }
    case 'reward-item': { var mi=curMission(); send('addItem',{name:mi.reward.item,note:mi.reward.text,wt:0}); t.disabled=true; break; }
    case 'marks': { var mid=t.dataset.id, ml=S.marks[mid]||0; var picked=[].slice.call(document.querySelectorAll('#so-marks-'+t.dataset.i+' input:checked:not(:disabled)')).map(function(x){ return x.value; }).slice(0,ml); if(!picked.length){ toast('Tick the skills to mark'); break; } send('mark',{skills:picked},null,mid); S.marks[mid]=Math.max(0,ml-picked.length); jlog('mission','Advancement marks'+(solo()?'':' — '+heroName(mid)),picked.join(', ')); save(); setTimeout(render,400); break; }
    case 'fight': { var e2=findEncounter(t.dataset.e); if(e2) startFight(e2,t.dataset.full==='1'); break; }
    case 'army': S.army=t.checked; save(); break;
    case 'round': newRound(); break;
    case 'pc-done': S.combat.pending=null; nextTurn(); break;
    case 'inc': resolveIncoming(t.dataset.h); break;
    case 'hit': hitFoe(t.dataset.f,+t.dataset.n,t.dataset.ia==='1'); break;
    case 'foe-dodge': foeDodge(t.dataset.f,+t.dataset.n,t.dataset.ia==='1'); break;
    case 'foe-hp': { var f3=foeBy(t.dataset.f); f3.hp=Math.max(0,Math.min(f3.hpMax,f3.hp+(+t.dataset.d))); if(f3.hp<=0) f3.defeated=true; save(); render(); break; }
    case 'foe-flee': { var f4=foeBy(t.dataset.f); var fr2=fortune('yesno','even'); var yes=fr2.n>=4; if(yes){ f4.fled=true; } jlog('combat','Does '+f4.name+' flee or surrender?',fr2.res+' (D6 '+fr2.n+')'); toast(f4.name+': '+fr2.res); save(); render(); break; }
    case 'flee': { var cf=S.combat, fdef=wpDef(curWp()); S.combat=null; if(!S.m||S.m.status!=='active'){ save(); render(); break; }
      if(fdef&&fdef.exits){ var fw=curWp(); fw.danger=cf.danger||{type:'fight',enc:cf.enc}; if(S.m.trail.length){ S.m.cur=S.m.trail.pop(); jlog('combat',solo()?'You flee!':'The party flees!','Back to '+curWp().name+' — they\'re still there'); } else jlog('combat','You break off','They\'re still there'); }
      else { jlog('combat',solo()?'You flee!':'The party flees!','A diversion waypoint is added'); addWaypoints(1,'Fled'); }
      story('You run.'); save(); render(); break; }
    case 'end-fight': { var obj=S.combat.objective, won=!alive().length, eid=S.combat.enc, wasThreat=S.combat.danger&&S.combat.danger.threat; jlog('combat','Fight over',S.combat.label); S.combat=null; if(obj&&S.m&&!S.m.objective){ S.m.objective=true; jlog('mission','Objective achieved',curMission().objective); }
      if(won&&S.m&&S.m.flags){ S.m.flags['won:'+eid]=true; var ew=findEncounter(eid); if(ew&&ew.time) threatAdd(ew.time,'The fight took time'); if(ew&&ew.onWin) applyEffects(ew.onWin,curWp(),wpDef(curWp()),{label:ew.label}); if(wasThreat) threatResolved(); } save(); render(); break; }
    case 'take-treasure': { A(UI.lastTreasures||(UI.lastTreasure?[UI.lastTreasure]:[])).forEach(function(tr){ if(tr.kind==='coins') send('coins',{unit:tr.unit,n:tr.amount}); else send('addItem',{name:tr.name,note:tr.note||'',wt:tr.wt}); }); UI.lastTreasures=null; closeDlg(); break; }
  }
});
document.addEventListener('change',function(e){ if(e.target.dataset&&e.target.dataset.a==='army'){ S.army=e.target.checked; save(); } });
document.querySelector('.so-tabs').addEventListener('click',function(e){ var b=e.target.closest('button[data-tab]'); if(!b) return; document.body.dataset.tab=b.dataset.tab; [].forEach.call(this.children,function(x){ x.classList.toggle('on',x===b); }); });
$('dlg').addEventListener('click',function(e){ if(e.target===this) closeDlg(); });
function leaveFlow(){
  if(dangerHere()||S.combat){ toast('Deal with the danger first'); return; }
  var mi=curMission(); var ok=S.m.objective;
  dlg('<h3>Leave the Breach</h3><p class="small">'+(ok?'The objective is done — head back to the chapel.':'The objective isn\'t done. Leaving now abandons the mission (you can try it again).')+'</p>'+
    '<div class="list" style="margin-top:8px"><button class="btn pri" data-a="leave-clear">The way back is clear</button>'+
    '<button class="btn" data-a="leave-danger" data-s="Awareness">The way is dangerous — roll AWARENESS</button><button class="btn" data-a="leave-danger" data-s="Sneaking">The way is dangerous — roll SNEAKING</button>'+
    '<button class="btn" data-a="leave-noroute">No direct route — add D4+2 waypoints to the surface</button><button class="btn ghost" data-a="close">Stay</button></div>');
}
function finishMission(){
  closeDlg(); var mi=curMission();
  var mk=mi.marks==null?5:mi.marks;
  if(S.m.drowned){ S.done[mi.id]=S.done[mi.id]==='won'?'won':'lost'; S.m.status='won'; S.m.sink=null; story(mi.lostText); jlog('mission','Lost: '+mi.title,mi.scoring?'Score '+scoreTotal():''); }
  else if(S.m.objective){ S.done[mi.id]='won'; S.m.status='won'; S.m.sink=null; S.party.forEach(function(p){ S.marks[p.id]=(S.marks[p.id]||0)+mk; }); if(mi.reward) story(mi.reward.text); jlog('mission',(MOD.missions.length>1?'Mission complete: ':'Adventure complete: ')+mi.title,(mk?'+'+mk+' advancement marks':'')+(mi.scoring?' · score '+scoreTotal():'')); }
  else { jlog('mission','Mission abandoned: '+mi.title,''); S.m=null; }
  S.combat=null; save(); render();
}

// ── boot ──────────────────────────────────────────────────────────────────
try{ if(localStorage.getItem('db_dark')==='1') document.body.classList.add('dark'); }catch(e){}
if(!S.journal.length) jlog('note','Solo campaign started',MOD?MOD.title:'');
// older saves: a fight in progress from before parties
if(S.combat){ var oc=S.combat; if(typeof oc.pcLeft!=='object'||!oc.pcLeft){ var nl={}; if(S.acting) nl[S.acting]=+oc.pcLeft||0; oc.pcLeft=nl; } A(oc.order).forEach(function(o){ if(o.who==='pc'&&!o.pid) o.pid=S.acting; }); if(oc.pending&&oc.pending.type==='pc'&&!oc.pending.pid) oc.pending.pid=S.acting; if(oc.breath===true){ oc.breath={}; if(S.acting) oc.breath[S.acting]=true; } }
mountSheets(); render();
window.addEventListener('beforeunload',function(){ if(saveT){ clearTimeout(saveT); saveT=null; try{ var o={}; o[KEY]=JSON.stringify(S); window.__ddSave&&window.__ddSave(o); }catch(e){} } });
})();
</script>
