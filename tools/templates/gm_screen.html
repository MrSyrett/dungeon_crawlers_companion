// ═══ DICE TRAY & ROLL LOG ═══════════════════════════════════════════════════
function init_dice(root) {
  const trayEl = root.querySelector('.dice-tray');
  const poolEl = root.querySelector('.dice-pool');
  const logEl = root.querySelector('.dice-log');
  const clearBtn = root.querySelector('.dice-clear');

  let pool = {};       // {6: 2, 20: 1}
  let modifier = 0;
  let advMode = 'none'; // none | adv | dis
  let log = [];         // [{label, detail, total, crit, adv, remote?, source?}]

  // ── Campaign link ──
  // The connection itself lives in GMCamp (top bar). The tray only sends its
  // rolls out and folds incoming ones into the log.
  GMCamp.onChange(() => renderPool());   // link connected/left → show or hide the eye
  GMCamp.onRoll(roll => {
    // The poll re-fetches the campaign's history from id 0 whenever the link
    // (re)activates, so skip any roll already in the log by its server id.
    if(roll && roll.id != null && log.some(e => e.id === roll.id)) return;
    log.unshift({ id: roll ? roll.id : undefined, label: roll.label, detail: roll.detail, total: roll.result,
                  crit: roll.type === 'normal' ? '' : roll.type, adv: 'none',
                  remote: true, source: roll.source });
    if(log.length > 100) log.length = 100;
    renderLog();
  });

  const DICE = [2, 4, 6, 8, 10, 12, 20, 100];

  function poolLabel() {
    const parts = Object.entries(pool).filter(([,n])=>n>0).map(([d,n])=>n+'d'+d);
    let s = parts.join(' + ');
    if(modifier) s += (s?' ':'') + (modifier>0?'+':'') + modifier;
    return s;
  }

  function renderTray() {
    const label = poolLabel();
    let h = '<div class="dice-pool-label-row"><span class="dice-pool-label">'+(label||'Tap dice to build a roll')+'</span></div>';
    h += '<div class="dice-btn-row">';
    DICE.forEach(d=>{
      const n = pool[d]||0;
      h += '<button class="dice-die'+(n?' has':'')+'" data-d="'+d+'">d'+d+(n?'<span class="dice-count">'+n+'</span>':'')+'</button>';
    });
    h += '</div>';
    trayEl.innerHTML = h;
    trayEl.querySelectorAll('.dice-die').forEach(b=>{
      b.onclick = ()=>{ const d = parseInt(b.dataset.d); pool[d]=(pool[d]||0)+1; renderTray(); renderPool(); };
      b.oncontextmenu = (e)=>{ e.preventDefault(); const d = parseInt(b.dataset.d); if(pool[d]) pool[d]--; renderTray(); renderPool(); };
    });
  }

  function renderPool() {
    let h = '<div class="dice-pool-row">';
    // Order: Hide · Bonus · ADV · DIS · ✕ · Roll  (the campaign link itself is in the top bar)
    const camp = GMCamp.get(), hidden = GMCamp.isHidden();
    if(camp) h += '<button class="dice-hide-btn'+(hidden?' on':'')+'" title="'+(hidden?'Rolls hidden from campaign — click to share':'Rolls shared with campaign — click to hide')+'">'+(hidden?'<svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M4.3 3 3 4.3l2.7 2.7C4 8.3 2.8 10 2.3 11.5a1.2 1.2 0 0 0 0 1c1.4 3.1 5.1 6.3 9.7 6.3 1.7 0 3.3-.4 4.7-1.2L19.7 21 21 19.7Zm5.1 7.4 3.2 3.2a2 2 0 0 1-3.2-3.2Z"/><path d="M12 5.2c-.9 0-1.8.1-2.6.4l2.2 2.2a3.5 3.5 0 0 1 4.4 4.4l2.7 2.7c1.4-1.1 2.5-2.5 3.1-3.9a1.2 1.2 0 0 0 0-1C20.3 8.4 16.6 5.2 12 5.2Z" opacity=".7"/></svg>':'<svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M12 5.2c-4.6 0-8.3 3.2-9.7 6.3a1.2 1.2 0 0 0 0 1c1.4 3.1 5.1 6.3 9.7 6.3s8.3-3.2 9.7-6.3a1.2 1.2 0 0 0 0-1C20.3 8.4 16.6 5.2 12 5.2Zm0 3.3a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7Z"/></svg>')+'</button>';
    h += '<input type="number" class="dice-mod" value="'+(modifier||'')+'" placeholder="+0" title="Bonus">';
    h += '<button class="dice-advbtn'+(advMode==='adv'?' on-adv':'')+'" data-m="adv" title="Advantage (d20)">ADV</button>';
    h += '<button class="dice-advbtn'+(advMode==='dis'?' on-dis':'')+'" data-m="dis" title="Disadvantage (d20)">DIS</button>';
    h += '<button class="dice-pool-clear" title="Clear pool">✕</button>';
    h += '<button class="dice-roll-go" title="Roll"><svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path fill-rule="evenodd" clip-rule="evenodd" d="M5 3.2h14a1.8 1.8 0 0 1 1.8 1.8v14a1.8 1.8 0 0 1-1.8 1.8H5A1.8 1.8 0 0 1 3.2 19V5A1.8 1.8 0 0 1 5 3.2Zm3 3.1a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 0 0 0-3.2Zm8 0a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 0 0 0-3.2ZM12 10.4a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 0 0 0-3.2Zm-4 4.1a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 0 0 0-3.2Zm8 0a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 0 0 0-3.2Z"/></svg> Roll</button>';
    h += '</div>';
    poolEl.innerHTML = h;
    poolEl.querySelector('.dice-mod').onchange = (e)=>{ modifier = parseInt(e.target.value)||0; renderTray(); };
    poolEl.querySelectorAll('.dice-advbtn').forEach(b=>{
      b.onclick = ()=>{ advMode = advMode===b.dataset.m ? 'none' : b.dataset.m; renderPool(); };
    });
    poolEl.querySelector('.dice-roll-go').onclick = doRoll;
    poolEl.querySelector('.dice-pool-clear').onclick = ()=>{ pool={}; modifier=0; advMode='none'; renderTray(); renderPool(); };
    const hideBtn = poolEl.querySelector('.dice-hide-btn');
    if(hideBtn) hideBtn.onclick = ()=>{ GMCamp.toggleHide(); renderPool(); };
  }

  function doRoll() {
    const dice = Object.entries(pool).filter(([,n])=>n>0).map(([d,n])=>[parseInt(d), n]);
    if(!dice.length && !modifier) return;
    rollCore(dice, modifier, advMode, null);
  }

  // The rolling mechanic itself, so the tray's Roll button and other tools
  // (a monster's attack or ability check) produce identical entries.
  //   dice: [[sides, count], ...]   label: overrides the pool description
  function rollCore(dice, modifier, advMode, label) {
    let detailParts = [];
    let total = modifier;
    let crit = '';
    const isSingleD20 = dice.length===1 && dice[0][0]===20 && dice[0][1]===1;
    dice.forEach(([d, n])=>{
      if(d===20 && isSingleD20 && advMode!=='none') {
        const r1 = 1+Math.floor(Math.random()*20), r2 = 1+Math.floor(Math.random()*20);
        const keep = advMode==='adv' ? Math.max(r1,r2) : Math.min(r1,r2);
        detailParts.push('d20('+r1+','+r2+' '+(advMode==='adv'?'▲':'▼')+' '+keep+')');
        total += keep;
        if(keep===20) crit='crit'; else if(keep===1) crit='fumble';
      } else {
        const rolls = [];
        for(let i=0;i<n;i++){ rolls.push(1+Math.floor(Math.random()*d)); }
        detailParts.push(n+'d'+d+'('+rolls.join(',')+')');
        total += rolls.reduce((a,b)=>a+b,0);
        if(d===20 && n===1) { if(rolls[0]===20) crit='crit'; else if(rolls[0]===1) crit='fumble'; }
      }
    });
    if(modifier) detailParts.push((modifier>0?'+':'')+modifier);
    const entry = {
      label: label || poolLabel() || String(modifier),
      adv: isSingleD20 ? advMode : 'none',
      detail: detailParts.join(' '),
      total, crit
    };
    log.unshift(entry);
    if(log.length > 100) log.length = 100;
    renderLog();
    GMCamp.broadcast(entry);
    return entry;
  }

  function renderLog() {
    if(!log.length) {
      logEl.innerHTML = '<div class="dice-log-hint">Tap dice and roll — results appear here</div>';
      return;
    }
    logEl.innerHTML = log.map(e=>{
      const critTag = e.crit==='crit' ? ' ★ NAT 20' : e.crit==='fumble' ? ' ✗ NAT 1' : '';
      const advTag = e.adv==='adv' ? ' <span style="color:#6dbf6d;font-size:8px;">▲ADV</span>'
                   : e.adv==='dis' ? ' <span style="color:#df6a6a;font-size:8px;">▼DIS</span>' : '';
      const srcTag = e.remote ? '<span style="color:#8a7ac8;">'+String(e.source||'').replace(/</g,'&lt;')+'</span> · ' : '';
      return '<div class="dice-log-entry'+(e.remote?' remote':'')+(e.crit==='crit'?' crit':e.crit==='fumble'?' fumble':'')+'">'
        + '<div class="roll-label">'+srcTag+String(e.label).replace(/</g,'&lt;')+critTag+advTag+'</div>'
        + '<div class="roll-result">'+e.total+'</div>'
        + '<div class="roll-detail">'+e.detail+'</div>'
        + '</div>';
    }).join('');
    logEl.scrollTop = 0;
  }

  clearBtn.addEventListener('click', ()=>{ log = []; renderLog(); });

  // "1d20+2", "2d6", "1d8 + curse", "+3" → { dice:[[sides,count]], mod }
  // Trailing prose (the "+ curse" in a damage note) is ignored.
  function parseFormula(expr) {
    const dice = [];
    let mod = 0;
    String(expr || '').replace(/([+-]?)\s*(\d*)d(\d+)|([+-]\s*\d+)/gi, (all, sign, count, sides, flat) => {
      if(sides) {
        dice.push([parseInt(sides, 10), Math.max(1, parseInt(count || '1', 10))]);
      } else if(flat) {
        mod += parseInt(flat.replace(/\s+/g, ''), 10) || 0;
      }
      return '';
    });
    return { dice, mod };
  }

  // Called from other tools (see window.rollToDiceTray). With no explicit
  // advantage it inherits whatever ADV/DIS is currently set on the tray, so a
  // monster's checks obey the same toggle the GM already flipped.
  root._externalRoll = (label, expr, adv) => {
    const { dice, mod } = parseFormula(expr);
    if(!dice.length && !mod) return null;
    return rollCore(dice, mod, adv || advMode, label || String(expr));
  };

  // One d20 honouring advantage/disadvantage.
  function rollD20(mode) {
    if(mode === 'adv' || mode === 'dis') {
      const r1 = 1 + Math.floor(Math.random() * 20), r2 = 1 + Math.floor(Math.random() * 20);
      const keep = mode === 'adv' ? Math.max(r1, r2) : Math.min(r1, r2);
      return { value: keep, detail: `d20(${r1},${r2} ${mode === 'adv' ? '▲' : '▼'} ${keep})` };
    }
    const r = 1 + Math.floor(Math.random() * 20);
    return { value: r, detail: `d20(${r})` };
  }

  // An attack: to-hit and damage in a single entry, the way the character
  // sheet reports them ("Hit: 15  |  Dmg: 4"). ADV/DIS applies to the d20 only.
  root._attackRoll = (label, hitMod, dmgExpr, adv) => {
    const mode = adv || advMode;
    const hasHit = hitMod !== null && hitMod !== undefined && hitMod !== '';
    const mod = hasHit ? (parseInt(String(hitMod).replace(/\s+/g, ''), 10) || 0) : 0;

    let hitTotal = null, crit = '', detailParts = [];
    if(hasHit) {
      const { value, detail } = rollD20(mode);
      hitTotal = value + mod;
      crit = value === 20 ? 'crit' : value === 1 ? 'fumble' : '';
      detailParts.push(`${detail}${mod ? (mod > 0 ? '+' : '') + mod : ''}=${hitTotal}`);
    }

    let dmgTotal = null;
    if(dmgExpr) {
      const { dice, mod: dmod } = parseFormula(dmgExpr);
      if(dice.length || dmod) {
        dmgTotal = dmod;
        const bits = [];
        dice.forEach(([sides, count]) => {
          const rolls = [];
          for(let i = 0; i < count; i++) rolls.push(1 + Math.floor(Math.random() * sides));
          dmgTotal += rolls.reduce((a, b) => a + b, 0);
          bits.push(`${count}d${sides}(${rolls.join(',')})`);
        });
        if(dmod) bits.push((dmod > 0 ? '+' : '') + dmod);
        detailParts.push(`${bits.join(' ')}=${dmgTotal}`);
      }
    }
    if(hitTotal === null && dmgTotal === null) return null;

    const total = hitTotal !== null && dmgTotal !== null ? `Hit: ${hitTotal}  |  Dmg: ${dmgTotal}`
                : hitTotal !== null ? `Hit: ${hitTotal}`
                : `Dmg: ${dmgTotal}`;
    const entry = {
      label: label || 'Attack',
      adv: hasHit ? mode : 'none',
      detail: detailParts.join('  |  '),
      total, crit
    };
    log.unshift(entry);
    if(log.length > 100) log.length = 100;
    renderLog();
    GMCamp.broadcast(entry);
    return entry;
  };

  // Collapse duplicate remote rolls when restoring a saved log: by server id
  // when present, or by a content signature for older entries saved before ids
  // were tracked. Local (GM) rolls are never collapsed — identical ones are kept.
  function dedupeLog(arr) {
    const seen = new Set();
    const out = [];
    for(const e of (arr || [])) {
      if(!e) continue;
      let key = null;
      if(e.id != null) key = 'id:' + e.id;
      else if(e.remote) key = 'sig:' + e.label + '|' + e.total + '|' + e.detail + '|' + e.source;
      if(key !== null) { if(seen.has(key)) continue; seen.add(key); }
      out.push(e);
    }
    return out;
  }

  root._getState = () => ({ log });
  root._setState = (s) => {
    if(!s) return;
    if(Array.isArray(s.log)) log = dedupeLog(s.log);
    // Sessions saved before the link moved to the top bar kept it in here
    if(s.campaign || typeof s.hideRolls === 'boolean') GMCamp.restore(s);
    renderLog();
    renderPool();
  };

  renderTray();
  renderPool();
  renderLog();
}
window.init_dice = init_dice;

// Roll something straight into the Dice tray from another tool. The tray is
// created on demand, so this works before it has ever been opened.
window.rollToDiceTray = function(label, expr, adv) {
  try {
    const node = getOrCreateInstance('dice');
    if(node && typeof node._externalRoll === 'function') return !!node._externalRoll(label, expr, adv);
  } catch(e) {}
  return false;
};

// To-hit + damage as one roll, matching how the character sheet reports attacks.
window.rollAttackToDiceTray = function(label, hitMod, dmgExpr, adv) {
  try {
    const node = getOrCreateInstance('dice');
    if(node && typeof node._attackRoll === 'function') return !!node._attackRoll(label, hitMod, dmgExpr, adv);
  } catch(e) {}
  return false;
};

</script>

<script>
// ══════════════════════════════════════════
// PARTY TOOL — view the players' character sheets
// Sheets arrive three ways:
//   1. Sync — GET /api/campaigns/{id}/characters for the linked campaign
//   2. Add Sheet — the .json a player exports from the character sheet
//   3. Paste — the same JSON pasted in
// ══════════════════════════════════════════
function init_party(root) {
  const fileInput = root.querySelector('.pty-file-input');
  const syncBtn   = root.querySelector('.pty-sync');
  const clearBtn  = root.querySelector('.pty-clear');
  const noteEl    = root.querySelector('.pty-note');
  const listEl    = root.querySelector('.pty-list');
  const emptyEl   = root.querySelector('.pty-empty');

  let chars = [];          // [{id, source, sheet}]
  let lastSync = null;
  let openIds = new Set();
  let nextId = 1;

  const esc = t => String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const mod = v => { const m = Math.floor(((parseInt(v)||10) - 10) / 2); return (m >= 0 ? '+' : '') + m; };

  // Sheets come from a few exporters (our sheet, Shadowdarklings). Read defensively.
  function normalize(raw) {
    if(!raw || typeof raw !== 'object') return null;
    const d = raw.sheet && typeof raw.sheet === 'object' ? raw.sheet : raw;
    if(!d.name && !d.class && !d.stats) return null;
    const st = d.stats || d.rolledStats || {};
    const pick = k => st[k] ?? st[k.toLowerCase()] ?? st[k[0] + k.slice(1).toLowerCase()] ?? 10;
    const sheetExtra = d._sheet || {};
    // Spells: prefer our structured rows (they carry level, lost, and the full
    // description); fall back to the comma list from a foreign exporter.
    const spellRows = Array.isArray(sheetExtra.spellData) && sheetExtra.spellData.length
      ? sheetExtra.spellData.filter(x => x.name).map(x => ({
          name: x.name, level: x.level || '', lost: !!x.lost, desc: x.desc || ''
        }))
      : String(d.spellsKnown || '').split(',').map(x => x.trim()).filter(Boolean).map(n => ({ name:n, level:'', lost:false, desc:'' }));
    // Attacks: prefer our structured rows (name / bonus / stat / range / damage);
    // fall back to the lossy string form that drops range.
    const attacks = Array.isArray(sheetExtra.attacks) && sheetExtra.attacks.length
      ? sheetExtra.attacks.filter(a => a && (a.name || a.damage)).map(a => ({
          name: a.name || '', bonus: a.bonus || '', stat: a.stat || '',
          range: a.range || '', damage: a.damage || ''
        }))
      : (Array.isArray(d.attacks) ? d.attacks.filter(Boolean).map(a => (
          typeof a === 'string' ? { name:a, bonus:'', stat:'', range:'', damage:'' } : {
            name: a.name || '', bonus: a.bonus || '', stat: a.stat || '', range: a.range || '', damage: a.damage || ''
          })) : []);
    // Talents & Features: the verbatim Talents box holds every class/ancestry
    // feature and trait the player recorded. The `bonuses` array is a lossy
    // decomposition (drops headings and colon-less lines), so prefer the text
    // and split it into lines; fall back to bonuses only if the text is empty.
    const talentsText = typeof sheetExtra.talents === 'string' ? sheetExtra.talents : '';
    let talents = talentsText.split('\n').map(s => s.trim()).filter(Boolean);
    if(!talents.length) {
      talents = (d.bonuses || [])
        .filter(b => b && b.bonusName && !String(b.name || '').startsWith('Spell:'))
        .map(b => b.bonusName);
    }
    const gear = (d.gear || []).map(g => ({ name:g.name, qty:g.quantity || 1, free:(g.slots ?? 1) === 0 }));
    const strScore = parseInt(pick('STR')) || 10;
    // Shadowdark: carrying capacity is max(10, STR). Homebrew/ancestry can grant
    // extra; the sheet stores that separately.
    const slotBonus = parseInt(sheetExtra.hbBonusSlots) || 0;
    const slotsMax = Math.max(10, strScore) + slotBonus;
    const slotsUsed = gear.filter(g => !g.free).length;
    return {
      name:      d.name || 'Unnamed',
      ancestry:  d.ancestry || '',
      cls:       d.class || '',
      title:     d.title || '',
      level:     d.level || 1,
      alignment: d.alignment || '',
      deity:     d.deity || '',
      background:d.background || '',
      ac:        d.armorClass || 0,
      hpMax:     d.maxHitPoints || 0,
      hpCur:     sheetExtra.hpCurrent || '',
      luck:      sheetExtra.luckPts || '',
      trackers:  Array.isArray(sheetExtra.trackers) ? sheetExtra.trackers.filter(t => typeof t === 'string' && t.trim()) : [],
      xp:        d.XP || 0,
      stats:     { STR:pick('STR'), DEX:pick('DEX'), CON:pick('CON'), INT:pick('INT'), WIS:pick('WIS'), CHA:pick('CHA') },
      attacks,
      spells:    spellRows,
      talents,
      gear,
      slotsUsed,
      slotsMax,
      coins:     { gp:d.gold || 0, sp:d.silver || 0, cp:d.copper || 0 },
    };
  }

  function addSheet(raw, source) {
    const c = normalize(raw);
    if(!c) return false;
    // Re-syncing or re-importing the same character replaces the old copy
    const i = chars.findIndex(x => x.sheet.name.toLowerCase() === c.name.toLowerCase());
    if(i >= 0) chars[i] = { ...chars[i], source, sheet:c };
    else chars.push({ id: nextId++, source, sheet: c });
    return true;
  }

  function status(msg, isErr) {
    noteEl.textContent = msg || '';
    noteEl.style.color = isErr ? '#df6a6a' : '';
  }

  function cardHTML(entry) {
    const c = entry.sheet;
    const open = openIds.has(entry.id);
    const hp = c.hpCur !== '' ? esc(c.hpCur) + '/' + c.hpMax : String(c.hpMax);
    const line = [c.ancestry, c.cls].filter(Boolean).join(' ');
    const sub = [line ? 'LV ' + c.level + ' ' + line : 'LV ' + c.level, c.title, c.alignment].filter(Boolean).join(' · ');

    // Light/Focused/Invisible read as states you want; everything else is an
    // affliction. Mirrors the colouring on the player's own sheet.
    const GOOD_TRACKERS = ['light','focused','invisible'];
    const trkHTML = c.trackers.length
      ? '<div class="pty-trk">' + c.trackers.map(t =>
          '<span class="pty-trk-chip' + (GOOD_TRACKERS.includes(t.toLowerCase()) ? ' good' : '') + '">'
          + esc(t) + '</span>').join('') + '</div>'
      : '';

    let h = '<div class="pty-card' + (open ? ' open' : '') + '" data-id="' + entry.id + '">';
    h += '<div class="pty-card-hd">'
       + '<div style="min-width:0;flex:1;"><div class="pty-name">' + esc(c.name) + '</div>'
       + '<div class="pty-sub">' + esc(sub) + '</div>' + trkHTML + '</div>'
       + '<span class="pty-chip">AC <b>' + esc(c.ac) + '</b></span>'
       + '<span class="pty-chip">HP <b>' + hp + '</b></span>'
       + (c.luck ? '<span class="pty-chip">Luck <b>' + esc(c.luck) + '</b></span>' : '')
       + '<button class="pty-x" data-remove="' + entry.id + '" title="Remove">✕</button>'
       + '</div>';

    h += '<div class="pty-card-bd">';
    h += '<div class="pty-stats">' + ['STR','DEX','CON','INT','WIS','CHA'].map(k =>
        '<div class="pty-stat"><div class="pty-stat-lbl">' + k + '</div>'
      + '<div class="pty-stat-mod">' + mod(c.stats[k]) + '</div>'
      + '<div class="pty-stat-val">' + esc(c.stats[k]) + '</div></div>').join('') + '</div>';

    if(c.attacks.length) h += '<div class="pty-sec"><div class="pty-sec-h">Attacks</div>'
      + c.attacks.map(a => {
          const bonus = a.bonus !== '' ? (String(a.bonus).trim().charAt(0) === '-' ? a.bonus : '+' + String(a.bonus).replace(/^\+/, '')) : '';
          const bits = [
            bonus     ? '<span class="dim">' + esc(bonus) + ' atk</span>' : '',
            a.damage  ? '<span class="dim">' + esc(a.damage) + '</span>'  : '',
            a.range   ? '<span class="dim">' + esc(a.range) + '</span>'   : ''
          ].filter(Boolean).join(' · ');
          return '<div class="pty-line"><b>' + esc(a.name || '—') + '</b>'
            + (bits ? ' ' + bits : '') + '</div>';
        }).join('') + '</div>';

    if(c.spells.length) h += '<div class="pty-sec"><div class="pty-sec-h">Spells</div>'
      + c.spells.map((sp, i) => {
          const hasDesc = sp.desc && sp.desc.trim();
          const info = hasDesc
            ? '<button class="pty-spell-info" data-spell="' + entry.id + '-' + i + '" title="Show description" aria-label="Show spell description"><svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M11.2 5.3C9.6 4.3 7.5 3.8 5 3.8a1 1 0 0 0-1 1v11.6a1 1 0 0 0 1 1c2.2 0 4 .4 5.4 1.2a1.2 1.2 0 0 0 .8.2V5.6a1 1 0 0 0-.0-.3Zm1.6 0V18a1.2 1.2 0 0 0 .8-.2c1.4-.8 3.2-1.2 5.4-1.2a1 1 0 0 0 1-1V4.8a1 1 0 0 0-1-1c-2.5 0-4.6.5-6.2 1.5Z"/><path d="M11.2 19.4c-1.5-.9-3.4-1.4-5.9-1.4a1 1 0 0 0 0 2c2.2 0 3.9.4 5.1 1.2a1.5 1.5 0 0 0 1.6 0c1.2-.8 2.9-1.2 5.1-1.2a1 1 0 0 0 0-2c-2.5 0-4.4.5-5.9 1.4a.5.5 0 0 1-.1 0Z" opacity=".55"/></svg></button>'
            : '';
          return '<div class="pty-line' + (sp.lost ? ' lost' : '') + '">' + esc(sp.name)
            + (sp.level ? ' <span class="dim">(T' + esc(sp.level) + ', DC ' + (10 + (parseInt(sp.level) || 1)) + ')</span>' : '')
            + (sp.lost ? ' <span class="pty-lost">LOST</span>' : '')
            + info
            + (hasDesc ? '<div class="pty-spell-desc" data-desc="' + entry.id + '-' + i + '" style="display:none;">' + esc(sp.desc) + '</div>' : '')
            + '</div>';
        }).join('') + '</div>';

    if(c.talents.length) h += '<div class="pty-sec"><div class="pty-sec-h">Talents &amp; Features</div>'
      + c.talents.map(t => '<div class="pty-line">' + esc(t) + '</div>').join('') + '</div>';

    const carried = c.gear.filter(g => !g.free), free = c.gear.filter(g => g.free);
    if(c.gear.length || c.coins.gp || c.coins.sp || c.coins.cp) {
      const coinStr = c.coins.gp + ' gp · ' + c.coins.sp + ' sp · ' + c.coins.cp + ' cp' + (c.xp ? ' · ' + c.xp + ' XP' : '');
      h += '<div class="pty-sec"><div class="pty-sec-h pty-gear-h">'
         + '<span>Gear <span class="pty-slots">' + c.slotsUsed + '/' + c.slotsMax + '</span></span>'
         + '<span class="pty-coins">' + esc(coinStr) + '</span>'
         + '</div>';
      h += '<div class="pty-line">' + (carried.length
        ? carried.map(g => esc(g.name) + (g.qty > 1 ? ' <span class="dim">×' + g.qty + '</span>' : '')).join(', ')
        : '<span class="dim">—</span>') + '</div>';
      if(free.length) h += '<div class="pty-line dim">Free to carry: ' + free.map(g => esc(g.name)).join(', ') + '</div>';
      h += '</div>';
    }
    h += '</div></div>';
    return h;
  }

  function render() {
    const any = chars.length > 0;
    emptyEl.style.display = any ? 'none' : 'flex';
    listEl.style.display  = any ? 'flex' : 'none';
    listEl.innerHTML = chars.map(cardHTML).join('');
    if(any && !noteEl.textContent) status(chars.length + ' character' + (chars.length === 1 ? '' : 's'));
  }

  listEl.addEventListener('click', e => {
    const rm = e.target.closest('[data-remove]');
    if(rm) {
      const id = parseInt(rm.dataset.remove);
      chars = chars.filter(x => x.id !== id);
      openIds.delete(id);
      status('');
      render();
      return;
    }
    // Spell description toggle — must run before the card-header collapse and
    // not bubble up to it, so opening a description never closes the card.
    const info = e.target.closest('.pty-spell-info');
    if(info) {
      e.stopPropagation();
      const key = info.dataset.spell;
      const desc = listEl.querySelector('.pty-spell-desc[data-desc="' + key + '"]');
      if(desc) desc.style.display = desc.style.display === 'none' ? 'block' : 'none';
      return;
    }
    const hd = e.target.closest('.pty-card-hd');
    if(!hd) return;
    const id = parseInt(hd.closest('.pty-card').dataset.id);
    if(openIds.has(id)) openIds.delete(id); else openIds.add(id);
    render();
  });

  fileInput.addEventListener('change', () => {
    const files = [...fileInput.files];
    if(!files.length) return;
    let ok = 0, bad = 0, pending = files.length;
    files.forEach(f => {
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const data = JSON.parse(ev.target.result);
          const list = Array.isArray(data) ? data : [data];
          list.forEach(d => { if(addSheet(d, f.name)) ok++; else bad++; });
        } catch(err) { bad++; }
        if(--pending === 0) {
          status(ok + ' sheet' + (ok === 1 ? '' : 's') + ' added' + (bad ? ' · ' + bad + ' not readable' : ''), !ok);
          render();
        }
      };
      reader.readAsText(f);
    });
    fileInput.value = '';
  });

  // Pull the party from the linked campaign. The server returns every saved
  // SD character sheet whose _sheet.campaign.id matches — i.e. the players who
  // typed this campaign's join code into their own sheet.
  async function sync(quiet) {
    const camp = (typeof window.__gmCampaign === 'function') ? window.__gmCampaign() : null;
    if(!camp || !camp.id) {
      if(!quiet) status('Link a campaign first — Dice Tray → Campaign link.', true);
      return;
    }
    if(!quiet) status('Syncing "' + camp.name + '"…');
    try {
      const r = await fetch('/api/campaigns/' + camp.id + '/characters', { credentials: 'same-origin' });
      if(r.status === 401) { status('Signed out — reload the page and sign in again.', true); return; }
      if(r.status === 404) { status('That campaign no longer exists on the server.', true); return; }
      if(!r.ok) throw new Error(r.status);
      const data = await r.json();
      const list = Array.isArray(data) ? data : (data.characters || []);
      // A sync is the source of truth for campaign sheets. Update matching
      // characters in place (addSheet matches by name and keeps the same id, so
      // an expanded card stays expanded), and afterwards drop only the campaign
      // characters that were NOT in this response.
      const seen = new Set();
      let ok = 0;
      list.forEach(d => {
        const norm = normalize(d.sheet && typeof d.sheet === 'object' ? d.sheet : d);
        if(norm) seen.add(norm.name.toLowerCase());
        if(addSheet(d, 'campaign · ' + camp.code)) ok++;
      });
      chars = chars.filter(x => !String(x.source).startsWith('campaign') || seen.has(x.sheet.name.toLowerCase()));
      lastSync = new Date();
      status(ok
        ? ok + ' character' + (ok === 1 ? '' : 's') + ' from ' + camp.code + ' · ' + lastSync.toLocaleTimeString()
        : 'No one has linked a character sheet to ' + camp.code + ' yet.');
      render();
    } catch(err) {
      status('Could not reach the campaign (' + err.message + ').', true);
    }
  }

  syncBtn.addEventListener('click', () => sync(false));

  // While a campaign is linked, keep the party fresh on its own.
  setInterval(() => {
    const camp = (typeof window.__gmCampaign === 'function') ? window.__gmCampaign() : null;
    if(camp && camp.id) sync(true);
  }, 30000);
  setTimeout(() => {
    const camp = (typeof window.__gmCampaign === 'function') ? window.__gmCampaign() : null;
    if(camp && camp.id) sync(true);
  }, 1200);

  clearBtn.addEventListener('click', () => {
    if(chars.length && !confirm('Remove all character sheets from the party view?')) return;
    chars = []; openIds = new Set(); status(''); render();
  });

  root._getState = () => ({ chars, openIds: [...openIds], nextId });
  root._setState = (st) => {
    if(!st) return;
    chars  = Array.isArray(st.chars) ? st.chars.filter(x => x && x.sheet) : [];
    nextId = st.nextId || (chars.reduce((m, x) => Math.max(m, x.id || 0), 0) + 1);
    openIds = new Set(st.openIds || []);
    status('');
    render();
  };

  render();
}

// ══════════════════════════════════════════
// RULEBOOKS TOOL — PDFs/images of your books, plus the searchable
// bestiary and magic item tables already built into this screen.
// ══════════════════════════════════════════
function init_rules(root) {
  const refreshBtn = root.querySelector('.rul-refresh');
  const newTabLink = root.querySelector('.rul-newtab');
  const tabsEl     = root.querySelector('.rul-booktabs');
  const noteEl     = root.querySelector('.rul-note');
  const emptyEl    = root.querySelector('.rul-empty');
  const frameWrap  = root.querySelector('.rul-frame-wrap');

  let books = [];        // [{file, title, url}] — from /api/rulebooks
  let activeFile = '';   // which book is open (remembered across sessions)
  let loaded = false;

  const esc = t => String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  function showBook() {
    const b = books.find(x => x.file === activeFile) || books[0];
    frameWrap.innerHTML = '';
    if(!b) {
      frameWrap.style.display = 'none';
      newTabLink.style.display = 'none';
      root.dispatchEvent(new Event('rul-book-change'));
      return;
    }
    activeFile = b.file;
    emptyEl.style.display = 'none';
    frameWrap.style.display = 'flex';

    // <object> lets the browser's own PDF viewer handle scrolling and search,
    // with an iframe (then a plain link) behind it for the browsers that can't.
    const obj = document.createElement('object');
    obj.type = 'application/pdf';
    obj.data = b.url;
    obj.className = 'rul-frame';
    const frame = document.createElement('iframe');
    frame.className = 'rul-frame';
    frame.src = b.url;
    frame.title = b.title;
    obj.appendChild(frame);
    frameWrap.appendChild(obj);

    newTabLink.href = b.url;
    newTabLink.style.display = '';
    root.dispatchEvent(new Event('rul-book-change'));
  }

  function render() {
    tabsEl.innerHTML = books.map(b =>
      '<button class="rul-booktab' + (b.file === activeFile ? ' on' : '') + '" data-file="' + esc(b.file) + '">'
      + esc(b.title) + '</button>').join('');
    if(!books.length) {
      frameWrap.style.display = 'none';
      frameWrap.innerHTML = '';
      newTabLink.style.display = 'none';
      emptyEl.style.display = 'flex';
      return;
    }
    showBook();
  }

  async function load(quiet) {
    if(!quiet) noteEl.textContent = 'Loading…';
    try {
      const r = await fetch('/api/rulebooks', { credentials: 'same-origin' });
      if(!r.ok) throw new Error(r.status);
      const data = await r.json();
      books = (data.books || []).filter(b => b && b.url && b.file);
      if(!books.some(b => b.file === activeFile)) activeFile = books.length ? books[0].file : '';
      loaded = true;
      noteEl.textContent = books.length ? books.length + ' book' + (books.length === 1 ? '' : 's') : '';
      render();
    } catch(err) {
      noteEl.textContent = '';
      emptyEl.style.display = 'flex';
      emptyEl.querySelector('.pty-empty-title').textContent = 'Rulebooks Unavailable';
      emptyEl.querySelector('.pty-empty-sub').textContent =
        'Could not read the rulebook list from the server. Open the GM Screen from Dungeon Crawler\'s Companion while signed in.';
    }
  }

  tabsEl.addEventListener('click', e => {
    const t = e.target.closest('.rul-booktab');
    if(!t) return;
    activeFile = t.dataset.file;
    render();
  });

  refreshBtn.addEventListener('click', () => load(false));

  // Only the chosen book is worth saving — the PDFs live on the server.
  root._getState = () => ({ activeFile });
  root._setState = (st) => {
    if(st && st.activeFile) activeFile = st.activeFile;
    if(loaded) render();
  };

  load(true);
}

window.init_party = init_party;
window.init_rules = init_rules;
</script>

</body>
