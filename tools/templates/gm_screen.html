<script>
// ══════════════════════════════════════════
// PANE / TOOL INSTANCE MANAGEMENT
// Tool instances are created ONCE and kept alive in a hidden pool.
// Switching panes/views MOVES the existing DOM node — never recreates it.
// This is what makes loaded files / typed content persist.
// ══════════════════════════════════════════

const TOOL_TYPES = ['adventure', 'maps', 'trackers', 'notes', 'gen', 'party', 'rules'];
const instancePool = document.createElement('div');
instancePool.style.cssText = 'position:fixed; top:0; left:-9999px; width:1px; height:1px; overflow:hidden;';
document.body.appendChild(instancePool);

const instances = {}; // toolType -> DOM node (singleton per tool type)
let splitMode = 1;
// On mobile the GM screen is locked to a single pane. splitPref remembers the
// layout the user actually chose so it comes back when they return to desktop.
let splitPref = 1;
const GM_MOBILE_MQ = window.matchMedia('(max-width: 760px)');
function isMobileView() { return GM_MOBILE_MQ.matches; }
let paneTools = { 1: 'adventure', 2: 'trackers', 3: 'notes', 4: 'dice' };
// Combat and Trackers were merged into one tool; old saves may still say 'combat'.
function normalizeTool(t) { return t === 'combat' ? 'trackers' : t; }

function getOrCreateInstance(toolType) {
  toolType = normalizeTool(toolType);
  if(instances[toolType]) return instances[toolType];
  const tpl = document.getElementById('tpl-' + toolType);
  const node = tpl.content.firstElementChild.cloneNode(true);
  instancePool.appendChild(node);
  instances[toolType] = node;
  const initFn = window['init_' + toolType];
  if(initFn) {
    initFn(node);
  } else {
    console.error('No init function found for tool: ' + toolType + ' (expected window.init_' + toolType + ')');
  }
  return node;
}

function setSplit(n) {
  splitPref = n;
  if(isMobileView()) n = 1;   // mobile: always one pane
  splitMode = n;
  const sel = document.getElementById('split-select');
  if(sel) sel.value = String(n);
  const area = document.getElementById('main-area');
  if(area) {
    area.classList.toggle('quad', n === 4);
    area.classList.toggle('focus', n === 3);
  }
  // Panes 2-4 show only when the split calls for them
  [2, 3, 4].forEach(p => {
    const el = document.getElementById('pane-' + p);
    if(el) el.style.display = (p <= n) ? 'flex' : 'none';
  });
  // Panes squeezed below the mobile breakpoint need the narrow layout (stacked
  // trackers, wrapped toolbars): all four columns in Four mode, and the two
  // stacked panes in Focus mode (pane 1 stays wide there).
  [1, 2, 3, 4].forEach(p => {
    const el = document.getElementById('pane-' + p);
    if(!el) return;
    const narrow = (n === 4) || (n === 3 && (p === 2 || p === 3));
    el.classList.toggle('narrow', narrow);
  });
  // Multi-pane modes: no two panes may hold the same tool (one instance per tool)
  if(n >= 3) dedupePaneTools(n);
  for(let p = 1; p <= n; p++) renderPane(p);
  if(window.__ddScheduleSave) window.__ddScheduleSave();
}

// Rotating the phone / resizing across the breakpoint re-applies the layout:
// collapse to one pane on mobile, restore the chosen split on desktop.
GM_MOBILE_MQ.addEventListener('change', () => setSplit(splitPref));

// Each tool has a single DOM instance, so it can only live in one pane.
// If a duplicate is found, swap that pane to the first unused tool.
function dedupePaneTools(count) {
  const all = ['adventure','maps','trackers','notes','gen','party','rules','dice'];
  const used = new Set();
  for(let p = 1; p <= (count || 4); p++) {
    let tool = paneTools[p];
    if(!tool || used.has(tool)) {
      tool = all.find(t => !used.has(t)) || tool;
      paneTools[p] = tool;
      const sel = document.getElementById('pane-' + p + '-select');
      if(sel) sel.value = tool;
    }
    used.add(tool);
  }
}

function setPaneTool(paneNum, tool) {
  tool = normalizeTool(tool);
  // A tool has one instance, so if a visible pane already shows it, swap the two.
  const prev = paneTools[paneNum];
  for(let p = 1; p <= splitMode; p++) {
    if(p !== paneNum && paneTools[p] === tool) {
      paneTools[p] = prev;
      const sel = document.getElementById('pane-' + p + '-select');
      if(sel) sel.value = prev;
      paneTools[paneNum] = tool;
      document.getElementById('pane-' + paneNum + '-select').value = tool;
      renderPane(p);
      renderPane(paneNum);
      if(window.__ddScheduleSave) window.__ddScheduleSave();
      return;
    }
  }
  paneTools[paneNum] = tool;
  document.getElementById('pane-' + paneNum + '-select').value = tool;
  renderPane(paneNum);
  if(window.__ddScheduleSave) window.__ddScheduleSave();
}


// Load generated content into a tool WITHOUT pulling the current pane off the
// Generators. If a visible pane already shows the target tool, use it. Else, in
// a multi-pane view, take another visible pane. Only in single view do we swap
// the generator pane itself.

// Combat and Trackers are now ONE tool with a single ordered list. Older saves
// may hold {round, trackers} under 'trackers' and/or {npcs} under 'combat' —
// fold both into the unified 'trackers' state.
function migrateToolState(tools) {
  if(!tools) return tools;
  const t = tools.trackers, c = tools.combat;
  if(!c && !(t && (t.trackers || t.npcs))) return tools;

  const merged = { round: (t && t.round) || (c && c.round) || 1, items: [] };
  if(t && Array.isArray(t.items)) merged.items = t.items.slice();
  else {
    (((t && t.trackers) || (c && c.trackers) || [])).forEach(x => merged.items.push({ ...x, type: 'tracker' }));
    (((c && c.npcs) || (t && t.npcs) || [])).forEach(x => merged.items.push({ ...x, type: 'npc' }));
  }
  // Re-key ids so a tracker and an NPC that shared id 1 don't collide
  let id = 1;
  merged.items.forEach(x => { x.id = id++; });
  tools.trackers = merged;
  delete tools.combat;
  return tools;
}

function loadIntoTool(tool, dataUrl, fileName) {
  const genPane = parseInt(Object.keys(paneTools).find(k => paneTools[k] === 'gen') || 1);
  let target = null;

  for(let p = 1; p <= splitMode; p++) {
    if(paneTools[p] === tool) { target = p; break; }
  }
  if(target === null && splitMode > 1) {
    for(let p = 1; p <= splitMode; p++) {
      if(p !== genPane) { target = p; break; }
    }
  }
  if(target === null) target = genPane; // single view — nowhere else to put it

  if(paneTools[target] !== tool) setPaneTool(target, tool);

  setTimeout(() => {
    const inst = instances[tool];
    if(inst && inst._loadDataUrl) inst._loadDataUrl(dataUrl, fileName);
  }, 150);
}

function renderPane(paneNum) {
  const content = document.getElementById('pane-' + paneNum + '-content');
  const toolbarSlot = document.getElementById('pane-' + paneNum + '-toolbar');
  const tool = paneTools[paneNum];
  const node = getOrCreateInstance(tool);

  if(node.parentElement !== content) {
    content.appendChild(node);
  }

  Array.from(content.children).forEach(child => {
    child.classList.toggle('active', child === node);
  });
  node.classList.add('active');

  // Clone the tool's toolbar template into the pane header toolbar slot
  if(toolbarSlot) {
    toolbarSlot.innerHTML = '';
    const tpl = node.querySelector('.toolbar-tpl');
    if(tpl) {
      // Clone the children of the hidden div into the toolbar slot
      Array.from(tpl.children).forEach(child => {
        toolbarSlot.appendChild(child.cloneNode(true));
      });
      syncToolbar(toolbarSlot, node);
    }
  }
}

// Wire cloned toolbar elements to the live tool instance elements.
// Each cloned element gets its events proxied to the matching live element.
function syncToolbar(slot, toolNode) {
  // Map by class selector — each cloned element routes to its live twin
  const pairs = [
    // doc tools
    ['.doc-file-input', null],            // handled via label click below
    ['.doc-load-prep', '.doc-load-prep'], // adventure: open session-prep picker
    ['.doc-zoom-out',  '.doc-zoom-out'],
    ['.doc-zoom-in',   '.doc-zoom-in'],
    ['.doc-clear',     '.doc-clear'],
    // trackers + combat — handled by document-level delegation in init_trackers
    ['.cbt-next-round', null],
    ['.cbt-reset',      null],
    // notes
    ['.nts-export',    '.nts-export'],
    ['.nts-clear',     '.nts-clear'],
    ['.nts-md-toggle', '.nts-md-toggle'],
    // dice
    ['.dice-clear',    '.dice-clear'],
    // generators
    ['.gen-roll',      '.gen-roll'],
    ['.mus-stopall',   '.mus-stopall'],
    // party
    ['.pty-sync',      '.pty-sync'],
    ['.pty-clear',     '.pty-clear'],
    // rulebooks
    ['.rul-refresh',   '.rul-refresh'],
  ];

  pairs.forEach(([cloneSelector, liveSelector]) => {
    if(!liveSelector) return;
    slot.querySelectorAll(cloneSelector).forEach(cloneEl => {
      const liveEl = toolNode.querySelector(liveSelector);
      if(!liveEl) return;
      if(cloneEl.tagName === 'BUTTON') {
        cloneEl.addEventListener('click', () => {
          liveEl.click();
          // Mirror active state back to clone (e.g. MD toggle)
          if(liveEl.classList.contains('active')) cloneEl.classList.add('active');
          else cloneEl.classList.remove('active');
        });
      }
    });
  });

  // File input: label wraps input in clone — clicking the label opens the live file input
  const cloneLabel = slot.querySelector('label.btn');
  if(cloneLabel) {
    const liveInput = toolNode.querySelector('.doc-file-input');
    if(liveInput) {
      cloneLabel.addEventListener('click', e => {
        e.preventDefault();
        liveInput.click();
      });
      // Update filename display in clone when a file is picked
      liveInput.addEventListener('change', () => {
        const cloneFilename = slot.querySelector('.doc-filename');
        const liveFilename = toolNode.querySelector('.doc-filename');
        if(cloneFilename && liveFilename) {
          // Mirror after a tick so liveFilename has been updated
          setTimeout(() => {
            cloneFilename.textContent = liveFilename.textContent;
            const cloneControls = slot.querySelector('.doc-controls');
            const liveControls = toolNode.querySelector('.doc-controls');
            if(cloneControls && liveControls) {
              cloneControls.style.display = liveControls.style.display;
            }
          }, 200);
        }
      });
    }
  }

  // Party file picker: the cloned label opens the live input
  const clonePtyInput = slot.querySelector('.pty-file-input');
  const livePtyInput  = toolNode.querySelector('.pty-file-input');
  if(clonePtyInput && livePtyInput) {
    const lbl = clonePtyInput.closest('label');
    if(lbl) lbl.addEventListener('click', e => { e.preventDefault(); livePtyInput.click(); });
  }

  // Rulebooks: mirror the live "open in new tab" link onto the cloned one
  const cloneOpen = slot.querySelector('.rul-newtab');
  const liveOpen  = toolNode.querySelector('.rul-newtab');
  if(cloneOpen && liveOpen) {
    const mirror = () => { cloneOpen.href = liveOpen.href; cloneOpen.style.display = liveOpen.style.display; };
    mirror();
    toolNode.addEventListener('rul-book-change', mirror);
  }

  // Notes import: cloned label click triggers live file input
  // Generator tabs: wire each clone tab to its live counterpart by data-tab
  slot.querySelectorAll('.gen-tab-select').forEach(cloneSel => {
    const liveSel = toolNode.querySelector('.gen-tab-select');
    if(!liveSel) return;
    cloneSel.value = liveSel.value;
    cloneSel.addEventListener('change', () => {
      liveSel.value = cloneSel.value;
      liveSel.dispatchEvent(new Event('change'));
    });
  });

  const cloneImportLabel = slot.querySelector('label:has(.nts-import-input)');
  const liveImportInput = toolNode.querySelector('.nts-import-input');
  if(cloneImportLabel && liveImportInput) {
    cloneImportLabel.addEventListener('click', e => {
      e.preventDefault();
      liveImportInput.click();
    });
  }

  // Notes saved indicator: mirror via MutationObserver
  const cloneSaved = slot.querySelector('.nts-saved-indicator');
  const liveSaved = toolNode.querySelector('.nts-saved-indicator');
  if(cloneSaved && liveSaved) {
    const obs = new MutationObserver(() => {
      cloneSaved.textContent = liveSaved.textContent;
      cloneSaved.className = liveSaved.className;
    });
    obs.observe(liveSaved, { attributes: true, childList: true, characterData: true, subtree: true });
  }
}
</script>

<script>
// ══════════════════════════════════════════
// DOCUMENT VIEWER (Adventure + Maps share this)
// ══════════════════════════════════════════
function initDocTool(root) {
  const fileInput = root.querySelector('.doc-file-input');
  const filenameEl = root.querySelector('.doc-filename');
  const emptyEl = root.querySelector('.doc-empty');
  const frameWrap = root.querySelector('.doc-frame-wrap');
  const controls = root.querySelector('.doc-controls');
  const zoomInBtn = root.querySelector('.doc-zoom-in');
  const zoomOutBtn = root.querySelector('.doc-zoom-out');
  const clearBtn = root.querySelector('.doc-clear');
  const isMaps = root.dataset.tool === 'maps';

  let zoom = 1;
  let mediaEl = null;
  let mediaType = null;
  let naturalW = 0, naturalH = 0;
  let savedFileName = '';
  let savedDataUrl = ''; // base64 data URL stored for _getState
  let htmlScaler = null; // wrapper that gives the scaled iframe a real layout box
  let restoreZoom = null; // zoom to apply once an html doc finishes loading
  const HTML_BASE_W = 900; // logical width for two-column (fixed) builder layout
  let htmlFlow = false;    // true when the embedded builder should render single-column
  let htmlFlowSent = null; // last flow value posted to the iframe (avoid spamming)

  // Does this doc pane want the single-column (flow) rendering? Yes only when the
  // pane is cramped — the 4-panel view, or the stacked side panes in Focus. The
  // wider views (Single / Split / Focus main) get the two-column desktop layout.
  function paneWantsFlow() {
    // Mobile collapses to one full-width column regardless of pane — always flow.
    if(typeof isMobileView === 'function' && isMobileView()) return true;
    // Desktop: trust the layout's own "cramped pane" flag. It marks exactly the
    // 4-panel panes and the stacked Focus side panes as narrow; Single, Split,
    // and the Focus main pane are not, so they get the two-column layout.
    const pane = root.closest('.pane');
    if(pane) return pane.classList.contains('narrow');
    // No pane ancestor (unusual embedding): fall back to a conservative width.
    return frameWrap.clientWidth > 0 && frameWrap.clientWidth < 420;
  }

  // Tell the embedded builder which column layout to use (it re-flows itself).
  function sendFlow(flow) {
    if(htmlFlowSent === flow) return;
    htmlFlowSent = flow;
    try {
      if(mediaEl && mediaEl.contentWindow) {
        mediaEl.contentWindow.postMessage({ type: 'dd-flow', flow: flow }, '*');
      }
    } catch(e) { /* cross-origin can't happen here (same-origin doc) */ }
  }

  function applyZoom() {
    if(!mediaEl) return;
    if(mediaType === 'image' && naturalW) {
      mediaEl.style.width = (naturalW * zoom) + 'px';
      mediaEl.style.height = (naturalH * zoom) + 'px';
    } else if(mediaType === 'html' && htmlScaler) {
      const wrapW = Math.max(1, frameWrap.clientWidth);
      const wrapH = Math.max(0, frameWrap.clientHeight);
      if(htmlFlow) {
        // Single-column: render the iframe at the pane's own width so text is at
        // a natural, readable size (no shrink-to-fit). The +/- buttons still zoom
        // from there via the transform.
        const logicalW = Math.max(280, wrapW / zoom);
        mediaEl.style.width = logicalW + 'px';
        mediaEl.style.height = (wrapH / zoom) + 'px';
        mediaEl.style.transform = 'scale(' + zoom + ')';
        mediaEl.style.transformOrigin = 'top left';
        htmlScaler.style.width = (logicalW * zoom) + 'px';
        htmlScaler.style.height = wrapH + 'px';
      } else {
        // Two-column: fixed logical width magnified by a transform to fit the pane.
        mediaEl.style.width = HTML_BASE_W + 'px';
        mediaEl.style.height = (wrapH / zoom) + 'px';
        mediaEl.style.transform = 'scale(' + zoom + ')';
        mediaEl.style.transformOrigin = 'top left';
        htmlScaler.style.width = (HTML_BASE_W * zoom) + 'px';
        htmlScaler.style.height = wrapH + 'px';
      }
    }
  }

  // Fit the logical page width into the current pane, choosing column layout by
  // pane size and telling the embedded builder which to render.
  function fitHtml() {
    htmlFlow = paneWantsFlow();
    sendFlow(htmlFlow);
    const wrapW = Math.max(1, frameWrap.clientWidth);
    if(htmlFlow) {
      // Native size (single column already fits the pane width).
      zoom = 1;
    } else {
      zoom = Math.min(1.5, Math.max(0.3, wrapW / HTML_BASE_W));
    }
    applyZoom();
  }

  zoomInBtn.addEventListener('click', () => {
    if(mediaType === 'image') { zoom = Math.min(4, zoom + 0.1); applyZoom(); }
    else if(mediaType === 'html') { zoom = Math.min(3, zoom + 0.15); applyZoom(); }
  });
  zoomOutBtn.addEventListener('click', () => {
    if(mediaType === 'image') { zoom = Math.max(0.05, zoom - 0.1); applyZoom(); }
    else if(mediaType === 'html') { zoom = Math.max(0.3, zoom - 0.15); applyZoom(); }
  });

  // Keep an html doc filling the pane when it resizes (split changes, etc.)
  if(typeof ResizeObserver !== 'undefined') {
    let rzTimer = null;
    const ro = new ResizeObserver(() => {
      if(mediaType !== 'html') return;
      clearTimeout(rzTimer);
      rzTimer = setTimeout(() => {
        // A view-mode change flips the pane's .narrow state. Only when the
        // single/two-column choice actually changes do we re-fit (which resets
        // zoom); otherwise just re-apply so a manual zoom survives a plain resize.
        if(paneWantsFlow() !== htmlFlow) fitHtml();
        else applyZoom();
      }, 100);
    });
    ro.observe(frameWrap);
  }

  function clearDoc() {
    frameWrap.innerHTML = '';
    frameWrap.style.display = 'none';
    frameWrap.classList.remove('pdf-mode', 'html-mode');
    emptyEl.style.display = 'flex';
    controls.style.display = 'none';
    filenameEl.textContent = isMaps ? 'No map loaded' : 'No document loaded';
    fileInput.value = '';
    mediaEl = null; mediaType = null; naturalW = 0; naturalH = 0;
    htmlScaler = null; restoreZoom = null;
    savedFileName = ''; savedDataUrl = '';
  }

  clearBtn.addEventListener('click', clearDoc);

  // Core loader — works from either a File object or a pre-existing data URL
  function loadFromDataUrl(dataUrl, fileName) {
    const ext = fileName.split('.').pop().toLowerCase();
    filenameEl.textContent = fileName;
    emptyEl.style.display = 'none';
    frameWrap.style.display = 'flex';
    controls.style.display = 'flex';
    frameWrap.innerHTML = '';
    frameWrap.classList.remove('pdf-mode', 'html-mode');
    htmlScaler = null;
    zoom = 1;
    naturalW = 0; naturalH = 0;
    savedFileName = fileName;
    savedDataUrl = dataUrl;

    if(ext === 'html' || ext === 'htm') {
      // Zoomable HTML doc (e.g. a saved session prep). Wide panes render the
      // builder's two-column desktop layout scaled to fit; cramped panes (4-panel,
      // Focus side panes) tell the builder to reflow to a single column at the
      // pane's own width. A CSS transform handles zoom; the scaler wrapper gives
      // the iframe a scrollable layout box.
      mediaType = 'html';
      frameWrap.classList.add('html-mode');
      const scaler = document.createElement('div');
      scaler.className = 'doc-html-scaler';
      const el = document.createElement('iframe');
      el.className = 'doc-frame html-frame';
      el.src = dataUrl;
      el.style.border = 'none';
      scaler.appendChild(el);
      frameWrap.appendChild(scaler);
      mediaEl = el;
      htmlScaler = scaler;
      htmlFlowSent = null; // new doc: force the flow signal to be re-sent
      zoomInBtn.style.display = '';
      zoomOutBtn.style.display = '';
      el.addEventListener('load', () => {
        if(restoreZoom != null) { zoom = restoreZoom; restoreZoom = null; applyZoom(); }
        else fitHtml();
        // The iframe registers its message listener during its own load-time
        // script; re-post the flow signal a couple of times to beat that race.
        htmlFlowSent = null; sendFlow(htmlFlow);
        setTimeout(() => sendFlow(htmlFlow), 120);
        setTimeout(() => sendFlow(htmlFlow), 400);
      });
      // Apply an initial fit even before load in case the pane is already sized
      setTimeout(() => { if(mediaType === 'html' && restoreZoom == null) fitHtml(); }, 60);
    } else if(ext === 'pdf') {
      mediaType = 'pdf';
      frameWrap.classList.add('pdf-mode');
      // On mobile, use <object> which lets the browser's PDF viewer scroll naturally.
      // On desktop, iframe fills the pane with the native viewer.
      const isMobile = window.innerWidth <= 760;
      let el;
      if(isMobile) {
        el = document.createElement('object');
        el.type = 'application/pdf';
        el.data = dataUrl;
        el.className = 'doc-frame pdf-frame';
        el.style.width = '100%';
        el.style.height = '100%';
        // Fallback text inside object tag
        el.innerHTML = '<p style="color:#aaa;padding:16px;">PDF cannot be displayed. <a href="' + dataUrl + '" target="_blank" style="color:#e8c84a">Open PDF ↗</a></p>';
      } else {
        el = document.createElement('iframe');
        el.className = 'doc-frame pdf-frame';
        el.src = dataUrl;
      }
      frameWrap.appendChild(el);
      mediaEl = el;
      zoomInBtn.style.display = 'none';
      zoomOutBtn.style.display = 'none';
    } else if(['png','jpg','jpeg','webp','gif','svg'].includes(ext)) {
      mediaType = 'image';
      zoomInBtn.style.display = '';
      zoomOutBtn.style.display = '';
      const img = document.createElement('img');
      img.className = 'doc-image';
      img.style.width = 'auto';
      img.style.height = 'auto';
      frameWrap.appendChild(img);
      mediaEl = img;
      img.onload = () => {
        naturalW = img.naturalWidth;
        naturalH = img.naturalHeight;
        const padding = 32;
        const availW = frameWrap.clientWidth - padding;
        const availH = frameWrap.clientHeight - padding;
        const fitScale = Math.min(availW / naturalW, availH / naturalH, 1);
        zoom = Math.max(0.05, fitScale);
        applyZoom();
      };
      img.src = dataUrl;
    }
  }

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if(!file) return;
    // Warn immediately if the file is too large to persist across reloads
    const MAX_SAVE_MB = 3.75; // ~5MB as base64 after encoding
    if(file.size > MAX_SAVE_MB * 1024 * 1024) {
      filenameEl.textContent = file.name + ' too large to auto-save (will need reloading)';
    }
    const reader = new FileReader();
    reader.onload = e => loadFromDataUrl(e.target.result, file.name);
    reader.readAsDataURL(file);
  });

  // State hooks — save file data as base64 for files under 5MB (encoded).
  // Larger files (like big PDFs) must be reloaded each session.
  const MAX_FILE_BYTES = 5 * 1024 * 1024; // 5MB base64 limit

  root._getState = () => ({
    fileName: savedFileName,
    fileData: savedDataUrl && savedDataUrl.length < MAX_FILE_BYTES ? savedDataUrl : null,
    fileTooLarge: savedDataUrl && savedDataUrl.length >= MAX_FILE_BYTES ? savedFileName : null,
    zoom,
  });
  root._setState = (s) => {
    if(s && s.fileData && s.fileName) {
      // For html docs the zoom is applied once the iframe fires 'load'
      // (see the html branch); for images the timeout below handles it.
      restoreZoom = (typeof s.zoom === 'number' && s.zoom > 0) ? s.zoom : null;
      loadFromDataUrl(s.fileData, s.fileName);
      if(s.zoom && s.zoom !== 1) {
        setTimeout(() => { if(mediaType === 'image') { zoom = s.zoom; applyZoom(); } }, 100);
      }
    } else if(s && s.fileTooLarge) {
      filenameEl.textContent = s.fileTooLarge + ' (too large to auto-restore — reload manually)';
    }
  };
  // Allow other tools to programmatically load an image into this doc viewer
  root._loadDataUrl = (dataUrl, fileName) => loadFromDataUrl(dataUrl, fileName);

  // Adventure pane also gets a "Session Prep" loader that pulls in a saved
  // session-prep document (preview-only) from the user's account.
  if(root.dataset.tool === 'adventure') wireSessionPrepLoader(root);
}

// ── SESSION PREP LOADER (Adventure only) ──────────────────────────────────
// Adds a "Load Session Prep" button to the adventure empty state and a
// "Session Prep" button to its toolbar. Both open a picker of the user's saved
// session-prep documents; choosing one loads it into this pane as a read-only
// preview (the builder's editing sidebar is hidden by ?view=preview).
function wireSessionPrepLoader(root) {
  const emptyEl = root.querySelector('.doc-empty');
  const toolbarTpl = root.querySelector('.toolbar-tpl');

  function open() {
    openPrepPicker(function(doc) {
      const url = '/tools/' + doc.tool + '/' + doc.id + '?view=preview';
      const name = (doc.title || 'Session Prep') + '.html';
      root._loadDataUrl(url, name);
    });
  }

  if(emptyEl && !emptyEl.querySelector('.doc-load-prep')) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn primary small doc-load-prep';
    b.innerHTML = '<svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M3.5 5.6a1.6 1.6 0 0 1 1.6-1.6h3.8l2 2h6a1.6 1.6 0 0 1 1.6 1.6v1H6.4a1.6 1.6 0 0 0-1.5 1.1L3.5 15Z"/><path d="M6.4 10.2h14.2a1 1 0 0 1 1 1.3l-1.9 6.4a1.6 1.6 0 0 1-1.5 1.1H4.6a1.6 1.6 0 0 1-1.5-2.1l1.8-5.6a1.6 1.6 0 0 1 1.5-1.1Z" opacity=".85"/></svg> Load Session Prep';
    b.style.marginTop = '4px';
    b.addEventListener('click', open);
    emptyEl.appendChild(b);
  }

  // Toolbar button lives in the hidden template; syncToolbar clones it into the
  // pane header and proxies clicks back here (see the '.doc-load-prep' pair).
  if(toolbarTpl && !toolbarTpl.querySelector('.doc-load-prep')) {
    const tb = document.createElement('button');
    tb.type = 'button';
    tb.className = 'btn small doc-load-prep';
    tb.innerHTML = '<svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M3.5 5.6a1.6 1.6 0 0 1 1.6-1.6h3.8l2 2h6a1.6 1.6 0 0 1 1.6 1.6v1H6.4a1.6 1.6 0 0 0-1.5 1.1L3.5 15Z"/><path d="M6.4 10.2h14.2a1 1 0 0 1 1 1.3l-1.9 6.4a1.6 1.6 0 0 1-1.5 1.1H4.6a1.6 1.6 0 0 1-1.5-2.1l1.8-5.6a1.6 1.6 0 0 1 1.5-1.1Z" opacity=".85"/></svg>';
    tb.title = 'Load Session Prep';
    tb.setAttribute('aria-label', 'Load Session Prep');
    tb.addEventListener('click', open);
    const label = toolbarTpl.querySelector('label.btn');
    if(label && label.nextSibling) toolbarTpl.insertBefore(tb, label.nextSibling);
    else if(toolbarTpl.firstChild) toolbarTpl.insertBefore(tb, toolbarTpl.firstChild);
    else toolbarTpl.appendChild(tb);
  }
}

let _prepPicker = null;
function openPrepPicker(onPick) {
  if(!_prepPicker) _prepPicker = buildPrepPicker();
  _prepPicker._onPick = onPick;
  _prepPicker.classList.add('open');
  loadPrepList(_prepPicker);
}

function buildPrepPicker() {
  const wrap = document.createElement('div');
  wrap.className = 'prep-picker';
  wrap.innerHTML =
    '<div class="prep-picker-card">' +
      '<div class="prep-picker-head">' +
        '<span class="prep-picker-title">Load Session Prep</span>' +
        '<button class="prep-picker-close" type="button" aria-label="Close">&times;</button>' +
      '</div>' +
      '<div class="prep-picker-list"></div>' +
    '</div>';
  document.body.appendChild(wrap);
  const close = () => wrap.classList.remove('open');
  wrap.querySelector('.prep-picker-close').addEventListener('click', close);
  wrap.addEventListener('click', (e) => { if(e.target === wrap) close(); });
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') close(); });
  return wrap;
}

function loadPrepList(wrap) {
  const list = wrap.querySelector('.prep-picker-list');
  list.innerHTML = '<div class="prep-picker-msg">Loading&hellip;</div>';
  fetch('/api/documents?kind=session', { credentials: 'same-origin' })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(items => {
      if(!Array.isArray(items) || items.length === 0) {
        list.innerHTML = '<div class="prep-picker-msg">No saved Session Prep sheets yet.<br>Create one from the dashboard first.</div>';
        return;
      }
      const esc = s => (s || '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
      list.innerHTML = '';
      items.forEach(it => {
        const when = it.updatedAt ? new Date(it.updatedAt).toLocaleDateString() : '';
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'prep-picker-item';
        btn.innerHTML =
          '<span class="prep-picker-item-main">' +
            '<span class="prep-picker-item-title">' + esc(it.title || 'Untitled') + '</span>' +
            (when ? '<span class="prep-picker-item-sub">Updated ' + esc(when) + '</span>' : '') +
          '</span>' +
          (it.system ? '<span class="prep-picker-badge">' + esc(it.system) + '</span>' : '');
        btn.addEventListener('click', () => {
          wrap.classList.remove('open');
          if(typeof wrap._onPick === 'function') wrap._onPick(it);
        });
        list.appendChild(btn);
      });
    })
    .catch(() => {
      list.innerHTML = '<div class="prep-picker-msg">Couldn\u2019t load your session prep list.</div>';
    });
}

function init_adventure(root) { initDocTool(root); }
function init_maps(root) { initDocTool(root); }
</script>

<script>
// ══════════════════════════════════════════
// COMBAT & TRACKERS TOOL
// ══════════════════════════════════════════
// ═══ TRACKERS + COMBAT (merged) ═══════════════════════════════════════════
// One ordered list holds both kinds of card:
//   { type:'tracker', kind:'rounds'|'timer', ... }
//   { type:'npc',     hpMode:'standard'|'dcc', ... }
// Cards can be reordered by dragging the ⠿ handle or with the ▲▼ buttons.
function init_trackers(root) {
  let round = 1;
  let items = [];            // unified, ordered
  let nextId = 1;

  const list  = root.querySelector('.cbt-tracker-list');
  const empty = root.querySelector('.cbt-trackers-empty');

  function escAttr(s) { return (s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
  function fmtTime(sec) {
    sec = Math.max(0, sec);
    return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  }
  function updateRoundDisplay() {
    document.querySelectorAll('.trk-round-num').forEach(el => { el.textContent = round; });
  }
  function npcHpColor(pct) {
    if(pct <= 0)  return '#3a3a3a';
    if(pct <= 25) return '#b82018';
    if(pct <= 50) return '#c08020';
    if(pct <= 75) return '#c8a020';
    return '#4caf50';
  }
  function dccSegColor(index, total) {
    const colors = ['#b82018', '#c08020', '#c8a020', '#4caf50'];
    return colors[Math.min(3, Math.floor((index * 4) / total))];
  }

  // ── Reordering ──
  function moveItem(id, delta) {
    const i = items.findIndex(x => x.id === id);
    const j = i + delta;
    if(i < 0 || j < 0 || j >= items.length) return;
    [items[i], items[j]] = [items[j], items[i]];
    render();
  }
  function reorderHtml(item, idx) {
    const first = idx === 0, last = idx === items.length - 1;
    // Stacked ▲▼ in one narrow column — keeps the delete button on the card
    return `
      <div class="card-reorder">
        <button class="card-move card-up" ${first ? 'disabled' : ''} title="Move up">&#9650;</button>
        <button class="card-move card-down" ${last ? 'disabled' : ''} title="Move down">&#9660;</button>
      </div>`;
  }
  function wireReorder(card, item) {
    card.querySelector('.card-up')?.addEventListener('click', () => moveItem(item.id, -1));
    card.querySelector('.card-down')?.addEventListener('click', () => moveItem(item.id, +1));
  }

  // ── Tag field + Status list (NPC cards) ──
  // The tag sits on the same row as the + Status button; statuses stack below.
  function statusListHtml(entity, opts) {
    const withAdd = !opts || opts.withAddButton !== false;
    // The tag sits inline beside the HP adjust buttons for standard-mode cards;
    // only render it here (in the status bar) when that inline spot isn't used.
    const withTag = !opts || opts.withTag !== false;
    const rows = (entity.statuses || []).map(s => `
      <div class="status-row" data-status-id="${s.id}">
        <input type="checkbox" class="status-check" ${s.checked ? 'checked' : ''}>
        <input type="text" class="status-text" value="${escAttr(s.text)}" placeholder="Status, condition, recharge...">
        <button class="status-del" title="Remove">&#10005;</button>
      </div>
    `).join('');
    return `
      <div class="status-bar">
        ${withAdd ? '<button class="btn small ghost status-add">+ Status</button>' : ''}
        ${withTag ? `<input type="text" class="npc-tag-input" value="${escAttr(entity.tag || '')}" placeholder="Tag (elite, minion, ...)">` : ''}
      </div>
      <div class="status-list">${rows}</div>`;
  }
  function wireStatusList(card, entity) {
    if(!entity.statuses) entity.statuses = [];
    if(!entity._nextStatusId) entity._nextStatusId = 1;
    card.querySelector('.npc-tag-input')?.addEventListener('input', e => { entity.tag = e.target.value; });
    card.querySelectorAll('.status-row').forEach(row => {
      const id = parseInt(row.dataset.statusId);
      const st = entity.statuses.find(x => x.id === id);
      if(!st) return;
      row.querySelector('.status-check').addEventListener('change', e => { st.checked = e.target.checked; });
      row.querySelector('.status-text').addEventListener('input',  e => { st.text = e.target.value; });
      row.querySelector('.status-del').addEventListener('click', () => {
        entity.statuses = entity.statuses.filter(x => x.id !== id);
        render();
      });
    });
    card.querySelector('.status-add')?.addEventListener('click', () => {
      entity.statuses.push({ id: entity._nextStatusId++, checked: false, text: '' });
      render();
    });
  }

  // ── Bestiary monsters as combatants ──
  // A monster combatant is a normal NPC item with a `mon` snapshot attached, so
  // every existing behaviour (HP bar, statuses, reorder, save/restore) keeps
  // working untouched — the snapshot only adds the stat block to the card.
  function monsterItem(m) {
    const hp = parseInt(m.hp, 10);
    return {
      id: nextId++, type: 'npc',
      name: m.name || 'Monster',
      tag: '', hpMode: 'standard',
      // A handful of book creatures have variable HP (listed as "*"); they get a
      // placeholder the GM can edit, with the book value shown in the block.
      hpCurrent: Number.isFinite(hp) ? hp : 10,
      hpMax: Number.isFinite(hp) ? hp : 10,
      statuses: [],
      traitsOpen: false,
      mon: {
        ac: m.ac || '', hp: m.hp || '', mv: m.mv || '', lv: m.lv || '', al: m.al || '',
        s: m.s || '', d: m.d || '', c: m.c || '', i: m.i || '', w: m.w || '', ch: m.ch || '',
        atk: m.atk || '', notes: m.notes || '',
        ctype: (typeof monsterTypeOf === 'function') ? monsterTypeOf(m.name) : ''
      }
    };
  }

  function monStat(label, val) {
    if(!val && val !== 0) return '';
    return `<div class="npc-mon-stat"><span class="npc-mon-label">${escAttr(label)}</span><span>${escAttr(String(val))}</span></div>`;
  }

  // An ability cell that rolls d20 + its modifier into the Dice tray.
  function monRollStat(label, val) {
    if(!val && val !== 0) return '';
    const mod = String(val).trim();
    return `<button class="npc-mon-stat npc-mon-roll" data-roll="1d20${/^[+-]/.test(mod) ? mod : '+' + mod}" data-rolllabel="${escAttr(label)} check" title="Roll d20 ${escAttr(mod)}">
      <span class="npc-mon-label">${escAttr(label)}</span><span>${escAttr(mod)}</span></button>`;
  }

  // Monster attack lines read like:
  //   "1 club +0 (1d4) or 1 shortbow (far) +1 (1d4)"
  //   "2 tentacle (near) +5 (1d8 + curse)"
  //   "3 rend +9 (2d10) and 1 fire belch"
  // Split on " or "/" and ", then pull out the to-hit bonus and the damage dice
  // so each gets its own button. The damage group is the first parenthesised
  // part containing dice — "(near)" and similar range notes are skipped. Special
  // abilities with no bonus or dice ("1 mind blast") stay as plain text; their
  // effect lives in Traits.
  function parseAttacks(atk) {
    return String(atk || '').split(/\s+(?:or|and)\s+/i).map(part => {
      const t = part.trim();
      if(!t) return null;
      const hit = t.match(/([+-]\d+)(?!.*[+-]\d+\s*\()/);
      const dmgGroup = t.match(/\(([^)]*\d+d\d+[^)]*)\)/i);
      const dmg = dmgGroup ? (dmgGroup[1].match(/\d*d\d+(\s*[+-]\s*\d+)?/i) || [null])[0] : null;
      // "2 bite (near) +4 (2d6)" → "bite", for the roll label.
      const nameMatch = t.match(/^\s*\d*\s*([A-Za-z][A-Za-z '\-]*?)\s*(?:\(|[+-]\d|$)/);
      return {
        text: t, name: nameMatch ? nameMatch[1].trim() : '',
        hit: hit ? hit[1] : null, dmg: dmg ? dmg.replace(/\s+/g, '') : null
      };
    }).filter(Boolean);
  }

  // Traits read as "Name: body." runs. Split them so each is its own line, and
  // turn any dice inside into roll buttons — a lot of monster damage lives here
  // rather than on the attack line (a fire dragon's breath is 6d10 in Traits).
  function splitTraits(notes) {
    const str = String(notes || '').trim();
    if(!str) return [];
    // Anchored at the start or just after a sentence, so a two-word label like
    // "Fire Breath:" isn't cut in half. No lookbehind — older iPad Safari.
    const re = /(^|\.\s+)((?:[A-Z][A-Za-z0-9'\u2019\-]*[ ]){0,3}[A-Z][A-Za-z0-9'\u2019\-]*)[ ]*:[ ]*/g;
    const marks = [];
    let m;
    while((m = re.exec(str))) marks.push({ start: m.index + m[1].length, bodyAt: m.index + m[0].length, name: m[2] });
    if(!marks.length) return [{ name: '', body: str }];
    const out = [];
    const pre = str.slice(0, marks[0].start).trim();
    if(pre) out.push({ name: '', body: pre });
    marks.forEach((mk, i) => {
      const end = i + 1 < marks.length ? marks[i + 1].start : str.length;
      out.push({ name: mk.name, body: str.slice(mk.bodyAt, end).trim() });
    });
    return out;
  }

  function traitsHtml(monName, notes) {
    return splitTraits(notes).map(tr => {
      const label = (tr.name ? tr.name : 'trait');
      // Escape first, then swap dice runs for buttons — dice contain no markup
      // characters, so the substitution can't break the escaping.
      const body = escAttr(tr.body).replace(/(\d*d\d+(?:\s*[+-]\s*\d+)?)/gi, (dice) =>
        `<button class="npc-mon-btn npc-mon-roll" data-roll="${dice.replace(/\s+/g, '')}" data-rolllabel="${escAttr(label)}" title="Roll ${dice}">${dice}</button>`);
      return `<div class="npc-mon-trait">${tr.name ? `<span class="npc-mon-trait-name">${escAttr(tr.name)}</span> ` : ''}${body}</div>`;
    }).join('');
  }

  function attackRowsHtml(name, atk) {
    const list_ = parseAttacks(atk);
    if(!list_.length) return '';
    return list_.map(a => {
      if(!a.hit && !a.dmg) {
        // A special ability with no bonus or dice — its damage, if any, lives in
        // Traits, where it gets its own roll button.
        return `<div class="npc-mon-atk"><span class="npc-mon-atk-text">${escAttr(a.text)}</span></div>`;
      }
      // To-hit and damage roll together, as the character sheet does it.
      const face = [a.hit, a.dmg].filter(Boolean).join(' / ');
      const btn = `<button class="npc-mon-btn npc-mon-attack" data-hit="${escAttr(a.hit || '')}" data-dmg="${escAttr(a.dmg || '')}"
        data-atkname="${escAttr(a.name || 'attack')}" title="Roll attack and damage">${escAttr(face)}</button>`;
      return `<div class="npc-mon-atk"><span class="npc-mon-atk-text">${escAttr(a.text)}</span>${btn}</div>`;
    }).join('');
  }

  function monsterBlockHtml(n) {
    const mo = n.mon;
    if(!mo) return '';
    // HP is deliberately absent: the bar above already shows it, and dropping it
    // leaves room for Type on the same line.
    const head = [monStat('AC', mo.ac), monStat('MV', mo.mv),
                  monStat('LV', mo.lv), monStat('AL', mo.al), monStat('Type', mo.ctype)].join('');
    const abil = [monRollStat('STR', mo.s), monRollStat('DEX', mo.d), monRollStat('CON', mo.c),
                  monRollStat('INT', mo.i), monRollStat('WIS', mo.w), monRollStat('CHA', mo.ch)].join('');
    const atk = mo.atk
      ? `<div class="npc-mon-atks"><span class="npc-mon-label">ATK</span>${attackRowsHtml(n.name || 'Monster', mo.atk)}</div>` : '';
    // Stats (AC/MV/LV/AL/Type + ability mods) fold away to save space in a
    // crowded initiative list. Open by default; the state is per-combatant and
    // is saved. Attacks are deliberately left outside this fold — they stay
    // visible so they're always one tap from the dice tray.
    const statsOpen = n.statsOpen !== false;
    const stats = `<button class="npc-mon-stats-btn">${statsOpen ? '&#9662;' : '&#9656;'} Stats</button>` +
      (statsOpen ? `<div class="npc-mon-stats-wrap">
        <div class="npc-mon-stats">${head}</div>
        <div class="npc-mon-stats">${abil}</div>
      </div>` : '');
    // Traits can run to a paragraph, which makes a combat list hard to scan, so
    // they fold away. The open/closed state is per-combatant and is saved.
    const traits = mo.notes
      ? `<button class="npc-mon-traits-btn">${n.traitsOpen ? '&#9662;' : '&#9656;'} Traits</button>` +
        (n.traitsOpen ? `<div class="npc-mon-traits">${traitsHtml(n.name || 'Monster', mo.notes)}</div>` : '')
      : '';
    return `<div class="npc-mon">
        ${stats}
        ${atk}${traits}
      </div>`;
  }

  // ── Tracker card ──
  function buildTrackerCard(t, idx) {
    const card = document.createElement('div');
    card.dataset.id = t.id;
    const expired = t.kind === 'rounds' ? t.rounds <= 0 : t.remainingSeconds <= 0;
    card.className = 'tracker-card' + (t.kind === 'timer' ? ' timer-type' : '') + (expired ? ' expired' : '');
    const collapsed = !!t.collapsed;

    // Top-row live readout: rounds count or remaining time (always visible)
    const displayHtml = t.kind === 'rounds' ? `
        <div class="tracker-rounds-display">
          <span class="tracker-rounds ${t.rounds<=0?'zero':''}">${t.rounds}</span>
          <span class="tracker-label">${t.rounds<=0 ? 'Expired' : 'rounds'}</span>
        </div>` : `
        <div class="tracker-rounds-display">
          <span class="timer-display ${t.remainingSeconds<=0?'zero':''}">${fmtTime(t.remainingSeconds)}</span>
          <span class="tracker-label">${t.remainingSeconds<=0 ? "Time's Up" : (t.running ? 'running' : 'paused')}</span>
        </div>`;

    // Second-row, kind-specific controls (collapsible)
    const controlsHtml = t.kind === 'rounds' ? `
        <div class="tracker-round-adjust">
          <button class="tracker-adjust-btn tracker-dec" title="-1 round">&minus;</button>
          <button class="tracker-adjust-btn tracker-inc" title="+1 round">+</button>
        </div>
      ` : `
        <div class="timer-controls">
          <button class="tracker-adjust-btn timer-toggle">${t.running ? '<svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M6.5 4.5h3.4a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H6.5a1 1 0 0 1-1-1v-13a1 1 0 0 1 1-1Zm7.6 0h3.4a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-3.4a1 1 0 0 1-1-1v-13a1 1 0 0 1 1-1Z"/></svg>' : '<svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M7 4.6v14.8a1 1 0 0 0 1.5.86l12-7.4a1 1 0 0 0 0-1.72l-12-7.4A1 1 0 0 0 7 4.6Z"/></svg>'}</button>
          <button class="tracker-adjust-btn timer-reset" title="Reset"><svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M12 5.6a6.4 6.4 0 0 1 5.5 3.1H15.3v2.1h5.4V5.4h-2.1v1.9A8.5 8.5 0 0 0 3.6 11.2l2.1.3A6.4 6.4 0 0 1 12 5.6z"/><path d="M12 18.4a6.4 6.4 0 0 1-5.5-3.1h2.2v-2.1H3.3v5.4h2.1v-1.9A8.5 8.5 0 0 0 20.4 12.8l-2.1-.3A6.4 6.4 0 0 1 12 18.4z"/></svg></button>
        </div>
        <div class="timer-set-row">
          <span class="timer-set-label">Set</span>
          <input type="number" class="timer-set-input timer-min" min="0" value="${Math.floor(t.totalSeconds/60)}">
          <span class="timer-set-label">m</span>
          <input type="number" class="timer-set-input timer-sec" min="0" max="59" value="${t.totalSeconds%60}">
          <span class="timer-set-label">s</span>
          <button class="btn small ghost timer-apply" style="margin-left:6px;">Apply</button>
        </div>
      `;

    card.innerHTML = `
      <div class="tracker-top">
        ${reorderHtml(t, idx)}
        <input type="text" class="tracker-name-input" value="${escAttr(t.name)}" placeholder="Tracker name...">
        ${displayHtml}
        <button class="tracker-collapse" title="${collapsed ? 'Show controls' : 'Hide controls'}" aria-expanded="${!collapsed}">${collapsed ? '&#9662;' : '&#9652;'}</button>
        <button class="tracker-del" title="Remove">&#10005;</button>
      </div>
      <div class="tracker-controls-row${collapsed ? ' collapsed' : ''}">
        <select class="card-select tracker-type-select ${t.kind}-active" title="Tracker type">
          <option value="rounds" ${t.kind==='rounds'?'selected':''}>Rounds</option>
          <option value="timer"  ${t.kind==='timer' ?'selected':''}>Timer</option>
        </select>
        ${controlsHtml}
      </div>
    `;

    card.querySelector('.tracker-name-input').addEventListener('input', e => { t.name = e.target.value; });
    card.querySelector('.tracker-del').addEventListener('click', () => { items = items.filter(x => x.id !== t.id); render(); });
    card.querySelector('.tracker-collapse').addEventListener('click', () => { t.collapsed = !t.collapsed; render(); });
    card.querySelector('.tracker-type-select').addEventListener('change', e => {
      const kind = e.target.value;
      if(kind === t.kind) return;
      t.running = false;
      t.kind = kind;
      if(kind === 'timer' && t.totalSeconds === undefined) { t.totalSeconds = 60; t.remainingSeconds = 60; }
      render();
    });
    if(t.kind === 'rounds') {
      card.querySelector('.tracker-dec').addEventListener('click', () => { t.rounds = Math.max(0, t.rounds - 1); render(); });
      card.querySelector('.tracker-inc').addEventListener('click', () => { t.rounds += 1; render(); });
    } else {
      card.querySelector('.timer-toggle').addEventListener('click', () => { t.running = !t.running; render(); });
      card.querySelector('.timer-reset').addEventListener('click',  () => { t.running = false; t.remainingSeconds = t.totalSeconds; render(); });
      card.querySelector('.timer-apply')?.addEventListener('click', () => {
        const min = parseInt(card.querySelector('.timer-min').value) || 0;
        const sec = parseInt(card.querySelector('.timer-sec').value) || 0;
        t.totalSeconds = min * 60 + sec;
        t.remainingSeconds = t.totalSeconds;
        t.running = false;
        render();
      });
    }
    return card;
  }

  // ── NPC / combatant card ──
  function buildNpcCard(n, idx) {
    const card = document.createElement('div');
    card.dataset.id = n.id;
    const mode = n.hpMode || 'standard';
    let hpBlockHtml = '', defeated = false;

    if(mode === 'standard') {
      const pct = n.hpMax > 0 ? Math.max(0, Math.min(100, (n.hpCurrent / n.hpMax) * 100)) : 0;
      defeated = n.hpCurrent <= 0;
      hpBlockHtml = `
        <div class="npc-hp-row">
          <input type="number" class="npc-hp-input npc-hp-current" value="${n.hpCurrent}">
          <span class="npc-hp-slash">/</span>
          <input type="number" class="npc-hp-input npc-hp-max" value="${n.hpMax}">
          <button class="btn small ghost status-add npc-hp-status">+ Status</button>
        </div>
        <div class="npc-hp-second">
          <div class="npc-hp-adjust">
            <button class="npc-hp-btn dmg npc-dmg5" title="-5 HP">&minus;5</button>
            <button class="npc-hp-btn dmg npc-dmg1" title="-1 HP">&minus;1</button>
            <button class="npc-hp-btn heal npc-heal1" title="+1 HP">+1</button>
            <button class="npc-hp-btn heal npc-heal5" title="+5 HP">+5</button>
          </div>
          <input type="text" class="npc-tag-input npc-tag-inline" value="${escAttr(n.tag || '')}" placeholder="Tag (elite, minion, ...)">
        </div>
        <div class="npc-hp-bar-track"><div class="npc-hp-bar-fill" style="width:${pct}%;background:${npcHpColor(pct)};"></div></div>
      `;
    } else {
      const segCount = n.segCount || 10;
      const segHp = n.segHp !== undefined ? n.segHp : 10;
      if(!n.segments || n.segments.length !== segCount) n.segments = Array.from({length: segCount}, () => true);
      defeated = n.segments.filter(Boolean).length === 0;
      const segHtml = n.segments.map((alive, i) => `
          <button class="npc-seg ${alive ? '' : 'dead'}" data-seg-idx="${i}" style="--seg-color:${dccSegColor(i, segCount)};" title="Segment ${i+1}${alive ? '' : ' (down)'}">
            <span class="npc-seg-num">${segHp}</span>
          </button>`).join('');
      hpBlockHtml = `
        <div class="npc-seg-setup">
          <span class="npc-seg-setup-label">Segments</span>
          <input type="number" class="npc-seg-count-input" min="1" max="20" value="${segCount}">
          <span class="npc-seg-setup-label">HP Each</span>
          <input type="number" class="npc-seg-hp-input" min="1" value="${segHp}">
          <button class="btn small ghost npc-seg-apply">Apply</button>
        </div>
        <div class="npc-seg-row">${segHtml}</div>
      `;
    }

    card.className = 'npc-card' + (defeated ? ' defeated' : '');
    card.innerHTML = `
      ${n.mon ? '' : `<div class="npc-mode-bar"><select class="card-select npc-mode-select ${mode==='dcc'?'dcc-active':'std-active'}" title="HP mode">
        <option value="standard" ${mode==='standard'?'selected':''}>Standard</option>
        <option value="dcc"      ${mode==='dcc'     ?'selected':''}>DCC</option>
      </select></div>`}
      <div class="npc-top">
        ${reorderHtml(n, idx)}
        <input type="text" class="npc-name-input" value="${escAttr(n.name)}" placeholder="NPC / Monster name...">
        <button class="npc-del" title="Remove">&#10005;</button>
      </div>
      ${hpBlockHtml}
      ${defeated ? '<div class="npc-defeated-tag">Defeated</div>' : ''}
      ${monsterBlockHtml(n)}
      ${statusListHtml(n, { withAddButton: mode !== 'standard', withTag: mode !== 'standard' })}
    `;

    card.querySelector('.npc-name-input').addEventListener('input', e => { n.name = e.target.value; });
    card.querySelector('.npc-del').addEventListener('click', () => { items = items.filter(x => x.id !== n.id); render(); });
    card.querySelector('.npc-mode-select')?.addEventListener('change', e => {
      if(e.target.value === mode) return;
      n.hpMode = e.target.value;
      render();
    });

    if(mode === 'standard') {
      card.querySelector('.npc-hp-current').addEventListener('change', e => { n.hpCurrent = parseInt(e.target.value) || 0; render(); });
      card.querySelector('.npc-hp-max').addEventListener('change',     e => { n.hpMax = parseInt(e.target.value) || 0; render(); });
      card.querySelector('.npc-hp-current').addEventListener('keydown', e => { if(e.key === 'Enter') e.target.blur(); });
      card.querySelector('.npc-hp-max').addEventListener('keydown',     e => { if(e.key === 'Enter') e.target.blur(); });
      card.querySelector('.npc-dmg5').addEventListener('click',  () => { n.hpCurrent = Math.max(0, n.hpCurrent - 5); render(); });
      card.querySelector('.npc-dmg1').addEventListener('click',  () => { n.hpCurrent = Math.max(0, n.hpCurrent - 1); render(); });
      card.querySelector('.npc-heal1').addEventListener('click', () => { n.hpCurrent = Math.min(n.hpMax, n.hpCurrent + 1); render(); });
      card.querySelector('.npc-heal5').addEventListener('click', () => { n.hpCurrent = Math.min(n.hpMax, n.hpCurrent + 5); render(); });
    } else {
      card.querySelector('.npc-seg-apply').addEventListener('click', () => {
        const count = Math.max(1, Math.min(20, parseInt(card.querySelector('.npc-seg-count-input').value) || 1));
        const hp = Math.max(1, parseInt(card.querySelector('.npc-seg-hp-input').value) || 1);
        n.segCount = count; n.segHp = hp;
        n.segments = Array.from({length: count}, () => true);
        render();
      });
      card.querySelectorAll('.npc-seg').forEach(seg => {
        seg.addEventListener('click', () => {
          const i = parseInt(seg.dataset.segIdx);
          n.segments[i] = !n.segments[i];
          render();
        });
      });
    }
    card.querySelectorAll('.npc-mon-roll').forEach(b => {
      b.addEventListener('click', () => {
        const label = (n.name ? n.name + ' · ' : '') + (b.dataset.rolllabel || 'Roll');
        if(typeof window.rollToDiceTray === 'function') window.rollToDiceTray(label, b.dataset.roll);
      });
    });
    card.querySelectorAll('.npc-mon-attack').forEach(b => {
      b.addEventListener('click', () => {
        const label = (n.name ? n.name + ' · ' : '') + (b.dataset.atkname || 'attack');
        if(typeof window.rollAttackToDiceTray === 'function') {
          window.rollAttackToDiceTray(label, b.dataset.hit || null, b.dataset.dmg || null);
        }
      });
    });
    card.querySelector('.npc-mon-stats-btn')?.addEventListener('click', () => {
      n.statsOpen = (n.statsOpen === false);
      render();
    });
    card.querySelector('.npc-mon-traits-btn')?.addEventListener('click', () => {
      n.traitsOpen = !n.traitsOpen;
      render();
    });
    wireStatusList(card, n);
    return card;
  }

  // ── Monster picker ──
  // Opens above the list; pick a monster and it joins the fight with its stats.
  let pickerOpen = false, pickerQuery = '', pickerType = '';

  function pickerMatches() {
    if(typeof allMonsters !== 'function') return [];
    const q = pickerQuery.trim().toLowerCase();
    return allMonsters().filter(m => {
      if(pickerType && (typeof monsterTypeOf === 'function') && monsterTypeOf(m.name) !== pickerType) return false;
      if(!q) return true;
      return String(m.name).toLowerCase().includes(q);
    });
  }

  let pickerEl = null;

  function pickerRowsHtml() {
    const found = pickerMatches();
    const rows = found.slice(0, 60).map(m => `
      <button class="mon-pick-item" data-mon="${escAttr(m.name)}">
        <span class="mon-pick-item-name">${escAttr(m.name)}</span>
        <span class="mon-pick-item-meta">LV ${escAttr(m.lv)} &middot; HP ${escAttr(m.hp)} &middot; AC ${escAttr(m.ac)}</span>
      </button>`).join('');
    return (rows || '<div class="mon-pick-empty">No monster matches that search.</div>') +
      (found.length > 60 ? `<div class="mon-pick-empty">Showing 60 of ${found.length} &mdash; keep typing to narrow it down.</div>` : '');
  }

  function wirePickerRows() {
    pickerEl?.querySelectorAll('.mon-pick-item').forEach(btn => {
      btn.addEventListener('click', () => {
        const m = allMonsters().find(x => x.name === btn.dataset.mon);
        if(m) { items.push(monsterItem(m)); render(); }
      });
    });
  }

  // Only the results redraw while typing, so the search box (and the caret)
  // is never torn out from under the user.
  function refreshPickerRows() {
    const listEl = pickerEl?.querySelector('.mon-pick-list');
    if(!listEl) return;
    listEl.innerHTML = pickerRowsHtml();
    wirePickerRows();
  }

  function openPicker() {
    if(pickerEl) return;
    const types = (typeof SD_MONSTER_TYPE_LIST !== 'undefined' && typeof monsterTypeOf === 'function')
      ? SD_MONSTER_TYPE_LIST.filter(t => allMonsters().some(m => monsterTypeOf(m.name) === t)) : [];
    pickerEl = document.createElement('div');
    pickerEl.className = 'mon-pick';
    pickerEl.innerHTML = `
      <div class="mon-pick-controls">
        <input type="text" class="mon-pick-search" placeholder="Search the bestiary..." value="${escAttr(pickerQuery)}">
        <select class="mon-pick-type">
          <option value="">Any Type</option>
          ${types.map(t => `<option value="${escAttr(t)}" ${t === pickerType ? 'selected' : ''}>${escAttr(t)}</option>`).join('')}
        </select>
        <button class="btn small ghost mon-pick-close">Close</button>
      </div>
      <div class="mon-pick-add-row">
        <button class="btn small ghost mon-pick-timer cbt-add-tracker" title="Add a timer / round tracker"><svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M9.2 1.8h5.6v2H9.2z"/><path d="M18.5 6.9l1.3-1.3 1.3 1.3-1.4 1.4A8.2 8.2 0 1 1 12 4.6a8 8 0 0 1 4.6 1.4l1-1 .9.9ZM12.9 8.6h-1.8v4.9l3.6 2.2.95-1.55-2.75-1.65Z"/></svg> Timer</button>
        <button class="btn small ghost mon-pick-blank cbt-add-npc" title="Add an empty combatant">Blank</button>
      </div>
      <div class="mon-pick-list">${pickerRowsHtml()}</div>`;
    // Sits above the card list, outside the element render() rebuilds.
    list.parentNode.insertBefore(pickerEl, list);
    pickerEl.querySelector('.mon-pick-search').addEventListener('input', e => {
      pickerQuery = e.target.value;
      refreshPickerRows();
    });
    pickerEl.querySelector('.mon-pick-type').addEventListener('change', e => {
      pickerType = e.target.value;
      refreshPickerRows();
    });
    pickerEl.querySelector('.mon-pick-close').addEventListener('click', closePicker);
    wirePickerRows();
    pickerEl.querySelector('.mon-pick-search').focus();
  }

  function closePicker() {
    pickerEl?.remove();
    pickerEl = null;
    pickerOpen = false;
    render();
  }

  function render() {
    list.innerHTML = '';
    empty.classList.toggle('show', items.length === 0 && !pickerOpen);
    items.forEach((it, idx) => {
      const card = it.type === 'npc' ? buildNpcCard(it, idx) : buildTrackerCard(it, idx);
      wireReorder(card, it);
      list.appendChild(card);
    });
  }

  // Running timers tick once a second (only re-render if something changed).
  setInterval(() => {
    let dirty = false;
    items.forEach(it => {
      if(it.type === 'tracker' && it.kind === 'timer' && it.running && it.remainingSeconds > 0) {
        it.remainingSeconds = Math.max(0, it.remainingSeconds - 1);
        if(it.remainingSeconds === 0) it.running = false;
        dirty = true;
      }
    });
    if(dirty) render();
  }, 1000);

  function onClick(e) {
    const btn = e.target.closest('.trk-next-round, .trk-reset, .cbt-add-tracker, .cbt-add-npc, .cbt-add-monster, .cbt-reset');
    if(!btn) return;
    const paneContent = root.closest('.pane-content');
    const paneNum = paneContent ? paneContent.id.replace('pane-','').replace('-content','') : null;
    const toolbarSlot = paneNum ? document.getElementById('pane-' + paneNum + '-toolbar') : null;
    if(!(root.contains(btn) || (toolbarSlot && toolbarSlot.contains(btn)))) return;

    if(btn.classList.contains('trk-next-round')) {
      round += 1;
      updateRoundDisplay();
      items.forEach(it => { if(it.type === 'tracker' && it.kind === 'rounds') it.rounds = Math.max(0, it.rounds - 1); });
      render();
    } else if(btn.classList.contains('trk-reset') || btn.classList.contains('cbt-reset')) {
      if(!confirm('Reset the round counter and clear all trackers and combatants?')) return;
      round = 1; items = [];
      updateRoundDisplay(); render();
    } else if(btn.classList.contains('cbt-add-tracker')) {
      items.push({ id: nextId++, type: 'tracker', name: '', kind: 'rounds', rounds: 1, totalSeconds: 60, remainingSeconds: 60, running: false });
      // The Timer button lives inside the picker — close it so the new tracker
      // card is visible instead of staying under the open picker.
      if(pickerEl) closePicker();
      else render();
    } else if(btn.classList.contains('cbt-add-npc')) {
      items.push({ id: nextId++, type: 'npc', name: '', tag: '', hpMode: 'standard', hpCurrent: 10, hpMax: 10, statuses: [] });
      // The Blank button lives inside the monster picker — close it so the new
      // combatant card is visible instead of staying under the open picker.
      if(pickerEl) closePicker();
      else render();
    } else if(btn.classList.contains('cbt-add-monster')) {
      if(pickerEl) { closePicker(); }
      else { pickerOpen = true; openPicker(); render(); }
    }
  }
  document.addEventListener('click', onClick);

  render();
  updateRoundDisplay();

  // Used by the Monster generator's "Send to Tracker" button.
  root._addMonster = (m) => {
    if(!m) return null;
    const item = monsterItem(m);
    items.push(item);
    render();
    return item;
  };

  root._getState = () => ({ round, items });
  root._setState = (st) => {
    if(!st) return;
    round = st.round || 1;
    // Accept the new unified shape, and migrate old saves that kept
    // { trackers: [...] } and { npcs: [...] } in two separate tools.
    let list_ = Array.isArray(st.items) ? st.items.slice() : [];
    if(!list_.length) {
      (st.trackers || []).forEach(t => list_.push({ ...t, type: 'tracker' }));
      (st.npcs || []).forEach(n => list_.push({ ...n, type: 'npc' }));
    }
    items = list_.map(it => ({ ...it, type: it.type || (it.kind ? 'tracker' : 'npc'), running: false }));
    nextId = items.reduce((m, it) => Math.max(m, it.id || 0), 0) + 1;
    items.forEach((it, i) => { if(!it.id) it.id = nextId++; });
    updateRoundDisplay();
    render();
  };
}
window.init_trackers = init_trackers;

// Send a bestiary monster straight into the combat tracker. The tracker is
// instantiated on demand, so this works before the tool has ever been opened —
// the combatant is waiting when the GM switches a pane to Trackers.
window.sendMonsterToTracker = function(m) {
  if(!m) return false;
  try {
    const node = getOrCreateInstance('trackers');
    if(node && typeof node._addMonster === 'function') { node._addMonster(m); return true; }
  } catch(e) {}
  return false;
};
// Old sessions may still ask for the 'combat' tool; it's the same tool now.
window.init_combat = init_trackers;
</script>

const RC_NAMES = [

const RC_GOALS = [

  'looking for a missing comrade',

  'running from a debt to the Thieves\' Guild',
  'on a holy mission for their deity',
];
const RC_QUIRKS = [
  'over-confident and boastful','secretive about their past',
  'clearly underprepared — out of torches','battle-scarred and wary',
  'surprisingly well-equipped','arguing among themselves',
  'nursing a recent wound','clearly lost','deceptively cheerful',
  'professional and businesslike','visibly afraid of something nearby',
];
const RC_GEAR_HINTS = [
  'well-stocked crawling kits','mostly improvised gear',

  'a treasure map visible on one member','magical light sources (no torches)',

];

  Hostile:  ['draw weapons immediately','demand the party leave now','have already attacked and take no prisoners'],
  Wary:     ['eye the party with suspicion','keep hands near weapons','ask sharp questions before talking'],
  Neutral:  ['nod curtly and keep moving','exchange basic information if pressed','trade news of the dungeon'],
  Friendly: ['share a rumor they picked up','offer to team up briefly','warn about a danger ahead'],

function rollD(max) { return Math.ceil(Math.random()*max); }
function rollTable(tbl, val) { for(const [n,r] of tbl) if(val<=n) return r; return tbl[tbl.length-1][1]; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function card(html) { const d=document.createElement('div'); d.className='gen-card'; d.innerHTML=html; return d; }
function row(label, val) { return `<div class="gen-card-row"><span class="gen-card-row-label">${label}</span><span>${esc(val)}</span></div>`; }
function tag(t, v) { return `<span class="gen-card-tag">${esc(t)}: ${esc(v)}</span> `; }

// ── Mundane Loot ──────────────────────────────────────────────────────────
function genMundaneLoot(subtype) {
  if(subtype==='gem') {
    const gem = R(GEMS);
    const isGiant = Math.random() < 0.15;
    const name = isGiant ? 'Giant '+gem.name : gem.name;
    const val  = gem.value.replace(/^(\d+)/, n => isGiant ? n*2 : n);
    return card(`<div class="gen-item-name">${esc(name)}</div><div class="gen-item-desc">Value: ${esc(val)}</div>`);
  }
  if(subtype==='luxury') {
    const feat = R(LUX_FEAT); const pool = R(LUX_ITEM_POOLS); const item = R(pool);
    return card(`<div class="gen-item-name">Luxury Item</div><div class="gen-item-desc">${esc(feat)} ${esc(item)}</div>`);
  }
  return card(`<div class="gen-item-name">Mundane Loot</div><div class="gen-item-desc">${esc(R(MUNDANE_LOOT))}</div>`);
}

// ── Rival Crawlers ────────────────────────────────────────────────────────
function genRivalCrawler(size, disp) {
  const count = size==='random' ? (Math.ceil(Math.random()*4)+1) : parseInt(size);
  const disposition = disp==='random' ? R(['Hostile','Wary','Neutral','Neutral','Friendly']) : disp;
  const goal = R(RC_GOALS);
  const quirk = R(RC_QUIRKS);
  const gear = R(RC_GEAR_HINTS);
  const dispDetail = R(RC_DISPOSITION_DETAILS[disposition]||RC_DISPOSITION_DETAILS.Neutral);
  const members = [];
  for(let i=0;i<count;i++) {
    const anc = R(RC_ANCESTRY);
    const cls = R(RC_CLASSES);
    const name = R(NPC_NAMES[anc]||NPC_NAMES.Human);
    members.push(`${name} (${anc} ${cls})`);
  }
  return card(`
    <div class="gen-card-header"><span class="gen-card-name">Rival Crawlers</span>
    <span class="gen-card-tag">${count} crawlers · ${esc(disposition)}</span></div>
    <div class="gen-card-row"><span class="gen-card-row-label">Members</span>
    <span>${members.map(esc).join('<br>')}</span></div>
    <hr class="gen-card-divider">
    ${row('Goal', goal)} ${row('Quirk', quirk)} ${row('Gear', gear)}
    ${row('Behaviour', dispDetail)}
  `);
}

// ── NPC ───────────────────────────────────────────────────────────────────
function genNPC(ancestry, wealth) {
  const anc  = ancestry==='random'?R(['Human','Human','Human','Dwarf','Elf','Halfling','Half-Orc','Goblin']):ancestry;
  const wlth = wealth==='random'?R(['Poor','Poor','Standard','Standard','Standard','Wealthy']):wealth;
  const pool = NPC_NAMES[anc]||NPC_NAMES.Human;
  const name = R(pool);
  const age  = anc==='Goblin'?`${rollD(20)+5}`:anc==='Elf'?`${rollD(400)+50}`:anc==='Dwarf'?`${rollD(200)+30}`:`${rollD(40)+15}`;
  return card(`
    <div class="gen-card-header"><span class="gen-card-name">${esc(name)}</span><span class="gen-card-tag">${esc(anc)} · ${esc(wlth)}</span></div>
    ${row('Age',age)} ${row('Build',`${R(BUILDS)}, ${R(HAIR)} hair, ${R(EYES)} eyes`)}
    ${row('Dress',R(CLOTHING[wlth]))} ${row('Feature',R(FEATURES))}
    <hr class="gen-card-divider">
    ${row('Occupation',R(OCCUPATIONS))} ${row('Demeanor',R(DEMEANOR))}
    ${row('Quirk',R(QUIRKS))} ${row('Wants',R(WANTS))}
    ${row('Secret',R(SECRETS))} ${row('Coin',COIN[wlth]())}
  `);
}

// ── Treasure ─────────────────────────────────────────────────────────────
function genTreasure(tierKey, type) {
  if(type==='random_all') {
    // Equal chance across all categories
    type = R(['random','random','Weapon','Armor','Wand','Ring','Cloak','Boots',
              'Potion','Scroll','table','mundane','gem','luxury']);
  }
  if(type==='table') {
    const tier = TREASURE_TIERS[tierKey]||TREASURE_T1;
    return card(`<div class="gen-item-name">Treasure Table Roll (Tier ${tierKey})</div><div class="gen-item-desc">${esc(R(tier))}</div>`);
  }
  if(type==='mundane' || type==='gem' || type==='luxury') return genMundaneLoot(type);
  const pool = type==='random'?MAGIC_ITEM_POOLS[R(LOOT_TYPES)]:(MAGIC_ITEM_POOLS[type]||POTIONS);
  const item = R(pool);
  return card(`<div class="gen-item-name">${esc(item.name)}</div><div class="gen-item-desc">${esc(item.desc)}</div>`);
}

// ── Shop/Tavern ──────────────────────────────────────────────────────────
function genShop(type, tier) {
  const t = type==='random'?R(['Shop','Tavern']):type;
  const t2 = tier==='random'?R(['Poor','Standard','Standard','Wealthy']):tier;
  const isShop=t==='Shop';
  const name = R(isShop?SHOP_NAMES[t2]:TAVERN_NAMES[t2]);
  const prop = `${R(NPC_NAMES.Human)}, ${isShop?R(['Shopkeeper','Merchant','Trader']):R(['Innkeeper','Barkeep','Host'])}`;
  if(isShop) {
    const stock=[...SHOP_STOCK[t2]].sort(()=>Math.random()-.5).slice(0,6);
    return card(`<div class="gen-card-header"><span class="gen-card-name">${esc(name)}</span><span class="gen-card-tag">Shop · ${esc(t2)}</span></div>${row('Proprietor',prop)}<hr class="gen-card-divider"><div class="gen-card-row"><span class="gen-card-row-label">Stock</span><span>${stock.map(esc).join('<br>')}</span></div>`);
  } else {
    const menu=[...TAVERN_FOOD[t2]].sort(()=>Math.random()-.5).slice(0,4);
    const rooms=t2==='Poor'?'Shared floor (2 cp/night)':t2==='Wealthy'?'Private room (1 gp/night)':'Shared room (5 cp/night)';
    return card(`<div class="gen-card-header"><span class="gen-card-name">${esc(name)}</span><span class="gen-card-tag">Tavern · ${esc(t2)}</span></div>${row('Proprietor',prop)}<hr class="gen-card-divider"><div class="gen-card-row"><span class="gen-card-row-label">Menu</span><span>${menu.map(esc).join('<br>')}</span></div>${row('Lodging',rooms)}<hr class="gen-card-divider">${row('Rumour',R(TAVERN_RUMORS_EXTRA))}`);
  }
}

// ── Encounter ────────────────────────────────────────────────────────────
function genEncounterItem(type) {
  // Events
  if(type==='happens')  return card(`<div class="gen-item-name">Something Happens!</div><div class="gen-item-desc">${esc(R(HAPPENS))}</div>`);
  if(type==='rumor')    return card(`<div class="gen-item-name">Rumor</div><div class="gen-item-desc">${esc(R(RUMORS))}</div>`);
  if(type==='secret')   return card(`<div class="gen-item-name">Secret</div><div class="gen-item-desc">${esc(R(SECRETS_D1))} ${esc(R(SECRETS_D2))}</div>`);
  if(type==='trap')     return genTrap('trap');
  if(type==='hazard')   return genTrap('hazard');
  // Biome
  const pool = BIOME_ENC_TABLES[type];
  if(pool) return card(`<div class="gen-card-header"><span class="gen-card-name">${esc(type)} Encounter</span></div><div class="gen-item-desc">${esc(R(pool))}</div>`);
  return card(`<div class="gen-empty">Unknown type</div>`);
}

  'Market','Mountain','Ocean','River & Coast','Ruins','Slums','Swamp',

// ── Main init ─────────────────────────────────────────────────────────────
// Populate the Monster generator's type filter from the classification beside
// SD_MONSTERS, listing only types that actually have members so no choice can
// come back empty.
function fillMonsterTypeFilter(root) {
  const sel = (root || document).querySelector('#gen-mon-type');
  if(!sel || typeof SD_MONSTER_TYPE_LIST === 'undefined') return;
  const present = SD_MONSTER_TYPE_LIST.filter(t => allMonsters().some(m => monsterTypeOf(m.name) === t));
  const keep = sel.value;
  // Type names come from SD_MONSTER_TYPE_LIST (our own constant), but escape
  // anyway so a future entry with punctuation can't break the markup.
  const safe = (v) => String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  sel.innerHTML = '<option value="">Any Type</option>' +
    present.map(t => `<option value="${safe(t)}">${safe(t)}</option>`).join('');
  sel.value = keep || '';
}
// ── Bestiary stat block ───────────────────────────────────────────────────
// One rendering shared by the Monster generator and the adventure builder, so
// the two can't drift. Stat pairs go in a responsive grid (.gen-card-stats)
// rather than one long flex line, which is what used to run off the side of a
// quarter-width pane in Four-pane mode.
function monsterStat(label, val) {
  return `<div class="gen-card-stat"><span class="gen-card-stat-label">${esc(label)}</span><span>${esc(val)}</span></div>`;
}

function monsterCard(m, opts) {
  const type = (typeof monsterTypeOf === 'function') ? monsterTypeOf(m.name) : '';
  // NB: escAttr() belongs to init_trackers' scope, not this one — escape locally.
  const attr = (v) => String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  const send = opts && opts.send
    ? `<div class="gen-card-actions"><button class="btn small primary gen-send-tracker" data-mon="${attr(m.name)}">Send to Tracker</button></div>`
    : '';
  return card(
    `<div class="gen-card-header"><span class="gen-card-name">${esc(m.name)}</span>` +
      `<span class="gen-card-tag">LV ${esc(m.lv)} · AL ${esc(m.al)}${type ? ' · ' + esc(type) : ''}</span></div>` +
    `<div class="gen-card-stats">${monsterStat('AC', m.ac)}${monsterStat('HP', m.hp)}${monsterStat('MV', m.mv)}</div>` +
    `<div class="gen-card-stats">${monsterStat('STR', m.s)}${monsterStat('DEX', m.d)}${monsterStat('CON', m.c)}` +
      `${monsterStat('INT', m.i)}${monsterStat('WIS', m.w)}${monsterStat('CHA', m.ch)}</div>` +
    `<div class="gen-card-row"><span class="gen-card-row-label">ATK</span><span>${esc(m.atk)}</span></div>` +
    (m.notes ? `<div class="gen-card-row"><span class="gen-card-row-label">Traits</span><span>${esc(m.notes)}</span></div>` : '') +
    send
  );
}

// Every monster of a given creature type; empty type means the whole bestiary.
function monstersOfType(type) {
  if(!type) return allMonsters();
  return allMonsters().filter(m => monsterTypeOf(m.name) === type);
}

// ── Monster Generator ─────────────────────────────────────────────────────
function genMonster(pl, numMut) {
  pl = parseInt(pl)||1;
  const entry = MON_TABLE[Math.ceil(Math.random()*20)-1];
  const hd_adj = entry.combat==='PL'?0:entry.combat.includes('+')?(parseInt(entry.combat.replace('PL+',''))):(-parseInt(entry.combat.replace('PL-','')));
  const hd = Math.max(1, pl+hd_adj);
  const ac = pl+10;
  const hp = hd*4+hd;
  const atk = Math.min(hd, hd+1);
  const muts = [];
  for(let i=0;i<parseInt(numMut||0);i++) { muts.push(`${R(MON_MUT_1)} / ${R(MON_MUT_2)} / ${R(MON_MUT_3)}`); }
  return card(`
    <div class="gen-card-header"><span class="gen-card-name">${esc(entry.quality)} Creature</span><span class="gen-card-tag">HD ${hd} · PL ${pl}</span></div>
    ${row('AC',`${ac}`)} ${row('HP',`${hp} (${hd}d8)`)} ${row('ATK',`+${atk}, 1d${hd<=3?6:hd<=6?8:10} dmg`)}
    <hr class="gen-card-divider">
    ${row('Strength',entry.strength)} ${row('Weakness',entry.weakness)}
    ${muts.length?'<hr class="gen-card-divider">'+muts.map((m,i)=>`<div class="gen-card-row"><span class="gen-card-row-label">Mutation ${i+1}</span><span>${esc(m)}</span></div>`).join(''):''}
    <hr class="gen-card-divider">
    <div class="gen-card-row"><span class="gen-card-row-label">Treasure</span><span>Roll on Treasure ${hd<=3?'1-3':hd<=6?'4-6':hd<=9?'7-9':'10+'} table (50% chance if random encounter)</span></div>
  `);
}

// ── Trap / Hazard ─────────────────────────────────────────────────────────
function genTrap(type) {
  const t = type==='random' ? R(['trap','hazard']) : type;
  if(t==='trap') {
    const trap = TRAPS[Math.ceil(Math.random()*12)-1];
    return card(`<div class="gen-card-header"><span class="gen-card-name">${esc(trap.trap)}</span><span class="gen-card-tag">Trap</span></div>${row('Trigger',trap.trigger)}${row('Damage/Effect',trap.damage)}`);
  } else {
    const mov = R(HAZARDS_MOV); const dmg = R(HAZARDS_DMG); const wkn = R(HAZARDS_WKN);
    const types = []; if(Math.random()>.3) types.push(mov); if(Math.random()>.4) types.push(dmg); if(Math.random()>.5) types.push(wkn);
    if(!types.length) types.push(mov);
    return card(`<div class="gen-card-header"><span class="gen-card-name">Hazard</span><span class="gen-card-tag">${types.length>1?'Combined':'Single'}</span></div>${types.map((x,i)=>row(['Movement','Damage','Weakening'][i]||'Effect',x)).join('')}`);
  }
}

// Maps each room role to [Type, Subtype]
const ROOM_TAXONOMY = {
  guardian:            ['Fight',     'Guardian'],
  puzzle:              ['Challenge', 'Puzzle'],
  setback:             ['Twist',     'Setback'],
  boss:                ['Fight',     'Boss'],
  reward:              ['Reward',    'Treasure'],
  'Combat Encounter':  () => ['Fight', R(['Sentry','Mooks'])],
  'Exploration Chamber': ['Scenic',  ''],
  'Trap Room':         ['Challenge', 'Trap'],
  'Treasure Cache':    ['Reward',    'Treasure'],
  'Side Chamber':      ['Scenic',    ''],
  'Barracks':          ['Fight',     'Mooks'],
  'Storage Room':      ['Scenic',    ''],
  'Secret Room':       ['Twist',     'Secret Area'],
  'Sub-Boss Lair':     ['Fight',     'Sub-Boss'],
  'Puzzle Room':       ['Challenge', 'Puzzle'],
  'Shrine':            ['Reward',    'Sanctuary'],
  'Laboratory':        ['Scenic',    ''],
  'Prison Cells':      ['Challenge', 'Social'],
  'Collapsed Section': ['Twist',     'Environmental'],
  'Natural Cave':      ['Scenic',    ''],
  'Guard Post':        ['Fight',     'Sentry'],
  'Armory':            ['Reward',    'Treasure'],
  'Ritual Chamber':    ['Challenge', 'Environmental'],
};

function roomLabel(num, roleKey) {
  const tax = typeof ROOM_TAXONOMY[roleKey] === 'function'
    ? ROOM_TAXONOMY[roleKey]()
    : (ROOM_TAXONOMY[roleKey] || ['Scenic','']);
  const [type, sub] = tax;
  const subStr = sub ? ` - ${sub}` : '';
  return `${num}. ${type}${subStr}`;
}
