.mus-sfx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 6px; padding: 10px; }
.mus-sfx { position: relative; background: var(--panel-2); border: 1px solid var(--border); color: var(--light); cursor: pointer; padding: 14px 8px; min-height: 54px; display: flex; align-items: center; justify-content: center; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; overflow: hidden; }
.mus-sfx:hover { border-color: var(--mid); color: #fff; }
.mus-sfx.playing { border-color: var(--gold); color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.mus-sfx.needs-file { opacity: 0.55; }
.mus-sfx-name { pointer-events: none; overflow-wrap: anywhere; }
.mus-sfx-corner { position: absolute; top: 2px; right: 2px; display: flex; gap: 1px; }
.mus-sfx-mini { background: rgba(0,0,0,0.4); border: none; color: var(--muted); cursor: pointer; font-size: 10px; line-height: 1; padding: 2px 3px; border-radius: 2px; }
.mus-sfx-mini:hover { color: #fff; }
.mus-sfx-mini.active { color: var(--gold); }
.mus-dragover { outline: 2px dashed var(--gold); outline-offset: -4px; }
/* Scenes (layered) */
.mus-scene-section { border-left-color: #b07cc8; }
.mus-scene-list { display: flex; flex-direction: column; gap: 8px; padding: 10px; }
.mus-scene { border: 1px solid var(--border); background: var(--panel-2); }
.mus-scene.playing { border-color: var(--gold); }
.mus-scene-head { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.mus-scene-play { width: 30px; height: 28px; background: var(--panel); border: 1px solid var(--border); color: var(--light); cursor: pointer; flex-shrink: 0; }
.mus-scene-play:hover { border-color: var(--mid); color: #fff; }
.mus-scene.playing .mus-scene-play { border-color: var(--gold); color: var(--gold); }
.mus-scene-name { flex: 1; min-width: 80px; background: transparent; border: none; border-bottom: 1px solid transparent; color: var(--white); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; padding: 2px 0; }
.mus-scene-name:focus { border-bottom-color: var(--mid); }
.mus-scene-pin { flex-shrink: 0; background: none; border: 1px solid var(--border); color: var(--muted); cursor: pointer; font-size: 12px; padding: 3px 6px; line-height: 1; }
.mus-scene-pin:hover { color: #fff; }
.mus-scene-pin.active { color: var(--gold); border-color: var(--gold); }
.mus-scene-del { flex-shrink: 0; background: none; border: 1px solid transparent; color: var(--muted); cursor: pointer; font-size: 12px; padding: 3px 6px; line-height: 1; }
.mus-scene-del:hover { color: var(--red-light); border-color: var(--border); }
.mus-scene-tracks { display: flex; flex-direction: column; }
.mus-scene-track { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-top: 1px solid var(--border); font-size: 12px; color: var(--light); }
.mus-scene-track:first-child { border-top: none; }
.mus-scene-track.needs-file { opacity: 0.55; }
.mus-scene-tname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mus-scene-track.needs-file .mus-scene-tname { cursor: pointer; }
.mus-scene-warn { font-size: 9px; color: var(--red-light); font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
.mus-scene-tloop { background: none; border: 1px solid transparent; color: var(--muted); cursor: pointer; font-size: 12px; padding: 2px 4px; flex-shrink: 0; line-height: 1; }
.mus-scene-tloop:hover { color: #fff; border-color: var(--border); }
.mus-scene-tloop.active { color: var(--gold); border-color: var(--gold); }
.mus-scene-tvol { width: 72px; flex-shrink: 0; accent-color: var(--gold); height: 4px; }
.mus-scene-tdel { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; padding: 2px 4px; flex-shrink: 0; }
.mus-scene-tdel:hover { color: var(--red-light); }
.mus-scene-empty-tracks { padding: 8px; font-size: 10px; color: var(--muted); font-family: 'Barlow Condensed', sans-serif; }
/* Pinned scene triggers in the top bar (left of the Campaign divider) */
.scene-pins { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.scene-pin { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scene-pin.active { border-color: var(--gold) !important; color: var(--gold) !important; }
@media (max-width: 760px) {
  .mus-btn { width: 44px; height: 40px; font-size: 16px; }
  .mus-sfx { min-height: 60px; font-size: 14px; }
  /* Keep each section header (Music / Soundboard / Scenes) on one line: show
     only the section icon, don't wrap, and let the controls tighten so the
     volume slider + icon buttons all stay inline. */
  .mus-sec-label { display: none; }
  .mus-sec-head { flex-wrap: nowrap; }
  .mus-sec-actions { gap: 4px; min-width: 0; }
  .mus-vol { width: 72px; }
}

/* ═══ COMBAT TOOL ═══ */
.cbt-round-display {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--light);
}
.cbt-round-num, .trk-round-num { font-family: 'Share Tech Mono', monospace; color: var(--gold); font-size: 14px; }

.cbt-body { flex: 1; display: flex; overflow: hidden; min-height: 0; }
.cbt-body.cbt-single .cbt-col { flex: 1; border-right: none; }
.cbt-col { flex: 1; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--border); overflow: hidden; }
.cbt-col:last-child { border-right: none; }
.cbt-tracker-list, .cbt-npc-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.cbt-empty { display: none; flex: 1; align-items: center; justify-content: center; flex-direction: column; gap: 4px; padding: 30px; }
.cbt-empty.show { display: flex; }
.cbt-empty-text { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.cbt-empty-sub { font-size: 11px; color: var(--muted); text-align: center; max-width: 220px; }

/* Tracker card */
.tracker-card { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--gold); padding: 10px 12px; }
.tracker-card.timer-type { border-left-color: #6a9fc8; }
.tracker-card.expired { border-left-color: var(--red); opacity: 0.6; }
.tracker-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.tracker-name-input {
  flex: 1; min-width: 0; background: transparent; border: none; color: var(--white);
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; padding: 2px 0;
}
.tracker-name-input:focus { border-bottom: 1px solid var(--mid); }
.tracker-type-toggle {
  display: flex; gap: 0; flex-shrink: 0; border: 1px solid var(--border);
}
.tracker-type-btn {
  font-family: 'Barlow Condensed', sans-serif; font-size: 8px; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; padding: 4px 7px; background: var(--panel-2); border: none; color: var(--muted); cursor: pointer;
}
.tracker-type-btn.active.rounds-active { background: var(--gold); color: black; }
.tracker-type-btn.active.timer-active { background: #6a9fc8; color: black; }
.tracker-del { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 2px 4px; flex-shrink: 0; }
.tracker-del:hover { color: var(--red-light); }

.tracker-bottom { display: flex; align-items: center; gap: 8px; }
.tracker-adjust-btn {
  width: 26px; height: 26px; background: var(--panel-2); border: 1px solid var(--border); color: var(--light);
  cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.tracker-adjust-btn:hover { border-color: var(--mid); color: white; }
.tracker-rounds-display { display: flex; flex-direction: column; align-items: center; min-width: 32px; }
.tracker-rounds { font-family: 'Share Tech Mono', monospace; font-size: 22px; font-weight: 700; color: var(--gold); }
.tracker-rounds.zero { color: var(--red-light); }
.tracker-label { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.tracker-expired-tag {
  font-family: 'Barlow Condensed', sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--red-light); margin-left: auto;
}

/* Timer-specific */
.timer-display { font-family: 'Share Tech Mono', monospace; font-size: 20px; font-weight: 700; color: #6a9fc8; min-width: 64px; text-align: center; }
.timer-display.zero { color: var(--red-light); }
.timer-set-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.timer-set-input {
  width: 50px; text-align: center; font-family: 'Share Tech Mono', monospace; font-size: 12px; padding: 4px 2px;
}
.timer-set-label { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.timer-controls { display: flex; gap: 4px; margin-left: auto; }
/* Collapsible second row: type dropdown + kind-specific controls */
.tracker-controls-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.tracker-controls-row.collapsed { display: none; }
.tracker-controls-row .timer-controls { margin-left: 0; }
.tracker-controls-row .timer-set-row { margin-top: 0; }
.tracker-round-adjust { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.tracker-collapse {
  background: transparent; border: none; color: var(--muted); cursor: pointer;
  font-size: 15px; line-height: 1; padding: 6px 9px; flex-shrink: 0;
}
.tracker-collapse:hover { color: var(--white); }

/* NPC card */
.npc-card { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--red); padding: 10px 12px; }
.npc-card.defeated { opacity: 0.5; border-left-color: var(--muted); }
.npc-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.npc-name-input {
  flex: 1; background: transparent; border: none; color: var(--white);
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; padding: 2px 0;
}
.npc-name-input:focus { border-bottom: 1px solid var(--mid); }
.npc-tag-input { width: 70px; background: transparent; border: none; border-bottom: 1px dotted var(--border); color: var(--mid); font-size: 10px; text-align: right; padding: 2px 0; }
.npc-del { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 2px 4px; flex-shrink: 0; }
.npc-del:hover { color: var(--red-light); }

.npc-hp-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.npc-hp-input { width: 48px; text-align: center; font-family: 'Share Tech Mono', monospace; font-size: 14px; padding: 5px 2px; }
.npc-hp-slash { color: var(--muted); font-size: 13px; }
/* +Status sits at the end of the HP number row. */
.npc-hp-status { margin-left: auto; flex-shrink: 0; }
/* Second HP line: the ±HP buttons left-aligned, with the tag field beside them. */
.npc-hp-second { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.npc-hp-adjust { display: flex; gap: 3px; margin-left: 0; justify-content: flex-start; }
.npc-tag-inline { flex: 1 1 90px; min-width: 0; text-align: left; }
/* Mode (Standard/DCC) select on its own line above the name, so it and the X
   never crowd the name row / run off a narrow card. */
.npc-mode-bar { display: flex; justify-content: flex-end; margin-bottom: 4px; }
.npc-hp-btn {
  width: 26px; height: 26px; background: var(--panel-2); border: 1px solid var(--border); color: var(--light);
  cursor: pointer; font-size: 11px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.npc-hp-btn:hover { border-color: var(--mid); color: white; }
.npc-hp-btn.dmg:hover { border-color: var(--red); color: var(--red-light); }
.npc-hp-btn.heal:hover { border-color: var(--green); color: var(--green-light); }

.npc-hp-bar-track { width: 100%; height: 8px; background: var(--panel-2); border: 1px solid var(--border); overflow: hidden; }
.npc-hp-bar-fill { height: 100%; transition: width 0.2s ease, background 0.2s ease; }
/* Bestiary stat block carried onto a combat card. Same responsive-grid trick as
   the generator cards, so six ability mods stay readable in a quarter pane. */
.npc-mon { border-top: 1px solid var(--border); margin-top: 8px; padding-top: 7px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.npc-mon-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(52px, 1fr)); gap: 3px 8px; min-width: 0; }
.npc-mon-stat { display: flex; align-items: baseline; gap: 4px; font-size: 12px; color: var(--light); min-width: 0; }
.npc-mon-stat > span:last-child { min-width: 0; overflow-wrap: anywhere; }
.npc-mon-label { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); flex-shrink: 0; }
.npc-mon-row { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--light); line-height: 1.45; min-width: 0; }
.npc-mon-row > span:last-child { min-width: 0; overflow-wrap: anywhere; }
/* Rollable ability cells and attack buttons — they send to the Dice tray. */
.npc-mon-roll { background: none; border: 1px solid transparent; cursor: pointer; padding: 1px 3px; text-align: left; font: inherit; }
.npc-mon-roll:hover { border-color: var(--gold); background: var(--panel-2); }
.npc-mon-roll:active { background: var(--border); }
.npc-mon-atks { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.npc-mon-atk { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; font-size: 12px; color: var(--light); min-width: 0; }
.npc-mon-atk-text { flex: 1 1 130px; min-width: 0; overflow-wrap: anywhere; }
.npc-mon-btn {
  flex-shrink: 0; background: var(--panel-2); border: 1px solid var(--border); color: var(--gold);
  font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
  padding: 2px 7px; cursor: pointer; min-width: 34px; text-align: center;
}
.npc-mon-btn:hover { border-color: var(--gold); color: var(--white); }
.npc-mon-btn.dmg { color: var(--red); }
.npc-mon-btn.dmg:hover { border-color: var(--red); color: var(--white); }
.npc-mon-traits-btn { background: none; border: none; color: var(--gold); font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; padding: 0; text-align: left; }
.npc-mon-stats-btn { background: none; border: none; color: var(--gold); font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; padding: 0; text-align: left; }
.npc-mon-stats-wrap { display: flex; flex-direction: column; gap: 5px; }
.npc-mon-traits { font-size: 12px; color: var(--light); line-height: 1.5; overflow-wrap: anywhere; display: flex; flex-direction: column; gap: 4px; }
.npc-mon-trait { min-width: 0; }
.npc-mon-trait-name { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: var(--gold); }
.npc-mon-traits .npc-mon-btn { margin: 0 1px; padding: 0 5px; min-width: 0; vertical-align: baseline; }
.npc-mon-attack { min-width: 52px; }
.pane.narrow .npc-mon-stats { grid-template-columns: repeat(auto-fit, minmax(44px, 1fr)); gap: 2px 6px; }

/* Monster picker (Trackers → + Monster) */
.mon-pick { border: 1px solid var(--gold); background: var(--panel); padding: 8px 10px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.mon-pick-controls { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; }
/* Timer + Blank buttons under the picker controls — the single "+" toolbar
   button opens this picker, so all "add" actions (timer, blank combatant, or a
   bestiary monster) live here. */
.mon-pick-add-row { display: flex; gap: 6px; }
.mon-pick-add-row > button { flex: 1 1 0; padding: 4px 0; font-size: 11px; letter-spacing: 0.08em; }
.mon-pick-search { flex: 1 1 120px; min-width: 0; background: var(--panel-2); border: 1px solid var(--border); color: var(--white); font-size: 12px; padding: 5px 7px; outline: none; }
.mon-pick-type { flex: 0 1 auto; min-width: 0; background: var(--panel-2); border: 1px solid var(--border); color: var(--white); font-size: 12px; padding: 5px 7px; outline: none; }
.mon-pick-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; border-top: 1px solid var(--border); }
.mon-pick-item { display: flex; align-items: baseline; gap: 8px; padding: 5px 4px; border-bottom: 1px solid var(--border); background: none; border-left: none; border-right: none; border-top: none; color: var(--light); font-size: 12px; text-align: left; cursor: pointer; min-width: 0; }
.mon-pick-item:hover { background: var(--panel-2); color: var(--white); }
.mon-pick-item-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.mon-pick-item-meta { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); flex-shrink: 0; }
.mon-pick-empty { font-size: 12px; color: var(--muted); font-style: italic; padding: 8px 4px; }

.npc-defeated-tag { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }

/* Status checklist — shared by tracker and NPC cards */
.status-list { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.status-row { display: flex; align-items: center; gap: 6px; }
.status-check { width: 15px; height: 15px; accent-color: var(--gold); flex-shrink: 0; cursor: pointer; }
.status-text {
  flex: 1; background: transparent; border: none; border-bottom: 1px dotted var(--border);
  color: var(--light); font-size: 11px; padding: 3px 2px;
}
.status-text:focus { border-bottom-color: var(--mid); }
.status-row:has(.status-check:checked) .status-text { color: var(--muted); text-decoration: line-through; }
.status-del { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 11px; padding: 2px 4px; flex-shrink: 0; }
.status-del:hover { color: var(--red-light); }
.status-add { margin-top: 6px; }

/* NPC mode toggle */
.npc-mode-toggle { display: flex; gap: 0; flex-shrink: 0; border: 1px solid var(--border); }
.npc-mode-btn {
  font-family: 'Barlow Condensed', sans-serif; font-size: 8px; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; padding: 4px 7px; background: var(--panel-2); border: none; color: var(--muted); cursor: pointer;
}
.npc-mode-btn.active.std-active { background: var(--green); color: white; }
.npc-mode-btn.active.dcc-active { background: var(--amber); color: black; }

/* DCC segment setup row */
.npc-seg-setup { display: flex; align-items: center; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
.npc-seg-setup-label { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.npc-seg-count-input, .npc-seg-hp-input { width: 44px; text-align: center; font-family: 'Share Tech Mono', monospace; font-size: 12px; padding: 4px 2px; }

/* DCC segments — click to toggle alive/dead */
.npc-seg-row { display: flex; gap: 4px; flex-wrap: wrap; }
.npc-seg {
  flex: 1; min-width: 36px; height: 32px;
  background: var(--seg-color, #4caf50);
  border: 1px solid rgba(0,0,0,0.3);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.15s, filter 0.15s;
}
.npc-seg:hover { filter: brightness(1.15); }
.npc-seg.dead { background: #2a2a2a !important; border-color: var(--border); }
.npc-seg-num {
  font-family: 'Share Tech Mono', monospace; font-size: 12px; font-weight: 700;
  color: rgba(0,0,0,0.55);
}
.npc-seg.dead .npc-seg-num { color: var(--muted); }

@media (max-width: 900px) {
  .cbt-body { flex-direction: column; overflow-y: auto; }
  .cbt-col { border-right: none; border-bottom: 1px solid var(--border); flex: none; }
}

/* ═══ GENERATORS TOOL ═══ */
.gen-tab-select {
  font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700;
  letter-spacing: 0.04em;
  padding: 5px 9px; background: var(--panel); border: 1px solid var(--border);
  color: var(--white); cursor: pointer; outline: none; min-width: 0; max-width: 100%;
  transition: border-color 0.15s;
}
.gen-tab-select:hover { border-color: var(--mid); }
.gen-tab-select option { background: var(--panel); color: var(--white); }
.gen-body { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.gen-panel { display: none; flex: 1; flex-direction: column; min-height: 0; overflow: hidden; }
.gen-panel.active { display: flex; }
.gen-controls {
  display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 16px;
  background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0;
}
/* Collapsible generator options (#7). The toggle bar sits above each panel's
   .gen-controls; collapsing hides the controls so the results get the space. */
.gen-opts-toggle {
  display: flex; align-items: center; gap: 6px; width: 100%;
  background: var(--panel); border: none; border-bottom: 1px solid var(--border);
  color: var(--muted); cursor: pointer; text-align: left;
  font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase; padding: 7px 16px; flex-shrink: 0;
}
.gen-opts-toggle:hover { color: var(--light); }
.gen-opts-chevron { font-size: 9px; line-height: 1; }
.gen-controls.collapsed { display: none; }
.gen-label {
  font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
  display: flex; flex-direction: column; gap: 4px;
}
.gen-select {
  background: var(--panel-2); border: 1px solid var(--border); color: var(--white);
  font-family: 'Barlow Condensed', sans-serif; font-size: 13px;
  padding: 5px 9px; outline: none; cursor: pointer;
}
.gen-select:focus { border-color: var(--mid); }
.gen-results {
  flex: 1; overflow-y: auto; overflow-x: hidden; padding: 14px 16px;
  display: flex; flex-direction: column; gap: 10px; min-width: 0;
}
.gen-empty { color: var(--muted); font-size: 12px; font-style: italic; padding: 20px 0; }
.gen-card {
  background: var(--panel); border: 1px solid var(--border);
  padding: 12px 14px; display: flex; flex-direction: column; gap: 6px;
  min-width: 0;
}
.gen-card-header {
  display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px;
  flex-wrap: wrap; min-width: 0;
}
.gen-card-name {
  font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700;
  letter-spacing: 0.04em; color: var(--white); min-width: 0; overflow-wrap: anywhere;
}
.gen-card-tag {
  font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold);
}
.gen-card-row {
  font-size: 12px; color: var(--light); line-height: 1.5;
  display: flex; gap: 6px; flex-wrap: wrap; min-width: 0;
}
/* Values wrap instead of pushing the card wider than its pane. */
.gen-card-row > span:not(.gen-card-row-label) { min-width: 0; overflow-wrap: anywhere; }
.gen-card-row-label {
  font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  min-width: 64px; flex-shrink: 0; padding-top: 1px;
}
.gen-card-divider { border: none; border-top: 1px solid var(--border); margin: 4px 0; }
/* Stat pairs (AC/HP/MV, STR–CHA) as a responsive grid: six pairs on one line in
   a full-width pane, folding to two or three lines in a quarter-width one, so
   nothing runs off the edge in Four-pane mode. */
.gen-card-stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(54px, 1fr));
  gap: 3px 10px; min-width: 0;
}
.gen-card-stat { display: flex; align-items: baseline; gap: 4px; font-size: 12px; color: var(--light); min-width: 0; }
.gen-card-stat > span:last-child { min-width: 0; overflow-wrap: anywhere; }
.gen-card-stat-label {
  font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); flex-shrink: 0;
}
.gen-card-actions { display: flex; justify-content: flex-end; margin-top: 2px; }
.gen-card-actions .gen-send-tracker { white-space: nowrap; }
.gen-item-name { font-weight: 700; color: var(--gold); font-size: 13px; margin-bottom: 2px; }
.gen-item-desc { font-size: 12px; color: var(--light); line-height: 1.5; }

/* ═══ NOTES TOOL ═══ */
.nts-saved-indicator { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); opacity: 0; transition: opacity 0.3s; }
.nts-saved-indicator.show { opacity: 1; color: var(--green-light); }
.nts-body { flex: 1; display: flex; min-height: 0; background: var(--black); }
.nts-editor {
  flex: 1;
  outline: none;
  padding: 20px 24px;
  overflow-y: auto;
  font-family: 'Barlow', sans-serif;
  font-size: 14px;
  line-height: 1.75;
  color: var(--light);
  caret-color: var(--gold);
  min-height: 0;
}
.nts-editor:empty::before { content: attr(data-placeholder); color: var(--muted); pointer-events: none; }
/* Block styles rendered in place */
.nts-editor h1 { font-family: 'Cinzel', serif; font-size: 22px; font-weight: 700; color: var(--gold); margin: 8px 0 6px; }
.nts-editor h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--light); border-bottom: 1px solid var(--border); padding-bottom: 3px; margin: 12px 0 6px; }
.nts-editor h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700; color: var(--mid); margin: 10px 0 4px; }
.nts-editor p { margin: 0 0 4px; min-height: 1.75em; }
.nts-editor strong { color: var(--white); font-weight: 700; }
.nts-editor em { font-style: italic; }
.nts-editor ul, .nts-editor ol { margin: 0 0 6px; padding-left: 20px; }
.nts-editor li { margin-bottom: 2px; }
.nts-editor blockquote { border-left: 3px solid var(--gold); margin: 6px 0; padding: 2px 12px; color: var(--mid); font-style: italic; }
.nts-editor hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
.nts-editor code { font-family: 'Share Tech Mono', monospace; font-size: 12px; background: var(--panel-2); padding: 1px 4px; border-radius: 2px; }
.nts-raw {
  flex: 1; display: none;
  background: var(--panel-2); border: none; outline: none;
  color: var(--light); font-family: 'Share Tech Mono', monospace;
  font-size: 12px; line-height: 1.6; padding: 20px 24px;
  resize: none; min-height: 0;
}
.nts-md-toggle.active { background: var(--red); border-color: var(--red); color: white; }



/* ═══ MOBILE ═══ */
@media (max-width: 760px) {
  #hdr-toggle {
    display: flex; align-items: center; justify-content: flex-end; gap: 6px;
    width: 100%; height: 24px; flex-shrink: 0;
    padding: 0 12px; box-sizing: border-box;
    background: var(--dark); color: var(--gold);
    border-bottom: 1px solid var(--border);
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
    font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
    cursor: pointer; user-select: none;
  }
  body.hdr-hidden .topbar { display: none; }

  .topbar { flex-wrap: wrap; height: auto; padding: 10px 12px; gap: 8px; }
  .brand { font-size: 15px; width: 100%; }
  .pane-picker { flex: 1; min-width: 0; }
  .pane-picker-label { display: none; }
  /* Pack every top-bar control to the left rather than splitting them across
     the row: drop the flexible spacer and the auto margin that pushed View to
     the far right. */
  .topbar .topbar-spacer { display: none; }
  .view-controls { margin-left: 0; }

  .main-area { flex-direction: column; }
  .pane { border-right: none; border-bottom: 2px solid var(--border); }

  /* Pane header layout on mobile is set further down (fixed-width picker + a
     single non-wrapping toolbar row). */
  /* Make sure cbt round display and next round button don't get hidden */
  .cbt-round-display { font-size: 11px; }

  /* PDF viewer on mobile: switch to overflow:auto on the pane so the
     entire pane scrolls, and give the PDF object a tall fixed pixel height
     so all pages are accessible by scrolling the pane. */
  .pane { flex: 1; min-height: 0; }
  .pane-content { flex: 1; overflow-y: auto; min-height: 0; }
  .tool-instance { min-height: 0; }
  .doc-body { flex: none; }
  .doc-frame-wrap.pdf-mode {
    padding: 0;
    overflow: visible;
    height: 160vw; /* taller than screen — user scrolls the pane */
  }
  .doc-frame-wrap.html-mode {
    height: 82vh; /* defined height so the zoom fit has real dimensions */
    overflow: auto;
  }
  .doc-frame.pdf-frame {
    width: 100% !important;
    height: 100% !important;
    min-height: unset;
  }
  .pdf-mobile-open { display: none !important; }
  .pdf-close-btn { display: none !important; }

  /* Single-pane lock: the layout picker is meaningless on mobile */
  .view-controls { display: none !important; }

  .toolrow { padding: 10px 12px; gap: 10px; }

  /* ── Larger type + touch targets (min 44px tap area) ── */
  .btn { font-size: 14px; padding: 11px 14px; min-height: 44px; }
  .btn.small { font-size: 13px; padding: 9px 12px; min-height: 40px; }
  .brand { font-size: 20px; }
  .bar-title { font-size: 14px; }
  /* Tool picker is a fixed size (see the dropdowns block below for the exact
     width); the icon buttons sit inline to its right in a single row that never
     wraps to a new line (it scrolls horizontally if a tool ever has more buttons
     than fit). */
  .pane-header { flex-wrap: nowrap !important; padding: 6px 10px; gap: 6px; }
  .pane-select { font-size: 14px !important; padding: 9px 8px !important; min-height: 42px; }
  .pane-toolbar-slot {
    flex: 1 1 auto; min-width: 0; flex-wrap: nowrap !important;
    justify-content: flex-start; overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .pane-toolbar-slot > * { flex: 0 0 auto; }
  .pane-toolbar-slot .toolbar-spacer { display: none; }
  /* Inputs and the generator tab-select keep a usable width; the row scrolls
     horizontally rather than wrapping if everything can't fit at once. */
  .pane-toolbar-slot input { flex: 0 1 140px; min-width: 90px; }
  .pane-toolbar-slot select { flex: 0 1 auto; min-width: 0; }
  .split-select, .gen-tab-select { font-size: 14px; min-height: 42px; padding: 8px 10px; }
  .session-controls .btn { min-height: 44px; }

  /* Notes / text entry */
  .nts-editor { font-size: 16px; padding: 14px 16px; }   /* 16px stops iOS zoom-on-focus */
  input[type="text"], input[type="number"], select, textarea { font-size: 16px; }

  /* Combat + tracker controls */
  .cbt-round-display { font-size: 15px; }
  /* Save toolbar space on phones: show "RD" instead of the full "Round". */
  .cbt-round-label { display: none; }
  .cbt-round-display::before { content: "RD "; }
  .npc-hp-btn, .tracker-adjust-btn { width: 44px; height: 44px; font-size: 18px; }
  .dice-camp-btn, .dice-hide-btn { font-size: 14px; padding: 10px 12px; min-height: 42px; }
  .dice-pool-clear, .dice-roll-go { font-size: 14px; padding: 11px 14px; min-height: 44px; }
  .dice-mod { font-size: 15px; padding: 9px 6px; min-height: 42px; }
  .dice-advbtn { font-size: 13px; padding: 10px 10px; min-height: 42px; }

  .cbt-body { flex-direction: column; }
  .npc-hp-btn, .tracker-adjust-btn { width: 32px; height: 32px; }
  /* DCC segments: shrink so 10 fit on one line before wrapping */
  .npc-seg { min-width: 0; height: 26px; flex: 1 1 0; }
  .npc-seg-num { font-size: 10px; }
  .npc-seg-row { gap: 2px; }
  .npc-hp-input { min-height: 32px; font-size: 14px; }
  .tracker-name-input, .npc-name-input { font-size: 14px; }

  .nts-editor { font-size: 16px; padding: 14px 16px; }
}

/* ── NOTES TABS (hanging overlay) ── */
.nts-body { position: relative; }
.nts-tabs { position: absolute; top: 0; left: 8px; right: 8px; z-index: 5; display: flex; align-items: flex-start; gap: 3px; overflow-x: auto; scrollbar-width: none; pointer-events: none; }
.nts-tabs::-webkit-scrollbar { display: none; }
.nts-tab { pointer-events: auto; display: flex; align-items: center; gap: 5px; padding: 4px 10px 5px; background: #232323; color: #999; border: 1px solid var(--border); border-top: none; border-radius: 0 0 5px 5px; cursor: pointer; font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 700; white-space: nowrap; flex-shrink: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
.nts-tab.active { background: var(--panel); color: var(--gold); border-color: var(--gold); }
.nts-tab-x { color: #666; font-size: 10px; padding: 0 1px; line-height: 1; }
.nts-tab-x:hover { color: #d06060; }
.nts-tab-add { pointer-events: auto; padding: 4px 9px 5px; background: rgba(35,35,35,0.85); color: #888; border: 1px dashed var(--border); border-top: none; border-radius: 0 0 5px 5px; cursor: pointer; font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 900; flex-shrink: 0; }
.nts-tab-add:hover { color: var(--gold); border-color: var(--gold); }

/* ── DICE TRAY & ROLL LOG ── */
.dice-tool { overflow: hidden; }
.dice-tray { flex-shrink: 0; padding: 8px 10px 4px; border-top: 2px solid var(--border); background: rgba(0,0,0,0.25); }
.dice-btn-row { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dice-die { position: relative; padding: 12px 0; min-width: 0; background: var(--panel); color: var(--light); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: .04em; transition: border-color .1s, transform .05s; overflow: visible; }
.dice-die:hover { border-color: var(--gold); }
.dice-die:active { transform: scale(0.94); }
.dice-die.has { border-color: var(--gold); color: var(--gold); }
.dice-count { position: absolute; top: -6px; right: -5px; background: var(--gold); color: #1a1a1a; border-radius: 8px; min-width: 16px; height: 16px; line-height: 16px; font-size: 10px; font-weight: 900; font-family: 'Montserrat', sans-serif; }
.dice-pool { flex-shrink: 0; padding: 4px 10px 8px; background: rgba(0,0,0,0.25); }
.dice-pool-label-row { padding: 0 0 6px; }
.dice-pool-label { display: block; font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dice-pool-row { display: flex; align-items: center; gap: 5px; }
.dice-pool-row .dice-mod { flex: 0 1 auto; }
.dice-roll-go { flex: 1; }
.dice-mod { width: 44px; background: var(--panel); border: 1px solid var(--border); border-radius: 4px; color: var(--light); font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700; padding: 5px 4px; text-align: center; outline: none; }
.dice-advbtn { padding: 6px 8px; background: var(--panel); color: #888; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-family: 'Montserrat', sans-serif; font-size: 9px; font-weight: 900; letter-spacing: .06em; }
.dice-advbtn.on-adv { background: #1a3a1a; border-color: #2d7a2d; color: #6dbf6d; }
.dice-advbtn.on-dis { background: #3a1a1a; border-color: #7a2d2d; color: #df6a6a; }
.dice-roll-go { padding: 6px 12px; background: var(--gold); color: #1a1a1a; border: none; border-radius: 4px; cursor: pointer; font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.dice-roll-go:hover { filter: brightness(1.1); }
.dice-pool-clear { padding: 6px 9px; background: transparent; color: #999; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700; white-space: nowrap; }
.dice-pool-clear:hover { color: #df6a6a; border-color: #7a2d2d; }
.dice-log { flex: 1; overflow-y: auto; padding: 8px 10px; display: flex; flex-direction: column-reverse; justify-content: flex-start; gap: 6px; }
.dice-log-hint { font-family: 'Montserrat', sans-serif; font-size: 10px; color: #666; font-style: italic; padding: 8px 2px; }
.dice-log-entry { background: #1e1e1e; border: 1px solid #333; padding: 7px 9px; }
.dice-log-entry .roll-label { font-family: 'Montserrat', sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: #777; margin-bottom: 2px; }
.dice-log-entry .roll-result { font-family: 'Montserrat', monospace; font-size: 22px; font-weight: 900; color: #f0f0f0; line-height: 1; }
.dice-log-entry .roll-detail { font-size: 9px; color: #555; margin-top: 2px; font-family: 'Montserrat', sans-serif; }
.dice-log-entry.crit { border-color: #ffd700; }
.dice-log-entry.crit .roll-result { color: #ffd700; }
.dice-log-entry.fumble { border-color: #ff4444; }
.dice-log-entry.fumble .roll-result { color: #ff4444; }
@media (max-width: 760px) {
  .dice-btn-row { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .dice-die { padding: 14px 0; font-size: 16px; min-height: 48px; }
  .dice-log-entry { font-size: 14px; }
}

.dice-camp-btn { padding: 6px 9px; background: transparent; color: #777; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-size: 12px; line-height: 1; white-space: nowrap; }
.dice-camp-btn.on { background: rgba(200,160,32,0.12); color: var(--gold); border-color: var(--gold); }
.dice-hide-btn { padding: 6px 9px; background: rgba(45,122,45,0.12); color: #6dbf6d; border: 1px solid #2d7a2d; border-radius: 4px; cursor: pointer; font-size: 12px; line-height: 1; white-space: nowrap; }
.dice-hide-btn.on { background: rgba(122,45,45,0.15); color: #df8a8a; border-color: #7a2d2d; }
.dice-camp-panel { padding: 6px 0 2px; }
/* Campaign link — top bar button + popover */
#camp-btn.on { background: rgba(200,160,32,0.12); color: var(--gold); border-color: var(--gold); }
#camp-popover {
  position: fixed; top: 46px; right: 12px; z-index: 400; width: 300px; max-width: calc(100vw - 24px);
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
  padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.55);
}
#camp-popover .camp-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
#camp-popover .camp-row:last-child { margin-bottom: 0; }
#camp-popover input {
  flex: 1; min-width: 60px; padding: 6px 8px; background: var(--panel); border: 1px solid var(--border);
  border-radius: 4px; color: var(--light); font-family: 'Montserrat', sans-serif; font-size: 11px; outline: none;
}
#camp-popover button {
  padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; flex-shrink: 0;
  font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 9px; letter-spacing: .08em; text-transform: uppercase;
}
#camp-popover .camp-hint { font-family: 'Montserrat', sans-serif; font-size: 9px; color: var(--muted); line-height: 1.5; }
#camp-popover .camp-err { font-family: 'Montserrat', sans-serif; font-size: 10px; color: #df6a6a; min-height: 12px; }
#camp-popover .camp-live { font-family: 'Montserrat', sans-serif; font-size: 11px; color: var(--gold); flex: 1; }
#camp-popover .camp-list { display: flex; flex-direction: column; gap: 4px; max-height: 240px; overflow-y: auto; margin-bottom: 4px; }
#camp-popover .camp-item {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  width: 100%; padding: 8px 10px; text-align: left;
  background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
  color: var(--light); cursor: pointer; text-transform: none; letter-spacing: 0; font-weight: 700;
}
#camp-popover .camp-item:hover { border-color: var(--muted); }
#camp-popover .camp-item.active { background: rgba(200,160,32,0.12); border-color: var(--gold); color: var(--gold); }
#camp-popover .camp-item-name { font-family: 'Montserrat', sans-serif; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#camp-popover .camp-item-code { font-family: 'Montserrat', sans-serif; font-size: 10px; letter-spacing: .12em; color: var(--muted); flex-shrink: 0; }
#camp-popover .camp-item.active .camp-item-code { color: var(--gold); }
#camp-popover .camp-sep { height: 1px; background: var(--border); margin: 8px 0; }
@media (max-width: 760px) { #camp-popover { top: 54px; left: 12px; right: 12px; width: auto; } }
.dice-camp-row { display: flex; gap: 6px; align-items: center; margin-bottom: 5px; }
.dice-log-entry.remote { border-left: 3px solid #8a7ac8; background: #201d2a; }
/* ══ ROUNDED BUTTONS ══════════════════════════════════════════════════════
   Applied last so it wins over the per-button rules above. Deliberately
   shaped controls are left alone: .nts-tab / .nts-tab-add (notes tabs). */
.btn, .dice-camp-btn, .dice-hide-btn, .dice-advbtn, .dice-pool-clear,
.dice-roll-go, .npc-mode-btn, .tracker-type-btn, .pdf-close-btn,
.pdf-mobile-open-btn, .dice-die {
  border-radius: 6px;
}
.btn.small { border-radius: 5px; }
.npc-hp-btn, .tracker-adjust-btn { border-radius: 6px; }

/* ══ MOBILE SIZING PASS ═══════════════════════════════════════════════════
   Appended last so it wins over the earlier mobile rules above. Covers:
   combat + tracker controls, notes tabs, generator options, dice tray. */
@media (max-width: 760px) {

  /* ── (1) Combat & Trackers: real thumb-sized controls ── */
  .cbt-round-display { font-size: 15px; }
  .cbt-round-num, .trk-round-num { font-size: 20px; }
  .cbt-tracker-list, .cbt-npc-list { padding: 12px; gap: 10px; }

  .tracker-card, .npc-card { padding: 12px 14px; }
  .tracker-top, .npc-top { gap: 10px; margin-bottom: 10px; }
  .tracker-bottom, .npc-hp-row { gap: 10px; }

  /* +/- steppers — the ones you hit constantly mid-fight */
  .npc-hp-btn, .tracker-adjust-btn {
    width: 48px !important; height: 48px !important;
    font-size: 22px !important; border-radius: 6px;
  }
  .npc-hp-adjust { gap: 6px; }

  /* Rounds / Timer and Std / DCC toggles */
  .tracker-type-btn, .npc-mode-btn {
    font-size: 12px !important; padding: 11px 14px !important; min-height: 44px;
  }

  /* Delete "x" buttons stay smaller than the rest — they're destructive */
  .tracker-del, .npc-del {
    font-size: 18px !important; padding: 6px 9px !important;
    min-height: 34px; min-width: 34px;

<!-- Campaign link popover — anchored under the top bar -->
<div id="camp-popover" style="display:none;"></div>

<script>
// ══════════════════════════════════════════
// CAMPAIGN LINK (top bar)
// The campaign used to live inside the Dice Tray, which meant it vanished
// whenever that tool wasn't on screen. It now lives here — one connection,
// owned by the page, that the Dice Tray broadcasts to and the Party tool reads.
// ══════════════════════════════════════════
const GMCamp = (function() {
  const clientKey = 'gm-' + Math.random().toString(36).slice(2, 12);
  let campaign  = null;     // {id, code, name}
  let hideRolls = false;    // GM can keep their own rolls off the shared log
  let lastId    = 0;
  let timer     = null;
  let panelOpen = false;
  const listeners = new Set();   // fn(roll) — the Dice Tray's log
  const watchers  = new Set();   // fn() — told whenever the link or hide state changes
  let pending = [];              // rolls that arrived before anyone was listening

  const btn = () => document.getElementById('camp-btn');
  const pop = () => document.getElementById('camp-popover');
  const esc = t => String(t == null ? '' : t).replace(/</g, '&lt;');

  // ── Roll traffic ──
  function broadcast(entry) {
    if(!campaign || hideRolls) return;
    fetch('/api/campaigns/' + campaign.id + '/rolls', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        clientKey, source: 'GM',
        label: entry.label, result: String(entry.total),
        detail: entry.detail, type: entry.crit || 'normal'
      })
    }).catch(() => {});
  }

  async function poll() {
    if(!campaign) return;
    try {
      const url = '/api/campaigns/' + campaign.id + '/rolls' + (lastId ? '?since=' + lastId : '');
      const r = await fetch(url, { credentials: 'same-origin' });
      if(!r.ok) return;
      const data = await r.json();
      (data.rolls || []).forEach(roll => {
        if(roll.clientKey === clientKey) return;
        if(listeners.size) listeners.forEach(fn => { try { fn(roll); } catch(e) {} });
        else { pending.push(roll); if(pending.length > 100) pending.shift(); }
      });
      if(data.last) lastId = data.last;
    } catch(e) {}
  }

  // Poll every 4s while the tab is visible; back off to 20s when it's hidden
  // (a GM screen parked on a second monitor doesn't need live cadence). The
  // ?since cursor means nothing is missed — backed-off rolls just arrive on the
  // next tick, and refocusing snaps straight back to 4s with an immediate poll.
  function pollDelay() { return document.hidden ? 20000 : 4000; }
  function start() {
    stop();
    poll();
    timer = setInterval(poll, pollDelay());
  }
  function stop()  { if(timer) { clearInterval(timer); timer = null; } }
  document.addEventListener('visibilitychange', function() {
    if(!campaign || !timer) return;   // only re-arm an already-running poll
    clearInterval(timer);
    if(!document.hidden) poll();       // refocus → catch up immediately
    timer = setInterval(poll, pollDelay());
  });

  // The Dice Tray registers here when it is first created — anything that
  // arrived while it didn't exist yet is handed over on the way in.
  function onRoll(fn) {
    listeners.add(fn);
    const backlog = pending; pending = [];
    backlog.forEach(roll => { try { fn(roll); } catch(e) {} });
  }

  // ── UI ──
  function renderBtn() {
    const b = btn();
    if(!b) return;
    b.classList.toggle('on', !!campaign);
    b.textContent = (campaign ? '' + campaign.code : 'Campaign') + ' ▾';
    b.title = campaign ? 'Campaign: ' + campaign.name + ' (' + campaign.code + ')' : 'Campaign link';
  }

  // The Dice Tray subscribes so its hide-rolls button appears, disappears, and
  // restyles itself as the link comes and goes.
  function onChange(fn) { watchers.add(fn); }
  function notify() { watchers.forEach(fn => { try { fn(); } catch(e) {} }); }

  // Cached list of the campaigns on this account (null = not fetched yet).
  let campList = null;

  async function loadList() {
    try {
      const r = await fetch('/api/campaigns', { credentials: 'same-origin' });
      if(r.ok) {
        const d = await r.json();
        campList = Array.isArray(d) ? d : (d && Array.isArray(d.campaigns) ? d.campaigns : []);
      } else {
        campList = [];   // endpoint missing / not signed in — create & join still work
      }
    } catch(e) { campList = []; }
    if(panelOpen) renderPanel();
  }

  function renderPanel() {
    const el = pop();
    if(!el) return;
    el.style.display = panelOpen ? 'block' : 'none';
    if(!panelOpen) return;

    // ── The account's campaigns, as a pick-list ──
    let listHtml;
    if(campList === null) {
      listHtml = '<div class="camp-hint">Loading campaigns…</div>';
    } else if(!campList.length) {
      listHtml = '<div class="camp-hint">No campaigns on your account yet — create one on the Campaigns page.</div>';
    } else {
      listHtml = '<div class="camp-list">' + campList.map(c =>
          '<button class="camp-item' + ((campaign && String(campaign.id) === String(c.id)) ? ' active' : '') + '" data-id="' + esc(c.id) + '">'
        +   '<span class="camp-item-name">' + esc(c.name) + '</span>'
        +   '<span class="camp-item-code">' + esc(c.code) + '</span>'
        + '</button>'
      ).join('') + '</div>';
    }

    el.innerHTML =
        listHtml
      + (campaign
          ? '<button class="camp-leave" style="background:#3a1a1a;color:#df8a8a;border:1px solid #7a2d2d;width:100%;margin-top:8px;">Disconnect ' + esc(campaign.code) + '</button>'
          : '')
      + '<div class="camp-err"></div>'
      + '<div class="camp-hint">Pick a campaign to connect this screen. Rolls sync both ways and linked players show in the Party tool. Campaigns are created and managed on the Campaigns page.</div>';

    // Connect to a campaign the user picked from the list
    el.querySelectorAll('.camp-item').forEach(b => {
      b.onclick = () => {
        const c = (campList || []).find(x => String(x.id) === String(b.getAttribute('data-id')));
        if(c) { panelOpen = false; renderPanel(); switchBoard(c); }
      };
    });

    const leaveBtn = el.querySelector('.camp-leave');
    if(leaveBtn) leaveBtn.onclick = () => { panelOpen = false; renderPanel(); switchBoard(null); };

    // Create and Join were removed from the GM Screen: campaigns are created on
    // the Campaigns page, and players join from their character sheets. This
    // panel only lists the account's campaigns and connects the screen to one.
  }

  // Switching campaigns swaps the whole board. The saved board for each campaign
  // lives server-side keyed by (user, campaign), so we: (1) save the board we're
  // leaving under its own campaign, (2) mark the target as the one to open next,
  // (3) reload — the page then restores that campaign's board and link cleanly,
  // with no residue from the previous one. Pass null to switch to the personal
  // (unlinked) board. Falls back to the old in-place link swap if the server
  // hooks aren't present (e.g. running the raw template outside the app).
  async function switchBoard(nextCampaign) {
    if(window.__ddCampaignSwitching) return;
    if(!window.__ddFlushNow || !window.__ddSelectCampaign) { set(nextCampaign); return; }
    window.__ddCampaignSwitching = true;
    try {
      await window.__ddFlushNow();                       // save the board we're leaving
      await window.__ddSelectCampaign(nextCampaign || null); // make the target last-used
      // Remember the real campaign so the reloaded page activates the link from
      // this object directly, rather than depending on the stored board's shape.
      try { sessionStorage.setItem('dd-activate-campaign', JSON.stringify(nextCampaign || null)); } catch(e){}
      window.location.reload();                          // reopen into the target's board
    } catch(e) {
      window.__ddCampaignSwitching = false;
      set(nextCampaign);                                 // best-effort: at least apply the link
    }
  }

  function set(c) {
    campaign = (c && c.id) ? c : null;
    lastId = 0;
    pending = [];
    if(campaign) start(); else stop();
    renderBtn();
    notify();
    if(window.__ddScheduleSave) setTimeout(window.__ddScheduleSave, 300);   // persist the link
  }

  function togglePanel() {
    panelOpen = !panelOpen;
    renderPanel();                 // instant: shows cached list (or a loading line first time)
    if(panelOpen) loadList();      // refresh in the background, re-renders when it lands
  }
  function toggleHide()  {
    hideRolls = !hideRolls;
    notify();
    if(window.__ddScheduleSave) setTimeout(window.__ddScheduleSave, 300);
  }

  // Click outside closes the popover
  document.addEventListener('click', e => {
    if(!panelOpen) return;
    if(e.target.closest('#camp-popover') || e.target.closest('#camp-btn')) return;
    panelOpen = false; renderPanel();
  });

  return {
    get: () => campaign,
    set,
    onRoll,
    onChange,
    broadcast,
    toggleHide,
    togglePanel,
    isHidden: () => hideRolls,
    setHidden: v => { hideRolls = !!v; renderBtn(); },
    serialize: () => ({ campaign, hideRolls }),
    restore: (s) => {
      if(!s) return;
      if(typeof s.hideRolls === 'boolean') hideRolls = s.hideRolls;
      if(s.campaign && s.campaign.id) set(s.campaign); else { renderBtn(); notify(); }
    },
    render: renderBtn,
  };
})();
window.GMCamp = GMCamp;
window.__gmCampaign = () => GMCamp.get();   // Party tool reads the linked campaign from here
GMCamp.render();
</script>

<script>
// ══════════════════════════════════════════
// SCENES — layered, pinnable audio scenes for the Music tool
// A scene is a set of tracks that play at once, each with its own loop + volume.
// Like the campaign link, scenes are owned by the page (not the tool instance),
// so a scene pinned to the top bar keeps playing even when the Music pane is
// closed. One scene plays at a time; triggering another crossfades. Cross-origin
// URLs play through plain <audio> (no CORS needed); fades ramp .volume directly.
// Local (object-URL) tracks can't survive a reload, so only http(s) URLs are
// saved — local tracks return as re-linkable placeholders.
// ══════════════════════════════════════════
const GMScenes = (function() {
  let scenes = [];
  let nextId = 1;
  let activeId = null;
  let masterVol = 0.8;
  let players = [];       // {trackId, audio} for the active scene
  let onChange = null;
  const FADE = 1800;

  const clamp01 = v => Math.max(0, Math.min(1, v));
  const isHttp = u => typeof u === 'string' && /^https?:\/\//i.test(u);
  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function normUrl(u){
    // Dropbox share links serve a preview page unless raw=1 is set; drop the
    // short-lived st= token and force raw=1 so <audio> gets the file itself.
    if(typeof u!=='string' || !/dropbox\.com/i.test(u)) return u;
    const parts = u.split('?'); const base = parts[0];
    const params = (parts[1]||'').split('&').filter(Boolean).filter(p=>!/^(st|dl|raw)=/i.test(p));
    params.push('raw=1');
    return base + '?' + params.join('&');
  }
  function ramp(a, to, ms, done){
    if(a._ramp){ clearInterval(a._ramp); a._ramp=null; }
    to = clamp01(to); const steps = Math.max(1, Math.round(ms/40)); const from = a.volume; let i=0;
    a._ramp = setInterval(()=>{ i++; try{ a.volume = clamp01(from+(to-from)*(i/steps)); }catch(e){} if(i>=steps){ clearInterval(a._ramp); a._ramp=null; if(done) done(); } }, 40);
  }
  const scene = id => scenes.find(s=>s.id===id) || null;
  const tvol = t => clamp01(masterVol * (typeof t.vol==='number'?t.vol:0.8));
  function notify(){ renderPins(); if(typeof onChange==='function'){ try{ onChange(); }catch(e){} } }

  function newScene(name){ return { id: nextId++, name: name || ('Scene ' + (scenes.length+1)), pinned:false, tracks: [] }; }
  function newTrack(name, url){ return { id: nextId++, name: name||'Track', url: url||null, loop:true, vol:0.8, needsFile: !url }; }

  // ── playback ──
  function spawn(t){
    const a = new Audio(t.url); a.loop = !!t.loop; a.volume = 0;
    const p = a.play(); if(p && p.catch) p.catch(()=>{});
    ramp(a, tvol(t), FADE);
    players.push({ trackId: t.id, audio: a });
  }
  function stopInternal(fade){
    players.forEach(pl=>{ const a=pl.audio; if(fade) ramp(a,0,FADE,()=>{ try{a.pause();}catch(e){} }); else { try{a.pause();}catch(e){} } });
    players = [];
  }
  function play(id){
    const s = scene(id); if(!s) return;
    stopInternal(true);
    activeId = id;
    s.tracks.filter(t=>!t.needsFile && t.url).forEach(spawn);
    notify();
  }
  function stop(){ stopInternal(true); activeId = null; notify(); }
  function toggle(id){ if(activeId===id) stop(); else play(id); }
  const isPlaying = id => activeId===id && players.length>0;

  function refreshTrack(t){
    const pl = players.find(p=>p.trackId===t.id);
    if(pl){ try{ pl.audio.loop = !!t.loop; if(!pl.audio._ramp) pl.audio.volume = tvol(t); }catch(e){} }
  }
  function setMasterVol(v){
    masterVol = clamp01(v);
    if(activeId!=null){ const s=scene(activeId); if(s) players.forEach(pl=>{ const t=s.tracks.find(x=>x.id===pl.trackId); if(t && !pl.audio._ramp){ try{ pl.audio.volume = tvol(t); }catch(e){} } }); }
  }

  // ── mutations ──
  function addScene(name){ const s=newScene(name); scenes.push(s); notify(); return s.id; }
  function removeScene(id){ if(activeId===id) stop(); scenes = scenes.filter(s=>s.id!==id); notify(); }
  function renameScene(id, name){ const s=scene(id); if(s){ s.name = name; renderPins(); } }
  function togglePin(id){ const s=scene(id); if(s){ s.pinned = !s.pinned; notify(); } }
  function addTrackUrl(id, url){
    const s=scene(id); if(!s || !url) return;
    const clean = normUrl(url.trim()); if(!clean) return;
    let nm='Track'; try{ nm = decodeURIComponent(clean.split('/').pop().split('?')[0]) || nm; }catch(e){}
    const t = newTrack(nm, clean); s.tracks.push(t);
    if(activeId===id) spawn(t);
    notify();
  }
  // Like addTrackUrl but keeps a caller-supplied name (used by the Sound
  // Library picker so the track shows its library label, not the filename).
  function addLibraryTrack(id, name, url){
    const s=scene(id); if(!s || !url) return false;
    const clean = normUrl(String(url).trim()); if(!isHttp(clean)) return false;
    let nm = (name && String(name).trim()) ? String(name).trim() : 'Track';
    if(nm==='Track'){ try{ nm = decodeURIComponent(clean.split('/').pop().split('?')[0]) || nm; }catch(e){} }
    const t = newTrack(nm, clean); s.tracks.push(t);
    if(activeId===id) spawn(t);
    notify();
    return true;
  }
  function addTrackFiles(id, fileList){
    const s=scene(id); if(!s) return;
    Array.from(fileList).forEach(f=>{
      if(!/^audio\//.test(f.type) && !/\.(mp3|ogg|wav|m4a|aac|flac|opus|webm)$/i.test(f.name)) return;
      const url = URL.createObjectURL(f);
      const ph = s.tracks.find(t=>t.needsFile && t.name===f.name);
      if(ph){ ph.url=url; ph.needsFile=false; if(activeId===id) spawn(ph); }
      else { const t=newTrack(f.name, url); t.needsFile=false; s.tracks.push(t); if(activeId===id) spawn(t); }
    });
    notify();
  }
  function removeTrack(id, trackId){
    const s=scene(id); if(!s) return;
    if(activeId===id){ const pl=players.find(p=>p.trackId===trackId); if(pl){ ramp(pl.audio,0,300,()=>{ try{pl.audio.pause();}catch(e){} }); players = players.filter(p=>p.trackId!==trackId); } }
    s.tracks = s.tracks.filter(t=>t.id!==trackId); notify();
  }
  function setTrackLoop(id, trackId, val){ const s=scene(id); if(!s) return; const t=s.tracks.find(x=>x.id===trackId); if(t){ t.loop=!!val; if(activeId===id) refreshTrack(t); notify(); } }
  function setTrackVol(id, trackId, v){ const s=scene(id); if(!s) return; const t=s.tracks.find(x=>x.id===trackId); if(t){ t.vol=clamp01(v); if(activeId===id) refreshTrack(t); } } // no notify: keep slider smooth

  // ── pinned top-bar buttons ──
  function renderPins(){
    const host = document.getElementById('scene-pins');
    if(!host) return;
    host.innerHTML = '';
    scenes.filter(s=>s.pinned).forEach(s=>{
      const on = activeId===s.id;
      const b = document.createElement('button');
      b.className = 'btn small ghost scene-pin' + (on ? ' active' : '');
      b.title = (on ? 'Stop scene: ' : 'Play scene: ') + s.name;
      b.innerHTML = (on ? '<svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><rect x="5.2" y="5.2" width="13.6" height="13.6" rx="2"/></svg> ' : '<svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M7 4.6v14.8a1 1 0 0 0 1.5.86l12-7.4a1 1 0 0 0 0-1.72l-12-7.4A1 1 0 0 0 7 4.6Z"/></svg> ') + esc(s.name);
      b.addEventListener('click', ()=> toggle(s.id));
      host.appendChild(b);
    });
  }

  // ── persistence ──
  function serialize(){
    return { masterVol, scenes: scenes.map(s=>({
      name: s.name, pinned: !!s.pinned,
      tracks: s.tracks.map(t=>({ name:t.name, url:isHttp(t.url)?t.url:null, loop:!!t.loop, vol:(typeof t.vol==='number'?t.vol:0.8) }))
    })) };
  }
  function restore(data){
    stopInternal(false); activeId=null; players=[];
    if(!data){ scenes=[]; }
    else {
      masterVol = (typeof data.masterVol==='number') ? data.masterVol : 0.8;
      scenes = (data.scenes||[]).map(s=>({
        id: nextId++, name: s.name||'Scene', pinned: !!s.pinned,
        tracks: (s.tracks||[]).map(t=>({ id: nextId++, name:t.name||'Track', url:isHttp(t.url)?normUrl(t.url):null, loop: t.loop!==false, vol:(typeof t.vol==='number'?t.vol:0.8), needsFile: !isHttp(t.url) }))
      }));
    }
    notify();
  }

  return {
    list: ()=>scenes, get: scene,
    addScene, removeScene, renameScene, togglePin,
    addTrackUrl, addLibraryTrack, addTrackFiles, removeTrack, setTrackLoop, setTrackVol,
    play, stop, toggle, isPlaying,
    activeId: ()=>activeId, masterVol: ()=>masterVol, setMasterVol,
    serialize, restore, renderPins, setOnChange: fn => { onChange = fn; }
  };
})();
window.GMScenes = GMScenes;
GMScenes.renderPins();

// ── Mobile header collapse ──
// On phones a stack of pinned scenes can swallow much of the screen, so the
// top bar defaults to collapsed behind a slim handle. The choice is remembered.
(function(){
  const KEY = 'dd_gmscreen_v1:hdrHidden';
  const toggle = document.getElementById('hdr-toggle');
  if(!toggle) return;
  let hidden;
  try { const v = localStorage.getItem(KEY); hidden = (v === null) ? true : (v === '1'); }
  catch(e) { hidden = true; }
  function apply(){
    document.body.classList.toggle('hdr-hidden', hidden);
    toggle.innerHTML = hidden ? '&#9776;&nbsp; Show controls' : '&#10005;&nbsp; Hide controls';
  }
  function flip(){ hidden = !hidden; try { localStorage.setItem(KEY, hidden ? '1' : '0'); } catch(e){} apply(); }
  toggle.addEventListener('click', flip);
  toggle.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
  apply();
})();
</script>
