<script>
// ══════════════════════════════════════════
// MUSIC / SOUNDBOARD TOOL — Kenku-style mixer
// Loop background music while layering one-shot sound-effect pads. Plays local
// files (object URLs) and direct audio URLs. Cross-origin URLs play through a
// plain <audio> element (no Web Audio), so no CORS is required; fades ramp the
// element's .volume directly. Local (object-URL) tracks can't survive a reload,
// so only their name + settings are saved as a re-linkable placeholder.
// ══════════════════════════════════════════
function init_music(root) {
  let nextId = 1;
  let music = [];   // {id,name,url,loop,vol,needsFile}
  let sfx = [];     // {id,name,url,loop,vol,needsFile,_audio}
  let curId = null;
  let playing = false;
  let loopList = true, shuffle = false;
  let musicVol = 0.8, sfxVol = 0.9;
  const FADE = 1400;
  const liveSfx = new Set();
  function normUrl(u){
    // Dropbox share links serve a preview page unless raw=1 is set; drop the
    // short-lived st= token and force raw=1 so <audio> gets the file itself.
    if(typeof u!=='string' || !/dropbox\.com/i.test(u)) return u;
    const parts = u.split('?'); const base = parts[0];
    const params = (parts[1]||'').split('&').filter(Boolean).filter(p=>!/^(st|dl|raw)=/i.test(p));
    params.push('raw=1');
    return base + '?' + params.join('&');
  }

  const $ = s => root.querySelector(s);
  const nowTitle    = $('.mus-now-title');
  const seek        = $('.mus-seek');
  const curTimeEl   = $('.mus-cur');
  const durEl       = $('.mus-dur');
  const playBtn     = $('.mus-play');
  const prevBtn     = $('.mus-prev');
  const nextBtn     = $('.mus-next');
  const loopListBtn = $('.mus-loop-list');
  const shuffleBtn  = $('.mus-shuffle');
  const musicVolEl  = $('.mus-music-vol');
  const sfxVolEl    = $('.mus-sfx-vol');
  const musicList   = $('.mus-music-list');
  const musicEmpty  = $('.mus-music-empty');
  const sfxGrid     = $('.mus-sfx-grid');
  const sfxEmpty    = $('.mus-sfx-empty');
  const fileMusic   = $('.mus-file-music');
  const fileSfx     = $('.mus-file-sfx');
  const stopAllBtn  = $('.mus-stopall');
  const musicSection= $('.mus-music-section');
  const sfxSection  = $('.mus-sfx-section');

  const audioA = new Audio(), audioB = new Audio();
  audioA.preload = audioB.preload = 'metadata';
  let active = audioA;

  const clamp01 = v => Math.max(0, Math.min(1, v));
  const isHttp = u => typeof u === 'string' && /^https?:\/\//i.test(u);
  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function fmt(t){ if(!isFinite(t)||t<0) t=0; const m=Math.floor(t/60), s=Math.floor(t%60); return m+':'+String(s).padStart(2,'0'); }

  // Shared fade ticker (see the scenes player above for rationale): one 40ms
  // interval alive only while fades are running, instead of one per element.
  const _fades = new Set();
  let _fadeTimer = null;
  function _fadeTick(){
    const now = performance.now();
    _fades.forEach(f => {
      const k = f.ms > 0 ? Math.min(1, (now - f.start)/f.ms) : 1;
      try { f.a.volume = clamp01(f.from + (f.to - f.from)*k); } catch(e){}
      if(k >= 1){ _fades.delete(f); if(f.a._ramp === f) f.a._ramp = null; if(f.done) f.done(); }
    });
    if(!_fades.size){ clearInterval(_fadeTimer); _fadeTimer = null; }
  }
  function ramp(a, to, ms, done){
    if(a._ramp){ _fades.delete(a._ramp); a._ramp = null; }
    const f = { a: a, from: a.volume, to: clamp01(to), ms: ms, start: performance.now(), done: done };
    a._ramp = f;
    _fades.add(f);
    if(!_fadeTimer) _fadeTimer = setInterval(_fadeTick, 40);
  }

  const curTrack = () => music.find(t=>t.id===curId) || null;
  const targetVol = t => clamp01(musicVol * (t ? (typeof t.vol==='number'?t.vol:1) : 1));

  function bindAudio(a){
    a.addEventListener('timeupdate', ()=>{ if(a!==active) return; if(a.duration){ seek.value = Math.round((a.currentTime/a.duration)*1000); curTimeEl.textContent = fmt(a.currentTime); durEl.textContent = fmt(a.duration); } });
    a.addEventListener('loadedmetadata', ()=>{ if(a===active && a.duration) durEl.textContent = fmt(a.duration); });
    a.addEventListener('ended', ()=>{ if(a===active) advance(+1, true); });
  }
  bindAudio(audioA); bindAudio(audioB);

  function playTrack(id, opts){
    opts = opts || {};
    const crossfade = opts.crossfade !== false;
    const t = music.find(x=>x.id===id);
    if(!t) return;
    if(t.needsFile || !t.url){ renderMusic(); return; }
    const idle = (active===audioA) ? audioB : audioA;
    idle.src = t.url; idle.loop = !!t.loop; try { idle.currentTime = 0; } catch(e){}
    const tv = targetVol(t);
    idle.volume = crossfade ? 0 : tv;
    const p = idle.play(); if(p && p.catch) p.catch(()=>{});
    if(crossfade){
      ramp(idle, tv, FADE);
      const old = active;
      ramp(old, 0, FADE, ()=>{ try { old.pause(); } catch(e){} });
    }
    active = idle; curId = id; playing = true;
    renderMusic(); renderNow();
  }

  function togglePlay(){
    const t = curTrack();
    if(!t){
      const first = music.find(x=>!x.needsFile && x.url);
      if(first) playTrack(first.id, {crossfade:false});
      return;
    }
    if(playing){ ramp(active, 0, 300, ()=>{ try{active.pause();}catch(e){} }); playing=false; }
    else { active.volume=0; const p=active.play(); if(p&&p.catch)p.catch(()=>{}); ramp(active, targetVol(t), 300); playing=true; }
    renderNow(); renderMusic();
  }

  function advance(dir, auto){
    const order = music.filter(t=>!t.needsFile && t.url).map(t=>t.id);
    if(!order.length){ stopMusic(); return; }
    let pos = order.indexOf(curId);
    if(shuffle && dir>0){
      let np = pos;
      if(order.length>1){ while(np===pos) np = Math.floor(Math.random()*order.length); } else np = 0;
      playTrack(order[np], {crossfade:true}); return;
    }
    if(pos < 0) pos = dir>0 ? -1 : 0;
    let np = pos + dir;
    if(np >= order.length){ if(auto && !loopList){ stopMusic(); return; } np = 0; }
    if(np < 0) np = order.length - 1;
    playTrack(order[np], {crossfade:true});
  }

  function stopMusic(){ ramp(active, 0, FADE, ()=>{ try{active.pause();}catch(e){} }); playing=false; renderNow(); renderMusic(); }

  function setMusicVol(v){ musicVol = clamp01(v); const t=curTrack(); if(t && playing && !active._ramp){ try{ active.volume = targetVol(t); }catch(e){} } }
  function setSfxVol(v){ sfxVol = clamp01(v); sfx.forEach(s=>{ if(s._audio){ try{ s._audio.volume = clamp01(sfxVol*(typeof s.vol==='number'?s.vol:1)); }catch(e){} } }); }

  function triggerSfx(s){
    if(s.loop){
      if(s._audio){ stopSfx(s); return; }
      const a = new Audio(s.url); a.loop = true; a.volume = clamp01(sfxVol*(typeof s.vol==='number'?s.vol:1));
      liveSfx.add(a); s._audio = a;
      const p = a.play(); if(p&&p.catch)p.catch(()=>{});
      renderSfx();
    } else {
      const a = new Audio(s.url); a.volume = clamp01(sfxVol*(typeof s.vol==='number'?s.vol:1));
      liveSfx.add(a);
      a.addEventListener('ended', ()=>{ liveSfx.delete(a); });
      const p = a.play(); if(p&&p.catch)p.catch(()=>{});
    }
  }
  function stopSfx(s){
    if(s._audio){ const a=s._audio; s._audio=null; ramp(a, 0, 250, ()=>{ try{a.pause();}catch(e){} liveSfx.delete(a); }); }
    renderSfx();
  }

  function stopAll(){
    stopMusic();
    sfx.forEach(s=>{ if(s._audio) stopSfx(s); });
    liveSfx.forEach(a=>{ try{ ramp(a, 0, 200, ()=>{ try{a.pause();}catch(e){} liveSfx.delete(a); }); }catch(e){} });
    if(window.GMScenes) GMScenes.stop();
  }

  function addFiles(fileList, kind){
    const list = kind==='music' ? music : sfx;
    Array.from(fileList).forEach(f=>{
      if(!/^audio\//.test(f.type) && !/\.(mp3|ogg|wav|m4a|aac|flac|opus|webm)$/i.test(f.name)) return;
      const url = URL.createObjectURL(f);
      const ph = list.find(t=>t.needsFile && t.name===f.name);
      if(ph){ ph.url=url; ph.needsFile=false; }
      else list.push({ id:nextId++, name:f.name, url, loop:false, vol:1, needsFile:false });
    });
    if(kind==='music') renderMusic(); else renderSfx();
  }

  function addUrl(kind){
    (window.ddPromptUrl ? window.ddPromptUrl('Direct audio URL (mp3 / ogg / wav):') : Promise.resolve(prompt('Direct audio URL (mp3 / ogg / wav):'))).then(function(url){
      if(!url) return;
      const clean = normUrl(url.trim()); if(!clean) return;
      let name = 'Track';
      try { name = decodeURIComponent(clean.split('/').pop().split('?')[0]) || name; } catch(e){}
      const list = kind==='music' ? music : sfx;
      list.push({ id:nextId++, name, url:clean, loop:false, vol:1, needsFile:false });
      if(kind==='music') renderMusic(); else renderSfx();
    });
  }

  function renderNow(){
    const t = curTrack();
    nowTitle.textContent = t ? t.name : 'Nothing playing';
    nowTitle.classList.toggle('idle', !t);
    playBtn.innerHTML = playing ? '<svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M6.5 4.5h3.4a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H6.5a1 1 0 0 1-1-1v-13a1 1 0 0 1 1-1Zm7.6 0h3.4a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-3.4a1 1 0 0 1-1-1v-13a1 1 0 0 1 1-1Z"/></svg>' : '<svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M7 4.6v14.8a1 1 0 0 0 1.5.86l12-7.4a1 1 0 0 0 0-1.72l-12-7.4A1 1 0 0 0 7 4.6Z"/></svg>';
    loopListBtn.classList.toggle('active', loopList);
    shuffleBtn.classList.toggle('active', shuffle);
    if(!t){ seek.value=0; curTimeEl.textContent='0:00'; durEl.textContent='0:00'; }
  }

  function renderMusic(){
    musicList.innerHTML = '';
    musicEmpty.style.display = music.length ? 'none' : 'block';
    music.forEach(t=>{
      const row = document.createElement('div');
      row.className = 'mus-track' + (t.id===curId && playing ? ' playing' : '') + (t.needsFile ? ' needs-file' : '');
      row.innerHTML =
        '<span class="mus-track-ico">' + (t.id===curId && playing ? '<svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M7 4.6v14.8a1 1 0 0 0 1.5.86l12-7.4a1 1 0 0 0 0-1.72l-12-7.4A1 1 0 0 0 7 4.6Z"/></svg>' : '<svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M18 3.4 8.6 5.7a1 1 0 0 0-.8 1v8.9A3.3 3.3 0 1 0 9.6 18V9.3l7-1.7v5.2A3.3 3.3 0 1 0 18.4 15V4.4a1 1 0 0 0-.4-1Z"/></svg>') + '</span>' +
        '<span class="mus-track-name">' + esc(t.name) + (t.needsFile ? ' <span class="mus-track-warn">re-add file</span>' : '') + '</span>' +
        '<button class="mus-track-loop' + (t.loop ? ' active' : '') + '" title="Loop this track"><svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M7.4 6.2h7.3V3.6l4.8 3.7-4.8 3.7V8.4H7.4a2.6 2.6 0 0 0-2.6 2.6v.8H2.6v-.8a4.8 4.8 0 0 1 4.8-4.8Z"/><path d="M16.6 17.8H9.3v2.6l-4.8-3.7 4.8-3.7v2.6h7.3a2.6 2.6 0 0 0 2.6-2.6v-.8h2.2v.8a4.8 4.8 0 0 1-4.8 4.8Z"/></svg></button>' +
        '<button class="mus-track-del" title="Remove">&#10005;</button>';
      row.addEventListener('click', e=>{
        if(e.target.closest('.mus-track-loop') || e.target.closest('.mus-track-del')) return;
        if(t.needsFile){ fileMusic.click(); return; }
        if(t.id===curId) togglePlay(); else playTrack(t.id, {crossfade:true});
      });
      row.querySelector('.mus-track-loop').addEventListener('click', ()=>{ t.loop=!t.loop; if(t.id===curId) active.loop=t.loop; renderMusic(); });
      row.querySelector('.mus-track-del').addEventListener('click', ()=>{ const wasCur=t.id===curId; if(wasCur) stopMusic(); music=music.filter(x=>x.id!==t.id); if(wasCur) curId=null; renderMusic(); renderNow(); });
      musicList.appendChild(row);
    });
  }

  function renderSfx(){
    sfxGrid.innerHTML = '';
    sfxEmpty.style.display = sfx.length ? 'none' : 'block';
    sfx.forEach(s=>{
      const pad = document.createElement('button');
      pad.type = 'button';
      pad.className = 'mus-sfx' + (s._audio ? ' playing' : '') + (s.needsFile ? ' needs-file' : '');
      pad.innerHTML =
        '<span class="mus-sfx-name">' + esc(s.name) + '</span>' +
        '<span class="mus-sfx-corner">' +
          '<span class="mus-sfx-mini mus-sfx-loop' + (s.loop ? ' active' : '') + '" title="Loop"><svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M7.4 6.2h7.3V3.6l4.8 3.7-4.8 3.7V8.4H7.4a2.6 2.6 0 0 0-2.6 2.6v.8H2.6v-.8a4.8 4.8 0 0 1 4.8-4.8Z"/><path d="M16.6 17.8H9.3v2.6l-4.8-3.7 4.8-3.7v2.6h7.3a2.6 2.6 0 0 0 2.6-2.6v-.8h2.2v.8a4.8 4.8 0 0 1-4.8 4.8Z"/></svg></span>' +
          '<span class="mus-sfx-mini mus-sfx-del" title="Remove">&#10005;</span>' +
        '</span>';
      pad.addEventListener('click', e=>{
        if(e.target.closest('.mus-sfx-loop')){ s.loop=!s.loop; if(!s.loop && s._audio) stopSfx(s); renderSfx(); return; }
        if(e.target.closest('.mus-sfx-del')){ stopSfx(s); sfx=sfx.filter(x=>x.id!==s.id); renderSfx(); return; }
        if(s.needsFile){ fileSfx.click(); return; }
        triggerSfx(s);
      });
      sfxGrid.appendChild(pad);
    });
  }

  // A library track being dragged, if any (data set by the library rows below).
  function libDragData(e){
    try { const raw = e.dataTransfer && e.dataTransfer.getData('application/x-dd-sound'); if(raw) return JSON.parse(raw); } catch(_){}
    return null;
  }
  function wireDrop(section, kind){
    if(!section) return;
    section.addEventListener('dragover', e=>{ e.preventDefault(); section.classList.add('mus-dragover'); });
    section.addEventListener('dragleave', e=>{ if(e.target===section) section.classList.remove('mus-dragover'); });
    section.addEventListener('drop', e=>{
      e.preventDefault(); section.classList.remove('mus-dragover');
      const lib = libDragData(e);
      if(lib && lib.url){ if(kind==='sfx') root._addLibrarySfx(lib.name, lib.url); else root._addLibraryTrack(lib.name, lib.url); if(window.__ddScheduleSave) try{ window.__ddScheduleSave(); }catch(_){} return; }
      if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) addFiles(e.dataTransfer.files, kind);
    });
  }

  playBtn.addEventListener('click', togglePlay);
  prevBtn.addEventListener('click', ()=>advance(-1, false));
  nextBtn.addEventListener('click', ()=>advance(+1, false));
  loopListBtn.addEventListener('click', ()=>{ loopList=!loopList; renderNow(); });
  shuffleBtn.addEventListener('click', ()=>{ shuffle=!shuffle; renderNow(); });
  seek.addEventListener('input', ()=>{ const t=curTrack(); if(t && active.duration){ try{ active.currentTime = (seek.value/1000)*active.duration; }catch(e){} } });
  musicVolEl.addEventListener('input', ()=> setMusicVol(musicVolEl.value/100));
  sfxVolEl.addEventListener('input', ()=> setSfxVol(sfxVolEl.value/100));
  $('.mus-add-music').addEventListener('click', ()=> fileMusic.click());
  $('.mus-add-sfx').addEventListener('click', ()=> fileSfx.click());
  $('.mus-add-music-url').addEventListener('click', ()=> addUrl('music'));
  $('.mus-add-sfx-url').addEventListener('click', ()=> addUrl('sfx'));
  fileMusic.addEventListener('change', ()=>{ addFiles(fileMusic.files, 'music'); fileMusic.value=''; });
  fileSfx.addEventListener('change', ()=>{ addFiles(fileSfx.files, 'sfx'); fileSfx.value=''; });
  if(stopAllBtn) stopAllBtn.addEventListener('click', stopAll);
  wireDrop(musicSection, 'music');
  wireDrop(sfxSection, 'sfx');


  // ── Scenes editor — data + playback live in GMScenes (page-owned) so pinned
  //    scenes keep working when this pane is closed; here we just draw the UI. ──
  const sceneList  = root.querySelector('.mus-scene-list');
  const sceneEmpty = root.querySelector('.mus-scene-empty');
  const sceneVolEl = root.querySelector('.mus-scene-vol');
  const fileScene  = root.querySelector('.mus-file-scene');
  let sceneFileTarget = null;

  function renderScenes(){
    if(!window.GMScenes) return;
    const list = GMScenes.list();
    sceneVolEl.value = Math.round(GMScenes.masterVol()*100);
    sceneList.innerHTML = '';
    sceneEmpty.style.display = list.length ? 'none' : 'block';
    list.forEach(sc=>{
      const playing = GMScenes.isPlaying(sc.id);
      const card = document.createElement('div');
      card.className = 'mus-scene' + (playing ? ' playing' : '');
      card.dataset.sceneId = sc.id; // so the injected Sound Library picker can target this scene
      const tracksHtml = sc.tracks.length ? sc.tracks.map(t=>
        '<div class="mus-scene-track' + (t.needsFile?' needs-file':'') + '" data-tid="'+t.id+'">' +
          '<span class="mus-scene-tname">'+esc(t.name)+(t.needsFile?' <span class="mus-scene-warn">re-add</span>':'')+'</span>' +
          '<button class="mus-scene-tloop'+(t.loop?' active':'')+'" title="Loop this track"><svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M7.4 6.2h7.3V3.6l4.8 3.7-4.8 3.7V8.4H7.4a2.6 2.6 0 0 0-2.6 2.6v.8H2.6v-.8a4.8 4.8 0 0 1 4.8-4.8Z"/><path d="M16.6 17.8H9.3v2.6l-4.8-3.7 4.8-3.7v2.6h7.3a2.6 2.6 0 0 0 2.6-2.6v-.8h2.2v.8a4.8 4.8 0 0 1-4.8 4.8Z"/></svg></button>' +
          '<input type="range" class="mus-scene-tvol" min="0" max="100" value="'+Math.round((typeof t.vol==='number'?t.vol:0.8)*100)+'" title="Track volume">' +
          '<button class="mus-scene-tdel" title="Remove track">&#10005;</button>' +
        '</div>'
      ).join('') : '<div class="mus-scene-empty-tracks">No tracks yet &mdash; add some with <svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M3.5 5.6a1.6 1.6 0 0 1 1.6-1.6h3.8l2 2h6a1.6 1.6 0 0 1 1.6 1.6v1H6.4a1.6 1.6 0 0 0-1.5 1.1L3.5 15Z"/><path d="M6.4 10.2h14.2a1 1 0 0 1 1 1.3l-1.9 6.4a1.6 1.6 0 0 1-1.5 1.1H4.6a1.6 1.6 0 0 1-1.5-2.1l1.8-5.6a1.6 1.6 0 0 1 1.5-1.1Z" opacity=".85"/></svg> or <svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M9.6 12.9a3.4 3.4 0 0 0 5.1.4l2.8-2.8a3.4 3.4 0 0 0-4.8-4.8l-1.6 1.6a.9.9 0 0 0 1.3 1.3l1.6-1.6a1.6 1.6 0 0 1 2.3 2.3l-2.8 2.8a1.6 1.6 0 0 1-2.4-.2.9.9 0 0 0-1.4 1.2Z"/><path d="M14.4 11.1a3.4 3.4 0 0 0-5.1-.4L6.5 13.5a3.4 3.4 0 0 0 4.8 4.8l1.6-1.6a.9.9 0 0 0-1.3-1.3l-1.6 1.6a1.6 1.6 0 0 1-2.3-2.3l2.8-2.8a1.6 1.6 0 0 1 2.4.2.9.9 0 0 0 1.4-1.2Z"/></svg>.</div>';
      card.innerHTML =
        '<div class="mus-scene-head">' +
          '<button class="mus-scene-play" title="Play / stop scene">'+(playing?'<svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><rect x="5.2" y="5.2" width="13.6" height="13.6" rx="2"/></svg>':'<svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M7 4.6v14.8a1 1 0 0 0 1.5.86l12-7.4a1 1 0 0 0 0-1.72l-12-7.4A1 1 0 0 0 7 4.6Z"/></svg>')+'</button>' +
          '<input class="mus-scene-name" value="'+esc(sc.name)+'" placeholder="Scene name...">' +
          '<button class="btn small ghost mus-scene-add" title="Add local audio files" aria-label="Add local audio files"><svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M3.5 5.6a1.6 1.6 0 0 1 1.6-1.6h3.8l2 2h6a1.6 1.6 0 0 1 1.6 1.6v1H6.4a1.6 1.6 0 0 0-1.5 1.1L3.5 15Z"/><path d="M6.4 10.2h14.2a1 1 0 0 1 1 1.3l-1.9 6.4a1.6 1.6 0 0 1-1.5 1.1H4.6a1.6 1.6 0 0 1-1.5-2.1l1.8-5.6a1.6 1.6 0 0 1 1.5-1.1Z" opacity=".85"/></svg></button>' +
          '<button class="btn small ghost mus-scene-add-url" title="Add a direct audio URL" aria-label="Add a direct audio URL"><svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M9.6 12.9a3.4 3.4 0 0 0 5.1.4l2.8-2.8a3.4 3.4 0 0 0-4.8-4.8l-1.6 1.6a.9.9 0 0 0 1.3 1.3l1.6-1.6a1.6 1.6 0 0 1 2.3 2.3l-2.8 2.8a1.6 1.6 0 0 1-2.4-.2.9.9 0 0 0-1.4 1.2Z"/><path d="M14.4 11.1a3.4 3.4 0 0 0-5.1-.4L6.5 13.5a3.4 3.4 0 0 0 4.8 4.8l1.6-1.6a.9.9 0 0 0-1.3-1.3l-1.6 1.6a1.6 1.6 0 0 1-2.3-2.3l2.8-2.8a1.6 1.6 0 0 1 2.4.2.9.9 0 0 0 1.4-1.2Z"/></svg></button>' +
          '<button class="mus-scene-del" title="Delete scene">&#10005;</button>' +
        '</div>' +
        '<div class="mus-scene-tracks">'+tracksHtml+'</div>';
      card.querySelector('.mus-scene-play').addEventListener('click', ()=> GMScenes.toggle(sc.id));
      card.querySelector('.mus-scene-del').addEventListener('click', ()=> GMScenes.removeScene(sc.id));
      card.querySelector('.mus-scene-name').addEventListener('input', e=> GMScenes.renameScene(sc.id, e.target.value));
      card.querySelector('.mus-scene-add').addEventListener('click', ()=>{ sceneFileTarget = sc.id; fileScene.click(); });
      card.querySelector('.mus-scene-add-url').addEventListener('click', ()=>{ (window.ddPromptUrl ? window.ddPromptUrl('Direct audio URL (mp3 / ogg / wav):') : Promise.resolve(prompt('Direct audio URL (mp3 / ogg / wav):'))).then(function(u){ if(u) GMScenes.addTrackUrl(sc.id, u); }); });
      card.querySelectorAll('.mus-scene-track').forEach(row=>{
        const tid = parseInt(row.dataset.tid);
        row.querySelector('.mus-scene-tloop').addEventListener('click', ()=>{ const t = sc.tracks.find(x=>x.id===tid); GMScenes.setTrackLoop(sc.id, tid, !(t && t.loop)); });
        row.querySelector('.mus-scene-tdel').addEventListener('click', ()=> GMScenes.removeTrack(sc.id, tid));
        row.querySelector('.mus-scene-tvol').addEventListener('input', e=> GMScenes.setTrackVol(sc.id, tid, e.target.value/100));
        if(row.classList.contains('needs-file')) row.querySelector('.mus-scene-tname').addEventListener('click', ()=>{ sceneFileTarget = sc.id; fileScene.click(); });
      });
      // Drag audio files straight onto a scene card to add them as tracks
      card.addEventListener('dragover',  e=>{ e.preventDefault(); card.classList.add('mus-dragover'); });
      card.addEventListener('dragleave', e=>{ if(e.target===card) card.classList.remove('mus-dragover'); });
      card.addEventListener('drop', e=>{
        e.preventDefault(); card.classList.remove('mus-dragover');
        const lib = libDragData(e);
        if(lib && lib.url && window.GMScenes && typeof GMScenes.addLibraryTrack==='function'){ GMScenes.addLibraryTrack(sc.id, lib.name, lib.url); if(window.__ddScheduleSave) try{ window.__ddScheduleSave(); }catch(_){} return; }
        if(window.GMScenes && e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length)
          GMScenes.addTrackFiles(sc.id, e.dataTransfer.files);
      });
      sceneList.appendChild(card);
    });
  }

  root.querySelector('.mus-add-scene').addEventListener('click', ()=>{ if(window.GMScenes) GMScenes.addScene(); });
  sceneVolEl.addEventListener('input', ()=>{ if(window.GMScenes) GMScenes.setMasterVol(sceneVolEl.value/100); });
  fileScene.addEventListener('change', ()=>{ if(window.GMScenes && sceneFileTarget!=null) GMScenes.addTrackFiles(sceneFileTarget, fileScene.files); fileScene.value=''; sceneFileTarget=null; });
  if(window.GMScenes) GMScenes.setOnChange(renderScenes);
  renderScenes();


  // ── Collapsible sections (save space when a section isn't in use) ──
  const SECTIONS = [['.mus-music-section','music'], ['.mus-sfx-section','sfx'], ['.mus-scene-section','scenes']];
  let collapsed = { music:false, sfx:false, scenes:false };
  function applyCollapsed(){
    SECTIONS.forEach(([sel,key])=>{
      const sec = root.querySelector(sel); if(!sec) return;
      sec.classList.toggle('collapsed', !!collapsed[key]);
      const tog = sec.querySelector('.mus-sec-toggle');
      if(tog) tog.innerHTML = collapsed[key] ? '&#9656;' : '&#9662;';
    });
  }
  SECTIONS.forEach(([sel,key])=>{
    const sec = root.querySelector(sel); if(!sec) return;
    const toggle = ()=>{ collapsed[key] = !collapsed[key]; applyCollapsed(); };
    const tog = sec.querySelector('.mus-sec-toggle');
    const title = sec.querySelector('.mus-sec-title');
    if(tog) tog.addEventListener('click', toggle);
    if(title) title.addEventListener('click', toggle);
  });
  applyCollapsed();

  // ── Sound Library (docked left column) ──────────────────────────────────
  // Lists the admin Sound Library (/api/sounds) right inside the Music window so
  // there's no popup-on-popup. Rows are draggable onto Music / Soundboard / a
  // Scene, and the play button previews the track before it's added anywhere.
  (function initLibrary(){
    const lib     = root.querySelector('.mus-library');
    const listEl  = root.querySelector('.mus-lib-list');
    const catsEl  = root.querySelector('.mus-lib-cats');
    const subsEl  = root.querySelector('.mus-lib-subs');
    const searchEl= root.querySelector('.mus-lib-search');
    const emptyEl = root.querySelector('.mus-lib-empty');
    const preview = root.querySelector('.mus-lib-preview');
    const toggleBtn = root.querySelector('.mus-lib-toggle');
    const refreshBtn= root.querySelector('.mus-lib-refresh');
    if(!lib || !listEl) return;

    // Canonical display order (mirrors lib/sounds.ts) so chips read tidily.
    const CAT_ORDER = ['Ambiance','Music','Scenes'];
    const SUB_ORDER = ['Civilization','Lairs','Modern','Sci-fi','Ruins','Underground','Wilderness','Epic','Lighthearted','Mysterious','Peaceful','Somber','Tension','Action/Combat'];
    let cache = null, activeCat = '__all__', activeSub = '__all__', query = '', previewUrl = null;

    function orderBy(order, arr){
      const known = order.filter(x=> arr.indexOf(x)>=0);
      const extra = arr.filter(x=> x && order.indexOf(x)<0).sort();
      return known.concat(extra).concat(arr.indexOf('')>=0?['']:[]);
    }
    function topCats(){ const set={}; (cache||[]).forEach(s=> set[s.category||'Music']=1); return orderBy(CAT_ORDER, Object.keys(set)); }
    function subsFor(cat){ const set={}; (cache||[]).forEach(s=>{ if(cat!=='__all__' && (s.category||'Music')!==cat) return; set[s.subcategory||'']=1; }); return orderBy(SUB_ORDER, Object.keys(set)); }
    function chip(label, key, active, attr){ return '<button class="mus-lib-chip'+(active?' active':'')+'" '+attr+'="'+esc(key)+'">'+esc(label)+'</button>'; }

    function renderChips(){
      let html = chip('All','__all__',activeCat==='__all__','data-cat');
      topCats().forEach(c=> html += chip(c,c,activeCat===c,'data-cat'));
      catsEl.innerHTML = html;
      catsEl.querySelectorAll('.mus-lib-chip').forEach(el=> el.addEventListener('click', ()=>{ activeCat=el.getAttribute('data-cat'); activeSub='__all__'; render(); }));
      const subs = subsFor(activeCat);
      if(subs.length<=1){ subsEl.innerHTML=''; return; }
      let sh = chip('All','__all__',activeSub==='__all__','data-sub');
      subs.forEach(s=> sh += chip(s||'Unsorted', s||'__none__', activeSub===(s||'__none__'), 'data-sub'));
      subsEl.innerHTML = sh;
      subsEl.querySelectorAll('.mus-lib-chip').forEach(el=> el.addEventListener('click', ()=>{ activeSub=el.getAttribute('data-sub'); render(); }));
    }

    function stopPreview(){ try{ preview.pause(); }catch(_){} previewUrl=null; listEl.querySelectorAll('.mus-lib-row.playing').forEach(r=> r.classList.remove('playing')); }
    function togglePreview(url, rowEl){
      if(previewUrl===url){ stopPreview(); return; }
      stopPreview();
      try{ preview.src = normUrl(url); preview.play().catch(()=>{}); previewUrl=url; rowEl.classList.add('playing'); }catch(_){}
    }
    if(preview) preview.addEventListener('ended', stopPreview);

    function render(){
      if(!cache) return;
      renderChips();
      if(!cache.length){ listEl.innerHTML=''; emptyEl.style.display='block'; emptyEl.innerHTML='Your Sound Library is empty. <a href="/admin/sounds" target="_blank" rel="noreferrer">Add tracks &rarr;</a>'; return; }
      const items = cache.filter(s=>{
        const cat=s.category||'Music', sub=s.subcategory||'';
        if(activeCat!=='__all__' && cat!==activeCat) return false;
        if(activeSub!=='__all__' && sub!==(activeSub==='__none__'?'':activeSub)) return false;
        if(query && ((s.label||'')+' '+cat+' '+sub).toLowerCase().indexOf(query)<0) return false;
        return true;
      });
      if(!items.length){ listEl.innerHTML=''; emptyEl.style.display='block'; emptyEl.textContent='No tracks match.'; return; }
      emptyEl.style.display='none';
      listEl.innerHTML='';
      items.forEach(s=>{
        const row = document.createElement('div');
        row.className = 'mus-lib-row' + (previewUrl===s.url ? ' playing' : '');
        row.draggable = true;
        const meta = esc(s.category||'Music') + (s.subcategory?' · '+esc(s.subcategory):'');
        row.innerHTML =
          '<button class="mus-lib-play" title="Preview">'+(previewUrl===s.url
            ? '<svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><rect x="5.2" y="5.2" width="13.6" height="13.6" rx="2"/></svg>'
            : '<svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M7 4.6v14.8a1 1 0 0 0 1.5.86l12-7.4a1 1 0 0 0 0-1.72l-12-7.4A1 1 0 0 0 7 4.6Z"/></svg>')+'</button>' +
          '<span class="mus-lib-meta"><div class="mus-lib-name">'+esc(s.label)+'</div><div class="mus-lib-cat">'+meta+'</div></span>' +
          '<span class="mus-lib-grip" title="Drag onto Music, Soundboard, or a Scene">⠿</span>';
        row.querySelector('.mus-lib-play').addEventListener('click', e=>{ e.stopPropagation(); togglePreview(s.url, row); });
        row.addEventListener('dragstart', e=>{ row.classList.add('dragging'); try{ e.dataTransfer.setData('application/x-dd-sound', JSON.stringify({ name:s.label, url:s.url })); e.dataTransfer.effectAllowed='copy'; }catch(_){} });
        row.addEventListener('dragend', ()=> row.classList.remove('dragging'));
        listEl.appendChild(row);
      });
    }

    function load(){
      listEl.innerHTML=''; catsEl.innerHTML=''; subsEl.innerHTML='';
      emptyEl.style.display='block'; emptyEl.textContent='Loading…';
      fetch('/api/sounds',{headers:{'accept':'application/json'}})
        .then(r=> r.json())
        .then(d=>{ cache=(d&&d.sounds)||[]; render(); })
        .catch(()=>{ emptyEl.style.display='block'; emptyEl.textContent='Could not load the library.'; });
    }

    if(searchEl) searchEl.addEventListener('input', ()=>{ query=searchEl.value.trim().toLowerCase(); render(); });
    if(refreshBtn) refreshBtn.addEventListener('click', ()=>{ cache=null; load(); });
    // null = follow the container query (shown when the window is wide enough);
    // 'on'/'off' = explicit user override that wins in either context.
    let libForced = null;
    if(toggleBtn) toggleBtn.addEventListener('click', ()=>{
      if(libForced === null){
        // First click: flip whatever the GM currently sees.
        let visible = false;
        try { visible = root.ownerDocument.defaultView.getComputedStyle(lib).display !== 'none'; } catch(_){}
        libForced = visible ? 'off' : 'on';
      } else {
        libForced = libForced === 'off' ? 'on' : 'off';
      }
      lib.classList.toggle('mus-lib-hidden', libForced==='off');
      lib.classList.toggle('mus-lib-shown', libForced==='on');
      toggleBtn.classList.toggle('active', libForced!=='off');
    });
    // Load once the library becomes visible (avoids a needless fetch in tiny
    // free-mode windows where it's hidden), but always load on first open.
    load();
  })();

  root._getState = () => ({
    music: music.map(t=>({ name:t.name, url:isHttp(t.url)?t.url:null, loop:!!t.loop, vol:(typeof t.vol==='number'?t.vol:1) })),
    sfx:   sfx.map(t=>({ name:t.name, url:isHttp(t.url)?t.url:null, loop:!!t.loop, vol:(typeof t.vol==='number'?t.vol:1) })),
    musicVol, sfxVol, loopList, shuffle, collapsed: Object.assign({}, collapsed)
  });
  root._setState = (s) => {
    if(!s) return;
    stopAll();
    music = (s.music||[]).map(t=>({ id:nextId++, name:t.name||'Track', url:isHttp(t.url)?normUrl(t.url):null, loop:!!t.loop, vol:(typeof t.vol==='number'?t.vol:1), needsFile: !isHttp(t.url) }));
    sfx   = (s.sfx||[]).map(t=>({ id:nextId++, name:t.name||'SFX', url:isHttp(t.url)?normUrl(t.url):null, loop:!!t.loop, vol:(typeof t.vol==='number'?t.vol:1), needsFile: !isHttp(t.url) }));
    musicVol = (typeof s.musicVol==='number') ? s.musicVol : 0.8;
    sfxVol   = (typeof s.sfxVol==='number') ? s.sfxVol : 0.9;
    loopList = s.loopList !== false;
    shuffle  = !!s.shuffle;
    collapsed = Object.assign({ music:false, sfx:false, scenes:false }, s.collapsed || {});
    curId = null; playing = false;
    musicVolEl.value = Math.round(musicVol*100);
    sfxVolEl.value = Math.round(sfxVol*100);
    renderMusic(); renderSfx(); renderNow(); applyCollapsed();
  };

  // ── Sound Library hooks ─────────────────────────────────────────────────
  // The app wraps this page (app/gm-screen/route.ts) and injects a "Library"
  // picker into the Music + Soundboard section headers. When the GM picks a
  // saved track the picker calls these to drop it straight into the Music list
  // or the Soundboard — same handling as addUrl() (normalize + http-only) but
  // keeping the library's label rather than deriving a name. Returns true if the
  // track was added.
  root._addLibraryTrack = (name, url) => {
    const clean = normUrl(String(url || '').trim());
    if(!isHttp(clean)) return false;
    music.push({ id:nextId++, name:(name && String(name).trim()) || 'Track', url:clean, loop:false, vol:1, needsFile:false });
    renderMusic();
    return true;
  };
  root._addLibrarySfx = (name, url) => {
    const clean = normUrl(String(url || '').trim());
    if(!isHttp(clean)) return false;
    sfx.push({ id:nextId++, name:(name && String(name).trim()) || 'SFX', url:clean, loop:false, vol:1, needsFile:false });
    renderSfx();
    return true;
  };

  musicVolEl.value = Math.round(musicVol*100);
  sfxVolEl.value = Math.round(sfxVol*100);
  renderMusic(); renderSfx(); renderNow();
}
</script>

<script>
// ══════════════════════════════════════════
// NOTES TOOL — rich text with H1 / H2 / Bold
// ══════════════════════════════════════════
function init_notes(root) {
  const editor = root.querySelector('.nts-editor');
  const rawArea = root.querySelector('.nts-raw');
  const mdToggle = root.querySelector('.nts-md-toggle');
  const exportBtn = root.querySelector('.nts-export');
  const importInput = root.querySelector('.nts-import-input');
  const clearBtn = root.querySelector('.nts-clear');
  const savedIndicator = root.querySelector('.nts-saved-indicator');

  if(!editor.innerHTML.trim()) editor.innerHTML = '<p><br></p>';

  let mdMode = false;

  // ── Tabs ──
  const tabBar = root.querySelector('.nts-tabs');
  let tabs = [{ name: 'Notes', md: '' }];
  let activeTab = 0;

  function currentMd() { return mdMode ? rawArea.value : domToMd(editor); }
  function saveActiveTab() { if(tabs[activeTab]) tabs[activeTab].md = currentMd(); }
  function loadActiveTab() {
    const md = (tabs[activeTab] && tabs[activeTab].md) || '';
    editor.innerHTML = md ? mdToDom(md) : '<p><br></p>';
    rawArea.value = md;
  }
  function switchTab(i) {
    if(i === activeTab) return;
    saveActiveTab();
    activeTab = i;
    loadActiveTab();
    renderTabs();
  }
  function renderTabs() {
    tabBar.innerHTML = '';
    tabs.forEach((t, i) => {
      const el = document.createElement('div');
      el.className = 'nts-tab' + (i === activeTab ? ' active' : '');
      const label = document.createElement('span');
      label.textContent = t.name || 'Untitled';
      if(i === activeTab) {
        // Active tab name is editable in place
        el.title = 'Click name to edit';
        label.contentEditable = 'true';
        label.spellcheck = false;
        label.style.outline = 'none';
        label.style.minWidth = '20px';
        label.style.display = 'inline-block';
        label.addEventListener('click', e => e.stopPropagation());
        label.addEventListener('input', () => { t.name = label.textContent; });
        label.addEventListener('keydown', e => {
          if(e.key === 'Enter') { e.preventDefault(); label.blur(); }
        });
        label.addEventListener('blur', () => {
          t.name = label.textContent.trim() || 'Untitled';
          renderTabs();
        });
      }
      el.appendChild(label);
      if(tabs.length > 1) {
        const x = document.createElement('span');
        x.className = 'nts-tab-x';
        x.textContent = '✕';
        x.title = 'Close tab';
        x.onclick = (e) => {
          e.stopPropagation();
          const hasContent = (i === activeTab ? currentMd() : (t.md || '')).trim();
          if(hasContent && !confirm('Close tab "' + (t.name||'Untitled') + '"? Its notes will be deleted.')) return;
          const wasActive = (i === activeTab);
          tabs.splice(i, 1);
          if(i < activeTab) activeTab--;
          if(activeTab >= tabs.length) activeTab = tabs.length - 1;
          if(wasActive) loadActiveTab();
          renderTabs();
        };
        el.appendChild(x);
      }
      el.onclick = () => switchTab(i);
      tabBar.appendChild(el);
    });
    const add = document.createElement('button');
    add.className = 'nts-tab-add';
    add.textContent = '+';
    add.title = 'New tab';
    add.onclick = () => {
      saveActiveTab();
      tabs.push({ name: 'Tab ' + (tabs.length + 1), md: '' });
      activeTab = tabs.length - 1;
      loadActiveTab();
      renderTabs();
    };
    tabBar.appendChild(add);
  }
  renderTabs();

  mdToggle.addEventListener('click', () => {
    mdMode = !mdMode;
    mdToggle.classList.toggle('active', mdMode);
    if(mdMode) {
      // Switch to raw MD view: convert DOM → markdown
      rawArea.value = domToMd(editor);
      editor.style.display = 'none';
      rawArea.style.display = 'flex';
      rawArea.style.flex = '1';
      rawArea.focus();
    } else {
      // Switch back to preview: parse markdown → DOM
      editor.innerHTML = mdToDom(rawArea.value);
      rawArea.style.display = 'none';
      editor.style.display = '';
      editor.focus();
    }
  });

  // ── Helpers ──
  function getSelection() { return window.getSelection(); }
  function getCursorBlock() {
    const sel = getSelection();
    if(!sel.rangeCount) return null;
    let node = sel.getRangeAt(0).startContainer;
    while(node && node !== editor) {
      if(node.parentNode === editor) return node;
      node = node.parentNode;
    }
    return null;
  }
  function setCursorAtEnd(el) {
    const range = document.createRange();
    const sel = getSelection();
    range.selectNodeContents(el);
    range.collapse(false);
    sel.removeAllRanges();
    sel.addRange(range);
  }
  function setCursorAtStart(el) {
    const range = document.createRange();
    const sel = getSelection();
    range.setStart(el, 0);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // ── Inline markdown: convert **bold**, *italic*, `code` ──
  // Called after the closing delimiter is typed. Replaces block content
  // and places cursor in a fresh text node AFTER the inline element.
  function applyInline(block) {
    let text = '';
    block.childNodes.forEach(n => {
      if(n.nodeType === 3) text += n.textContent;
      else if(n.nodeName === 'STRONG') text += '**' + n.textContent + '**';
      else if(n.nodeName === 'EM') text += '*' + n.textContent + '*';
      else if(n.nodeName === 'CODE') text += '`' + n.textContent + '`';
      else text += n.textContent;
    });

    const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    // Only replace if something actually changes
    const rendered = esc(text)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(?<!\*)\*(.+?)\*(?!\*)/g, '<em>$1</em>')
      .replace(/`(.+?)`/g, '<code>$1</code>');
    if(rendered === esc(text)) return; // nothing to convert

    // Rebuild the block — append a trailing plain text node so the cursor
    // lands outside the inline element, not inside it
    block.innerHTML = rendered;
    const trail = document.createTextNode('\u200B'); // zero-width space as anchor
    block.appendChild(trail);
    const range = document.createRange();
    const sel = getSelection();
    range.setStartAfter(trail);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // ── Block-level conversion: triggered on Enter for heading/quote prefixes ──
  function tryBlockConvert(block) {
    const text = block.textContent.replace(/\u200B/g, ''); // strip zero-width spaces
    let newTag = null, newText = null;

    if(/^# (.+)/.test(text))        { newTag = 'h1'; newText = text.slice(2).trim(); }
    else if(/^## (.+)/.test(text))  { newTag = 'h2'; newText = text.slice(3).trim(); }
    else if(/^### (.+)/.test(text)) { newTag = 'h3'; newText = text.slice(4).trim(); }
    else if(/^> (.*)/.test(text))   { newTag = 'blockquote'; newText = text.slice(2).trim(); }
    else if(/^[-*] (.*)/.test(text)){ newTag = 'li-ul'; newText = text.replace(/^[-*] /,'').trim(); }
    else if(/^---+$/.test(text.trim())) { newTag = 'hr'; newText = ''; }

    if(!newTag) return false;

    const newEl = document.createElement(newTag === 'li-ul' ? 'li' : (newTag === 'hr' ? 'hr' : newTag));

    if(newTag === 'hr') {
      editor.insertBefore(newEl, block);
      const p = document.createElement('p'); p.innerHTML = '<br>';
      editor.insertBefore(p, block);
      block.remove();
      setCursorAtStart(p);
    } else if(newTag === 'li-ul') {
      const prev = block.previousSibling;
      let ul = (prev && prev.nodeName === 'UL') ? prev : null;
      if(!ul) { ul = document.createElement('ul'); editor.insertBefore(ul, block); }
      newEl.innerHTML = newText || '<br>';
      ul.appendChild(newEl);
      block.remove();
      setCursorAtEnd(newEl);
    } else {
      newEl.innerHTML = newText || '<br>';
      editor.insertBefore(newEl, block);
      block.remove();
      setCursorAtEnd(newEl);
    }
    return true;
  }

  // ── Enter key handler ──
  editor.addEventListener('keydown', e => {
    if(e.key === 'Enter') {
      const block = getCursorBlock();
      if(!block) return;
      const tag = block.nodeName;
      const text = block.textContent.replace(/\u200B/g,'');

      // If current block has a heading/blockquote prefix → convert it first, then make new para
      if(tag === 'P' || tag === 'DIV') {
        if(/^#{1,3} .+/.test(text) || /^> /.test(text) || /^[-*] /.test(text) || /^---+$/.test(text.trim())) {
          e.preventDefault();
          const converted = tryBlockConvert(block);
          if(converted) {
            // After conversion, the new block is already focused — add a paragraph after it
            const focused = getCursorBlock();
            if(focused && focused.nodeName !== 'P') {
              const p = document.createElement('p'); p.innerHTML = '<br>';
              focused.after(p);
              setCursorAtStart(p);
            }
          }
          return;
        }
      }

      // Headings/blockquotes already converted → Enter exits to new paragraph
      if(['H1','H2','H3','BLOCKQUOTE'].includes(tag)) {
        e.preventDefault();
        const p = document.createElement('p'); p.innerHTML = '<br>';
        block.after(p);
        setCursorAtStart(p);
        return;
      }

      // Empty list item → exit list
      if(tag === 'LI' && !text.trim()) {
        e.preventDefault();
        const ul = block.closest('ul,ol');
        const p = document.createElement('p'); p.innerHTML = '<br>';
        ul.after(p);
        block.remove();
        if(!ul.children.length) ul.remove();
        setCursorAtStart(p);
      }
    }

    // Backspace at start of heading → back to paragraph
    if(e.key === 'Backspace') {
      const sel = getSelection();
      if(!sel.rangeCount) return;
      const range = sel.getRangeAt(0);
      const block = getCursorBlock();
      if(!block) return;
      const tag = block.nodeName;
      if(['H1','H2','H3','BLOCKQUOTE'].includes(tag) && range.startOffset === 0 && range.collapsed) {
        e.preventDefault();
        const p = document.createElement('p');
        p.innerHTML = block.innerHTML || '<br>';
        editor.insertBefore(p, block);
        block.remove();
        setCursorAtStart(p);
      }
    }
  });

  // ── Input handler: inline markdown only ──
  editor.addEventListener('input', () => {
    if(!editor.innerHTML.trim() || editor.innerHTML === '<br>') {
      editor.innerHTML = '<p><br></p>';
    }
    const block = getCursorBlock();
    if(block && block.nodeType === 1) {
      const text = block.textContent.replace(/\u200B/g,'');
      // Inline conversion: fire when a closing delimiter is completed
      const hasBold   = (text.match(/\*\*/g)||[]).length >= 2;
      const hasItalic = (text.match(/(?<!\*)\*(?!\*)/g)||[]).length >= 2;
      const hasCode   = (text.match(/`/g)||[]).length >= 2;
      if(hasBold || hasItalic || hasCode) applyInline(block);
    }
    flashSaved();
  });

  let saveTimeout;
  function flashSaved() {
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
      savedIndicator.textContent = '✓ Up to date';
      savedIndicator.classList.add('show');
      setTimeout(() => savedIndicator.classList.remove('show'), 1500);
    }, 800);
  }

  // ── Export: walk DOM → Markdown ──
  function domToMd(el) {
    let md = '';
    el.childNodes.forEach(node => {
      if(node.nodeType === 3) { md += node.textContent; return; }
      const t = node.nodeName;
      const inner = node.textContent;
      if(t === 'H1') md += '# ' + inner + '\n\n';
      else if(t === 'H2') md += '## ' + inner + '\n\n';
      else if(t === 'H3') md += '### ' + inner + '\n\n';
      else if(t === 'BLOCKQUOTE') md += '> ' + inner + '\n\n';
      else if(t === 'HR') md += '---\n\n';
      else if(t === 'UL') { node.querySelectorAll('li').forEach(li => { md += '- ' + li.textContent + '\n'; }); md += '\n'; }
      else if(t === 'OL') { let i=1; node.querySelectorAll('li').forEach(li => { md += (i++) + '. ' + li.textContent + '\n'; }); md += '\n'; }
      else if(t === 'P' || t === 'DIV') {
        // Inline: reconstruct with markdown markers
        let line = '';
        node.childNodes.forEach(c => {
          if(c.nodeType === 3) line += c.textContent;
          else if(c.nodeName === 'STRONG') line += '**' + c.textContent + '**';
          else if(c.nodeName === 'EM') line += '*' + c.textContent + '*';
          else if(c.nodeName === 'CODE') line += '`' + c.textContent + '`';
          else line += c.textContent;
        });
        if(line.trim()) md += line + '\n\n';
      }
    });
    return md.trim();
  }

  // ── Import: Markdown → DOM ──
  function mdToDom(md) {
    const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const inline = s => esc(s)
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,'<em>$1</em>')
      .replace(/`(.+?)`/g,'<code>$1</code>');
    let html = '';
    const lines = md.split('\n');
    let ulOpen = false;
    const closeUl = () => { if(ulOpen){ html += '</ul>'; ulOpen = false; } };
    lines.forEach(line => {
      if(/^# (.+)/.test(line))       { closeUl(); html += `<h1>${inline(line.slice(2))}</h1>`; }
      else if(/^## (.+)/.test(line)) { closeUl(); html += `<h2>${inline(line.slice(3))}</h2>`; }
      else if(/^### (.+)/.test(line)){ closeUl(); html += `<h3>${inline(line.slice(4))}</h3>`; }
      else if(/^> (.*)/.test(line))  { closeUl(); html += `<blockquote>${inline(line.slice(2))}</blockquote>`; }
      else if(/^---+$/.test(line.trim())){ closeUl(); html += '<hr>'; }
      else if(/^[-*] (.+)/.test(line)){ if(!ulOpen){html+='<ul>';ulOpen=true;} html += `<li>${inline(line.replace(/^[-*] /,''))}</li>`; }
      else if(line.trim() === '')    { closeUl(); html += '<p><br></p>'; }
      else                           { closeUl(); html += `<p>${inline(line)}</p>`; }
    });
    closeUl();
    return html || '<p><br></p>';
  }

  exportBtn.addEventListener('click', () => {
    const md = mdMode ? rawArea.value.trim() : domToMd(editor);
    if(!md) { alert('No notes to export yet.'); return; }
    const blob = new Blob([md], {type: 'text/markdown'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `session_notes_${new Date().toISOString().slice(0,10)}.md`; a.click();
    URL.revokeObjectURL(url);
  });

  if(importInput) {
    importInput.addEventListener('change', () => {
      const file = importInput.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const hasContent = mdMode ? rawArea.value.trim() : editor.textContent.trim();
        if(hasContent && !confirm('Replace current notes with imported content?')) { importInput.value=''; return; }
        if(mdMode) {
          rawArea.value = e.target.result;
        } else {
          editor.innerHTML = mdToDom(e.target.result);
        }
        importInput.value = '';
      };
      reader.readAsText(file);
    });
  }

  clearBtn.addEventListener('click', () => {
    const hasContent = mdMode ? rawArea.value.trim() : editor.textContent.trim();
    if(!hasContent) return;
    if(confirm('Clear all session notes? This cannot be undone.')) {
      editor.innerHTML = '<p><br></p>';
      rawArea.value = '';
      if(mdMode) { rawArea.style.display='flex'; rawArea.style.flex='1'; }
    }
  });

  // ── State: store as Markdown ──
  root._getState = () => {
    saveActiveTab();
    return { tabs: tabs.map(t => ({ name: t.name, md: t.md })), active: activeTab };
  };
  root._setState = (s) => {
    if(!s) return;
    if(Array.isArray(s.tabs) && s.tabs.length) {
      tabs = s.tabs.map(t => ({ name: t.name || 'Notes', md: t.md || '' }));
      activeTab = Math.min(s.active || 0, tabs.length - 1);
    } else if(s.md !== undefined) {
      tabs = [{ name: 'Notes', md: s.md }];
      activeTab = 0;
    } else if(s.html) {
      editor.innerHTML = s.html;
      tabs = [{ name: 'Notes', md: domToMd(editor) }];
      activeTab = 0;
    }
    loadActiveTab();
    renderTabs();
  };
}
</script>


<script>
// All init_* functions are now defined — safe to render the first pane.
// Also bust bfcache so mobile browsers don't restore stale state.
window.addEventListener('pageshow', function(e) {
  if(e.persisted) window.location.reload();
});
// Initial layout. Deferred to DOMContentLoaded so every init_<tool> (some defined
// in later script blocks) exists before stations mount. Default view is the
// CONSOLE in Master mode (Explore/Combat/Master are the only modes now).
function gmBootstrapWindows() {
  // Don't override a layout the server shim already restored (mode/view/stations).
  if(!gmcRestored) renderConsole('master');
  // Pre-create the Party instance so its campaign sync runs and the monitor-bar
  // party bubbles populate even before the GM opens the Party drawer. The same
  // instance is reused when they tap "Message"/Party.
  try { gmcPopNodes['party'] = gmcPopNodes['party'] || buildToolNode('party'); } catch(e) {}
  try { gmcPopNodes['timers'] = gmcPopNodes['timers'] || buildToolNode('timers'); } catch(e) {}
  try { renderPartyStrip(); renderTimers(); renderScenes(); } catch(e) {}
  try { wireScenes(); } catch(e) {}
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', gmBootstrapWindows);
else gmBootstrapWindows();

// ══════════════════════════════════════════
// SESSION SAVE / LOAD
// Collects state from all live tool instances and writes to a JSON file.
// On load, restores state into each instance (creating them first if needed).
// Note: Loaded media (PDFs, images) cannot be saved — only text/data state.
// ══════════════════════════════════════════
// Serialize the window layout + each window's per-tool state.
function serializeWindows() {
  return gmWindows.map(w => {
    const cache = gmNodes[w.id];
    const tools = {};
    if(cache) Object.entries(cache.byTool).forEach(([t, node]) => {
      if(node._getState) { try { tools[t] = node._getState(); } catch(e) {} }
    });
    return { tool: w.tool, tools };
  });
}

// Rebuild the windows from a saved payload. Understands both the new
// { windows:[...] } shape and legacy { paneTools, splitMode, tools } saves.
function restoreWindows(data) {
  let wins = null;
  if(Array.isArray(data.windows) && data.windows.length) {
    wins = data.windows.map(w => ({ tool: normalizeTool(w.tool || 'adventure'), tools: w.tools || {} }));
  } else if(data.paneTools) {
    const n = data.splitMode || 1;
    const byType = data.tools ? (migrateToolState(data.tools), data.tools) : {};
    wins = [];
    for(let p = 1; p <= n; p++) {
      const t = normalizeTool(data.paneTools[p]);
      if(!t) continue;
      const st = {}; if(byType[t] != null) st[t] = byType[t];
      wins.push({ tool: t, tools: st });
    }
    if(!wins.length) wins = null;
  }
  if(!wins) return false;
  if(wins.length > MAX_WINDOWS) wins = wins.slice(0, MAX_WINDOWS);

  // Tear down current windows/nodes
  Object.keys(gmNodes).forEach(id => {
    Object.values(gmNodes[id].byTool).forEach(node => { if(node.parentElement) node.parentElement.removeChild(node); });
    delete gmNodes[id];
  });
  gmWindows = [];

  wins.forEach(w => {
    const id = newWinId();
    gmWindows.push({ id, tool: w.tool });
    Object.entries(w.tools || {}).forEach(([t, state]) => {
      const node = getWinNode(id, t);
      if(node._setState) { try { node._setState(state); } catch(e) { console.warn('setState failed for', t, e); } }
    });
    getWinNode(id, w.tool);   // ensure the active tool exists even with no saved state
  });
  renderWindows();
  return true;
}

function saveSession() {
  const data = {
    version: 1,
    saved: new Date().toISOString(),
    windows: serializeWindows(),
    console: serializeConsole(),
    popups: serializePopups(),
    campaign: GMCamp.serialize(),   // the link lives in the top bar, not in a tool
    scenes: (window.GMScenes ? GMScenes.serialize() : undefined),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `dungeon_desk_session_${stamp}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function loadSession(input) {
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if(!data.version) throw new Error('Unrecognised file');
      if(data.campaign) GMCamp.restore(data.campaign);
      if(data.scenes && window.GMScenes) GMScenes.restore(data.scenes);
      restoreWindows(data);
      restoreConsole(data.console);
      restorePopups(data.popups);
    } catch(err) {
      alert('Could not load session file: ' + err.message);
    }
    input.value = ''; // reset so the same file can be loaded again
  };
  reader.readAsText(file);
}

// ── Server persistence hooks (used by the injected shim when running on Dungeon Crawler's Companion) ──
// Console state: the active mode, auto-combat flag, and each station's tool
// states (tracker, notes, the VTT room URL, …) so a reload comes back where you left.
function serializeConsole() {
  const stations = {};
  CONSOLE_STATIONS.forEach(st => {
    const cache = gmNodes['cst-' + st];
    if(!cache) return;
    const tools = {};
    Object.entries(cache.byTool).forEach(([t, node]) => {
      if(node._getState) { try { tools[t] = node._getState(); } catch(e) {} }
    });
    stations[st] = { tool: cache.active, tools };
  });
  return { view: document.body.dataset.cview || 'console', mode: consoleMode, auto: gmcAutoCombat, stations };
}
function restoreConsole(c) {
  gmcRestored = true;
  if(!c) { renderConsole('master'); return; }
  // Restore each tool's saved state into its NEW home station, regardless of
  // which (possibly older-scheme) station it was saved under. Only the four
  // fixed console tools carry over; everything else lives in popups now.
  const TOOL_STATION = { adventure:'adv', maps:'map', vtt:'map', trackers:'cbt', dice:'log' };
  Object.values(c.stations || {}).forEach(conf => {
    if(!conf) return;
    Object.entries(conf.tools || {}).forEach(([t, state]) => {
      const tool = normalizeTool(t);
      const st = TOOL_STATION[tool];
      if(!st) return;
      const node = getWinNode('cst-' + st, tool);
      if(node._setState) { try { node._setState(state); } catch(e) {} }
    });
  });
  if(typeof c.auto === 'boolean') gmcAutoCombat = c.auto;
  // Free & Prep were retired; any saved 'free' view or 'prep' mode restores as Master.
  const mode = CONSOLE_MODES[c.mode] ? c.mode : 'master';
  renderConsole(mode);
}

// Quick-tool popups (Timers, Notes, …) live outside the stations, so serialize
// their instances separately — Timers clocks and session Notes must survive a reload.
const PERSIST_POPUPS = ['timers','notes','message','rules','gen'];
function serializePopups() {
  const out = {};
  PERSIST_POPUPS.forEach(t => {
    const n = gmcPopNodes[t];
    if(n && n._getState) { try { out[t] = n._getState(); } catch(e) {} }
  });
  return out;
}
function restorePopups(p) {
  if(!p) return;
  Object.entries(p).forEach(([t, state]) => {
    try { if(!gmcPopNodes[t]) gmcPopNodes[t] = buildToolNode(t); if(gmcPopNodes[t] && gmcPopNodes[t]._setState) gmcPopNodes[t]._setState(state); } catch(e) {}
  });
  try { renderTimers(); } catch(e) {}
}

window.__gmScreenGetState = function() {
  return {
    version: 1,
    windows: serializeWindows(),
    console: serializeConsole(),
    popups: serializePopups(),
    campaign: GMCamp.serialize(),
    scenes: (window.GMScenes ? GMScenes.serialize() : undefined),
  };
};

window.__gmScreenSetState = function(data) {
  if(!data || !data.version) return;
  if(data.campaign) GMCamp.restore(data.campaign);
  if(data.scenes && window.GMScenes) GMScenes.restore(data.scenes);
  restoreWindows(data);        // rebuilds Free-mode windows (clears gmNodes first)
  restoreConsole(data.console); // then station instances + the active view/mode
  restorePopups(data.popups);   // Timers / Notes / … quick-tool state
};


// Persistence is handled by the server shim injected in app/gm-screen/route.ts:
// it restores state on load via __gmScreenSetState and saves via __ddScheduleSave
// (PATCH /api/gm-screen) + beforeunload. The view-mode / pane-tool changes below
// call __ddScheduleSave so those edits are captured too.
// Trigger auto-save whenever Next Round is clicked or notes are edited.
// One shared debounced timer — previously every keystroke queued its own
// setTimeout (typing 200 characters queued 200 timers and 200 saves).
var _ddSaveTimer = null;
function ddQueueSave(delay) {
  if(!window.__ddScheduleSave) return;
  if(_ddSaveTimer) clearTimeout(_ddSaveTimer);
  _ddSaveTimer = setTimeout(function() { _ddSaveTimer = null; window.__ddScheduleSave(); }, delay);
}
document.addEventListener('click', function(e) {
  if(e.target.closest('.cbt-next-round, .cbt-reset, .cbt-add-tracker, .cbt-add-npc, .nts-clear')) {
    ddQueueSave(300);
  }
});
document.addEventListener('input', function(e) {
  if(e.target.closest('.nts-editor, .tracker-name-input, .npc-name-input, .npc-hp-input, .npc-seg-count-input, .npc-seg-hp-input')) {
    ddQueueSave(1000);
  }
});

// ── CREATURE TYPES ─────────────────────────────────────────────────────────
// Shadowdark stat blocks carry no creature type, so this mapping is a curated
// editorial call rather than rulebook data. It lives here, beside SD_MONSTERS,
// because this file is the source both the GM screen's Type filter and the
// app's /bestiary filter read from — the latter via lib/data/monster-types.ts,

//  - Constructs (Animated Armor, Gargoyle, Cobra Statue) and oozes (Black

//  - Djinni, Efreeti, Salamander and Invisible Stalker are Elemental.
//  - Cyclops and Frost Troll are Giant (giant-kin), as with Ogre and Troll.

// Anything unclassified still shows up in the list and in search — it just
// falls into the catch-all rather than vanishing.
function monsterTypeOf(name) {
  const hb = _homebrewMonsters.find(m => m.name === name);
  if(hb && hb.ctype) return hb.ctype;
  return SD_MONSTER_TYPES[name] || 'Monster';
}

// ── Homebrew monsters ─────────────────────────────────────────────────────
// Created on the Bestiary page and pulled in from the account: personal ones,
// plus anything shared with the campaign this screen is linked to. They join
// the same pool the book monsters use, so the generator, the tracker's picker
// and the adventure builder all see them with no special casing.
let _homebrewMonsters = [];

// Book bestiary + homebrew. Use this anywhere a monster can be picked or rolled.
// Cached — this gets called inside per-type filters and per-keystroke picker
// search, and the ~350-entry merge only changes when homebrew re-syncs.
let _allMonstersCache = null;
function allMonsters() {
  return _allMonstersCache || (_allMonstersCache = SD_MONSTERS.concat(_homebrewMonsters));
}

async function syncHomebrewMonsters() {
  let url = '/api/homebrew?type=monster';
  try {
    const camp = (typeof GMCamp !== 'undefined') ? GMCamp.get() : null;
    if(camp && camp.id) url += '&campaign=' + encodeURIComponent(camp.id);
  } catch(e) {}
  let rows;
  try {
    const r = await fetch(url, { credentials: 'same-origin' });
    if(!r.ok) return;
    const data = await r.json();
    rows = Array.isArray(data.items) ? data.items : [];
  } catch(e) { return; }

  const seen = new Set();
  const next = [];
  rows.forEach(row => {
    if(!row || row.type !== 'monster' || !row.data) return;
    const d = row.data;
    const nm = String(d.name || '').trim();
    if(!nm || seen.has(nm.toLowerCase())) return;
    seen.add(nm.toLowerCase());
    next.push({
      name: nm,
      ac: String(d.ac || ''), hp: String(d.hp || ''), atk: String(d.atk || ''),
      mv: String(d.mv || ''), lv: String(d.lv || ''), al: String(d.al || ''),
      s: String(d.s || ''), d: String(d.d || ''), c: String(d.c || ''),
      i: String(d.i || ''), w: String(d.w || ''), ch: String(d.ch || ''),
      notes: String(d.notes || ''),
      ctype: String(d.ctype || 'Monster'),
      homebrew: true
    });
  });
  _homebrewMonsters = next;
  _allMonstersCache = null;   // merged array is cached — see allMonsters()

  // Refresh anything already on screen that lists monsters.
  try { if(typeof window._refreshMonsterConsumers === 'function') window._refreshMonsterConsumers(); } catch(e) {}
}

// Re-fetch when the campaign link changes, so a GM's shared monsters appear
// for players' screens (and disappear again on leaving).
try { GMCamp.onChange(() => { syncHomebrewMonsters(); }); } catch(e) {}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', syncHomebrewMonsters);
else syncHomebrewMonsters();
