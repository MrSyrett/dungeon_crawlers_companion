.console-workspace{position:relative;flex:1;display:flex;min-height:0;overflow:hidden}
.cstation{display:flex;flex-direction:column;overflow:hidden;min-height:0;background:var(--black);border-right:2px solid var(--border);transition:flex-basis .3s cubic-bezier(.4,0,.2,1),opacity .25s;flex:0 0 auto}
.cstation:last-child{border-right:none}
.cstation.collapsed{flex:0 0 0!important;min-width:0!important;opacity:0;border-width:0!important;pointer-events:none;overflow:hidden}
#cst-adv{flex:0 0 auto;flex-basis:540px}
#cst-center{flex:1 1 auto;flex-basis:auto}
/* Roll Log runs the full page height on the right; command bar meets its left edge. */
.cst-log-rail{flex:0 0 300px;border-right:none;border-left:2px solid var(--border)}
.cst-log-rail.collapsed{border-width:0!important}
body[data-cview="free"] .cst-log-rail{display:none}
.cstation-center{padding:0}
.csub{display:flex;flex-direction:column;min-height:0;flex:1 1 0;border-bottom:2px solid var(--border);overflow:hidden;transition:flex .3s,opacity .25s}
.csub:last-child{border-bottom:none}
.csub.collapsed{flex:0 0 0!important;opacity:0;border-width:0!important;pointer-events:none;overflow:hidden}

.cst-head{display:flex;align-items:center;gap:8px;padding:7px 10px;background:linear-gradient(180deg,#20242c,#171a20);border-bottom:1px solid var(--border);box-shadow:0 1px 0 rgba(36,211,238,.3);flex-shrink:0;position:relative}
.cst-head::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent-2) 60%,transparent);opacity:.5;pointer-events:none}
.cst-tick{width:15px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent-2));flex-shrink:0}
.cst-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--white);white-space:nowrap}
.cst-toolbar{margin-left:auto;display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
.cst-content{flex:1;min-height:0;display:flex;position:relative;overflow:hidden}

/* ── ZONE 3: Bottom Command bar — modes + quick tools + dice ── */
.bottom-bar{flex-shrink:0;display:flex;align-items:stretch;min-height:58px;background:linear-gradient(180deg,#101319,#0a0c10);border-top:2px solid var(--border);box-shadow:0 -2px 0 rgba(36,211,238,.25),0 -6px 16px rgba(0,0,0,.4);position:relative;z-index:5}
.bb-modes{display:flex;align-items:stretch;border-right:1px solid var(--border);flex-shrink:0}
.cmode-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 16px;cursor:pointer;border:none;border-right:1px solid var(--border);background:transparent;position:relative;transition:background .15s;min-width:78px}
.cmode-tab:hover{background:rgba(36,211,238,.05)}
.cm-ico{font-size:14px;line-height:1;color:var(--muted);transition:color .15s}
.cm-name{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);transition:color .15s}
.cmode-tab.active .cm-ico,.cmode-tab.active .cm-name{color:var(--accent)}
.cmode-tab.active{background:linear-gradient(180deg,rgba(36,211,238,.1),transparent)}
.cmode-tab.active::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 0 10px var(--glow)}
.bb-quick{flex:1;display:flex;align-items:center;gap:8px;padding:0 14px;overflow-x:auto}
.bb-lbl{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:7.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:2px;white-space:nowrap;flex-shrink:0}
.qbtn{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:9px;background:var(--panel-2);border:1px solid var(--border);color:var(--light);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:11px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;cursor:pointer;flex-shrink:0}
.qbtn:hover{border-color:var(--accent-dim);background:rgba(36,211,238,.08);color:var(--white)}
.qbtn .qi{font-size:14px}
.bb-dice{display:flex;align-items:center;gap:5px;padding:0 14px;border-left:1px solid var(--border);flex-shrink:0}
/* Scene music buttons live in the command bar now, to the right of Quick Tools. */
.bottom-bar .scene-strip{margin-left:0;border-left:1px solid var(--border);padding:0 12px;flex-shrink:0;max-width:42%;align-self:center}
.bottom-bar .scene-strip:empty{display:none}
.qdie{width:34px;height:34px;border-radius:8px;background:var(--panel-2);border:1px solid var(--border);color:var(--light);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.qdie:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 10px var(--glow)}

/* ── Popups / drawers ── */
.pop-scrim{position:fixed;inset:0;z-index:50;background:rgba(4,6,10,.6);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center}
.pop-scrim.show{display:flex}
.popup{width:min(520px,94vw);max-height:82vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#161922,#101319);border:1px solid var(--accent-dim);border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.65),0 0 0 1px rgba(36,211,238,.15);overflow:hidden}
.popup.wide{width:min(760px,96vw)}
/* Full-height quick-tool window — fills the page vertically instead of a drawer. */
.popup.tall{width:min(600px,96vw);height:96vh;max-height:96vh}
/* xwide after tall so the extra width wins when a popup is both (Music) */
.popup.xwide,.popup.tall.xwide{width:min(1060px,97vw)}
/* Message composer only — hide the roster list/controls from the Party tool. */
.pop-body.msg-only .pty-bar,.pop-body.msg-only .pty-empty,.pop-body.msg-only .pty-list{display:none!important}
.pop-body.msg-only .ai-party-msg{border-bottom:none}
.pop-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(36,211,238,.06),transparent);flex-shrink:0}
.pop-ttl{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--white);flex-shrink:0}
.pop-toolbar{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:nowrap;min-width:0;overflow-x:auto}
.pop-toolbar:empty{display:none}
.pop-head .pop-toolbar:not(:empty) + .pop-x{margin-left:8px}
.pop-x{margin-left:auto;width:28px;height:28px;border-radius:7px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--mid);font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.pop-x:hover{color:#ff6a5c;border-color:var(--red-light)}
.pop-body{padding:16px;overflow-y:auto;flex:1 1 auto;min-height:0}
.pop-body.tool-host{padding:0;display:flex;flex-direction:column;min-height:0}
.pop-body.tool-host > *{flex:1 1 auto;min-height:0;height:100%;max-height:100%;width:100%}
/* Compact tool (Message): size the window to the tool's natural height. */
.pop-body:not(.tool-host) .msg-tool{height:auto;display:block}
.pop-body .msg-body{display:flex;flex-direction:column;gap:0}
.pop-scrim.drawer{align-items:flex-end;justify-content:stretch}
.pop-scrim.drawer .popup{width:100%;max-width:none;border-radius:16px 16px 0 0;border-bottom:none;max-height:70vh;margin:0}
.pchar-hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.pchar-av{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-weight:900;font-size:16px;color:#06131a;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.pchar-nm{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;color:var(--white)}
.pchar-sub{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.psec-h{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:10px 0 6px}
.pline{font-size:13px;color:var(--light);line-height:1.6}
.hpctl{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.hpbar{flex:1;height:16px;border-radius:8px;background:rgba(0,0,0,.5);overflow:hidden;position:relative;border:1px solid var(--border)}
.hpbar>i{display:block;height:100%}
.hpbar .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Share Tech Mono',monospace;font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000}

/* ── Timers tool (standalone) ── */
.tmr-tool{display:flex;flex-direction:column;height:100%}
.tmr-body{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.tmr-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);text-align:center;padding:24px}
.tmr-empty-icon{font-size:34px;opacity:.6}
.tmr-empty-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:var(--light)}
.tmr-empty-sub{font-family:'Barlow',sans-serif;font-size:11px;max-width:320px;line-height:1.5}
.tmr-list{display:flex;flex-direction:column;gap:10px}
.tmr-card{border:1px solid var(--border);border-left:3px solid #6a9fc8;border-radius:10px;background:linear-gradient(180deg,#191c22,#141519);padding:9px 11px;display:flex;flex-direction:column;gap:8px}
.tmr-card.round{border-left-color:var(--gold)}
.tmr-card.expired{border-left-color:var(--red-light);box-shadow:0 0 10px rgba(214,58,48,.25)}
.tmr-row1{display:flex;align-items:center;gap:8px}
.tmr-name{flex:1;min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:6px;color:var(--white);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;padding:5px 8px}
.tmr-kind{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:8px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--border);color:var(--muted);flex-shrink:0}
.tmr-kind.tm{color:#6a9fc8;border-color:#6a9fc8}
.tmr-kind.rd{color:var(--gold);border-color:var(--gold)}
.tmr-del{width:24px;height:24px;border-radius:6px;background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer;flex-shrink:0}
.tmr-del:hover{color:#ff6a5c;border-color:var(--red-light)}
.tmr-row2{display:flex;align-items:center;gap:8px}
.tmr-disp{flex:1;text-align:center;font-family:'Share Tech Mono',monospace;font-size:26px;font-weight:700;color:#6a9fc8;line-height:1}
.tmr-disp.round{color:var(--gold)}
.tmr-disp .tmr-unit{font-size:12px;margin-left:4px;color:var(--muted)}
.tmr-disp.zero{color:var(--red-light)}
.tmr-toggle,.tmr-reset,.tmr-minus,.tmr-plus{width:38px;height:38px;border-radius:8px;background:var(--panel-2);border:1px solid var(--border);color:var(--light);font-size:15px;font-weight:800;cursor:pointer;flex-shrink:0}
.tmr-toggle:hover,.tmr-reset:hover,.tmr-minus:hover,.tmr-plus:hover{border-color:var(--accent);color:var(--accent)}
.tmr-row3{display:flex;align-items:center;gap:6px}
.tmr-setlbl{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tmr-min,.tmr-sec{width:52px;background:var(--panel);border:1px solid var(--border);border-radius:6px;color:var(--white);font-family:'Share Tech Mono',monospace;font-size:13px;padding:5px 6px;text-align:center}
.tmr-colon{color:var(--muted);font-weight:700}
.tmr-apply{margin-left:auto;padding:5px 12px;border-radius:6px;background:var(--panel-2);border:1px solid var(--border);color:var(--light);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:10px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.tmr-apply:hover{border-color:var(--accent);color:var(--accent)}
.tracker-kind-tag{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);border:1px solid var(--border);border-radius:6px;padding:3px 8px;white-space:nowrap}

@media (max-width:760px){
  .console-main{flex-direction:column;overflow-x:hidden;overflow-y:auto}
  .console-workspace{flex-direction:column;overflow-x:hidden;overflow-y:visible}
  .cstation{flex:0 0 auto!important;flex-basis:auto!important;min-height:70vh;border-right:none;border-bottom:3px solid var(--border)}
  .cstation.collapsed{min-height:0!important}
  .cstation-center{min-height:0}
  #cst-center:not(.collapsed){min-height:80vh}
  .cst-log-rail{flex-basis:auto!important;min-height:70vh;border-left:none;border-top:3px solid var(--border)}
  .cmode-tab{min-width:0;padding:0 11px}
  .bb-lbl{display:none}
}

/* ── Map / VTT station ── */
.vtt-bar{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--panel-2);border-bottom:1px solid var(--border);flex-shrink:0}
.vtt-url-input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:6px;color:var(--white);font-size:12px;padding:5px 8px;outline:none;font-family:'Barlow',sans-serif}
.vtt-url-input:focus{border-color:var(--accent-dim);box-shadow:0 0 0 2px var(--glow)}
.vtt-body{flex:1;position:relative;display:flex;min-height:0;background:#0a0c10}
.vtt-frame-wrap{flex:1;min-height:0;display:block}
.vtt-frame{width:100%;height:100%;border:0;display:block;background:#0a0c10}
.vtt-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:26px}
.vtt-empty-icon{color:var(--accent);opacity:.85}
.vtt-empty-icon svg{width:32px;height:32px}
.vtt-empty-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--light)}
.vtt-empty-sub{font-size:12px;line-height:1.6;color:var(--muted);max-width:360px}
.vtt-empty-sub b{color:var(--light)}
.vtt-launch{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:26px}
.vtt-launch-badge{width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#06131a;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 6px 20px rgba(36,211,238,.3)}
.vtt-launch-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--white)}
.vtt-launch-sub{font-size:12.5px;line-height:1.6;color:var(--muted);max-width:340px}
.vtt-launch-actions{display:flex;gap:8px;margin-top:4px}
.vtt-launch-actions .btn{padding:9px 16px}
.vtt-launch-url{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--accent-dim);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.7}
.vtt-hint{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:rgba(10,14,20,.94);border:1px solid var(--accent-dim);box-shadow:0 4px 16px rgba(0,0,0,.5);z-index:3}
.vtt-hint-txt{flex:1;font-size:11px;color:var(--light)}
.vtt-hint-x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 5px;line-height:1}
.vtt-hint-x:hover{color:var(--white)}
</style>
</head>
<body>

<!-- Mobile-only: collapse/expand the top bar to reclaim space from pinned scenes -->
<div id="hdr-toggle" role="button" tabindex="0"></div>

<!-- ═══ SINGLE TOP BAR — session controls + party monitors + scenes + clock ═══ -->
<div class="topbar" id="gmc-topbar">
  <div class="session-controls">
    <div class="gmc-home-spacer" aria-hidden="true"></div>
    <div class="io-cluster">
      <div class="io-row">
        <a class="btn small ghost vtt-launch io-btn" id="vtt-btn" target="_blank" rel="noopener noreferrer" title="Launch this campaign's virtual tabletop" aria-label="Launch VTT" style="display:none;text-decoration:none;"><svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M13.5 3h7.5v7.5h-2.2V6.8l-8 8L9.2 13.3l8-8H13.5z"/><path d="M5.2 5.4h6.3v2.2H6.4v10h10v-5.1h2.2v6.3a1 1 0 0 1-1 1H5.2a1 1 0 0 1-1-1V6.4a1 1 0 0 1 1-1z"/></svg><span>VTT</span></a>
        <button class="btn small ghost io-btn" id="save-btn" onclick="saveSession()" title="Export / save session" aria-label="Export session to file"><svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M4 9.5a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v1H4Z"/><path d="M3.6 12h16.8v6a1.5 1.5 0 0 1-1.5 1.5H5.1A1.5 1.5 0 0 1 3.6 18Zm7.1 0v2.2a1.3 1.3 0 0 0 2.6 0V12Z"/></svg><span>Export</span></button>
        <label class="btn small ghost io-btn" title="Import / load session" aria-label="Import a saved session" style="cursor:pointer;">
          <svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M3.5 5.6a1.6 1.6 0 0 1 1.6-1.6h3.8l2 2h6a1.6 1.6 0 0 1 1.6 1.6v1H6.4a1.6 1.6 0 0 0-1.5 1.1L3.5 15Z"/><path d="M6.4 10.2h14.2a1 1 0 0 1 1 1.3l-1.9 6.4a1.6 1.6 0 0 1-1.5 1.1H4.6a1.6 1.6 0 0 1-1.5-2.1l1.8-5.6a1.6 1.6 0 0 1 1.5-1.1Z" opacity=".85"/></svg><span>Import</span>
          <input type="file" id="load-input" accept=".json" style="display:none;" onchange="loadSession(this)">
        </label>
      </div>
      <button class="btn small ghost io-btn camp-btn-wide" id="camp-btn" onclick="GMCamp.togglePanel()" title="Campaign link"><svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M9.6 12.9a3.4 3.4 0 0 0 5.1.4l2.8-2.8a3.4 3.4 0 0 0-4.8-4.8l-1.6 1.6a.9.9 0 0 0 1.3 1.3l1.6-1.6a1.6 1.6 0 0 1 2.3 2.3l-2.8 2.8a1.6 1.6 0 0 1-2.4-.2.9.9 0 0 0-1.4 1.2Z"/><path d="M14.4 11.1a3.4 3.4 0 0 0-5.1-.4L6.5 13.5a3.4 3.4 0 0 0 4.8 4.8l1.6-1.6a.9.9 0 0 0-1.3-1.3l-1.6 1.6a1.6 1.6 0 0 1-2.3-2.3l2.8-2.8a1.6 1.6 0 0 1 2.4.2.9.9 0 0 0 1.4-1.2Z"/></svg> <span class="camp-btn-label">Campaign</span></button>
    </div>
  </div>

  <div class="mon-group" id="gmc-party-bubbles"><div class="party-empty" id="party-empty">Link a campaign to see your party</div></div>
  <div class="mon-group" id="gmc-timers"></div>
  <div class="gmc-round" id="gmc-round">
    <div class="gmc-round-info"><span class="gmc-round-lbl">Round</span><span class="gmc-round-num" id="gmc-round-num">1</span></div>
    <div class="gmc-round-btns">
      <button class="gmc-round-btn gmc-round-next" type="button" onclick="gmcNextRound()" title="Advance the round (steps combat + round timers)" aria-label="Next round">&rsaquo;</button>
      <button class="gmc-round-btn gmc-round-reset" type="button" onclick="gmcResetRounds()" title="Reset the round counter and round timers" aria-label="Reset rounds">&#8635;</button>
    </div>
  </div>
  <div class="tel-clock"><div class="tel-clbl">Session</div><div class="tel-time" id="tel-clock">0:00</div></div>

  <div class="view-controls">
    <button class="add-window-btn" id="add-window-btn" type="button" onclick="addWindow()" title="Add a window" aria-label="Add a window"><span class="aw-plus">＋</span> Window</button>
  </div>
</div>

<!-- Campaign link popover — anchored under the top bar -->
<div id="camp-popover" style="display:none;"></div>

<script>
// ══════════════════════════════════════════
// SYSTEM TOGGLE (SD / DCC / ACE! / Kids on Bikes / Nimble / Star Wars)
// A top-bar switch that hides the other systems' Generators (and points the
// combat-tracker's monster picker at the matching bestiary). Purely a display
// filter — every system's data stays loaded. Persisted per browser.
// ══════════════════════════════════════════
(function () {
  const SYS_GENS = {
    SD:  ['adventure','npc','rival','monster','dungeon','encounter','shop','sdfoundloot'],
    DCC: ['dccnpc','dccneighborhood','dccmonster','dccencounter','dccloot','dccitem'],
    ACE: ['acemonster','acetreasure'],
    KOB: [],
    NIM: ['nimmonster','nimtreasure'],
    SW:  ['swmonster','swtreasure'],
    DND: ['adventure','npc','dungeon','encounter','shop','dndmonster','dndtreasure'],
    D62E:['d62emonster','d62etreasure'],
    ICRPG:['icrpgmonster','icrpgtreasure'],
    MMRPG:['mmrpgmonster','mmrpgtables','mmrpgtreasure','mmrpghenchmen'],
    CO:  [],
    YZE: ['yzetables'],
    JLU: [],
    GB:  [],
  };
  const SYS_KEYS = Object.keys(SYS_GENS);
  const OWNED = [].concat.apply([], SYS_KEYS.map(k => SYS_GENS[k]));   // every system-specific generator
  // Display names for the top-bar system indicator (the GM Screen no longer has
  // a system dropdown — the linked campaign drives it).
  const SYS_LABEL = { SD:'Shadowdark', DCC:'DCC', ACE:'ACE!', KOB:'Kids on Bikes', NIM:'Nimble', SW:'Star Wars', DND:'D&D', D62E:'D6 System 2e', ICRPG:'Index Card RPG', MMRPG:'Marvel Multiverse', CO:'Candela Obscura', YZE:'Year Zero Engine', JLU:'Justice League', GB:'Ghostbusters' };
  // Systems an admin hid (Admin → Systems) — injected by the server before the
  // page runs. Never let the visible set go empty (mirrors the server guard).
  const HIDDEN_SYS = (function () { try { return Array.isArray(window.__gmHiddenSystems__) ? window.__gmHiddenSystems__ : []; } catch (e) { return []; } })();
  const VISIBLE_KEYS = (function () { const v = SYS_KEYS.filter(k => HIDDEN_SYS.indexOf(k) < 0); return v.length ? v : SYS_KEYS; })();
  const DEFAULT_SYS = VISIBLE_KEYS.indexOf('DCC') >= 0 ? 'DCC' : VISIBLE_KEYS[0];
  // The GM Screen's system now follows the linked campaign. With no campaign
  // linked (personal board) it falls back to the last system used on this
  // browser, then the default.
  function readSys() { try { const v = localStorage.getItem('gm_system'); return VISIBLE_KEYS.indexOf(v) >= 0 ? v : DEFAULT_SYS; } catch (e) { return DEFAULT_SYS; } }
  let SYS = readSys();
  window.GM_SYSTEM = SYS;
  window.GM_SYSTEM_KEYS = VISIBLE_KEYS;
  window.SYS_LABEL = SYS_LABEL;   // friendly names for other tools (e.g. the prep picker)
  // Paint the read-only system indicator in the top bar.
  function paintSysLabel() {
    document.querySelectorAll('#gm-system-label .gm-sys-name').forEach(el => { el.textContent = SYS_LABEL[SYS] || SYS; });
  }

  function applyToSelect(sel) {
    let curHidden = false, firstVisible = null;
    [].slice.call(sel.options).forEach(o => {
      const v = o.value;
      const hide = OWNED.indexOf(v) >= 0 && SYS_GENS[SYS].indexOf(v) < 0;
      o.hidden = hide;
      o.disabled = hide;                 // belt-and-suspenders for browsers that ignore hidden
      if (!hide && firstVisible === null) firstVisible = v;
      if (o.selected && hide) curHidden = true;
    });
    if (curHidden && firstVisible) { sel.value = firstVisible; sel.dispatchEvent(new Event('change', { bubbles: true })); }
  }
  // Filter every Generators dropdown (the live tool + any toolbar clones) under root.
  window.applyGmSystemToGenerators = function (root) {
    (root || document).querySelectorAll('.gen-tab-select').forEach(applyToSelect);
  };
  window.setGmSystem = function (v) {
    const key = String(v || '').toUpperCase();
    SYS = VISIBLE_KEYS.indexOf(key) >= 0 ? key : DEFAULT_SYS;
    window.GM_SYSTEM = SYS;
    try { localStorage.setItem('gm_system', SYS); } catch (e) {}
    paintSysLabel();
    window.applyGmSystemToGenerators(document);
    if (typeof window.setGmMonsterSource === 'function') window.setGmMonsterSource(SYS.toLowerCase());
    try { document.dispatchEvent(new CustomEvent('gm-system-change', { detail: SYS })); } catch (e) {}
  };
  function initSys() {
    paintSysLabel();
    window.applyGmSystemToGenerators(document);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initSys);
  else initSys();
})();
</script>

<script>
// ══════════════════════════════════════════
// CAMPAIGN LINK (top bar)
// The campaign used to live inside the Roll Log (then "Dice Tray"), which meant it vanished
// whenever that tool wasn't on screen. It now lives here — one connection,
// owned by the page, that the Dice Tray broadcasts to and the Party tool reads.
// ══════════════════════════════════════════
const GMCamp = (function() {
  const clientKey = 'gm-' + Math.random().toString(36).slice(2, 12);
  let campaign  = null;     // {id, code, name}
  let hideRolls = false;    // GM can keep their own rolls off the shared log
  let lastId    = 0;
  let timer     = null;
  let panelOpen = false;
  const listeners = new Set();   // fn(roll) — the Dice Tray's log
  const watchers  = new Set();   // fn() — told whenever the link or hide state changes
  let pending = [];              // rolls that arrived before anyone was listening

  const btn = () => document.getElementById('camp-btn');
  const pop = () => document.getElementById('camp-popover');
  const esc = t => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  // ── Roll traffic ──
  function broadcast(entry) {
    if(!campaign || hideRolls) return;
    fetch('/api/campaigns/' + campaign.id + '/rolls', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        clientKey, source: 'GM',
        label: entry.label, result: String(entry.total),
        detail: entry.detail, type: entry.crit || 'normal'
      })
    }).catch(() => {});
  }

  // Deliberate broadcast (achievements, system messages, loot boxes). Unlike
  // broadcast(), this ignores hideRolls — these are intentional sends to players.
  function send(payload) {
    if(!campaign) return false;
    const body = {
      clientKey, source: 'GM',
      label: String(payload.label || ''),
      result: String(payload.result == null ? '' : payload.result),
      detail: String(payload.detail || ''),
      type: payload.type || 'normal'
    };
    fetch('/api/campaigns/' + campaign.id + '/rolls', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body)
    }).catch(() => {});
    // The poll skips this client's own rolls, so echo the send straight into the
    // Roll Log — the GM sees the drop / message exactly as the players do, and
    // player claims on it land on this same card.
    const echo = Object.assign({ local: true }, body);
    if(listeners.size) listeners.forEach(fn => { try { fn(echo); } catch(e) {} });
    else { pending.push(echo); if(pending.length > 100) pending.shift(); }
    return true;
  }

  async function poll() {
    if(!campaign) return;
    try {
      const url = '/api/campaigns/' + campaign.id + '/rolls' + (lastId ? '?since=' + lastId : '');
      const r = await fetch(url, { credentials: 'same-origin' });
      if(!r.ok) return;
      const data = await r.json();
      (data.rolls || []).forEach(roll => {
        if(roll.clientKey === clientKey) return;
        if(listeners.size) listeners.forEach(fn => { try { fn(roll); } catch(e) {} });
        else { pending.push(roll); if(pending.length > 100) pending.shift(); }
      });
      if(data.last) lastId = data.last;
    } catch(e) {}
  }

  // Poll every 4s while the tab is visible; back off to 20s when it's hidden
  // (a GM screen parked on a second monitor doesn't need live cadence). The
  // ?since cursor means nothing is missed — backed-off rolls just arrive on the
  // next tick, and refocusing snaps straight back to 4s with an immediate poll.
  function pollDelay() { return document.hidden ? 20000 : 4000; }
  function start() {
    stop();
    poll();
    timer = setInterval(poll, pollDelay());
  }
  function stop()  { if(timer) { clearInterval(timer); timer = null; } }
  document.addEventListener('visibilitychange', function() {
    if(!campaign || !timer) return;   // only re-arm an already-running poll
    clearInterval(timer);
    if(!document.hidden) poll();       // refocus → catch up immediately
    timer = setInterval(poll, pollDelay());
  });

  // The Dice Tray registers here when it is first created — anything that
  // arrived while it didn't exist yet is handed over on the way in.
  function onRoll(fn) {
    listeners.add(fn);
    const backlog = pending; pending = [];
    backlog.forEach(roll => { try { fn(roll); } catch(e) {} });
  }

  // ── UI ──
  function renderBtn() {
    const b = btn();
    if(!b) return;
    b.classList.toggle('on', !!campaign);
    // Show the campaign NAME on the button (the icon stays); the code lives in
    // the tooltip. Update the label span so we don't wipe the SVG.
    const lbl = b.querySelector('.camp-btn-label');
    if(lbl) lbl.textContent = campaign ? campaign.name : 'Campaign';
    else b.textContent = campaign ? campaign.name : 'Campaign';
    b.title = campaign ? 'Campaign: ' + campaign.name + ' (' + campaign.code + ')' : 'Campaign link';
  }

  // The Dice Tray subscribes so its hide-rolls button appears, disappears, and
  // restyles itself as the link comes and goes.
  function onChange(fn) { watchers.add(fn); }
  function notify() { watchers.forEach(fn => { try { fn(); } catch(e) {} }); }

  // Cached list of the campaigns on this account (null = not fetched yet).
  let campList = null;

  async function loadList() {
    try {
      const r = await fetch('/api/campaigns', { credentials: 'same-origin' });
      if(r.ok) {
        const d = await r.json();
        campList = Array.isArray(d) ? d : (d && Array.isArray(d.campaigns) ? d.campaigns : []);
      } else {
        campList = [];   // endpoint missing / not signed in — create & join still work
      }
    } catch(e) { campList = []; }
    // Reconcile the linked campaign's system from the freshly-fetched list — a
    // board saved before this feature (or connected from a lean object) carries
    // no system on its own campaign object, so pick it up here and switch to it.
    if(campaign && Array.isArray(campList)) {
      const m = campList.find(c => String(c.id) === String(campaign.id));
      if(m && m.system && m.system !== campaign.system) {
        campaign.system = m.system;
        if(typeof window.setGmSystem === 'function') window.setGmSystem(m.system);
      }
    }
    if(panelOpen) renderPanel();
    notify();                       // let the Launch VTT button resolve its URL
  }

  function renderPanel() {
    const el = pop();
    if(!el) return;
    el.style.display = panelOpen ? 'flex' : 'none';
    if(!panelOpen) return;
    // Close when the scrim (not the card) is clicked.
    el.onclick = e => { if(e.target === el) { panelOpen = false; renderPanel(); } };

    // ── The account's campaigns, as a pick-list ──
    let listHtml;
    if(campList === null) {
      listHtml = '<div class="camp-hint">Loading campaigns…</div>';
    } else if(!campList.length) {
      listHtml = '<div class="camp-hint">No campaigns on your account yet — create one on the Campaigns page.</div>';
    } else {
      listHtml = '<div class="camp-list">' + campList.map(c =>
          '<button class="camp-item' + ((campaign && String(campaign.id) === String(c.id)) ? ' active' : '') + '" data-id="' + esc(c.id) + '">'
        +   '<span class="camp-item-name">' + esc(c.name) + '</span>'
        +   '<span class="camp-item-code">' + esc(c.code) + '</span>'
        + '</button>'
      ).join('') + '</div>';
    }

    el.innerHTML =
        '<div class="camp-card">'
      + '<div class="camp-card-head"><span class="camp-card-title">Campaign Link</span><button class="pop-x camp-close" type="button" aria-label="Close">✕</button></div>'
      + listHtml
      + (campaign
          ? '<button class="camp-leave" style="background:#3a1a1a;color:#df8a8a;border:1px solid #7a2d2d;width:100%;margin-top:8px;">Disconnect ' + esc(campaign.code) + '</button>'
          : '')
      + '<div class="camp-err"></div>'
      + '<div class="camp-hint">Pick a campaign to connect this screen. Rolls sync both ways and linked players show in the Party tool. Campaigns are created and managed on the Campaigns page.</div>'
      + '</div>';

    const closeBtn = el.querySelector('.camp-close');
    if(closeBtn) closeBtn.onclick = () => { panelOpen = false; renderPanel(); };

    // Connect to a campaign the user picked from the list
    el.querySelectorAll('.camp-item').forEach(b => {
      b.onclick = () => {
        const c = (campList || []).find(x => String(x.id) === String(b.getAttribute('data-id')));
        if(c) { panelOpen = false; renderPanel(); switchBoard(c); }
      };
    });

    const leaveBtn = el.querySelector('.camp-leave');
    if(leaveBtn) leaveBtn.onclick = () => { panelOpen = false; renderPanel(); switchBoard(null); };

    // Create and Join were removed from the GM Screen: campaigns are created on
    // the Campaigns page, and players join from their character sheets. This
    // panel only lists the account's campaigns and connects the screen to one.
  }

  // Switching campaigns swaps the whole board. The saved board for each campaign
  // lives server-side keyed by (user, campaign), so we: (1) save the board we're
  // leaving under its own campaign, (2) mark the target as the one to open next,
  // (3) reload — the page then restores that campaign's board and link cleanly,
  // with no residue from the previous one. Pass null to switch to the personal
  // (unlinked) board. Falls back to the old in-place link swap if the server
  // hooks aren't present (e.g. running the raw template outside the app).
  async function switchBoard(nextCampaign) {
    if(window.__ddCampaignSwitching) return;
    if(!window.__ddFlushNow || !window.__ddSelectCampaign) { set(nextCampaign); return; }
    window.__ddCampaignSwitching = true;
    try {
      await window.__ddFlushNow();                       // save the board we're leaving
      await window.__ddSelectCampaign(nextCampaign || null); // make the target last-used
      // Remember the real campaign so the reloaded page activates the link from
      // this object directly, rather than depending on the stored board's shape.
      try { sessionStorage.setItem('dd-activate-campaign', JSON.stringify(nextCampaign || null)); } catch(e){}
      window.location.reload();                          // reopen into the target's board
    } catch(e) {
      window.__ddCampaignSwitching = false;
      set(nextCampaign);                                 // best-effort: at least apply the link
    }
  }

  function set(c) {
    campaign = (c && c.id) ? c : null;
    lastId = 0;
    pending = [];
    if(campaign) start(); else stop();
    renderBtn();
    notify();
    // Drive the GM Screen's game system from the linked campaign (there's no
    // system dropdown any more). If this campaign object doesn't carry a system
    // yet, loadList() reconciles it from the account's campaign list below.
    if(campaign && campaign.system && typeof window.setGmSystem === 'function') window.setGmSystem(campaign.system);
    if(campaign && campList === null) loadList();   // resolve this campaign's VTT link + system
    if(window.__ddScheduleSave) setTimeout(window.__ddScheduleSave, 300);   // persist the link
  }

  function togglePanel() {
    panelOpen = !panelOpen;
    renderPanel();                 // instant: shows cached list (or a loading line first time)
    if(panelOpen) loadList();      // refresh in the background, re-renders when it lands
  }
  function toggleHide()  {
    hideRolls = !hideRolls;
    notify();
    if(window.__ddScheduleSave) setTimeout(window.__ddScheduleSave, 300);
  }

  // Click outside closes the popover
  document.addEventListener('click', e => {
    if(!panelOpen) return;
    if(e.target.closest('#camp-popover') || e.target.closest('#camp-btn')) return;
    panelOpen = false; renderPanel();
  });

  return {
    get: () => campaign,
    // The current campaign's VTT room URL, or null. Prefers the value carried on
    // the campaign object, falling back to the freshly-fetched account list.
    vttUrl: () => {
      if(campaign && campaign.vttUrl) return campaign.vttUrl;
      if(campaign && Array.isArray(campList)) {
        const m = campList.find(c => String(c.id) === String(campaign.id));
        if(m && m.vttUrl) return m.vttUrl;
      }
      return null;
    },
    set,
    onRoll,
    onChange,
    broadcast,
    send,
    toggleHide,
    togglePanel,
    isHidden: () => hideRolls,
    setHidden: v => { hideRolls = !!v; renderBtn(); },
    serialize: () => ({ campaign, hideRolls }),
    restore: (s) => {
      if(!s) return;
      if(typeof s.hideRolls === 'boolean') hideRolls = s.hideRolls;
      if(s.campaign && s.campaign.id) set(s.campaign); else { renderBtn(); notify(); }
    },
    render: renderBtn,
  };
})();
window.GMCamp = GMCamp;
window.__gmCampaign = () => GMCamp.get();   // Party tool reads the linked campaign from here

// ── Launch VTT button ──  Mirrors the homepage's Launch VTT: shows only when the
// linked campaign has a tabletop room, and opens it in a new tab.
function updateVttBtn() {
  const a = document.getElementById('vtt-btn');
  if(!a) return;
  const url = GMCamp.vttUrl();
  if(url) { a.href = url; a.style.display = 'inline-block'; }
  else { a.removeAttribute('href'); a.style.display = 'none'; }
}
GMCamp.onChange(updateVttBtn);
GMCamp.render();
updateVttBtn();
</script>

<script>
// ══════════════════════════════════════════
// SCENES — layered, pinnable audio scenes for the Music tool
// A scene is a set of tracks that play at once, each with its own loop + volume.
// Like the campaign link, scenes are owned by the page (not the tool instance),
// so a scene pinned to the top bar keeps playing even when the Music pane is
// closed. One scene plays at a time; triggering another crossfades. Cross-origin
// URLs play through plain <audio> (no CORS needed); fades ramp .volume directly.
// Local (object-URL) tracks can't survive a reload, so only http(s) URLs are
// saved — local tracks return as re-linkable placeholders.
// ══════════════════════════════════════════
const GMScenes = (function() {
  let scenes = [];
  let nextId = 1;
  let activeId = null;
  let masterVol = 0.8;
  let players = [];       // {trackId, audio} for the active scene
  let onChange = null;
  const FADE = 1800;

  const clamp01 = v => Math.max(0, Math.min(1, v));
  const isHttp = u => typeof u === 'string' && /^https?:\/\//i.test(u);
  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function normUrl(u){
    // Dropbox share links serve a preview page unless raw=1 is set; drop the
    // short-lived st= token and force raw=1 so <audio> gets the file itself.
    if(typeof u!=='string' || !/dropbox\.com/i.test(u)) return u;
    const parts = u.split('?'); const base = parts[0];
    const params = (parts[1]||'').split('&').filter(Boolean).filter(p=>!/^(st|dl|raw)=/i.test(p));
    params.push('raw=1');
    return base + '?' + params.join('&');
  }
  // One shared fade ticker for all elements (alive only while fades run) —
  // the old version spawned a 25Hz setInterval PER audio element, so a
  // six-track scene crossfade ran twelve concurrent timers. Time-based, so
  // background-tab throttling just coarsens the curve without stalling the
  // fade or its completion callback (which pause() relies on).
  const _fades = new Set();
  let _fadeTimer = null;
  function _fadeTick(){
    const now = performance.now();
    _fades.forEach(f => {
      const k = f.ms > 0 ? Math.min(1, (now - f.start)/f.ms) : 1;
      try { f.a.volume = clamp01(f.from + (f.to - f.from)*k); } catch(e){}
      if(k >= 1){ _fades.delete(f); if(f.a._ramp === f) f.a._ramp = null; if(f.done) f.done(); }
    });
    if(!_fades.size){ clearInterval(_fadeTimer); _fadeTimer = null; }
  }
  function ramp(a, to, ms, done){
    if(a._ramp){ _fades.delete(a._ramp); a._ramp = null; }   // supersede a running fade (its done is dropped, as before)
    const f = { a: a, from: a.volume, to: clamp01(to), ms: ms, start: performance.now(), done: done };
    a._ramp = f;   // stays truthy while fading — volume-knob code checks this
    _fades.add(f);
    if(!_fadeTimer) _fadeTimer = setInterval(_fadeTick, 40);
  }
  const scene = id => scenes.find(s=>s.id===id) || null;
  const tvol = t => clamp01(masterVol * (typeof t.vol==='number'?t.vol:0.8));
  function notify(){ renderPins(); if(typeof onChange==='function'){ try{ onChange(); }catch(e){} } }

  function newScene(name){ return { id: nextId++, name: name || ('Scene ' + (scenes.length+1)), pinned:false, tracks: [] }; }
  function newTrack(name, url){ return { id: nextId++, name: name||'Track', url: url||null, loop:true, vol:0.8, needsFile: !url }; }

  // ── playback ──
  function spawn(t){
    const a = new Audio(t.url); a.loop = !!t.loop; a.volume = 0;
    const p = a.play(); if(p && p.catch) p.catch(()=>{});
    ramp(a, tvol(t), FADE);
    players.push({ trackId: t.id, audio: a });
  }
  function stopInternal(fade){
    players.forEach(pl=>{ const a=pl.audio; if(fade) ramp(a,0,FADE,()=>{ try{a.pause();}catch(e){} }); else { try{a.pause();}catch(e){} } });
    players = [];
  }
  function play(id){
    const s = scene(id); if(!s) return;
    stopInternal(true);
    activeId = id;
    s.tracks.filter(t=>!t.needsFile && t.url).forEach(spawn);
    notify();
  }
  function stop(){ stopInternal(true); activeId = null; notify(); }
  function toggle(id){ if(activeId===id) stop(); else play(id); }
  const isPlaying = id => activeId===id && players.length>0;

  function refreshTrack(t){
    const pl = players.find(p=>p.trackId===t.id);
    if(pl){ try{ pl.audio.loop = !!t.loop; if(!pl.audio._ramp) pl.audio.volume = tvol(t); }catch(e){} }
  }
  function setMasterVol(v){
    masterVol = clamp01(v);
    if(activeId!=null){ const s=scene(activeId); if(s) players.forEach(pl=>{ const t=s.tracks.find(x=>x.id===pl.trackId); if(t && !pl.audio._ramp){ try{ pl.audio.volume = tvol(t); }catch(e){} } }); }
  }

  // ── mutations ──
  function addScene(name){ const s=newScene(name); scenes.push(s); notify(); return s.id; }
  function removeScene(id){ if(activeId===id) stop(); scenes = scenes.filter(s=>s.id!==id); notify(); }
  function renameScene(id, name){ const s=scene(id); if(s){ s.name = name; renderPins(); } }
  function togglePin(id){ const s=scene(id); if(s){ s.pinned = !s.pinned; notify(); } }
  function addTrackUrl(id, url){
    const s=scene(id); if(!s || !url) return;
    const clean = normUrl(url.trim()); if(!clean) return;
    let nm='Track'; try{ nm = decodeURIComponent(clean.split('/').pop().split('?')[0]) || nm; }catch(e){}
    const t = newTrack(nm, clean); s.tracks.push(t);
    if(activeId===id) spawn(t);
    notify();
  }
  // Like addTrackUrl but keeps a caller-supplied name (used by the Sound
  // Library picker so the track shows its library label, not the filename).
  function addLibraryTrack(id, name, url){
    const s=scene(id); if(!s || !url) return false;
    const clean = normUrl(String(url).trim()); if(!isHttp(clean)) return false;
    let nm = (name && String(name).trim()) ? String(name).trim() : 'Track';
    if(nm==='Track'){ try{ nm = decodeURIComponent(clean.split('/').pop().split('?')[0]) || nm; }catch(e){} }
    const t = newTrack(nm, clean); s.tracks.push(t);
    if(activeId===id) spawn(t);
    notify();
    return true;
  }
  function addTrackFiles(id, fileList){
    const s=scene(id); if(!s) return;
    Array.from(fileList).forEach(f=>{
      if(!/^audio\//.test(f.type) && !/\.(mp3|ogg|wav|m4a|aac|flac|opus|webm)$/i.test(f.name)) return;
      const url = URL.createObjectURL(f);
      const ph = s.tracks.find(t=>t.needsFile && t.name===f.name);
      if(ph){ ph.url=url; ph.needsFile=false; if(activeId===id) spawn(ph); }
      else { const t=newTrack(f.name, url); t.needsFile=false; s.tracks.push(t); if(activeId===id) spawn(t); }
    });
    notify();
  }
  function removeTrack(id, trackId){
    const s=scene(id); if(!s) return;
    if(activeId===id){ const pl=players.find(p=>p.trackId===trackId); if(pl){ ramp(pl.audio,0,300,()=>{ try{pl.audio.pause();}catch(e){} }); players = players.filter(p=>p.trackId!==trackId); } }
    s.tracks = s.tracks.filter(t=>t.id!==trackId); notify();
  }
  function setTrackLoop(id, trackId, val){ const s=scene(id); if(!s) return; const t=s.tracks.find(x=>x.id===trackId); if(t){ t.loop=!!val; if(activeId===id) refreshTrack(t); notify(); } }
  function setTrackVol(id, trackId, v){ const s=scene(id); if(!s) return; const t=s.tracks.find(x=>x.id===trackId); if(t){ t.vol=clamp01(v); if(activeId===id) refreshTrack(t); } } // no notify: keep slider smooth

  // ── pinned top-bar buttons ──
  function renderPins(){
    const host = document.getElementById('scene-pins');
    if(!host) return;
    host.innerHTML = '';
    scenes.filter(s=>s.pinned).forEach(s=>{
      const on = activeId===s.id;
      const b = document.createElement('button');
      b.className = 'btn small ghost scene-pin' + (on ? ' active' : '');
      b.title = (on ? 'Stop scene: ' : 'Play scene: ') + s.name;
      b.innerHTML = (on ? '<svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><rect x="5.2" y="5.2" width="13.6" height="13.6" rx="2"/></svg> ' : '<svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M7 4.6v14.8a1 1 0 0 0 1.5.86l12-7.4a1 1 0 0 0 0-1.72l-12-7.4A1 1 0 0 0 7 4.6Z"/></svg> ') + esc(s.name);
      b.addEventListener('click', ()=> toggle(s.id));
      host.appendChild(b);
    });
  }

  // ── persistence ──
  function serialize(){
    return { masterVol, scenes: scenes.map(s=>({
      name: s.name, pinned: !!s.pinned,
      tracks: s.tracks.map(t=>({ name:t.name, url:isHttp(t.url)?t.url:null, loop:!!t.loop, vol:(typeof t.vol==='number'?t.vol:0.8) }))
    })) };
  }
  function restore(data){
    stopInternal(false); activeId=null; players=[];
    if(!data){ scenes=[]; }
    else {
      masterVol = (typeof data.masterVol==='number') ? data.masterVol : 0.8;
      scenes = (data.scenes||[]).map(s=>({
        id: nextId++, name: s.name||'Scene', pinned: !!s.pinned,
        tracks: (s.tracks||[]).map(t=>({ id: nextId++, name:t.name||'Track', url:isHttp(t.url)?normUrl(t.url):null, loop: t.loop!==false, vol:(typeof t.vol==='number'?t.vol:0.8), needsFile: !isHttp(t.url) }))
      }));
    }
    notify();
  }

  return {
    list: ()=>scenes, get: scene,
    addScene, removeScene, renameScene, togglePin,
    addTrackUrl, addLibraryTrack, addTrackFiles, removeTrack, setTrackLoop, setTrackVol,
    play, stop, toggle, isPlaying,
    activeId: ()=>activeId, masterVol: ()=>masterVol, setMasterVol,
    serialize, restore, renderPins, setOnChange: fn => { onChange = fn; }
  };
})();
window.GMScenes = GMScenes;
GMScenes.renderPins();

// ── Mobile header collapse ──
// On phones a stack of pinned scenes can swallow much of the screen, so the
// top bar defaults to collapsed behind a slim handle. The choice is remembered.
(function(){
  const KEY = 'dd_gmscreen_v1:hdrHidden';
  const toggle = document.getElementById('hdr-toggle');
  if(!toggle) return;
  let hidden;
  try { const v = localStorage.getItem(KEY); hidden = (v === null) ? true : (v === '1'); }
  catch(e) { hidden = true; }
  function apply(){
    document.body.classList.toggle('hdr-hidden', hidden);
    toggle.innerHTML = hidden ? '&#9776;&nbsp; Show controls' : '&#10005;&nbsp; Hide controls';
  }
  function flip(){ hidden = !hidden; try { localStorage.setItem(KEY, hidden ? '1' : '0'); } catch(e){} apply(); }
  toggle.addEventListener('click', flip);
  toggle.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
  apply();
})();
</script>

<script>
// Pull the user's saved homebrew (own + campaign-shared) from the app so the DCC
// generators and the bestiary picker can draw them too. Empty when standalone.
(function () {
  function pull(type, slot) {
    try {
      fetch("/api/homebrew?type=" + type, { credentials: "same-origin" })
        .then(function (r) { return r && r.ok ? r.json() : null; })
        .then(function (j) {
          if (j && Array.isArray(j.items)) {
            window[slot] = j.items.map(function (it) { return it && it.data; })
              .filter(function (d) { return d && d.name; });
          }
        })
        .catch(function () {});
    } catch (e) {}
  }
  pull("dcc-item", "__DCC_HB_ITEMS");       // → DCC Item generator pool
  pull("dcc-monster", "__DCC_HB_MONSTERS"); // → bestiary picker (add to tracker)

  // Shadowdark gear homebrew → the Treasure generator's list (same items the SD
  // character-sheet shop shows). Mapped into the SD_GEAR row shape and scoped to
  // the linked campaign, then re-pulled whenever the campaign link changes.
  window.__SD_HB_GEAR = window.__SD_HB_GEAR || [];
  function mapSdHbGear(d) {
    if (!d || !d.name) return null;
    var kind = String(d.kind || 'gear');
    var category = kind === 'weapon' ? 'weapon'
      : (kind === 'armor' || kind === 'shield') ? 'armor'
      : kind === 'ammo' ? 'ammo'
      : kind === 'magic' ? 'magic' : 'basic';
    var row = { name: String(d.name), category: category,
      cost: (d.gp != null && d.gp !== '') ? (d.gp + ' gp') : '',
      desc: String(d.note || ''), homebrew: true };
    if (category === 'weapon') { row.damage = String(d.damage || ''); row.range = String(d.range || ''); row.props = String(d.props || ''); }
    if (kind === 'armor' && !row.desc) row.desc = 'AC ' + (d.acBase || 10) + (d.acDex ? ' + DEX' : '');
    if (kind === 'shield' && !row.desc) row.desc = '+' + (d.acBonus || 0) + ' AC';
    return row;
  }
  function pullSdHbGear() {
    try {
      var camp = (typeof GMCamp !== 'undefined' && GMCamp.get) ? GMCamp.get() : null;
      var url = "/api/homebrew?type=gear" + (camp && camp.id ? ("&campaign=" + encodeURIComponent(camp.id)) : "");
      fetch(url, { credentials: "same-origin" })
        .then(function (r) { return r && r.ok ? r.json() : null; })
        .then(function (j) {
          if (j && Array.isArray(j.items)) {
            window.__SD_HB_GEAR = j.items.map(function (it) { return mapSdHbGear(it && it.data); }).filter(Boolean);
          }
        })
        .catch(function () {});
    } catch (e) {}
  }
  pullSdHbGear();
  if (typeof GMCamp !== 'undefined' && GMCamp.onChange) GMCamp.onChange(pullSdHbGear);
})();
</script>

<script>
// ══════════════════════════════════════════
// PANE / TOOL INSTANCE MANAGEMENT
// Tool instances are created ONCE and kept alive in a hidden pool.
// Switching panes/views MOVES the existing DOM node — never recreates it.
// This is what makes loaded files / typed content persist.
// ══════════════════════════════════════════

const TOOL_TYPES = ['adventure', 'maps', 'trackers', 'notes', 'gen', 'party', 'rules'];
const instancePool = document.createElement('div');
instancePool.style.cssText = 'position:fixed; top:0; left:-9999px; width:1px; height:1px; overflow:hidden;';
document.body.appendChild(instancePool);

const instances = {}; // legacy fallback: toolType -> detached node (used only when no window shows the tool)
let splitMode = 1;     // legacy shims kept so any stray reference stays harmless
let splitPref = 1;
const GM_MOBILE_MQ = window.matchMedia('(max-width: 760px)');
function isMobileView() { return GM_MOBILE_MQ.matches; }
// Combat and Trackers were merged into one tool; old saves may still say 'combat'.
function normalizeTool(t) { return t === 'combat' ? 'trackers' : t; }

// Tool catalog (order = the tool-picker menu order)
const TOOL_ORDER = ['adventure','maps','trackers','timers','notes','music','gen','party','message','rules','dice'];
const TOOL_LABELS = { adventure:'Adventure', maps:'Maps', trackers:'Combat', timers:'Timers', notes:'Notes', music:'Music', gen:'Generators', party:'Party', message:'Message', rules:'Rulebooks', dice:'Roll Log', vtt:'Map · VTT' };

// ── Dynamic windows ───────────────────────────────────────────────────────
// The GM screen is a row of independent "windows" (columns). Each window shows
// one tool and keeps its own DOM instance + state, so the same tool can be open
// in several windows at once. Windows can be added/removed freely.
let gmWindows = [];          // [{ id, tool }] in left-to-right order
const gmNodes = {};          // id -> { active, byTool: { toolType: node } }
let winSeq = 0;
function newWinId() { return 'w' + (++winSeq); }
const DEFAULT_WINDOWS = ['adventure','trackers','dice'];
const MAX_WINDOWS = 6;

// Clone a fresh, initialized DOM instance of a tool from its <template>.
function buildToolNode(toolType) {
  toolType = normalizeTool(toolType);
  const tpl = document.getElementById('tpl-' + toolType);
  const node = tpl.content.firstElementChild.cloneNode(true);
  instancePool.appendChild(node);   // init while attached (a couple of tools measure on init)
  const initFn = window['init_' + toolType];
  if(initFn) { try { initFn(node); } catch(e) { console.error('init failed for ' + toolType, e); } }
  else console.error('No init function found for tool: ' + toolType);
  return node;
}

// The node for a given tool inside a given window. Cached per (window, tool) so
// switching a window's tool and switching back keeps that tool's in-window state.
function getWinNode(winId, toolType) {
  toolType = normalizeTool(toolType);
  let cache = gmNodes[winId];
  if(!cache) cache = gmNodes[winId] = { active: null, byTool: {} };
  if(!cache.byTool[toolType]) cache.byTool[toolType] = buildToolNode(toolType);
  return cache.byTool[toolType];
}

// Legacy/entry-point helper: return a live node for a tool, preferring a window
// that already shows it. Falls back to a detached singleton (state restore, etc.).
function getOrCreateInstance(toolType) {
  toolType = normalizeTool(toolType);
  const w = gmWindows.find(x => x.tool === toolType);
  if(w) return getWinNode(w.id, toolType);
  if(!instances[toolType]) instances[toolType] = buildToolNode(toolType);
  return instances[toolType];
}

// Ensure some window is showing `toolType`, opening one if needed, and return its node.
// Used when generated content (maps, adventures, monsters) needs to land in a tool.
function ensureToolWindow(toolType) {
  toolType = normalizeTool(toolType);
  // Console view: route to the station that hosts the tool (e.g. a monster sent
  // to the tracker lands in the spine), rather than spawning a hidden window.
  if(document.body.dataset.cview === 'console') {
    const STATION_FOR = { trackers:'cbt', dice:'log', maps:'map', adventure:'adv' };
    for(const st of CONSOLE_STATIONS) {
      const cache = gmNodes['cst-' + st];
      if(cache && cache.active === toolType) return cache.byTool[toolType];
    }
    // Tools without a dedicated station (gen/party/notes/maps/rules) open as a
    // popup drawer instead, but generated content still needs a live node —
    // reuse the popup instance so what the GM sees is what gets updated.
    const st = STATION_FOR[toolType];
    if(st){ if(consoleMode==='combat' && toolType==='adventure'){/* adv hidden in combat, still update its node */} return getWinNode('cst-' + st, toolType); }
    if(!gmcPopNodes[toolType]) gmcPopNodes[toolType] = buildToolNode(toolType);
    return gmcPopNodes[toolType];
  }
  let w = gmWindows.find(x => x.tool === toolType);
  if(!w) w = addWindow(toolType);
  return getWinNode(w.id, toolType);
}

// Build a tool-picker <select> for a window.
function buildToolSelect(w) {
  const sel = document.createElement('select');
  sel.className = 'pane-select';
  sel.setAttribute('aria-label', 'Window tool');
  TOOL_ORDER.forEach(t => {
    const o = document.createElement('option');
    o.value = t; o.textContent = TOOL_LABELS[t];
    if(t === w.tool) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener('change', () => setWindowTool(w.id, sel.value));
  return sel;
}

// Build one window column (header + content) — the tool node is mounted after.
function buildWindowColumn(w) {
  const col = document.createElement('div');
  col.className = 'pane';
  col.id = 'win-' + w.id;

  const header = document.createElement('div');
  header.className = 'pane-header';
  header.appendChild(buildToolSelect(w));

  const toolbar = document.createElement('div');
  toolbar.className = 'pane-toolbar-slot';
  toolbar.id = 'win-' + w.id + '-toolbar';
  header.appendChild(toolbar);

  const close = document.createElement('button');
  close.className = 'win-close';
  close.type = 'button';
  close.title = 'Close window';
  close.setAttribute('aria-label', 'Close window');
  close.textContent = '✕';
  close.addEventListener('click', () => removeWindow(w.id));
  header.appendChild(close);

  const content = document.createElement('div');
  content.className = 'pane-content';
  content.id = 'win-' + w.id + '-content';

  col.appendChild(header);
  col.appendChild(content);
  return col;
}

// The canonical, shared instance of a tool — the SAME node the console stations
// and quick-tool popups use, so a Free-mode window shows the content the GM
// already loaded elsewhere (and vice-versa). Console tools live in their fixed
// station cache; everything else shares the popup instance.
const TOOL_HOME = { adventure:'cst-adv', maps:'cst-map', trackers:'cst-cbt', dice:'cst-log' };
function sharedToolNode(tool) {
  tool = normalizeTool(tool);
  if(TOOL_HOME[tool]) return getWinNode(TOOL_HOME[tool], tool);
  if(!gmcPopNodes[tool]) gmcPopNodes[tool] = buildToolNode(tool);
  return gmcPopNodes[tool];
}

// Mount a window's active tool node into its content area + clone its toolbar.
// The FIRST window of a given tool reuses the shared instance (content synced
// with the console); additional duplicate windows get their own instance.
function mountWindow(w) {
  const content = document.getElementById('win-' + w.id + '-content');
  const toolbarSlot = document.getElementById('win-' + w.id + '-toolbar');
  if(!content) return;
  const firstOfTool = gmWindows.find(x => x.tool === w.tool) === w;
  const node = firstOfTool ? sharedToolNode(w.tool) : getWinNode(w.id, w.tool);
  const cache = gmNodes[w.id];
  if(cache) cache.active = w.tool;

  if(node.parentElement !== content) content.appendChild(node);
  Array.from(content.children).forEach(c => c.classList.toggle('active', c === node));
  node.classList.add('active');

  if(toolbarSlot) {
    toolbarSlot.innerHTML = '';
    const tpl = node.querySelector('.toolbar-tpl');
    if(tpl) {
      Array.from(tpl.children).forEach(child => toolbarSlot.appendChild(child.cloneNode(true)));
      syncToolbar(toolbarSlot, node);
    }
  }
}

// Rebuild the whole window row (used on add/remove/restore).
function renderWindows() {
  const area = document.getElementById('main-area');
  if(!area) return;
  if(gmWindows.length === 0) gmWindows.push({ id: newWinId(), tool: 'adventure' });
  // Detach cached tool nodes back to the pool so innerHTML reset doesn't drop them.
  Object.values(gmNodes).forEach(cache => {
    Object.values(cache.byTool).forEach(n => { if(n.parentElement) instancePool.appendChild(n); });
  });
  Object.values(gmcPopNodes).forEach(n => { if(n && n.parentElement) instancePool.appendChild(n); });
  area.innerHTML = '';
  gmWindows.forEach(w => area.appendChild(buildWindowColumn(w)));

  // Layout: up to 4 windows sit in a single row; 5+ wrap into a grid so they
  // don't get too thin. Columns ≈ √count, capped at 4.
  const count = gmWindows.length;
  const gridMode = count > 4 && !isMobileView();
  area.classList.toggle('as-grid', gridMode);
  let cols = 0;
  if(gridMode) { cols = Math.min(4, Math.ceil(Math.sqrt(count))); area.style.setProperty('--gm-cols', cols); }
  else { area.style.removeProperty('--gm-cols'); }

  const narrow = !isMobileView() && (gridMode ? cols >= 3 : count >= 3);
  gmWindows.forEach(w => {
    mountWindow(w);
    const col = document.getElementById('win-' + w.id);
    if(col) col.classList.toggle('narrow', narrow);
  });
  updateWindowChrome();
}

// Enable/disable the close buttons (never let the last window be closed) and the
// add button (capped at MAX_WINDOWS).
function updateWindowChrome() {
  const only = gmWindows.length <= 1;
  document.querySelectorAll('.win-close').forEach(b => { b.disabled = only; b.style.display = only ? 'none' : ''; });
  const addBtn = document.getElementById('add-window-btn');
  if(addBtn) {
    const full = gmWindows.length >= MAX_WINDOWS;
    addBtn.disabled = full;
    addBtn.title = full ? 'Maximum of ' + MAX_WINDOWS + ' windows' : 'Add a window';
  }
}

function addWindow(tool) {
  if(gmWindows.length >= MAX_WINDOWS) return null;
  if(!tool) {
    // default to the first tool not already open, else Generators
    const open = new Set(gmWindows.map(w => w.tool));
    tool = TOOL_ORDER.find(t => !open.has(t)) || 'gen';
  }
  const w = { id: newWinId(), tool: normalizeTool(tool) };
  gmWindows.push(w);
  renderWindows();
  // scroll the new column into view on wide screens
  const col = document.getElementById('win-' + w.id);
  if(col && !isMobileView()) col.scrollIntoView({ behavior: 'smooth', inline: 'end', block: 'nearest' });
  if(window.__ddScheduleSave) window.__ddScheduleSave();
  return w;
}

function removeWindow(id) {
  if(gmWindows.length <= 1) return;               // keep at least one
  gmWindows = gmWindows.filter(w => w.id !== id);
  const cache = gmNodes[id];
  if(cache) { Object.values(cache.byTool).forEach(n => { if(n.parentElement) n.parentElement.removeChild(n); }); delete gmNodes[id]; }
  renderWindows();
  if(window.__ddScheduleSave) window.__ddScheduleSave();
}

function setWindowTool(id, tool) {
  const w = gmWindows.find(x => x.id === id);
  if(!w) return;
  w.tool = normalizeTool(tool);
  mountWindow(w);
  if(window.__ddScheduleSave) window.__ddScheduleSave();
}

// Rotating the phone / crossing the breakpoint re-applies narrow layout.
GM_MOBILE_MQ.addEventListener('change', () => renderWindows());

// ══════════════════════════════════════════════════════════════════════════
// GM CONSOLE — 3-ZONE LAYOUT. Fixed stations that reflow by MODE (Master /
// Prep / Explore / Combat / Downtime) like DaVinci Resolve pages or Premiere
// workspaces — a mode only shows/hides canvas stations; the top Monitor bar
// and bottom Command bar stay fixed. "Free" mode falls back to the old add/
// remove window system. Station tool nodes reuse the per-id instance cache
// used by windows (getWinNode), so each station keeps its own live state.
//
//   Canvas: [ Adventure ] | [ Map·VTT / Combat (center stack) ] | [ Roll Log ]
// ══════════════════════════════════════════════════════════════════════════
const CONSOLE_STATIONS = ['adv','map','cbt','log'];
const STATION_TOOL   = { adv:'adventure', map:'maps', cbt:'trackers', log:'dice' };
const STATION_TITLES = { adv:'Adventure', map:'Maps', cbt:'Combat', log:'Roll Log' };
// Each mode is a visibility map over the four stations. `tools` overrides which
// tool a station hosts in that mode, `titles` its header text. The center wrapper
// (#cst-center) is shown whenever either of its subs (map / cbt) is visible.
const CONSOLE_MODES = {
  explore:  { adv:1, map:1, cbt:0, log:1 },   // adventure + MAP (combat hidden) + roll log
  combat:   { adv:1, map:0, cbt:1, log:1 },   // adventure + COMBAT (map hidden) + roll log
  master:   { adv:1, map:1, cbt:1, log:1 },   // everything — the home layout
};
let consoleMode = 'master';
function stationToolFor(cfg, st){ return (cfg.tools && cfg.tools[st]) || STATION_TOOL[st]; }

function mountStation(stationId, tool) {
  const content = document.getElementById('cst-' + stationId + '-content');
  const toolbarSlot = document.getElementById('cst-' + stationId + '-toolbar');
  if(!content || !tool) return;
  const node = getWinNode('cst-' + stationId, tool);   // per-station instance + state
  const cache = gmNodes['cst-' + stationId];
  if(cache) cache.active = tool;
  if(node.parentElement !== content) content.appendChild(node);
  Array.from(content.children).forEach(c => c.classList.toggle('active', c === node));
  node.classList.add('active');
  if(toolbarSlot) {
    toolbarSlot.innerHTML = '';
    const tpl = node.querySelector('.toolbar-tpl');
    if(tpl) {
      Array.from(tpl.children).forEach(ch => toolbarSlot.appendChild(ch.cloneNode(true)));
      syncToolbar(toolbarSlot, node);
    }
  }
}

// Ensure every station's fixed tool is mounted in its content slot. Idempotent:
// a station is (re)mounted only when its node isn't currently in place. This is
// robust against a session restore that tears down gmNodes after the first
// mount — otherwise the canvas would read empty until a Free-mode toggle.
function ensureStationsMounted() {
  CONSOLE_STATIONS.forEach(st => {
    const tool = STATION_TOOL[st];
    const content = document.getElementById('cst-' + st + '-content');
    const cache = gmNodes['cst-' + st];
    const node = cache && cache.byTool && cache.byTool[tool];
    if(!content || !node || !content.contains(node)) mountStation(st, tool);
  });
}

function renderConsole(mode) {
  // Free & Prep modes were retired — fall back to the Master layout if an old
  // saved state or stale caller asks for them.
  const cfg = CONSOLE_MODES[mode] || CONSOLE_MODES.master;
  consoleMode = CONSOLE_MODES[mode] ? mode : 'master';
  document.body.dataset.cview = 'console';
  document.body.dataset.cmode = consoleMode;
  const ws = document.getElementById('console-workspace');
  const free = document.getElementById('main-area');
  if(ws) ws.style.display = '';
  if(free) free.style.display = 'none';

  // Show / hide each station for this mode, and mount its (possibly per-mode)
  // tool. Mounting only the visible stations keeps hidden ones untouched.
  CONSOLE_STATIONS.forEach(st => {
    const el = document.getElementById('cst-' + st);
    const visible = !!cfg[st];
    if(el) el.classList.toggle('collapsed', !visible);
    if(visible) {
      mountStation(st, stationToolFor(cfg, st));
      const titleEl = document.getElementById('cst-' + st + '-title');
      if(titleEl) titleEl.textContent = (cfg.titles && cfg.titles[st]) || STATION_TITLES[st];
    }
  });
  // The center wrapper collapses when both of its subs are hidden.
  const centerVis = !!(cfg.map || cfg.cbt);
  const center = document.getElementById('cst-center');
  if(center) center.classList.toggle('collapsed', !centerVis);

  // In the left column, let Adventure fill the width when the center is gone
  // (Prep / Downtime); otherwise clear the override so the CSS basis governs.
  // The Roll Log is a fixed-width right rail and is never grown.
  const adv = document.getElementById('cst-adv');
  if(adv) adv.style.flex = (!centerVis && cfg.adv) ? '1 1 auto' : '';

  document.querySelectorAll('.cmode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === consoleMode));
  if(window.__ddScheduleSave) window.__ddScheduleSave();
}

// Free mode = the add/remove window system (fallback + power users).
function setFreeView() {
  document.body.dataset.cview = 'free';
  document.body.dataset.cmode = 'free';
  const ws = document.getElementById('console-workspace');
  const free = document.getElementById('main-area');
  if(ws) ws.style.display = 'none';
  if(free) free.style.display = '';
  // detach station nodes so their tools are free to reuse (ensureStationsMounted
  // will re-mount them when a console mode is next shown).
  CONSOLE_STATIONS.forEach(st => {
    const cache = gmNodes['cst-' + st];
    if(cache) Object.values(cache.byTool).forEach(n => { if(n.parentElement) instancePool.appendChild(n); });
  });
  if(!gmWindows.length) DEFAULT_WINDOWS.forEach(t => gmWindows.push({ id: newWinId(), tool: t }));
  renderWindows();
  document.querySelectorAll('.cmode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === 'free'));
  document.getElementById('add-window-btn') && (document.getElementById('add-window-btn').style.display = '');
  if(window.__ddScheduleSave) window.__ddScheduleSave();
}

function setConsoleMode(mode) { renderConsole(mode); }

// ══════════════════════════════════════════════════════════════════════════
// ZONE 1b — MONITOR BAR: party bubbles, timers, auto-pinned scenes, clock.
// ZONE 3 quick-tool + character/timer POPUPS.
// ══════════════════════════════════════════════════════════════════════════
let gmcAutoCombat = true;
let gmcAutoedFight = false;
let gmcRestored = false;   // true once a saved layout has been restored, so bootstrap won't override it
let gmcRoster = [];        // last published roster (so a bubble click can open its detail)
let gmcCharPopIdx = null;  // which roster index the popup is showing (for live refresh)
const gmcStart = Date.now();

function gmcInitials(name){
  const p = String(name||'').trim().split(/\s+/);
  return ((p[0]||'')[0]||'') + (p.length>1 ? (p[p.length-1][0]||'') : (p[0]||'')[1]||'');
}
function gmcHpPct(hp){
  if(!hp) return null;
  let m = String(hp).match(/(\d+)\s*\/\s*(\d+)/);
  if(m){ const a=+m[1], b=+m[2]; return b>0 ? Math.max(0,Math.min(100,Math.round(a/b*100))) : 0; }
  m = String(hp).match(/(\d+)\s*%/);
  if(m) return Math.max(0,Math.min(100,+m[1]));
  return null;
}
function gmcHpColor(pct){
  if(pct==null) return 'var(--accent-dim)';
  if(pct<=0) return '#3a3a3a';
  if(pct<=25) return '#d63a30';
  if(pct<=50) return '#c08020';
  if(pct<=75) return '#c8a020';
  return '#4caf50';
}
function esc2(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ── Party BUBBLES — always-on, click a bubble for its detail popup. ──
function renderPartyStrip(roster){
  const el = document.getElementById('gmc-party-bubbles');
  if(!el) return;
  roster = roster || window.GM_ROSTER || [];
  gmcRoster = roster;
  if(!roster.length){ el.innerHTML = '<div class="party-empty" id="party-empty">Link a campaign to see your party</div>'; return; }
  el.innerHTML = roster.map((pc,i) => {
    const pct = gmcHpPct(pc.hp);
    const down = pct != null && pct <= 0;
    const bloodied = pct != null && pct > 0 && pct <= 40;
    const barW = pct==null ? 100 : Math.max(4,pct);
    const hpText = pc.hp || '';
    const wound = pc.wound || '';   // wounds-as-health systems (SW, D62e) show status here
    // Row 3 = stat details: the defense/AC chip first, then everything else.
    const chips = [];
    if(pc.ac) chips.push({ label: pc.acLabel || 'AC', value: pc.ac });
    (pc.extra || []).forEach(c => { if(c && (c.label || c.value)) chips.push(c); });
    // Health row: HP bar when we have an HP figure; otherwise a wound-status pill
    // for wound systems; otherwise an empty dash.
    let hpRow;
    if(hpText) hpRow = '<div class="bub-hpb"><i style="width:'+barW+'%;background:'+gmcHpColor(pct)+'"></i><span class="bub-hpt">'+esc2(hpText)+'</span></div>';
    else if(wound) hpRow = '<div class="bub-hpb bub-wound"><span class="bub-hpt">'+esc2(wound)+'</span></div>';
    else hpRow = '<div class="bub-hpb empty"><span class="bub-hpt bub-hpt-none">—</span></div>';
    // Consistent 3-row stack: identity · health · stat chips.
    return '<div class="bubble'+(down?' down':'')+(bloodied?' bloodied':'')+'" onclick="charPop('+i+')" title="'+esc2(pc.name)+'">'
      + '<div class="bub-id"><span class="bub-nm">'+esc2(pc.name)+'</span>'+(pc.sub?'<span class="bub-sub">'+esc2(pc.sub)+'</span>':'')+'</div>'
      + hpRow
      + (chips.length ? '<div class="bub-r3">'+chips.map(c=>'<span class="bub-chip">'+(c.label?'<em>'+esc2(c.label)+'</em>':'')+(c.value?esc2(c.value):'')+'</span>').join('')+'</div>' : '<div class="bub-r3 bub-r3-empty">—</div>')
      + '</div>';
  }).join('');
}
document.addEventListener('gm-roster', e => renderPartyStrip(e.detail));

// ── Timers — mirror the standalone Timers tool into the monitor bar. ──
function gmcTimersState(){
  const node = gmcPopNodes && gmcPopNodes['timers'];
  if(node && node._getState){ try { return node._getState(); } catch(e){} }
  return null;
}
function renderTimers(){
  const el = document.getElementById('gmc-timers');
  if(!el) return;
  const st = gmcTimersState();
  const timers = (st && st.timers) || [];
  if(!timers.length){ el.innerHTML = ''; return; }
  el.innerHTML = timers.map(t => {
    if(t.kind === 'round'){
      const zero = t.remainingRounds <= 0;
      return '<div class="timer'+(zero?' zero':'')+'" onclick="openTool(\'timers\')" title="Open Timers">'
        + '<div><div class="tl">'+esc2(t.name||'Rounds')+'</div><div class="tv">'+t.remainingRounds+' rd</div></div></div>';
    }
    const secs = t.remainingSeconds != null ? t.remainingSeconds : (t.totalSeconds || 0);
    const m = Math.floor(Math.max(0,secs)/60), s = Math.max(0,secs)%60;
    const zero = secs <= 0;
    return '<div class="timer'+(zero?' zero':'')+'" onclick="openTool(\'timers\')" title="Open Timers">'
      + '<div><div class="tl">'+esc2(t.name||'Timer')+'</div>'
      + '<div class="tv">'+m+':'+String(s).padStart(2,'0')+'</div></div></div>';
  }).join('');
}

// ── Scenes — auto-pin every scene as a one-tap toggle in the monitor bar. ──
function renderScenes(){
  const el = document.getElementById('gmc-scenes');
  if(!el || !window.GMScenes) return;
  const list = GMScenes.list() || [];
  if(!list.length){ el.innerHTML = ''; return; }
  el.innerHTML = list.map(sc => {
    const on = GMScenes.isPlaying(sc.id);
    return '<button class="scene'+(on?' playing':'')+'" type="button" data-scene="'+esc2(sc.id)+'">'
      + '<span class="sdot"></span>'+esc2(sc.name)+'</button>';
  }).join('');
}
function wireScenes(){
  const el = document.getElementById('gmc-scenes');
  if(!el || el._wired) return; el._wired = true;
  el.addEventListener('click', e => {
    const btn = e.target.closest('[data-scene]');
    if(!btn || !window.GMScenes) return;
    GMScenes.toggle(parseInt(btn.dataset.scene, 10));
    renderScenes();
  });
}

function gmcTrackerState(){
  const cache = gmNodes['cst-cbt'];
  const node = cache && cache.byTool && cache.byTool['trackers'];
  if(node && node._getState){ try { return node._getState(); } catch(e){} }
  return null;
}
function gmcCombatNode(){
  // Build-on-demand so the Monitor bar's round controls work even when the
  // combat station was never mounted (a board saved in a combat-less mode, or
  // a Free-mode board). sharedToolNode caches under gmNodes['cst-cbt'], so the
  // combat station reuses this exact instance when it does mount.
  try { const n = sharedToolNode('trackers'); if(n) return n; } catch(e){}
  const cache = gmNodes['cst-cbt'];
  return cache && cache.byTool && cache.byTool['trackers'];
}

// ── Round control (Monitor bar): advance the combat round + step round timers. ──
function gmcNextRound(){
  const cbt = gmcCombatNode();
  if(cbt && cbt._nextRound) { try { cbt._nextRound(); } catch(e){} }
  const tmr = gmcPopNodes && gmcPopNodes['timers'];
  if(tmr && tmr._stepRounds) { try { tmr._stepRounds(); } catch(e){} }
  try { renderTimers(); } catch(e){}
  gmcUpdateRound();
}
function gmcResetRounds(){
  const cbt = gmcCombatNode();
  if(cbt && cbt._resetRound) { try { cbt._resetRound(); } catch(e){} }
  const tmr = gmcPopNodes && gmcPopNodes['timers'];
  if(tmr && tmr._resetRounds) { try { tmr._resetRounds(); } catch(e){} }
  try { renderTimers(); } catch(e){}
  gmcUpdateRound();
}
function gmcUpdateRound(){
  const el = document.getElementById('gmc-round-num');
  if(!el) return;
  const cbt = gmcCombatNode();
  let r = 1;
  if(cbt && cbt._getRound){ try { r = cbt._getRound() || 1; } catch(e){} }
  el.textContent = r;
}

// ══════════════════════════════════════════════════════════════════════════
// POPUPS / DRAWERS — quick tools mount a real live tool instance; character &
// timer taps render a lightweight detail card.
// ══════════════════════════════════════════════════════════════════════════
function showGmcPop(title, html, opts){
  opts = opts || {};
  const ttl = document.getElementById('gmc-pop-ttl');
  const body = document.getElementById('gmc-pop-body');
  const pop = document.getElementById('gmc-popup');
  const scrim = document.getElementById('gmc-scrim');
  if(ttl) ttl.textContent = title || '';
  if(body){
    body.classList.toggle('tool-host', !!opts.toolHost);
    body.classList.toggle('msg-only', !!opts.msgOnly);
    if(html != null) body.innerHTML = html;
  }
  if(pop){ pop.classList.toggle('wide', !!opts.wide); pop.classList.toggle('xwide', !!opts.xwide); pop.classList.toggle('tall', !!opts.tall); }
  // The toolbar area is cleared here; openTool repopulates it from the mounted tool.
  const tb = document.getElementById('gmc-pop-toolbar');
  if(tb) tb.innerHTML = '';
  if(scrim){ scrim.classList.toggle('drawer', !!opts.drawer); scrim.classList.add('show'); }
}
function closeGmcPop(){
  const scrim = document.getElementById('gmc-scrim');
  if(scrim) scrim.classList.remove('show');
  gmcCharPopIdx = null;   // popup closed — stop live-refreshing any character card
  const tb = document.getElementById('gmc-pop-toolbar');
  if(tb) tb.innerHTML = '';
  // detach any mounted tool node back to the pool so it can be reopened.
  const body = document.getElementById('gmc-pop-body');
  if(body && body.classList.contains('tool-host')){
    Array.from(body.children).forEach(n => { if(instancePool) instancePool.appendChild(n); });
  }
}

// Clone a mounted tool's toolbar into the popup header so its controls
// (generator type/count/roll, notes actions, …) are usable from the window.
function fillPopToolbar(node){
  const tb = document.getElementById('gmc-pop-toolbar');
  if(!tb || !node) return;
  tb.innerHTML = '';
  const tpl = node.querySelector('.toolbar-tpl');
  if(tpl){
    Array.from(tpl.children).forEach(ch => tb.appendChild(ch.cloneNode(true)));
    try { syncToolbar(tb, node); } catch(e) {}
  }
}

// Quick tools open a real, live tool instance as a FULL-HEIGHT window.
const POP_TOOL = { gen:'gen', timers:'timers', music:'music', notes:'notes', message:'message', party:'party', rules:'rules', cbt:'trackers' };
const POP_WIDE = { gen:1, rules:1 };   // tools that read better in a wider window
const POP_XWIDE = { music:1 };          // music needs room for the Sound Library column too
const gmcPopNodes = {};
function openTool(k){
  const tool = normalizeTool(POP_TOOL[k] || k);
  const body = document.getElementById('gmc-pop-body');
  if(!body) return;
  if(!gmcPopNodes[tool]) gmcPopNodes[tool] = buildToolNode(tool);
  const node = gmcPopNodes[tool];
  // Message is a compact composer — size the window to the tool, not full height.
  const compact = (tool === 'message');
  showGmcPop(TOOL_LABELS[tool] || tool, null, { tall:!compact, toolHost:!compact, wide:!!POP_WIDE[k], xwide:!!POP_XWIDE[k] });
  body.innerHTML = '';
  node.classList.add('active');
  body.appendChild(node);
  fillPopToolbar(node);
}

// A party bubble opens that character's actual Party-tool card (cloned so it
// reads identically), expanded, in a full-height window.
function charPop(i){
  const body = document.getElementById('gmc-pop-body');
  if(!body) return;
  const partyNode = gmcPopNodes['party'];
  const cards = partyNode ? partyNode.querySelectorAll('.pty-list .pty-card') : [];
  const src = cards[i];
  const p = gmcRoster[i] || (window.GM_ROSTER||[])[i] || {};
  const title = p.name || (src && src.querySelector('.pty-name') ? src.querySelector('.pty-name').textContent : 'Character');
  if(src){
    const clone = src.cloneNode(true);
    clone.classList.add('open');                                   // show the full card body
    const rm = clone.querySelector('[data-remove]'); if(rm) rm.remove();
    showGmcPop(title, '', { tall:true });
