    body.classList.remove('tool-host','msg-only');
    body.innerHTML = '';
    body.appendChild(clone);
    gmcCharPopIdx = i;   // remember it so live syncs refresh the open card
    return;
  }
  // No synced card yet — fall back to a compact live-stats card.
  const pct = gmcHpPct(p.hp);
  const barW = pct==null ? 100 : Math.max(4,pct);
  const sub = [p.sub, p.ac ? ((p.acLabel||'AC')+' '+p.ac) : ''].filter(Boolean).join(' · ');
  const html = ''
    + '<div class="pchar-hd"><div class="pchar-av">'+esc2(gmcInitials(title).toUpperCase())+'</div>'
    + '<div><div class="pchar-nm">'+esc2(title)+'</div>'+(sub?'<div class="pchar-sub">'+esc2(sub)+'</div>':'')+'</div></div>'
    + '<div class="hpctl"><div class="hpbar"><i style="width:'+barW+'%;background:'+gmcHpColor(pct)+'"></i>'
    + '<div class="t">'+esc2(p.hp||'—')+'</div></div></div>'
    + '<div class="pline" style="color:var(--muted)">Sync a character sheet (Party tool) to see the full card here.</div>';
  showGmcPop(title, html, {});
}

// When a live party sync republishes the roster, refresh an open character
// popup in place so its HP/stats update without the user reopening it. Only
// touches the DOM when the freshly-built card actually differs (avoids churn
// and preserves any expanded ⓘ detail on an unchanged poll).
function gmcRefreshCharPop(){
  if(gmcCharPopIdx == null) return;
  const body = document.getElementById('gmc-pop-body');
  if(!body) return;
  const open = body.querySelector('.pty-card.open');
  if(!open) return;   // popup no longer showing a character card
  const partyNode = gmcPopNodes['party'];
  const cards = partyNode ? partyNode.querySelectorAll('.pty-list .pty-card') : [];
  const src = cards[gmcCharPopIdx];
  if(!src) return;
  const clone = src.cloneNode(true);
  clone.classList.add('open');
  const rm = clone.querySelector('[data-remove]'); if(rm) rm.remove();
  if(clone.outerHTML === open.outerHTML) return;   // nothing changed
  open.replaceWith(clone);
}
document.addEventListener('gm-roster', gmcRefreshCharPop);

// A player card opened in the popup (charPop) is a clone that lives OUTSIDE the
// Party tool's list, so the list's delegated click handler never sees it. Wire
// the inline "ⓘ" spell/condition/skill detail toggles here so they work in the
// popup too. (The MMRPG ⓘ popover is already handled document-wide.) Scoped to
// the clicked button's own card so it toggles the popup's copy, not the list's.
(function(){
  const pb = document.getElementById('gmc-pop-body');
  if(!pb) return;
  pb.addEventListener('click', function(e){
    const info = e.target.closest && e.target.closest('.pty-spell-info');
    if(!info) return;
    e.stopPropagation();
    const scope = info.closest('.pty-card') || pb;
    const desc = scope.querySelector('.pty-spell-desc[data-desc="' + (info.dataset.spell || '') + '"]');
    if(desc) desc.style.display = desc.style.display === 'none' ? 'block' : 'none';
  });
})();

function gmcTick(){
  // session clock
  const clk = document.getElementById('tel-clock');
  if(clk){ const s = Math.floor((Date.now()-gmcStart)/1000); const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), ss=s%60;
    clk.textContent = h>0 ? (h+':'+String(m).padStart(2,'0')) : (m+':'+String(ss).padStart(2,'0')); }
  // system label
  const sysEl = document.getElementById('tel-sys');
  if(sysEl){ const sys = (typeof window.GM_SYSTEM==='string'?window.GM_SYSTEM:''); sysEl.textContent = (sys? sys+' · ':'') + 'GM Console'; }
  // monitor-bar timers + scenes + round reflect live tool state
  try { renderTimers(); } catch(e) {}
  try { renderScenes(); } catch(e) {}
  try { gmcUpdateRound(); } catch(e) {}
  // (Modes only change when the GM clicks — no automatic swapping.)
}
setInterval(gmcTick, 1000);


// Load generated content into a tool WITHOUT pulling the current pane off the
// Generators. If a visible pane already shows the target tool, use it. Else, in
// a multi-pane view, take another visible pane. Only in single view do we swap
// the generator pane itself.

// Combat and Trackers are now ONE tool with a single ordered list. Older saves
// may hold {round, trackers} under 'trackers' and/or {npcs} under 'combat' —
// fold both into the unified 'trackers' state.
function migrateToolState(tools) {
  if(!tools) return tools;
  const t = tools.trackers, c = tools.combat;
  if(!c && !(t && (t.trackers || t.npcs))) return tools;

  const merged = { round: (t && t.round) || (c && c.round) || 1, items: [] };
  if(t && Array.isArray(t.items)) merged.items = t.items.slice();
  else {
    (((t && t.trackers) || (c && c.trackers) || [])).forEach(x => merged.items.push({ ...x, type: 'tracker' }));
    (((c && c.npcs) || (t && t.npcs) || [])).forEach(x => merged.items.push({ ...x, type: 'npc' }));
  }
  // Re-key ids so a tracker and an NPC that shared id 1 don't collide
  let id = 1;
  merged.items.forEach(x => { x.id = id++; });
  tools.trackers = merged;
  delete tools.combat;
  return tools;
}

// Push generated content (an adventure doc, a map image, …) into a tool,
// opening a window for it if none is showing it.
function loadIntoTool(tool, dataUrl, fileName) {
  const node = ensureToolWindow(tool);
  setTimeout(() => { if(node && node._loadDataUrl) node._loadDataUrl(dataUrl, fileName); }, 150);
}

// Wire cloned toolbar elements to the live tool instance elements.
// Each cloned element gets its events proxied to the matching live element.
function syncToolbar(slot, toolNode) {
  // Listeners/observers attached to the CLONE die with it on the next render,
  // but anything attached to the LIVE tool node (which persists across pane
  // re-renders) used to accumulate — one more observer + change listener per
  // view switch, forever. Tear down the previous call's live-node attachments
  // before adding this call's.
  if(toolNode._toolbarCleanup) toolNode._toolbarCleanup();
  const _cleanups = [];
  toolNode._toolbarCleanup = () => {
    _cleanups.forEach(fn => { try { fn(); } catch(e) {} });
    toolNode._toolbarCleanup = null;
  };

  // Map by class selector — each cloned element routes to its live twin
  const pairs = [
    // doc tools
    ['.doc-file-input', null],            // handled via label click below
    ['.doc-load-prep', '.doc-load-prep'], // adventure: open session-prep picker
    ['.doc-zoom-out',  '.doc-zoom-out'],
    ['.doc-zoom-in',   '.doc-zoom-in'],
    ['.doc-clear',     '.doc-clear'],
    // trackers + combat — handled by document-level delegation in init_trackers
    ['.cbt-next-round', null],
    ['.cbt-reset',      null],
    // notes
    ['.nts-export',    '.nts-export'],
    ['.nts-clear',     '.nts-clear'],
    ['.nts-md-toggle', '.nts-md-toggle'],
    // dice
    ['.dice-clear',    '.dice-clear'],
    // generators
    ['.gen-roll',      '.gen-roll'],
    ['.mus-stopall',   '.mus-stopall'],
    // party
    ['.pty-sync',      '.pty-sync'],
    ['.pty-clear',     '.pty-clear'],
    // rulebooks
    ['.rul-refresh',   '.rul-refresh'],
    // timers
    ['.tmr-add-time',  '.tmr-add-time'],
    ['.tmr-add-round', '.tmr-add-round'],
    ['.tmr-next-round', '.tmr-next-round'],
    ['.tmr-reset-rounds', '.tmr-reset-rounds'],
  ];

  pairs.forEach(([cloneSelector, liveSelector]) => {
    if(!liveSelector) return;
    slot.querySelectorAll(cloneSelector).forEach(cloneEl => {
      const liveEl = toolNode.querySelector(liveSelector);
      if(!liveEl) return;
      if(cloneEl.tagName === 'BUTTON') {
        cloneEl.addEventListener('click', () => {
          liveEl.click();
          // Mirror active state back to clone (e.g. MD toggle)
          if(liveEl.classList.contains('active')) cloneEl.classList.add('active');
          else cloneEl.classList.remove('active');
        });
      }
    });
  });

  // File input: label wraps input in clone — clicking the label opens the live file input
  const cloneLabel = slot.querySelector('label.btn');
  if(cloneLabel) {
    const liveInput = toolNode.querySelector('.doc-file-input');
    if(liveInput) {
      cloneLabel.addEventListener('click', e => {
        e.preventDefault();
        liveInput.click();
      });
      // Update filename display in clone when a file is picked
      const onLivePick = () => {
        const cloneFilename = slot.querySelector('.doc-filename');
        const liveFilename = toolNode.querySelector('.doc-filename');
        if(cloneFilename && liveFilename) {
          // Mirror after a tick so liveFilename has been updated
          setTimeout(() => {
            cloneFilename.textContent = liveFilename.textContent;
            const cloneControls = slot.querySelector('.doc-controls');
            const liveControls = toolNode.querySelector('.doc-controls');
            if(cloneControls && liveControls) {
              cloneControls.style.display = liveControls.style.display;
            }
          }, 200);
        }
      };
      liveInput.addEventListener('change', onLivePick);
      _cleanups.push(() => liveInput.removeEventListener('change', onLivePick));
    }
  }

  // Party file picker: the cloned label opens the live input
  const clonePtyInput = slot.querySelector('.pty-file-input');
  const livePtyInput  = toolNode.querySelector('.pty-file-input');
  if(clonePtyInput && livePtyInput) {
    const lbl = clonePtyInput.closest('label');
    if(lbl) lbl.addEventListener('click', e => { e.preventDefault(); livePtyInput.click(); });
  }

  // Rulebooks: mirror the live "open in new tab" link onto the cloned one
  const cloneOpen = slot.querySelector('.rul-newtab');
  const liveOpen  = toolNode.querySelector('.rul-newtab');
  if(cloneOpen && liveOpen) {
    const mirror = () => { cloneOpen.href = liveOpen.href; cloneOpen.style.display = liveOpen.style.display; };
    mirror();
    toolNode.addEventListener('rul-book-change', mirror);
    _cleanups.push(() => toolNode.removeEventListener('rul-book-change', mirror));
  }

  // Notes import: cloned label click triggers live file input
  // Generator tabs: wire each clone tab to its live counterpart by data-tab
  slot.querySelectorAll('.gen-tab-select').forEach(cloneSel => {
    const liveSel = toolNode.querySelector('.gen-tab-select');
    if(!liveSel) return;
    cloneSel.value = liveSel.value;
    cloneSel.addEventListener('change', () => {
      liveSel.value = cloneSel.value;
      liveSel.dispatchEvent(new Event('change'));
    });
  });

  const cloneImportLabel = slot.querySelector('label:has(.nts-import-input)');
  const liveImportInput = toolNode.querySelector('.nts-import-input');
  if(cloneImportLabel && liveImportInput) {
    cloneImportLabel.addEventListener('click', e => {
      e.preventDefault();
      liveImportInput.click();
    });
  }

  // Notes saved indicator: mirror via MutationObserver
  const cloneSaved = slot.querySelector('.nts-saved-indicator');
  const liveSaved = toolNode.querySelector('.nts-saved-indicator');
  if(cloneSaved && liveSaved) {
    const obs = new MutationObserver(() => {
      cloneSaved.textContent = liveSaved.textContent;
      cloneSaved.className = liveSaved.className;
    });
    obs.observe(liveSaved, { attributes: true, childList: true, characterData: true, subtree: true });
    _cleanups.push(() => obs.disconnect());
  }
}
</script>

<script>
// ══════════════════════════════════════════
// DOCUMENT VIEWER (Adventure + Maps share this)
// ══════════════════════════════════════════
function initDocTool(root) {
  const fileInput = root.querySelector('.doc-file-input');
  const filenameEl = root.querySelector('.doc-filename');
  const emptyEl = root.querySelector('.doc-empty');
  const frameWrap = root.querySelector('.doc-frame-wrap');
  const controls = root.querySelector('.doc-controls');
  const zoomInBtn = root.querySelector('.doc-zoom-in');
  const zoomOutBtn = root.querySelector('.doc-zoom-out');
  const clearBtn = root.querySelector('.doc-clear');
  const isMaps = root.dataset.tool === 'maps';

  let zoom = 1;
  let mediaEl = null;
  let mediaType = null;
  let naturalW = 0, naturalH = 0;
  let savedFileName = '';
  let savedDataUrl = ''; // base64 data URL stored for _getState
  let htmlScaler = null; // wrapper that gives the scaled iframe a real layout box
  let restoreZoom = null; // zoom to apply once an html doc finishes loading
  const HTML_BASE_W = 900; // logical width for two-column (fixed) builder layout
  let htmlFlow = false;    // true when the embedded builder should render single-column
  let htmlFlowSent = null; // last flow value posted to the iframe (avoid spamming)

  // Does this doc pane want the single-column (flow) rendering? Yes only when the
  // pane is cramped — the 4-panel view, or the stacked side panes in Focus. The
  // wider views (Single / Split / Focus main) get the two-column desktop layout.
  function paneWantsFlow() {
    // Mobile collapses to one full-width column regardless of pane — always flow.
    if(typeof isMobileView === 'function' && isMobileView()) return true;
    // Desktop: trust the layout's own "cramped pane" flag. It marks exactly the
    // 4-panel panes and the stacked Focus side panes as narrow; Single, Split,
    // and the Focus main pane are not, so they get the two-column layout.
    const pane = root.closest('.pane, .csub, .cstation');
    // Console canvas stations are single-column columns — always render flow so
    // session-prep text stays readable (never the shrunk two-column desktop layout).
    if(pane && (pane.classList.contains('cstation') || pane.classList.contains('csub'))) return true;
    if(pane) return pane.classList.contains('narrow');
    // No pane ancestor (unusual embedding): fall back to a conservative width.
    return frameWrap.clientWidth > 0 && frameWrap.clientWidth < 420;
  }

  // Tell the embedded builder which column layout to use (it re-flows itself).
  function sendFlow(flow) {
    if(htmlFlowSent === flow) return;
    htmlFlowSent = flow;
    try {
      if(mediaEl && mediaEl.contentWindow) {
        mediaEl.contentWindow.postMessage({ type: 'dd-flow', flow: flow }, '*');
      }
    } catch(e) { /* cross-origin can't happen here (same-origin doc) */ }
  }

  function applyZoom() {
    if(!mediaEl) return;
    if(mediaType === 'image' && naturalW) {
      mediaEl.style.width = (naturalW * zoom) + 'px';
      mediaEl.style.height = (naturalH * zoom) + 'px';
    } else if(mediaType === 'html' && htmlScaler) {
      const wrapW = Math.max(1, frameWrap.clientWidth);
      const wrapH = Math.max(0, frameWrap.clientHeight);
      if(htmlFlow) {
        // Single-column: render the iframe at the pane's own width so text is at
        // a natural, readable size (no shrink-to-fit). The +/- buttons still zoom
        // from there via the transform.
        const logicalW = Math.max(280, wrapW / zoom);
        mediaEl.style.width = logicalW + 'px';
        mediaEl.style.height = (wrapH / zoom) + 'px';
        mediaEl.style.transform = 'scale(' + zoom + ')';
        mediaEl.style.transformOrigin = 'top left';
        htmlScaler.style.width = (logicalW * zoom) + 'px';
        htmlScaler.style.height = wrapH + 'px';
      } else {
        // Two-column: fixed logical width magnified by a transform to fit the pane.
        mediaEl.style.width = HTML_BASE_W + 'px';
        mediaEl.style.height = (wrapH / zoom) + 'px';
        mediaEl.style.transform = 'scale(' + zoom + ')';
        mediaEl.style.transformOrigin = 'top left';
        htmlScaler.style.width = (HTML_BASE_W * zoom) + 'px';
        htmlScaler.style.height = wrapH + 'px';
      }
    }
  }

  // Fit the logical page width into the current pane, choosing column layout by
  // pane size and telling the embedded builder which to render.
  function fitHtml() {
    htmlFlow = paneWantsFlow();
    sendFlow(htmlFlow);
    const wrapW = Math.max(1, frameWrap.clientWidth);
    if(htmlFlow) {
      // Native size (single column already fits the pane width).
      zoom = 1;
    } else {
      zoom = Math.min(1.5, Math.max(0.3, wrapW / HTML_BASE_W));
    }
    applyZoom();
  }

  zoomInBtn.addEventListener('click', () => {
    if(mediaType === 'image') { zoom = Math.min(4, zoom + 0.1); applyZoom(); }
    else if(mediaType === 'html') { zoom = Math.min(3, zoom + 0.15); applyZoom(); }
  });
  zoomOutBtn.addEventListener('click', () => {
    if(mediaType === 'image') { zoom = Math.max(0.05, zoom - 0.1); applyZoom(); }
    else if(mediaType === 'html') { zoom = Math.max(0.3, zoom - 0.15); applyZoom(); }
  });

  // Maps: scroll-wheel to zoom (centred on the cursor) and drag to pan the map
  // freely inside the tool, like a proper battle-map canvas.
  if(isMaps) {
    frameWrap.addEventListener('wheel', e => {
      if(mediaType !== 'image' || !naturalW) return;
      e.preventDefault();
      const rect = frameWrap.getBoundingClientRect();
      const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
      const imgX = (frameWrap.scrollLeft + cx) / zoom;
      const imgY = (frameWrap.scrollTop + cy) / zoom;
      zoom = Math.max(0.05, Math.min(8, zoom * (e.deltaY < 0 ? 1.12 : 1/1.12)));
      applyZoom();
      frameWrap.scrollLeft = imgX * zoom - cx;
      frameWrap.scrollTop  = imgY * zoom - cy;
    }, { passive: false });
    let dragging = false, sx = 0, sy = 0, sl = 0, st = 0;
    frameWrap.addEventListener('pointerdown', e => {
      if(mediaType !== 'image') return;
      dragging = true; sx = e.clientX; sy = e.clientY; sl = frameWrap.scrollLeft; st = frameWrap.scrollTop;
      frameWrap.classList.add('grabbing');
      try { frameWrap.setPointerCapture(e.pointerId); } catch(_) {}
    });
    frameWrap.addEventListener('pointermove', e => {
      if(!dragging) return;
      frameWrap.scrollLeft = sl - (e.clientX - sx);
      frameWrap.scrollTop  = st - (e.clientY - sy);
    });
    const endDrag = e => { if(!dragging) return; dragging = false; frameWrap.classList.remove('grabbing'); try { frameWrap.releasePointerCapture(e.pointerId); } catch(_) {} };
    frameWrap.addEventListener('pointerup', endDrag);
    frameWrap.addEventListener('pointercancel', endDrag);
    frameWrap.addEventListener('pointerleave', endDrag);
  }

  // Keep an html doc filling the pane when it resizes (split changes, etc.)
  if(typeof ResizeObserver !== 'undefined') {
    let rzTimer = null;
    const ro = new ResizeObserver(() => {
      if(mediaType !== 'html') return;
      clearTimeout(rzTimer);
      rzTimer = setTimeout(() => {
        // A view-mode change flips the pane's .narrow state. Only when the
        // single/two-column choice actually changes do we re-fit (which resets
        // zoom); otherwise just re-apply so a manual zoom survives a plain resize.
        if(paneWantsFlow() !== htmlFlow) fitHtml();
        else applyZoom();
      }, 100);
    });
    ro.observe(frameWrap);
  }

  function clearDoc() {
    frameWrap.innerHTML = '';
    frameWrap.style.display = 'none';
    frameWrap.classList.remove('pdf-mode', 'html-mode', 'maps-mode', 'grabbing');
    emptyEl.style.display = 'flex';
    controls.style.display = 'none';
    filenameEl.textContent = isMaps ? 'No map loaded' : 'No document loaded';
    fileInput.value = '';
    mediaEl = null; mediaType = null; naturalW = 0; naturalH = 0;
    htmlScaler = null; restoreZoom = null;
    savedFileName = ''; savedDataUrl = '';
  }

  clearBtn.addEventListener('click', clearDoc);

  // Core loader — works from either a File object or a pre-existing data URL
  function loadFromDataUrl(dataUrl, fileName) {
    const ext = fileName.split('.').pop().toLowerCase();
    filenameEl.textContent = fileName;
    emptyEl.style.display = 'none';
    frameWrap.style.display = 'flex';
    controls.style.display = 'flex';
    frameWrap.innerHTML = '';
    frameWrap.classList.remove('pdf-mode', 'html-mode');
    htmlScaler = null;
    zoom = 1;
    naturalW = 0; naturalH = 0;
    savedFileName = fileName;
    savedDataUrl = dataUrl;

    if(ext === 'html' || ext === 'htm') {
      // Zoomable HTML doc (e.g. a saved session prep). Wide panes render the
      // builder's two-column desktop layout scaled to fit; cramped panes (4-panel,
      // Focus side panes) tell the builder to reflow to a single column at the
      // pane's own width. A CSS transform handles zoom; the scaler wrapper gives
      // the iframe a scrollable layout box.
      mediaType = 'html';
      frameWrap.classList.add('html-mode');
      const scaler = document.createElement('div');
      scaler.className = 'doc-html-scaler';
      const el = document.createElement('iframe');
      el.className = 'doc-frame html-frame';
      el.src = dataUrl;
      el.style.border = 'none';
      scaler.appendChild(el);
      frameWrap.appendChild(scaler);
      mediaEl = el;
      htmlScaler = scaler;
      htmlFlowSent = null; // new doc: force the flow signal to be re-sent
      zoomInBtn.style.display = '';
      zoomOutBtn.style.display = '';
      el.addEventListener('load', () => {
        if(restoreZoom != null) { zoom = restoreZoom; restoreZoom = null; applyZoom(); }
        else fitHtml();
        // The iframe registers its message listener during its own load-time
        // script; re-post the flow signal a couple of times to beat that race.
        htmlFlowSent = null; sendFlow(htmlFlow);
        setTimeout(() => sendFlow(htmlFlow), 120);
        setTimeout(() => sendFlow(htmlFlow), 400);
      });
      // Apply an initial fit even before load in case the pane is already sized
      setTimeout(() => { if(mediaType === 'html' && restoreZoom == null) fitHtml(); }, 60);
    } else if(ext === 'pdf') {
      mediaType = 'pdf';
      frameWrap.classList.add('pdf-mode');
      // On mobile, use <object> which lets the browser's PDF viewer scroll naturally.
      // On desktop, iframe fills the pane with the native viewer.
      const isMobile = window.innerWidth <= 760;
      let el;
      if(isMobile) {
        el = document.createElement('object');
        el.type = 'application/pdf';
        el.data = dataUrl;
        el.className = 'doc-frame pdf-frame';
        el.style.width = '100%';
        el.style.height = '100%';
        // Fallback text inside object tag
        el.innerHTML = '<p style="color:#aaa;padding:16px;">PDF cannot be displayed. <a href="' + dataUrl + '" target="_blank" style="color:#e8c84a">Open PDF ↗</a></p>';
      } else {
        el = document.createElement('iframe');
        el.className = 'doc-frame pdf-frame';
        el.src = dataUrl;
      }
      frameWrap.appendChild(el);
      mediaEl = el;
      zoomInBtn.style.display = 'none';
      zoomOutBtn.style.display = 'none';
    } else if(['png','jpg','jpeg','webp','gif','svg'].includes(ext)) {
      mediaType = 'image';
      zoomInBtn.style.display = '';
      zoomOutBtn.style.display = '';
      // Maps anchor top-left so wheel-zoom + drag-pan math is exact.
      if(isMaps) frameWrap.classList.add('maps-mode');
      const img = document.createElement('img');
      img.className = 'doc-image';
      img.style.width = 'auto';
      img.style.height = 'auto';
      frameWrap.appendChild(img);
      mediaEl = img;
      img.onload = () => {
        naturalW = img.naturalWidth;
        naturalH = img.naturalHeight;
        const padding = 32;
        const availW = frameWrap.clientWidth - padding;
        const availH = frameWrap.clientHeight - padding;
        const fitScale = Math.min(availW / naturalW, availH / naturalH, 1);
        zoom = Math.max(0.05, fitScale);
        applyZoom();
      };
      img.src = dataUrl;
    }
  }

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if(!file) return;
    // Warn immediately if the file is too large to persist across reloads
    const MAX_SAVE_MB = 3.75; // ~5MB as base64 after encoding
    if(file.size > MAX_SAVE_MB * 1024 * 1024) {
      filenameEl.textContent = file.name + ' too large to auto-save (will need reloading)';
    }
    const reader = new FileReader();
    reader.onload = e => loadFromDataUrl(e.target.result, file.name);
    reader.readAsDataURL(file);
  });

  // State hooks — save file data as base64 for files under 5MB (encoded).
  // Larger files (like big PDFs) must be reloaded each session.
  const MAX_FILE_BYTES = 5 * 1024 * 1024; // 5MB base64 limit

  root._getState = () => ({
    fileName: savedFileName,
    fileData: savedDataUrl && savedDataUrl.length < MAX_FILE_BYTES ? savedDataUrl : null,
    fileTooLarge: savedDataUrl && savedDataUrl.length >= MAX_FILE_BYTES ? savedFileName : null,
    zoom,
  });
  root._setState = (s) => {
    if(s && s.fileData && s.fileName) {
      // For html docs the zoom is applied once the iframe fires 'load'
      // (see the html branch); for images the timeout below handles it.
      restoreZoom = (typeof s.zoom === 'number' && s.zoom > 0) ? s.zoom : null;
      loadFromDataUrl(s.fileData, s.fileName);
      if(s.zoom && s.zoom !== 1) {
        setTimeout(() => { if(mediaType === 'image') { zoom = s.zoom; applyZoom(); } }, 100);
      }
    } else if(s && s.fileTooLarge) {
      filenameEl.textContent = s.fileTooLarge + ' (too large to auto-restore — reload manually)';
    }
  };
  // Allow other tools to programmatically load an image into this doc viewer
  root._loadDataUrl = (dataUrl, fileName) => loadFromDataUrl(dataUrl, fileName);

  // Adventure pane also gets a "Session Prep" loader that pulls in a saved
  // session-prep document (preview-only) from the user's account.
  if(root.dataset.tool === 'adventure') wireSessionPrepLoader(root);
}

// ── SESSION PREP LOADER (Adventure only) ──────────────────────────────────
// Adds a "Load Session Prep" button to the adventure empty state and a
// "Session Prep" button to its toolbar. Both open a picker of the user's saved
// session-prep documents; choosing one loads it into this pane as a read-only
// preview (the builder's editing sidebar is hidden by ?view=preview).
function wireSessionPrepLoader(root) {
  const emptyEl = root.querySelector('.doc-empty');
  const toolbarTpl = root.querySelector('.toolbar-tpl');

  function open() {
    openPrepPicker(function(doc) {
      const url = '/tools/' + doc.tool + '/' + doc.id + '?view=preview';
      const name = (doc.title || 'Session Prep') + '.html';
      root._loadDataUrl(url, name);
    });
  }

  if(emptyEl && !emptyEl.querySelector('.doc-load-prep')) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn primary small doc-load-prep';
    b.innerHTML = '<svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M3.5 5.6a1.6 1.6 0 0 1 1.6-1.6h3.8l2 2h6a1.6 1.6 0 0 1 1.6 1.6v1H6.4a1.6 1.6 0 0 0-1.5 1.1L3.5 15Z"/><path d="M6.4 10.2h14.2a1 1 0 0 1 1 1.3l-1.9 6.4a1.6 1.6 0 0 1-1.5 1.1H4.6a1.6 1.6 0 0 1-1.5-2.1l1.8-5.6a1.6 1.6 0 0 1 1.5-1.1Z" opacity=".85"/></svg> Load Session Prep';
    b.style.marginTop = '4px';
    b.addEventListener('click', open);
    emptyEl.appendChild(b);
  }

  // Toolbar button lives in the hidden template; syncToolbar clones it into the
  // pane header and proxies clicks back here (see the '.doc-load-prep' pair).
  if(toolbarTpl && !toolbarTpl.querySelector('.doc-load-prep')) {
    const tb = document.createElement('button');
    tb.type = 'button';
    tb.className = 'btn small doc-load-prep';
    tb.innerHTML = '<svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M3.5 5.6a1.6 1.6 0 0 1 1.6-1.6h3.8l2 2h6a1.6 1.6 0 0 1 1.6 1.6v1H6.4a1.6 1.6 0 0 0-1.5 1.1L3.5 15Z"/><path d="M6.4 10.2h14.2a1 1 0 0 1 1 1.3l-1.9 6.4a1.6 1.6 0 0 1-1.5 1.1H4.6a1.6 1.6 0 0 1-1.5-2.1l1.8-5.6a1.6 1.6 0 0 1 1.5-1.1Z" opacity=".85"/></svg>';
    tb.title = 'Load Session Prep';
    tb.setAttribute('aria-label', 'Load Session Prep');
    tb.addEventListener('click', open);
    const label = toolbarTpl.querySelector('label.btn');
    if(label && label.nextSibling) toolbarTpl.insertBefore(tb, label.nextSibling);
    else if(toolbarTpl.firstChild) toolbarTpl.insertBefore(tb, toolbarTpl.firstChild);
    else toolbarTpl.appendChild(tb);
  }
}

let _prepPicker = null;
function openPrepPicker(onPick) {
  if(!_prepPicker) _prepPicker = buildPrepPicker();
  _prepPicker._onPick = onPick;
  _prepPicker.classList.add('open');
  loadPrepList(_prepPicker);
}

function buildPrepPicker() {
  const wrap = document.createElement('div');
  wrap.className = 'prep-picker';
  wrap.innerHTML =
    '<div class="prep-picker-card">' +
      '<div class="prep-picker-head">' +
        '<span class="prep-picker-title">Load Session Prep</span>' +
        '<button class="prep-picker-close" type="button" aria-label="Close">&times;</button>' +
      '</div>' +
      '<div class="prep-picker-list"></div>' +
    '</div>';
  document.body.appendChild(wrap);
  const close = () => wrap.classList.remove('open');
  wrap.querySelector('.prep-picker-close').addEventListener('click', close);
  wrap.addEventListener('click', (e) => { if(e.target === wrap) close(); });
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') close(); });
  return wrap;
}

function loadPrepList(wrap) {
  const list = wrap.querySelector('.prep-picker-list');
  list.innerHTML = '<div class="prep-picker-msg">Loading&hellip;</div>';
  fetch('/api/documents?kind=session', { credentials: 'same-origin' })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(allItems => {
      // Only offer prep tied to the system this board is running (the linked
      // campaign's system). A doc with no system recorded is always shown so
      // older exports stay reachable. With no active system, show everything.
      const sys = String(window.GM_SYSTEM || '').toUpperCase();
      const items = sys
        ? (Array.isArray(allItems) ? allItems : []).filter(it => !it.system || String(it.system).toUpperCase() === sys)
        : allItems;
      if(!Array.isArray(allItems) || allItems.length === 0) {
        list.innerHTML = '<div class="prep-picker-msg">No saved Session Prep sheets yet.<br>Create one from the dashboard first.</div>';
        return;
      }
      if(!items.length) {
        const label = (window.SYS_LABEL && window.SYS_LABEL[sys]) || sys;
        list.innerHTML = '<div class="prep-picker-msg">No ' + label.replace(/[<>&]/g,'') + ' Session Prep sheets yet.<br>Only prep for the linked campaign’s system is shown here.</div>';
        return;
      }
      const esc = s => (s || '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
      list.innerHTML = '';
      items.forEach(it => {
        const when = it.updatedAt ? new Date(it.updatedAt).toLocaleDateString() : '';
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'prep-picker-item';
        btn.innerHTML =
          '<span class="prep-picker-item-main">' +
            '<span class="prep-picker-item-title">' + esc(it.title || 'Untitled') + '</span>' +
            (when ? '<span class="prep-picker-item-sub">Updated ' + esc(when) + '</span>' : '') +
          '</span>' +
          (it.system ? '<span class="prep-picker-badge">' + esc(it.system) + '</span>' : '');
        btn.addEventListener('click', () => {
          wrap.classList.remove('open');
          if(typeof wrap._onPick === 'function') wrap._onPick(it);
        });
        list.appendChild(btn);
      });
    })
    .catch(() => {
      list.innerHTML = '<div class="prep-picker-msg">Couldn\u2019t load your session prep list.</div>';
    });
}

function init_adventure(root) { initDocTool(root); }
function init_maps(root) { initDocTool(root); }
</script>

<script>
// ══════════════════════════════════════════
// COMBAT & TRACKERS TOOL
// ══════════════════════════════════════════
// ═══ TRACKERS + COMBAT (merged) ═══════════════════════════════════════════
// One ordered list holds both kinds of card:
//   { type:'tracker', kind:'rounds'|'timer', ... }
//   { type:'npc',     hpMode:'standard'|'dcc', ... }
// Cards can be reordered by dragging the ⠿ handle or with the ▲▼ buttons.
function init_trackers(root) {
  let round = 1;
  let items = [];            // unified, ordered
  let nextId = 1;

  const list  = root.querySelector('.cbt-tracker-list');
  const empty = root.querySelector('.cbt-trackers-empty');

  function escAttr(s) { return (s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
  function fmtTime(sec) {
    sec = Math.max(0, sec);
    return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  }
  function updateRoundDisplay() {
    // Scope to THIS window (body + its cloned toolbar in the pane header) so two
    // Tracker windows don't overwrite each other's round display.
    const scope = root.closest('.pane, .csub, .cstation') || document;
    scope.querySelectorAll('.trk-round-num').forEach(el => { el.textContent = round; });
  }
  function npcHpColor(pct) {
    if(pct <= 0)  return '#3a3a3a';
    if(pct <= 25) return '#b82018';
    if(pct <= 50) return '#c08020';
    if(pct <= 75) return '#c8a020';
    return '#4caf50';
  }
  function dccSegColor(index, total) {
    const colors = ['#b82018', '#c08020', '#c8a020', '#4caf50'];
    return colors[Math.min(3, Math.floor((index * 4) / total))];
  }

  // ── Reordering (drag-and-drop, insert semantics) ──
  // Cards live in a wrapping grid, so ▲▼ no longer map to what the GM sees. A
  // grip handle drags a card and drops it into another card's slot, shifting the
  // rest along (classic reorder-by-insert). The grip toggles the card's
  // `draggable` flag so text selection inside the inputs still works normally.
  let dragId = null;
  function gripHtml() {
    return `<button class="card-grip" title="Drag to reorder" aria-label="Drag to reorder"><svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M9 5.5a1.6 1.6 0 1 1-3.2 0 1.6 1.6 0 0 1 3.2 0Zm0 6.5a1.6 1.6 0 1 1-3.2 0 1.6 1.6 0 0 1 3.2 0Zm0 6.5a1.6 1.6 0 1 1-3.2 0 1.6 1.6 0 0 1 3.2 0ZM18.2 5.5a1.6 1.6 0 1 1-3.2 0 1.6 1.6 0 0 1 3.2 0Zm0 6.5a1.6 1.6 0 1 1-3.2 0 1.6 1.6 0 0 1 3.2 0Zm0 6.5a1.6 1.6 0 1 1-3.2 0 1.6 1.6 0 0 1 3.2 0Z"/></svg></button>`;
  }
  function clearDropMarks() {
    list.querySelectorAll('.drop-before, .drop-after').forEach(el => el.classList.remove('drop-before', 'drop-after'));
  }
  // Insert-before when the pointer is in the leading half of the target card
  // (left half in a row; the grid flows left-to-right then wraps).
  function isBeforeTarget(e, card) {
    const r = card.getBoundingClientRect();
    return e.clientX < r.left + r.width / 2;
  }
  function moveBeside(movedId, targetId, before) {
    if(movedId === targetId) return;
    const from = items.findIndex(x => x.id === movedId);
    if(from < 0) return;
    const [moved] = items.splice(from, 1);
    let target = items.findIndex(x => x.id === targetId);
    if(target < 0) { items.splice(from, 0, moved); return; }   // target vanished — undo
    items.splice(before ? target : target + 1, 0, moved);
    render();
    if(window.__ddScheduleSave) window.__ddScheduleSave();
  }
  function wireDrag(card, item) {
    const grip = card.querySelector('.card-grip');
    if(grip) {
      const arm = () => { card.draggable = true; };
      grip.addEventListener('mousedown', arm);
      grip.addEventListener('touchstart', arm, { passive: true });
    }
    card.addEventListener('dragstart', e => {
      dragId = item.id;
      card.classList.add('dragging');
      if(e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(item.id)); } catch(_){} }
    });
    card.addEventListener('dragend', () => { card.draggable = false; card.classList.remove('dragging'); clearDropMarks(); dragId = null; });
    card.addEventListener('dragover', e => {
      if(dragId == null || dragId === item.id) return;
      e.preventDefault();
      if(e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      const before = isBeforeTarget(e, card);
      clearDropMarks();
      card.classList.add(before ? 'drop-before' : 'drop-after');
    });
    card.addEventListener('dragleave', e => { if(e.target === card) card.classList.remove('drop-before', 'drop-after'); });
    card.addEventListener('drop', e => {
      if(dragId == null || dragId === item.id) return;
      e.preventDefault();
      const before = isBeforeTarget(e, card);
      const moved = dragId;
      clearDropMarks();
      moveBeside(moved, item.id, before);
    });
  }

  // ── Bestiary monsters as combatants ──
  // A monster combatant is a normal NPC item with a `mon` snapshot attached, so
  // every existing behaviour (HP bar, statuses, reorder, save/restore) keeps
  // working untouched — the snapshot only adds the stat block to the card.
  function monsterItem(m) {
    const hp = parseInt(m.hp, 10);
    return {
      id: nextId++, type: 'npc',
      name: m.name || 'Monster',
      tag: '', hpMode: 'standard',
      // A handful of book creatures have variable HP (listed as "*"); they get a
      // placeholder the GM can edit, with the book value shown in the block.
      hpCurrent: Number.isFinite(hp) ? hp : 10,
      hpMax: Number.isFinite(hp) ? hp : 10,
      statuses: [],
      traitsOpen: false,
      mon: {
        ac: m.ac || '', hp: m.hp || '', mv: m.mv || '', lv: m.lv || '', al: m.al || '',
        s: m.s || '', d: m.d || '', c: m.c || '', i: m.i || '', w: m.w || '', ch: m.ch || '',
        atk: m.atk || '', notes: m.notes || '',
        ctype: (typeof monsterTypeOf === 'function') ? monsterTypeOf(m.name) : ''
      }
    };
  }

  // ── DCC bestiary creatures as combatants ──
  // A DCC creature becomes a DCC-mode NPC card: its Health Bar slots drive the
  // card's segments (each slot = its HP), and a `dmon` snapshot carries the DCC
  // stat block (Evade / DR / Surprise / Move, the five stats, attacks + riders,
  // and special notes). Mirrors monsterItem(), but for the DCC data shape.
  function dccMonsterItem(m) {
    const slots = Array.isArray(m.hbSlots) && m.hbSlots.length ? m.hbSlots : [10];
    // Segments share one HP value in the UI, so use the most common slot size.
    const counts = {};
    slots.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
    const segHp = parseInt(Object.keys(counts).sort((a,b) => counts[b] - counts[a])[0], 10) || 10;
    const totalHp = slots.reduce((a,v) => a + (parseInt(v,10) || 0), 0);
    return {
      id: nextId++, type: 'npc',
      name: m.name || 'Monster',
      tag: m.role || '',
      hpMode: 'dcc',
      segCount: slots.length,
      segHp: segHp,
      segments: slots.map(() => true),
      statuses: [],
      statsOpen: true, traitsOpen: false,
      dmon: {
        role: m.role || '', level: (m.level != null ? m.level : ''), size: (m.size != null ? m.size : ''),
        tags: Array.isArray(m.tags) ? m.tags.slice() : [],
        surprise: m.surprise || '', evade: m.evade || '', move: m.move || '', dr: (m.dr != null ? m.dr : ''),
        totalHp: totalHp, slotCount: slots.length, slotHp: segHp,
        stats: m.stats || {}, attacks: Array.isArray(m.attacks) ? m.attacks : [],
        notes: Array.isArray(m.notes) ? m.notes : (m.notes ? [m.notes] : []),
        page: m.page || '', source: m.source || ''
      }
    };
  }

  // ── ACE! / Nimble / Star Wars bestiary creatures as combatants ──
  // A standard-HP NPC card carrying a `gmon` snapshot: the uniform summary from
  // xsMonSummary (stat chips, rollable lines, notes). HP comes from the block
  // (ACE Health, Nimble HP, SW's four wound levels).
  function xsMonsterItem(src, m) {
    const sum = xsMonSummary(src, m);
    // ACE Health is a row of clickable pips (like the ID card); Star Wars has
    // no HP at all — combatants use the same wound track as the players.
    const hpMode = src === 'ace' ? 'ace' : (src === 'sw' || src === 'd62e') ? 'sw' : 'standard';
    // MMRPG: the tracker card already shows Health (the HP track) and Rank (the
    // tag), so drop those two from the Stats chips to avoid listing them twice.
    // Traits/tags/powers move from text lines to clickable chips (detail popovers).
    let stats = sum.stats, lines = sum.lines, chips = null;
    if(src === 'mmrpg') {
      stats = stats.filter(st => st.label !== 'Health' && st.label !== 'Rank');
      lines = lines.filter(l => !l.detail);
      chips = sum.mmrpgChips || null;
    }
    return {
      id: nextId++, type: 'npc',
      name: m.name || 'Monster',
      tag: sum.tag || '', hpMode: hpMode,
      hpCurrent: sum.hp, hpMax: sum.hp, wound: 'none',
      statuses: [], statsOpen: true, traitsOpen: false,
      gmon: { src: src, stats: stats, lines: lines, notes: sum.notes, meta: sum.meta || [], page: m.page || '', chips: chips }
    };
  }
  const SW_WOUNDS = [['none','Unhurt'],['stunned','Stunned'],['wounded','Wounded'],['incapacitated','Incap.'],['mortal','Mortal']];

  // ══ Combat card renderer ════════════════════════════════════════════════
  // Every system's monster is described the same way — a "view" — and one set of
  // helpers renders it, so the card frame is identical and only the HP zone (in
  // buildNpcCard) changes per system. Interactive bits keep the .npc-mon-roll /
  // .npc-mon-attack / .mmrpg-info classes the existing handlers already wire.

  // Threat tier from a DCC-style role → header tint + badge. Others: no badge.
  function tierFromRole(role) {
    const r = String(role || '').toLowerCase();
    if(!r) return null;
    if(/boss|nemesis|solo/.test(r))       return { label: role, tone: 'var(--boss, #7b5cff)' };
    if(/elite|lieutenant|rival/.test(r))  return { label: role, tone: 'var(--gold)' };
    if(/mob|minion|horde|grunt|mook/.test(r)) return { label: role, tone: 'var(--red)' };
    return { label: role, tone: 'var(--gold)' };  // a named role we don't recognise → elite-ish
  }
  // Swap dice runs (2d6, 1d8+2) inside prose for roll buttons.
  function ccDiceify(str) {
    return escAttr(str).replace(/(\d*d\d+(?:\s*[+-]\s*\d+)?)/gi, (dice) =>
      `<button class="cc-diebtn npc-mon-roll" data-roll="${dice.replace(/\s+/g, '')}" data-rolllabel="trait" title="Roll ${dice}">${dice}</button>`);
  }
  // Trait lines — bold a leading "Name." / "Name:" label, keep dice rollable.
  function ccTraits(notes) {
    const arr = Array.isArray(notes) ? notes : (notes ? [notes] : []);
    const segs = [];
    arr.forEach(t => splitTraits(t).forEach(s => segs.push(s)));
    if(!segs.length) return '';
    const rows = segs.map(s => {
      let name = s.name, body = s.body;
      if(!name) { const m = String(body).match(/^([A-Z][A-Za-z0-9'’\- ]{1,26}?)\.\s+(.+)$/s); if(m) { name = m[1]; body = m[2]; } }
      return `<div class="cc-trait">${name ? `<span class="cc-trait-name">${escAttr(name)}.</span> ` : ''}${ccDiceify(body)}</div>`;
    }).join('');
    return `<div class="cc-traits"><div class="cc-sec">Traits</div>${rows}</div>`;
  }
  // Ability strip. cells: [{ l, v, roll?, rolllabel? }]
  function ccAbils(cells) {
    const cs = (cells || []).filter(c => c && (c.v || c.v === 0) && String(c.v) !== '');
    if(!cs.length) return '';
    const inner = cs.map(c => {
      const body = `<span class="l">${escAttr(c.l)}</span><span class="v">${escAttr(String(c.v))}</span>`;
      return c.roll
        ? `<button class="cc-abil npc-mon-roll" data-roll="${escAttr(c.roll)}" data-rolllabel="${escAttr(c.rolllabel || c.l)}" title="Roll ${escAttr(c.roll)}">${body}</button>`
        : `<div class="cc-abil">${body}</div>`;
    }).join('');
    return `<div class="cc-abils">${inner}</div>`;
  }
  // Attack rows. list: [{ name, ex?, hit?, dmg?, roll?, rolllabel? }]
  function ccAtks(list) {
    const cs = (list || []).filter(Boolean);
    if(!cs.length) return '';
    const rows = cs.map(a => {
      let btn = '';
      if(a.hit || a.dmg) {
        const face = [a.hit, a.dmg].filter(Boolean).join(' / ');
        btn = `<button class="cc-atk-roll npc-mon-attack" data-hit="${escAttr(a.hit || '')}" data-dmg="${escAttr(a.dmg || '')}" data-atkname="${escAttr(a.name || 'attack')}" title="Roll attack and damage">\u{1F3B2} ${escAttr(face)}</button>`;
      } else if(a.roll) {
        btn = `<button class="cc-atk-roll npc-mon-roll" data-roll="${escAttr(a.roll)}" data-rolllabel="${escAttr(a.rolllabel || a.name || 'roll')}" title="Roll ${escAttr(a.roll)}">\u{1F3B2} ${escAttr(a.roll)}</button>`;
      }
      return `<div class="cc-atk"><span class="cc-atk-t"><b>${escAttr(a.name || 'Attack')}</b>${a.ex ? ` <span class="ex">${escAttr(a.ex)}</span>` : ''}</span>${btn}</div>`;
    }).join('');
    return `<div class="cc-sec">Attacks</div>${rows}`;
  }
  // "MV 40 fly 80 · AL C" meta line from [label,val] pairs.
  function ccMeta(pairs) {
    const parts = pairs.filter(p => p[1] || p[1] === 0).map(p => `<b>${escAttr(p[0])}</b> ${escAttr(String(p[1]))}`);
    return parts.length ? `<div class="cc-meta">${parts.join(' · ')}</div>` : '';
  }

  // ── Per-system views → { sub, def:{l,v}, tone, badge, meta, abils, atks, traits } ──
  function sdView(n) {
    const mo = n.mon;
    const abils = ['STR','DEX','CON','INT','WIS','CHA'].map((k, i) => {
      const v = [mo.s, mo.d, mo.c, mo.i, mo.w, mo.ch][i];
      if(v === '' || v == null) return null;
      const mod = String(v).trim();
      return { l: k, v: mod, roll: `1d20${/^[+-]/.test(mod) ? mod : '+' + mod}`, rolllabel: `${k} check` };
    });
    const atks = parseAttacks(mo.atk).map(a => (!a.hit && !a.dmg) ? { name: a.text } : { name: a.name || 'Attack', hit: a.hit, dmg: a.dmg });
    return {
      sub: [mo.ctype, mo.lv ? 'LV ' + mo.lv : ''].filter(Boolean).join(' · '),
      def: mo.ac ? { l: 'AC', v: mo.ac } : null, tone: 'var(--red)', badge: null,
      meta: ccMeta([['MV', mo.mv], ['AL', mo.al]]), abils: ccAbils(abils), atks: ccAtks(atks), traits: ccTraits(mo.notes)
    };
  }
  function dccView(n) {
    const mo = n.dmon, S = mo.stats || {};
    const abils = ['STR','INT','CON','DEX','CHA'].map(k => {
      const st = S[k]; if(!st || st.mod == null) return null;
      const mod = (st.mod >= 0 ? '+' : '') + st.mod;
      return { l: k, v: mod, roll: `1d20${mod}`, rolllabel: `${k} check` };
    });
    const atks = (mo.attacks || []).map(a => {
      const dmg = (a.damage && !/^no damage/i.test(String(a.damage))) ? String(a.damage) : '';
      return { name: a.name || 'Attack', ex: [a.damageType, a.range, a.rider].filter(Boolean).join(' · '), hit: a.toHit ? String(a.toHit) : '', dmg };
    });
    const tier = tierFromRole(mo.role);
    return {
      sub: ['LV ' + mo.level, mo.size].filter(Boolean).join(' · '),
      def: mo.evade ? { l: 'EV', v: mo.evade } : (mo.dr ? { l: 'DR', v: mo.dr } : null),
      tone: tier ? tier.tone : 'var(--red)', badge: tier ? tier.label : null,
      meta: ccMeta([['DR', mo.dr], ['Surprise', mo.surprise], ['Move', mo.move], ['Tags', (mo.tags || []).join(', ')]]),
      abils: ccAbils(abils), atks: ccAtks(atks), traits: ccTraits(mo.notes)
    };
  }
  function xsView(n) {
    const g = n.gmon;
    // HP-like stats already live in the HP zone (pips / wounds), so drop them
    // from the ability strip to avoid showing the same number twice.
    const stats = (g.stats || []).slice().filter(st => !/^(health|hp|wounds?|stamina|rank)$/i.test(String(st.label || '')));
    // Pull a defense-like stat up into the header badge (and out of the strip).
    let def = null;
    const di = stats.findIndex(st => /^(def|defen[cs]e|ac|armou?r|evade|dodge|toughness)$/i.test(String(st.label || '')));
    if(di >= 0) { def = { l: stats[di].label, v: stats[di].val }; stats.splice(di, 1); }
    const abils = stats.map(st => ({ l: st.label, v: st.val, roll: st.roll || '', rolllabel: st.label }));
    const atks = (g.lines || []).map(l => ({ name: l.label || 'Attack', ex: l.text || '', roll: l.roll || '', rolllabel: l.label }));
    // MMRPG chip rows (Traits / Tags / Powers with detail popovers) join the traits.
    let chipRows = '';
    if(g.chips) {
      const infoChip = (nm, kind) => `${escAttr(nm)}<button class="mmrpg-info" data-ik="${kind}" data-in="${escAttr(nm)}" title="Details" aria-label="Show details">&#9432;</button>`;
      const row = (label, arr, kind) => (arr && arr.length) ? `<div class="cc-trait"><span class="cc-trait-name">${label}:</span> ${arr.map(x => infoChip(x, kind)).join(', ')}</div>` : '';
      chipRows = row('Traits', g.chips.traits, 'trait') + row('Tags', g.chips.tags, 'tag') + row('Powers', g.chips.powers, 'power');
    }
    let traits = ccTraits(g.notes);
    if(chipRows) traits = traits ? traits.replace('</div>', chipRows + '</div>') : `<div class="cc-traits"><div class="cc-sec">Traits</div>${chipRows}</div>`;
    return {
      sub: n.tag || '', def: def, tone: 'var(--red)', badge: null,
      meta: ccMeta(g.meta || []), abils: ccAbils(abils), atks: ccAtks(atks), traits
    };
  }
  function monView(n) { return n.dmon ? dccView(n) : n.gmon ? xsView(n) : sdView(n); }


  // Monster attack lines read like:
  //   "1 club +0 (1d4) or 1 shortbow (far) +1 (1d4)"
  //   "2 tentacle (near) +5 (1d8 + curse)"
  //   "3 rend +9 (2d10) and 1 fire belch"
  // Split on " or "/" and ", then pull out the to-hit bonus and the damage dice
  // so each gets its own button. The damage group is the first parenthesised
  // part containing dice — "(near)" and similar range notes are skipped. Special
  // abilities with no bonus or dice ("1 mind blast") stay as plain text; their
  // effect lives in Traits.
  function parseAttacks(atk) {
    return String(atk || '').split(/\s+(?:or|and)\s+/i).map(part => {
      const t = part.trim();
      if(!t) return null;
      const hit = t.match(/([+-]\d+)(?!.*[+-]\d+\s*\()/);
      const dmgGroup = t.match(/\(([^)]*\d+d\d+[^)]*)\)/i);
      const dmg = dmgGroup ? (dmgGroup[1].match(/\d*d\d+(\s*[+-]\s*\d+)?/i) || [null])[0] : null;
      // "2 bite (near) +4 (2d6)" → "bite", for the roll label.
      const nameMatch = t.match(/^\s*\d*\s*([A-Za-z][A-Za-z '\-]*?)\s*(?:\(|[+-]\d|$)/);
      return {
        text: t, name: nameMatch ? nameMatch[1].trim() : '',
        hit: hit ? hit[1] : null, dmg: dmg ? dmg.replace(/\s+/g, '') : null
      };
    }).filter(Boolean);
  }

  // Traits read as "Name: body." runs. Split them so each is its own line, and
  // turn any dice inside into roll buttons — a lot of monster damage lives here
  // rather than on the attack line (a fire dragon's breath is 6d10 in Traits).
  function splitTraits(notes) {
    const str = String(notes || '').trim();
    if(!str) return [];
    // Anchored at the start or just after a sentence, so a two-word label like
    // "Fire Breath:" isn't cut in half. No lookbehind — older iPad Safari.
    const re = /(^|\.\s+)((?:[A-Z][A-Za-z0-9'\u2019\-]*[ ]){0,3}[A-Z][A-Za-z0-9'\u2019\-]*)[ ]*:[ ]*/g;
    const marks = [];
    let m;
    while((m = re.exec(str))) marks.push({ start: m.index + m[1].length, bodyAt: m.index + m[0].length, name: m[2] });
    if(!marks.length) return [{ name: '', body: str }];
    const out = [];
    const pre = str.slice(0, marks[0].start).trim();
    if(pre) out.push({ name: '', body: pre });
    marks.forEach((mk, i) => {
      const end = i + 1 < marks.length ? marks[i + 1].start : str.length;
      out.push({ name: mk.name, body: str.slice(mk.bodyAt, end).trim() });
    });
    return out;
  }

  // ── Tracker card ──
  function buildTrackerCard(t, idx) {
    const card = document.createElement('div');
    card.dataset.id = t.id;
    const expired = t.kind === 'rounds' ? t.rounds <= 0 : t.remainingSeconds <= 0;
    card.className = 'tracker-card' + (t.kind === 'timer' ? ' timer-type' : '') + (expired ? ' expired' : '');
    const collapsed = !!t.collapsed;

    // Top-row live readout: rounds count or remaining time (always visible)
    const displayHtml = t.kind === 'rounds' ? `
        <div class="tracker-rounds-display">
          <span class="tracker-rounds ${t.rounds<=0?'zero':''}">${t.rounds}</span>
          <span class="tracker-label">${t.rounds<=0 ? 'Expired' : 'rounds'}</span>
        </div>` : `
        <div class="tracker-rounds-display">
          <span class="timer-display ${t.remainingSeconds<=0?'zero':''}">${fmtTime(t.remainingSeconds)}</span>
          <span class="tracker-label">${t.remainingSeconds<=0 ? "Time's Up" : (t.running ? 'running' : 'paused')}</span>
        </div>`;

    // Second-row, kind-specific controls (collapsible)
    const controlsHtml = t.kind === 'rounds' ? `

        </div>
      ` : `
        <div class="timer-controls">
          <button class="tracker-adjust-btn timer-toggle">${t.running ? '<svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M6.5 4.5h3.4a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H6.5a1 1 0 0 1-1-1v-13a1 1 0 0 1 1-1Zm7.6 0h3.4a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-3.4a1 1 0 0 1-1-1v-13a1 1 0 0 1 1-1Z"/></svg>' : '<svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M7 4.6v14.8a1 1 0 0 0 1.5.86l12-7.4a1 1 0 0 0 0-1.72l-12-7.4A1 1 0 0 0 7 4.6Z"/></svg>'}</button>
          <button class="tracker-adjust-btn timer-reset" title="Reset"><svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M12 5.6a6.4 6.4 0 0 1 5.5 3.1H15.3v2.1h5.4V5.4h-2.1v1.9A8.5 8.5 0 0 0 3.6 11.2l2.1.3A6.4 6.4 0 0 1 12 5.6z"/><path d="M12 18.4a6.4 6.4 0 0 1-5.5-3.1h2.2v-2.1H3.3v5.4h2.1v-1.9A8.5 8.5 0 0 0 20.4 12.8l-2.1-.3A6.4 6.4 0 0 1 12 18.4z"/></svg></button>
        </div>
        <div class="timer-set-row">
          <span class="timer-set-label">Set</span>
          <input type="number" class="timer-set-input timer-min" min="0" value="${Math.floor(t.totalSeconds/60)}">
          <span class="timer-set-label">m</span>
          <input type="number" class="timer-set-input timer-sec" min="0" max="59" value="${t.totalSeconds%60}">
          <span class="timer-set-label">s</span>
          <button class="btn small ghost timer-apply" style="margin-left:6px;">Apply</button>
        </div>
      `;

    card.innerHTML = `
      <div class="tracker-top">
        ${gripHtml()}
        <input type="text" class="tracker-name-input" value="${escAttr(t.name)}" placeholder="Tracker name...">
        ${displayHtml}
        <button class="tracker-collapse" title="${collapsed ? 'Show controls' : 'Hide controls'}" aria-expanded="${!collapsed}">${collapsed ? '&#9662;' : '&#9652;'}</button>
        <button class="tracker-del" title="Remove">&#10005;</button>
      </div>
      <div class="tracker-controls-row${collapsed ? ' collapsed' : ''}">
        ${t.kind === 'timer' ? `<select class="card-select tracker-type-select ${t.kind}-active" title="Tracker type">
          <option value="rounds" ${t.kind==='rounds'?'selected':''}>Rounds</option>
          <option value="timer"  ${t.kind==='timer' ?'selected':''}>Timer</option>
        </select>` : `<span class="tracker-kind-tag">Round Tracker</span>`}
        ${controlsHtml}
      </div>
    `;

    card.querySelector('.tracker-name-input').addEventListener('input', e => { t.name = e.target.value; });
    card.querySelector('.tracker-del').addEventListener('click', () => { items = items.filter(x => x.id !== t.id); render(); });
    card.querySelector('.tracker-collapse').addEventListener('click', () => { t.collapsed = !t.collapsed; render(); });
    const typeSel = card.querySelector('.tracker-type-select');
    if(typeSel) typeSel.addEventListener('change', e => {
      const kind = e.target.value;
      if(kind === t.kind) return;
      t.running = false;
      t.kind = kind;
      if(kind === 'timer' && t.totalSeconds === undefined) { t.totalSeconds = 60; t.remainingSeconds = 60; }
      render();
    });
    if(t.kind === 'rounds') {
      card.querySelector('.tracker-dec').addEventListener('click', () => { t.rounds = Math.max(0, t.rounds - 1); render(); });
      card.querySelector('.tracker-inc').addEventListener('click', () => { t.rounds += 1; render(); });
    } else {
      card.querySelector('.timer-toggle').addEventListener('click', () => { t.running = !t.running; render(); });
      card.querySelector('.timer-reset').addEventListener('click',  () => { t.running = false; t.remainingSeconds = t.totalSeconds; render(); });
      card.querySelector('.timer-apply')?.addEventListener('click', () => {
        const min = parseInt(card.querySelector('.timer-min').value) || 0;
        const sec = parseInt(card.querySelector('.timer-sec').value) || 0;
        t.totalSeconds = min * 60 + sec;
        t.remainingSeconds = t.totalSeconds;
        t.running = false;
        render();
      });
    }
    return card;
  }

  // ── NPC / combatant card ──
  function buildNpcCard(n, idx) {
    const card = document.createElement('div');
    card.dataset.id = n.id;
    const mode = n.hpMode || 'standard';
    const view = monView(n);
    let hpBlockHtml = '', defeated = false;

    if(mode === 'standard') {
      const pct = n.hpMax > 0 ? Math.max(0, Math.min(100, (n.hpCurrent / n.hpMax) * 100)) : 0;
      defeated = n.hpCurrent <= 0;
      hpBlockHtml = `
        <div class="cc-hp">
          <div class="cc-hp-head"><span class="cc-hp-lab">Hit Points</span></div>
          <div class="cc-hp-num">
            <input type="number" class="cc-hp-cur" value="${n.hpCurrent}" title="Current HP">
            <span class="cc-hp-sep">/</span><span class="cc-hp-max">${escAttr(String(n.hpMax))}</span>
            <div class="cc-hp-bar"><i style="width:${pct}%;background:${npcHpColor(pct)};"></i></div>
            <input type="text" class="cc-hp-dmg" inputmode="numeric" placeholder="dmg" title="Type damage (or +n to heal), then Enter">
          </div>
        </div>`;
    } else if(mode === 'ace') {
      const max = Math.max(1, parseInt(n.hpMax, 10) || 1);
      if(typeof n.hpCurrent !== 'number') n.hpCurrent = max;
      defeated = n.hpCurrent <= 0;
      let pips = '';
      for(let i = 1; i <= max; i++) pips += `<button class="cc-pip cc-ace-pip ${i > n.hpCurrent ? 'dead' : ''}" data-pip="${i}" style="--seg-color:#4caf50;" title="${i > n.hpCurrent ? 'Heal to ' + i : 'Damage down to ' + (i - 1)}">${i}</button>`;
      hpBlockHtml = `
        <div class="cc-hp">
          <div class="cc-hp-head"><span class="cc-hp-lab">Health</span></div>
          <div class="cc-pips">${pips}</div>
        </div>`;
    } else if(mode === 'sw') {
      const w = SW_WOUNDS.some(x => x[0] === n.wound) ? n.wound : 'none';
      n.wound = w;
      defeated = w === 'incapacitated' || w === 'mortal';
      const colors = { none: '#173a17', stunned: '#3a3410', wounded: '#c08020', incapacitated: '#7a1a12', mortal: '#4a0f0a' };
      const fg = { none: '#7bbf7b', stunned: '#d6c04a', wounded: '#0d0e10', incapacitated: '#ffb4ac', mortal: '#ffb4ac' };
      const idx2 = SW_WOUNDS.findIndex(x => x[0] === w);
      const track = SW_WOUNDS.map(([k, lbl], i) => `<button class="cc-wound${i <= idx2 ? ' on' : ''}" data-wound="${k}" style="${i <= idx2 ? `background:${colors[k]};color:${fg[k]}` : ''}" title="${lbl}">${lbl}</button>`).join('');
      hpBlockHtml = `
        <div class="cc-hp">
          <div class="cc-hp-head"><span class="cc-hp-lab">Wounds</span></div>
          <div class="cc-wounds">${track}</div>
        </div>`;
    } else {
      const segCount = n.segCount || (n.segments ? n.segments.length : 10);
      const segHp = n.segHp !== undefined ? n.segHp : 10;
      if(!n.segments || n.segments.length !== segCount) n.segments = Array.from({length: segCount}, () => true);
      defeated = n.segments.filter(Boolean).length === 0;
      const alive = n.segments.filter(Boolean).length;
      const segHtml = n.segments.map((a, i) => `<button class="cc-pip ${a ? '' : 'dead'}" data-seg-idx="${i}" style="--seg-color:${dccSegColor(i, segCount)};" title="Segment ${i+1}${a ? '' : ' (down)'}">${segHp}</button>`).join('');
      hpBlockHtml = `
        <div class="cc-hp">
          <div class="cc-hp-head"><span class="cc-hp-lab">HP Segments</span></div>
          <div class="cc-pips">${segHtml}</div>
        </div>`;
    }

    card.className = 'npc-card' + (defeated ? ' defeated' : '');
    card.style.setProperty('--tone', view.tone || 'var(--red)');
    card.innerHTML = `
      <div class="cc-band">
        ${gripHtml()}
        <div class="cc-title">
          <div class="cc-name" title="${escAttr(n.name)}">${escAttr(n.name || 'Monster')}</div>
          <div class="cc-subrow">
            ${view.badge ? `<span class="cc-badge">${escAttr(view.badge)}</span>` : ''}
            ${view.def ? `<span class="cc-defchip"><span class="l">${escAttr(view.def.l)}</span><span class="v">${escAttr(String(view.def.v))}</span></span>` : ''}
            ${view.sub ? `<span class="cc-type">${escAttr(view.sub)}</span>` : ''}
          </div>
        </div>
        <button class="cc-x npc-del" title="Remove">&#10005;</button>
      </div>
      <div class="cc-body">
        ${hpBlockHtml}
        ${view.abils}
        ${view.meta}
        ${view.atks}
        ${view.traits}
        ${defeated ? '<div class="cc-defeated">Defeated</div>' : ''}
      </div>`;

    card.querySelector('.npc-del').addEventListener('click', () => { items = items.filter(x => x.id !== n.id); render(); });

    if(mode === 'standard') {
      const cur = card.querySelector('.cc-hp-cur');
      cur.addEventListener('change', e => { n.hpCurrent = Math.max(0, parseInt(e.target.value) || 0); render(); });
      cur.addEventListener('keydown', e => { if(e.key === 'Enter') e.target.blur(); });
      const dmg = card.querySelector('.cc-hp-dmg');
      const applyDmg = () => {
        const raw = dmg.value.trim(); if(!raw) return;
        const heal = raw[0] === '+';
        const amt = Math.abs(parseInt(raw, 10) || 0);
        if(amt) n.hpCurrent = heal ? Math.min(n.hpMax, n.hpCurrent + amt) : Math.max(0, n.hpCurrent - amt);
        dmg.value = ''; render();
      };
      dmg.addEventListener('keydown', e => { if(e.key === 'Enter') { e.preventDefault(); applyDmg(); } });
      dmg.addEventListener('blur', applyDmg);
    } else if(mode === 'ace') {
      card.querySelectorAll('.cc-ace-pip').forEach(b => b.addEventListener('click', () => {
        const i = parseInt(b.dataset.pip, 10);
        n.hpCurrent = i > n.hpCurrent ? i : i - 1;
        render();
      }));
    } else if(mode === 'sw') {
      card.querySelectorAll('.cc-wound').forEach(b => b.addEventListener('click', () => { n.wound = b.dataset.wound; render(); }));
    } else {
      card.querySelectorAll('.cc-pip[data-seg-idx]').forEach(seg => {
        seg.addEventListener('click', () => {
          const i = parseInt(seg.dataset.segIdx);
          n.segments[i] = !n.segments[i];
          render();
        });
      });
    }
    card.querySelectorAll('.npc-mon-roll').forEach(b => {
      b.addEventListener('click', () => {
        const label = (n.name ? n.name + ' · ' : '') + (b.dataset.rolllabel || 'Roll');
        if(typeof window.rollToDiceTray === 'function') window.rollToDiceTray(label, b.dataset.roll);
      });
    });
    card.querySelectorAll('.npc-mon-attack').forEach(b => {
      b.addEventListener('click', () => {
        const label = (n.name ? n.name + ' · ' : '') + (b.dataset.atkname || 'attack');
        const hit = b.dataset.hit || null, dmg = b.dataset.dmg || null;
        // DCC monsters don't roll to hit, and their "X+F" Evade DC stays hidden
        // from players (the log is shared), so roll only the damage. SD monsters
        // keep the d20 to-hit (rolled vs the player's AC).
        if(n.hpMode === 'dcc') {
          if(typeof window.rollDccAttackToDiceTray === 'function') window.rollDccAttackToDiceTray(label, dmg);
        } else if(typeof window.rollAttackToDiceTray === 'function') {
          window.rollAttackToDiceTray(label, hit, dmg);
        }
      });
    });
    return card;
  }

  // ── Monster picker ──
  // Opens above the list; pick a monster and it joins the fight with its stats.
  let pickerOpen = false, pickerQuery = '', pickerType = '';
  // Which bestiary the picker draws from. This is the DCC companion, so default
  // to the DCC bestiary when its data is loaded; the GM can flip to SD.
  function dccBestiary() {
    const book = (typeof DCC_MONSTERS !== 'undefined' && Array.isArray(DCC_MONSTERS)) ? DCC_MONSTERS : [];
    const hb = Array.isArray(window.__DCC_HB_MONSTERS) ? window.__DCC_HB_MONSTERS : [];  // user's saved homebrew
    return hb.concat(book);
  }
  // Default the picker's bestiary to the top-bar system toggle; fall back to DCC
  // when its data is loaded, else SD.
  const XS_SOURCES = ['ace', 'nim', 'sw', 'kob', 'dnd', 'd62e', 'icrpg', 'mmrpg', 'gb'];
  // Map a system to its bestiary source. Unknown systems keep their own key (so
  // pickerMatches returns nothing and the picker says "No Combatants Found")
  // rather than silently falling back to the DCC bestiary.
  function sysToSource(sys) { sys = String(sys || 'DCC').toLowerCase(); return sys === 'sd' ? 'sd' : XS_SOURCES.indexOf(sys) >= 0 ? sys : (sys === 'dcc' ? 'dcc' : sys); }
  let pickerSource = sysToSource(window.GM_SYSTEM);

  // Does the current source actually have any creatures to pick? (kob is listed
  // in XS_SOURCES but ships no bestiary, so this can be false for it too.)
  function srcHasBestiary() {
    if(XS_SOURCES.indexOf(pickerSource) >= 0) return (xsBestiary(pickerSource) || []).length > 0;
    if(pickerSource === 'dcc') return dccBestiary().length > 0;
    if(pickerSource === 'sd') return typeof allMonsters === 'function' && allMonsters().length > 0;
    return false;
  }

  function pickerMatches() {
    const q = pickerQuery.trim().toLowerCase();
    if(XS_SOURCES.indexOf(pickerSource) >= 0) {
      return xsBestiary(pickerSource).filter(m => {
        if(pickerType && xsMonType(pickerSource, m) !== pickerType) return false;
        if(!q) return true;
        return String(m.name).toLowerCase().includes(q) || xsMonType(pickerSource, m).toLowerCase().includes(q);
      });
    }
    if(pickerSource === 'dcc') {
      return dccBestiary().filter(m => {
        if(pickerType && String(m.role || '') !== pickerType) return false;
        if(!q) return true;
        return String(m.name).toLowerCase().includes(q) ||
               (Array.isArray(m.tags) && m.tags.some(t => String(t).toLowerCase().includes(q)));
      });
    }
    // Only 'sd' uses the shared allMonsters pool; a system with no bestiary of its
    // own returns nothing here (→ "No Combatants Found").
    if(pickerSource !== 'sd') return [];
    if(typeof allMonsters !== 'function') return [];
    return allMonsters().filter(m => {
      if(pickerType && (typeof monsterTypeOf === 'function') && monsterTypeOf(m.name) !== pickerType) return false;
      if(!q) return true;
      return String(m.name).toLowerCase().includes(q);
    });
  }

  let pickerEl = null;

  function pickerRowsHtml() {
    const found = pickerMatches();
    const rows = found.slice(0, 60).map(m => {
      const meta = XS_SOURCES.indexOf(pickerSource) >= 0
        ? escAttr([xsMonType(pickerSource, m), pickerSource === 'nim' ? 'LV ' + m.level : '', pickerSource === 'ace' ? 'Health ' + m.health : '', pickerSource === 'sw' && m.book !== 'core' ? m.book : ''].filter(Boolean).join(' · '))
        : pickerSource === 'dcc'
        ? ('LV ' + escAttr(String(m.level != null ? m.level : '?')) + ' &middot; ' + escAttr(m.role || 'Mob') +
           ' &middot; ' + escAttr(String(Array.isArray(m.hbSlots) ? m.hbSlots.length : '?')) + ' slots')
        : ('LV ' + escAttr(m.lv) + ' &middot; HP ' + escAttr(m.hp) + ' &middot; AC ' + escAttr(m.ac));
      return `<button class="mon-pick-item" data-mon="${escAttr(m.name)}">
        <span class="mon-pick-item-name">${escAttr(m.name)}</span>
        <span class="mon-pick-item-meta">${meta}</span>
      </button>`;
    }).join('');
    return (rows || (!srcHasBestiary() ? '<div class="mon-pick-empty">No Combatants Found</div>' : '<div class="mon-pick-empty">No monster matches that search.</div>')) +
      (found.length > 60 ? `<div class="mon-pick-empty">Showing 60 of ${found.length} &mdash; keep typing to narrow it down.</div>` : '');
  }

  function wirePickerRows() {
    pickerEl?.querySelectorAll('.mon-pick-item').forEach(btn => {
      btn.addEventListener('click', () => {
        if(XS_SOURCES.indexOf(pickerSource) >= 0) {
          const m = xsBestiary(pickerSource).find(x => x.name === btn.dataset.mon);
          if(m) { items.push(xsMonsterItem(pickerSource, m)); render(); }
        } else if(pickerSource === 'dcc') {
          const m = dccBestiary().find(x => x.name === btn.dataset.mon);
          if(m) { items.push(dccMonsterItem(m)); render(); }
        } else {
          const m = allMonsters().find(x => x.name === btn.dataset.mon);
          if(m) { items.push(monsterItem(m)); render(); }
        }
      });
    });
  }

  // Only the results redraw while typing, so the search box (and the caret)
  // is never torn out from under the user.
  function refreshPickerRows() {
    const listEl = pickerEl?.querySelector('.mon-pick-list');
    if(!listEl) return;
    listEl.innerHTML = pickerRowsHtml();
    wirePickerRows();
  }
  // Let the homebrew loader repaint the bestiary picker if it's open when the
  // user's saved homebrew arrives (it reads the DND_* pools live).
  window.__gmRefreshPicker = () => { if(pickerEl) refreshPickerRows(); };

  function openPicker() {
    if(pickerEl) return;
    // The bestiary follows the top-bar SD/DCC master toggle — no per-picker source select.
    pickerSource = sysToSource(window.GM_SYSTEM);
    const types = XS_SOURCES.indexOf(pickerSource) >= 0
      ? xsMonTypes(pickerSource)
      : pickerSource === 'dcc'
      ? [...new Set(dccBestiary().map(m => m.role).filter(Boolean))]
      : ((typeof SD_MONSTER_TYPE_LIST !== 'undefined' && typeof monsterTypeOf === 'function')
          ? SD_MONSTER_TYPE_LIST.filter(t => allMonsters().some(m => monsterTypeOf(m.name) === t)) : []);
    pickerEl = document.createElement('div');
    pickerEl.className = 'mon-pick';
    pickerEl.innerHTML = `
      <div class="mon-pick-card">
        <div class="mon-pick-head">
          <span class="mon-pick-title">Bestiary</span>
          <button class="pop-x mon-pick-close" type="button" aria-label="Close">✕</button>
        </div>
        <div class="mon-pick-controls">
          <input type="text" class="mon-pick-search" placeholder="Search the bestiary..." value="${escAttr(pickerQuery)}">
          <select class="mon-pick-type">
            <option value="">${pickerSource === 'dcc' ? 'Any Role' : pickerSource === 'nim' ? 'Any Family' : pickerSource === 'sw' ? 'Any Group' : 'Any Type'}</option>
            ${types.map(t => `<option value="${escAttr(t)}" ${t === pickerType ? 'selected' : ''}>${escAttr(t)}</option>`).join('')}
          </select>
        </div>
        <div class="mon-pick-list">${pickerRowsHtml()}</div>
      </div>`;
    // Overlay within the Combat window so it never pushes the cards around.
    root.appendChild(pickerEl);
    pickerEl.addEventListener('mousedown', e => { if(e.target === pickerEl) closePicker(); });
    pickerEl.querySelector('.mon-pick-search').addEventListener('input', e => {
      pickerQuery = e.target.value;
      refreshPickerRows();
    });
    pickerEl.querySelector('.mon-pick-type').addEventListener('change', e => {
      pickerType = e.target.value;
      refreshPickerRows();
    });
    pickerEl.querySelector('.mon-pick-close').addEventListener('click', closePicker);
    wirePickerRows();
    pickerEl.querySelector('.mon-pick-search').focus();
  }

  function closePicker() {
    pickerEl?.remove();
    pickerEl = null;
    pickerOpen = false;
    render();
  }

  // Driven by the top-bar SD/DCC toggle: switch the picker's default bestiary and,
  // if it's open, rebuild it in place.
  window.setGmMonsterSource = function(src) {
    const s = sysToSource(src);
    if(s === pickerSource) return;
    pickerSource = s; pickerType = '';
    if(pickerOpen && pickerEl) { pickerEl.remove(); pickerEl = null; openPicker(); }
  };

  function render() {
    list.innerHTML = '';
    empty.classList.toggle('show', items.length === 0 && !pickerOpen);
    items.forEach((it, idx) => {
      const card = it.type === 'npc' ? buildNpcCard(it, idx) : buildTrackerCard(it, idx);
      wireDrag(card, it);
      list.appendChild(card);
    });
  }

  // Running timers tick once a second. A tick only touches the ticking card's
  // readout text in place — the old full render() rebuilt every card (and
  // re-attached all their listeners) once per second while any timer ran. A
  // full render still happens when a timer expires, since that changes the
  // card's class, label and play/pause button.
  setInterval(() => {
    let needsRender = false;
    items.forEach(it => {
      if(it.type === 'tracker' && it.kind === 'timer' && it.running && it.remainingSeconds > 0) {
        it.remainingSeconds = Math.max(0, it.remainingSeconds - 1);
        if(it.remainingSeconds === 0) {
          it.running = false;
          needsRender = true;
          return;
        }
        const card = list.querySelector('.tracker-card[data-id="' + it.id + '"]');
        const disp = card && card.querySelector('.timer-display');
        if(disp) disp.textContent = fmtTime(it.remainingSeconds);
        else needsRender = true;   // card missing (mid-rebuild) — do it properly
      }
    });
    if(needsRender) render();
  }, 1000);

  function onClick(e) {
    const btn = e.target.closest('.trk-next-round, .trk-reset, .cbt-add-tracker, .cbt-add-npc, .cbt-add-monster, .cbt-reset');
    if(!btn) return;
    // Only react to buttons inside THIS window (its body, or its cloned toolbar
    // in the same .pane header) — so duplicate Tracker windows stay independent.
    const pane = root.closest('.pane, .csub, .cstation');
    const toolbarSlot = pane ? pane.querySelector('.pane-toolbar-slot, .cst-toolbar') : null;
    if(!(root.contains(btn) || (toolbarSlot && toolbarSlot.contains(btn)))) return;

    if(btn.classList.contains('trk-next-round')) {
      nextRound();
    } else if(btn.classList.contains('trk-reset') || btn.classList.contains('cbt-reset')) {
      if(!confirm('Reset the round counter and clear all trackers and combatants?')) return;
      round = 1; items = [];
      updateRoundDisplay(); render();
    } else if(btn.classList.contains('cbt-add-tracker')) {
      items.push({ id: nextId++, type: 'tracker', name: '', kind: 'rounds', rounds: 1, totalSeconds: 60, remainingSeconds: 60, running: false });
      // The Timer button lives inside the picker — close it so the new tracker
      // card is visible instead of staying under the open picker.
      if(pickerEl) closePicker();
      else render();
    } else if(btn.classList.contains('cbt-add-monster')) {
      if(pickerEl) { closePicker(); }
      else { pickerOpen = true; openPicker(); render(); }
    }
  }
  document.addEventListener('click', onClick);

  // Advance the initiative round (also steps any legacy round-tracker cards).
  // Exposed so the Monitor bar's Next-Round control can drive it.
  function nextRound() {
    round += 1;
    updateRoundDisplay();
    items.forEach(it => { if(it.type === 'tracker' && it.kind === 'rounds') it.rounds = Math.max(0, it.rounds - 1); });
    render();
    if(window.__ddScheduleSave) window.__ddScheduleSave();
  }
  root._nextRound = nextRound;
  root._resetRound = () => { round = 1; updateRoundDisplay(); render(); if(window.__ddScheduleSave) window.__ddScheduleSave(); };
  root._getRound = () => round;

  render();
  updateRoundDisplay();

  // Used by the Monster generator's "Send to Tracker" button.
  root._addMonster = (m, src) => {
    if(!m) return null;
    // DCC bestiary entries carry an hbSlots array; build a segmented-HP DCC
    // combatant for those, an ACE/Nimble/SW combatant when the source says so,
    // and a standard SD combatant otherwise.
    const item = (m && Array.isArray(m.hbSlots)) ? dccMonsterItem(m) : (XS_SOURCES.indexOf(src) >= 0 ? xsMonsterItem(src, m) : monsterItem(m));
    items.push(item);
    render();
    return item;
  };

  root._getState = () => ({ round, items });
  root._setState = (st) => {
    if(!st) return;
    round = st.round || 1;
    // Accept the new unified shape, and migrate old saves that kept
    // { trackers: [...] } and { npcs: [...] } in two separate tools.
    let list_ = Array.isArray(st.items) ? st.items.slice() : [];
    if(!list_.length) {
      (st.trackers || []).forEach(t => list_.push({ ...t, type: 'tracker' }));
      (st.npcs || []).forEach(n => list_.push({ ...n, type: 'npc' }));
    }
    items = list_.map(it => ({ ...it, type: it.type || (it.kind ? 'tracker' : 'npc'), running: false }));
    nextId = items.reduce((m, it) => Math.max(m, it.id || 0), 0) + 1;
    items.forEach((it, i) => { if(!it.id) it.id = nextId++; });
    updateRoundDisplay();
    render();
  };
}
window.init_trackers = init_trackers;

// Send a bestiary monster straight into the combat tracker. The tracker is
// instantiated on demand, so this works before the tool has ever been opened —
// the combatant is waiting when the GM switches a pane to Trackers.
window.sendMonsterToTracker = function(m, src) {
  if(!m) return false;
  try {
    const node = ensureToolWindow('trackers');
    if(node && typeof node._addMonster === 'function') { node._addMonster(m, src); return true; }
  } catch(e) {}
  return false;
};
// Old sessions may still ask for the 'combat' tool; it's the same tool now.
window.init_combat = init_trackers;
</script>
