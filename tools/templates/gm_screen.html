    if(c.ride) body += '<div class="pty-sec"><div class="pty-sec-h">' + (c.book === 'brooms' ? 'Broom, wand &amp; familiar' : 'Bike') + '</div><div class="pty-line dim">' + esc(c.ride) + '</div></div>';
    return pcShell(entry, { name: c.name, sub,
      chips: [{ l:'AT', v: c.at }].concat(c.book === 'capes' ? [{ l:'Stress', v: c.stress }] : []), body });
  }

  // Look up a DND spell's compact details for a party-card info popover.
  function dndSpellDetail(name) {
    const list = (typeof DND_SPELLS !== 'undefined') ? DND_SPELLS : [];
    const nm = String(name || '').toLowerCase().trim();
    const sp = list.find(s => s.name.toLowerCase() === nm)
            || list.find(s => nm.indexOf(s.name.toLowerCase()) === 0);
    if(!sp) return '';
    const head = [(sp.level === 0 ? 'Cantrip' : 'Level ' + sp.level), sp.school,
      sp.castingTime, sp.range, sp.duration, sp.concentration ? 'Concentration' : '', sp.ritual ? 'Ritual' : '']
      .filter(Boolean).join(' · ');
    return '<b>' + esc(head) + '</b><br>' + esc(sp.description || '')
      + (sp.higherLevels ? '<br><i>At Higher Levels:</i> ' + esc(sp.higherLevels) : '');
  }
  // Look up a DND condition's rules text.
  function dndConditionDetail(name) {
    const list = (typeof DND_CONDITIONS !== 'undefined') ? DND_CONDITIONS : [];
    const nm = String(name || '').toLowerCase().trim();
    const co = list.find(x => x.name.toLowerCase() === nm)
            || list.find(x => nm.indexOf(x.name.toLowerCase()) === 0);
    return co ? esc(co.description || '') : '';
  }
  const BOOK_ICO = '<svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M11.2 5.3C9.6 4.3 7.5 3.8 5 3.8a1 1 0 0 0-1 1v11.6a1 1 0 0 0 1 1c2.2 0 4 .4 5.4 1.2a1.2 1.2 0 0 0 .8.2V5.6a1 1 0 0 0-.0-.3Zm1.6 0V18a1.2 1.2 0 0 0 .8-.2c1.4-.8 3.2-1.2 5.4-1.2a1 1 0 0 0 1-1V4.8a1 1 0 0 0-1-1c-2.5 0-4.6.5-6.2 1.5Z"/><path d="M11.2 19.4c-1.5-.9-3.4-1.4-5.9-1.4a1 1 0 0 0 0 2c2.2 0 3.9.4 5.1 1.2a1.5 1.5 0 0 0 1.6 0c1.2-.8 2.9-1.2 5.1-1.2a1 1 0 0 0 0-2c-2.5 0-4.4.5-5.9 1.4a.5.5 0 0 1-.1 0Z" opacity=".55"/></svg>';

  function cardHTMLDND(entry) {
    const c = entry.sheet;
    const open = openIds.has(entry.id);
    const sgn = v => (v >= 0 ? '+' : '') + v;
    const sub = ['LV ' + c.level, [c.species, c.cls].filter(Boolean).join(' '), c.alignment].filter(Boolean).join(' · ');
    const cell = (lbl, val) => '<span class="pty-chip">' + lbl + ' <b>' + esc(val === '' || val == null ? '—' : val) + '</b></span>';
    const hpMax = parseInt(c.hpMax, 10) || 0;
    const hpCur = c.hpCur !== '' && c.hpCur != null ? (parseInt(c.hpCur, 10) || 0) : hpMax;
    const pct = hpMax > 0 ? Math.max(0, Math.min(100, (hpCur / hpMax) * 100)) : 100;
    const hpText = (c.hpCur !== '' && c.hpCur != null ? esc(c.hpCur) + '/' : '') + esc(c.hpMax) + (c.hpTemp ? ' +' + esc(c.hpTemp) : '');
    const bubble = { hp: (c.hpCur !== '' && c.hpCur != null ? c.hpCur + '/' : '') + c.hpMax,
      chips: [{ label:'AC', value: c.ac || '—' }, { label:'Speed', value: c.speed || '—' }, { label:'Pass', value: c.passivePerc }] };
    const bubAttr = " data-pcbubble='" + esc(JSON.stringify(bubble)).replace(/'/g, '&#39;') + "'";
    let h = '<div class="pty-card pcard' + (open ? ' open' : '') + '" data-id="' + entry.id + '"' + bubAttr + '>';
    h += '<div class="pty-card-hd pcard-band">'
       + '<div class="pcard-title"><div class="pty-name">' + esc(c.name) + '</div>'
       + '<div class="pcard-subrow"><span class="pcard-type">' + esc(sub) + '</span></div></div>'
       + '<span class="pcard-chip"><span class="l">AC</span><span class="v">' + esc(c.ac || '—') + '</span></span>'
       + '<span class="pcard-chip"><span class="l">HP</span><span class="v">' + hpText + '</span></span>'
       + '<button class="pty-x" data-remove="' + entry.id + '" title="Remove">✕</button>'
       + '</div>';
    h += '<div class="pty-card-bd">';
    h += '<div class="pcard-hp"><div class="pcard-hp-head"><span class="pcard-hp-lab">Hit Points</span><span class="pcard-hp-val">' + hpText + '</span></div>'
       + '<div class="pcard-hpbar"><i style="width:' + pct + '%;background:' + gmcHpColor(pct) + ';"></i></div></div>';
    h += '<div class="pcard-stats">' + c.stats.map(s =>
        '<div class="pcard-stat"><span class="l">' + esc(s.id) + '</span>'
      + '<span class="m">' + sgn(s.mod) + '</span><span class="s">' + esc(s.score) + '</span></div>').join('') + '</div>';
    h += '<div class="pty-sec"><div class="pty-sec-h">Status</div><div style="display:flex;flex-wrap:wrap;gap:4px;">'
       + cell('Speed', c.speed || '—') + cell('Prof', sgn(c.pb)) + cell('Pass. Perc', c.passivePerc)
       + (c.hitdice ? cell('Hit Dice', (c.hdLeft !== '' ? c.hdLeft + ' × ' : '') + c.hitdice) : '')
       + (c.inspiration ? cell('Inspiration', '●') : '')
       + (c.exhaustion ? '<span class="pty-chip" style="color:#ff6a6a;">Exhaustion <b>' + esc(c.exhaustion) + '</b></span>' : '')
       + '</div></div>';
    h += '<div class="pty-sec"><div class="pty-sec-h">Saves</div><div class="pty-line dim">' + c.saves.map(s => esc(s.id) + ' ' + sgn(s.val) + (s.prof ? '•' : '')).join(' · ') + '</div></div>';
    if(c.conditions.length) h += '<div class="pty-sec"><div class="pty-sec-h">Conditions</div>'
      + c.conditions.map((cond, i) => {
          const det = dndConditionDetail(cond);
          const key = entry.id + '-cond-' + i;
          const info = det ? '<button class="pty-spell-info" data-spell="' + key + '" title="Show condition rules" aria-label="Show condition rules">' + BOOK_ICO + '</button>' : '';
          return '<div class="pty-line" style="color:#ff8a6a;">' + esc(cond) + info
            + (det ? '<div class="pty-spell-desc" data-desc="' + key + '" style="display:none;">' + det + '</div>' : '') + '</div>';
        }).join('') + '</div>';
    if(c.skills.length) h += '<div class="pty-sec"><div class="pty-sec-h">Skills</div><div class="pty-line dim">' + c.skills.map(s => esc(s.name) + ' ' + sgn(s.val)).join(' · ') + '</div></div>';
    if(c.attacks.length) h += '<div class="pty-sec"><div class="pty-sec-h">Attacks</div>' + c.attacks.map(a => '<div class="pty-line"><b>' + esc(a.name) + '</b>' + (a.damage ? ' <span class="dim">' + esc(a.damage) + '</span>' : '') + '</div>').join('') + '</div>';
    if(c.spells.length) h += '<div class="pty-sec"><div class="pty-sec-h">Spells</div>'
      + c.spells.map((spName, i) => {
          const det = dndSpellDetail(spName);
          const key = entry.id + '-sp-' + i;
          const info = det ? '<button class="pty-spell-info" data-spell="' + key + '" title="Show spell details" aria-label="Show spell details">' + BOOK_ICO + '</button>' : '';
          return '<div class="pty-line dim">' + esc(spName) + info
            + (det ? '<div class="pty-spell-desc" data-desc="' + key + '" style="display:none;">' + det + '</div>' : '') + '</div>';
        }).join('') + '</div>';
    if(c.inventory.length) h += '<div class="pty-sec"><div class="pty-sec-h">Inventory</div><div class="pty-line dim">' + esc(c.inventory.join(', ')) + '</div></div>';
    h += '</div></div>';
    return h;
  }

  // ── Candela Obscura ──
  function cardHTMLCO(entry) {
    const c = entry.sheet;
    const sub = [c.role, c.specialty].filter(Boolean).join(' · ');
    const cell = (lbl, val) => '<span class="pty-chip">' + lbl + ' <b>' + esc(val === '' || val == null ? '—' : val) + '</b></span>';
    const totalMarks = c.marks.reduce((s, m) => s + m.val, 0);
    let body = pcStats(c.drives.map(dr => ({ l: dr.id, m: dr.cur + '/' + dr.max, s: 'resist ' + dr.resist + (dr.used ? ' (−' + dr.used + ')' : '') })));
    body += '<div class="pty-sec"><div class="pty-sec-h">Harm — Marks</div><div style="display:flex;flex-wrap:wrap;gap:4px;">'
       + c.marks.map(m => cell(m.id, m.val + (m.scar ? ' · scar' : ''))).join('') + '</div></div>';
    if(c.actions.length) body += '<div class="pty-sec"><div class="pty-sec-h">Top Actions</div><div class="pty-line dim">'
       + c.actions.slice(0, 6).map(a => esc(a.id) + ' ' + a.val + (a.gilded ? '✦' : '')).join(' · ') + '</div></div>';
    if(c.abilities.length) body += '<div class="pty-sec"><div class="pty-sec-h">Abilities</div><div class="pty-line dim">' + esc(c.abilities.join(', ')) + '</div></div>';
    if(c.gear.length) body += '<div class="pty-sec"><div class="pty-sec-h">Gear</div><div class="pty-line dim">' + esc(c.gear.join(', ')) + '</div></div>';
    if(c.catalyst) body += '<div class="pty-sec"><div class="pty-sec-h">Catalyst</div><div class="pty-line dim">' + esc(c.catalyst) + '</div></div>';
    return pcShell(entry, { name: c.name, sub, chips: [{ l:'Marks', v: totalMarks, bad: !!totalMarks }], body });
  }

  // ── Year Zero Engine ──
  function cardHTMLYZE(entry) {
    const c = entry.sheet;
    const sub = [c.archetype, c.variant === 'alien' ? 'Alien' : '', c.xp ? 'XP ' + c.xp : ''].filter(Boolean).join(' · ');
    const cell = (lbl, val) => '<span class="pty-chip">' + lbl + ' <b>' + esc(val === '' || val == null ? '—' : val) + '</b></span>';
    const hurt = c.hpMax > 0 && c.hpCur < c.hpMax;
    let body = pcHpBar('Hit Points', c.hpCur, c.hpMax)
      + pcStats(c.attrs.map(s => ({ l: s.id, m: s.val })));
    body += '<div class="pty-sec"><div class="pty-sec-h">Status</div><div style="display:flex;flex-wrap:wrap;gap:4px;">'
       + cell('Stress', c.stress) + cell('Armor', c.armor) + '</div></div>';
    if(c.conditions.length) body += '<div class="pty-sec"><div class="pty-sec-h">Conditions</div><div class="pty-line" style="color:#ff9a5a;">' + esc(c.conditions.join(', ')) + '</div></div>';
    if(c.skills.length) body += '<div class="pty-sec"><div class="pty-sec-h">Skills</div><div class="pty-line dim">' + c.skills.map(s => esc(s.id) + ' ' + s.val).join(' · ') + '</div></div>';
    if(c.talents.length) body += '<div class="pty-sec"><div class="pty-sec-h">Talents</div><div class="pty-line dim">' + esc(c.talents.join(', ')) + '</div></div>';
    if(c.weapons.length) body += '<div class="pty-sec"><div class="pty-sec-h">Weapons</div><div class="pty-line dim">' + esc(c.weapons.join(', ')) + '</div></div>';
    return pcShell(entry, { name: c.name, sub,
      chips: [{ l:'HP', v: esc(c.hpCur) + '/' + esc(c.hpMax), bad: hurt }, { l:'Armor', v: c.armor }], body,
      bubble: { hp: esc(c.hpCur) + '/' + esc(c.hpMax),
        chips: [{ label:'Stress', value: c.stress }, { label:'Armor', value: c.armor }] } });
  }

  // ── Ghostbusters ──
  function cardHTMLGB(entry) {
    const c = entry.sheet;
    const sub = [c.alias, c.tagPhysical].filter(Boolean).join(' · ');
    let body = pcStats(c.traits.map(s => {
        const tal = c.talents.find(t => t.trait === s.id);
        return { l: s.id, m: s.val, s: (tal ? tal.name : '') };
      }));
    if(c.goal) body += '<div class="pty-sec"><div class="pty-sec-h">Goal</div><div class="pty-line dim">' + esc(c.goal) + '</div></div>';
    if(c.tagPersonality) body += '<div class="pty-sec"><div class="pty-sec-h">Personality</div><div class="pty-line dim">' + esc(c.tagPersonality) + '</div></div>';
    if(c.gear.length) body += '<div class="pty-sec"><div class="pty-sec-h">Gear</div><div class="pty-line dim">' + esc(c.gear.join(', ')) + '</div></div>';
    return pcShell(entry, { name: c.name, sub, chips: [{ l:'Brownie', v: c.bp }], body });
  }

  // ── Justice League Unlimited ──
  function cardHTMLJLU(entry) {
    const c = entry.sheet;
    const sub = [c.secret, c.tierName || c.tier, c.origin, c.arch].filter(Boolean).join(' · ');
    const cell = (lbl, val) => '<span class="pty-chip">' + lbl + ' <b>' + esc(val === '' || val == null ? '—' : val) + '</b></span>';
    let body = pcHpBar('Resolve', c.resolveCur, c.resolveMax, c.condLevel ? 'Condition ' + c.condLevel : '')
      + pcStats(c.attrs.map(s => ({ l: s.id, m: s.val })));
    // Combat line — the defenses a GM actually needs mid-scene.
    body += '<div class="pty-sec"><div class="pty-sec-h">Combat</div><div style="display:flex;flex-wrap:wrap;gap:4px;">'
       + cell('Defense', c.defense) + cell('Attack', (c.attack >= 0 ? '+' : '') + c.attack) + cell('Block', c.block) + cell('Dodge', c.dodge) + cell('DR', c.dr)
       + '</div></div>';
    body += '<div class="pty-sec"><div class="pty-sec-h">Status</div><div style="display:flex;flex-wrap:wrap;gap:4px;">'
       + cell('Condition', c.condLevel) + cell('Plot', c.plot) + '</div></div>';
    if(c.statuses.length) body += '<div class="pty-sec"><div class="pty-sec-h">Statuses</div><div class="pty-line" style="color:#ff9a5a;">' + esc(c.statuses.join(', ')) + '</div></div>';
    if(c.powers.length) body += '<div class="pty-sec"><div class="pty-sec-h">Powers</div><div class="pty-line dim">' + c.powers.map(p => esc(p.name) + (p.grade ? ' G' + p.grade : '')).join(', ') + '</div></div>';
    if(c.abilities.length) body += '<div class="pty-sec"><div class="pty-sec-h">Archetype Abilities</div><div class="pty-line dim">' + esc(c.abilities.join(', ')) + '</div></div>';
    if(c.traits.length) body += '<div class="pty-sec"><div class="pty-sec-h">Traits</div><div class="pty-line dim">' + esc(c.traits.join(', ')) + '</div></div>';
    if(c.knowledge && c.knowledge.length) body += '<div class="pty-sec"><div class="pty-sec-h">Knowledge</div><div class="pty-line dim">' + esc(c.knowledge.join(', ')) + '</div></div>';
    if(c.limitations && c.limitations.length) body += '<div class="pty-sec"><div class="pty-sec-h">Limitations</div><div class="pty-line dim">' + esc(c.limitations.join(', ')) + '</div></div>';
    if(c.equipment.length) body += '<div class="pty-sec"><div class="pty-sec-h">Equipment</div><div class="pty-line dim">' + esc(c.equipment.join(', ')) + '</div></div>';
    return pcShell(entry, { name: c.name, sub,
      chips: [{ l:'Resolve', v: esc(c.resolveCur) + '/' + esc(c.resolveMax), bad: !!c.condLevel }, { l:'DR', v: c.dr }], body,
      bubble: { hp: esc(c.resolveCur) + '/' + esc(c.resolveMax),
        chips: [{ label:'DEF', value: c.defense }, { label:'BLK', value: c.block }, { label:'DODGE', value: c.dodge }] } });
  }

  function cardHTML(entry) {
    const c = entry.sheet;
    if(c.system === 'SW') return cardHTMLSW(entry);
    if(c.system === 'NIM') return cardHTMLNIM(entry);
    if(c.system === 'KOB') return cardHTMLKOB(entry);
    if(c.system === 'ACE') return cardHTMLACE(entry);
    if(c.system === 'DND') return cardHTMLDND(entry);
    if(c.system === 'D62E') return cardHTMLD62E(entry);
    if(c.system === 'ICRPG') return cardHTMLICRPG(entry);
    if(c.system === 'MMRPG') return cardHTMLMMRPG(entry);
    if(c.system === 'CO') return cardHTMLCO(entry);
    if(c.system === 'YZE') return cardHTMLYZE(entry);
    if(c.system === 'GB') return cardHTMLGB(entry);
    if(c.system === 'JLU') return cardHTMLJLU(entry);
    if(c.system === 'DCC') return cardHTMLDCC(entry);
    const hpChip = c.hpCur !== '' ? c.hpCur + '/' + c.hpMax : String(c.hpMax);
    const line = [c.ancestry, c.cls].filter(Boolean).join(' ');
    const sub = [line ? 'LV ' + c.level + ' ' + line : 'LV ' + c.level, c.title, c.alignment].filter(Boolean).join(' · ');

    // Light/Focused/Invisible read as states you want; everything else is an
    // affliction. Mirrors the colouring on the player's own sheet.
    const GOOD_TRACKERS = ['light','focused','invisible'];
    const trkHTML = c.trackers.length
      ? '<div class="pty-trk" style="margin-bottom:10px;">' + c.trackers.map(t =>
          '<span class="pty-trk-chip' + (GOOD_TRACKERS.includes(t.toLowerCase()) ? ' good' : '') + '">'
          + esc(t) + '</span>').join('') + '</div>'
      : '';

    let body = pcHpBar('Hit Points', c.hpCur, c.hpMax) + trkHTML
      + pcStats(['STR','DEX','CON','INT','WIS','CHA'].map(k => ({ l:k, m: mod(c.stats[k]), s: c.stats[k] })));

    if(c.attacks.length) body += '<div class="pty-sec"><div class="pty-sec-h">Attacks</div>'
      + c.attacks.map(a => {
          const bonus = a.bonus !== '' ? (String(a.bonus).trim().charAt(0) === '-' ? a.bonus : '+' + String(a.bonus).replace(/^\+/, '')) : '';
          const bits = [
            bonus     ? '<span class="dim">' + esc(bonus) + ' atk</span>' : '',
            a.damage  ? '<span class="dim">' + esc(a.damage) + '</span>'  : '',
            a.range   ? '<span class="dim">' + esc(a.range) + '</span>'   : ''
          ].filter(Boolean).join(' · ');
          return '<div class="pty-line"><b>' + esc(a.name || '—') + '</b>'
            + (bits ? ' ' + bits : '') + '</div>';
        }).join('') + '</div>';

    if(c.spells.length) body += '<div class="pty-sec"><div class="pty-sec-h">Spells</div>'
      + c.spells.map((sp, i) => {
          const hasDesc = sp.desc && sp.desc.trim();
          const info = hasDesc
            ? '<button class="pty-spell-info" data-spell="' + entry.id + '-' + i + '" title="Show description" aria-label="Show spell description"><svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M11.2 5.3C9.6 4.3 7.5 3.8 5 3.8a1 1 0 0 0-1 1v11.6a1 1 0 0 0 1 1c2.2 0 4 .4 5.4 1.2a1.2 1.2 0 0 0 .8.2V5.6a1 1 0 0 0-.0-.3Zm1.6 0V18a1.2 1.2 0 0 0 .8-.2c1.4-.8 3.2-1.2 5.4-1.2a1 1 0 0 0 1-1V4.8a1 1 0 0 0-1-1c-2.5 0-4.6.5-6.2 1.5Z"/><path d="M11.2 19.4c-1.5-.9-3.4-1.4-5.9-1.4a1 1 0 0 0 0 2c2.2 0 3.9.4 5.1 1.2a1.5 1.5 0 0 0 1.6 0c1.2-.8 2.9-1.2 5.1-1.2a1 1 0 0 0 0-2c-2.5 0-4.4.5-5.9 1.4a.5.5 0 0 1-.1 0Z" opacity=".55"/></svg></button>'
            : '';
          return '<div class="pty-line' + (sp.lost ? ' lost' : '') + '">' + esc(sp.name)
            + (sp.level ? ' <span class="dim">(T' + esc(sp.level) + ', DC ' + (10 + (parseInt(sp.level) || 1)) + ')</span>' : '')
            + (sp.lost ? ' <span class="pty-lost">LOST</span>' : '')
            + info
            + (hasDesc ? '<div class="pty-spell-desc" data-desc="' + entry.id + '-' + i + '" style="display:none;">' + esc(sp.desc) + '</div>' : '')
            + '</div>';
        }).join('') + '</div>';

    if(c.talents.length) body += '<div class="pty-sec"><div class="pty-sec-h">Talents &amp; Features</div>'
      + c.talents.map(t => '<div class="pty-line">' + esc(t) + '</div>').join('') + '</div>';

    const carried = c.gear.filter(g => !g.free), free = c.gear.filter(g => g.free);
    if(c.gear.length || c.coins.gp || c.coins.sp || c.coins.cp) {
      const coinStr = c.coins.gp + ' gp · ' + c.coins.sp + ' sp · ' + c.coins.cp + ' cp' + (c.xp ? ' · ' + c.xp + ' XP' : '');
      body += '<div class="pty-sec"><div class="pty-sec-h pty-gear-h">'
         + '<span>Gear <span class="pty-slots">' + c.slotsUsed + '/' + c.slotsMax + '</span></span>'
         + '<span class="pty-coins">' + esc(coinStr) + '</span>'
         + '</div>';
      body += '<div class="pty-line">' + (carried.length
        ? carried.map(g => esc(g.name) + (g.qty > 1 ? ' <span class="dim">×' + g.qty + '</span>' : '')).join(', ')
        : '<span class="dim">—</span>') + '</div>';
      if(free.length) body += '<div class="pty-line dim">Free to carry: ' + free.map(g => esc(g.name)).join(', ') + '</div>';
      body += '</div>';
    }
    return pcShell(entry, { name: c.name, sub,
      chips: [{ l:'AC', v: c.ac }, { l:'HP', v: hpChip }].concat(c.luck ? [{ l:'Luck', v: c.luck }] : []), body,
      bubble: { hp: hpChip,
        chips: [{ label:'AC', value: c.ac }, { label:'Slots', value: c.slotsUsed + '/' + c.slotsMax }].concat(c.luck ? [{ label:'Luck', value: c.luck }] : []) } });
  }

  function render() {
    const any = chars.length > 0;
    emptyEl.style.display = any ? 'none' : 'flex';
    listEl.style.display  = any ? 'flex' : 'none';
    // One malformed sheet must never blank the whole party. Build each card in
    // isolation so a single throw becomes a small "couldn't render" card instead
    // of an empty list + dead bubbles (and a stalled auto-refresh).
    listEl.innerHTML = chars.map(entry => {
      try { return cardHTML(entry); }
      catch(e) {
        const nm = (entry && entry.sheet && entry.sheet.name) || 'Character';
        const sys = (entry && entry.sheet && entry.sheet.system) || '';
        return '<div class="pty-card pcard" data-id="' + (entry && entry.id) + '">'
          + '<div class="pty-card-hd pcard-band"><div class="pcard-title"><div class="pty-name">' + esc(nm) + '</div>'
          + '<div class="pcard-subrow"><span class="pcard-type">' + esc(sys) + '</span></div></div>'
          + '<button class="pty-x" data-remove="' + (entry && entry.id) + '" title="Remove">✕</button></div>'
          + '<div class="pty-card-bd"><div class="pty-line dim">Couldn’t render this sheet.</div></div></div>';
      }
    }).join('');
    if(any && !noteEl.textContent) status(chars.length + ' character' + (chars.length === 1 ? '' : 's'));
    publishRoster();
  }

  // Publish a compact roster for the console masthead's always-on party strip.
  // Reads the values the cards already render (name, HP/AC chips) so it stays
  // system-agnostic. Fired on every render + sync.
  function publishRoster() {
    try {
      const roster = Array.from(listEl.querySelectorAll('.pty-card')).map(card => {
        const name = ((card.querySelector('.pty-name') || {}).textContent || '').trim();
        const subEl = card.querySelector('.pty-sub') || card.querySelector('.pcard-type');
        const sub  = ((subEl || {}).textContent || '').trim();
        // Preferred path: the card carries a curated bubble payload (data-pcbubble)
        // — the system chose exactly what the Monitor bubble shows. Health row is
        // an HP bar when `hp` is set, or a wound-status pill when `wound` is set
        // (wounds-as-health systems like Star Wars / D62e).
        const raw = card.getAttribute('data-pcbubble');
        if(raw) {
          try {
            const bd = JSON.parse(raw.replace(/&#39;/g, "'"));
            const bchips = (bd.chips || []).map(c => ({ label: c.label || c.l || '', value: c.value == null ? (c.v == null ? '' : c.v) : c.value }))
                                            .filter(c => c.label || c.value);
            return { name, sub, hp: bd.hp || '', wound: bd.wound || '', ac: '', acLabel: 'AC', extra: bchips };
          } catch(e) { /* fall through to header scrape */ }
        }
        // Capture EVERY header chip as {label, value} so the Monitor bubble can
        // show all of it. Two header formats: the old "Label <b>value</b>" pill
        // (.pty-chip) and the redesigned split chip (.pcard-chip → .l + .v). Then
        // pick a primary "vital" chip for the HP bar and a "defense" chip for the
        // AC box; the rest render as extra chips — nothing gets dropped.
        const VITAL = /^(HP|HEALTH|VITALITY|WOUNDS|RESOLVE)\b/i;
        const DEF = /^(AC|ARMOR|ARMOUR|DEF|DEFENSE|DEFENCE|DR|SOAK|TOUGHNESS|AT)\b/i;
        const chips = [];
        let hp = '', ac = '', acLabel = 'AC', hpIdx = -1, acIdx = -1;
        card.querySelectorAll('.pty-card-hd .pty-chip, .pty-card-hd .pcard-chip').forEach((ch, idx) => {
          let label, value, full;
          if(ch.classList.contains('pcard-chip')) {
            label = ((ch.querySelector('.l') || {}).textContent || '').trim();
            value = ((ch.querySelector('.v') || {}).textContent || '').trim();
            full = (label + ' ' + value).trim();
          } else {
            const b = ch.querySelector('b');
            value = b ? (b.textContent || '').trim() : '';
            full = (ch.textContent || '').trim();
            label = (b ? full.slice(0, full.length - value.length) : full).trim();
          }
          chips.push({ label, value });
          if(hpIdx < 0 && VITAL.test(full)) { hp = value || full.replace(VITAL, '').trim(); hpIdx = idx; }
          else if(acIdx < 0 && DEF.test(full)) { ac = value || full.replace(DEF, '').trim(); acLabel = (label || 'AC').toUpperCase().slice(0, 4); acIdx = idx; }
        });
        const extra = chips.filter((_, i) => i !== hpIdx && i !== acIdx && (chips[i].label || chips[i].value));
        return { name, sub, hp, ac, acLabel, extra };
      }).filter(x => x.name);
      window.GM_ROSTER = roster;
      document.dispatchEvent(new CustomEvent('gm-roster', { detail: roster }));
    } catch(e) {}
  }

  listEl.addEventListener('click', e => {
    const rm = e.target.closest('[data-remove]');
    if(rm) {
      const id = parseInt(rm.dataset.remove);
      chars = chars.filter(x => x.id !== id);
      openIds.delete(id);
      // Local state diverged from the server's — see the clear button below.
      _lastSyncPayload = null;
      _lastSyncToken = null;
      status('');
      render();
      return;
    }
    // Spell description toggle — must run before the card-header collapse and
    // not bubble up to it, so opening a description never closes the card.
    const info = e.target.closest('.pty-spell-info');
    if(info) {
      e.stopPropagation();
      const key = info.dataset.spell;
      const desc = listEl.querySelector('.pty-spell-desc[data-desc="' + key + '"]');
      if(desc) desc.style.display = desc.style.display === 'none' ? 'block' : 'none';
      return;
    }
    // Collapsible Skills / Attacks section header (DCC cards). Runs before the
    // card-header handler so folding a section never toggles the whole card.
    const secTog = e.target.closest('.pty-sec-toggle');
    if(secTog) {
      e.stopPropagation();
      const key = secTog.dataset.secid + ':' + secTog.dataset.sec;
      if(secClosed.has(key)) secClosed.delete(key); else secClosed.add(key);
      render();
      return;
    }
    const hd = e.target.closest('.pty-card-hd');
    if(!hd) return;
    const id = parseInt(hd.closest('.pty-card').dataset.id);
    if(openIds.has(id)) openIds.delete(id); else openIds.add(id);
    render();
  });

  fileInput.addEventListener('change', () => {
    const files = [...fileInput.files];
    if(!files.length) return;
    let ok = 0, bad = 0, pending = files.length;
    files.forEach(f => {
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const data = JSON.parse(ev.target.result);
          const list = Array.isArray(data) ? data : [data];
          list.forEach(d => { if(addSheet(d, f.name)) ok++; else bad++; });
        } catch(err) { bad++; }
        if(--pending === 0) {
          status(ok + ' sheet' + (ok === 1 ? '' : 's') + ' added' + (bad ? ' · ' + bad + ' not readable' : ''), !ok);
          render();
        }
      };
      reader.readAsText(f);
    });
    fileInput.value = '';
  });

  // Pull the party from the linked campaign. The server returns every saved
  // SD character sheet whose _sheet.campaign.id matches — i.e. the players who
  // typed this campaign's join code into their own sheet.
  async function sync(quiet) {
    const camp = (typeof window.__gmCampaign === 'function') ? window.__gmCampaign() : null;
    if(!camp || !camp.id) {
      if(!quiet) status('Link a campaign first — Campaign link in the top bar.', true);
      return;
    }
    if(!quiet) status('Syncing "' + camp.name + '"…');
    try {
      // Quiet polls hand the server our last change-token so an unchanged
      // roster comes back as a tiny { unchanged } instead of every sheet.
      let url = '/api/campaigns/' + camp.id + '/characters';
      if(quiet && _lastSyncToken) url += '?ifUnchanged=' + encodeURIComponent(_lastSyncToken);
      const r = await fetch(url, { credentials: 'same-origin' });
      if(r.status === 401) { status('Signed out — reload the page and sign in again.', true); return; }
      if(r.status === 404) { status('That campaign no longer exists on the server.', true); return; }
      if(!r.ok) throw new Error(r.status);
      const text = await r.text();
      const data = JSON.parse(text);
      // Server-side short-circuit: the roster hasn't changed since our token.
      if(quiet && data && data.unchanged) return;
      if(data && data.syncToken) _lastSyncToken = data.syncToken;
      // Auto-sync (every 30s): if the server sent back exactly what it sent
      // last time, nothing changed — skip the re-normalize and full re-render.
      // Manual sync always processes, so the button stays a reliable refresh.
      if(quiet && text === _lastSyncPayload) return;
      _lastSyncPayload = text;
      const list = Array.isArray(data) ? data : (data.characters || []);
      // A sync is the source of truth for campaign sheets. Update matching
      // characters in place (addSheet matches by name and keeps the same id, so
      // an expanded card stays expanded), and afterwards drop only the campaign
      // characters that were NOT in this response.
      const seen = new Set();
      let ok = 0;
      list.forEach(d => {
        const norm = normalize(d.sheet && typeof d.sheet === 'object' ? d.sheet : d);
        if(norm) seen.add(norm.name.toLowerCase());
        if(addSheet(d, 'campaign · ' + camp.code)) ok++;
      });
      chars = chars.filter(x => !String(x.source).startsWith('campaign') || seen.has(x.sheet.name.toLowerCase()));
      lastSync = new Date();
      status(ok
        ? ok + ' character' + (ok === 1 ? '' : 's') + ' from ' + camp.code + ' · ' + lastSync.toLocaleTimeString()
        : 'No one has linked a character sheet to ' + camp.code + ' yet.');
      render();
    } catch(err) {
      status('Could not reach the campaign (' + err.message + ').', true);
    }
  }

  syncBtn.addEventListener('click', () => sync(false));

  // While a campaign is linked, keep the party fresh on its own. Skipped while
  // the tab is hidden — nobody is looking, and refocusing triggers plenty of
  // other refresh paths.
  setInterval(() => {
    if(document.hidden) return;
    const camp = (typeof window.__gmCampaign === 'function') ? window.__gmCampaign() : null;
    if(camp && camp.id) sync(true);
  }, 10000);
  setTimeout(() => {
    const camp = (typeof window.__gmCampaign === 'function') ? window.__gmCampaign() : null;
    if(camp && camp.id) sync(true);
  }, 1200);

  clearBtn.addEventListener('click', () => {
    if(chars.length && !confirm('Remove all character sheets from the party view?')) return;
    // Local state diverged from the server's — forget the last payload and
    // token so the next quiet sync doesn't skip as "unchanged" and leave the
    // list empty.
    _lastSyncPayload = null;
    _lastSyncToken = null;
    chars = []; openIds = new Set(); status(''); render();
  });

  root._getState = () => ({ chars, openIds: [...openIds], nextId });
  root._setState = (st) => {
    if(!st) return;
    chars  = Array.isArray(st.chars) ? st.chars.filter(x => x && x.sheet) : [];
    nextId = st.nextId || (chars.reduce((m, x) => Math.max(m, x.id || 0), 0) + 1);
    openIds = new Set(st.openIds || []);
    status('');
    render();
  };

  render();
}

// ══════════════════════════════════════════
// RULEBOOKS TOOL — PDFs/images of your books, plus the searchable
// bestiary and magic item tables already built into this screen.
// ══════════════════════════════════════════
function init_rules(root) {
  const refreshBtn = root.querySelector('.rul-refresh');
  const newTabLink = root.querySelector('.rul-newtab');
  const tabsEl     = root.querySelector('.rul-booktabs');
  const noteEl     = root.querySelector('.rul-note');
  const emptyEl    = root.querySelector('.rul-empty');
  const frameWrap  = root.querySelector('.rul-frame-wrap');

  let allBooks = [];     // every book the user may see — from /api/rulebooks
  let books = [];        // filtered to the currently-selected game system
  let activeFile = '';   // which book is open (remembered across sessions)
  let loaded = false;

  // Show only the books tied to the selected system ("BOTH" = every system).
  function applyBookFilter() {
    const sys = (typeof window.GM_SYSTEM === 'string' ? window.GM_SYSTEM : '');
    books = allBooks.filter(b => !b.system || b.system === 'BOTH' || b.system === sys);
    if(!books.some(b => b.file === activeFile)) activeFile = books.length ? books[0].file : '';
  }

  const esc = t => String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  // The browser's PDF viewer is expensive to spin up (it re-downloads and
  // re-parses the whole book), so each book's <object> is created once and
  // kept; switching tabs just toggles which one is visible — which also
  // preserves the reader's scroll position in each book.
  const _bookFrames = new Map();   // file → <object>

  function showBook() {
    const b = books.find(x => x.file === activeFile) || books[0];
    if(!b) {
      _bookFrames.forEach(el => el.remove());
      _bookFrames.clear();
      frameWrap.style.display = 'none';
      newTabLink.style.display = 'none';
      root.dispatchEvent(new Event('rul-book-change'));
      return;
    }
    activeFile = b.file;
    emptyEl.style.display = 'none';
    frameWrap.style.display = 'flex';

    // <object> lets the browser's own PDF viewer handle scrolling and search,
    // with an iframe (then a plain link) behind it for the browsers that can't.
    let obj = _bookFrames.get(b.file);
    if(!obj) {
      obj = document.createElement('object');
      obj.type = 'application/pdf';
      obj.data = b.url;
      obj.className = 'rul-frame';
      const frame = document.createElement('iframe');
      frame.className = 'rul-frame';
      frame.src = b.url;
      frame.title = b.title;
      obj.appendChild(frame);
      _bookFrames.set(b.file, obj);
      frameWrap.appendChild(obj);
    }
    _bookFrames.forEach(el => { el.style.display = el === obj ? '' : 'none'; });

    newTabLink.href = b.url;
    newTabLink.style.display = '';
    root.dispatchEvent(new Event('rul-book-change'));
  }

  function render() {
    tabsEl.innerHTML = books.map(b =>
      '<button class="rul-booktab' + (b.file === activeFile ? ' on' : '') + '" data-file="' + esc(b.file) + '">'
      + esc(b.title) + '</button>').join('');
    if(!books.length) {
      _bookFrames.forEach(el => el.remove());
      _bookFrames.clear();
      frameWrap.style.display = 'none';
      newTabLink.style.display = 'none';
      emptyEl.style.display = 'flex';
      return;
    }
    showBook();
  }

  async function load(quiet) {
    if(!quiet) noteEl.textContent = 'Loading…';
    try {
      const r = await fetch('/api/rulebooks', { credentials: 'same-origin' });
      if(!r.ok) throw new Error(r.status);
      const data = await r.json();
      allBooks = (data.books || []).filter(b => b && b.url && b.file);
      applyBookFilter();
      // Manual refresh means "re-read from the server" — drop every cached
      // viewer so the PDFs really reload. Quiet loads just prune viewers for
      // books that no longer exist.
      _bookFrames.forEach((el, file) => {
        if(!quiet || !books.some(b => b.file === file)) { el.remove(); _bookFrames.delete(file); }
      });
      loaded = true;
      noteEl.textContent = books.length ? books.length + ' book' + (books.length === 1 ? '' : 's') : '';
      render();
    } catch(err) {
      noteEl.textContent = '';
      emptyEl.style.display = 'flex';
      emptyEl.querySelector('.pty-empty-title').textContent = 'Rulebooks Unavailable';
      emptyEl.querySelector('.pty-empty-sub').textContent =
        'Could not read the rulebook list from the server. Open the GM Screen from Dungeon Crawler\'s Companion while signed in.';
    }
  }

  tabsEl.addEventListener('click', e => {
    const t = e.target.closest('.rul-booktab');
    if(!t) return;
    activeFile = t.dataset.file;
    render();
  });

  refreshBtn.addEventListener('click', () => load(false));

  // Re-filter when the GM switches game system in the top bar.
  document.addEventListener('gm-system-change', () => {
    if(!loaded) return;
    applyBookFilter();
    noteEl.textContent = books.length ? books.length + ' book' + (books.length === 1 ? '' : 's') : '';
    render();
  });

  // Only the chosen book is worth saving — the PDFs live on the server.
  root._getState = () => ({ activeFile });
  root._setState = (st) => {
    if(st && st.activeFile) activeFile = st.activeFile;
    if(loaded) render();
  };

  load(true);
}

// ══════════════════════════════════════════
// SYSTEM AI CONSOLE  (wireAiConsole) — mounted into the Generator tool (loot box +
// found loot) and the Party tool (message composer); wired wherever its DOM lives.
// The GM's broadcast desk: fire an Achievement or free-form System message into
// the shared Roll Log, or build a Loot Box (catalog pick / DCC-tier roll / by
// hand) and send it so players can open it and drop the items on their sheet.
// Loot helpers are replicated locally because dccLootTier/etc. live inside the
// generators IIFE and aren't reachable here; they read the same DCC_* globals.
// ══════════════════════════════════════════
function wireAiConsole(root) {
  const esc = t => String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const R = arr => arr[Math.floor(Math.random() * arr.length)];
  const pickN = (arr, n) => { const p = arr.slice(), out = []; while(out.length < n && p.length) out.push(p.splice(Math.floor(Math.random()*p.length),1)[0]); return out; };
  const canSend = () => (typeof GMCamp !== 'undefined' && GMCamp.get());
  function setStatus(el, msg, kind) {
    if(!el) return;
    el.textContent = msg || '';
    el.className = 'ai-status' + (msg && kind === 'ok' ? ' ok' : msg && kind === 'err' ? ' err' : '');
    if(msg && kind === 'ok') { clearTimeout(el._t); el._t = setTimeout(() => { el.textContent = ''; el.className = 'ai-status'; }, 4000); }
  }

  // ── Shared item-row helpers (both loot builders use the same table shape) ──
  // `meta` (optional) carries an enchanted item's category + slot so the player's
  // sheet can equip it and auto-apply its bonuses; it rides on the row's dataset.
  function makeRow(tbody, name, qty, notes, meta) {
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="ai-it-name"><input type="text" class="ai-input" placeholder="Item"></td>' +
      '<td class="ai-it-qty"><input type="text" class="ai-input" placeholder="Qty"></td>' +
      '<td class="ai-it-notes"><input type="text" class="ai-input" placeholder="Notes"></td>' +
      '<td class="ai-it-x"><button type="button" class="ai-it-del" title="Remove">✕</button></td>';
    const inp = tr.querySelectorAll('input');
    inp[0].value = name || ''; inp[1].value = (qty == null ? '' : String(qty)); inp[2].value = notes || '';
    if(meta && meta.category) tr.dataset.cat = meta.category;
    if(meta && meta.slot) tr.dataset.slot = meta.slot;
    tr.querySelector('.ai-it-del').addEventListener('click', () => tr.remove());
    tbody.appendChild(tr);
    return tr;
  }
  function readRows(tbody) {
    const out = [];
    tbody.querySelectorAll('tr').forEach(tr => {
      const inp = tr.querySelectorAll('input');
      const item = (inp[0].value || '').trim();
      if(!item) return;
      const qty = (inp[1].value || '').trim();
      const notes = (inp[2].value || '').trim().slice(0, 160);
      const row = { item: item.slice(0, 80), qty: qty || 1, notes };
      if(tr.dataset.cat) row.cat = tr.dataset.cat;
      if(tr.dataset.slot) row.slot = tr.dataset.slot;
      out.push(row);
    });
    return out;
  }

  // ── Shared "who gets it" control for every loot/gear/treasure builder ──
  // Three modes: `named` (one player, picked from the campaign roster),
  // `copies` (every player can take their own copy), `claim` (everyone sees it,
  // first to claim each item gets it). The roster is fetched once and shared.
  let _partyNames = null, _partyPending = null;
  function partyName(entry){ const d=(entry&&entry.sheet&&typeof entry.sheet==='object')?entry.sheet:entry; if(!d)return ''; if(d.header&&d.header['f-name'])return String(d.header['f-name']).trim(); return String(d.name||(entry&&entry.name)||'').trim(); }
  function loadParty(force){
    const camp=(typeof GMCamp!=='undefined')?GMCamp.get():null;
    if(!camp||!camp.id) return Promise.resolve({ names:[], msg:'Link a campaign to load the party.' });
    if(_partyNames&&!force) return Promise.resolve({ names:_partyNames, msg:'' });
    if(_partyPending&&!force) return _partyPending;
    _partyPending = fetch('/api/campaigns/'+camp.id+'/characters',{credentials:'same-origin'})
      .then(r=>r&&r.ok?r.text():null)
      .then(text=>{ if(text==null) return { names:[], msg:'Could not load the party.' }; let data;try{data=JSON.parse(text);}catch(e){data=null;}
        const list=Array.isArray(data)?data:(data&&data.characters)||[];
        const names=list.map(partyName).filter(Boolean).filter((n,i,a)=>a.findIndex(x=>x.toLowerCase()===n.toLowerCase())===i).sort((a,b)=>a.localeCompare(b,'en'));
        _partyNames=names; return { names, msg: names.length?'':'No one has linked a character to this campaign yet.' }; })
      .catch(()=>({ names:[], msg:'Could not load the party.' }))
      .then(res=>{ _partyPending=null; return res; });
    return _partyPending;
  }
  function wireSendMode(modeSel, toSel, refreshBtn, statusEl){
    if(!modeSel||!toSel) return { mode:()=>'claim', to:()=>'', reset(){} };
    function setParty(names, emptyMsg){
      const keep=toSel.value;
      toSel.innerHTML='<option value="">— choose a player —</option>'+names.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join('')+(names.length?'':'<option value="" disabled>'+esc(emptyMsg||'No players')+'</option>');
      if(keep&&names.some(n=>n===keep)) toSel.value=keep;
      if(emptyMsg&&!names.length) setStatus(statusEl,emptyMsg,'');
    }
    const fill=force=>loadParty(force).then(r=>setParty(r.names,r.msg));
    function sync(){ const named=modeSel.value==='named'; toSel.style.display=named?'':'none'; if(refreshBtn) refreshBtn.style.display=named?'':'none'; if(named) fill(false); }
    modeSel.addEventListener('change', sync); sync();
    if(refreshBtn) refreshBtn.addEventListener('click', ()=>fill(true));
    return { mode:()=>modeSel.value||'claim', to:()=>(modeSel.value==='named'?toSel.value.trim():''), reset(){ if(modeSel.value==='named') toSel.value=''; } };
  }
  // Human wording for a send confirmation.
  const modeWho = (mode,to) => mode==='named'?('for '+to):mode==='claim'?'(first to claim)':'(a copy for everyone)';
  const MODE_HTML = '<div class="ai-row" style="margin-top:8px">'
    + '<select class="ai-select ai-send-mode" title="Who gets it"><option value="claim">Everyone — first to claim</option><option value="copies">Everyone gets a copy</option><option value="named">Only a named player</option></select>'
    + '<select class="ai-select ai-send-to" title="Which player" style="display:none;"><option value="">— choose a player —</option></select>'
    + '<button class="btn small ghost ai-send-refresh" type="button" title="Refresh the party list" style="display:none;">↻</button></div>';
  // Drop the shared mode row just above a builder's Send button.
  function mountSendMode(sendBtn, statusEl){
    if(!sendBtn) return wireSendMode(null);
    const wrap=document.createElement('div'); wrap.innerHTML=MODE_HTML; const row=wrap.firstChild;
    sendBtn.parentNode.insertBefore(row, sendBtn);
    return wireSendMode(row.querySelector('.ai-send-mode'), row.querySelector('.ai-send-to'), row.querySelector('.ai-send-refresh'), statusEl);
  }

  // ── Generic catalog picker: browse by category chips, search, or add custom ──
  function buildPicker(cfg) {
    let filterKey = 'all';
    cfg.filters.innerHTML = cfg.groups.map(g => '<button type="button" class="ai-chip' + (g.key === filterKey ? ' on' : '') + '" data-key="' + g.key + '">' + esc(g.label) + '</button>').join('');
    cfg.filters.addEventListener('click', e => {
      const b = e.target.closest('.ai-chip'); if(!b) return;
      filterKey = b.dataset.key;
      cfg.filters.querySelectorAll('.ai-chip').forEach(c => c.classList.toggle('on', c.dataset.key === filterKey));
      render();
    });
    function render() {
      const all = cfg.catalog();
      const grp = cfg.groups.find(g => g.key === filterKey) || cfg.groups[0];
      const q = (cfg.search.value || '').trim().toLowerCase();
      const list = all.filter(it => {
        if(grp.cats && grp.cats.indexOf(it.category) < 0) return false;
        if(!q) return true;

  function lootTier(t){ if(typeof DCC_LOOT==='undefined')return null; const tiers=DCC_LOOT.tiers||[]; return tiers.find(x=>x.tier===t)||tiers[0]||null; }
  function itemsOfTier(t,cats){ if(typeof DCC_ITEMS==='undefined')return []; return DCC_ITEMS.filter(it=>it.tier===t&&cats.indexOf(it.category)>=0); }
  function rollGold(formula){ const f=String(formula||''); if(/none|nuthin/i.test(f))return 0; const m=f.match(/(\d+)\s*d\s*(\d+)/i); if(!m)return 0; let total=0; const num=+m[1],sides=+m[2]; for(let i=0;i<num;i++) total+=1+Math.floor(Math.random()*sides); const mult=f.match(/[x×]\s*([\d,]+)/i); if(mult) total*=(parseInt(mult[1].replace(/,/g,''),10)||1); return total; }
  rollTier.addEventListener('click', () => {

      randomCats: ['weapon','armor','gear','loot'], money: null, label: 'LOOT DROP', empty: 'ICRPG loot & gear lists',
    },
  };
  root.querySelectorAll('.xs-treasure').forEach(panel => {

    const q = sel => panel.querySelector(sel);
    const trName = q('.xs-tr-name'), trRoll = q('.xs-tr-roll'), trType = q('.xs-tr-type'), trCount = q('.xs-tr-count'), trTier = q('.xs-tr-tier');
    const trBody = q('.xs-tr-body'), trAdd = q('.xs-tr-add'), trSend = q('.xs-tr-send'), trStatus = q('.xs-tr-status'), trCredits = q('.xs-tr-credits');
    const trSendMode = mountSendMode(trSend, trStatus);
    trAdd.addEventListener('click', () => makeRow(trBody, '', '', ''));
    buildPicker({ filters: q('.xs-tr-filters'), search: q('.xs-tr-search'), results: q('.xs-tr-results'), groups: cfg.groups,
      catalog: () => cfg.list().map(g => ({ name: g.name, category: g.category, slot: '', tier: g.setting && g.setting !== 'core' ? g.setting : '', effect: g.desc })),
      onAdd: (name, notes) => { const g = cfg.list().find(x => x.name === name); makeRow(trBody, name, 1, notes, g ? { category: g.category } : null); setStatus(trStatus, 'Added “' + name + '”.', 'ok'); } });
    const addMoney = tier => { if(cfg.money) makeRow(trBody, cfg.money.name, cfg.money.roll(tier), cfg.money.unit, { category: cfg.money.cat }); };
    trRoll.addEventListener('click', () => {
      const list = cfg.list();
      if(!list.length) { setStatus(trStatus, cfg.empty + ' didn’t load — open from the app.', 'err'); return; }
      trBody.innerHTML = '';
      const tier = trTier ? trTier.value : '1', type = trType ? trType.value : 'random_all', count = Math.max(1, parseInt(trCount && trCount.value, 10) || 1);
      if(type === 'coins' || type === 'credits' || type === 'random_all') addMoney(tier);
      if(type !== 'coins' && type !== 'credits') {
        for(let i = 0; i < count; i++) {
          const cat = type === 'random_all' ? R(cfg.randomCats) : type;
          const pool = list.filter(g => g.category === cat);
          if(!pool.length) continue;
          const g = R(pool);
          makeRow(trBody, g.name, 1, g.desc, { category: g.category });
        }
      }
      setStatus(trStatus, 'Rolled a drop — tweak it, then send.', 'ok');
    });
    if(trCredits) trCredits.addEventListener('click', () => { addMoney('1'); setStatus(trStatus, 'Added credits — edit the amount, then send.', 'ok'); });
    trSend.addEventListener('click', () => {
      if(!canSend()) { setStatus(trStatus, 'Link a campaign first (top bar) to send loot.', 'err'); return; }
      const items = readRows(trBody).slice(0, 14);
      if(!items.length) { setStatus(trStatus, 'Add at least one item to the drop.', 'err'); return; }
      const name = trName.value.trim();
      const mode = trSendMode.mode(), to = trSendMode.to();
      if(mode === 'named' && !to) { setStatus(trStatus, 'Choose the player who gets it.', 'err'); return; }
      const dropId = 'fl-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const detail = JSON.stringify({ dropId, mode, to, items, sys: panel.dataset.sys });
      if(detail.length > 2000) { setStatus(trStatus, 'Too many items — remove a few and resend.', 'err'); return; }
      GMCamp.send({ type: 'foundloot', label: cfg.label, result: name || cfg.label.charAt(0) + cfg.label.slice(1).toLowerCase(), detail });
      setStatus(trStatus, 'Sent ' + items.length + ' item' + (items.length === 1 ? '' : 's') + ' ' + modeWho(mode, to) + '.', 'ok');
      trBody.innerHTML = ''; trName.value = ''; trSendMode.reset();
    });
  });

  // ── System awareness: show DCC-only vs SD-only pieces per the master toggle ──
  function applySys(){
    const sys = (typeof window.GM_SYSTEM==='string'?window.GM_SYSTEM:'DCC');
    const dcc = sys==='DCC';
    root.querySelectorAll('.ai-dcc-only').forEach(el=>{ el.hidden=!dcc; });

    if(!dcc && msgType && msgType.value==='achievement') msgType.value='system';
    syncMsgType();
  }
  applySys();
  document.addEventListener('gm-system-change', applySys);
}

// ── TIMERS TOOL — standalone countdown clocks and round countdowns (split out
//    of the combined Combat Tracker). Time timers tick down live; round timers
//    step manually. State feeds the top-bar timer chips.
function init_timers(root) {
  const listEl     = root.querySelector('.tmr-list');
  const emptyEl    = root.querySelector('.tmr-empty');
  const addTimeBtn = root.querySelector('.tmr-add-time');
  const addRoundBtn= root.querySelector('.tmr-add-round');
  let timers = [];
  let nextId = 1;
  const esc = t => String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const fmt = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
  const save = () => { if(window.__ddScheduleSave) window.__ddScheduleSave(); };

  function addTimer(kind){
    if(kind === 'round') timers.push({ id:nextId++, kind:'round', name:'', totalRounds:3, remainingRounds:3 });
    else timers.push({ id:nextId++, kind:'time', name:'', totalSeconds:180, remainingSeconds:180, running:false });
    render(); save();
  }
  function findT(card){ const id = +card.dataset.id; return timers.find(x => x.id === id); }

  function cardHtml(t){
    if(t.kind === 'round'){
      const zero = t.remainingRounds <= 0;
      return `<div class="tmr-card round${zero?' expired':''}" data-id="${t.id}">
        <div class="tmr-row1"><input class="tmr-name" placeholder="Round countdown…" value="${esc(t.name)}"><span class="tmr-kind rd">Rounds</span><button class="tmr-del" title="Remove">✕</button></div>
        <div class="tmr-row2"><button class="tmr-minus" title="−1 round">−</button><div class="tmr-disp round${zero?' zero':''}">${t.remainingRounds}<span class="tmr-unit">rd</span></div><button class="tmr-plus" title="+1 round">+</button><button class="tmr-reset" title="Reset">↺</button></div>
      </div>`;
    }
    const zero = t.remainingSeconds <= 0;
    return `<div class="tmr-card time${zero?' expired':''}" data-id="${t.id}">
      <div class="tmr-row1"><input class="tmr-name" placeholder="Timer…" value="${esc(t.name)}"><span class="tmr-kind tm">Time</span><button class="tmr-del" title="Remove">✕</button></div>
      <div class="tmr-row2"><button class="tmr-toggle" title="Start / pause">${t.running?'⏸':'▶'}</button><div class="tmr-disp time${zero?' zero':''}">${fmt(t.remainingSeconds)}</div><button class="tmr-reset" title="Reset">↺</button></div>
      <div class="tmr-row3"><span class="tmr-setlbl">Set</span><input type="number" class="tmr-min" min="0" max="999" value="${Math.floor(t.totalSeconds/60)}"><span class="tmr-colon">:</span><input type="number" class="tmr-sec" min="0" max="59" value="${t.totalSeconds%60}"><button class="tmr-apply">Set</button></div>
    </div>`;
  }
  function render(){
    const has = timers.length > 0;
    if(emptyEl) emptyEl.style.display = has ? 'none' : '';
    if(listEl){ listEl.style.display = has ? '' : 'none'; listEl.innerHTML = timers.map(cardHtml).join(''); listEl.querySelectorAll('.tmr-card').forEach(wireCard); }
  }
  function wireCard(card){
    const t = findT(card); if(!t) return;
    card.querySelector('.tmr-name').addEventListener('input', e => { t.name = e.target.value; save(); });
    card.querySelector('.tmr-del').addEventListener('click', () => { timers = timers.filter(x => x !== t); render(); save(); });
    card.querySelector('.tmr-reset').addEventListener('click', () => {
      if(t.kind === 'round') t.remainingRounds = t.totalRounds;
      else { t.remainingSeconds = t.totalSeconds; t.running = false; }
      render(); save();
    });
    if(t.kind === 'round'){
      card.querySelector('.tmr-minus').addEventListener('click', () => { t.remainingRounds = Math.max(0, t.remainingRounds - 1); render(); save(); });
      card.querySelector('.tmr-plus').addEventListener('click', () => { t.remainingRounds += 1; if(t.remainingRounds > t.totalRounds) t.totalRounds = t.remainingRounds; render(); save(); });
    } else {
      card.querySelector('.tmr-toggle').addEventListener('click', () => { t.running = !t.running; render(); save(); });
      card.querySelector('.tmr-apply').addEventListener('click', () => {
        const m = parseInt(card.querySelector('.tmr-min').value) || 0, s = parseInt(card.querySelector('.tmr-sec').value) || 0;
        t.totalSeconds = Math.max(0, m*60 + s); t.remainingSeconds = t.totalSeconds; t.running = false; render(); save();
      });
    }
  }
  // Live tick — decrement running time timers, updating only their display so a
  // focused name/set input isn't clobbered by a full re-render.
  setInterval(() => {
    let any = false;
    timers.forEach(t => { if(t.kind === 'time' && t.running && t.remainingSeconds > 0){ t.remainingSeconds -= 1; any = true; if(t.remainingSeconds <= 0) t.running = false; } });
    if(any && listEl) timers.forEach(t => {
      if(t.kind !== 'time') return;
      const card = listEl.querySelector('.tmr-card[data-id="'+t.id+'"]'); if(!card) return;
      const d = card.querySelector('.tmr-disp'); if(d){ d.textContent = fmt(t.remainingSeconds); d.classList.toggle('zero', t.remainingSeconds<=0); }
      const tog = card.querySelector('.tmr-toggle'); if(tog) tog.textContent = t.running ? '⏸' : '▶';
      card.classList.toggle('expired', t.remainingSeconds<=0);
    });
  }, 1000);

  addTimeBtn.addEventListener('click', () => addTimer('time'));
  addRoundBtn.addEventListener('click', () => addTimer('round'));

  // Advance every round-countdown by one (driven by the Monitor bar Next-Round).
  root._stepRounds = () => {
    let any = false;
    timers.forEach(t => { if(t.kind === 'round' && t.remainingRounds > 0){ t.remainingRounds -= 1; any = true; } });
    if(any){ render(); if(window.__ddScheduleSave) window.__ddScheduleSave(); }
    return any;
  };
  root._resetRounds = () => {
    let any = false;
    timers.forEach(t => { if(t.kind === 'round' && t.remainingRounds !== t.totalRounds){ t.remainingRounds = t.totalRounds; any = true; } });
    if(any){ render(); if(window.__ddScheduleSave) window.__ddScheduleSave(); }
    return any;
  };
  root._hasRoundTimers = () => timers.some(t => t.kind === 'round');
  const nrBtn = root.querySelector('.tmr-next-round');
  if(nrBtn) nrBtn.addEventListener('click', () => { root._stepRounds(); try { renderTimers(); } catch(e){} });
  const rrBtn = root.querySelector('.tmr-reset-rounds');
  if(rrBtn) rrBtn.addEventListener('click', () => { root._resetRounds(); try { renderTimers(); } catch(e){} });

  root._getState = () => ({ timers });
  root._setState = (st) => {
    if(st && Array.isArray(st.timers)){
      timers = st.timers.map(t => ({ ...t, running: false }));
      nextId = timers.reduce((m, t) => Math.max(m, t.id || 0), 0) + 1;
      render();
    }
  };
  render();
}
window.init_timers = init_timers;

// ── VTT / Map station: embed a virtual-tabletop room (Owlbear Rodeo, etc.) in
//    a panel, with a pop-out-to-window fallback for hosts that block embedding. ──
function init_vtt(root) {
  const urlIn   = root.querySelector('.vtt-url-input');
  const loadBtn = root.querySelector('.vtt-load');
  const reload  = root.querySelector('.vtt-reload');
  const popBtn  = root.querySelector('.vtt-popout');
  const pop2    = root.querySelector('.vtt-popout2');
  const newtab  = root.querySelector('.vtt-newtab');
  const empty   = root.querySelector('.vtt-empty');
  const wrap    = root.querySelector('.vtt-frame-wrap');
  const launch  = root.querySelector('.vtt-launch');
  const launchUrl = root.querySelector('.vtt-launch-url');
  const newtab2 = root.querySelector('.vtt-newtab2');
  let url = '';

  // Hosts known to refuse in-page embedding (frame-ancestors) → use pop-out.
  function isBlockedHost(u) { return /(^|\.)owlbear\.(rodeo|app)/i.test(u) || /\bowlbear\b/i.test(u); }

  function popWin() { if(url) window.open(url, 'gmvtt', 'width=1500,height=950,menubar=no,toolbar=no'); }

  function showEmpty() {
    if(empty)  empty.style.display  = 'flex';
    if(launch) launch.style.display = 'none';
    if(wrap)   { wrap.style.display = 'none'; wrap.innerHTML = ''; }
  }
  function showLaunch() {
    if(empty)  empty.style.display  = 'none';
    if(wrap)   { wrap.style.display = 'none'; wrap.innerHTML = ''; }
    if(launch) launch.style.display = 'flex';
    if(launchUrl) launchUrl.textContent = url;
  }
  function mount() {
    if(!url) { showEmpty(); return; }
    if(isBlockedHost(url)) { showLaunch(); return; }   // Owlbear & co → pop-out only
    if(empty)  empty.style.display  = 'none';
    if(launch) launch.style.display = 'none';
    if(wrap)   { wrap.style.display = 'block'; wrap.innerHTML = ''; }
    const f = document.createElement('iframe');
    f.className = 'vtt-frame';
    f.setAttribute('allow', 'clipboard-write; fullscreen; microphone; camera; autoplay');
    f.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
    f.src = url;
    wrap.appendChild(f);
  }
  function setUrl(u, load) {
    url = (u || '').trim();
    if(urlIn)   urlIn.value = url;
    if(newtab)  newtab.href = url || '#';
    if(newtab2) newtab2.href = url || '#';
    if(!url) { showEmpty(); return; }
    if(load !== false) mount();
    if(window.__ddScheduleSave) window.__ddScheduleSave();
  }

  if(loadBtn) loadBtn.addEventListener('click', () => setUrl(urlIn.value, true));
  if(urlIn)   urlIn.addEventListener('keydown', e => { if(e.key === 'Enter') setUrl(urlIn.value, true); });
  if(reload)  reload.addEventListener('click', () => { if(url) mount(); });
  if(popBtn)  popBtn.addEventListener('click', popWin);
  if(pop2)    pop2.addEventListener('click', popWin);

  // Prefill from the campaign's linked VTT room, if any (don't auto-load).
  try {
    const cu = (typeof GMCamp !== 'undefined' && GMCamp.vttUrl) ? GMCamp.vttUrl() : '';
    if(cu) setUrl(cu, false);
  } catch(e) {}

  root._getState = () => ({ url });
  root._setState = (s) => { if(s && s.url) setUrl(s.url, true); };
}
window.init_vtt = init_vtt;
</script>

<!-- In-page URL prompt. Replaces window.prompt(), which desktop wrappers built
     on Electron (e.g. Kenku FM) don't support. Returns a Promise<string|null>. -->
<script>
(function(){
  if (window.ddPromptUrl) return;
  var overlay, input, titleEl, okBtn, cancelBtn, resolver;
  function build(){
    overlay = document.createElement('div');
    overlay.setAttribute('style','position:fixed;inset:0;z-index:2147483647;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)');
    var box = document.createElement('div');
    box.setAttribute('style','width:min(90vw,440px);background:#16161a;border:1px solid #3a3a40;border-radius:8px;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.5);font:14px/1.5 system-ui,-apple-system,sans-serif;color:#e8e8e4');
    titleEl = document.createElement('div');
    titleEl.setAttribute('style','font-size:13px;font-weight:700;margin-bottom:10px');
    input = document.createElement('input');
    input.type = 'text'; input.autocomplete = 'off'; input.spellcheck = false;
    input.setAttribute('style','width:100%;box-sizing:border-box;background:#0e0e10;border:1px solid #3a3a40;border-radius:5px;color:#e8e8e4;font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;padding:9px 10px;outline:none');
    var row = document.createElement('div');
    row.setAttribute('style','display:flex;justify-content:flex-end;gap:8px;margin-top:14px');
    cancelBtn = document.createElement('button');
    cancelBtn.type = 'button'; cancelBtn.textContent = 'Cancel';
    cancelBtn.setAttribute('style','background:#1b1b1f;border:1px solid #3a3a40;border-radius:5px;color:#cfcabd;font:600 12px/1 system-ui,sans-serif;padding:8px 12px;cursor:pointer');
    okBtn = document.createElement('button');
    okBtn.type = 'button'; okBtn.textContent = 'Add';
    okBtn.setAttribute('style','background:rgba(200,160,32,.15);border:1px solid #c8a020;border-radius:5px;color:#c8a020;font:600 12px/1 system-ui,sans-serif;padding:8px 12px;cursor:pointer');
    row.appendChild(cancelBtn); row.appendChild(okBtn);
    box.appendChild(titleEl); box.appendChild(input); box.appendChild(row);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    function done(val){ overlay.style.display = 'none'; input.value = ''; var r = resolver; resolver = null; if (r) r(val); }
    okBtn.addEventListener('click', function(){ done(input.value.trim() || null); });
    cancelBtn.addEventListener('click', function(){ done(null); });
    overlay.addEventListener('mousedown', function(e){ if (e.target === overlay) done(null); });
    input.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); done(input.value.trim() || null); }
      else if (e.key === 'Escape'){ e.preventDefault(); done(null); }
    });
  }
  window.ddPromptUrl = function(message){
    if (!overlay) build();
    titleEl.textContent = message || 'Enter a URL';
    return new Promise(function(resolve){
      resolver = resolve;
      overlay.style.display = 'flex';
      setTimeout(function(){ try { input.focus(); } catch(e){} }, 30);
    });
  };
})();
</script>

    ['42-43','Phobic','Terrified of what broke you; one stress/damage to Wits each round within Short range of it.','2D6'],
    ['44-45','Alcoholic','Drink alcohol every day or suffer one stress/damage to Agility.','3D6'],
    ['46-51','Claustrophobic','Every stretch in a confined space, one stress/damage to Wits.','2D6'],
    ['52','Mythomaniac','You cannot stop lying about everything.','2D6'],['53-54','Paranoia','You are certain someone is out to get you.','2D6'],
    ['55','Delusion','Convinced of something totally untrue.','3D6'],['56','Hallucinations','Insight roll every shift or suffer a powerful hallucination.','3D6'],
    ['61-62','Altered personality','Your personality is altered in a fundamental way.','Permanent'],['63','Amnesia','You lose all memory.','D6'],
    ['64-65','Catatonic','You stare blankly and do not respond to stimuli.','D6'],['66','Heart attack','Your heart stops; you die of pure fright.','—']
  ];
  var PANIC=[[6,'Keeping it Together','You keep your nerves in check. Barely.'],[7,'Nervous Twitch','You and all PCs in Short range gain a stress point.'],
    [8,'Tremble','All Agility skill rolls suffer −2.'],[9,'Drop Item','You drop a weapon or important item.'],
    [10,'Freeze','Frozen for one round; lose your next turn.'],[11,'Seek Cover','Move to safety; lose one stress, all PCs in Short range gain one.'],
    [12,'Scream','Lose your next turn; every PC who hears you must panic roll.'],[13,'Flee','Flee to safety and refuse to leave; hearers must panic roll.'],
    [14,'Berserk','Attack the nearest creature, friend or foe; witnesses must panic roll.'],[999,'Catatonic','You collapse, unable to talk or move.']];
  function d6(){ return 1+Math.floor(Math.random()*6); }
  function look(tbl,code,ci){ var n=parseInt(code,10); for(var i=0;i<tbl.length;i++){ var r=tbl[i][0]; if(r===code)return tbl[i]; var m=r.split(/[–-]/); if(m.length===2){ if(n>=parseInt(m[0],10)&&n<=parseInt(m[1],10))return tbl[i]; } } return null; }
  function out(btn){ var p=btn.closest('[data-panel]'); return p?p.querySelector('.yze-out'):null; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
  window.yzeCrit=function(btn,kind){
    var o=out(btn); if(!o)return; var a=d6(),b=d6(),code=''+a+b;
    if(kind==='phys'){ var r=look(CRITP,code); if(!r){o.innerHTML='';return;}
      var lethal=r[2]!=='No';
      o.innerHTML='<div style="border:1px solid var(--border,#333);border-radius:6px;padding:10px;margin-bottom:6px;'+(lethal?'border-color:#b23c2f;':'')+'"><div style="font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.1em;">Physical Crit · D66 = '+code+'</div><div style="font-size:17px;font-weight:800;color:#3fd0e6;">'+esc(r[1])+(lethal?' <span style="color:#e0776f;font-size:12px;">LETHAL '+esc(r[2])+' · '+esc(r[3])+'</span>':'')+'</div><div style="font-size:13px;margin-top:3px;">'+esc(r[4])+'</div><div style="font-size:11px;color:#999;margin-top:2px;">Heal: '+esc(r[5])+'</div></div>'+o.innerHTML;
    } else { var m=look(CRITM,code); if(!m){o.innerHTML='';return;}
      o.innerHTML='<div style="border:1px solid var(--border,#333);border-radius:6px;padding:10px;margin-bottom:6px;"><div style="font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.1em;">Mental Crit · D66 = '+code+'</div><div style="font-size:17px;font-weight:800;color:#3fd0e6;">'+esc(m[1])+'</div><div style="font-size:13px;margin-top:3px;">'+esc(m[2])+'</div><div style="font-size:11px;color:#999;margin-top:2px;">Heal: '+esc(m[3])+'</div></div>'+o.innerHTML;
    }
  };
  window.yzePanic=function(btn){
    var o=out(btn); if(!o)return; var p=btn.closest('[data-panel]'); var si=p?p.querySelector('.yze-stress'):null;
    var stress=si?(parseInt(si.value,10)||0):0; var roll=d6(), total=roll+stress, row=null;
    for(var i=0;i<PANIC.length;i++){ if(total<=PANIC[i][0]){ row=PANIC[i]; break; } } if(!row)row=PANIC[PANIC.length-1];
    o.innerHTML='<div style="border:1px solid var(--border,#333);border-radius:6px;padding:10px;margin-bottom:6px;"><div style="font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.1em;">Panic · D6 '+roll+' + stress '+stress+' = '+total+'</div><div style="font-size:17px;font-weight:800;color:#3fd0e6;">'+esc(row[1])+'</div><div style="font-size:13px;margin-top:3px;">'+esc(row[2])+'</div></div>'+o.innerHTML;
  };
})();

// ── MMRPG Random Encounters + Danger Room generator (d6 tables from the
//    expansion books; data in /tools-data/mmrpg-gm-tables.js as MMRPG_GM_TABLES).
(function(){
  function G(){ return (typeof MMRPG_GM_TABLES !== 'undefined') ? MMRPG_GM_TABLES : (typeof window!=='undefined'?window.MMRPG_GM_TABLES:null); }
  function d6(){ return 1+Math.floor(Math.random()*6); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
  function card(kicker, title, body){
    return '<div style="border:1px solid var(--border,#333);border-radius:6px;padding:10px;margin-bottom:6px;">'
      + '<div style="font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.1em;">'+esc(kicker)+'</div>'
      + (title?'<div style="font-size:16px;font-weight:800;color:#3fd0e6;">'+esc(title)+'</div>':'')
      + (body?'<div style="font-size:13px;margin-top:3px;">'+esc(body)+'</div>':'') + '</div>';
  }
  function populate(){
    var d=G(); var sel=document.getElementById('gen-mmrpg-enc');
    if(!d||!sel||sel.options.length) return;
    (d.encounters||[]).forEach(function(t,i){
      var o=document.createElement('option'); o.value=String(i);
      o.textContent=t.title+' — '+t.source.replace(' Expansion',''); sel.appendChild(o);
    });
  }
  window.mmrpgRollEncounter=function(btn){
    var d=G(); var p=btn.closest('[data-panel]'); var o=p&&p.querySelector('#gen-mmrpg-enc-results');
    var sel=p&&p.querySelector('#gen-mmrpg-enc'); if(!d||!o||!sel) return;
    var t=(d.encounters||[])[parseInt(sel.value,10)||0]; if(!t) return;
    var roll=d6(); var row=(t.rows||[]).filter(function(r){return r.roll===roll;})[0] || t.rows[0];
    o.innerHTML=card(t.title+' · '+t.source+' · d6 = '+roll, '', row?row.result:'—')+o.innerHTML;
  };
  window.mmrpgRollDangerRoom=function(btn){
    var d=G(); var p=btn.closest('[data-panel]'); var o=p&&p.querySelector('#gen-mmrpg-dr-results');
    var dr=d&&d.dangerRoom; if(!dr||!o) return;
    var lvl=parseInt((p.querySelector('#gen-mmrpg-dr-level')||{}).value,10)||3;
    var era=(p.querySelector('#gen-mmrpg-dr-era')||{}).value||'Modern';
    function tbl(name){ return (dr.tables||[]).filter(function(t){return t.title===name;})[0]; }
    function roll(t){ if(!t) return null; var r=d6(); var row=(t.rows||[]).filter(function(x){return x.roll===r;})[0]; return {r:r,row:row}; }
    var setting=roll(tbl('Random Danger Room Setting'));
    var threat=roll(tbl('Random Danger Room Threats'));
    var env=roll(tbl('Random Danger Room Environment ('+era+')'));
    var tn=10+lvl;
    var html='<div style="border:1px solid var(--border,#333);border-radius:6px;padding:10px;margin-bottom:8px;">'
      + '<div style="font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.1em;">Danger Room · Level '+lvl+' · Challenging TN '+tn+' · '+esc(era)+'</div>';
    if(setting&&setting.row) html+='<div style="margin-top:5px;"><b style="color:#3fd0e6;">Setting</b> (d6 '+setting.r+'): '+esc(setting.row.result)+'</div>';
    if(threat&&threat.row) html+='<div style="margin-top:3px;"><b style="color:#3fd0e6;">Threat</b> (d6 '+threat.r+'): '+esc(threat.row.result)+'</div>';
    if(env&&env.row) html+='<div style="margin-top:3px;"><b style="color:#3fd0e6;">Environment</b> (d6 '+env.r+'): '+esc(env.row.result)+'</div>';
    html+='</div>';
    o.innerHTML=html+o.innerHTML;
  };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', populate); else populate();
})();
</script>

<!-- ── MMRPG Henchmen quick-builder (Avengers Expansion p.190): rank-1..3 mooks.
     Ability scores total 5×rank — each ability = rank, except Logic = 0.
     One trait per rank, one power per rank. Cards send to the combat tracker. -->
<script>
(function(){
  function TR(){ return (typeof MMRPG_TRAITS !== 'undefined') ? MMRPG_TRAITS : (typeof window!=='undefined'?window.MMRPG_TRAITS:null); }
  function PW(){ return (typeof MMRPG_POWERS !== 'undefined') ? MMRPG_POWERS : (typeof window!=='undefined'?window.MMRPG_POWERS:null); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
  function pickN(arr,n){ // n distinct random members
    var pool=(arr||[]).slice(), out=[];
    while(out.length<n && pool.length){ out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]); }
    return out;
  }
  // Powers a henchman can actually use: skip Narrative powers and slider/variable
  // entries that assume a full hero build.
  function usablePowers(){
    var p=PW()||[];
    return p.filter(function(x){
      var set=String(x.powerSet||'');
      if(/narrative/i.test(set)) return false;
      if(/slider/i.test(String(x.name||''))) return false;
      return true;
    });
  }
  var STORE = {};   // id -> henchman object, so the Send button pushes the exact build
  var SEQ = 0;
  function build(concept, rank, idx){
    var t = concept || 'Henchman';
    var name = t + (idx!=null ? ' ' + idx : '');
    var traitNames = pickN((TR()||[]).map(function(x){return x.name;}), rank);
    var pw = pickN(usablePowers(), rank);
    // group powers by set into the {set,names[]} shape MMRPG bestiary cards use
    var bySet = {}; var order = [];
    pw.forEach(function(x){ var s=(x.powerSet && x.powerSet!=='None') ? x.powerSet : 'Basic'; if(!bySet[s]){bySet[s]=[];order.push(s);} bySet[s].push(x.name); });
    var powers = order.map(function(s){ return { set:s, names:bySet[s] }; });
    return {
      name: name,
      realName: concept && concept !== name ? concept : '',
      rank: rank,
      health: rank*30, focus: rank*30, karma: null,
      abilities: { melee:rank, agility:rank, resilience:rank, vigilance:rank, ego:rank, logic:0 },
      speed: { run: 6 },
      traits: traitNames, tags: [], powers: powers,
      origin: 'Henchman', occupation: '',
      book: 'Avengers'
    };
  }
  function statBox(label,val){
    return '<div style="text-align:center;min-width:44px;"><div style="font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.06em;">'+esc(label)+'</div>'
      + '<div style="font-size:15px;font-weight:800;color:#3fd0e6;">'+esc(val)+'</div></div>';
  }
  function card(id, h){
    var A=h.abilities, sign=function(n){return (n>=0?'+':'')+n;};
    var abil=[['MEL',A.melee],['AGI',A.agility],['RES',A.resilience],['VIG',A.vigilance],['EGO',A.ego],['LOG',A.logic]]
      .map(function(p){return statBox(p[0], sign(p[1]));}).join('');
    var pools = statBox('Health',h.health)+statBox('Focus',h.focus)+statBox('Rank',h.rank);
    var traits = h.traits.length ? '<div style="font-size:12px;margin-top:5px;"><b style="color:#3fd0e6;">Traits</b> '+esc(h.traits.join(', '))+'</div>' : '';
    var powers = h.powers.length ? '<div style="font-size:12px;margin-top:3px;"><b style="color:#3fd0e6;">Powers</b> '
      + h.powers.map(function(g){return esc(g.set)+': '+esc(g.names.join(', '));}).join(' · ')+'</div>' : '';
    return '<div style="border:1px solid var(--border,#333);border-radius:6px;padding:10px;margin-bottom:6px;">'
      + '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;">'
      +   '<div style="font-size:16px;font-weight:800;">'+esc(h.name)+'</div>'
      +   '<div style="font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.1em;">Rank '+h.rank+' Henchman</div>'
      + '</div>'
      + '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;">'+abil+'<div style="width:1px;background:var(--border,#333);"></div>'+pools+'</div>'
      + traits + powers
      + '<div style="margin-top:8px;"><button class="btn small primary" onclick="mmrpgSendHench(\''+id+'\',this)">Send to Tracker</button></div>'
      + '</div>';
  }
  window.mmrpgRollHenchman=function(btn){
    var p=btn.closest('[data-panel]'); var o=p&&p.querySelector('#gen-mmrpg-hench-results'); if(!o) return;
    var concept=((p.querySelector('#gen-mmrpg-hench-name')||{}).value||'').trim();
    var rank=Math.max(1,Math.min(3, parseInt((p.querySelector('#gen-mmrpg-hench-rank')||{}).value,10)||2));
    var count=Math.max(1, parseInt((p.querySelector('#gen-mmrpg-hench-count')||{}).value,10)||1);
    var html='';
    for(var i=1;i<=count;i++){
      var h=build(concept, rank, count>1?i:null);
      var id='h'+(++SEQ); STORE[id]=h;
      html+=card(id, h);
    }
    o.innerHTML=html+o.innerHTML;
  };
  window.mmrpgSendHench=function(id, btn){
    var h=STORE[id]; if(!h) return;
    var ok = typeof window.sendMonsterToTracker==='function' && window.sendMonsterToTracker(h,'mmrpg');
    var label=btn.textContent; btn.textContent = ok ? 'Sent ✓' : 'Could not send'; btn.disabled=true;
    setTimeout(function(){ btn.textContent=label; btn.disabled=false; }, 1400);
  };
})();
</script>

<!-- ── MMRPG detail popover: any button.mmrpg-info (data-ik = tag|trait|power,
     data-in = name) opens a small floating card with that entry's details. Shared
     by the Party cards and the combat trackers. -->
<script>
(function(){
  function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
  function find(list, name){
    if(!Array.isArray(list)) return null;
    var nm=String(name||'').toLowerCase().trim();
    var hit=list.find(function(x){return String(x.name).toLowerCase()===nm;});
    if(hit) return hit;
    // fall back to the part before a ":" or "(" specifier (e.g. "Connections: …")
    var base=nm.split(/[:(]/)[0].trim();
    if(base && base!==nm) hit=list.find(function(x){return String(x.name).toLowerCase()===base;});
    return hit||null;
  }
  // Public: returns {name, meta, body} for a tag/trait/power, or null.
  window.mmrpgInfoText=function(kind, name){
    name=String(name||'').trim(); if(!name) return null;
    if(kind==='power'){
      var L=(typeof MMRPG_POWERS!=='undefined')?MMRPG_POWERS:(window.MMRPG_POWERS||[]);
      var p=find(L, name);
      if(!p){ var b=name.toLowerCase().replace(/\s+\d+$/,''); p=find(L, b); }   // "Mighty 2" → "Mighty"
      if(!p) return null;
      var meta=[p.powerSet&&p.powerSet!=='None'?p.powerSet:'Basic', p.action, p.duration, p.range?('Range '+p.range):'', p.cost].filter(Boolean).join(' · ');
      return { name:p.name, meta:meta, body:(p.effect||p.description||'') };
    }
    if(kind==='trait'){ var T=(typeof MMRPG_TRAITS!=='undefined')?MMRPG_TRAITS:(window.MMRPG_TRAITS||[]); var t=find(T,name); return t?{name:t.name,meta:'Trait',body:(t.description||'')}:null; }
    if(kind==='tag'){ var G=(typeof MMRPG_TAGS!=='undefined')?MMRPG_TAGS:(window.MMRPG_TAGS||[]); var g=find(G,name); return g?{name:g.name,meta:'Tag',body:(g.description||'')}:null; }
    return null;
  };
  var pop=null, forBtn=null;
  function ensure(){ if(pop) return pop; pop=document.createElement('div'); pop.id='mmrpg-info-pop'; document.body.appendChild(pop); return pop; }
  function hide(){ if(pop) pop.style.display='none'; forBtn=null; }
  function show(btn){
    var d=window.mmrpgInfoText(btn.getAttribute('data-ik'), btn.getAttribute('data-in'));
    var name=btn.getAttribute('data-in')||'';
    var p=ensure();
    p.innerHTML='<div class="mip-name">'+esc(d?d.name:name)+'</div>'
      +(d&&d.meta?'<div class="mip-meta">'+esc(d.meta)+'</div>':'')
      +'<div>'+(d&&d.body?esc(d.body):'<i>No details found.</i>')+'</div>';
    p.style.display='block'; p.style.visibility='hidden'; p.style.left='0px'; p.style.top='0px';
    var r=btn.getBoundingClientRect(); var pr=p.getBoundingClientRect();
    var left=Math.min(r.left, window.innerWidth-pr.width-8); if(left<8)left=8;
    var top=r.bottom+6; if(top+pr.height>window.innerHeight-8) top=Math.max(8, r.top-pr.height-6);
    p.style.left=left+'px'; p.style.top=top+'px'; p.style.visibility='visible';
    forBtn=btn;
  }
  // Capture phase so a tool's own click handlers (card collapse, etc.) don't fire.
  document.addEventListener('click', function(e){
    var b=e.target.closest ? e.target.closest('.mmrpg-info') : null;
    if(b){ e.preventDefault(); e.stopPropagation(); if(forBtn===b && pop && pop.style.display!=='none'){ hide(); } else { show(b); } return; }
    if(pop && pop.style.display!=='none' && !(e.target.closest && e.target.closest('#mmrpg-info-pop'))) hide();
  }, true);
  window.addEventListener('scroll', hide, true);
  window.addEventListener('resize', hide);
})();
</script>
