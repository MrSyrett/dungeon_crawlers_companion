// ═══ DICE TRAY & ROLL LOG ═══════════════════════════════════════════════════
function init_dice(root) {
  const trayEl = root.querySelector('.dice-tray');
  const poolEl = root.querySelector('.dice-pool');
  const logEl = root.querySelector('.dice-log');
  const clearBtn = root.querySelector('.dice-clear');

  let pool = {};        // {6: 2, 20: 1} — tap dice to build a roll, like the sheets' trays
  let advMode = 'none'; // none | adv | dis
  let log = [];         // [{label, detail, total, crit, adv, remote?, source?, type?, payload?}]

  // ── Campaign link ──
  // The connection itself lives in GMCamp (top bar). The tray only sends its
  // rolls out and folds incoming ones into the log.
  GMCamp.onChange(() => { renderTray(); renderPool(); });   // link connected/left → show or hide the eye
  // Incoming rolls arrive in bursts (the poll replays the whole history when a
  // campaign link (re)activates), so coalesce to one renderLog() per frame
  // instead of rebuilding the 100-entry list once per roll.
  let _logRenderQueued = false;
  function queueRenderLog() {
    if(_logRenderQueued) return;
    _logRenderQueued = true;
    requestAnimationFrame(() => { _logRenderQueued = false; renderLog(); });
  }
  // A server that doesn't know a loot type stores it as 'normal'; recover the
  // real type from the JSON payload so the card never renders as raw code.
  function sniffRollType(roll) {
    if(!roll || (roll.type && roll.type !== 'normal')) return roll;
    const d = String(roll.detail || '').trim(); if(d.charAt(0) !== '{') return roll;
    let p = null; try { p = JSON.parse(d); } catch(e) { return roll; }
    if(!p || typeof p !== 'object') return roll;
    const t = (p.boxId && p.itemIndex == null && !Array.isArray(p.items)) ? 'lootclaim' : (p.dropId && p.itemIndex != null) ? 'lootclaim' : p.boxId ? 'lootbox' : p.dropId || Array.isArray(p.items) ? 'foundloot' : null;
    return t ? Object.assign({}, roll, { type: t }) : roll;
  }
  GMCamp.onRoll(roll => {
    roll = sniffRollType(roll);
    // The poll re-fetches the campaign's history from id 0 whenever the link
    // (re)activates, so skip any roll already in the log by its server id.
    if(roll && roll.id != null && log.some(e => e.id === roll.id)) return;
    // A claim locks one item on the drop it belongs to (no entry of its own).
    if(roll && roll.type === 'lootclaim') {
      let pc = {}; try { pc = JSON.parse(roll.detail || '{}'); } catch(e) { pc = {}; }
      const drop = log.find(e => e.payload && (e.payload.dropId === pc.dropId || e.payload.boxId === pc.boxId));
      if(drop) {
        const key = pc.itemIndex == null ? 'all' : pc.itemIndex, who = pc.by || roll.source || 'Someone';
        if(pc.mode === 'copies' || (drop.payload && drop.payload.mode === 'copies')) { drop.taken = drop.taken || {}; const l = drop.taken[key] = drop.taken[key] || []; if(!l.some(n => n.toLowerCase() === who.toLowerCase())) l.push(who); }
        else { drop.claimed = drop.claimed || {}; drop.claimed[key] = who; }
        queueRenderLog();
      }
      return;
    }
    const special = roll.type === 'foundloot' || roll.type === 'lootbox' || roll.type === 'system' || roll.type === 'achievement';
    let payload = null;
    if(roll.type === 'foundloot' || roll.type === 'lootbox') { try { payload = JSON.parse(roll.detail || '{}'); } catch(e) { payload = {}; } }
    // A drop this screen sent is already in the log as its local echo; when the
    // same drop comes back from the server (a reload gives the page a fresh
    // clientKey) just attach the server id instead of adding a second card.
    if(payload && (payload.dropId || payload.boxId)) {
      const dup = log.find(e => e.payload && ((payload.dropId && e.payload.dropId === payload.dropId) || (payload.boxId && e.payload.boxId === payload.boxId)));
      if(dup) { if(roll.id != null && dup.id == null) dup.id = roll.id; return; }
    }
    log.unshift({ id: roll ? roll.id : undefined, label: roll.label, detail: roll.detail, total: roll.result,
                  crit: (roll.type === 'normal' || special) ? '' : roll.type, adv: 'none',
                  type: special ? roll.type : '', payload,
                  remote: !roll.local, local: !!roll.local, source: roll.source });
    if(log.length > 100) log.length = 100;
    queueRenderLog();
  });

  // The tray's dice match each system's own character-sheet tray. Polyhedral
  // systems get their sheet's die set; the d6-pool systems (Star Wars, Candela,
  // YZE, Ghostbusters, ACE!, Marvel d616, D6 2e) build pools of d6 like their
  // sheets do. Falls back to the standard polyhedral set.
  const DICE_STD = [2, 4, 6, 8, 10, 12, 20, 100];
  const DICE_BY_SYS = {
    SD:   [2, 4, 6, 8, 10, 12, 20, 100],
    DCC:  [2, 4, 6, 8, 10, 12, 20, 100],
    DND:  [4, 6, 8, 10, 12, 20, 100],
    NIM:  [4, 6, 8, 10, 12, 20],
    ICRPG:[4, 6, 8, 10, 12, 20],
    KOB:  [4, 6, 8, 10, 12, 20],
    JLU:  [6, 8, 12],
    SW:   [6], D62E: [6], CO: [6], YZE: [6], GB: [6], ACE: [6], MMRPG: [6],
  };
  function diceForSystem(sys) { return DICE_BY_SYS[String(sys || '').toUpperCase()] || DICE_STD; }
  let DICE = diceForSystem(window.GM_SYSTEM);
  const ICO_EYE = '<svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M12 5c-5 0-9 4.5-10 7 1 2.5 5 7 10 7s9-4.5 10-7c-1-2.5-5-7-10-7Zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9Zm0-7a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/></svg>';
  const ICO_EYE_OFF = '<svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path d="M3 4.4 4.4 3l16.6 16.6-1.4 1.4-3.2-3.2A11 11 0 0 1 12 19c-5 0-9-4.5-10-7a13.6 13.6 0 0 1 4.3-5L3 4.4Zm5.4 5.4A4.5 4.5 0 0 0 14.2 15.6l-1.5-1.5a2.5 2.5 0 0 1-3.3-3.3L8.4 9.8ZM12 5c5 0 9 4.5 10 7a13.7 13.7 0 0 1-3.4 4.3l-1.5-1.5A11.7 11.7 0 0 0 19.7 12c-1-1.9-4-5-7.7-5-.9 0-1.7.2-2.5.4L8 5.8A9.9 9.9 0 0 1 12 5Z"/></svg>';

  function poolLabel() {
    return Object.entries(pool).filter(([, n]) => n > 0).map(([d, n]) => n + 'd' + d).join(' + ');
  }

  // ── Per-system trays ──
  // Each system's character sheet has its own dice tray with its own mechanics.
  // The GM tray mirrors the sheet's tray 1:1 so a GM can coach a player through
  // it and results read identically. GM_TRAYS maps a system key → a renderer
  // that fills the tray (trayEl) and wires its own Roll button; un-ported systems
  // fall back to the generic polyhedral pool below.
  function curSys() { return String(window.GM_SYSTEM || '').toUpperCase(); }
  function sysTray() { return GM_TRAYS[curSys()]; }

  function renderTray() {
    const sys = sysTray();
    if(sys) { try { sys(); injectTrayEye(); return; } catch(e) {} }
    renderGenericTray();
  }

  // The GM-only hide/show roll toggle sits as the left-most control on a system
  // tray's row (players' sheets never have it). The generic tray keeps its eye in
  // the pool row below (renderPool).
  function injectTrayEye() {
    const camp = GMCamp.get(); if(!camp) return;
    const row = trayEl.querySelector('.gmt-row'); if(!row) return;
    const hidden = GMCamp.isHidden();
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'dice-hide-btn' + (hidden ? ' on' : '');
    btn.title = hidden ? 'Rolls hidden from players — click to share' : 'Rolls shared with players — click to hide';
    btn.innerHTML = hidden ? ICO_EYE_OFF : ICO_EYE;
    btn.onclick = () => { GMCamp.toggleHide(); renderTray(); };
    row.insertBefore(btn, row.firstChild);
  }

  // Tap a die to add it to the pool (right-click removes one); the pool reads
  // out above the dice, and Roll throws the lot — the same tray the sheets have.
  function renderGenericTray() {
    const label = poolLabel();
    let h = label ? '<div class="dice-pool-label-row"><span class="dice-pool-label">' + label + '</span></div>' : '';
    h += '<div class="dice-btn-row">';
    DICE.forEach(d => {
      const n = pool[d] || 0;
      h += '<button class="dice-die' + (n ? ' has' : '') + '" data-d="' + d + '" title="Add a d' + d + ' (right-click removes one)">d' + d + (n ? '<span class="dice-count">' + n + '</span>' : '') + '</button>';
    });
    h += '</div>';
    trayEl.innerHTML = h;
    trayEl.querySelectorAll('.dice-die').forEach(b => {
      b.onclick = () => { const d = parseInt(b.dataset.d, 10); pool[d] = (pool[d] || 0) + 1; renderTray(); };
      b.oncontextmenu = e => { e.preventDefault(); const d = parseInt(b.dataset.d, 10); if(pool[d]) pool[d]--; renderTray(); };
    });
  }

  // The GM-only campaign share/hide roll toggle, shown under every tray when a
  // campaign is linked (players never see this control).
  function hideEyeRow() {
    const camp = GMCamp.get(); if(!camp) return '';
    const hidden = GMCamp.isHidden();
    return '<button class="dice-hide-btn' + (hidden ? ' on' : '') + '" title="' + (hidden ? 'Rolls hidden from players — click to share' : 'Rolls shared with players — click to hide') + '">' + (hidden ? ICO_EYE_OFF : ICO_EYE) + '</button>';
  }
  function wireHideEye() {
    const hideBtn = poolEl.querySelector('.dice-hide-btn');
    if(hideBtn) hideBtn.onclick = () => { GMCamp.toggleHide(); renderPool(); };
  }

  // Under the dice: for the generic pool it's ADV / DIS · ✕ · Roll; for a system
  // tray (which carries its own Roll button) it's just the campaign share eye.
  function renderPool() {
    if(sysTray()) {
      // System trays carry their Roll button and the hide/show eye inline, so the
      // pool row below is empty.
      poolEl.innerHTML = '';
      return;
    }
    let h = '<div class="dice-pool-row">';
    h += hideEyeRow();
    h += '<button class="dice-advbtn' + (advMode === 'adv' ? ' on-adv' : '') + '" data-m="adv" title="Advantage (d20)">▲ ADV</button>';
    h += '<button class="dice-advbtn' + (advMode === 'dis' ? ' on-dis' : '') + '" data-m="dis" title="Disadvantage (d20)">▼ DIS</button>';
    h += '<button class="dice-pool-clear" title="Clear pool">✕</button>';
    h += '<button class="dice-roll-go" title="Roll the pool">🎲 Roll</button>';
    h += '</div>';
    poolEl.innerHTML = h;
    poolEl.querySelectorAll('.dice-advbtn').forEach(b => { b.onclick = () => { advMode = advMode === b.dataset.m ? 'none' : b.dataset.m; renderPool(); }; });
    poolEl.querySelector('.dice-roll-go').onclick = doRoll;
    poolEl.querySelector('.dice-pool-clear').onclick = () => { pool = {}; advMode = 'none'; renderTray(); renderPool(); };
    wireHideEye();
  }

  function doRoll() {
    const dice = Object.entries(pool).filter(([, n]) => n > 0).map(([d, n]) => [parseInt(d, 10), n]);
    if(!dice.length) return;
    rollCore(dice, 0, advMode, null);
  }

  function escGm(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  // A tactile dice-count stepper: [−] N [+]. Shared by the pool-based systems.
  function stepperHtml(id, val, min, max) {
    return '<button class="gmt-step" data-step="' + id + '" data-dir="-1">−</button>'
      + '<input class="gmt-num" id="' + id + '" type="number" min="' + min + '" max="' + max + '" value="' + val + '">'
      + '<button class="gmt-step" data-step="' + id + '" data-dir="1">+</button>';
  }
  function wireStepper(id, min, max, onset) {
    const inp = trayEl.querySelector('#' + id);
    const clamp = v => Math.max(min, Math.min(max, v));
    const set = v => { const c = clamp(v); inp.value = c; if(onset) onset(c); };
    if(inp) inp.oninput = () => { const c = clamp(parseInt(inp.value, 10) || min); if(onset) onset(c); };
    trayEl.querySelectorAll('.gmt-step[data-step="' + id + '"]').forEach(b => {
      b.onclick = () => set((parseInt(inp.value, 10) || min) + parseInt(b.dataset.dir, 10));
    });
  }

  // Remembered per-tray counts so a roll doesn't reset what the GM dialed in.
  const _tray = { yz: 5, wild: 4, ghost: 4, co: 2, mvE: 0, mvT: 0 };

  // ════════ YZE — Year Zero Engine (D6 pool: each 6 a success, each 1 a bane) ════════
  function yzCount(rolls) { let s = 0, b = 0; rolls.forEach(v => { if(v === 6) s++; else if(v === 1) b++; }); return { s, b }; }
  function yzTier(s) { return s >= 2 ? { t: 'SUCCESS ×' + s, type: 'crit' } : s === 1 ? { t: 'SUCCESS', type: 'crit' } : { t: 'FAILURE', type: 'fumble' }; }
  function renderYZETray() {
    trayEl.innerHTML = '<div class="gmt"><div class="gmt-row">' + stepperHtml('yz-pool', _tray.yz, 1, 20)
      + '<button class="gmt-roll" id="yz-roll">Roll</button></div></div>';
    wireStepper('yz-pool', 1, 20, v => { _tray.yz = v; });
    trayEl.querySelector('#yz-roll').onclick = yzRoll;
  }
  function yzRoll() {
    const size = Math.max(1, Math.min(20, parseInt((trayEl.querySelector('#yz-pool') || {}).value, 10) || 1));
    _tray.yz = size;
    const base = []; for(let i = 0; i < size; i++) base.push(d6());
    const c = yzCount(base), tier = yzTier(c.s);
    const detail = size + 'd6(' + base.join(',') + ') · ' + c.s + ' succ' + (c.b ? ' · ' + c.b + ' bane' + (c.b > 1 ? 's' : '') : '');
    gmLog('YZE pool', c.s + ' · ' + tier.t, detail, tier.type);
  }

  // ════════ WEG D6 — Star Wars / ACE! / D6 2e (pool of d6, last is the Wild Die) ════════
  // The Wild Die explodes on a 6 (re-roll and add) and a 1 is a complication.
  function renderWildTray() {
    trayEl.innerHTML = '<div class="gmt"><div class="gmt-row">' + stepperHtml('wd-n', _tray.wild, 1, 15)
      + '<button class="gmt-roll" id="wd-roll">Roll</button></div></div>';
    wireStepper('wd-n', 1, 15, v => { _tray.wild = v; });
    trayEl.querySelector('#wd-roll').onclick = wildRoll;
  }
  function wildRoll() {
    const n = Math.max(1, Math.min(15, parseInt((trayEl.querySelector('#wd-n') || {}).value, 10) || 1));
    _tray.wild = n;
    const reg = []; for(let i = 0; i < n - 1; i++) reg.push(d6());
    let w = d6(); const wildFaces = [w]; const complication = (w === 1); let guard = 0;
    while(w === 6 && guard++ < 20) { w = d6(); wildFaces.push(w); }
    const exploded = wildFaces[0] === 6;
    const total = reg.reduce((a, b) => a + b, 0) + wildFaces.reduce((a, b) => a + b, 0);
    // Format matches the animation parser: "<n>D: [regular dice] ✦[wild→chain]".
    const detail = n + 'D: [' + reg.join(' ') + '] ✦[' + wildFaces.join('→') + ']';
    const type = exploded ? 'crit' : complication ? 'fumble' : '';
    const tag = exploded ? ' ✦' : complication ? ' ⚠' : '';
    gmLog('D6 wild pool', total + tag, detail, type);
  }

  // ════════ Ghostbusters — like the wild pool, but one die is the Ghost Die ════════
  // A 6 on the Ghost Die counts 0 and signals trouble (it never explodes).
  function renderGhostTray() {
    trayEl.innerHTML = '<div class="gmt"><div class="gmt-row">' + stepperHtml('gh-n', _tray.ghost, 1, 15)
      + '<button class="gmt-roll" id="gh-roll">Roll</button></div></div>';
    wireStepper('gh-n', 1, 15, v => { _tray.ghost = v; });
    trayEl.querySelector('#gh-roll').onclick = ghostRoll;
  }
  function ghostRoll() {
    const n = Math.max(1, Math.min(15, parseInt((trayEl.querySelector('#gh-n') || {}).value, 10) || 1));
    _tray.ghost = n;
    const normals = []; for(let i = 0; i < n - 1; i++) normals.push(d6());
    const ghost = d6(), isGhost = (ghost === 6);
    const sum = normals.reduce((a, b) => a + b, 0) + (isGhost ? 0 : ghost);
    const detail = n + 'd6(' + normals.concat([ghost]).join(',') + ')' + (isGhost ? ' · Ghost = 0' : '');
    gmLog('Ghost pool', sum + (isGhost ? ' · 👻 GHOST' : ''), detail, isGhost ? 'fumble' : '');
  }

  // ════════ Candela Obscura — d6 pool, take the highest (0 dice → roll 2, take lowest) ════════
  function coTier(high, sixes, zero) { if(!zero && sixes >= 2) return { t: 'CRITICAL', type: 'crit' }; if(high === 6) return { t: 'FULL SUCCESS', type: 'crit' }; if(high >= 4) return { t: 'MIXED', type: '' }; return { t: 'MISS', type: 'fumble' }; }
  function renderCandelaTray() {
    trayEl.innerHTML = '<div class="gmt"><div class="gmt-row">' + stepperHtml('co-n', _tray.co, 0, 6)
      + '<button class="gmt-roll" id="co-roll">Roll</button></div></div>';
    wireStepper('co-n', 0, 6, v => { _tray.co = v; });
    trayEl.querySelector('#co-roll').onclick = candelaRoll;
  }
  function candelaRoll() {
    const n = Math.max(0, Math.min(6, parseInt((trayEl.querySelector('#co-n') || {}).value, 10) || 0));
    _tray.co = n;
    let rolls = [], zero = false;
    if(n <= 0) { zero = true; rolls = [d6(), d6()]; } else { for(let i = 0; i < n; i++) rolls.push(d6()); }
    const high = zero ? Math.min(rolls[0], rolls[1]) : Math.max.apply(null, rolls);
    const sixes = rolls.filter(v => v === 6).length, t = coTier(high, sixes, zero);
    gmLog('Candela' + (zero ? ' · 0d' : ''), high + ' · ' + t.t, (zero ? 'take lowest ' : '') + rolls.length + 'd6(' + rolls.join(',') + ')', t.type);
  }

  // ════════ Marvel Multiverse — d616 (3d6; the middle Marvel die shows 1 = 6 + Fantastic) ════════
  // Separate Edge and Trouble counters like the sheet — they cancel to a net, and
  // each net edge re-rolls the lowest die keeping the higher (trouble: the reverse).
  function mvStep(kind, label, cls) {
    return '<span class="gmt-et ' + cls + '"><span class="gmt-etl">' + label + '</span>'
      + '<button class="gmt-step" data-mv="' + kind + '" data-dir="-1">−</button>'
      + '<span class="gmt-etv" id="mv-' + kind + '">' + (kind === 'edge' ? _tray.mvE : _tray.mvT) + '</span>'
      + '<button class="gmt-step" data-mv="' + kind + '" data-dir="1">+</button></span>';
  }
  function renderMarvelTray() {
    trayEl.innerHTML = '<div class="gmt"><div class="gmt-row gmt-mv">'
      + mvStep('edge', 'Edge', 'gmt-edge') + mvStep('trouble', 'Trouble', 'gmt-trouble')
      + '<button class="gmt-roll" id="mv-roll">Roll</button></div></div>';
    trayEl.querySelectorAll('.gmt-step[data-mv]').forEach(b => {
      b.onclick = () => {
        const kind = b.dataset.mv, dir = parseInt(b.dataset.dir, 10);
        if(kind === 'edge') _tray.mvE = Math.max(0, Math.min(9, (_tray.mvE || 0) + dir));
        else _tray.mvT = Math.max(0, Math.min(9, (_tray.mvT || 0) + dir));
        const el = trayEl.querySelector('#mv-' + kind); if(el) el.textContent = (kind === 'edge' ? _tray.mvE : _tray.mvT);
      };
    });
    trayEl.querySelector('#mv-roll').onclick = marvelRoll;
  }
  function marvelRoll() {
    const eE = _tray.mvE || 0, tT = _tray.mvT || 0, netE = eE - tT;
    const dice = [{ v: d6(), marvel: false }, { v: d6(), marvel: true }, { v: d6(), marvel: false }];
    const faceOf = x => (x.marvel && x.v === 1) ? 6 : x.v;
    const cnt = Math.abs(netE);
    for(let i = 0; i < cnt && i < 3; i++) {
      let idx = 0, best = faceOf(dice[0]);
      for(let j = 1; j < 3; j++) { const f = faceOf(dice[j]); if(netE > 0 ? f < best : f > best) { best = f; idx = j; } }
      const nv = d6(), oldf = faceOf(dice[idx]), newf = faceOf({ v: nv, marvel: dice[idx].marvel });
      if(netE > 0 ? newf > oldf : newf < oldf) dice[idx].v = nv;
    }
    const fantastic = (dice[1].v === 1), marvelVal = fantastic ? 6 : dice[1].v;
    const sum = faceOf(dice[0]) + marvelVal + faceOf(dice[2]);
    const etTxt = (eE || tT) ? (' · ' + (eE ? eE + 'E' : '') + (tT ? tT + 'T' : '')) : '';
    // "3d6(a,b,c)" so the parser animates all three; the Marvel die is the middle one.
    const detail = '3d6(' + dice[0].v + ',' + dice[1].v + ',' + dice[2].v + ') · ✦' + (fantastic ? 'Marvel 1→6' : 'Marvel ' + dice[1].v) + etTxt;
    gmLog('d616', sum + (fantastic ? ' · ✦ FANTASTIC' : ''), detail, fantastic ? 'crit' : '');
  }

  // ════════ Kids on Bikes — tap a die to roll it once (no pool, no adv/dis) ════════
  function renderKOBTray() {
    const dice = diceForSystem('KOB');
    let h = '<div class="gmt"><div class="gmt-row gmt-kob">';
    dice.forEach(d => { h += '<button class="dice-die gmt-die" data-d="' + d + '" title="Roll a d' + d + '">d' + d + '</button>'; });
    h += '</div></div>';
    trayEl.innerHTML = h;
    trayEl.querySelectorAll('.gmt-die').forEach(b => { b.onclick = () => rollCore([[parseInt(b.dataset.d, 10), 1]], 0, 'none', null); });
  }

  // Registry of system-specific trays. Systems absent here (D&D, Shadowdark,
  // Nimble, ICRPG, DCC, Justice League) use the shared generic pool tray.
  const GM_TRAYS = {
    YZE: renderYZETray,
    SW: renderWildTray, ACE: renderWildTray, D62E: renderWildTray,
    GB: renderGhostTray,
    CO: renderCandelaTray,
    MMRPG: renderMarvelTray,
    KOB: renderKOBTray,
  };

  // The rolling mechanic itself, so the tray's Roll button and other tools
  // (a monster's attack or ability check) produce identical entries.
  //   dice: [[sides, count], ...]   label: overrides the pool description
  function rollCore(dice, modifier, advMode, label) {
    let detailParts = [];
    let total = modifier;
    let crit = '';
    const isSingleD20 = dice.length===1 && dice[0][0]===20 && dice[0][1]===1;
    dice.forEach(([d, n])=>{
      if(d===20 && isSingleD20 && advMode!=='none') {
        const r1 = 1+Math.floor(Math.random()*20), r2 = 1+Math.floor(Math.random()*20);
        const keep = advMode==='adv' ? Math.max(r1,r2) : Math.min(r1,r2);
        detailParts.push('d20('+r1+','+r2+' '+(advMode==='adv'?'▲':'▼')+' '+keep+')');
        total += keep;
        if(keep===20) crit='crit'; else if(keep===1) crit='fumble';
      } else {
        const rolls = [];
        for(let i=0;i<n;i++){ rolls.push(1+Math.floor(Math.random()*d)); }
        detailParts.push(n+'d'+d+'('+rolls.join(',')+')');
        total += rolls.reduce((a,b)=>a+b,0);
        if(d===20 && n===1) { if(rolls[0]===20) crit='crit'; else if(rolls[0]===1) crit='fumble'; }
      }
    });
    if(modifier) detailParts.push((modifier>0?'+':'')+modifier);
    // Against a difficulty the entry reads as a success or failure (a natural
    // 20 / 1 still wins the colour), exactly as the character sheets do.
    const nat = crit;
    const entry = {
      label: label || poolLabel() || dice.map(([d, n]) => n + 'd' + d).join(' + ') + (modifier ? (modifier > 0 ? ' +' : ' ') + modifier : ''),
      adv: isSingleD20 ? advMode : 'none',
      detail: detailParts.join(' '),
      total, crit, nat
    };
    return pushEntry(entry);
  }

  // Shared tail: drop a finished entry into the log and out to the campaign.
  // Every roller — the generic pool, the per-system trays, and external rolls —
  // funnels through here so the log + broadcast behave identically.
  function pushEntry(entry) {
    log.unshift(entry);
    if(log.length > 100) log.length = 100;
    renderLog();
    GMCamp.broadcast(entry);
    return entry;
  }

  // A per-system tray logs a resolved roll. `result` is the headline (a number
  // or short text like "2 · SUCCESS ×2"); `type` colours it: 'crit' = success/
  // hit (green), 'fumble' = failure/miss (red), 'normal' = neutral.
  function gmLog(label, result, detail, type) {
    return pushEntry({ label: label, total: result, detail: detail,
      crit: type === 'crit' ? 'crit' : type === 'fumble' ? 'fumble' : '', nat: '', adv: 'none' });
  }
  function d6() { return 1 + Math.floor(Math.random() * 6); }
  // Dice animation on the GM screen is driven by the roll log's detail string
  // (dice-anim.js hooks GMCamp.broadcast and parses `entry.detail`), so each
  // tray's detail is written in a parser-friendly format rather than animated
  // by hand here.

  function renderLog() {
    if(!log.length) {
      logEl.innerHTML = '';
      return;
    }
    const esc = v => String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;');
    logEl.innerHTML = log.map(e=>{
      if(e.type === 'foundloot' || e.type === 'lootbox') {
        const p = e.payload || {}, items = Array.isArray(p.items) ? p.items : [], claimed = e.claimed || {}, taken = e.taken || {};
        const mode = p.mode || (e.type === 'lootbox' ? 'copies' : 'claim'), to = String(p.to || '').trim();
        const forLine = mode === 'named' ? '<div class="fl-for">For: ' + esc(to || '?') + '</div>' : mode === 'copies' ? '<div class="fl-for">A copy for everyone</div>' : '<div class="fl-for">First to claim</div>';
        const rows = items.map((it, i) => {
          const by = claimed[i] || claimed.all, took = (taken[i] || []).concat(taken.all || []);
          const chip = mode === 'copies'
            ? '<span class="fl-by' + (took.length ? '' : ' open') + '">' + (took.length ? 'Taken by ' + esc(took.join(', ')) : 'Not taken yet') + '</span>'
            : '<span class="fl-by' + (by ? '' : ' open') + '">' + (by ? (e.type === 'lootbox' && mode !== 'claim' ? 'Opened by ' : 'Claimed by ') + esc(by) : 'Unclaimed') + '</span>';
          return '<li class="fl-item"><span>' + esc(it.item || '?') + (it.qty != null && String(it.qty) !== '1' && String(it.qty) !== '' ? ' ×' + esc(it.qty) : '') + (it.notes ? ' <span class="fl-note">' + esc(it.notes) + '</span>' : '') + '</span>' + chip + '</li>';
        }).join('');
        return '<div class="dice-log-entry foundloot"><div class="fl-head">🎁 ' + esc(e.source ? e.source + ' · ' : '') + esc(e.label || 'FOUND LOOT') + (e.local ? ' <span class="fl-sent">sent</span>' : '') + '</div>'
          + (e.total ? '<div class="fl-name">' + esc(e.total) + '</div>' : '') + forLine + (p.note ? '<div class="fl-body">' + esc(p.note) + '</div>' : '')
          + (rows ? '<ul class="fl-items">' + rows + '</ul>' : (e.type === 'lootbox' ? '<div class="fl-body">' + esc(e.detail) + '</div>' : '')) + '</div>';
      }
      if(e.type === 'system' || e.type === 'achievement') {
        return '<div class="dice-log-entry system"><div class="fl-head">' + esc(e.source ? e.source + ' · ' : '') + esc(e.label || 'MESSAGE') + (e.local ? ' <span class="fl-sent">sent</span>' : '') + '</div>'
          + (e.total ? '<div class="fl-name">' + esc(e.total) + '</div>' : '') + (e.detail ? '<div class="fl-body">' + esc(e.detail) + '</div>' : '') + '</div>';
      }
      const critTag = e.nat==='crit' ? ' ★ NAT 20' : e.nat==='fumble' ? ' ✗ NAT 1' : '';
      const advTag = e.adv==='adv' ? ' <span style="color:#6dbf6d;font-size:8px;">▲ADV</span>'
                   : e.adv==='dis' ? ' <span style="color:#df6a6a;font-size:8px;">▼DIS</span>' : '';
      const srcTag = e.remote ? '<span style="color:#8a7ac8;">'+String(e.source||'').replace(/</g,'&lt;')+'</span> · ' : '';
      return '<div class="dice-log-entry'+(e.remote?' remote':'')+(e.crit==='crit'?' crit':e.crit==='fumble'?' fumble':'')+'">'
        + '<div class="roll-label">'+srcTag+String(e.label).replace(/</g,'&lt;')+critTag+advTag+'</div>'
        + '<div class="roll-result">'+e.total+'</div>'
        + '<div class="roll-detail">'+e.detail+'</div>'
        + '</div>';
    }).join('');
    logEl.scrollTop = 0;
  }

  clearBtn.addEventListener('click', ()=>{ log = []; renderLog(); });

  // "1d20+2", "2d6", "1d8 + curse", "+3" → { dice:[[sides,count]], mod }
  // Trailing prose (the "+ curse" in a damage note) is ignored.
  function parseFormula(expr) {
    const dice = [];
    let mod = 0;
    String(expr || '').replace(/([+-]?)\s*(\d*)d(\d+)|([+-]\s*\d+)/gi, (all, sign, count, sides, flat) => {
      if(sides) {
        dice.push([parseInt(sides, 10), Math.max(1, parseInt(count || '1', 10))]);
      } else if(flat) {
        mod += parseInt(flat.replace(/\s+/g, ''), 10) || 0;
      }
      return '';
    });
    return { dice, mod };
  }

  // Called from other tools (see window.rollToDiceTray). With no explicit
  // advantage it inherits whatever ADV/DIS is currently set on the tray, so a
  // monster's checks obey the same toggle the GM already flipped.
  root._externalRoll = (label, expr, adv) => {
    const { dice, mod } = parseFormula(expr);
    if(!dice.length && !mod) return null;
    return rollCore(dice, mod, adv || advMode, label || String(expr));
  };

  // One d20 honouring advantage/disadvantage.
  function rollD20(mode) {
    if(mode === 'adv' || mode === 'dis') {
      const r1 = 1 + Math.floor(Math.random() * 20), r2 = 1 + Math.floor(Math.random() * 20);
      const keep = mode === 'adv' ? Math.max(r1, r2) : Math.min(r1, r2);
      return { value: keep, detail: `d20(${r1},${r2} ${mode === 'adv' ? '▲' : '▼'} ${keep})` };
    }
    const r = 1 + Math.floor(Math.random() * 20);
    return { value: r, detail: `d20(${r})` };
  }

  // An attack: to-hit and damage in a single entry, the way the character
  // sheet reports them ("Hit: 15  |  Dmg: 4"). ADV/DIS applies to the d20 only.
  root._attackRoll = (label, hitMod, dmgExpr, adv) => {
    const mode = adv || advMode;
    const hasHit = hitMod !== null && hitMod !== undefined && hitMod !== '';
    const mod = hasHit ? (parseInt(String(hitMod).replace(/\s+/g, ''), 10) || 0) : 0;

    let hitTotal = null, crit = '', detailParts = [];
    if(hasHit) {
      const { value, detail } = rollD20(mode);
      hitTotal = value + mod;
      crit = value === 20 ? 'crit' : value === 1 ? 'fumble' : '';
      detailParts.push(`${detail}${mod ? (mod > 0 ? '+' : '') + mod : ''}=${hitTotal}`);
    }

    let dmgTotal = null;
    if(dmgExpr) {
      const { dice, mod: dmod } = parseFormula(dmgExpr);
      if(dice.length || dmod) {
        dmgTotal = dmod;
        const bits = [];
        dice.forEach(([sides, count]) => {
          const rolls = [];
          for(let i = 0; i < count; i++) rolls.push(1 + Math.floor(Math.random() * sides));
          dmgTotal += rolls.reduce((a, b) => a + b, 0);
          bits.push(`${count}d${sides}(${rolls.join(',')})`);
        });
        if(dmod) bits.push((dmod > 0 ? '+' : '') + dmod);
        detailParts.push(`${bits.join(' ')}=${dmgTotal}`);
      }
    }
    if(hitTotal === null && dmgTotal === null) return null;

    const total = hitTotal !== null && dmgTotal !== null ? `Hit: ${hitTotal}  |  Dmg: ${dmgTotal}`
                : hitTotal !== null ? `Hit: ${hitTotal}`
                : `Dmg: ${dmgTotal}`;
    const entry = {
      label: label || 'Attack',
      adv: hasHit ? mode : 'none',
      detail: detailParts.join('  |  '),
      total, crit, nat: crit
    };
    log.unshift(entry);
    if(log.length > 100) log.length = 100;
    renderLog();
    GMCamp.broadcast(entry);
    return entry;
  };

  // A DCC monster attack. The GM never rolls to hit, and the attack's "X+F" Evade
  // DC must stay hidden from players — the roll log is broadcast to the whole
  // campaign — so we roll and show ONLY the damage. The GM reads the DC off the
  // monster card's own attack button.
  root._dccAttackRoll = (label, dmgExpr, adv) => {
    let dmgTotal = null; const detailParts = [];
    if(dmgExpr) {
      const { dice, mod: dmod } = parseFormula(dmgExpr);
      if(dice.length || dmod) {
        dmgTotal = dmod; const bits = [];
        dice.forEach(([sides, count]) => {
          const rolls = [];
          for(let i = 0; i < count; i++) rolls.push(1 + Math.floor(Math.random() * sides));
          dmgTotal += rolls.reduce((a, b) => a + b, 0);
          bits.push(`${count}d${sides}(${rolls.join(',')})`);
        });
        if(dmod) bits.push((dmod > 0 ? '+' : '') + dmod);
        detailParts.push(`${bits.join(' ')}=${dmgTotal}`);
      }
    }
    const entry = { label: label || 'Attack', adv: 'none', detail: detailParts.join('  |  '), total: dmgTotal !== null ? ('Dmg: ' + dmgTotal) : '—', crit: '' };
    log.unshift(entry);
    if(log.length > 100) log.length = 100;
    renderLog();
    GMCamp.broadcast(entry);
    return entry;
  };

  // Collapse duplicate remote rolls when restoring a saved log: by server id
  // when present, or by a content signature for older entries saved before ids
  // were tracked. Local (GM) rolls are never collapsed — identical ones are kept.
  function dedupeLog(arr) {
    const seen = new Set();
    const out = [];
    for(const e of (arr || [])) {
      if(!e) continue;
      let key = null;
      if(e.id != null) key = 'id:' + e.id;
      else if(e.remote) key = 'sig:' + e.label + '|' + e.total + '|' + e.detail + '|' + e.source;
      if(key !== null) { if(seen.has(key)) continue; seen.add(key); }
      out.push(e);
    }
    return out;
  }

  // Entries saved while a drop was still typed 'normal' (older server / older
  // log) carry the JSON in `detail` — turn them back into loot cards on restore.
  function upgradeSavedEntry(e) {
    if(!e || e.type || !e.remote && !e.local) return e;
    const r = sniffRollType({ type: 'normal', detail: e.detail });
    if(!r.type || r.type === 'normal') return e;
    let payload = {}; try { payload = JSON.parse(e.detail || '{}'); } catch(err) { payload = {}; }
    return Object.assign({}, e, { type: r.type, payload, crit: '' });
  }
  // Claims never get an entry of their own: fold any saved raw claim into the
  // drop it belongs to (the log is newest-first, so walk it oldest-first).
  function upgradeSavedLog(arr) {
    const out = [];
    for(let i = arr.length - 1; i >= 0; i--) {
      const e = upgradeSavedEntry(arr[i]);
      if(e && e.type === 'lootclaim') {
        const pc = e.payload || {}, drop = out.find(x => x.payload && ((pc.dropId && x.payload.dropId === pc.dropId) || (pc.boxId && x.payload.boxId === pc.boxId)));
        if(drop) {
          const key = pc.itemIndex == null ? 'all' : pc.itemIndex, who = pc.by || e.source || 'Someone';
          if(pc.mode === 'copies' || drop.payload.mode === 'copies') { drop.taken = drop.taken || {}; const l = drop.taken[key] = drop.taken[key] || []; if(!l.some(n => n.toLowerCase() === who.toLowerCase())) l.push(who); }
          else { drop.claimed = drop.claimed || {}; drop.claimed[key] = who; }
        }
        continue;
      }
      out.push(e);
    }
    return out.reverse();
  }
  // One-tap roll from the bottom Command bar dice: throw a single die of the
  // given size straight into this log (shares the campaign broadcast).
  root._quickRoll = (sides) => { const n = parseInt(sides, 10); if(n) return rollCore([[n, 1]], 0, 'none', null); };
  root._getState = () => ({ log });
  root._setState = (s) => {
    if(!s) return;
    if(Array.isArray(s.log)) log = upgradeSavedLog(dedupeLog(s.log));
    // Sessions saved before the link moved to the top bar kept it in here
    if(s.campaign || typeof s.hideRolls === 'boolean') GMCamp.restore(s);
    renderLog();
    renderPool();
  };

  // Follow the active system: swap the die set to match its sheet's tray. The
  // pool is cleared because its die sizes may no longer be offered.
  document.addEventListener('gm-system-change', () => {
    // Swap to the new system's tray (or generic die set) and reset transient
    // per-tray state so a half-built roll doesn't carry across systems.
    DICE = diceForSystem(window.GM_SYSTEM);
    pool = {}; advMode = 'none';
    renderTray(); renderPool();
  });

  renderTray();
  renderPool();
  renderLog();
}
window.init_dice = init_dice;

// Roll something straight into the Dice tray from another tool. The tray is
// created on demand, so this works before it has ever been opened.
window.rollToDiceTray = function(label, expr, adv) {
  try {
    const node = getOrCreateInstance('dice');
    if(node && typeof node._externalRoll === 'function') return !!node._externalRoll(label, expr, adv);
  } catch(e) {}
  return false;
};

// To-hit + damage as one roll, matching how the character sheet reports attacks.
window.rollAttackToDiceTray = function(label, hitMod, dmgExpr, adv) {
  try {
    const node = getOrCreateInstance('dice');
    if(node && typeof node._attackRoll === 'function') return !!node._attackRoll(label, hitMod, dmgExpr, adv);
  } catch(e) {}
  return false;
};

// DCC monster attack: damage only (no d20 to-hit; the Evade DC stays hidden).
window.rollDccAttackToDiceTray = function(label, dmgExpr, adv) {
  try {
    const node = getOrCreateInstance('dice');
    if(node && typeof node._dccAttackRoll === 'function') return !!node._dccAttackRoll(label, dmgExpr, adv);
  } catch(e) {}
  return false;
};

</script>

<script>
// ══════════════════════════════════════════
// PARTY TOOL — view the players' character sheets
// Sheets arrive three ways:
//   1. Sync — GET /api/campaigns/{id}/characters for the linked campaign
//   2. Add Sheet — the .json a player exports from the character sheet
//   3. Paste — the same JSON pasted in
// ══════════════════════════════════════════
function init_party(root) {
  const fileInput = root.querySelector('.pty-file-input');
  const syncBtn   = root.querySelector('.pty-sync');
  const clearBtn  = root.querySelector('.pty-clear');
  const noteEl    = root.querySelector('.pty-note');
  const listEl    = root.querySelector('.pty-list');
  const emptyEl   = root.querySelector('.pty-empty');

  let chars = [];          // [{id, source, sheet}]
  let lastSync = null;
  let _lastSyncPayload = null;  // raw last response — lets quiet syncs skip identical rosters
  let _lastSyncToken = null;    // server change-token — lets the server skip building the roster at all
  let openIds = new Set();
  // Which collapsible card sections (Skills / Attacks) are collapsed, keyed
  // "<entryId>:<sectionName>". Absent = expanded (the default).
  let secClosed = new Set();
  let nextId = 1;

  const esc = t => String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const mod = v => { const m = Math.floor(((parseInt(v)||10) - 10) / 2); return (m >= 0 ? '+' : '') + m; };

  // Look up a DCC skill or spell for its details (spells ARE skills in DCC). Tries
  // the reskin `src` first, then the name (parenthetical-stripped, then raw).
  function dccDetail(name, src) {
    const norm = t => String(t || '').toLowerCase().replace(/[^a-z]/g, '');
    const cands = [src, String(name || '').replace(/\s*\([^)]*\)\s*$/, '').trim(), name].filter(Boolean);
    const find = arr => {
      for(const c of cands) { const n = norm(c); const hit = arr.find(x => norm(x.name) === n); if(hit) return hit; }
      return null;
    };
    let e = (typeof DCC_SKILLS !== 'undefined') ? find(DCC_SKILLS) : null;
    let kind = 'skill';
    if(!e && typeof DCC_SPELLS !== 'undefined') { e = find(DCC_SPELLS); kind = 'spell'; }
    if(!e) return '';
    const bits = [];
    if(kind === 'spell') { bits.push('Spell'); if(e.type) bits.push(e.type); if(e.mana != null) bits.push(e.mana + ' Mana'); }
    else { bits.push(e.category === 'attack' ? 'Attack' : 'Utility'); if(e.group) bits.push(e.group); if(e.passive) bits.push('Passive'); if(e.interrupt) bits.push('Interrupt'); }
    if(e.stat) bits.push(String(e.stat).toUpperCase());
    if(e.damage) bits.push(e.damage + (e.range ? ' · ' + e.range : ''));
    const meta = bits.length ? '<b>' + esc(bits.join(' · ')) + '</b><br>' : '';
    const ups = (e.upgrades || []).map(u => '<br><b>Rank ' + esc(u.rank) + ':</b> ' + esc(u.text)).join('');
    return meta + esc(e.desc || 'No description on file.') + ups;
  }

  // Build a Party-tool summary from a Dungeon Crawler Carl sheet's saved data.
  // Everything the DCC card shows is computed here from the raw sheet: stat mods
  // use the sheet's enhanced/unenhanced source, and evade/DR/mana totals mirror
  // the sheet's own math (evade = DEX mod + buffs; DR = armor + buffs; mana max =
  // enhanced INT). The DCC sheet stores raw fields only, so no sheet change needed.
  function dccParty(d) {
    const src = d.globalModSource === 'unenhanced' ? 'unenh' : 'enh';
    // DCC uses its OWN score→modifier table (not D&D's (score-10)/2), and mods are
    // always positive. This must match the character sheet's statToMod exactly, or the
    // Party card shows wrong (negative) mods.
    const toMod = v => { const n = parseInt(v); if(isNaN(n) || n < 1) return null;
      return n<=2?1 : n<=5?2 : n<=9?3 : n<=19?4 : n<=49?5 : n<=99?6 : n<=149?7 : n<=199?8 : n<=299?9 : 10; };
    const S = d.stats || {}, H = d.header || {}, C = d.combat || {};
    const statMod = id => toMod((S[id] || {})[src]);
    const num = v => parseInt(v) || 0;
    return {
      system:  'DCC',
      name:    H['f-name'] || 'Unnamed',
      race:    H['f-race'] || '',
      cls:     H['f-class'] || '',
      level:   H['f-level'] || '1',
      floor:   H['f-floor'] || '',
      crawler: H['f-crawler'] || '',
      modSource: src === 'unenh' ? 'Unenhanced' : 'Enhanced',
      hpPips:  Array.isArray(d.hpPips) ? d.hpPips : [],
      stats:   [['STR','str'],['INT','int'],['CON','con'],['DEX','dex'],['CHA','cha']].map(([abbr,id]) =>
                 ({ abbr, mod: statMod(id), enh:(S[id]||{}).enh || '', unenh:(S[id]||{}).unenh || '' })),
      evade:   { total: (statMod('dex') || 0) + num(C.evadeBuffs), move: C.evadeMove || '', step: C.evadeStep || '' },
      dr:      { total: num(C.drArmor) + num(C.drBuffs), aiFavor: C.drAiFavor || '', size: C.drSize || '' },
      mana:    { current: C.manaCurrentVal || '', max: (S.int || {}).enh || '' },
      buffs:   Array.isArray(d.extBuffs) ? d.extBuffs.filter(b => b && String(b).trim()) : [],
      debuffs: C.debuffs || '',
      attacks: Array.isArray(d.attacks) ? d.attacks.filter(a => a && (a.name || a.dice)) : [],
      // Skills are a first-class part of the DCC sheet now; surface named ones
      // (with rank + linked stat) so the GM can see what each crawler can do.
      skills:  Array.isArray(d.skills) ? d.skills
                 .filter(s => s && String(s.name || '').trim())
                 .map(s => ({ name: s.name, rank: s.rank || '', stat: s.stat || '', src: s.src || '' })) : [],
    };
  }

  // Build a Party-tool summary from an ACE! Hero ID Card. The card stores raw
  // Stats/Focuses; Defence and Health are recomputed here the way the card does
  // (Moves ×3 +6 Dodging, min 8, + gear bonus; Brawn +2 Tough + bonus).
  function aceParty(d) {
    const S = d.stats || {}, F = d.focuses || {}, FL = d.focusList || {};
    const n = v => parseInt(v) || 0;
    // Dodging/Tough can be ANY focus line on the stat (Advancement adds extras), so
    // scan the full focusList the sheet exports — not just the first focus (F.*).
    const hasFoc = (id, re) => (Array.isArray(FL[id]) ? FL[id] : [F[id]]).some(f => re.test(f || ''));
    const ids = ['smarts','moves','style','brawn'].concat(d.hasPower ? ['power'] : []);
    let def = n(S.moves) * 3 + (hasFoc('moves', /^dodg/i) ? 6 : 0);
    if(def < 8) def = 8;
    def += n(d.defBonus);
    const hpMax = Math.max(0, n(S.brawn) + (hasFoc('brawn', /^tough/i) ? 2 : 0) + n(d.hpBonus));
    const hpCur = (typeof d.hpCur === 'number') ? d.hpCur : hpMax;
    return {
      system: 'ACE',
      name: d.name || 'Unnamed',
      trait: d.trait || '', role: d.role || '', role2: d.role2 || '', setting: d.setting || '',
      stats: ids.map(id => ({ id, abbr: id.charAt(0).toUpperCase() + id.slice(1), val: n(S[id]), focus: F[id] || '' })),
      defence: def, hpCur, hpMax, karma: (typeof d.karma === 'number') ? d.karma : 6,
      ability: d.ability || '',
      attacks: (d.attacks || []).filter(a => a && a.name).map(a => ({ name: a.name, kind: a.kind || 'melee', damage: a.damage || '' })),
      gear: (d.gear || []).filter(g => g && g.name).map(g => g.name),
    };
  }

  // Build a Party-tool summary from a Star Wars (WEG D6) sheet. Die codes are
  // stored as pips on the sheet (3D+2 = 11); render them back as codes here.
  function swParty(d) {
    const A = d.attrs || {};
    const n = v => parseInt(v) || 0;
    // Match the sheet's toCode: below 1D show just the pips (+2), not 0D+2.
    const code = p => { p = n(p); const c = Math.floor(p / 3); return c ? c + 'D' + (p % 3 ? '+' + (p % 3) : '') : (p % 3 ? '+' + (p % 3) : '0D'); };
    const ATTRS = ['Dexterity','Knowledge','Mechanical','Perception','Strength','Technical'];
    const WOUND = { none:'Unhurt', stunned:'Stunned', wounded:'Wounded', incapacitated:'Incapacitated', mortal:'Mortally Wounded' };
    return {
      system: 'SW',
      name: d.name || 'Unnamed', template: d.template || '', species: d.species || '',
      attrs: ATTRS.map(id => ({ id, code: code(A[id]) })),
      skills: (d.skills || []).filter(s => s && s.name).map(s => ({ name: s.name, code: code(s.attr === 'Force' ? s.adds : n(A[s.attr]) + n(s.adds)) })),
      wound: WOUND[d.wound] || 'Unhurt',
      forcePoints: n(d.forcePoints), darkSide: n(d.darkSide), skillPoints: n(d.skillPoints),
      armor: d.armor && d.armor.name ? d.armor.name + (n(d.armor.pips) ? ' (+' + code(d.armor.pips) + ')' : '') : '',
      weapons: (d.weapons || []).filter(w => w && w.name).map(w => ({ name: w.name, damage: w.damage || '', range: w.range || '' })),
      powers: (d.force || []).filter(f => f && f.name).map(f => f.name),
      gear: (d.gear || []).filter(g => g && g.name).map(g => g.name),
      credits: d.credits || '',
      ship: d.ship && d.ship.name ? d.ship.name : '',
    };
  }

  // Build a Party-tool summary from a D62e (D6 System: Second Edition) sheet.
  // Attribute die codes are stored as pips (3D+2 = 11); skill pips are ADDS over
  // the governing attribute, so a skill's code = attribute pips + skill pips.
  function d62eParty(d) {
    const A = d.attrs || {};
    const n = v => parseInt(v) || 0;
    const code = p => { p = n(p); const c = Math.floor(p / 3); return c ? c + 'D' + (p % 3 ? '+' + (p % 3) : '') : (p % 3 ? '+' + (p % 3) : '0D'); };
    const CORE = ['Agility','Brawn','Knowledge','Perception'];
    const ATTRS = CORE.concat(Object.keys(A).filter(k => CORE.indexOf(k) < 0));
    const WOUND = { none:'Unhurt', stunned:'Stunned', wounded:'Wounded', incapacitated:'Incapacitated', mortal:'Mortally Wounded' };
    const dodge = (d.dodgeOverride != null && d.dodgeOverride !== '') ? d.dodgeOverride : 5 * Math.floor(n(A.Perception) / 3);
    const parry = (d.parryOverride != null && d.parryOverride !== '') ? d.parryOverride : 5 * Math.floor(n(A.Agility) / 3);
    return {
      system: 'D62E',
      name: d.name || 'Unnamed', template: d.template || '', genre: d.genre || '',
      attrs: ATTRS.map(id => ({ id, code: code(A[id]) })),
      skills: (d.skills || []).filter(s => s && s.name).map(s => ({ name: s.name, code: code(n(A[s.attribute]) + n(s.pips)) })),
      wound: WOUND[d.wound] || 'Unhurt',
      heroPoints: n(d.heroPoints), dodge: dodge, parry: parry, move: d.move || '',
      armor: (d.armor && d.armor.name) ? d.armor.name + (d.armor.protection ? ' (' + d.armor.protection + ')' : '') : '',
      weapons: (d.weapons || []).filter(w => w && w.name).map(w => ({ name: w.name, damage: w.damage || '', range: w.range || '' })),
      powers: (d.powers || []).filter(p => p && p.name).map(p => p.name),
      // Perks / talents / gear are saved as {name, note, …} rows — pull the name
      // (older saves may hold plain strings), or they render as "[object Object]".
      perks: [].concat(d.perks || [], d.talents || []).map(x => typeof x === 'string' ? x : (x && x.name) || '').filter(Boolean),
      gear: (d.gear || []).map(x => typeof x === 'string' ? x : (x && x.name) || '').filter(Boolean),
      wealth: d.wealth || '',
    };
  }

  // Build a Party-tool summary from an ICRPG (Index Card RPG) sheet. Stats are
  // flat mods (base+bonus); Defense is CON + armor, capped at +10; Hearts are
  // 10 HP each so HP is tracked directly. Loot/abilities/spells are name lists.
  function icrpgParty(d) {
    const n = v => parseInt(v) || 0;
    const S = d.stats || {};
    const ABBR = ['STR','DEX','CON','INT','WIS','CHA'];
    const statVal = ab => { const s = S[ab] || {}; return n(s.base) + n(s.bonus); };
    const armor = n(d.armor);
    const defense = Math.min(10, statVal('CON') + armor);
    const list = arr => (Array.isArray(arr) ? arr : []).filter(x => x && x.name).map(x => x.name);
    return {
      system: 'ICRPG',
      name: d.name || 'Unnamed', type: d.type || '', world: d.world || '', level: d.level || '',
      stats: ABBR.filter(ab => S[ab]).map(ab => ({ id: ab, val: statVal(ab) })),
      hp: n(d.hp), hpMax: n(d.hpMax), armor: armor, defense: defense,
      dying: d.dying || '', coin: !!d.coin, mastery: n(d.mastery),
      loot: list(d.loot), abilities: list(d.abilities), spells: list(d.spells),
      story: d.story || '',
    };
  }

  // Build a Party-tool summary from a Marvel Multiverse RPG (d616) sheet. The six
  // MARVEL abilities are flat modifiers; Health/Focus/Karma are pools with a
  // current/max; each ability's defense = 10 + score. Powers/traits/tags are name
  // lists; conditions are the active toggles from the sheet.
  function mmrpgParty(d) {
    const n = v => parseInt(v) || 0;
    const A = d.abilities || {};
    const pool = p => ({ cur: n((p || {}).cur), max: n((p || {}).max) });
    const ABIL = [['melee','Melee'],['agility','Agility'],['resilience','Resilience'],['vigilance','Vigilance'],['ego','Ego'],['logic','Logic']];
    const list = arr => (Array.isArray(arr) ? arr : []).filter(x => x && x.name).map(x => x.name);
    const conds = d.conditions && typeof d.conditions === 'object' ? Object.keys(d.conditions).filter(k => d.conditions[k]) : [];
    // Run Speed = 5 + ⌊Agility / 5⌋, ±1 for large/small size (mirrors the sheet).
    let run = 5 + Math.floor(n(A.agility) / 5);
    const size = d.size || '';
    if(/Big|Huge|Gigantic/.test(size)) run += 1;
    if(/Tiny|Little|Small/.test(size)) run -= 1;
    if(run < 0) run = 0;
    return {
      system: 'MMRPG',
      name: d.name || 'Unnamed', real: d.real || '', rank: n(d.rank) || 1,
      origin: d.origin || '', occupation: d.occupation || '', teams: d.teams || '',
      abilities: ABIL.map(([k, id]) => ({ id, mod: n(A[k]), defense: 10 + n(A[k]) })),
      health: pool(d.health), focus: pool(d.focus), karma: pool(d.karma),
      healthDR: n(d.healthDR), focusDR: n(d.focusDR),
      speed: { run: run, half: Math.floor(run / 2) },
      powers: list(d.powers), traits: list(d.traits), tags: list(d.tags), conditions: conds,
    };
  }

  // ── Candela Obscura: Actions (9, grouped under 3 Drives), Drives (max/cur +
  //    resistances = ⌊max/3⌋), harm Marks (Body/Brain/Bleed), abilities & gear. ──
  function coParty(d) {
    const n = v => parseInt(v) || 0;
    const acts = d.actions || {}, gild = d.gilded || {}, drv = d.drives || {}, resU = d.resUsed || {}, mk = d.marks || {}, sc = d.scars || {};
    const DR = ['Nerve','Cunning','Intuition'], MK = ['Body','Brain','Bleed'];
    const actList = Object.keys(acts).filter(k => n(acts[k]) > 0).sort((a,b) => n(acts[b]) - n(acts[a]))
      .map(k => ({ id: k, val: n(acts[k]), gilded: !!gild[k] }));
    const list = arr => (Array.isArray(arr) ? arr : []).filter(x => x && x.name).map(x => x.name);
    return {
      system: 'CO', name: d.name || 'Unnamed', role: d.role || '', specialty: d.specialty || d.class || '', pronouns: d.pronouns || '',
      actions: actList,
      drives: DR.filter(k => drv[k]).map(k => ({ id: k, max: n((drv[k]||{}).max), cur: n((drv[k]||{}).cur), resist: Math.floor(n((drv[k]||{}).max)/3), used: n(resU[k]) })),
      marks: MK.map(k => ({ id: k, val: n(mk[k]), scar: sc[k] || '' })),
      abilities: list(d.abilities), gear: list(d.gear),
      catalyst: d.catalyst || '', question: d.question || '',
    };
  }

  // ── Year Zero Engine: 4 attributes (STR/AGI/WITS/EMP), Health & Resolve
  //    (max − damage), Stress, Armor, active Conditions, skills for the variant. ──
  function yzeParty(d) {
    const n = v => parseInt(v) || 0;
    const A = d.attrs || {}, ATTR = ['STR','AGI','WITS','EMP'];
    const health = d.health || {}, resolve = d.resolve || {}, variant = d.variant || 'yze';
    const sk = d.skills || {};
    const YZE_SK = ['Force','Melee','Stamina','Marksmanship','Mobility','Stealth','Crafting','Observation','Survival','Healing','Insight','Persuasion'];
    const ALIEN_SK = ['Heavy Machinery','Close Combat','Stamina','Mobility','Ranged Combat','Piloting','Observation','Comtech','Survival','Command','Manipulation','Medical Aid'];
    const skKeys = variant === 'alien' ? ALIEN_SK : YZE_SK;
    const conds = d.conditions && typeof d.conditions === 'object' ? Object.keys(d.conditions).filter(k => d.conditions[k]) : [];
    const list = arr => (Array.isArray(arr) ? arr : []).filter(x => x && x.name).map(x => x.name);
    return {
      system: 'YZE', name: d.name || 'Unnamed', archetype: (variant === 'alien' ? (d.career || d.archetype) : d.archetype) || d.class || '', variant,
      attrs: ATTR.filter(k => A[k] != null).map(k => ({ id: k, val: n(A[k]) })),
      hpCur: Math.max(0, n(health.max) - n(health.dmg)), hpMax: n(health.max),
      resolveCur: Math.max(0, n(resolve.max) - n(resolve.dmg)), resolveMax: n(resolve.max),
      stress: n(d.stress), armor: n(d.armor), xp: n(d.xp), conditions: conds,
      skills: skKeys.filter(k => n(sk[k]) > 0).map(k => ({ id: k, val: n(sk[k]) })),
      talents: list(d.talents), weapons: list(d.weapons), gear: list(d.gear),
    };
  }

  // ── Ghostbusters: classless — four Traits (Brains/Muscles/Moves/Cool, one
  //    Talent each), Brownie Points, a Goal, and gear. ──
  function gbParty(d) {
    const n = v => parseInt(v) || 0;
    const T = d.traits || {}, tal = d.talents || {}, TK = ['Brains','Muscles','Moves','Cool'];
    return {
      system: 'GB', name: d.name || 'Unnamed', alias: d.alias || '', goal: d.goal || '',
      tagPhysical: d.tagPhysical || '', tagPersonality: d.tagPersonality || '',
      traits: TK.filter(k => T[k] != null).map(k => ({ id: k, val: n(T[k]) })),
      talents: TK.filter(k => tal[k] && tal[k].name).map(k => ({ trait: k, name: tal[k].name })),
      bp: n(d.bp),
      gear: (Array.isArray(d.gear) ? d.gear : []).filter(x => x && x.name).map(x => x.name),
    };
  }

  // ── Justice League Unlimited: six attributes, Resolve (cur/bought), Condition
  //    level, Plot, DR, statuses, graded powers, traits, gear. ──
  function jluParty(d) {
    const n = v => parseInt(v) || 0;
    const A = d.attrs || {}, AK = [['potency','POT'],['accuracy','ACC'],['agility','AGI'],['resistance','RES'],['mind','MND'],['spirit','SPR']];
    const strList = arr => (Array.isArray(arr) ? arr : []).map(x => typeof x === 'string' ? x : (x && (x.name || x.type))).filter(Boolean);
    // The sheet exports a `derived` block with the Tier/Origin-computed combat
    // stats (Resolve max, Defense, Attack, Block, Dodge, DR) and effective
    // attribute values — the party card can't recompute these without the tables.
    // Older saves lack it; fall back to the raw bought points / bought resolve.
    const dv = d.derived || {}, av = dv.attrVals || {};
    return {
      system: 'JLU', name: d.name || 'Unnamed', secret: d.secret || '', tier: d.tier || '', tierName: dv.tierName || '', origin: d.origin || '', arch: d.arch || '',
      attrs: AK.filter(([k]) => A[k] != null || av[k] != null).map(([k, id]) => ({ id, val: (av[k] != null ? n(av[k]) : n(A[k])) })),
      resolveCur: n(d.resCur), resolveMax: (dv.resolveMax != null ? n(dv.resolveMax) : n(d.resBuy)),
      condLevel: n(d.condLevel), plot: n(d.plot),
      defense: n(dv.defense), attack: n(dv.attack), block: n(dv.block), dodge: n(dv.dodge),
      dr: (dv.dr != null ? n(dv.dr) : n(d.dr)),
      statuses: Array.isArray(d.statuses) ? d.statuses.filter(Boolean) : [],
      powers: (Array.isArray(d.powers) ? d.powers : []).filter(x => x && x.name).map(x => ({ name: x.name, grade: n(x.grade) })),
      traits: strList(d.traits), abilities: strList(d.archAbilities), knowledge: strList(d.knowledge), limitations: strList(d.limitations),
      equipment: (Array.isArray(d.equipment) ? d.equipment : []).filter(x => x && x.name).map(x => x.name),
    };
  }

  // Build a Party-tool summary from a Nimble sheet (stats, skills, HP/wounds,
  // armor, mana, class features come straight from the saved blob).
  function nimParty(d) {
    const S = d.stats || {}, K = d.skillPts || {}, T = d.skillTotals || {}, hp = d.hp || {}, hd = d.hitDice || {}, mn = d.mana || {};
    const n = v => parseInt(v) || 0;
    const SK = [['Arcana','INT'],['Examination','INT'],['Finesse','DEX'],['Influence','WIL'],['Insight','WIL'],['Lore','INT'],['Might','STR'],['Naturecraft','WIL'],['Perception','WIL'],['Stealth','DEX']];
    return {
      system: 'NIM',
      name: d.name || 'Unnamed', ancestry: d.ancestry || '', cls: d.cls || '', subclass: d.subclass || '', level: n(d.level) || 1, background: d.background || '',
      stats: ['STR','DEX','INT','WIL'].map(id => ({ id, val: n(S[id]), adv: d.saveAdv === id, dis: d.saveDis === id })),
      skills: SK.map(([nm, st]) => ({ name: nm, val: (T[nm] != null) ? n(T[nm]) : n(S[st]) + n(K[nm]) })),
      hpCur: n(hp.cur), hpMax: n(hp.max), temp: n(hp.temp), wounds: n(d.wounds), woundsMax: n(d.woundsMax) || 6,
      hdCur: n(hd.cur), hdMax: n(hd.max), manaCur: n(mn.cur), manaMax: n(mn.max),
      // Armor SCORE (the number the sheet computes), not the armor type name.
      armorScore: (d.armorScore != null ? n(d.armorScore) : (n(S.DEX) + n(d.armorBonus))),
      actions: (d.actions != null ? n(d.actions) : 3),
      armor: d.armor || '', shield: d.shield || '',
      attacks: (d.attacks || []).filter(a => a && a.name).map(a => ({ name: a.name, damage: a.damage || '', props: a.props || '' })),
      spells: (d.spells || []).filter(s => s && s.name).map(s => s.name + (s.tier ? ' (T' + s.tier + ')' : '')),
      picks: (d.picks || []).map(p => String(p).split('|').pop()),
      inventory: (d.inventory || []).filter(i => i && i.name).map(i => i.name),
    };
  }

  // Build a Party-tool summary from a Kids on Bikes / Brooms / Capes sheet.
  function kobParty(d) {
    const S = d.stats || {}, M = d.mods || {}, BN = d.bonuses || {};
    const n = v => parseInt(v) || 0;
    // Prefer the effective per-stat check bonus the sheet exports; older saves only
    // have the raw `mods` field.
    const statBonus = id => (BN && BN[id] != null) ? n(BN[id]) : n(M[id]);
    const BOOK = { bikes:'Kids on Bikes', brooms:'Kids on Brooms', capes:'Kids in Capes' };
    const C = d.capes || {}, B = d.brooms || {}, K = d.bike || {};
    return {
      system: 'KOB',
      name: [d.name, d.lastName].filter(Boolean).join(' ') || 'Unnamed',
      book: d.book || 'bikes', bookName: BOOK[d.book] || 'Kids on Bikes',
      trope: d.trope || '', age: d.age || '',
      stats: ['Brains','Brawn','Fight','Flight','Charm','Grit'].map(id => ({ id, die: n(S[id]) || 8, mod: statBonus(id) })),
      at: typeof d.at === 'number' ? d.at : 3,
      stress: typeof d.stress === 'number' ? d.stress : 0,
      strengths: (d.strengths || []).filter(s => s && s.name).map(s => s.name + (s.note ? ' (' + s.note + ')' : '')),
      flaw: d.flaw || '', fear: d.fear || '', knack: d.knack || '',
      ride: d.book === 'bikes' ? [K.color, K.accessory].filter(Boolean).join(' · ') : d.book === 'brooms' ? [B.broom, B.wood && ('wand: ' + B.wood), B.familiar && ('familiar: ' + B.familiar)].filter(Boolean).join(' · ') : '',
      cape: d.book === 'capes' ? [C.cape, C.power].filter(Boolean).join(' · ') : '',
      powerDie: d.book === 'capes' ? n(C.powerDie) : 0,
      gp: d.book === 'capes' ? n(C.gp) : 0,
    };
  }

  // Build a Party-tool summary from a D&D 2024 sheet. Ability mods, proficiency
  // bonus, saves, proficient skills and passive Perception are derived here from
  // the raw scores + proficiency maps so the GM sees the same numbers the player
  // does, without depending on the sheet's own script being loaded.
  function dndParty(d) {
    const n = v => parseInt(v) || 0;
    // Prefer the sheet's effective (magic-boosted) values when present; older saves
    // only have base `scores`, so fall back to those.
    const shown = d.shown || {};
    const S = shown.scores || d.scores || {};
    const saveMagic = n(shown.saveBonus);
    const mod = k => Math.floor((n(S[k]) - 10) / 2);
    const cl = Array.isArray(d.classLevels) ? d.classLevels.filter(e => e && e.cls) : [];
    const totalLvl = cl.length ? cl.reduce((s, e) => s + (n(e.level) || 0), 0) : (n(d.level) || 1);
    const pb = 2 + Math.floor((Math.max(1, totalLvl) - 1) / 4);
    const classLine = cl.length
      ? cl.map(e => [e.cls, e.subclass].filter(Boolean).join(' ') + (e.level ? ' ' + e.level : '')).join(' / ')
      : [d.cls, d.subclass].filter(Boolean).join(' ');
    const ABBR = ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'];
    const sp = d.saveProf || {};
    const saves = ABBR.map(k => ({ id: k, val: mod(k) + (sp[k] ? pb : 0) + saveMagic, prof: !!sp[k] }));
    const SKILLS = [['Acrobatics', 'DEX'], ['Animal Handling', 'WIS'], ['Arcana', 'INT'], ['Athletics', 'STR'], ['Deception', 'CHA'], ['History', 'INT'], ['Insight', 'WIS'], ['Intimidation', 'CHA'], ['Investigation', 'INT'], ['Medicine', 'WIS'], ['Nature', 'INT'], ['Perception', 'WIS'], ['Performance', 'CHA'], ['Persuasion', 'CHA'], ['Religion', 'INT'], ['Sleight of Hand', 'DEX'], ['Stealth', 'DEX'], ['Survival', 'WIS']];
    const skp = d.skillProf || {};
    const skills = SKILLS.filter(([nm]) => skp[nm]).map(([nm, ab]) => ({ name: nm, val: mod(ab) + pb * (n(skp[nm]) || 1) }));
    const passivePerc = 10 + mod('WIS') + (skp['Perception'] ? pb * (n(skp['Perception']) || 1) : 0);
    return {
      system: 'DND',
      name: d.name || 'Unnamed',
      cls: classLine, level: totalLvl,
      species: d.species || '', background: d.background || '', alignment: d.alignment || '',
      ac: d.ac || '', speed: d.speed || '',
      hpCur: (d.hpCur === '' || d.hpCur == null) ? '' : n(d.hpCur), hpMax: n(shown.hpMax != null ? shown.hpMax : d.hpMax), hpTemp: n(d.hpTemp),
      hitdice: d.hitdice || '', hdLeft: (d.hdLeft == null ? '' : n(d.hdLeft)),
      pb, passivePerc, inspiration: !!d.inspiration, exhaustion: n(d.exhaustion),
      conditions: Array.isArray(d.activeConditions) ? d.activeConditions.filter(Boolean) : [],
      stats: ABBR.map(k => ({ id: k, mod: mod(k), score: n(S[k]) })),
      saves, skills,
      attacks: (d.attacks || []).filter(a => a && (a.name || a.damage)).map(a => ({ name: a.name || '', damage: [a.damage, a.type].filter(Boolean).join(' ') })),
      spells: (d.spellsKnown || []).filter(s => s && (s.display || s.name)).map(s => s.display || s.name),
      inventory: (d.inventory || []).filter(i => i && i.name).map(i => i.name + (n(i.qty) > 1 ? ' ×' + n(i.qty) : '')),
      coins: { gp: n(d.gp), sp: n(d.sp), cp: n(d.cp) },
    };
  }

  // Sheets come from a few exporters (our sheet, Shadowdarklings). Read defensively.
  function normalize(raw) {
    if(!raw || typeof raw !== 'object') return null;
    const d = raw.sheet && typeof raw.sheet === 'object' ? raw.sheet : raw;
    // ACE! and KoB sheets tag themselves; DCC sheets have a distinct shape
    // (header + combat blocks). Route each to its own summariser, else Shadowdark.
    if(d && d.system === 'SW') return swParty(d);
    if(d && d.system === 'NIM') return nimParty(d);
    if(d && d.system === 'KOB') return kobParty(d);
    if(d && d.system === 'ACE') return aceParty(d);
    if(d && d.system === 'DND') return dndParty(d);
    if(d && d.system === 'D62E') return d62eParty(d);
    if(d && d.system === 'ICRPG') return icrpgParty(d);
    if(d && d.system === 'MMRPG') return mmrpgParty(d);
    if(d && d.system === 'CO') return coParty(d);
    if(d && d.system === 'YZE') return yzeParty(d);
    if(d && d.system === 'GB') return gbParty(d);
    if(d && d.system === 'JLU') return jluParty(d);
    if(d && d.header && d.combat) return dccParty(d);
    if(!d.name && !d.class && !d.stats) return null;
    const st = d.stats || d.rolledStats || {};
    const pick = k => st[k] ?? st[k.toLowerCase()] ?? st[k[0] + k.slice(1).toLowerCase()] ?? 10;
    const sheetExtra = d._sheet || {};
    // Spells: prefer our structured rows (they carry level, lost, and the full
    // description); fall back to the comma list from a foreign exporter.
    const spellRows = Array.isArray(sheetExtra.spellData) && sheetExtra.spellData.length
      ? sheetExtra.spellData.filter(x => x.name).map(x => ({
          name: x.name, level: x.level || '', lost: !!x.lost, desc: x.desc || ''
        }))
      : String(d.spellsKnown || '').split(',').map(x => x.trim()).filter(Boolean).map(n => ({ name:n, level:'', lost:false, desc:'' }));
    // Attacks: prefer our structured rows (name / bonus / stat / range / damage);
    // fall back to the lossy string form that drops range.
    const attacks = Array.isArray(sheetExtra.attacks) && sheetExtra.attacks.length
      ? sheetExtra.attacks.filter(a => a && (a.name || a.damage)).map(a => ({
          name: a.name || '', bonus: a.bonus || '', stat: a.stat || '',
          range: a.range || '', damage: a.damage || ''
        }))
      : (Array.isArray(d.attacks) ? d.attacks.filter(Boolean).map(a => (
          typeof a === 'string' ? { name:a, bonus:'', stat:'', range:'', damage:'' } : {
            name: a.name || '', bonus: a.bonus || '', stat: a.stat || '', range: a.range || '', damage: a.damage || ''
          })) : []);
    // Talents & Features: the verbatim Talents box holds every class/ancestry
    // feature and trait the player recorded. The `bonuses` array is a lossy
    // decomposition (drops headings and colon-less lines), so prefer the text
    // and split it into lines; fall back to bonuses only if the text is empty.
    const talentsText = typeof sheetExtra.talents === 'string' ? sheetExtra.talents : '';
    let talents = talentsText.split('\n').map(s => s.trim()).filter(Boolean);
    if(!talents.length) {
      talents = (d.bonuses || [])
        .filter(b => b && b.bonusName && !String(b.name || '').startsWith('Spell:'))
        .map(b => b.bonusName);
    }
    const gear = (d.gear || []).map(g => ({ name:g.name, qty:g.quantity || 1, free:(g.slots ?? 1) === 0 }));
    const strScore = parseInt(pick('STR')) || 10;
    // Shadowdark: carrying capacity is max(10, STR). Homebrew/ancestry can grant
    // extra; the sheet stores that separately.
    const slotBonus = parseInt(sheetExtra.hbBonusSlots) || 0;
    const slotsMax = Math.max(10, strScore) + slotBonus;
    const slotsUsed = gear.filter(g => !g.free).length;
    return {
      name:      d.name || 'Unnamed',
      ancestry:  d.ancestry || '',
      cls:       d.class || '',
      title:     d.title || '',
      level:     d.level || 1,
      alignment: d.alignment || '',
      deity:     d.deity || '',
      background:d.background || '',
      ac:        d.armorClass || 0,
      hpMax:     d.maxHitPoints || 0,
      hpCur:     sheetExtra.hpCurrent || '',
      luck:      sheetExtra.luckPts || '',
      trackers:  Array.isArray(sheetExtra.trackers) ? sheetExtra.trackers.filter(t => typeof t === 'string' && t.trim()) : [],
      xp:        d.XP || 0,
      stats:     { STR:pick('STR'), DEX:pick('DEX'), CON:pick('CON'), INT:pick('INT'), WIS:pick('WIS'), CHA:pick('CHA') },
      attacks,
      spells:    spellRows,
      talents,
      gear,
      slotsUsed,
      slotsMax,
      coins:     { gp:d.gold || 0, sp:d.silver || 0, cp:d.copper || 0 },
    };
  }

  function addSheet(raw, source) {
    const c = normalize(raw);
    if(!c) return false;
    // Re-syncing or re-importing the same character replaces the old copy
    const i = chars.findIndex(x => x.sheet.name.toLowerCase() === c.name.toLowerCase());
    if(i >= 0) chars[i] = { ...chars[i], source, sheet:c };
    else chars.push({ id: nextId++, source, sheet: c });
    return true;
  }

  function status(msg, isErr) {
    noteEl.textContent = msg || '';
    noteEl.style.color = isErr ? '#df6a6a' : '';
  }

  // ── Shared player-card chrome (the enemy-card visual language, read-only) ──
  // Every system builds its own parts; pcShell wraps them in the accent-band card.
  // Viewed two ways: the compact monitor bubble, and this card self-contained in a
  // popup (charPop) — so it carries full detail.
  function pcShell(entry, o) {
    const open = openIds.has(entry.id);
    const chips = (o.chips || []).filter(Boolean).map(c =>
      '<span class="pcard-chip' + (c.bad ? ' bad' : '') + '"><span class="l">' + esc(c.l) + '</span><span class="v">' + esc(c.v == null || c.v === '' ? '—' : c.v) + '</span></span>').join('');
    // Optional curated Monitor-bubble payload: the system decides exactly which
    // stats the bubble shows (and whether its health row is an HP bar or a wound
    // status), independent of the card's own header chips. publishRoster prefers
    // it over scraping the header. Shape: { hp, wound, chips:[{label,value}] }.
    const bub = o.bubble ? " data-pcbubble='" + esc(JSON.stringify(o.bubble)).replace(/'/g, '&#39;') + "'" : '';
    return '<div class="pty-card pcard' + (open ? ' open' : '') + '" data-id="' + entry.id + '"' + bub + '>'
      + '<div class="pty-card-hd pcard-band"><div class="pcard-title"><div class="pty-name">' + esc(o.name || '—') + '</div>'
      + '<div class="pcard-subrow"><span class="pcard-type">' + esc(o.sub || '') + '</span></div></div>'
      + chips + '<button class="pty-x" data-remove="' + entry.id + '" title="Remove">✕</button></div>'
      + '<div class="pty-card-bd">' + (o.body || '') + '</div></div>';
  }
  // A read-only vital bar (HP, Resolve, Vitality…). cur/max are shown as cur/max.
  function pcHpBar(lab, cur, max, note) {
    const mx = parseInt(max, 10) || 0;
    const cr = (cur !== '' && cur != null && !isNaN(parseInt(cur, 10))) ? parseInt(cur, 10) : mx;
    const pct = mx > 0 ? Math.max(0, Math.min(100, (cr / mx) * 100)) : 100;
    const txt = (cur !== '' && cur != null ? esc(cur) + '/' : '') + esc(max);
    return '<div class="pcard-hp"><div class="pcard-hp-head"><span class="pcard-hp-lab">' + esc(lab) + '</span><span class="pcard-hp-val">' + txt + (note ? ' · ' + esc(note) : '') + '</span></div>'
      + '<div class="pcard-hpbar"><i style="width:' + pct + '%;background:' + gmcHpColor(pct) + ';"></i></div></div>';
  }
  // The flat stat strip (matches the combat card's .cc-abils). cells: [{l, m, s?}].
  function pcStats(cells) {
    if(!cells || !cells.length) return '';
    return '<div class="pcard-stats">' + cells.map(c =>
      '<div class="pcard-stat"><span class="l">' + esc(c.l) + '</span><span class="m">' + esc(c.m) + '</span>'
      + (c.s != null && c.s !== '' ? '<span class="s">' + esc(c.s) + '</span>' : '') + '</div>').join('') + '</div>';
  }
  // A titled section, only when it has content.
  function pcSec(title, body) { return body ? '<div class="pty-sec"><div class="pty-sec-h">' + esc(title) + '</div>' + body + '</div>' : ''; }

  // Party card for a Dungeon Crawler Carl character — its stat block and combat
  // math differ from Shadowdark, so it gets its own layout.
  function cardHTMLDCC(entry) {
    const c = entry.sheet;
    const open = openIds.has(entry.id);
    const sub = ['LV ' + c.level, c.floor ? 'Floor ' + c.floor : '',
                 [c.race, c.cls].filter(Boolean).join(' '),
                 c.crawler ? 'Crawler #' + c.crawler : ''].filter(Boolean).join(' · ');
    const HPCOL = ['#c01e1e','#d23c0a','#dc6400','#c88200','#b49600','#96a000','#64aa00','#3caa00','#1e9614','#0a780a'];
    const pips = Array.isArray(c.hpPips) ? c.hpPips : [];
    const activeOf = i => pips.length ? (pips[i] !== 'false') : true;
    const hpPct = pips.length ? pips.filter(x => x !== 'false').length * 10 : 100;
    let bar = '<span style="display:inline-flex;gap:2px;flex:1;height:12px;">';
    for(let i=0;i<10;i++) bar += '<span style="flex:1;background:'+HPCOL[i]+';opacity:'+(activeOf(i)?'1':'.16')+';"></span>';
    bar += '</span>';
    const mana = (c.mana && (c.mana.current !== '' || c.mana.max !== '')) ? (esc(c.mana.current||'0')+'/'+esc(c.mana.max||'0')) : '';
    const cell = (lbl,val) => '<span class="pty-chip">'+lbl+' <b>'+esc(val===''||val==null?'—':val)+'</b></span>';

    let segHtml = '';
    for(let i=0;i<10;i++) segHtml += '<span style="flex:1;background:'+HPCOL[i]+';opacity:'+(activeOf(i)?'1':'.16')+';"></span>';
    let body = '<div class="pcard-hp"><div class="pcard-hp-head"><span class="pcard-hp-lab">Hit Points</span><span class="pcard-hp-val">' + hpPct + '%</span></div>'
      + '<div style="display:flex;gap:2px;height:11px;border-radius:6px;overflow:hidden;">' + segHtml + '</div></div>';
    body += pcStats(c.stats.map(s => ({ l: s.abbr, m: (s.mod==null ? '—' : (s.mod>=0?'+':'')+s.mod), s: (s.enh||'—') + '/' + (s.unenh||'—') })));
    body += '<div class="pty-line dim" style="margin:-4px 0 8px;font-size:9px;">Mods from ' + esc(c.modSource) + ' scores · Enh/Unenh shown</div>';

    body += '<div class="pty-sec"><div class="pty-sec-h">Defense</div><div style="display:flex;flex-wrap:wrap;gap:4px;">'
       + cell('Evade', c.evade.total) + cell('DR', c.dr.total)
       + cell('Move', c.evade.move) + cell('Step', c.evade.step)
       + cell('AI Favor', c.dr.aiFavor) + cell('Size', c.dr.size)
       + '</div></div>';

    if(c.buffs.length || (c.debuffs && c.debuffs.trim())) {
      body += '<div class="pty-sec"><div class="pty-sec-h">Buffs &amp; Debuffs</div>';
      if(c.buffs.length) body += '<div class="pty-line"><b>Buffs:</b> ' + c.buffs.map(esc).join(', ') + '</div>';
      if(c.debuffs && c.debuffs.trim()) body += '<div class="pty-line"><b>Debuffs:</b> ' + esc(c.debuffs) + '</div>';
      body += '</div>';
    }

    // A collapsible section: click the header to fold Skills / Attacks away.
    const secBlock = (name, count, innerHtml) => {
      const closed = secClosed.has(entry.id + ':' + name);
      return '<div class="pty-sec">'
        + '<div class="pty-sec-h pty-sec-toggle" data-sec="' + name + '" data-secid="' + entry.id + '">'
        +   '<span class="pty-sec-chev">' + (closed ? '▸' : '▾') + '</span>' + name
        +   ' <span class="dim" style="font-weight:600;letter-spacing:0;">(' + count + ')</span>'
        + '</div>'
        + '<div class="pty-sec-body"' + (closed ? ' style="display:none;"' : '') + '>' + innerHtml + '</div>'
        + '</div>';
    };

    if(c.attacks.length) {
      const rows = c.attacks.map(a => {
        const st = a.stat ? ' ' + esc(String(a.stat).toUpperCase()) : '';
        const bits = [
          a.rank    ? '<span class="dim">Rank ' + esc(a.rank) + st + '</span>' : '',
          a.dice    ? '<span class="dim">' + esc(a.dice) + st + '</span>' : '',
          a.effects ? '<span class="dim">' + esc(a.effects) + '</span>' : ''
        ].filter(Boolean).join(' · ');
        return '<div class="pty-line"><b>' + esc(a.name || '—') + '</b>' + (bits ? ' ' + bits : '') + '</div>';
      }).join('');
      body += secBlock('Attacks', c.attacks.length, rows);
    }

    if(c.skills && c.skills.length) {
      const rows = c.skills.map((s, i) => {
        const st = s.stat ? ' ' + esc(String(s.stat).toUpperCase()) : '';
        const rank = String(s.rank).trim();
        const meta = [rank ? 'Rank ' + esc(rank) : 'Untrained', st.trim()].filter(Boolean).join(' · ');
        const det = dccDetail(s.name, s.src);
        const key = entry.id + '-sk-' + i;
        const info = det
          ? '<button class="pty-spell-info" data-spell="' + key + '" title="Show details" aria-label="Show skill details">ⓘ</button>' : '';
        return '<div class="pty-line"><b>' + esc(s.name) + '</b>' + info + ' <span class="dim">' + meta + '</span></div>'
             + (det ? '<div class="pty-spell-desc" data-desc="' + key + '" style="display:none;">' + det + '</div>' : '');
      }).join('');
      body += secBlock('Skills', c.skills.length, rows);
    }

    return pcShell(entry, { name: c.name, sub,
      chips: [{ l:'HP', v: hpPct + '%', bad: hpPct <= 40 }].concat(mana ? [{ l:'Mana', v: mana }] : []), body,
      bubble: { hp: hpPct + '%',
        chips: [{ label:'Evade', value: c.evade.total }, { label:'DR', value: c.dr.total }, { label:'AI', value: c.dr.aiFavor || '—' }] } });
  }
