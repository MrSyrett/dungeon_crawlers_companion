/* ═══ MAIN AREA — a flexible row of windows (columns) ═══
   Windows share the width evenly and never shrink below a usable min; once the
   sum exceeds the viewport the row scrolls horizontally. Mobile stacks them. */
.main-area {
  position: relative; z-index: 1;
  flex: 1;
  display: flex;
  overflow-x: auto;
  overflow-y: hidden;
  min-height: 0;
  scroll-snap-type: x proximity;
}

.pane {

  overflow: hidden;
  border-right: 2px solid var(--border);

/* ── Grid mode: 5+ windows wrap into rows instead of thin columns ── */
.main-area.as-grid {

}

/* Mobile: windows stack into one vertical scroll */

  color: var(--mid);
}
.pdf-mobile-open-sub { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; color: var(--muted); }
.pdf-mobile-open-btn {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 12px;
  letter-spacing: 0.1em; text-transform: uppercase;
  padding: 10px 20px;
  background: var(--red); color: white;
  border: none; cursor: pointer;
  border-radius: 3px;
}
.doc-image {
  max-width: none;
  box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  transform-origin: top center;
  flex-shrink: 0;
}

/* ═══ MUSIC / SOUNDBOARD TOOL ═══ */
.mus-tool { container-type: inline-size; }
.mus-shell { flex: 1; min-height: 0; display: flex; align-items: stretch; }
.mus-body { flex: 1; min-width: 0; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; }
/* Sound Library — docked left column, part of the same window (no popup-on-popup) */
.mus-library { display: none; flex-direction: column; width: 288px; flex-shrink: 0; min-height: 0; border-right: 1px solid var(--border); background: rgba(8,10,14,.35); }
@container (min-width: 640px) { .mus-library { display: flex; } }
.mus-tool .mus-library.mus-lib-hidden { display: none; }
.mus-tool .mus-library.mus-lib-shown { display: flex; }
.mus-lib-head { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.mus-lib-title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 5px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mus-lib-refresh { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); cursor: pointer; padding: 4px 7px; line-height: 1; flex-shrink: 0; }
.mus-lib-refresh:hover { color: #fff; border-color: var(--mid); }
.mus-lib-search { margin: 8px 10px 0; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; color: var(--light); padding: 7px 9px; font-size: 12px; }
.mus-lib-search:focus { outline: none; border-color: var(--gold); }
.mus-lib-cats, .mus-lib-subs { display: flex; flex-wrap: wrap; gap: 5px; padding: 8px 10px 0; flex-shrink: 0; }
.mus-lib-subs:empty { display: none; }
.mus-lib-subs { padding-top: 5px; }
.mus-lib-chip { background: var(--panel); border: 1px solid var(--border); border-radius: 999px; color: var(--muted); padding: 3px 9px; font-size: 11px; cursor: pointer; white-space: nowrap; }
.mus-lib-subs .mus-lib-chip { font-size: 10px; padding: 2px 8px; }
.mus-lib-chip:hover { color: var(--light); }
.mus-lib-chip.active { background: rgba(201,162,75,.15); border-color: var(--gold); color: var(--gold); }
.mus-lib-list { flex: 1; overflow-y: auto; padding: 6px; min-height: 40px; }
.mus-lib-row { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; cursor: grab; }
.mus-lib-row:hover { background: var(--panel-2); }
.mus-lib-row.dragging { opacity: 0.5; }
.mus-lib-row.playing { background: rgba(201,162,75,.12); }
.mus-lib-play { flex-shrink: 0; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; background: var(--panel); border: 1px solid var(--border); border-radius: 5px; color: var(--gold); cursor: pointer; font-size: 11px; padding: 0; }
.mus-lib-play:hover { border-color: var(--gold); color: #fff; }
.mus-lib-row.playing .mus-lib-play { border-color: var(--gold); color: var(--gold); }
.mus-lib-meta { min-width: 0; flex: 1; }
.mus-lib-name { font-size: 12px; color: var(--light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mus-lib-cat { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
.mus-lib-grip { flex-shrink: 0; color: var(--muted); font-size: 12px; opacity: 0.6; }
.mus-lib-empty { padding: 22px 14px; text-align: center; color: var(--muted); font-size: 12px; font-family: 'Barlow Condensed', sans-serif; }
.mus-lib-empty a { color: var(--gold); }
.mus-lib-hint { padding: 8px 10px; border-top: 1px solid var(--border); font-size: 10px; line-height: 1.5; color: var(--muted); font-family: 'Barlow Condensed', sans-serif; flex-shrink: 0; }
.mus-section { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--gold); }
.mus-sfx-section { border-left-color: #6a9fc8; }
.mus-sec-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.mus-sec-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--white); cursor: pointer; }
.mus-sec-toggle { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 6px 9px; flex-shrink: 0; }
.mus-sec-toggle:hover { color: #fff; }
.mus-section.collapsed .mus-sec-head { border-bottom: none; }
.mus-section.collapsed .mus-sec-actions { display: none; }
.mus-section.collapsed > *:not(.mus-sec-head) { display: none !important; }
.mus-sec-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.mus-now { padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; }
.mus-now-title { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; color: var(--gold); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mus-now-title.idle { color: var(--muted); font-weight: 400; }
.mus-seek-row { display: flex; align-items: center; gap: 8px; }
.mus-time { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--muted); min-width: 34px; }
.mus-time.mus-dur { text-align: right; }
.mus-seek { flex: 1; }
.mus-transport { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.mus-btn { width: 34px; height: 30px; background: var(--panel-2); border: 1px solid var(--border); color: var(--light); cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.mus-btn:hover { border-color: var(--mid); color: #fff; }
.mus-btn.active { border-color: var(--gold); color: var(--gold); }
.mus-vol-ico { font-size: 12px; color: var(--muted); }
.mus-vol { width: 88px; }
input[type=range].mus-seek, input[type=range].mus-vol { accent-color: var(--gold); height: 4px; }
.mus-list { display: flex; flex-direction: column; }
.mus-track { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-top: 1px solid var(--border); font-size: 12px; color: var(--light); cursor: pointer; }
.mus-track:hover { background: var(--panel-2); }
.mus-track.playing { background: var(--panel-2); }
.mus-track.playing .mus-track-name { color: var(--gold); font-weight: 700; }
.mus-track.needs-file { opacity: 0.55; }
.mus-track-ico { width: 14px; text-align: center; color: var(--muted); flex-shrink: 0; }
.mus-track.playing .mus-track-ico { color: var(--gold); }
.mus-track-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mus-track-warn { font-size: 9px; color: var(--red-light); font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
.mus-track-loop, .mus-track-del { background: none; border: 1px solid transparent; color: var(--muted); cursor: pointer; font-size: 12px; padding: 2px 5px; flex-shrink: 0; line-height: 1; }
.mus-track-loop:hover, .mus-track-del:hover { color: #fff; border-color: var(--border); }
.mus-track-loop.active { color: var(--gold); border-color: var(--gold); }
.mus-track-del:hover { color: var(--red-light); }
.mus-empty { padding: 10px; font-family: 'Barlow Condensed', sans-serif; font-size: 11px; color: var(--muted); line-height: 1.5; }
.mus-sfx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 6px; padding: 10px; }
.mus-sfx { position: relative; background: var(--panel-2); border: 1px solid var(--border); color: var(--light); cursor: pointer; padding: 14px 8px; min-height: 54px; display: flex; align-items: center; justify-content: center; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; overflow: hidden; }
.mus-sfx:hover { border-color: var(--mid); color: #fff; }
.mus-sfx.playing { border-color: var(--gold); color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.mus-sfx.needs-file { opacity: 0.55; }
.mus-sfx-name { pointer-events: none; overflow-wrap: anywhere; }
.mus-sfx-corner { position: absolute; top: 2px; right: 2px; display: flex; gap: 1px; }
.mus-sfx-mini { background: rgba(0,0,0,0.4); border: none; color: var(--muted); cursor: pointer; font-size: 10px; line-height: 1; padding: 2px 3px; border-radius: 2px; }
.mus-sfx-mini:hover { color: #fff; }
.mus-sfx-mini.active { color: var(--gold); }
.mus-dragover { outline: 2px dashed var(--gold); outline-offset: -4px; }
/* Scenes (layered) */
.mus-scene-section { border-left-color: #b07cc8; }
.mus-scene-list { display: flex; flex-direction: column; gap: 8px; padding: 10px; }
.mus-scene { border: 1px solid var(--border); background: var(--panel-2); }
.mus-scene.playing { border-color: var(--gold); }
.mus-scene-head { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.mus-scene-play { width: 30px; height: 28px; background: var(--panel); border: 1px solid var(--border); color: var(--light); cursor: pointer; flex-shrink: 0; }
.mus-scene-play:hover { border-color: var(--mid); color: #fff; }
.mus-scene.playing .mus-scene-play { border-color: var(--gold); color: var(--gold); }
.mus-scene-name { flex: 1; min-width: 80px; background: transparent; border: none; border-bottom: 1px solid transparent; color: var(--white); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; padding: 2px 0; }
.mus-scene-name:focus { border-bottom-color: var(--mid); }
.mus-scene-pin { flex-shrink: 0; background: none; border: 1px solid var(--border); color: var(--muted); cursor: pointer; font-size: 12px; padding: 3px 6px; line-height: 1; }
.mus-scene-pin:hover { color: #fff; }
.mus-scene-pin.active { color: var(--gold); border-color: var(--gold); }
.mus-scene-del { flex-shrink: 0; background: none; border: 1px solid transparent; color: var(--muted); cursor: pointer; font-size: 12px; padding: 3px 6px; line-height: 1; }
.mus-scene-del:hover { color: var(--red-light); border-color: var(--border); }
.mus-scene-tracks { display: flex; flex-direction: column; }
.mus-scene-track { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-top: 1px solid var(--border); font-size: 12px; color: var(--light); }
.mus-scene-track:first-child { border-top: none; }
.mus-scene-track.needs-file { opacity: 0.55; }
.mus-scene-tname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mus-scene-track.needs-file .mus-scene-tname { cursor: pointer; }
.mus-scene-warn { font-size: 9px; color: var(--red-light); font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
.mus-scene-tloop { background: none; border: 1px solid transparent; color: var(--muted); cursor: pointer; font-size: 12px; padding: 2px 4px; flex-shrink: 0; line-height: 1; }
.mus-scene-tloop:hover { color: #fff; border-color: var(--border); }
.mus-scene-tloop.active { color: var(--gold); border-color: var(--gold); }
.mus-scene-tvol { width: 72px; flex-shrink: 0; accent-color: var(--gold); height: 4px; }
.mus-scene-tdel { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; padding: 2px 4px; flex-shrink: 0; }
.mus-scene-tdel:hover { color: var(--red-light); }
.mus-scene-empty-tracks { padding: 8px; font-size: 10px; color: var(--muted); font-family: 'Barlow Condensed', sans-serif; }
/* Pinned scene triggers in the top bar (left of the Campaign divider) */
.scene-pins { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.scene-pin { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scene-pin.active { border-color: var(--gold) !important; color: var(--gold) !important; }
@media (max-width: 760px) {
  .mus-btn { width: 44px; height: 40px; font-size: 16px; }
  .mus-sfx { min-height: 60px; font-size: 14px; }
  /* Keep each section header (Music / Soundboard / Scenes) on one line: show
     only the section icon, don't wrap, and let the controls tighten so the
     volume slider + icon buttons all stay inline. */
  .mus-sec-label { display: none; }
  .mus-sec-head { flex-wrap: nowrap; }
  .mus-sec-actions { gap: 4px; min-width: 0; }
  .mus-vol { width: 72px; }
}

/* ═══ COMBAT TOOL ═══ */
.cbt-round-display {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--light);
}
.cbt-round-num, .trk-round-num { font-family: 'Share Tech Mono', monospace; color: var(--gold); font-size: 14px; }

.cbt-body { flex: 1; display: flex; overflow: hidden; min-height: 0; }
.cbt-body.cbt-single .cbt-col { flex: 1; border-right: none; }
.cbt-col { flex: 1; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--border); overflow: hidden; }
.cbt-col:last-child { border-right: none; }
.cbt-npc-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
/* Combat cards tile side-by-side and wrap into a grid instead of full-width rows.
   In the wide Combat-mode centre we pin the grid to 3 roomy columns (was packing
   4 thin ones on wide monitors); in the narrower Master/side layout it stays a
   responsive auto-fill so cards don't get crushed. */
/* The list is a size-container, so its column count follows its OWN width — the
   Master station, the Combat centre and the Combat popup all behave the same. */
.cbt-trackers-col { container-type: inline-size; container-name: cbtcol; }
.cbt-tracker-list { flex: 1; overflow-y: auto; padding: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; align-content: start; align-items: start; }
/* Once there's room, cap at 3 roomy columns (never 4); narrower contexts fall back to 1–2. */
@container cbtcol (min-width: 740px) { .cbt-tracker-list { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.cbt-tool { position: relative; }
.cbt-empty { display: none; flex: 1; align-items: center; justify-content: center; flex-direction: column; gap: 4px; padding: 30px; }
.cbt-empty.show { display: flex; }
.cbt-empty-text { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.cbt-empty-sub { font-size: 11px; color: var(--muted); text-align: center; max-width: 220px; }

/* Tracker card */
.tracker-card { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--gold); border-radius: 10px; padding: 10px 12px; min-width: 0; overflow: hidden; }
.tracker-card.timer-type { border-left-color: #6a9fc8; }
.tracker-card.expired { border-left-color: var(--red); opacity: 0.6; }
.tracker-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.tracker-name-input {
  flex: 1; min-width: 0; background: transparent; border: none; color: var(--white);
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; padding: 2px 0;
}
.tracker-name-input:focus { border-bottom: 1px solid var(--mid); }
.tracker-type-toggle {
  display: flex; gap: 0; flex-shrink: 0; border: 1px solid var(--border);
}
.tracker-type-btn {
  font-family: 'Barlow Condensed', sans-serif; font-size: 8px; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; padding: 4px 7px; background: var(--panel-2); border: none; color: var(--muted); cursor: pointer;
}
.tracker-type-btn.active.rounds-active { background: var(--gold); color: black; }
.tracker-type-btn.active.timer-active { background: #6a9fc8; color: black; }
.tracker-del { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 2px 4px; flex-shrink: 0; }
.tracker-del:hover { color: var(--red-light); }

.tracker-bottom { display: flex; align-items: center; gap: 8px; }
.tracker-adjust-btn {
  width: 26px; height: 26px; background: var(--panel-2); border: 1px solid var(--border); color: var(--light);
  cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.tracker-adjust-btn:hover { border-color: var(--mid); color: white; }
.tracker-rounds-display { display: flex; flex-direction: column; align-items: center; min-width: 32px; }
.tracker-rounds { font-family: 'Share Tech Mono', monospace; font-size: 22px; font-weight: 700; color: var(--gold); }
.tracker-rounds.zero { color: var(--red-light); }
.tracker-label { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.tracker-expired-tag {
  font-family: 'Barlow Condensed', sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--red-light); margin-left: auto;
}

/* Timer-specific */
.timer-display { font-family: 'Share Tech Mono', monospace; font-size: 20px; font-weight: 700; color: #6a9fc8; min-width: 64px; text-align: center; }
.timer-display.zero { color: var(--red-light); }
.timer-set-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.timer-set-input {
  width: 50px; text-align: center; font-family: 'Share Tech Mono', monospace; font-size: 12px; padding: 4px 2px;
}
.timer-set-label { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.timer-controls { display: flex; gap: 4px; margin-left: auto; }
/* Collapsible second row: type dropdown + kind-specific controls */
.tracker-controls-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.tracker-controls-row.collapsed { display: none; }
.tracker-controls-row .timer-controls { margin-left: 0; }
.tracker-controls-row .timer-set-row { margin-top: 0; }
.tracker-round-adjust { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.tracker-collapse {
  background: transparent; border: none; color: var(--muted); cursor: pointer;
  font-size: 15px; line-height: 1; padding: 6px 9px; flex-shrink: 0;
}
.tracker-collapse:hover { color: var(--white); }

/* ═══ NPC / COMBAT CARD — one frame, per-system HP zone ═══
   Toned header highlight across the TOP; AC/EV/DEF badge + optional tier badge;
   ability strip; ATK rows with dice buttons; bold-name traits. Only the HP zone
   changes shape between game systems (numeric bar, DCC/ACE pips, SW wounds). */
.npc-card { position: relative; display: flex; flex-direction: column; background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; min-width: 0; max-height: calc(100vh - 200px); --tone: var(--red); }
.npc-card.defeated { opacity: 0.55; }
/* The header stays pinned; the body scrolls when a stat-block is taller than the
   card so nothing is clipped off the bottom. */
.cc-band { position: relative; display: flex; align-items: flex-start; gap: 8px; padding: 10px 11px 9px; flex: 0 0 auto; }
.cc-band::before { content: ''; position: absolute; inset: 0; opacity: 0.13; background: var(--tone); pointer-events: none; }
.cc-band::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--tone); }
.cc-band > .card-grip { position: relative; margin-top: 1px; }
.cc-title { position: relative; flex: 1; min-width: 0; }
.cc-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 17px; letter-spacing: 0.03em; color: var(--white); line-height: 1.06; text-transform: uppercase; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cc-subrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.cc-type { font-family: 'Share Tech Mono', monospace; font-size: 9.5px; letter-spacing: 0.05em; color: var(--tone); text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; filter: brightness(1.3); }
.cc-defchip { display: inline-flex; align-items: baseline; gap: 4px; border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; background: var(--panel-2); flex-shrink: 0; }
.cc-defchip .l { font-family: 'Barlow Condensed', sans-serif; font-size: 8.5px; font-weight: 800; letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; }
.cc-defchip .v { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--white); }
.cc-badge { position: relative; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: #0d0e10; background: var(--tone); padding: 2px 7px; border-radius: 20px; flex-shrink: 0; }
.cc-x { position: relative; color: var(--muted); cursor: pointer; font-size: 12px; border: none; background: none; padding: 2px 4px; flex-shrink: 0; margin-top: 1px; }
.cc-x:hover { color: var(--red-light); }
.cc-body { padding: 11px 12px 12px; flex: 1 1 auto; overflow-y: auto; min-height: 0; }
/* HP zone */
.cc-hp { margin-bottom: 11px; }
.cc-hp-head { display: flex; align-items: baseline; gap: 7px; margin-bottom: 5px; }
.cc-hp-lab { font-family: 'Barlow Condensed', sans-serif; font-size: 9.5px; font-weight: 800; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; }
.cc-hp-note { font-size: 10px; color: var(--mid); margin-left: auto; font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.02em; }
.cc-hp-num { display: flex; align-items: center; gap: 8px; }
.cc-hp-cur { width: 46px; text-align: center; background: transparent; border: none; border-bottom: 1px dashed var(--border); font-family: 'Share Tech Mono', monospace; font-size: 19px; color: var(--white); padding: 1px 0; }
.cc-hp-cur:focus { outline: none; border-bottom-color: var(--gold); }
.cc-hp-sep { font-family: 'Share Tech Mono', monospace; color: var(--muted); font-size: 13px; }
.cc-hp-max { font-family: 'Share Tech Mono', monospace; font-size: 14px; color: var(--mid); }
.cc-hp-bar { flex: 1; min-width: 30px; height: 11px; border-radius: 7px; background: #0b0b0b; border: 1px solid var(--border); overflow: hidden; }
.cc-hp-bar > i { display: block; height: 100%; border-radius: 6px; transition: width 0.2s ease, background 0.2s ease; }
.cc-hp-dmg { width: 50px; flex: 0 0 auto; background: var(--panel-2); border: 1px solid var(--border); border-radius: 7px; color: var(--white); font-family: 'Share Tech Mono', monospace; font-size: 12px; text-align: center; padding: 5px 4px; }
.cc-hp-dmg::placeholder { color: var(--muted); font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
.cc-hp-dmg:focus { outline: none; border-color: var(--gold); }
.cc-pips { display: flex; flex-wrap: wrap; gap: 4px; }
.cc-pip { min-width: 30px; flex: 1 1 auto; max-width: 54px; height: 26px; border-radius: 5px; border: 1px solid rgba(0,0,0,0.4); background: var(--seg-color, #4caf50); font-family: 'Share Tech Mono', monospace; font-size: 11px; color: rgba(0,0,0,0.6); font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: filter 0.15s; }
.cc-pip:hover { filter: brightness(1.15); }
.cc-pip.dead { background: #141414 !important; color: var(--muted); border-color: var(--border); }
.cc-wounds { display: flex; gap: 4px; flex-wrap: wrap; }
.cc-wound { flex: 1 1 auto; min-width: 44px; border: 1px solid var(--border); border-radius: 6px; background: #141414; color: var(--muted); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 9.5px; letter-spacing: 0.02em; text-transform: uppercase; padding: 6px 3px; cursor: pointer; text-align: center; }
.cc-wound.on { color: #0d0e10; }
/* Ability strip */
/* Flat stat row — plain cells, no panel, no border, no dividers, no bevel. */
.cc-abils { display: grid; grid-template-columns: repeat(auto-fit, minmax(40px, 1fr)); gap: 4px 2px; background: transparent; border: 0; border-radius: 0; margin-bottom: 11px; }
.cc-abil { background: transparent; border: 0; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 2px; min-width: 0; }
button.cc-abil { cursor: pointer; }
button.cc-abil:hover { background: rgba(255,255,255,0.05); border-radius: 6px; }
.cc-abil .l { font-family: 'Barlow Condensed', sans-serif; font-size: 8.5px; font-weight: 800; letter-spacing: 0.05em; color: var(--muted); text-transform: uppercase; white-space: nowrap; }
.cc-abil .v { font-family: 'Share Tech Mono', monospace; font-size: 13px; color: var(--white); }
.cc-meta { font-size: 11px; color: var(--mid); margin: -3px 0 11px; line-height: 1.5; overflow-wrap: anywhere; }
.cc-meta b { color: var(--light); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: 0.04em; }
/* Attacks + traits */
.cc-sec { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 800; letter-spacing: 0.12em; color: var(--gold); text-transform: uppercase; margin: 2px 0 6px; }
.cc-atk { display: flex; align-items: center; gap: 8px; padding: 6px 0; min-width: 0; }
.cc-atk + .cc-atk { border-top: 1px dashed var(--border); }
.cc-atk-t { flex: 1; min-width: 0; font-size: 12.5px; color: var(--light); overflow-wrap: anywhere; }
.cc-atk-t b { color: var(--white); font-family: 'Barlow Condensed', sans-serif; font-size: 14px; letter-spacing: 0.02em; }
.cc-atk-t .ex { color: var(--mid); }
.cc-atk-roll { flex: 0 0 auto; font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--gold); border: 1px solid var(--border); border-radius: 6px; padding: 4px 9px; cursor: pointer; white-space: nowrap; background: var(--panel-2); }
.cc-atk-roll:hover { border-color: var(--gold); color: var(--white); }
.cc-traits { border-top: 1px solid var(--border); margin-top: 10px; padding-top: 9px; }
.cc-trait { font-size: 12px; line-height: 1.55; color: var(--light); margin-top: 6px; overflow-wrap: anywhere; }
.cc-trait:first-of-type { margin-top: 0; }
.cc-trait-name { color: var(--gold); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: 0.02em; }
.cc-diebtn { background: var(--panel-2); border: 1px solid var(--border); border-radius: 5px; color: var(--gold); font-family: 'Share Tech Mono', monospace; font-size: 11px; padding: 0 5px; cursor: pointer; vertical-align: baseline; }
.cc-diebtn:hover { border-color: var(--gold); color: var(--white); }
.cc-defeated { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 10px; letter-spacing: 0.14em; color: var(--red-light); text-transform: uppercase; text-align: center; margin-top: 9px; border-top: 1px solid var(--border); padding-top: 8px; }
.pane.narrow .cc-abils { grid-template-columns: repeat(auto-fit, minmax(42px, 1fr)); }

/* Monster picker (Trackers → + Monster) */
/* Bestiary picker is a popup overlay inside the Combat window — it never steals
   the card list's space. */
.mon-pick { position: absolute; inset: 0; z-index: 30; margin: 0; padding: 16px; border: none; background: rgba(6,8,12,.72); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; }
.mon-pick-card { width: min(560px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: 8px; background: var(--panel); border: 1px solid var(--accent-dim); border-radius: 12px; padding: 12px; box-shadow: 0 24px 70px rgba(0,0,0,.6); min-height: 0; }
.mon-pick-head { display: flex; align-items: center; gap: 8px; }
.mon-pick-title { flex: 1; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--white); }
.mon-pick-controls { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; }
/* Timer + Blank buttons under the picker controls — the single "+" toolbar
   button opens this picker, so all "add" actions (timer, blank combatant, or a
   bestiary monster) live here. */
.mon-pick-add-row { display: flex; gap: 6px; }
.mon-pick-add-row > button { flex: 1 1 0; padding: 4px 0; font-size: 11px; letter-spacing: 0.08em; }
.mon-pick-search { flex: 1 1 120px; min-width: 0; background: var(--panel-2); border: 1px solid var(--border); color: var(--white); font-size: 12px; padding: 5px 7px; outline: none; }
.mon-pick-type { flex: 0 1 auto; min-width: 0; background: var(--panel-2); border: 1px solid var(--border); color: var(--white); font-size: 12px; padding: 5px 7px; outline: none; }
.mon-pick-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; border-top: 1px solid var(--border); }
.mon-pick-item { display: flex; align-items: baseline; gap: 8px; padding: 5px 4px; border-bottom: 1px solid var(--border); background: none; border-left: none; border-right: none; border-top: none; color: var(--light); font-size: 12px; text-align: left; cursor: pointer; min-width: 0; }
.mon-pick-item:hover { background: var(--panel-2); color: var(--white); }
.mon-pick-item-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.mon-pick-item-meta { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); flex-shrink: 0; }
.mon-pick-empty { font-size: 12px; color: var(--muted); font-style: italic; padding: 8px 4px; }


@media (max-width: 900px) {
  .cbt-body { flex-direction: column; overflow-y: auto; }
  .cbt-col { border-right: none; border-bottom: 1px solid var(--border); flex: none; }
}

/* ═══ GENERATORS TOOL ═══ */
.gen-tab-select {
  font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700;
  letter-spacing: 0.04em;
  padding: 5px 9px; background: var(--panel); border: 1px solid var(--border);
  color: var(--white); cursor: pointer; outline: none; min-width: 0; max-width: 100%;
  transition: border-color 0.15s;
}
.gen-tab-select:hover { border-color: var(--mid); }
.gen-tab-select option { background: var(--panel); color: var(--white); }
.gen-body { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.gen-panel { display: none; flex: 1; flex-direction: column; min-height: 0; overflow: hidden; }
.gen-panel.active { display: flex; }
.gen-controls {
  display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 16px;
  background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0;
}
/* Collapsible generator options (#7). The toggle bar sits above each panel's
   .gen-controls; collapsing hides the controls so the results get the space. */
.gen-opts-toggle {
  display: flex; align-items: center; gap: 6px; width: 100%;
  background: var(--panel); border: none; border-bottom: 1px solid var(--border);
  color: var(--muted); cursor: pointer; text-align: left;
  font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase; padding: 7px 16px; flex-shrink: 0;
}
.gen-opts-toggle:hover { color: var(--light); }
.gen-opts-chevron { font-size: 9px; line-height: 1; }
.gen-controls.collapsed { display: none; }
/* The Marvel generator's inline Generate is redundant now the toolbar button
   shows for it — keep the roll action consistently in the toolbar. */
.gen-inline-roll { display: none; }
/* Loot/treasure builders roll from the toolbar button now — hide the redundant
   inline roll button in their options. */
.ai-roll-tier, .ai-fl-roll, .xs-tr-roll { display: none; }
.gen-label {
  font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
  display: flex; flex-direction: column; gap: 4px;
}
.gen-select {
  background: var(--panel-2); border: 1px solid var(--border); color: var(--white);
  font-family: 'Barlow Condensed', sans-serif; font-size: 13px;
  padding: 5px 9px; outline: none; cursor: pointer;
}
.gen-select:focus { border-color: var(--mid); }
.gen-results {
  flex: 1; overflow-y: auto; overflow-x: hidden; padding: 14px 16px;
  display: flex; flex-direction: column; gap: 10px; min-width: 0;
}
.gen-empty { color: var(--muted); font-size: 12px; font-style: italic; padding: 20px 0; }
.gen-card {
  background: var(--panel); border: 1px solid var(--border);
  padding: 12px 14px; display: flex; flex-direction: column; gap: 6px;
  min-width: 0;
}
.gen-card-header {
  display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px;
  flex-wrap: wrap; min-width: 0;
}
.gen-card-name {
  font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700;
  letter-spacing: 0.04em; color: var(--white); min-width: 0; overflow-wrap: anywhere;
}
.gen-card-tag {
  font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold);
}
.gen-card-row {
  font-size: 12px; color: var(--light); line-height: 1.5;
  display: flex; gap: 6px; flex-wrap: wrap; min-width: 0;
}
/* Values wrap instead of pushing the card wider than its pane. */
.gen-card-row > span:not(.gen-card-row-label) { min-width: 0; overflow-wrap: anywhere; }
.gen-card-row-label {
  font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  min-width: 64px; flex-shrink: 0; padding-top: 1px;
}
.gen-card-divider { border: none; border-top: 1px solid var(--border); margin: 4px 0; }

/* ── Message console (message composer + DCC loot box + SD found loot) ────── */
.ai-tool { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.ai-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 14px 16px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.ai-section { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--gold); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ai-sec-title {
  font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold);
}
/* Collapsible sections: the title toggles the body via a caret. */
.ai-section.ai-collapsible > .ai-sec-title { cursor: pointer; display: flex; align-items: center; gap: 6px; user-select: none; }
.ai-section.ai-collapsible > .ai-sec-title::before { content: '\25be'; font-size: 9px; opacity: .8; transition: transform .12s; }
.ai-section.ai-collapsible.collapsed > .ai-sec-title::before { content: '\25b8'; }
.ai-section.ai-collapsible.collapsed > *:not(.ai-sec-title) { display: none !important; }
.ai-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
.ai-row > .ai-select, .ai-row > .ai-input { flex: 1; min-width: 0; }
.ai-input, .ai-select {
  background: var(--panel-2); border: 1px solid var(--border); color: var(--white);
  font-family: 'Barlow', sans-serif; font-size: 13px; padding: 7px 9px; outline: none;
  width: 100%; border-radius: 3px;
}
.ai-select { font-family: 'Barlow Condensed', sans-serif; cursor: pointer; }
.ai-input:focus, .ai-select:focus { border-color: var(--mid); }
textarea.ai-input { resize: vertical; line-height: 1.4; }
.ai-select option { background: var(--panel-2); color: var(--white); }
.ai-cat-results { display: none; flex-direction: column; max-height: 180px; overflow-y: auto; border: 1px solid var(--border); background: var(--panel-2); }
.ai-cat-results.open { display: flex; }
.ai-cat-item { padding: 6px 9px; cursor: pointer; font-size: 12px; color: var(--light); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 8px; }
.ai-cat-item:last-child { border-bottom: none; }
.ai-cat-item:hover { background: var(--panel); color: var(--white); }
.ai-cat-item .ai-cat-tier { font-size: 10px; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: .06em; flex-shrink: 0; }
.ai-cat-empty { padding: 8px 9px; font-size: 11px; font-style: italic; color: var(--muted); }
.ai-items { width: 100%; border-collapse: collapse; }
.ai-items td { padding: 3px 4px; vertical-align: middle; }
.ai-items .ai-it-name { width: 46%; } .ai-items .ai-it-qty { width: 46px; } .ai-items .ai-it-notes { width: auto; }
.ai-items .ai-input { font-size: 12px; padding: 5px 7px; }
.ai-items .ai-it-del { background: transparent; border: 1px solid var(--border); color: var(--mid); cursor: pointer; border-radius: 3px; padding: 4px 7px; font-size: 12px; line-height: 1; }
.ai-items .ai-it-del:hover { color: var(--red-light); border-color: var(--red-light); }
.ai-status { font-size: 11px; min-height: 14px; color: var(--mid); }
.ai-status.ok { color: var(--green-light); } .ai-status.err { color: var(--red-light); }
.pane.narrow .ai-scroll { padding: 10px 11px; }
.ai-cat-filters { display: flex; flex-wrap: wrap; gap: 5px; }
.ai-chip { border: 1px solid var(--border); background: transparent; color: var(--mid); border-radius: 20px; padding: 3px 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; cursor: pointer; font-family: 'Barlow Condensed', sans-serif; }
.ai-chip:hover { border-color: var(--gold); color: var(--gold); }
.ai-chip.on { border-color: var(--gold); background: rgba(200,160,32,0.12); color: var(--gold); }
.ai-cat-grp { padding: 5px 9px 3px; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); background: var(--panel); position: sticky; top: 0; }
.ai-cat-item.custom { color: var(--gold); font-style: italic; }
.ai-cat-item .ai-cat-meta { font-size: 10px; color: var(--muted); flex-shrink: 0; }
.ai-tool [hidden] { display: none !important; }

/* Stat pairs (AC/HP/MV, STR–CHA) as a responsive grid: six pairs on one line in
   a full-width pane, folding to two or three lines in a quarter-width one, so
   nothing runs off the edge in Four-pane mode. */
.gen-card-stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(54px, 1fr));
  gap: 3px 10px; min-width: 0;
}
.gen-card-stat { display: flex; align-items: baseline; gap: 4px; font-size: 12px; color: var(--light); min-width: 0; }
.gen-card-stat > span:last-child { min-width: 0; overflow-wrap: anywhere; }
.gen-card-stat-label {
  font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); flex-shrink: 0;
}
.gen-card-actions { display: flex; justify-content: flex-end; margin-top: 2px; }
.gen-card-actions .gen-send-tracker { white-space: nowrap; }
.gen-item-name { font-weight: 700; color: var(--gold); font-size: 13px; margin-bottom: 2px; }
.gen-item-desc { font-size: 12px; color: var(--light); line-height: 1.5; }

/* ═══ NOTES TOOL ═══ */
.nts-saved-indicator { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); opacity: 0; transition: opacity 0.3s; }
.nts-saved-indicator.show { opacity: 1; color: var(--green-light); }
.nts-body { flex: 1; display: flex; min-height: 0; background: var(--black); }
.nts-editor {
  flex: 1;
  outline: none;
  padding: 20px 24px;
  overflow-y: auto;
  font-family: 'Barlow', sans-serif;
  font-size: 14px;
  line-height: 1.75;
  color: var(--light);
  caret-color: var(--gold);
  min-height: 0;
}
.nts-editor:empty::before { content: attr(data-placeholder); color: var(--muted); pointer-events: none; }
/* Block styles rendered in place */
.nts-editor h1 { font-family: 'Cinzel', serif; font-size: 22px; font-weight: 700; color: var(--gold); margin: 8px 0 6px; }
.nts-editor h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--light); border-bottom: 1px solid var(--border); padding-bottom: 3px; margin: 12px 0 6px; }
.nts-editor h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700; color: var(--mid); margin: 10px 0 4px; }
.nts-editor p { margin: 0 0 4px; min-height: 1.75em; }
.nts-editor strong { color: var(--white); font-weight: 700; }
.nts-editor em { font-style: italic; }
.nts-editor ul, .nts-editor ol { margin: 0 0 6px; padding-left: 20px; }
.nts-editor li { margin-bottom: 2px; }
.nts-editor blockquote { border-left: 3px solid var(--gold); margin: 6px 0; padding: 2px 12px; color: var(--mid); font-style: italic; }
.nts-editor hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
.nts-editor code { font-family: 'Share Tech Mono', monospace; font-size: 12px; background: var(--panel-2); padding: 1px 4px; border-radius: 2px; }
.nts-raw {
  flex: 1; display: none;
  background: var(--panel-2); border: none; outline: none;
  color: var(--light); font-family: 'Share Tech Mono', monospace;
  font-size: 12px; line-height: 1.6; padding: 20px 24px;
  resize: none; min-height: 0;
}
.nts-md-toggle.active { background: var(--red); border-color: var(--red); color: white; }



/* ═══ MOBILE ═══ */
@media (max-width: 760px) {
  #hdr-toggle {
    display: flex; align-items: center; justify-content: flex-end; gap: 6px;
    width: 100%; height: 24px; flex-shrink: 0;
    padding: 0 12px; box-sizing: border-box;
    background: var(--dark); color: var(--gold);
    border-bottom: 1px solid var(--border);
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
    font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
    cursor: pointer; user-select: none;
  }
  body.hdr-hidden .topbar { display: none; }

  .topbar { flex-wrap: wrap; height: auto; padding: 10px 12px; gap: 8px; }
  .brand { font-size: 15px; width: 100%; }
  .pane-picker { flex: 1; min-width: 0; }
  .pane-picker-label { display: none; }
  /* Pack every top-bar control to the left rather than splitting them across
     the row: drop the flexible spacer and the auto margin that pushed View to
     the far right. */
  .topbar .topbar-spacer { display: none; }
  .view-controls { margin-left: 0; }

  .main-area { flex-direction: column; }
  .pane { border-right: none; border-bottom: 2px solid var(--border); }

  /* Pane header layout on mobile is set further down (fixed-width picker + a
     single non-wrapping toolbar row). */
  /* Make sure cbt round display and next round button don't get hidden */
  .cbt-round-display { font-size: 11px; }

  /* PDF viewer on mobile: switch to overflow:auto on the pane so the
     entire pane scrolls, and give the PDF object a tall fixed pixel height
     so all pages are accessible by scrolling the pane. */
  .pane { flex: 1; min-height: 0; }
  .pane-content { flex: 1; overflow-y: auto; min-height: 0; }
  .tool-instance { min-height: 0; }
  .doc-body { flex: none; }
  .doc-frame-wrap.pdf-mode {
    padding: 0;
    overflow: visible;
    height: 160vw; /* taller than screen — user scrolls the pane */
  }
  .doc-frame-wrap.html-mode {
    height: 82vh; /* defined height so the zoom fit has real dimensions */
    overflow: auto;
  }
  .doc-frame.pdf-frame {
    width: 100% !important;
    height: 100% !important;
    min-height: unset;
  }
  .pdf-mobile-open { display: none !important; }
  .pdf-close-btn { display: none !important; }

  /* Single-pane lock: the layout picker is meaningless on mobile */
  .view-controls { display: none !important; }

  .toolrow { padding: 10px 12px; gap: 10px; }

  /* ── Larger type + touch targets (min 44px tap area) ── */
  .btn { font-size: 14px; padding: 11px 14px; min-height: 44px; }
  .btn.small { font-size: 13px; padding: 9px 12px; min-height: 40px; }
  .brand { font-size: 20px; }
  .bar-title { font-size: 14px; }
  /* Tool picker is a fixed size (see the dropdowns block below for the exact
     width); the icon buttons sit inline to its right in a single row that never
     wraps to a new line (it scrolls horizontally if a tool ever has more buttons
     than fit). */
  .pane-header { flex-wrap: nowrap !important; padding: 6px 10px; gap: 6px; }
  .pane-select { font-size: 14px !important; padding: 9px 8px !important; min-height: 42px; }
  .pane-toolbar-slot {
    flex: 1 1 auto; min-width: 0; flex-wrap: nowrap !important;
    justify-content: flex-start; overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .pane-toolbar-slot > * { flex: 0 0 auto; }
  .pane-toolbar-slot .toolbar-spacer { display: none; }
  /* Inputs and the generator tab-select keep a usable width; the row scrolls
     horizontally rather than wrapping if everything can't fit at once. */
  .pane-toolbar-slot input { flex: 0 1 140px; min-width: 90px; }
  .pane-toolbar-slot select { flex: 0 1 auto; min-width: 0; }
  .split-select, .gen-tab-select { font-size: 14px; min-height: 42px; padding: 8px 10px; }
  .session-controls .btn { min-height: 44px; }

  /* Notes / text entry */
  .nts-editor { font-size: 16px; padding: 14px 16px; }   /* 16px stops iOS zoom-on-focus */
  input[type="text"], input[type="number"], select, textarea { font-size: 16px; }

  /* Combat + tracker controls */
  .cbt-round-display { font-size: 15px; }
  /* Save toolbar space on phones: show "RD" instead of the full "Round". */
  .cbt-round-label { display: none; }
  .cbt-round-display::before { content: "RD "; }
  .npc-hp-btn, .tracker-adjust-btn { width: 44px; height: 44px; font-size: 18px; }
  .dice-camp-btn, .dice-hide-btn { font-size: 14px; padding: 10px 12px; min-height: 42px; }
  .dice-pool-clear, .dice-roll-go { font-size: 14px; padding: 11px 14px; min-height: 44px; }
  .dice-mod { font-size: 15px; padding: 9px 6px; min-height: 42px; }
  .dice-advbtn { font-size: 13px; padding: 10px 10px; min-height: 42px; }

  .cbt-body { flex-direction: column; }
  .npc-hp-btn, .tracker-adjust-btn { width: 32px; height: 32px; }
  /* DCC segments: shrink so 10 fit on one line before wrapping */
  .npc-seg { min-width: 0; height: 26px; flex: 1 1 0; }
  .npc-seg-num { font-size: 10px; }
  .npc-seg-row { gap: 2px; }
  .npc-hp-input { min-height: 32px; font-size: 14px; }
  .tracker-name-input, .npc-name-input { font-size: 14px; }

  .nts-editor { font-size: 16px; padding: 14px 16px; }
}

/* ── NOTES TABS (hanging overlay) ── */
.nts-body { position: relative; }
.nts-tabs { position: absolute; top: 0; left: 8px; right: 8px; z-index: 5; display: flex; align-items: flex-start; gap: 3px; overflow-x: auto; scrollbar-width: none; pointer-events: none; }
.nts-tabs::-webkit-scrollbar { display: none; }
.nts-tab { pointer-events: auto; display: flex; align-items: center; gap: 5px; padding: 4px 10px 5px; background: #232323; color: #999; border: 1px solid var(--border); border-top: none; border-radius: 0 0 5px 5px; cursor: pointer; font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 700; white-space: nowrap; flex-shrink: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
.nts-tab.active { background: var(--panel); color: var(--gold); border-color: var(--gold); }
.nts-tab-x { color: #666; font-size: 10px; padding: 0 1px; line-height: 1; }
.nts-tab-x:hover { color: #d06060; }
.nts-tab-add { pointer-events: auto; padding: 4px 9px 5px; background: rgba(35,35,35,0.85); color: #888; border: 1px dashed var(--border); border-top: none; border-radius: 0 0 5px 5px; cursor: pointer; font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 900; flex-shrink: 0; }
.nts-tab-add:hover { color: var(--gold); border-color: var(--gold); }

/* ── DICE TRAY & ROLL LOG ── */
.dice-tool { overflow: hidden; }
.dice-tray { flex-shrink: 0; padding: 8px 10px 4px; border-top: 2px solid var(--border); background: rgba(0,0,0,0.25); }
.dice-btn-row { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
.dice-die { position: relative; padding: 12px 0; min-width: 0; background: var(--panel); color: var(--light); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: .04em; transition: border-color .1s, transform .05s; overflow: visible; }
.dice-die:hover { border-color: var(--gold); }
.dice-die:active { transform: scale(0.94); }
.dice-die.has { border-color: var(--gold); color: var(--gold); }
.dice-count { position: absolute; top: -6px; right: -5px; background: var(--gold); color: #1a1a1a; border-radius: 8px; min-width: 16px; height: 16px; line-height: 16px; font-size: 10px; font-weight: 900; font-family: 'Montserrat', sans-serif; }
.dice-pool { flex-shrink: 0; padding: 4px 10px 8px; background: rgba(0,0,0,0.25); }
/* ── Per-system trays (mirror each character sheet's dice tray) — controls only, no labels/notes ── */
.gmt { display: flex; flex-direction: column; gap: 6px; }
.gmt-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.gmt-num, .gmt-txt, .gmt-sel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; color: var(--light); font-family: 'Share Tech Mono', monospace; font-size: 15px; padding: 7px 6px; outline: none; }
.gmt-num { width: 52px; text-align: center; -moz-appearance: textfield; }
.gmt-num::-webkit-outer-spin-button, .gmt-num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.gmt-txt { min-width: 90px; }
.gmt-num:focus, .gmt-txt:focus, .gmt-sel:focus { border-color: var(--gold); }
.gmt-step { width: 34px; padding: 8px 0; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; color: var(--light); cursor: pointer; font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 800; line-height: 1; flex-shrink: 0; }
.gmt-step:hover { border-color: var(--gold); color: var(--gold); }
.gmt-step:active { transform: scale(0.94); }
/* Roll button — identical styling to the standard tray's .dice-roll-go, just not stretched. */
.gmt-roll { flex: 0 0 auto; padding: 6px 12px; background: var(--gold); color: #1a1a1a; border: none; border-radius: 4px; cursor: pointer; font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.gmt-roll:hover { filter: brightness(1.1); }
.gmt-die { flex: 1 1 auto; min-width: 44px; padding: 11px 0; }
.gmt-kob { gap: 4px; }
/* Marvel edge/trouble counters (mirror the sheet's tray) */
.gmt-mv { gap: 8px; flex-wrap: wrap; }
.gmt-et { display: inline-flex; align-items: center; gap: 3px; }
.gmt-etl { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
.gmt-edge .gmt-etl { color: #e8c86a; }
.gmt-trouble .gmt-etl { color: #e0776f; }
.gmt-etv { font-family: 'Share Tech Mono', monospace; font-size: 14px; min-width: 15px; text-align: center; color: var(--light); }
.gmt-mv .gmt-step { width: 26px; padding: 6px 0; font-size: 15px; }
.gmt-btn { padding: 8px 10px; background: var(--panel); color: var(--light); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 800; letter-spacing: .04em; flex-shrink: 0; }
.gmt-btn:hover { border-color: var(--gold); }
.gmt-btn.on { background: #1a3a1a; border-color: #2d7a2d; color: #6dbf6d; }
.dice-pool-row.sys { gap: 6px; }
.dice-pool-label-row { padding: 0 0 6px; }
.dice-pool-label { display: block; font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dice-pool-row { display: flex; align-items: center; gap: 5px; }
.dice-pool-row .dice-mod { flex: 0 1 auto; }
.dice-roll-go { flex: 1; }
.dice-mod { width: 44px; background: var(--panel); border: 1px solid var(--border); border-radius: 4px; color: var(--light); font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700; padding: 5px 4px; text-align: center; outline: none; }
.dice-advbtn { padding: 6px 8px; background: var(--panel); color: #888; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-family: 'Montserrat', sans-serif; font-size: 9px; font-weight: 900; letter-spacing: .06em; }
.dice-advbtn.on-adv { background: #1a3a1a; border-color: #2d7a2d; color: #6dbf6d; }
.dice-advbtn.on-dis { background: #3a1a1a; border-color: #7a2d2d; color: #df6a6a; }
.dice-roll-go { padding: 6px 12px; background: var(--gold); color: #1a1a1a; border: none; border-radius: 4px; cursor: pointer; font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.dice-roll-go:hover { filter: brightness(1.1); }
.dice-pool-clear { padding: 6px 9px; background: transparent; color: #999; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700; white-space: nowrap; }
.dice-pool-clear:hover { color: #df6a6a; border-color: #7a2d2d; }
.dice-log { flex: 1; overflow-y: auto; padding: 8px 10px; display: flex; flex-direction: column-reverse; justify-content: flex-start; gap: 6px; }
/* Found-loot / message cards broadcast from the Generators & Party tools. */
.dice-log-entry.system { border-left: 3px solid #c8a020; background: #241f14; }
.dice-log-entry.foundloot { border-left: 3px solid #c8a020; background: #221f16; }
.dice-log-entry .fl-head { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .12em; color: #e0c060; }
.dice-log-entry .fl-name { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 800; color: #f0e2b0; margin-top: 2px; }
.dice-log-entry .fl-body { font-size: 11px; color: #d8d2c0; margin-top: 3px; line-height: 1.45; }
.dice-log-entry .fl-items { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.dice-log-entry .fl-item { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; font-size: 11px; color: #cfc6a8; }
.dice-log-entry .fl-sent { font-weight: 400; letter-spacing: .04em; color: #6f6b5c; text-transform: none; margin-left: 4px; }
.dice-log-entry .fl-for { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; color: #9a9a78; text-transform: uppercase; letter-spacing: .08em; margin-top: 2px; }
.dice-log-entry .fl-note { color: #8a8570; font-style: italic; }
.dice-log-entry .fl-by { flex: 0 0 auto; font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #8a8570; border: 1px solid #4a463a; border-radius: 3px; padding: 2px 6px; }
.dice-log-entry .fl-by.open { color: #c8a020; border-color: #7a5a00; }
.dice-log-hint { color: #444; font-size: 11px; font-family: 'Barlow Condensed', sans-serif; text-align: center; padding: 20px 10px; letter-spacing: .06em; text-transform: uppercase; }
.dice-log-entry { background: #1e1e1e; border: 1px solid #333; border-radius: 3px; padding: 8px 10px; }
.dice-log-entry .roll-label { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: #888; margin-bottom: 2px; }
.dice-log-entry .roll-result { font-family: 'Share Tech Mono', monospace; font-size: 22px; font-weight: 700; color: #e8e4dc; line-height: 1; }
.dice-log-entry .roll-detail { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: #777; margin-top: 3px; line-height: 1.4; word-break: break-word; }
.dice-log-entry.crit { border-color: #ffd700; }
.dice-log-entry.crit .roll-result { color: #ffd700; }
.dice-log-entry.fumble { border-color: #ff4444; }
.dice-log-entry.fumble .roll-result { color: #ff4444; }
@media (max-width: 760px) {
  .dice-btn-row { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .dice-die { padding: 14px 0; font-size: 16px; min-height: 48px; }
  .dice-log-entry { font-size: 14px; }
}

.dice-camp-btn { padding: 6px 9px; background: transparent; color: #777; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-size: 12px; line-height: 1; white-space: nowrap; }
.dice-camp-btn.on { background: rgba(200,160,32,0.12); color: var(--gold); border-color: var(--gold); }
.dice-hide-btn { padding: 6px 9px; background: rgba(45,122,45,0.12); color: #6dbf6d; border: 1px solid #2d7a2d; border-radius: 4px; cursor: pointer; font-size: 12px; line-height: 1; white-space: nowrap; }
.dice-hide-btn.on { background: rgba(122,45,45,0.15); color: #df8a8a; border-color: #7a2d2d; }
.dice-camp-panel { padding: 6px 0 2px; }
/* System toggle (SD / DCC) — top bar, next to Campaign */
/* Read-only system indicator (the linked campaign drives the system now). */
/* Campaign link — top bar button + popover */
#camp-btn.on { background: rgba(200,160,32,0.12); color: var(--gold); border-color: var(--gold); }
#camp-popover {
  position: fixed; inset: 0; z-index: 400; display: none;
  align-items: center; justify-content: center;
  background: rgba(4,6,10,.6); backdrop-filter: blur(2px); padding: 16px;
}
#camp-popover .camp-card {
  width: min(420px, 94vw); max-height: 82vh; overflow-y: auto;
  background: linear-gradient(180deg,#161922,#101319); border: 1px solid var(--accent-dim);
  border-radius: 14px; padding: 14px; box-shadow: 0 24px 70px rgba(0,0,0,.65), 0 0 0 1px rgba(36,211,238,.15);
}
#camp-popover .camp-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
#camp-popover .camp-card-title { flex: 1; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--white); }
#camp-popover .camp-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
#camp-popover .camp-row:last-child { margin-bottom: 0; }
#camp-popover input {
  flex: 1; min-width: 60px; padding: 6px 8px; background: var(--panel); border: 1px solid var(--border);
  border-radius: 4px; color: var(--light); font-family: 'Montserrat', sans-serif; font-size: 11px; outline: none;
}
#camp-popover button {
  padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; flex-shrink: 0;
  font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 9px; letter-spacing: .08em; text-transform: uppercase;
}
#camp-popover .camp-hint { font-family: 'Montserrat', sans-serif; font-size: 9px; color: var(--muted); line-height: 1.5; }
#camp-popover .camp-err { font-family: 'Montserrat', sans-serif; font-size: 10px; color: #df6a6a; min-height: 12px; }
#camp-popover .camp-live { font-family: 'Montserrat', sans-serif; font-size: 11px; color: var(--gold); flex: 1; }
#camp-popover .camp-list { display: flex; flex-direction: column; gap: 4px; max-height: 240px; overflow-y: auto; margin-bottom: 4px; }
#camp-popover .camp-item {

  color: var(--light); cursor: pointer; text-transform: none; letter-spacing: 0; font-weight: 700;
}

#camp-popover .camp-item.active { background: rgba(200,160,32,0.12); border-color: var(--gold); color: var(--gold); }
#camp-popover .camp-item-name { font-family: 'Montserrat', sans-serif; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#camp-popover .camp-item-code { font-family: 'Montserrat', sans-serif; font-size: 10px; letter-spacing: .12em; color: var(--muted); flex-shrink: 0; }
#camp-popover .camp-item.active .camp-item-code { color: var(--gold); }
#camp-popover .camp-sep { height: 1px; background: var(--border); margin: 8px 0; }
@media (max-width: 760px) { #camp-popover .camp-card { width: 100%; } }

/* ══ ROUNDED BUTTONS ══════════════════════════════════════════════════════
   Applied last so it wins over the per-button rules above. Deliberately
   shaped controls are left alone: .nts-tab / .nts-tab-add (notes tabs). */
.btn, .dice-camp-btn, .dice-hide-btn, .dice-advbtn, .dice-pool-clear,

   Appended last so it wins over the earlier mobile rules above. Covers:

  }
