// ── Rival Crawlers ────────────────────────────────────────────────────────
const RC_NAMES = [
  ...NPC_NAMES.Human,...NPC_NAMES.Dwarf,...NPC_NAMES.Elf,
  ...NPC_NAMES.Goblin,...NPC_NAMES.Halfling,...NPC_NAMES['Half-Orc'],
];
const RC_CLASSES = ['Cleric','Fighter','Thief','Wizard'];
const RC_ANCESTRY = ['Human','Human','Human','Dwarf','Elf','Halfling','Half-Orc','Goblin'];
const RC_GOALS = [
  'hunting the same monster the party is after',
  'searching for a specific magic item',
  'mapping the dungeon for a wealthy patron',
  'fleeing something that killed two of their members',
  'looking for a missing comrade',
  'hired to retrieve a specific object',
  'trying to beat the party to the treasure',
  'in search of a legendary artifact',
  'running from a debt to the Thieves\' Guild',
  'on a holy mission for their deity',
];
const RC_QUIRKS = [
  'over-confident and boastful','secretive about their past',
  'clearly underprepared — out of torches','battle-scarred and wary',
  'surprisingly well-equipped','arguing among themselves',
  'nursing a recent wound','clearly lost','deceptively cheerful',
  'professional and businesslike','visibly afraid of something nearby',
];
const RC_GEAR_HINTS = [
  'well-stocked crawling kits','mostly improvised gear',
  'quality weapons but light armor','heavy armor, slow moving',
  'alchemist\'s fire and rope in abundance','a captured monster on a chain',
  'a treasure map visible on one member','magical light sources (no torches)',
  'someone is carrying something that clanks suspiciously',
];
const RC_DISPOSITION_DETAILS = {
  Hostile:  ['draw weapons immediately','demand the party leave now','have already attacked and take no prisoners'],
  Wary:     ['eye the party with suspicion','keep hands near weapons','ask sharp questions before talking'],
  Neutral:  ['nod curtly and keep moving','exchange basic information if pressed','trade news of the dungeon'],
  Friendly: ['share a rumor they picked up','offer to team up briefly','warn about a danger ahead'],
};

function rollD(max) { return Math.ceil(Math.random()*max); }
function rollTable(tbl, val) { for(const [n,r] of tbl) if(val<=n) return r; return tbl[tbl.length-1][1]; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function card(html) { const d=document.createElement('div'); d.className='gen-card'; d.innerHTML=html; return d; }
function row(label, val) { return `<div class="gen-card-row"><span class="gen-card-row-label">${label}</span><span>${esc(val)}</span></div>`; }
function tag(t, v) { return `<span class="gen-card-tag">${esc(t)}: ${esc(v)}</span> `; }

// ── Mundane Loot ──────────────────────────────────────────────────────────
function genMundaneLoot(subtype) {
  if(subtype==='gem') {
    const gem = R(GEMS);
    const isGiant = Math.random() < 0.15;
    const name = isGiant ? 'Giant '+gem.name : gem.name;
    const val  = gem.value.replace(/^(\d+)/, n => isGiant ? n*2 : n);
    return card(`<div class="gen-item-name">${esc(name)}</div><div class="gen-item-desc">Value: ${esc(val)}</div>`);
  }
  if(subtype==='luxury') {
    const feat = R(LUX_FEAT); const pool = R(LUX_ITEM_POOLS); const item = R(pool);
    return card(`<div class="gen-item-name">Luxury Item</div><div class="gen-item-desc">${esc(feat)} ${esc(item)}</div>`);
  }
  return card(`<div class="gen-item-name">Mundane Loot</div><div class="gen-item-desc">${esc(R(MUNDANE_LOOT))}</div>`);
}

// ── Rival Crawlers ────────────────────────────────────────────────────────
function genRivalCrawler(size, disp) {
  const count = size==='random' ? (Math.ceil(Math.random()*4)+1) : parseInt(size);
  const disposition = disp==='random' ? R(['Hostile','Wary','Neutral','Neutral','Friendly']) : disp;
  const goal = R(RC_GOALS);
  const quirk = R(RC_QUIRKS);
  const gear = R(RC_GEAR_HINTS);
  const dispDetail = R(RC_DISPOSITION_DETAILS[disposition]||RC_DISPOSITION_DETAILS.Neutral);
  const members = [];
  for(let i=0;i<count;i++) {
    const anc = R(RC_ANCESTRY);
    const cls = R(RC_CLASSES);
    const name = R(NPC_NAMES[anc]||NPC_NAMES.Human);
    members.push(`${name} (${anc} ${cls})`);
  }
  return card(`
    <div class="gen-card-header"><span class="gen-card-name">Rival Crawlers</span>
    <span class="gen-card-tag">${count} crawlers · ${esc(disposition)}</span></div>
    <div class="gen-card-row"><span class="gen-card-row-label">Members</span>
    <span>${members.map(esc).join('<br>')}</span></div>
    <hr class="gen-card-divider">
    ${row('Goal', goal)} ${row('Quirk', quirk)} ${row('Gear', gear)}
    ${row('Behaviour', dispDetail)}
  `);
}

// ── NPC ───────────────────────────────────────────────────────────────────
function genNPC(ancestry, wealth) {
  const anc  = ancestry==='random'?R(['Human','Human','Human','Dwarf','Elf','Halfling','Half-Orc','Goblin']):ancestry;
  const wlth = wealth==='random'?R(['Poor','Poor','Standard','Standard','Standard','Wealthy']):wealth;
  const pool = NPC_NAMES[anc]||NPC_NAMES.Human;
  const name = R(pool);
  const age  = anc==='Goblin'?`${rollD(20)+5}`:anc==='Elf'?`${rollD(400)+50}`:anc==='Dwarf'?`${rollD(200)+30}`:`${rollD(40)+15}`;
  return card(`
    <div class="gen-card-header"><span class="gen-card-name">${esc(name)}</span><span class="gen-card-tag">${esc(anc)} · ${esc(wlth)}</span></div>
    ${row('Age',age)} ${row('Build',`${R(BUILDS)}, ${R(HAIR)} hair, ${R(EYES)} eyes`)}
    ${row('Dress',R(CLOTHING[wlth]))} ${row('Feature',R(FEATURES))}
    <hr class="gen-card-divider">
    ${row('Occupation',R(OCCUPATIONS))} ${row('Demeanor',R(DEMEANOR))}
    ${row('Quirk',R(QUIRKS))} ${row('Wants',R(WANTS))}
    ${row('Secret',R(SECRETS))} ${row('Coin',COIN[wlth]())}
  `);
}

// ── Treasure ─────────────────────────────────────────────────────────────
function genTreasure(tierKey, type) {
  if(type==='random_all') {
    // Equal chance across all categories
    type = R(['random','random','Weapon','Armor','Wand','Ring','Cloak','Boots',
              'Potion','Scroll','table','mundane','gem','luxury']);
  }
  if(type==='table') {
    const tier = TREASURE_TIERS[tierKey]||TREASURE_T1;
    return card(`<div class="gen-item-name">Treasure Table Roll (Tier ${tierKey})</div><div class="gen-item-desc">${esc(R(tier))}</div>`);
  }
  if(type==='mundane' || type==='gem' || type==='luxury') return genMundaneLoot(type);
  const pool = type==='random'?MAGIC_ITEM_POOLS[R(LOOT_TYPES)]:(MAGIC_ITEM_POOLS[type]||POTIONS);
  const item = R(pool);
  return card(`<div class="gen-item-name">${esc(item.name)}</div><div class="gen-item-desc">${esc(item.desc)}</div>`);
}

// Expose the Treasure Generator's data as a roller + catalog so the Message
// tool's SD Found Loot produces the SAME treasure (magic items, gems, mundane
// loot, luxury items, treasure-table rolls). Published on window from inside
// this IIFE, where the pools (MAGIC_ITEM_POOLS/GEMS/…) actually live.
window.sdTreasureRoll = function(tierKey) {
  const type = R(['random','random','Weapon','Armor','Wand','Ring','Cloak','Boots','Potion','Scroll','table','mundane','gem','luxury']);
  if(type==='table') { const tier = TREASURE_TIERS[tierKey] || TREASURE_T1; return { item: R(tier), qty: 1, notes: 'Treasure — Tier ' + (tierKey || '1') }; }
  if(type==='mundane') { return { item: R(MUNDANE_LOOT), qty: 1, notes: 'Mundane loot' }; }
  if(type==='gem') { const gem = R(GEMS); const giant = Math.random() < 0.15; const name = (giant ? 'Giant ' : '') + gem.name; const val = String(gem.value).replace(/^(\d+)/, n => giant ? n*2 : n); return { item: name, qty: 1, notes: 'Gemstone — value ' + val }; }
  if(type==='luxury') { const feat = R(LUX_FEAT), pool = R(LUX_ITEM_POOLS), it = R(pool); return { item: feat + ' ' + it, qty: 1, notes: 'Luxury item' }; }
  const pool = type==='random' ? MAGIC_ITEM_POOLS[R(LOOT_TYPES)] : (MAGIC_ITEM_POOLS[type] || POTIONS);
  const it = R(pool); return { item: it.name, qty: 1, notes: it.desc || '' };
};
window.sdTreasureCatalog = function() {
  const out = [];
  LOOT_TYPES.forEach(t => (MAGIC_ITEM_POOLS[t] || []).forEach(it => out.push({ name: it.name, category: t.toLowerCase(), effect: it.desc || '' })));
  GEMS.forEach(g => out.push({ name: g.name, category: 'gem', effect: 'Value ' + g.value }));

// ── DCC Loot Box ───────────────────────────────────────────────────────────

  const gold = dccRollGold(td.gold);

  const gear = dccItemsOfTier(td.tier, ['weapon', 'armor', 'accessory']);
  const picks = [];
  dccPickN(consumables, 1 + (Math.random() < 0.5 ? 1 : 0)).forEach(it => picks.push(it));

    dccItemSpellLine(it, td.tier) + `</span></div>`).join('');

  let fill = '';
  if(missing > 0) {
    const baseGear = dccPickN(dccBasePool(['weapon', 'armor', 'accessory']), missing);
    baseGear.forEach(b => {

        `<span><b>${esc(td.tier)} ${esc(b.name)}</b><br><span style="opacity:.75">` +

// ── DCC Magic-Item generator (Core Tables 38–42) ───────────────────────────
// Rolls a random enchanted property: item type (Table 38 → 39/40/41), then the

const DCC_BASE_ITEMS = {
  '39': ['Longsword', 'Dagger', 'Warhammer', 'Spear', 'Mace', 'Battleaxe', 'Shortbow', 'Greatsword', 'Club', 'Crossbow'],
  '40': ['Cap', 'Vest', 'Gloves', 'Boots', 'Cloak', 'Robe', 'Hood', 'Sash'],
  '41': ['Ring', 'Amulet', 'Belt', 'Bracelet', 'Pendant', 'Circlet', 'Earring', 'Brooch'],

// Falls back to the small hardcoded list when the library isn't available.
function dccBaseChassisNames(tableNum) {
  const cats = tableNum === '40' ? ['armor'] : tableNum === '41' ? ['accessory'] : ['weapon', 'mundane'];

function genDccMagicItem(tierKey, forcedType) {
  const t38 = dccLootTable('38');
  if(!t38) return card('<div class="gen-empty">DCC loot tables didn’t load. Open the GM screen from the app.</div>');
  let typeTableNum, typeLabel;
  const TYPE_LABELS = { '39': 'Enchanted Mundane Item or Weapon', '40': 'Enchanted Clothing', '41': 'Enchanted Accessory' };
  if(forcedType && TYPE_LABELS[forcedType]) {
    typeTableNum = forcedType; typeLabel = TYPE_LABELS[forcedType];
  } else {
    const tr = dccRollRow(t38);                       // e.g. "Enchanted Clothing (Table 40)"
    const m = tr && String(tr.result).match(/Table (\d+)/);
    typeTableNum = m ? m[1] : '39';
    typeLabel = tr ? String(tr.result).replace(/\s*\(Table \d+\)\s*/, '') : (TYPE_LABELS[typeTableNum] || 'Enchanted Item');
  }
  const typeTable = dccLootTable(typeTableNum);
  const tier = dccLootTier(tierKey);
  const xVal = tier ? tier.xValue : '';
  // Number of enchantment rolls scales with rarity (Silver 1 … Celestial 5, per the
  // book's "rolls per gear item by box rarity"). All rolls are on the item's type table.
  const nRolls = Math.max(1, (tier && typeof tier.gearRolls === 'number') ? tier.gearRolls : 1);
  const base = dccPick(dccBaseChassisNames(typeTableNum)) || 'Item';
  const seen = new Set();
  const lines = [];       // { label, html }
  let usedX = false, isUnique = false, forfeited = 0;
  for(let i = 0; i < nRolls; i++) {
    let prop = dccRollRow(typeTable);
    const raw = prop ? prop.result : '';
    // "Something Unique" (Table 42) — roll once and stop; the forfeited rolls
    // concentrate its power (unique on roll 1 of 3 ≈ ×3).
    if(/Something Unique|Table 42/i.test(raw)) {
      const u = dccRollRow(dccLootTable('42'));
      forfeited = nRolls - i - 1;
      const mult = forfeited > 0 ? ` <span style="opacity:.7">(power ×${forfeited + 1} — ${forfeited} roll${forfeited === 1 ? '' : 's'} forfeited)</span>` : '';
      lines.push({ label: 'Unique', html: (u ? esc(u.result) : 'Something Unique') + mult });
      isUnique = true;
      break;
    }
    // Resolve concretely; re-roll an exact-duplicate property (can't apply the same one twice).
    let html = dccResolveProperty(raw, tierKey, typeTableNum);
    let tries = 0;
    while(seen.has(html) && tries < 6) { prop = dccRollRow(typeTable); html = dccResolveProperty(prop ? prop.result : '', tierKey, typeTableNum); tries++; }
    seen.add(html);
    if(/\bstat\b|\bskill\b/i.test(raw)) usedX = true;
    lines.push({ label: 'Enchantment', html: html });
  }
  const multi = lines.filter(l => l.label === 'Enchantment').length > 1;
  let n = 0;
  const rowsHtml = lines.map(l => {
    const lbl = (l.label === 'Enchantment' && multi) ? ('#' + (++n)) : l.label;
    return `<div class="gen-card-row"><span class="gen-card-row-label">${esc(lbl)}</span><span>${l.html}</span></div>`;
  }).join('');
  const guidance = (usedX && xVal)
    ? `<div class="gen-item-desc" style="opacity:.55;text-transform:none;">${esc(tierKey)} guideline: ${esc(xVal)}</div>` : '';
  const pageNote = (typeTable && typeTable.page) ? ' · p.' + esc(String(typeTable.page)) : '';
  const countTag = isUnique ? 'Unique' : (nRolls + ' enchantment' + (nRolls === 1 ? '' : 's'));
  return card(
    `<div class="gen-card-header"><span class="gen-card-name">Enchanted ${esc(base)}</span><span class="gen-card-tag">${esc(tierKey)} · ${esc(typeLabel || 'Enchanted Item')} · ${esc(countTag)}</span></div>` +
    rowsHtml +
    guidance +
    `<div class="gen-item-desc" style="opacity:.6;text-transform:none;">Tables 38&ndash;42${pageNote} · rename to taste.</div>`
  );
}

// ── Enchant a base item → a one-off magic item (Message tool loot builder) ──
// Takes a base (mundane) item from the library and rolls the tier's enchant
// perks (Tables 39/40/41) as SHEET-PARSEABLE strings ("+3 STR", "+2 Athletics

const DCC_ENCHANT_EPITHETS = [
  'of the Great Bambino','of Doom','of the Ancients','of Untold Power','of the Forgotten King',
  'of the Screaming Void','of Righteous Fury','of the Midnight Sun','of Sudden Violence','of the Dungeon Lord',
  'of Cosmic Regret','of the Nine Hells','of Legendary Renown','of the Fallen Star','of Whispered Secrets',
  'of the Blood Moon','of Eternal Vigilance','of the Last Laugh','of Merciless Judgment','of the Iron Will',
  'of Boundless Greed','of the Shattered Crown','of the Howling Wastes','of the Grinning Skull','of Reckless Abandon',
  'of the Silent Hunter','of Molten Rage','of the Frozen Depths','of Unspoken Dread','of the Golden Age',
  'of the Feral Beast','of Divine Spite','of the Wandering Ghost','of Ten Thousand Screams','of Maximum Overdrive',
  'of the Sponsored Content','of the System’s Favor','of the Content Mob','of the Fifth Floor','of Questionable Taste',

  const t = dccLootTier(tierKey);

  let v = parsed ? dccRollX(kind === 'skill' ? parsed.skill : parsed.stat) : '';
  if(!v || v === '+' || /\?/.test(v)) v = '+1';   // Bronze / unparseable → +1

function dccEnchantPerk(raw, tierKey) {

  if(/\bX\b/.test(p) && /stat/i.test(p))  { return dccEnchantMagnitude(tierKey,'stat') + ' ' + dccRandomStat(); }
  if(/damage resistance/i.test(p)) { const m = p.match(/(\d+)/); return '+' + (m ? m[1] : '1') + ' DR'; }
  if(/^a buff/i.test(p)) { const b = dccRandomBuff(); return b ? ('Buff: ' + b.name) : 'a Buff'; }
  if(/passive skill/i.test(p)) { const sk = dccRandomSkillName(true) || 'a Skill'; return 'Passive ' + sk + ' (Rank = Floor)'; }
  if(/inherent spell/i.test(p)) { const sp = dccRandomSpell(); return 'Inherent Spell: ' + (sp ? sp.name : 'a Spell'); }
  if(/resistance to an uncommon/i.test(p)) { return 'Resist ' + dccPick(DCC_DMG_UNCOMMON) + ' damage'; }

window.dccEnchantItem = function(tierKey, category) {
  const CAT_TABLE = { armor: '40', accessory: '41', weapon: '39', mundane: '39' };
  let cats = category ? [category] : dccPick([['weapon'], ['armor'], ['accessory']]);
  let pool = dccBasePool(cats);
  if(!pool.length) pool = dccBasePool(['weapon', 'armor', 'accessory', 'mundane']);
  const baseItem = pool.length ? dccPick(pool) : null;
  const base = baseItem ? baseItem.name : 'Trinket';
  const cat = baseItem ? baseItem.category : 'weapon';
  const slot = baseItem ? (baseItem.slot || '') : '';
  const tableNum = CAT_TABLE[cat] || '39';
  const typeTable = dccLootTable(tableNum);
  const t = dccLootTier(tierKey);
  const nRolls = Math.max(1, (t && typeof t.gearRolls === 'number') ? t.gearRolls : 1);
  const perks = []; const seen = new Set();
  for(let i = 0; i < nRolls; i++) {
    const row = typeTable ? dccRollRow(typeTable) : null;
    let perk = dccEnchantPerk(row ? row.result : '+X Stat', tierKey);
    let tries = 0;
    while(seen.has(perk) && tries < 6) { const r2 = typeTable ? dccRollRow(typeTable) : null; perk = dccEnchantPerk(r2 ? r2.result : '+X Stat', tierKey); tries++; }
    seen.add(perk); perks.push(perk);

  }
  const name = 'Enchanted ' + base + ' ' + dccPick(DCC_ENCHANT_EPITHETS);
  const effect = perks.join(', ');   // description = perks only (tier lives on the item's tier field / card tag)
  return { base: base, name: name, category: cat, slot: slot, tier: tierKey, perks: perks, effect: effect };
};

  const near = dccNearestByLevel(level, 'Mob').slice(0, Math.max(6, n * 3));   // closest-in-level pool
  const group = [];
  for(let i = 0; i < n && near.length; i++) group.push(near[Math.floor(Math.random() * near.length)]);
  if(bossKey === 'elite') { const el = dccNearestByLevel(level, 'Elite')[0]; if(el) group.unshift(el); }
  else if(bossKey === 'boss') { const bs = dccNearestByLevel(level, 'Boss')[0]; if(bs) group.unshift(bs); }
  if(!group.length) return card('<div class="gen-empty">No DCC monsters available to build an encounter.</div>');
  const names = group.map(m => m.name);
  const rows = group.map(m =>
    '<div class="gen-card-row"><span class="gen-card-row-label">' + esc(m.role || 'Mob') + '</span>' +
    '<span><b>' + esc(m.name) + '</b> <span style="opacity:.6">LV ' + esc(m.level) + ' · ' + esc(dccMonTotalHp(m)) + ' HP</span> ' +
    '<button class="btn small ghost gen-send-tracker" data-src="dcc" data-mon="' + dccSendAttr(m.name) + '" style="margin-left:4px;">Send</button></span></div>'
  ).join('');
  return card(
    '<div class="gen-card-header"><span class="gen-card-name">Encounter · LV ' + esc(level) + '</span>' +
      '<span class="gen-card-tag">' + group.length + ' creature' + (group.length === 1 ? '' : 's') + '</span></div>' +
    '<div class="gen-card-actions"><button class="btn small primary gen-send-tracker-all" data-src="dcc" data-mons="' + dccSendAttr(names.join('|')) + '">Send all to Tracker</button></div>' +
    '<hr class="gen-card-divider">' + rows
  );
}

// ── DCC Neighborhood / Quest generator (Core Ch.7 prep loop) ───────────────
// A parbaked scenario: theme + hook, Mobs and a Boss pulled from the bestiary,
// environment/complication flavor, and (for Quests) a staged spine with a
// reward, a failure clause, and the floor-collapse clock.
function dccScenarioMobs(level, n) {
  const near = dccNearestByLevel(level, 'Mob').slice(0, Math.max(6, n * 3));
  const out = [], seen = {};
  for(let i = 0; i < near.length && out.length < n; i++) { const m = near[i]; if(seen[m.name]) continue; seen[m.name] = 1; out.push(m); }
  return out;
}
function dccScenarioBoss(level) {
  return dccNearestByLevel(level, 'Boss')[0] || dccNearestByLevel(level, 'Elite')[0] || null;
}
function dccMobLine(label, m) {
  return '<div class="gen-card-row"><span class="gen-card-row-label">' + label + '</span>' +
    '<span><b>' + esc(m.name) + '</b> <span style="opacity:.6">' + (label === 'Boss' ? esc(m.role) + ' · ' : '') + 'LV ' + esc(m.level) + ' · ' + esc(dccMonTotalHp(m)) + ' HP</span> ' +
    '<button class="btn small ghost gen-send-tracker" data-src="dcc" data-mon="' + dccSendAttr(m.name) + '" style="margin-left:4px;">Send</button></span></div>';
}
function genDccNeighborhood(kind, level) {
  if(!dccPrepReady()) return card('<div class="gen-empty">DCC prep tables didn’t load. Open the GM screen from the app.</div>');
  const P = DCC_PREP;
  const mobs = dccScenarioMobs(level, 3);
  const boss = dccScenarioBoss(level);
  const allNames = mobs.map(m => m.name).concat(boss ? [boss.name] : []);
  const sendAll = allNames.length
    ? '<div class="gen-card-actions"><button class="btn small primary gen-send-tracker-all" data-src="dcc" data-mons="' + dccSendAttr(allNames.join('|')) + '">Send all to Tracker</button></div>'
    : '';
  const roster = '<hr class="gen-card-divider">' + sendAll + mobs.map(m => dccMobLine('Mob', m)).join('') +
    (boss ? dccMobLine('Boss', boss) : '<div class="gen-card-row"><span class="gen-card-row-label">Boss</span><span style="opacity:.6">— pick one to suit the theme —</span></div>');
  if(kind === 'quest') {
    const stages = [].concat(P.questStages).sort(() => Math.random() - 0.5).slice(0, 4)
      .map((s, i) => '<div class="gen-card-row"><span class="gen-card-row-label">Stage ' + (i + 1) + '</span><span>' + esc(s) + '</span></div>').join('');
    return card(
      '<div class="gen-card-header"><span class="gen-card-name">Quest: ' + esc(R(P.questNames)) + '</span><span class="gen-card-tag">Floor ' + esc(level) + '</span></div>' +
      '<div class="gen-item-desc" style="text-transform:none;opacity:.85;">' + esc(R(P.questThemes)) + '</div>' +
      row('Objective', R(P.questObjectives)) + row('Power player', R(P.questPowerPlayers)) + row('Strong start', R(P.strongStarts)) +
      '<hr class="gen-card-divider">' + stages +
      '<hr class="gen-card-divider">' + row('Reward', R(P.questRewards)) + row('If they fail', R(P.questFailures)) + row('Clock', R(P.timers)) +
      roster
    );
  }
  return card(
    '<div class="gen-card-header"><span class="gen-card-name">Neighborhood: ' + esc(R(P.nbhdNames)) + '</span><span class="gen-card-tag">Floor ' + esc(level) + '</span></div>' +
    '<div class="gen-item-desc" style="text-transform:none;opacity:.85;">Theme: ' + esc(R(P.nbhdThemes)) + '</div>' +
    row('Vibe', R(P.nbhdVibes)) + row('Strong start', R(P.strongStarts)) + row('Environment', R(P.environments)) +
    row('Grinding snag', R(P.grindComplications)) + row('Mood beat', R(P.moods)) +
    roster
  );
}

  const isShop=t==='Shop';

// ── Encounter ────────────────────────────────────────────────────────────
function genEncounterItem(type) {
  // Events
  if(type==='happens')  return card(`<div class="gen-item-name">Something Happens!</div><div class="gen-item-desc">${esc(R(HAPPENS))}</div>`);
  if(type==='rumor')    return card(`<div class="gen-item-name">Rumor</div><div class="gen-item-desc">${esc(R(RUMORS))}</div>`);
  if(type==='secret')   return card(`<div class="gen-item-name">Secret</div><div class="gen-item-desc">${esc(R(SECRETS_D1))} ${esc(R(SECRETS_D2))}</div>`);
  if(type==='trap')     return genTrap('trap');

  return card(`<div class="gen-empty">Unknown type</div>`);
}

// Populate the Monster generator's type filter from the classification beside
// SD_MONSTERS, listing only types that actually have members so no choice can
// come back empty.
function fillMonsterTypeFilter(root) {
  const sel = (root || document).querySelector('#gen-mon-type');
  if(!sel || typeof SD_MONSTER_TYPE_LIST === 'undefined') return;
  const present = SD_MONSTER_TYPE_LIST.filter(t => allMonsters().some(m => monsterTypeOf(m.name) === t));
  const keep = sel.value;
  // Type names come from SD_MONSTER_TYPE_LIST (our own constant), but escape
  // anyway so a future entry with punctuation can't break the markup.
  const safe = (v) => String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  sel.innerHTML = '<option value="">Any Type</option>' +
    present.map(t => `<option value="${safe(t)}">${safe(t)}</option>`).join('');
  sel.value = keep || '';
}
// Populate the DCC NPC generator's Type filter from DCC_PREP.npcRoles.
function fillDccNpcRoleFilter(root) {
  const sel = (root || document).querySelector('#gen-dccnpc-role');
  if(!sel || typeof DCC_PREP === 'undefined' || !Array.isArray(DCC_PREP.npcRoles)) return;
  const keep = sel.value;
  const safe = (v) => String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  sel.innerHTML = '<option value="">Any Type</option>' +
    DCC_PREP.npcRoles.map(r => `<option value="${safe(r.role)}">${safe(r.role)}</option>`).join('');
  sel.value = keep || '';
}

// One rendering shared by the Monster generator and the adventure builder, so
// the two can't drift. Stat pairs go in a responsive grid (.gen-card-stats)
// rather than one long flex line, which is what used to run off the side of a
// quarter-width pane in Four-pane mode.
function monsterStat(label, val) {
  return `<div class="gen-card-stat"><span class="gen-card-stat-label">${esc(label)}</span><span>${esc(val)}</span></div>`;

function monsterCard(m, opts) {
  const type = (typeof monsterTypeOf === 'function') ? monsterTypeOf(m.name) : '';
  // NB: escAttr() belongs to init_trackers' scope, not this one — escape locally.
  const attr = (v) => String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  const send = opts && opts.send
    ? `<div class="gen-card-actions"><button class="btn small primary gen-send-tracker" data-mon="${attr(m.name)}">Send to Tracker</button></div>`

      `<span class="gen-card-tag">LV ${esc(m.lv)} · AL ${esc(m.al)}${type ? ' · ' + esc(type) : ''}</span></div>` +
    `<div class="gen-card-stats">${monsterStat('AC', m.ac)}${monsterStat('HP', m.hp)}${monsterStat('MV', m.mv)}</div>` +
    `<div class="gen-card-stats">${monsterStat('STR', m.s)}${monsterStat('DEX', m.d)}${monsterStat('CON', m.c)}` +
      `${monsterStat('INT', m.i)}${monsterStat('WIS', m.w)}${monsterStat('CHA', m.ch)}</div>` +
    `<div class="gen-card-row"><span class="gen-card-row-label">ATK</span><span>${esc(m.atk)}</span></div>` +

  );
}

// Every monster of a given creature type; empty type means the whole bestiary.
function monstersOfType(type) {
  if(!type) return allMonsters();
  return allMonsters().filter(m => monsterTypeOf(m.name) === type);
}

// ── Monster Generator ─────────────────────────────────────────────────────
function genMonster(pl, numMut) {
  pl = parseInt(pl)||1;
  const entry = MON_TABLE[Math.ceil(Math.random()*20)-1];
  const hd_adj = entry.combat==='PL'?0:entry.combat.includes('+')?(parseInt(entry.combat.replace('PL+',''))):(-parseInt(entry.combat.replace('PL-','')));
  const hd = Math.max(1, pl+hd_adj);
  const ac = pl+10;
  const hp = hd*4+hd;
  const atk = Math.min(hd, hd+1);
  const muts = [];
  for(let i=0;i<parseInt(numMut||0);i++) { muts.push(`${R(MON_MUT_1)} / ${R(MON_MUT_2)} / ${R(MON_MUT_3)}`); }
  return card(`
    <div class="gen-card-header"><span class="gen-card-name">${esc(entry.quality)} Creature</span><span class="gen-card-tag">HD ${hd} · PL ${pl}</span></div>
    ${row('AC',`${ac}`)} ${row('HP',`${hp} (${hd}d8)`)} ${row('ATK',`+${atk}, 1d${hd<=3?6:hd<=6?8:10} dmg`)}
    <hr class="gen-card-divider">
    ${row('Strength',entry.strength)} ${row('Weakness',entry.weakness)}
    ${muts.length?'<hr class="gen-card-divider">'+muts.map((m,i)=>`<div class="gen-card-row"><span class="gen-card-row-label">Mutation ${i+1}</span><span>${esc(m)}</span></div>`).join(''):''}
    <hr class="gen-card-divider">
    <div class="gen-card-row"><span class="gen-card-row-label">Treasure</span><span>Roll on Treasure ${hd<=3?'1-3':hd<=6?'4-6':hd<=9?'7-9':'10+'} table (50% chance if random encounter)</span></div>
  `);
}

// ── Trap / Hazard ─────────────────────────────────────────────────────────
function genTrap(type) {
  const t = type==='random' ? R(['trap','hazard']) : type;
  if(t==='trap') {
    const trap = TRAPS[Math.ceil(Math.random()*12)-1];
    return card(`<div class="gen-card-header"><span class="gen-card-name">${esc(trap.trap)}</span><span class="gen-card-tag">Trap</span></div>${row('Trigger',trap.trigger)}${row('Damage/Effect',trap.damage)}`);
  } else {
    const mov = R(HAZARDS_MOV); const dmg = R(HAZARDS_DMG); const wkn = R(HAZARDS_WKN);
    const types = []; if(Math.random()>.3) types.push(mov); if(Math.random()>.4) types.push(dmg); if(Math.random()>.5) types.push(wkn);
    if(!types.length) types.push(mov);
    return card(`<div class="gen-card-header"><span class="gen-card-name">Hazard</span><span class="gen-card-tag">${types.length>1?'Combined':'Single'}</span></div>${types.map((x,i)=>row(['Movement','Damage','Weakening'][i]||'Effect',x)).join('')}`);
  }
}

function roomLabel(num, roleKey) {
  const tax = typeof ROOM_TAXONOMY[roleKey] === 'function'
    ? ROOM_TAXONOMY[roleKey]()
    : (ROOM_TAXONOMY[roleKey] || ['Scenic','']);
  const [type, sub] = tax;
  const subStr = sub ? ` - ${sub}` : '';
  return `${num}. ${type}${subStr}`;
}

function genDungeon(level, motif, numRooms) {
  numRooms = parseInt(numRooms) || 5;
  const mot = motif === 'random' ? R(DUN_MOTIFS) : motif;

  const nameStyle = Math.random();
  let name;
  if(nameStyle < 0.4) name = `The ${R(DUN_NAMES_ADJ)} ${R(DUN_NAMES_NOUN)}`;
  else if(nameStyle < 0.7) name = `${R(DUN_NAMES_ADJ)} ${R(DUN_NAMES_NOUN)} of ${R(DUN_NAMES_OF)}`;
  else name = `The ${R(DUN_NAMES_NOUN)} of ${R(DUN_NAMES_OF)}`;

  const el = document.createElement('div');

  // Header card
  const hdr = document.createElement('div');
  hdr.className = 'gen-card';
  hdr.style.borderColor = 'var(--gold)';
  hdr.innerHTML = `<div class="gen-card-header">
    <span class="gen-card-name" style="font-family:'Cinzel',serif;font-size:15px;color:var(--gold)">${esc(name)}</span>
    <span class="gen-card-tag">Level ${esc(level)} · ${esc(mot)} · ${numRooms} rooms</span>
  </div>`;
  el.appendChild(hdr);

  if(numRooms === 5) {
    // Classic 5-room structure
    const rooms = [
      ['guardian', DUN_R1[mot]||DUN_R1.Abandoned],
      ['puzzle',   DUN_R2[mot]||DUN_R2.Abandoned],
      ['setback',  DUN_R3[mot]||DUN_R3.Abandoned],
      ['boss',     DUN_R4[mot]||DUN_R4.Abandoned],
      ['reward',   DUN_R5[mot]||DUN_R5.Abandoned],
    ];
    rooms.forEach(([roleKey, pool], i) => {
      const c = document.createElement('div'); c.className = 'gen-card';
      const label = roomLabel(i + 1, roleKey);
      c.innerHTML = `<div class="gen-card-name" style="font-weight:700;margin-bottom:5px">${esc(label)}</div>
        <div class="gen-item-desc">${esc(R(pool))}</div>`;
      el.appendChild(c);
    });
  } else {
    // Extended dungeon
    const roomCards = [];

    // Helper: get resolved [type, subtype] for a roleKey
    function getTax(roleKey) {
      const t = ROOM_TAXONOMY[roleKey];
      return typeof t === 'function' ? t() : (t || ['Scenic','']);
    }

    // Room 1: entrance/guardian (always Fight - Guardian)
    roomCards.push(['guardian', R(DUN_R1[mot]||DUN_R1.Abandoned)]);

    // Build mid pool: mandatory (puzzle + setback + optional sub-boss) + random extras
    const mandatory = [
      ['puzzle',  R(DUN_R2[mot]||DUN_R2.Abandoned)],
      ['setback', R(DUN_R3[mot]||DUN_R3.Abandoned)],
    ];
    if(numRooms >= 8) {
      const subDesc = R(DUN_ROOM_CONTENTS['Sub-Boss Lair']).replace(/\$\{mot\}/g, mot);
      mandatory.push(['Sub-Boss Lair', subDesc]);
    }
    const midCount = numRooms - 3; // entrance + boss + reward are fixed
    const extraTypes = [...DUN_ROOM_TYPES].sort(() => Math.random() - 0.5);
    const extras = [];
    let typeIdx = 0;
    for(let i = mandatory.length; i < midCount; i++) {
      const t = extraTypes[typeIdx++ % extraTypes.length];
      const pool = DUN_ROOM_CONTENTS[t] || DUN_ROOM_CONTENTS['Exploration Chamber'];
      const desc = R(pool).replace(/\$\{mot\}/g, mot);
      extras.push([t, desc]);
    }

    // Shuffle mid rooms
    let allMid = [...mandatory, ...extras].sort(() => Math.random() - 0.5);

    // Fix: no two consecutive rooms with same Type+Subtype
    // Simple pass: if a room matches its predecessor, swap it with the next different one
    for(let i = 1; i < allMid.length; i++) {
      const [ta, sa] = getTax(allMid[i-1][0]);
      const [tb, sb] = getTax(allMid[i][0]);
      if(ta === tb && sa === sb) {
        // Find the next room that differs and swap
        let swapped = false;
        for(let j = i+1; j < allMid.length; j++) {
          const [tc, sc] = getTax(allMid[j][0]);
          if(tc !== tb || sc !== sb) {
            [allMid[i], allMid[j]] = [allMid[j], allMid[i]];
            swapped = true; break;
          }
        }
        // If no swap found, just leave it (edge case with very few room types)
      }
    }

    allMid.forEach(r => roomCards.push(r));

    // Boss is always last combat room before reward (guaranteed single boss)
    roomCards.push(['boss',   R(DUN_R4[mot]||DUN_R4.Abandoned)]);
    // Reward is always last
    roomCards.push(['reward', R(DUN_R5[mot]||DUN_R5.Abandoned)]);

    // Final check: boss and reward can't be consecutive same type (they can't be — different types)
    // Render
    roomCards.forEach(([roleKey, desc], i) => {
      const c = document.createElement('div'); c.className = 'gen-card';
      const label = roomLabel(i + 1, roleKey);
      c.innerHTML = `<div class="gen-card-name" style="font-weight:700;margin-bottom:5px">${esc(label)}</div>
        <div class="gen-item-desc">${esc(desc)}</div>`;
      el.appendChild(c);
    });
  }

  return el;
}

    // Place nodes with tighter spacing in a cluster
    const nodes = [];
    const MIN_DIST = 90;   // minimum centre-to-centre distance
    const SPREAD = 280;    // how far from centre nodes can appear
    const cx = W/2, cy = H/2;

    // Entrance node near a random edge of the cluster
    const angle0 = rng() * Math.PI * 2;
    const ex = Math.round(cx + Math.cos(angle0) * (SPREAD * 0.7));
    const ey = Math.round(cy + Math.sin(angle0) * (SPREAD * 0.7));
    nodes.push({ x:ex, y:ey, r:ri(36,54), id:1, isEntrance:true });

    let attempts = 0;
    while(nodes.length < numRooms && attempts < numRooms*400) {
      attempts++;
      // Bias positions toward cluster centre
      const angle = rng() * Math.PI * 2;
      const dist  = rng() * SPREAD;
      const x = Math.round(cx + Math.cos(angle) * dist);
      const y = Math.round(cy + Math.sin(angle) * dist);
      const r = ri(24, 50);
      // Keep within canvas bounds
      if(x-r<10||x+r>W-10||y-r<10||y+r>H-10) continue;
      const tooClose = nodes.some(n => Math.hypot(n.x-x, n.y-y) < MIN_DIST);
      if(!tooClose) nodes.push({ x, y, r, id:nodes.length+1 });
    }

    // Build spanning tree connections
    const edges = [];
    const connected = new Set([0]);
    for(let i=1; i<nodes.length; i++) {
      const a = nodes[i];
      let best=0, bestD=Infinity;
      for(const ci of connected) {
        const b=nodes[ci], d=Math.hypot(a.x-b.x, a.y-b.y);
        if(d<bestD){bestD=d;best=ci;}
      }
      connected.add(i);
      edges.push([i, best]);
    }
    // Extra cross-connections between nearby nodes (~35% chance)
    for(let i=0; i<nodes.length; i++) {
      for(let j=i+2; j<nodes.length; j++) {
        const d=Math.hypot(nodes[i].x-nodes[j].x, nodes[i].y-nodes[j].y);
        if(d < MIN_DIST*2 && rng()<0.35) edges.push([i,j]);
      }
    }

    // ── Renumber nodes in BFS order from entrance so IDs follow a natural path ──
    // Build adjacency list from spanning tree edges only
    const adj = Array.from({length:nodes.length}, ()=>[]);
    for(const [ai,bi] of edges) {
      // Only use spanning tree edges (those where one endpoint was newly connected)
      adj[ai].push(bi);
      adj[bi].push(ai);
    }
    // BFS from node 0 (entrance)
    const visited = new Array(nodes.length).fill(false);
    const queue = [0];
    const bfsOrder = [];
    visited[0] = true;
    while(queue.length) {
      const cur = queue.shift();
      bfsOrder.push(cur);
      // Sort neighbours by distance to entrance for consistent left-to-right feel
      const neighbours = [...new Set(adj[cur])].filter(n=>!visited[n]);
      neighbours.sort((a,b) => {
        // Primary: clockwise angle from entrance
        const en = nodes[0];
        const angA = Math.atan2(nodes[a].y-en.y, nodes[a].x-en.x);
        const angB = Math.atan2(nodes[b].y-en.y, nodes[b].x-en.x);
        return angA - angB;
      });
      for(const n of neighbours) { visited[n]=true; queue.push(n); }
    }
    // Any nodes not reached (isolated, shouldn't happen) append at end
    for(let i=0;i<nodes.length;i++) if(!visited[i]) bfsOrder.push(i);
    // Apply sequential IDs in BFS order
    const newId = new Array(nodes.length);
    bfsOrder.forEach((origIdx, seq) => { newId[origIdx] = seq+1; });
    nodes.forEach((n,i) => { n.id = newId[i]; });

    // ── Center the cluster in the viewport ───────────────────────────────────
    if(nodes.length > 0) {
      const minX = Math.min(...nodes.map(n=>n.x-n.r));
      const maxX = Math.max(...nodes.map(n=>n.x+n.r));
      const minY = Math.min(...nodes.map(n=>n.y-n.r));
      const maxY = Math.max(...nodes.map(n=>n.y+n.r));
      const pad = 40;
      const offX = (W/2) - (minX+maxX)/2;
      const offY = (H/2) - (minY+maxY)/2;
      // Clamp so nothing goes out of bounds
      const clampX = Math.max(pad-minX-offX, Math.min(W-maxX-offX-pad, offX));
      const clampY = Math.max(pad-minY-offY, Math.min(H-maxY-offY-pad, offY));
      for(const n of nodes){ n.x+=clampX; n.y+=clampY; }
    }

    // Build SVG
    const parts = [];
    parts.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`);
    parts.push(`<rect width="${W}" height="${H}" fill="#12121a"/>`);

    // Connecting lines behind nodes
    for(const [ai,bi] of edges) {
      const a=nodes[ai], b=nodes[bi];
      parts.push(`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#4a4a6a" stroke-width="2.5" stroke-linecap="round"/>`);
    }

    // Nodes
    for(const node of nodes) {
      const fill   = node.isEntrance ? '#c8a84a' : '#2a2a4a';
      const stroke = node.isEntrance ? '#e8c86a' : '#6a6a9a';
      parts.push(`<circle cx="${node.x}" cy="${node.y}" r="${node.r}" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>`);
      parts.push(`<text x="${node.x}" y="${node.y+1}" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="monospace" font-weight="bold" font-size="${Math.max(10, node.r*0.55)}">${node.id}</text>`);
    }

    // Entrance dashed ring
    const en=nodes[0];
    parts.push(`<circle cx="${en.x}" cy="${en.y}" r="${en.r+10}" fill="none" stroke="#e8c86a" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7"/>`);

    // Legend
    const legY=H-18;
    parts.push(`<rect x="0" y="${legY-4}" width="${W}" height="22" fill="#12121a" opacity="0.9"/>`);
    parts.push(`<text x="8" y="${legY+10}" fill="white" font-family="monospace" font-size="11" opacity="0.9">Nodes · ${nodes.length} rooms</text>`);
    parts.push(`<text x="${W-8}" y="${legY+10}" text-anchor="end" fill="white" font-family="monospace" font-size="10" opacity="0.6">Dungeon Crawler's Companion</text>`);
    parts.push('</svg>');

    return { svg:parts.join(''), rooms:nodes.length, width:W, height:H };
  }

  // ── Standard grid-based styles below ────────────────────────────────────

  // ── Style palettes ────────────────────────────────────────────────────────
  const STYLES = {
    hud:       { wall:'#2a2a32', floor:'#c8c4b0', corridor:'#b0ac9a',
                 roomStroke:'#3a3a44', doorFill:'#1a1a22',
                 numBg:'rgba(26,26,34,0.75)', numFg:'#fff', title:'HUD' },
    parchment: { wall:'#888888', floor:'#EDE4D0', corridor:'#D5C9B0',
                 roomStroke:'#000000', doorFill:'#000000',
                 numBg:'rgba(0,0,0,0.82)', numFg:'#FFF6E9', title:'Dungeon' },
    cave:      { wall:'#1e2420', floor:'#8a9e82', corridor:'#7a8e72',
                 roomStroke:'#2a3a28', doorFill:'#0e1410',
                 numBg:'rgba(14,20,16,0.8)', numFg:'#d0e8d0', title:'Cave' },
  };
  const S = STYLES[style] || STYLES.parchment;

  // ── Room placement ────────────────────────────────────────────────────────
  const rooms = [];
  const rng = () => Math.random();
  const ri = (a,b) => Math.floor(rng()*(b-a+1))+a;

  function markRoom(r) {
    for(let row=r.y; row<r.y+r.h; row++)
      for(let col=r.x; col<r.x+r.w; col++)
        if(row>=0&&row<ROWS&&col>=0&&col<COLS) grid[row][col]=2;
  }
  function overlapsAny(r, pad) {
    for(const ex of rooms) {
      if(r.x-pad < ex.x+ex.w+pad && r.x+r.w+pad > ex.x-pad &&
         r.y-pad < ex.y+ex.h+pad && r.y+r.h+pad > ex.y-pad) return true;
    }
    return false;
  }

  // Entrance: random position on any of the 4 edges
  const eW = ri(3,5), eH = ri(3,4);
  const edge = ri(0,3); // 0=top, 1=right, 2=bottom, 3=left
  const eX = edge===1 ? COLS-eW-1 : edge===3 ? 1 : ri(1, COLS-eW-2);
  const eY = edge===2 ? ROWS-eH-1 : edge===0 ? 1 : ri(1, ROWS-eH-2);
  const entrance = { x:eX, y:eY, w:eW, h:eH, id:1, isEntrance:true, edge };
  rooms.push(entrance);
  markRoom(entrance);

  // Place remaining rooms — retry with shrinking sizes if needed
  let attempts = 0, maxAttempts = numRooms * 200;
  while(rooms.length < numRooms && attempts < maxAttempts) {
    attempts++;
    // Start with larger rooms, shrink to tiny if stuck
    const progress = attempts / maxAttempts;
    const maxW = Math.max(2, Math.floor(6 - progress*3));
    const maxH = Math.max(2, Math.floor(5 - progress*2));
    const w = ri(2, maxW), h = ri(2, maxH);
    const x = ri(1, COLS-w-2), y = ri(1, ROWS-h-2);
    const pad = progress < 0.5 ? 1 : 0;
    if(!overlapsAny({x,y,w,h}, pad)) {
      rooms.push({x,y,w,h,id:rooms.length+1});
      markRoom({x,y,w,h});
    }
  }

  // ── Corridor routing ──────────────────────────────────────────────────────
  function cx(r){ return Math.floor(r.x + r.w/2); }
  function cy(r){ return Math.floor(r.y + r.h/2); }
  function setCorr(row,col) {
    if(row>=0&&row<ROWS&&col>=0&&col<COLS&&grid[row][col]===0) grid[row][col]=1;
  }
  function carve(a, b) {
    let ax=cx(a), ay=cy(a), bx=cx(b), by=cy(b);
    if(rng()>0.5) {
      for(let x=Math.min(ax,bx);x<=Math.max(ax,bx);x++) setCorr(ay,x);
      for(let y=Math.min(ay,by);y<=Math.max(ay,by);y++) setCorr(y,bx);
    } else {
      for(let y=Math.min(ay,by);y<=Math.max(ay,by);y++) setCorr(y,ax);
      for(let x=Math.min(ax,bx);x<=Math.max(ax,bx);x++) setCorr(by,x);
    }
  }

  const connected = new Set([0]);
  const treeAdj = Array.from({length:rooms.length}, ()=>[]); // adjacency for BFS
  for(let i=1;i<rooms.length;i++) {
    const a = rooms[i];
    let best=0, bestD=Infinity;
    for(const ci of connected) {
      const b=rooms[ci], d=Math.abs(cx(a)-cx(b))+Math.abs(cy(a)-cy(b));
      if(d<bestD){bestD=d;best=ci;}
    }
    connected.add(i);
    treeAdj[i].push(best);
    treeAdj[best].push(i);
    carve(rooms[i], rooms[best]);
  }

  // ── Renumber rooms via BFS from entrance so IDs follow a natural path ────
  {
    const visited = new Array(rooms.length).fill(false);
    const queue = [0];
    const bfsOrder = [];
    visited[0] = true;
    while(queue.length) {
      const cur = queue.shift();
      bfsOrder.push(cur);
      // Sort neighbours by distance from entrance room centre for consistent flow
      const ecx = cx(rooms[0]), ecy = cy(rooms[0]);
      const neighbours = treeAdj[cur].filter(n=>!visited[n]);
      neighbours.sort((a,b)=>{
        // Sort by angle from entrance centre so numbering sweeps predictably
        const angA = Math.atan2(cy(rooms[a])-ecy, cx(rooms[a])-ecx);
        const angB = Math.atan2(cy(rooms[b])-ecy, cx(rooms[b])-ecx);
        return angA - angB;
      });
      for(const n of neighbours){ visited[n]=true; queue.push(n); }
    }
    // Any disconnected rooms appended last (shouldn't happen)
    for(let i=0;i<rooms.length;i++) if(!visited[i]) bfsOrder.push(i);
    // Apply sequential IDs in BFS order
    const newId = new Array(rooms.length);
    bfsOrder.forEach((origIdx, seq) => { newId[origIdx] = seq+1; });
    rooms.forEach((r,i) => { r.id = newId[i]; });
  }

  // ── Find door positions: corridor cells touching room boundary ────────────
  // A door is at the exact wall between a corridor cell and an adjacent room cell.
  const doorSegs = []; // [{x1,y1,x2,y2}] in pixel coords
  const doorPlaced = new Set();
  for(let r=0;r<ROWS;r++) {
    for(let c=0;c<COLS;c++) {
      if(grid[r][c]!==1) continue; // only corridor cells
      // Check all 4 neighbours for a room cell
      const neighbors = [[r-1,c],[r+1,c],[r,c-1],[r,c+1]];
      for(const [nr,nc] of neighbors) {
        if(nr<0||nr>=ROWS||nc<0||nc>=COLS) continue;
        if(grid[nr][nc]!==2) continue;
        // This corridor cell touches a room — place door at the shared wall
        const key = `${Math.min(r,nr)},${Math.min(c,nc)},${Math.max(r,nr)},${Math.max(c,nc)}`;
        if(doorPlaced.has(key)) continue;
        doorPlaced.add(key);
        // Only place door with ~70% chance per junction
        if(rng()<0.3) continue;
        // The shared wall is between (r,c) and (nr,nc)
        if(nr===r-1||nr===r+1) {
          // Vertical adjacency: shared wall is horizontal line between rows
          const wallY = Math.max(r,nr)*CELL; // top of the lower cell
          const wallX = c*CELL;
          // Door = thin horizontal bar across the corridor width
          doorSegs.push({x1:wallX+CELL*0.15, y1:wallY-3, x2:wallX+CELL*0.85, y2:wallY+3});
        } else {
          // Horizontal adjacency: shared wall is vertical line between cols
          const wallX = Math.max(c,nc)*CELL;
          const wallY = r*CELL;
          doorSegs.push({x1:wallX-3, y1:wallY+CELL*0.15, x2:wallX+3, y2:wallY+CELL*0.85});
        }
      }
    }
  }

  // ── Build SVG ────────────────────────────────────────────────────────────
  const W=COLS*CELL, H=ROWS*CELL;
  const parts=[];
  parts.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`);
  parts.push(`<rect width="${W}" height="${H}" fill="${S.wall}"/>`);

  // Draw floor cells
  for(let r=0;r<ROWS;r++) {
    for(let c=0;c<COLS;c++) {
      if(grid[r][c]===0) continue;
      const fill = grid[r][c]===1 ? S.corridor : S.floor;
      parts.push(`<rect x="${c*CELL}" y="${r*CELL}" width="${CELL}" height="${CELL}" fill="${fill}"/>`);
    }
  }

  // Room outlines
  for(const room of rooms) {
    const rx=room.x*CELL, ry=room.y*CELL, rw=room.w*CELL, rh=room.h*CELL;
    if(style==='cave') {
      parts.push(`<rect x="${rx+2}" y="${ry+2}" width="${rw-4}" height="${rh-4}" fill="none" stroke="${S.roomStroke}" stroke-width="2" rx="10"/>`);
    } else {
      // HUD and Dungeon/Parchment: solid rectangle outline
      parts.push(`<rect x="${rx}" y="${ry}" width="${rw}" height="${rh}" fill="none" stroke="${S.roomStroke}" stroke-width="2"/>`);
    }
  }

  // Draw doors — thin filled rectangles straddling the wall line
  for(const d of doorSegs) {
    parts.push(`<rect x="${Math.min(d.x1,d.x2)}" y="${Math.min(d.y1,d.y2)}" width="${Math.abs(d.x2-d.x1)}" height="${Math.abs(d.y2-d.y1)}" fill="${S.doorFill}" rx="1"/>`);
  }

  // Room numbers
  for(const room of rooms) {
    const rx=room.x*CELL, ry=room.y*CELL, rw=room.w*CELL, rh=room.h*CELL;
    const numX=rx+rw/2, numY=ry+rh/2;
    const circR=Math.max(10, Math.min(rw,rh)*0.2);
    parts.push(`<circle cx="${numX}" cy="${numY}" r="${circR}" fill="${S.numBg}"/>`);
    parts.push(`<text x="${numX}" y="${numY+1}" text-anchor="middle" dominant-baseline="middle" fill="${S.numFg}" font-family="monospace" font-weight="bold" font-size="${Math.max(9,circR*1.1)}">${room.id}</text>`);
  }

  // Entrance door — thin bar on the exterior wall of room 1 (edge depends on placement)
  (function() {
    const e = rooms[0];
    const ex=e.x*CELL, ey=e.y*CELL, ew=e.w*CELL, eh=e.h*CELL;
    const ed = e.edge||0;
    if(ed===0) // top
      parts.push(`<rect x="${ex+ew/2-CELL*0.35}" y="${ey-4}" width="${CELL*0.7}" height="8" fill="${S.doorFill}" rx="1"/>`);
    else if(ed===1) // right
      parts.push(`<rect x="${ex+ew-4}" y="${ey+eh/2-CELL*0.35}" width="8" height="${CELL*0.7}" fill="${S.doorFill}" rx="1"/>`);
    else if(ed===2) // bottom
      parts.push(`<rect x="${ex+ew/2-CELL*0.35}" y="${ey+eh-4}" width="${CELL*0.7}" height="8" fill="${S.doorFill}" rx="1"/>`);
    else // left
      parts.push(`<rect x="${ex-4}" y="${ey+eh/2-CELL*0.35}" width="8" height="${CELL*0.7}" fill="${S.doorFill}" rx="1"/>`);
  })();

  // Legend bar
  const legY=H-18;
  parts.push(`<rect x="0" y="${legY-4}" width="${W}" height="22" fill="${S.wall}" opacity="0.9"/>`);
  parts.push(`<text x="8" y="${legY+10}" fill="white" font-family="monospace" font-size="11" opacity="0.9">${S.title} · ${rooms.length} rooms</text>`);
  parts.push(`<text x="${W-8}" y="${legY+10}" text-anchor="end" fill="white" font-family="monospace" font-size="10" opacity="0.6">Dungeon Crawler's Companion</text>`);

  parts.push('</svg>');
  return { svg:parts.join(''), rooms:rooms.length, width:W, height:H };
}

// Redraw anything listing monsters after the homebrew pool changes.
function refreshMonsterConsumers() {
  document.querySelectorAll('.gen-tool, [data-tool="gen"]').forEach(node => {
    if(typeof fillMonsterTypeFilter === 'function') fillMonsterTypeFilter(node);
  });
  document.querySelectorAll('.mon-pick').forEach(box => {
    const ev = new Event('input', { bubbles: true });
    const search = box.querySelector('.mon-pick-search');
    if(search) search.dispatchEvent(ev);   // re-runs the picker's own filter
  });
}

window._refreshMonsterConsumers = refreshMonsterConsumers;

window.init_gen = function(root) {
  const tabSelect = root.querySelector('.gen-tab-select');
  const panels = root.querySelectorAll('.gen-panel');
  fillMonsterTypeFilter(root);   // panel markup only exists once mounted
  fillDccNpcRoleFilter(root);    // DCC NPC generator's Type filter

  // Make each panel's option controls (.gen-controls) collapsible so they don't
  // take up vertical space once they're set — the results area then gets the
  // room. A compact bar with a chevron sits above each control group; clicking
  // it toggles just that panel's options. Each panel keeps its own state.
  root.querySelectorAll('.gen-controls').forEach(controls => {
    if(controls.dataset.collapsibleWired) return;
    controls.dataset.collapsibleWired = '1';
    const bar = document.createElement('button');
    bar.type = 'button';
    bar.className = 'gen-opts-toggle';
    bar.setAttribute('aria-expanded', 'true');
    bar.innerHTML = '<span class="gen-opts-chevron">&#9662;</span><span class="gen-opts-label">Options</span>';
    controls.parentNode.insertBefore(bar, controls);
    bar.addEventListener('click', () => {
      const collapsed = controls.classList.toggle('collapsed');
      bar.classList.toggle('collapsed', collapsed);
      bar.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      bar.querySelector('.gen-opts-chevron').innerHTML = collapsed ? '&#9656;' : '&#9662;';
    });
  });

  // "Send to Tracker" on a generated monster card. Delegated because results are
  // re-rendered on every roll. The tracker tool is created on demand, so this
  // works even if no pane is showing it yet.
  // Resolve a generated card's monster by name from the right bestiary: the DCC
  // pool when the button is tagged data-src="dcc", else the SD bestiary.
  function resolveGenMon(name, src) {
    if(src === 'dcc') return dccGenBestiary().find(x => x.name === name) || null;
    if(src === 'ace' || src === 'nim' || src === 'sw' || src === 'dnd' || src === 'd62e' || src === 'icrpg' || src === 'mmrpg') return xsBestiary(src).find(x => x.name === name) || null;
    return (typeof allMonsters === 'function') ? (allMonsters().find(x => x.name === name) || null) : null;
  }
  root.addEventListener('click', (e) => {
    // "Send all to Tracker" on a DCC encounter \u2014 send every listed creature.
    const all = e.target.closest('.gen-send-tracker-all');
    if(all && root.contains(all)) {
      const names = String(all.dataset.mons || '').split('|').filter(Boolean);
      let sent = 0;
      names.forEach(nm => {
        const m = resolveGenMon(nm, all.dataset.src);
        if(m && typeof window.sendMonsterToTracker === 'function' && window.sendMonsterToTracker(m, all.dataset.src)) sent++;
      });
      const label = all.textContent;
      all.textContent = sent ? ('Sent ' + sent + ' \u2713') : 'Could not send';
      all.disabled = true;
      setTimeout(() => { all.textContent = label; all.disabled = false; }, 1400);
      return;
    }
    const btn = e.target.closest('.gen-send-tracker');
    if(!btn || !root.contains(btn)) return;
    const m = resolveGenMon(btn.dataset.mon, btn.dataset.src);
    const ok = m && typeof window.sendMonsterToTracker === 'function'
      ? window.sendMonsterToTracker(m, btn.dataset.src) : false;
    // Confirm in place: the tracker may be in another pane (or not open yet),
    // so a silent success would look like nothing happened. Restore the button's
    // own original label (cards say "Send to Tracker", encounter rows say "Send").
    const label = btn.textContent;
    btn.textContent = ok ? 'Sent \u2713' : 'Could not send';
    btn.disabled = true;
    setTimeout(() => { btn.textContent = label; btn.disabled = false; }, 1400);
  });
  const rollBtn = root.querySelector('.gen-roll');
  let activeTab = 'adventure';

  // The loot-box / found-loot builders are self-contained (own Roll / Send buttons),
  // so the toolbar "Generate" button is hidden while one of them is active.
  const BUILDER_PANELS = ['dccloot', 'sdfoundloot', 'acetreasure', 'nimtreasure', 'swtreasure', 'dndtreasure', 'd62etreasure', 'icrpgtreasure', 'yzetables', 'mmrpgtables', 'mmrpgtreasure', 'mmrpghenchmen'];
  // Populate the MMRPG Random-Encounter table picker from MMRPG_GM_TABLES.
  (function(){
    const sel = root.querySelector('#gen-mmrpg-enc');
    const T = (typeof MMRPG_GM_TABLES !== 'undefined') ? MMRPG_GM_TABLES : (window.MMRPG_GM_TABLES || null);
    if(sel && T && !sel.options.length) {
      sel.innerHTML = (T.encounters || []).map((t, i) =>
        '<option value="' + i + '">' + esc(t.title + ' — ' + String(t.source).replace(' Expansion','')) + '</option>').join('');
    }
  })();
  // Type facets for the ACE / Nimble / SW / D&D monster generators come from the data.
  [['ace','#gen-acemon-type'],['nim','#gen-nimmon-family'],['sw','#gen-swmon-group'],['dnd','#gen-dndmon-group'],['d62e','#gen-d62emon-kind'],['icrpg','#gen-icrpgmon-tier'],['mmrpg','#gen-mmrpgmon-kind']].forEach(([src, id]) => {

    });
  })();

  root._getState = () => ({});

};
