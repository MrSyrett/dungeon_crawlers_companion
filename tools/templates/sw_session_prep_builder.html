    /* Bump preview area up so it's not hidden behind the footer bar */
    .preview-area { padding-bottom: 0 !important; margin-top: 82px !important; }
    body { padding-bottom: 0; }
}

    /* Sidebar tab — desktop: vertical pull-tab on right edge; mobile: fixed top bar */
    .sidebar-tab { display: none; }

    /* ── DESKTOP ── */
    @media (min-width: 769px) {
      .sidebar { position: relative; overflow: visible; }
      /* body has overflow:hidden so we can't go right:-28px outside the sidebar.
         Instead pin the tab to a fixed position just after the sidebar's right edge. */
      .sidebar-tab {
        display: flex !important;
        position: fixed;
        left: 320px; /* matches sidebar width */
        top: 50%;
        transform: translateY(-50%);
        z-index: 50;
        width: 28px;
        height: 72px;
        border-radius: 0 6px 6px 0;
        background: var(--ui-accent, #b82018);
        color: white;
        border: none;
        cursor: pointer;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow: 2px 0 8px rgba(0,0,0,0.3);

        font-family: 'Barlow Condensed', sans-serif;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 8px 0;
        transition: left 0.25s;
      }
      /* When sidebar is collapsed (width: 42px), shift tab left */
      .sidebar.collapsed ~ * .sidebar-tab,
      .sidebar.collapsed .sidebar-tab {
        left: 42px;
      }
      .sidebar-tab-arrow {
        writing-mode: horizontal-tb;
        transition: transform 0.25s ease;
        font-size: 12px;
        margin: 0;
      }
      /* Hide the old internal collapse button on desktop */
      #collapse-btn { display: none; }
    }

    /* ── MOBILE ── */
    @media (max-width: 768px) {
      .sidebar-tab {
        display: flex;
        position: fixed;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        z-index: 201;
        background: var(--ui-accent, #b82018);

        border: none;
        border-radius: 0 0 8px 8px;

        height: 30px;
        align-items: center;

        font-family: 'Barlow Condensed', sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        writing-mode: horizontal-tb;
      }
      .sidebar-tab-arrow {
        display: inline-block;
        margin-right: 5px;
        transition: transform 0.25s ease;
      }
      /* Arrow text set directly via JS (▲ open, ▼ collapsed) */
      body.sidebar-collapsed .sidebar-footer { display: none !important; }
      /* Hide old internal collapse button */
      #collapse-btn { display: none !important; }
    }

/* ── FLOW MODE ─────────────────────────────────────────────────────────────
   A screen-first, single-column rendering of the same content. It's toggled on
   the body element by a small script (below the markup) whenever the viewport is narrow
   (editing on a phone) or the page is embedded read-only (?view=preview, e.g.
   the GM Screen's Adventure pane). It unwinds every fixed-page and two-column
   rule so the content reflows to the available width and scrolls naturally. The
   PDF/HTML export path is untouched: it re-inlines its own fixed 816x1056 CSS
   and always renders the paginated pages, so print output is identical
   regardless of what mode the preview is in. */
body.flow-mode .preview-area {
  align-items: stretch;
  padding: 0;
  gap: 0;
  background: var(--paper);
}
body.flow-mode .page {
  width: 100% !important;
  min-width: 0 !important;
  height: auto !important;
  min-height: 0 !important;
  max-height: none !important;
  overflow: visible !important;
  transform: none !important;
  margin: 0 0 0 0 !important;
  box-shadow: none !important;
}
body.flow-mode .page-cont { display: none !important; }
body.flow-mode .page-inner {
  height: auto !important;
  min-height: 0 !important;
  overflow: visible !important;
  padding: 16px 18px 20px !important;
}
body.flow-mode #p1-columns { display: block !important; overflow: visible !important; }
body.flow-mode #p1-left,
body.flow-mode #p1-right {
  overflow: visible !important;
  min-width: 0 !important;
  width: 100% !important;
}
body.flow-mode #p-locations {
  column-count: 1 !important;
  height: auto !important;
  min-height: 0 !important;
  overflow: visible !important;
}
body.flow-mode .sb-notes { column-count: 1 !important; }
body.flow-mode [data-paginated-hidden] { display: revert !important; }
body.flow-mode .page + .page {
  border-top: 3px solid var(--accent);
}
  /* Bestiary mob picker (NPCs/Mobs tab) */

<script>


const DEFAULT_STATE = {
  darkMode:false,
  title:'', subtitle:'', floor:'', session:'', players:'', duration:'',
  overview:'', mappath:'', maps:[],
  clues:[], rewards:[], hooks:[], notes:'', strongopen:[], locations:[], statblocks:[]
};
let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
let saveTimer = null;

function loadState() {
  var saved = null;
  if (window.__ddState !== undefined) {
    // Deck mode: only use server state; a new document starts empty
    saved = window.__ddState['sw_session'] || null;
  } else {
    // Standalone mode: use localStorage
    saved = localStorage.getItem('sw_builder_v1');
  }
  if (saved) try { state = {...DEFAULT_STATE,...JSON.parse(saved)}; } catch(e){}
  // Drop placeholder sources left behind by older stripped saves
  if (state.mappath === '__has_map__') state.mappath = '';
  state.maps = (state.maps||[]).filter(m => m && m.src && m.src !== '__has_map__');
}
let _lastSavedFull = null;
function saveState() {
  // Server gets the real state, images and all, so maps survive a reload.
  // localStorage only gets a stripped copy — base64 maps blow its ~5MB quota.
  const full = JSON.stringify(state);
  // Unchanged since the last save (common for the visibilitychange / link-click
  // exit saves) — skip the second stringify, the localStorage write and the
  // network PATCH entirely.
  if (full === _lastSavedFull) return;
  _lastSavedFull = full;
  const stripped = JSON.stringify({...state, mappath:state.mappath?'__has_map__':'', maps:(state.maps||[]).map(m=>({...m,src:m.src?'__has_map__':''}))});
  try { localStorage.setItem('sw_builder_v1', stripped); } catch(e) {}
  if (window.__ddSave) window.__ddSave({ 'sw_session': full });
  syncDocTitle();
  const ind = document.getElementById('save-indicator');
  ind.textContent='Saved ✓'; ind.classList.add('saved');
  setTimeout(()=>{ ind.textContent='All changes saved'; ind.classList.remove('saved'); },1500);
}

// Rename the document on the desk to match the Adventure Title, so the card on
// the main page is titled correctly when you head back there.
function syncDocTitle() {
  const t = (document.getElementById('f-title')?.value || state.title || '').trim();
  if (t && window.__ddSaveTitle) window.__ddSaveTitle(t);
}

// ── SAVE ON EXIT / BACKGROUND ──
function saveOnExit() {
  try { readFields(); saveState(); } catch(e) {}
}
window.addEventListener('beforeunload', saveOnExit);
window.addEventListener('pagehide', saveOnExit);
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'hidden') saveOnExit();
});
// Leaving via the "← Home" link (or any link out) saves first
document.addEventListener('click', function(e) {
  const a = e.target.closest && e.target.closest('a[href]');
  if (a && !a.target && !a.href.startsWith('javascript:')) saveOnExit();
}, true);
// Debounced: while typing, the full preview rebuild (readFields + renderPreview
// + pagination) runs once ~150ms after the last change instead of on every
// keystroke. renderNow() flushes a pending rebuild for anything that needs the
// preview current immediately (e.g. the PDF export).
let renderTimer = null;
function renderNow() { clearTimeout(renderTimer); renderTimer = null; readFields(); renderPreview(); }
function autosave() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(renderNow, 150);
  clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 600);
}

// ── PAGINATION ENGINE ──
// ── FLOW MODE CONTROLLER ────────────────────────────────────────────────────
// Flow mode = the single-column, screen-width rendering (see the CSS block).
// It's on when the viewport is narrow (editing on a phone) OR the page is served
// read-only for embedding (?view=preview injects <style id="dd-preview-style">,
// which is our signal — the GM Screen's Adventure pane loads it at a fixed 900px
// logical width, so a viewport media query alone wouldn't catch it).
// Flow mode can be driven three ways, in priority order:
//   1. An explicit instruction from an embedding parent (the GM Screen's
//      Adventure pane) via postMessage — it knows the real pane width and picks
//      single vs two-column per view. `_flowOverride` holds true/false/null.
//   2. Direct phone-width editing (the builder open on its own on a narrow
//      screen) — matchMedia.
// When embedded read-only (?view=preview) but before any parent instruction
// arrives, default to the two-column fixed layout (null override, wide-enough
// assumption) so a single/split/focus pane isn't briefly single-column.
let _flowOverride = null;
function _flowWanted() {
  if (_flowOverride !== null) return _flowOverride;                 // parent decides
  if (document.getElementById('dd-preview-style')) return false;   // embedded: wait for parent, assume wide
  return window.matchMedia('(max-width: 820px)').matches;          // phone-width editing
}
function applyFlowMode() {
  const on = _flowWanted();
  document.body.classList.toggle('flow-mode', on);
  return on;
}
window.addEventListener('resize', () => {
  const was = document.body.classList.contains('flow-mode');
  const now = applyFlowMode();
  if (was !== now && typeof renderPreview === 'function') renderPreview();
});
// Embedding parent (GM Screen) tells us which column layout its pane wants.
window.addEventListener('message', (e) => {
  const d = e && e.data;
  if (!d || d.type !== 'dd-flow') return;
  const want = !!d.flow;
  if (_flowOverride === want) return;
  _flowOverride = want;
  const was = document.body.classList.contains('flow-mode');
  const now = applyFlowMode();
  if (was !== now && typeof renderPreview === 'function') renderPreview();
});

function paginatePages() {
  // Always clear prior pagination artefacts first so switching modes is clean.
  document.querySelectorAll('.page-cont').forEach(p=>p.remove());
  document.querySelectorAll('[data-paginated-hidden]').forEach(el=>{
    el.style.display=''; el.removeAttribute('data-paginated-hidden');
  });

  // In flow mode the content is presented as one fluid, unclipped column, so the
  // fixed-page pagination is skipped entirely. Export/PDF force fixed mode first
  // (see exportHTML/savePDF), so print output is unaffected.
  if (document.body.classList.contains('flow-mode')) return;

  const isDark = document.getElementById('page-one').classList.contains('dark-mode');
  const PAGE_TOTAL = 1056;
  const BANNER_H   = document.querySelector('.page-banner')?.offsetHeight || 52;
  const BAND_H     = 12;
  const PADDING_V  = 40;
  const FOOTER_H   = document.querySelector('.p-footer')?.offsetHeight || 44;
  const USABLE_H   = PAGE_TOTAL - BANNER_H - BAND_H - PADDING_V - 20;
  const COL_H      = USABLE_H - FOOTER_H;

  // PAGE 1: two explicit divs — re-distribute if right column overflows
  const leftEl  = document.getElementById('p1-left');
  const rightEl = document.getElementById('p1-right');
  if(leftEl && rightEl) {
    // Check if right column overflows
    const rightItems = [...rightEl.children].filter(c=>c.offsetHeight>0);
    if(rightItems.length) {
      let rightH = rightItems.reduce((s,c)=>s+c.offsetHeight+getMargin(c),0);
      if(rightH > COL_H) {
        // Find what fits in right column and move rest to continuation page
        const buckets = [[]];
        let cur=0;
        rightItems.forEach(k=>{
          const h=k.offsetHeight+getMargin(k);
          if(cur+h>COL_H && buckets[buckets.length-1].length>0){buckets.push([]);cur=0;}
          buckets[buckets.length-1].push(k); cur+=h;
        });
        if(buckets.length>1){
          const keep=new Set(buckets[0]);
          rightItems.forEach(k=>{if(!keep.has(k)){k.style.display='none';k.setAttribute('data-paginated-hidden','1');}});
          let after=document.getElementById('page-one');
          // Each bucket is one column's worth, so a continuation page takes TWO
          // buckets: the first fills its left column, the second its right.
          for(let i=1;i<buckets.length;i+=2){
            const cp=buildContinuationPage(document.getElementById('page-one'),'p1'+i,isDark,false);
            const cc=cp.querySelector('.cont-container');
            cc.style.cssText='display:flex;gap:14px;flex:1;min-height:0;overflow:hidden;';
            const cLeft=document.createElement('div'); cLeft.style.cssText='flex:1;min-width:0;overflow:hidden;';
            const cRight=document.createElement('div'); cRight.style.cssText='flex:1;min-width:0;overflow:hidden;';
            cc.appendChild(cLeft); cc.appendChild(cRight);
            const fill=(bucket,col)=>{ (bucket||[]).forEach(k=>{const cl=k.cloneNode(true);cl.style.display='';cl.removeAttribute('data-paginated-hidden');col.appendChild(cl);}); };
            fill(buckets[i], cLeft);
            fill(buckets[i+1], cRight);
            const fc=document.createElement('div');fc.className='p-footer';fc.style.flexShrink='0';
            fc.innerHTML='<div class="flowchart">'+(document.getElementById('p-flowchart')?.innerHTML||'')+'</div>';
            cp.querySelector('.page-inner').appendChild(fc);
            after.insertAdjacentElement('afterend',cp); after=cp;
          }
        }
      }
    }
  }

  // PAGE 2: Encounters (working - keep as-is)
  const locsEl=document.getElementById('p-locations');
  if(locsEl) runPagination(locsEl,COL_H*2,'p2',isDark,null,document.getElementById('page-two'),false);

  // PAGE 4: Stat blocks
  // Stat blocks render inline on the main pages; page-four pagination no longer needed

  // PAGE 3: Maps
  const mapsEl=document.getElementById('p-maps-container');
  if(mapsEl) runPagination(mapsEl,USABLE_H,'p3M',isDark,null,document.getElementById('page-three'),false);
}


function measureAndPaginateColumn(containerId, maxH, key, isDark, preview, sourcePage) {
  const container = document.getElementById(containerId);
  if(!container) return;

  const isTwoCol = (key === 'p1' || key === 'p2');
  const maxTotal = isTwoCol ? maxH * 2 : maxH;

  // Get children to measure
  const kids = [...container.children].filter(c => !c.getAttribute('data-paginated-hidden'));
  if(!kids.length) return;

  // Measure each child by temporarily making it position:absolute off-screen
  // inside the actual page so it inherits all CSS correctly
  const pageInner = sourcePage.querySelector('.page-inner');
  if(!pageInner) return;

  // Create a single-column measuring wrapper inside page-inner
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:absolute;visibility:hidden;top:-99999px;left:36px;right:36px;column-count:1;';
  pageInner.appendChild(wrap);
  kids.forEach(k => wrap.appendChild(k.cloneNode(true)));
  void wrap.offsetHeight;

  const heights = [...wrap.children].map(c => {
    const s = getComputedStyle(c);
    return c.offsetHeight + parseFloat(s.marginTop) + parseFloat(s.marginBottom);
  });
  const totalH = heights.reduce((a,b) => a+b, 0);
  pageInner.removeChild(wrap);

  if(totalH <= maxTotal) return;

  // Split into buckets
  const buckets = [[]];
  let cur = 0;
  kids.forEach((kid, i) => {
    const h = heights[i];
    if(cur + h > maxTotal && buckets[buckets.length-1].length > 0) {
      buckets.push([]);
      cur = 0;
    }
    buckets[buckets.length-1].push(kid);
    cur += h;
  });
  if(buckets.length <= 1) return;

  // Hide overflow from original
  const keep = new Set(buckets[0]);
  kids.forEach(k => {
    if(!keep.has(k)) { k.style.display='none'; k.setAttribute('data-paginated-hidden','1'); }
  });

  // Build continuation pages
  let after = sourcePage;
  for(let i=1; i<buckets.length; i++) {
    const cp = buildContinuationPage(sourcePage, key+i, isDark, false);
    const cc = cp.querySelector('.cont-container');
    if(isTwoCol) {
      cc.style.cssText = 'column-count:2;column-gap:14px;column-fill:auto;flex:1;min-height:0;height:'+maxH+'px;overflow:hidden;';
    } else {
      cc.style.cssText = 'flex:1;min-height:0;overflow:hidden;';
    }
    buckets[i].forEach(k => {
      const cl = k.cloneNode(true);
      cl.style.display = '';
      cl.removeAttribute('data-paginated-hidden');
      cc.appendChild(cl);
    });
    if(key==='p1'||key==='p2') {
      const fcId = key==='p1'?'p-flowchart':'p-flowchart-2';
      const fc = document.createElement('div');
      fc.className='p-footer'; fc.style.flexShrink='0';
      fc.innerHTML='<div class="flowchart">'+(document.getElementById(fcId)?.innerHTML||'')+'</div>';
      cp.querySelector('.page-inner').appendChild(fc);
    }
    cp.querySelectorAll('.sb-hp-row').forEach(row=>{
      const pips=row.querySelectorAll('.hp-pip');const tot=pips.length;
      pips.forEach((pip,i)=>{
        const t=tot===1?1:i/(tot-1);let r,g,b=10;
        if(t<0.33){const s=t/0.33;r=170;g=Math.round(50*s);}
        else if(t<0.66){const s=(t-0.33)/0.33;r=170;g=Math.round(50+100*s);}
        else{const s=(t-0.66)/0.34;r=Math.round(170*(1-s));g=160;}
        pip.style.background=`rgb(${r},${g},${b})`;pip.style.borderColor='rgba(0,0,0,0.3)';
      });
    });
    after.insertAdjacentElement('afterend', cp);
    after = cp;
  }
}


// For CSS column containers: measure with column:1 unconstrained, then paginate.
// Called AFTER caller has already reset height/overflow/columnCount to unconstrained state.
function runColumnPagination(container, maxColH, key, isDark, preview, sourcePage) {
  if(!container) return;
  const children = [...container.children].filter(c=>c.offsetHeight>0);
  if(!children.length) return;

  // Total height with single column (already set by caller)
  const totalH = children.reduce((sum,c)=>sum+c.offsetHeight+getMargin(c),0);
  const maxTotal = maxColH * 2;
  if(totalH <= maxTotal) return;

  // Split into page buckets: each bucket fills up to 2 columns (maxColH * 2)
  const buckets = [[]];
  let currentH = 0;
  for(const child of children) {
    const h = child.offsetHeight + getMargin(child);
    if(currentH + h > maxTotal && buckets[buckets.length-1].length > 0) {
      buckets.push([]);
      currentH = 0;
    }
    buckets[buckets.length-1].push(child);
    currentH += h;
  }
  if(buckets.length <= 1) return;

  // Hide overflow items from original container
  const keepSet = new Set(buckets[0]);
  children.forEach(c => {
    if(!keepSet.has(c)){
      c.style.display='none';
      c.setAttribute('data-paginated-hidden','1');
    }
  });

  // Build continuation pages for overflow buckets
  let insertAfter = sourcePage;
  for(let i=1; i<buckets.length; i++) {
    const contPage = buildContinuationPage(sourcePage, key+i, isDark, false);
    const contContainer = contPage.querySelector('.cont-container');
    contContainer.style.columnCount = '2';
    contContainer.style.columnGap = '14px';
    contContainer.style.columnFill = 'auto';
    contContainer.style.flex = '1';
    contContainer.style.minHeight = '0';
    contContainer.style.height = maxColH + 'px';
    contContainer.style.overflow = 'hidden';

    buckets[i].forEach(item=>{
      const clone = item.cloneNode(true);
      clone.style.display='';
      clone.removeAttribute('data-paginated-hidden');
      contContainer.appendChild(clone);
    });

    // Add flowchart footer to overview (p1) and encounter (p2) continuation pages
    if(key==='p1' || key==='p2') {
      const fcSourceId = key==='p1' ? 'p-flowchart' : 'p-flowchart-2';
      const fc = document.createElement('div');
      fc.className = 'p-footer';
      fc.style.flexShrink = '0';
      fc.innerHTML = '<div class="flowchart">'+(document.getElementById(fcSourceId)?.innerHTML||'')+'</div>';
      contPage.querySelector('.page-inner').appendChild(fc);
    }

    insertAfter.insertAdjacentElement('afterend', contPage);
    insertAfter = contPage;
  }
}

function runPagination(container, maxH, key, isDark, preview, sourcePage, isPage2) {
  if(!container) return;
  const children = [...container.children].filter(c=>c.offsetHeight > 0);
  if(!children.length) return;

  // Measure total height of all visible children
  const totalH = children.reduce((sum, c) => sum + c.offsetHeight + getMargin(c), 0);
  if(totalH <= maxH) return; // No overflow, nothing to do

  // Split children into page buckets
  const buckets = [[]];
  let currentH = 0;

  for(const child of children) {
    const h = child.offsetHeight + getMargin(child);
    if(currentH + h > maxH && buckets[buckets.length-1].length > 0) {
      buckets.push([]);
      currentH = 0;
    }
    buckets[buckets.length-1].push(child);
    currentH += h;
  }

  if(buckets.length <= 1) return;

  // Hide overflow items from original container
  const keepItems = new Set(buckets[0]);
  children.forEach(c => {
    if(!keepItems.has(c)) {
      c.style.display = 'none';
      c.setAttribute('data-paginated-hidden', '1');
    }
  });

  // Build a continuation page for each overflow bucket
  let insertAfter = sourcePage;
  for(let i = 1; i < buckets.length; i++) {
    const contPage = buildContinuationPage(sourcePage, key+i, isDark, isPage2);
    const contContainer = contPage.querySelector('.cont-container');

    buckets[i].forEach(item => {
      const clone = item.cloneNode(true);
      clone.style.display = '';
      clone.removeAttribute('data-paginated-hidden');
      contContainer.appendChild(clone);
    });

    insertAfter.insertAdjacentElement('afterend', contPage);
    insertAfter = contPage;

    // Re-apply HP gradients
    contPage.querySelectorAll('.sb-hp-row').forEach(row => {
      const pips=row.querySelectorAll('.hp-pip');const total=pips.length;
      pips.forEach((pip,i)=>{
        const t=total===1?1:i/(total-1);let r,g,b=10;
        if(t<0.33){const s=t/0.33;r=170;g=Math.round(50*s);}
        else if(t<0.66){const s=(t-0.33)/0.33;r=170;g=Math.round(50+100*s);}
        else{const s=(t-0.66)/0.34;r=Math.round(170*(1-s));g=160;}
        pip.style.background=`rgb(${r},${g},${b})`;pip.style.borderColor='rgba(0,0,0,0.3)';
      });
    });
  }
}

function getMargin(el) {
  const style = window.getComputedStyle(el);
  return parseInt(style.marginTop||0) + parseInt(style.marginBottom||0);
}

function buildContinuationPage(sourcePage, key, isDark, isPage2) {
  const page = document.createElement('div');
  page.className = 'page page-cont' + (isDark?' dark-mode':'') + (isPage2?' page-two':'');
  page.setAttribute('data-key', key);

  // Clone banner
  const banner = sourcePage.querySelector('.page-banner').cloneNode(true);
  const sub = banner.querySelector('.adventure-subtitle');
  if(sub) sub.textContent = (sub.textContent||'').replace(' (cont.)','') + ' (cont.)';
  // Remove IDs from cloned banner to avoid duplicates
  banner.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));
  page.appendChild(banner);

  // Inner area
  const inner = document.createElement('div');
  inner.className = 'page-inner';
  inner.style.overflow = 'hidden';
  const contContainer = document.createElement('div');
  contContainer.className = 'cont-container';
  inner.appendChild(contContainer);
  page.appendChild(inner);

  // Bottom band
  const band = document.createElement('div');
  band.className = 'page-bottom-band';
  page.appendChild(band);

  return page;
}

// Shrink an uploaded image before storing it. Phone photos and VTT exports are
// often 4000px+, which bloats both the saved document and the exported PDF for
// no visible gain at print size.
const MAP_MAX_PX = 1600;
// Byte ceiling on the stored data URL: the old dimension-only guard let a
// detailed 1600px scan still weigh multiple MB, and that string rides inside
// every save. Quality steps down until it fits (or we accept the last try).
const MAP_MAX_CHARS = 600000;   // ~440KB of image data
// Registry of uploaded map images, keyed by card uid (see addMap).
const _MAPSRC = Object.create(null);
function downscaleImage(dataUrl) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, MAP_MAX_PX / Math.max(img.width, img.height));
      if(scale === 1 && dataUrl.length < MAP_MAX_CHARS) { resolve(dataUrl); return; }
      const c = document.createElement('canvas');
      c.width  = Math.round(img.width  * scale);
      c.height = Math.round(img.height * scale);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      try {
        let out = null;
        for (const q of [0.82, 0.7, 0.58, 0.48]) {
          out = c.toDataURL('image/jpeg', q);
          if (out.length <= MAP_MAX_CHARS) break;
        }
        resolve(out || dataUrl);
      }
      catch(err) { resolve(dataUrl); }
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

function handleMapFileUpload(input) {
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    const card = input.closest('.entity-card');
    const src = await downscaleImage(e.target.result);
    _MAPSRC[card.dataset.mapUid] = src;
    const lbl = card.querySelector('label');
    const status = card.querySelector('.map-img-status');
    lbl.textContent = 'Click to replace image';
    status.textContent = '✓ ' + file.name;
    status.style.color = '#4caf7d';
    // Collect maps into state and re-render
    state.maps = collectMaps();
    renderPreview();
    saveState();
  };
  reader.readAsDataURL(file);
}

// ── Stat-block schema ─────────────────────────────────────────────────────────
// The card's stat rows, the preview tables and the bestiary picker are all
// driven by SB_CONFIG so scripts/make-session-builders.mjs can swap it per
// system (the block between the SB_CONFIG markers is replaced wholesale).
/* SB_CONFIG_START */
const _swCode = p => { p = Math.round(Number(p)||0); const d = Math.floor(p/3), r = p%3; return d ? d + 'D' + (r ? '+' + r : '') : (r ? '+' + r : ''); };
const SB_CONFIG = {
  typePlaceholder: 'IMPERIAL // STORMTROOPER',
  hp: null,
  rows: [
    [{ key:'dex', label:'DEX', th:'Dexterity', ph:'2D' }, { key:'kno', label:'KNOW', th:'Knowledge', ph:'2D' }, { key:'mec', label:'MECH', th:'Mechanical', ph:'2D' }, { key:'per', label:'PERC', th:'Perception', ph:'2D' }, { key:'str', label:'STR', th:'Strength', ph:'2D' }, { key:'tec', label:'TECH', th:'Technical', ph:'2D' }],
    [{ key:'move', label:'MOVE' }, { key:'force', label:'FORCE PTS', th:'Force Points' }, { key:'armor', label:'ARMOR' }],
  ],
  abilitiesLabel: 'Skills, Equipment & Notes', abilitiesPlaceholder: 'One per line — blaster 4D · Stormtrooper armor (+1D)',
  mobs: { placeholder: 'Search the Star Wars Bestiary…', pool: () => (typeof SW_CHARACTERS !== 'undefined' && Array.isArray(SW_CHARACTERS)) ? SW_CHARACTERS : [], toCard: m => { const A = m.attributes || {}; const c = k => A[k] == null ? '' : _swCode(A[k]); return {
    sbtype: /villain/i.test(m.group||'') ? 'boss' : /hero|rebel|civilian|alien/i.test(m.group||'') ? 'npc' : 'mob', name: m.name || '',
    type: [String(m.group||'').toUpperCase(), m.book === 'sourcebook' ? 'SOURCEBOOK' : m.book === 'companion' ? 'RULES COMPANION' : ''].filter(Boolean).join(' // '), flavor: m.description || '',
    dex: c('Dexterity'), kno: c('Knowledge'), mec: c('Mechanical'), per: c('Perception'), str: c('Strength'), tec: c('Technical'),
    move: m.move || '', force: '', armor: ((m.equipment||[]).find(e => /armor/i.test(e)) || '').split(/[:(]/)[0].trim(),
    abilities: [...(m.skills||[]).map(x => 'Skill: ' + x), ...(m.equipment||[]).map(x => 'Gear: ' + x), m.notes ? 'Notes: ' + m.notes : ''].filter(Boolean).join('\n'),
  }; }, sub: m => String(m.group||'') + (m.book !== 'core' ? ' · ' + m.book : '') },
};
const _DCC_SIZE_NAMES = {1:'Tiny',2:'Small',3:'Petite',4:'Medium',5:'Large',6:'Huge',7:'Colossal',8:'Gargantuan'};
// Map a DCC bestiary entry onto the stat-block card fields.
function dccMobToCard(m) {
  const role = String(m.role || 'Mob');
  const sbtype = /boss/i.test(role) ? 'boss' : (/npc|rival/i.test(role) ? 'npc' : 'mob');
  const sizeName = _DCC_SIZE_NAMES[m.size] || '';
  const typeLine = [role.toUpperCase(), sizeName ? (sizeName + ' (' + m.size + ')') : '', (m.tags||[]).join(', ')].filter(Boolean).join(' // ');
  const hb = Array.isArray(m.hbSlots) ? m.hbSlots : [];
  const st = m.stats || {};
  const mod = k => { const s = st[k]; if(s == null) return ''; const v = (s && typeof s.mod === 'number') ? s.mod : s; return (v >= 0 ? '+' : '') + v; };
  const atkLines = (m.attacks||[]).map(a => {
    const bits = [a.toHit ? ('to hit '+a.toHit) : '', a.damage ? (a.damage + (a.damageType ? ' '+a.damageType : '')) : '', a.range || '', a.rider || ''].filter(Boolean).join(', ');
    return a.name + (bits ? ': ' + bits : '');
  });
  return {
    sbtype, name: m.name || '', type: typeLine, flavor: '',
    hpval: hb.length ? String(hb[0]) : '', hpcount: hb.length ? String(hb.length) : '',
    level: (m.level != null ? String(m.level) : ''), surprise: String(m.surprise || ''),
    evade: String(m.evade || ''), move: String(m.move || ''), dr: String(m.dr != null ? m.dr : ''),
    str: mod('STR'), int: mod('INT'), con: mod('CON'), dex: mod('DEX'), cha: mod('CHA'),
    abilities: [...atkLines, ...(m.notes||[])].join('\n')
  };
}
/* SB_CONFIG_END */
// Values of the schema-driven stat fields on a card, keyed by field key.
function sbFieldValues(card) {
  const out = {};
  SB_CONFIG.rows.forEach(row => row.forEach(f => { out[f.key] = card.querySelector('.sb-f-' + f.key)?.value.trim() || ''; }));
  return out;
}
function mobPool() { return SB_CONFIG.mobs ? SB_CONFIG.mobs.pool() : []; }
function mobRandom() {
  const p = mobPool(); if(!p.length) return;
  addStatBlock(SB_CONFIG.mobs.toCard(p[Math.floor(Math.random()*p.length)]));
  autosave();
}
function mobSearch() {
  const box = document.getElementById('mobpick-search'), list = document.getElementById('mobpick-list');
  if(!box || !list || !SB_CONFIG.mobs) return;
  const q = box.value.trim().toLowerCase();
  const pool = mobPool();
  const hits = (q ? pool.filter(m => (m.name||'').toLowerCase().includes(q)) : pool).slice(0, 80);
  if(!hits.length) { list.innerHTML = '<div class="mob-pick-empty">No match.</div>'; list.classList.add('show'); return; }
  list.innerHTML = hits.map(m =>
    '<button type="button" class="mob-pick-item" data-mon="'+escA(m.name)+'" onclick="mobAdd(this.dataset.mon)">'+
    escH(m.name)+' <span style="opacity:.55">— '+escH(SB_CONFIG.mobs.sub(m))+'</span></button>'
  ).join('');
  list.classList.add('show');
}
function mobAdd(name) {
  const m = mobPool().find(x => x.name === name); if(!m) return;
  addStatBlock(SB_CONFIG.mobs.toCard(m)); autosave();
  const box = document.getElementById('mobpick-search'); if(box) box.value = '';
  const list = document.getElementById('mobpick-list'); if(list) { list.classList.remove('show'); list.innerHTML = ''; }
}
// Hide the picker row when the system has no bestiary.
(function() { const row = document.getElementById('mobpick-row'); if(!row) return; if(!SB_CONFIG.mobs) row.style.display = 'none'; else { const box = document.getElementById('mobpick-search'); if(box) box.placeholder = SB_CONFIG.mobs.placeholder; } })();
// Close the picker list on an outside click.
document.addEventListener('click', e => {
  const list = document.getElementById('mobpick-list');
  if(!list || !list.classList.contains('show')) return;
  if((e.target.closest && (e.target.closest('#mobpick-list') || e.target.closest('#mobpick-search')))) return;
  list.classList.remove('show');
});

// Format text: line breaks → <br>, lines with "Label: text" → bold label
function fmtText(str) {
  if(!str) return '';
  return str.split('\n').map(line => {
    const idx = line.indexOf(':');
    if(idx > 0 && idx < 40) {
      const label = escH(line.slice(0, idx));
      const rest = escH(line.slice(idx + 1).trim());
      return `<strong>${label}:</strong> ${rest}`;
    }
    return escH(line);
  }).join('<br>');
}

  setText('p-players',state.players?'PLAYERS: '+state.players:'');
  setText('p-duration',state.duration?'DURATION: '+state.duration:'');
  // Page 2
  setText('p2-title',state.title||'Adventure Title');

  setText('p3-floor',state.floor?'EPISODE: '+state.floor:'');
  setText('p3-session',state.session?'SESSION: '+state.session:'');
  setText('p3-players',state.players?'PLAYERS: '+state.players:'');
  setText('p3-duration',state.duration?'DURATION: '+state.duration:'');
  // Page 4
  setText('p4-title',state.title||'Adventure Title');
  setText('p4-floor',state.floor?'EPISODE: '+state.floor:'');
  setText('p4-session',state.session?'SESSION: '+state.session:'');
  setText('p4-players',state.players?'PLAYERS: '+state.players:'');
  setText('p4-duration',state.duration?'DURATION: '+state.duration:'');
  // Overview with formatting
  // Build all p1 items, measure, fill left then right
  (function() {
    const leftEl  = document.getElementById('p1-left');
    const rightEl = document.getElementById('p1-right');
    if(!leftEl || !rightEl) return;

    // Build HTML strings for each section
    const sections = [];

    // Overview

    // Secrets & Clues
    if((state.clues||[]).length){
      let h='<div class="p-section"><div class="sl" style="color:#2d6a2d;border-bottom-color:#2d6a2d;">Secrets &amp; Clues</div>';
      (state.clues||[]).forEach(c=>{h+='<div class="clue-item">'+(c.header?'<span class="clue-hdr">'+escH(c.header)+'</span>'+(c.text?' — ':''): '')+fmtText(c.text)+'</div>';});
      sections.push(h+'</div>');

    // Loot & Rewards
    if((state.rewards||[]).length){
      let h='<div class="p-section"><div class="sl" style="color:#C0392B;border-bottom-color:#F7941D;">Loot &amp; Rewards</div>';
      (state.rewards||[]).forEach(r=>{h+='<div class="npc-block" style="border-left-color:#C4700A;"><div class="entry-name">'+escH(r.name)+'</div>'+(r.flavor?'<div class="sb-flavor" style="margin-bottom:5px;padding:5px 7px;">'+fmtText(r.flavor)+'</div>':'')+(r.stats?'<p class="entry-desc reward-stats" style="font-family:Share Tech Mono,monospace;font-size:8px;margin-top:3px;">'+fmtText(r.stats)+'</p>':'')+'</div>';});
      sections.push(h+'</div>');
    }

    // Notes
    if(state.notes && state.notes.trim()){
      sections.push('<div class="p-section"><div class="sl">Notes</div><p class="p-text">'+fmtText(state.notes)+'</p></div>');
    }

    // Encounters inline on page 1 (spills onto page 2 when they don't fit)
    const _typeC={'combat':'#C0392B','exploration':'#2d6a2d','npc':'#1a4a8a'};
    (state.locations||[]).forEach(l=>{
      const c=_typeC[l.type]||_typeC.combat;
      const displayName = l.name || l.tag || '';
      const showTag = l.tag && l.name;
      sections.push('<div class="location-block"><div class="loc-name" style="color:'+c+';border-bottom:1.5px solid '+c+';padding-bottom:1px;font-family:Barlow Condensed,sans-serif;font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;display:block;margin-bottom:4px;">'+escH(displayName)+'</div>'+(showTag?'<div class="loc-tag">'+escH(l.tag)+'</div>':'')+(l.readaloud?'<div class="read-aloud"><p>'+fmtText(l.readaloud)+'</p></div>':'')+(l.desc?'<p class="loc-desc">'+fmtText(l.desc)+'</p>':'')+'</div>');
    });

    // Full NPC / Mob stat blocks after the encounters
    if((state.statblocks||[]).length){
      sections.push('<div class="p-section" style="margin-top:4px;"><div class="sl" style="color:#1a4a8a;border-bottom-color:#1a4a8a;">Imperials, Aliens &amp; NPCs</div></div>');
      state.statblocks.forEach(sb=>{
        const sbDiv = buildSB(sb);
        sbDiv.classList.add('full-width');
        sbDiv.style.width='100%';
        sbDiv.style.flex='0 0 100%';
        sbDiv.style.marginBottom='8px';
        sections.push(sbDiv.outerHTML);
      });
    }

    // Put all items in left first to measure real heights
    leftEl.innerHTML = sections.join('');
    rightEl.innerHTML = '';

    // Measure each item's actual rendered height
    const items = [...leftEl.children];
    const colH = leftEl.offsetHeight; // flex:1 gives us the correct column height

    // Fill left column, overflow into right
    let leftH = 0;
    let rightStart = -1;
    for(let i=0; i<items.length; i++){
      const h = items[i].offsetHeight + getMargin(items[i]);
      if(rightStart === -1 && leftH + h > colH){
        rightStart = i;
        break;
      }
      leftH += h;
    }

    // Move overflow items to right column
    if(rightStart > 0 && rightStart < items.length){
      const toMove = items.slice(rightStart);
      toMove.forEach(el => rightEl.appendChild(el));
    }
  })();

  // Page 2: only the encounters that didn't fit on page 1
  const typeColors={'combat':'#C0392B','exploration':'#2d6a2d','npc':'#1a4a8a'};
  const locsEl2 = document.getElementById('p-locations');
  const pageTwo = document.getElementById('page-two');
  if(locsEl2) {
    const p1LocCount = document.querySelectorAll('#p1-left .location-block, #p1-right .location-block').length;
    const overflowLocs = (state.locations||[]).slice(p1LocCount);
    locsEl2.innerHTML = overflowLocs.map(l=>`
      <div class="location-block">
        <div class="loc-name" style="color:${typeColors[l.type]||typeColors.combat};border-bottom:1.5px solid ${typeColors[l.type]||typeColors.combat};padding-bottom:1px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;display:block;margin-bottom:4px;">${escH(l.name||l.tag||'')}</div>

        ${l.desc?`<p class="loc-desc">${fmtText(l.desc)}</p>`:''}
      </div>`).join('');
    // Hide page 2 entirely when nothing overflowed
    if(pageTwo) pageTwo.style.display = overflowLocs.length ? '' : 'none';
  }

  // Flowchart - render on both page 1 and page 2
  const renderFlowchart = (fcId) => {
    const fc=document.getElementById(fcId);
    if(!fc) return;
    const locNodes=state.locations.map(l=>({name:l.name||l.tag||'Encounter',type:l.type||'combat'}));
    const allNodes=[...locNodes];
    if(!allNodes.length){fc.innerHTML='';return;}
    const typeNodeColors={
      combat:{bg:'#C0392B',txt:'white'},
      exploration:{bg:'#2d6a2d',txt:'white'},
      npc:{bg:'#1a4a8a',txt:'white'},
    };
    // Scale nodes down when there are many to prevent overflow
    const n=allNodes.length;
    const nodePad  = n>12 ? '2px 3px' : n>8 ? '3px 5px' : '4px 7px';
    const nameSz   = n>12 ? '7px'  : n>8 ? '8px'  : '9px';
    const arrowSz  = n>12 ? '8px'  : n>8 ? '9px'  : '11px';
    const nameLen  = n>12 ? 10 : n>8 ? 12 : 14;
    fc.innerHTML=allNodes.map((node,i)=>{
      const c=typeNodeColors[node.type]||typeNodeColors.combat;
      return `<div class="flow-node" style="background:${c.bg};padding:${nodePad};">
        <div class="flow-name" style="color:${c.txt};font-size:${nameSz};">${escH(node.name.substring(0,nameLen))}</div>
      </div>${i<allNodes.length-1?`<div class="flow-arrow" style="font-size:${arrowSz};">→</div>`:''}`;
    }).join('');
  };
  renderFlowchart('p-flowchart');
  renderFlowchart('p-flowchart-2');

  // Maps - render each map on page 3. Rebuilding this section re-escapes the
  // base64 srcs and forces the browser to re-decode every image, so it only
  // happens when the map set actually changed (cheap signature: title + src
  // length + src prefix per map).
  const mapsContainer=document.getElementById('p-maps-container');
  if(mapsContainer){
    const mapsSig=(state.maps||[]).map(m=>m.title+'|'+(m.src?m.src.length+'|'+m.src.slice(0,40):'')).join(';');
    if(mapsContainer._sig!==mapsSig){
      mapsContainer._sig=mapsSig;
      if(state.maps&&state.maps.length>0){
        mapsContainer.innerHTML=state.maps.map(m=>`
          <div style="margin-bottom:16px;break-inside:avoid;">
            ${m.title?`<div class="sl" style="margin-bottom:6px;">${escH(m.title)}</div>`:''}
            <img src="${escA(m.src)}" alt="${escA(m.title||'Map')}" style="width:100%;height:auto;display:block;border:2px solid var(--accent);">
          </div>`).join('');
      } else {
        mapsContainer.innerHTML=`<div class="map-placeholder">MAP IMAGES WILL APPEAR HERE</div>`;
      }
    }
  }

  // Pages 3 & 4: maps only on 3; stat blocks now render inline on the main pages
  const _p3 = document.getElementById('page-three');
  const _p4 = document.getElementById('page-four');
  if(_p3) _p3.style.display = (state.maps||[]).length ? '' : 'none';
  if(_p4) _p4.style.display = 'none';
  const sbEl=document.getElementById('p-statblocks');
  if(sbEl) sbEl.innerHTML='';
  applyGradients();
  // Run pagination after DOM has painted
  requestAnimationFrame(()=>requestAnimationFrame(paginatePages));
}

function buildSB(s) {
  const div=document.createElement('div');
  const sbtypeColors={mob:'#C0392B',boss:'#6a2d8a',npc:'#1a4a8a'};
  const borderColor=sbtypeColors[s.sbtype]||sbtypeColors.mob;
  div.className='stat-block'+(s.fullwidth?' full-width':'');
  div.style.borderTopColor=borderColor;
  const hpCount=SB_CONFIG.hp ? (parseInt(s.hpcount)||1) : 0;
  let pips=''; for(let i=0;i<hpCount;i++) pips+=`<div class="hp-pip">${escH(s.hpval||'1')}</div>`;
  const abilities=(s.abilities||'').split('\n').filter(Boolean).map(a=>{
    const idx=a.indexOf(':');
    return idx>0?`<div class="sb-ability"><strong>${escH(a.slice(0,idx))}:</strong> ${escH(a.slice(idx+1).trim())}</div>`:`<div class="sb-ability">${escH(a)}</div>`;
  }).join('');
  const tables=SB_CONFIG.rows.map(row => `
    <table class="sb-table"><tr>${row.map(f => '<th>'+escH(f.th||f.label)+'</th>').join('')}</tr>
    <tr>${row.map(f => '<td>'+escH(s[f.key]||'')+'</td>').join('')}</tr></table>`).join('');
  if(s.isnpc&&s.fullwidth) {
    div.innerHTML=`<div class="sb-name">${escH(s.name)}</div><div class="sb-type">${escH(s.type)}</div>
      <div class="sb-warning"><svg class="dcc-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:inline-block;vertical-align:-0.14em"><path fill-rule="evenodd" clip-rule="evenodd" d="M13.3 3.8a1.5 1.5 0 0 0-2.6 0L2.5 18.4A1.5 1.5 0 0 0 3.8 20.6h16.4a1.5 1.5 0 0 0 1.3-2.2ZM12 8.4a1 1 0 0 1 1 1v4a1 1 0 0 1-2 0v-4a1 1 0 0 1 1-1Zm0 8.8a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4Z"/></svg> WARNING: This is a non-combatant NPC.</div>
      <div style="display:flex;gap:12px;">
        <div style="flex:1">${pips?`<div class="sb-hp-row">${pips}</div>`:``}${tables}</div>
        <div style="flex:2"><div class="sb-notes">${fmtText(s.notes)}</div></div>
      </div>`;
  } else {
    div.innerHTML=`<div class="sb-name">${escH(s.name)}</div><div class="sb-type">${escH(s.type)}</div>
      ${s.flavor?`<div class="sb-flavor">${fmtText(s.flavor)}</div>`:''}
      ${pips?`<div class="sb-hp-row">${pips}</div>`:``}${tables}
      ${abilities?`<hr class="sb-divider">${abilities}`:''}
      ${s.isnpc&&s.notes?`<hr class="sb-divider"><div style="font-size:8.5px;color:var(--ink);line-height:1.6">${fmtText(s.notes)}</div>`:''}`;
  }
  return div;
}

function applyGradients() {
  document.querySelectorAll('.sb-hp-row').forEach(row=>{
    const pips=row.querySelectorAll('.hp-pip');const total=pips.length;
    pips.forEach((pip,i)=>{
      const t=total===1?1:i/(total-1);let r,g,b=10;
      if(t<0.33){const s=t/0.33;r=170;g=Math.round(50*s);}
      else if(t<0.66){const s=(t-0.33)/0.33;r=170;g=Math.round(50+100*s);}
      else{const s=(t-0.66)/0.34;r=Math.round(170*(1-s));g=160;}
      pip.style.background=`rgb(${r},${g},${b})`;pip.style.borderColor='rgba(0,0,0,0.3)';
    });
  });
}

// Runs `capture` with the fixed 816x1056 paginated layout in force, regardless
// of whether the preview is currently in flow mode, then restores the previous
// mode. This is what guarantees HTML/PDF export is always the print layout even
// when the builder is being used on a phone. `capture` may return a Promise; the
// previous mode is restored once it settles.
function _withFixedLayout(capture) {
  const wasFlow = document.body.classList.contains('flow-mode');
  const restore = () => {
    if (wasFlow && !document.body.classList.contains('flow-mode')) {
      document.body.classList.add('flow-mode');
      paginatePages(); // no-op cleanup in flow mode
    }
  };
  if (wasFlow) {
    document.body.classList.remove('flow-mode');
    void document.body.offsetHeight; // force synchronous reflow before measuring
    paginatePages();
  }
  let result;
  try {
    result = capture();
  } catch (e) {
    restore();
    throw e;
  }
  if (result && typeof result.then === 'function') {
    return Promise.resolve(result).then(
      (v) => { restore(); return v; },
      (e) => { restore(); throw e; }
    );
  }
  restore();
  return result;
}

function importHTML(input) {
  const file=input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    const html=e.target.result;
    const match=html.match(/data-spb="([^"]+)"/);
    if(!match){
      alert("This HTML file does not contain Adventure Prep Builder data.\n\nOnly files exported from this builder can be imported.");
      input.value="";
      return;
    }
    try {
      const decoded=decodeURIComponent(escape(atob(match[1])));
      const imported=JSON.parse(decoded);
      state={...DEFAULT_STATE,...imported};
      if(!Array.isArray(state.maps)) state.maps=[];
      if(!Array.isArray(state.clues)) state.clues=[];
      if(!Array.isArray(state.rewards)) state.rewards=[];
      if(!Array.isArray(state.hooks)) state.hooks=[];
      if(!Array.isArray(state.strongopen)) state.strongopen=[];
      if(!Array.isArray(state.locations)) state.locations=[];
      if(!Array.isArray(state.statblocks)) state.statblocks=[];
      try {
        const toSave={...state, mappath:"", maps:[]};
        localStorage.setItem("sw_builder_v1", JSON.stringify(toSave));
      } catch(e) {}
      buildSidebarFromState();
      renderPreview();
      const ind=document.getElementById("save-indicator");
      if(ind){ ind.textContent="Imported ✓"; ind.classList.add("saved"); setTimeout(()=>{ ind.textContent="All changes saved"; ind.classList.remove("saved"); },2000); }
    } catch(err) {
      alert("Failed to parse the imported file: "+err.message+" | Stack: "+err.stack);
    }
    input.value="";
  };
  reader.readAsText(file);
}
// Load html2canvas + jsPDF on first use (they were render-blocking in <head>).
// Failures reset the promise so a flaky connection can retry on the next click.
let _exportLibsPromise = null;
function loadExportLibs() {
  if (window.html2canvas && window.jspdf) return Promise.resolve();
  if (_exportLibsPromise) return _exportLibsPromise;
  const add = (src) => new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res;
    s.onerror = () => rej(new Error('could not load export libraries — check your connection'));
    document.head.appendChild(s);
  });
  _exportLibsPromise = Promise.all([
    add('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),
    add('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'),
  ]).catch(err => { _exportLibsPromise = null; throw err; });
  return _exportLibsPromise;
}
function savePDF() {
  if (renderTimer) renderNow();   // flush any pending debounced preview rebuild
  const btn=document.getElementById('pdf-btn');
  btn.textContent='⏳ Generating...';
  btn.disabled=true;
  const filename=(state.title||'adventure').replace(/[^a-z0-9]/gi,'_').toLowerCase();

  // Force the fixed print layout for the capture (so a phone-width, flow-mode
  // session still yields a correct paginated PDF), then restore the view mode
  // once the canvases are taken.
  loadExportLibs().then(() => _withFixedLayout(() => {
    const pages=[...document.querySelectorAll('.preview-area .page')].filter(p=>p.style.display!=='none');

    // 1.5x JPEG lands around 1-2MB and looks the same on paper. JPEG has no
    // alpha, so each page is rasterized onto its own background color.
    const shot = (p) => html2canvas(p, {
      scale: 1.5,
      useCORS: true,
      allowTaint: true,
      logging: false,
      backgroundColor: getComputedStyle(p).backgroundColor || '#ffffff',
      windowWidth: 816,
      windowHeight: 1056
    });

    return Promise.all(pages.map(shot)).then(canvases=>{
      const {jsPDF}=window.jspdf;
      const pdf=new jsPDF({orientation:'portrait',unit:'pt',format:'letter',compress:true});
      const pageW=pdf.internal.pageSize.getWidth();
      const pageH=pdf.internal.pageSize.getHeight();

      canvases.forEach((canvas,i)=>{
        if(i>0) pdf.addPage();
        const img=canvas.toDataURL('image/jpeg',0.85);
        const ratio=Math.min(pageW/canvas.width, pageH/canvas.height);
        const w=canvas.width*ratio;
        const h=canvas.height*ratio;
        pdf.addImage(img,'JPEG',(pageW-w)/2,(pageH-h)/2,w,h,undefined,'FAST');
      });

      pdf.save(filename+'.pdf');
    });
  })).then(()=>{
    btn.textContent='Save PDF';
    btn.disabled=false;
  }).catch(err=>{
    alert('PDF generation failed: '+err.message);
    btn.textContent='Save PDF';
    btn.disabled=false;
  });
}

function toggleSidebar() {
  const sidebar=document.querySelector('.sidebar');
  const collapsed=sidebar.classList.toggle('collapsed');
  const tab=document.querySelector('.sidebar-tab');
  if(window.innerWidth>=769) {
    // Desktop: update arrow text and tab position
    const tabArrow=tab && tab.querySelector('.sidebar-tab-arrow');
    if(tabArrow) tabArrow.textContent=collapsed?'▶':'◀';
    if(tab) tab.style.left=collapsed?'42px':'320px';
    if(tab) tab.style.left=collapsed?'42px':'320px';
  } else {
    // Mobile: toggle body class and update ▲/▼ arrow
    document.body.classList.toggle('sidebar-collapsed', collapsed);
    var mobileArrow = document.querySelector('.sidebar-tab .sidebar-tab-arrow');
    if(mobileArrow) mobileArrow.textContent = collapsed ? '▼' : '▲';
  }
}

  if (on) {
    document.querySelectorAll('.preview-area .page').forEach(p=>p.classList.add('dark-mode'));
    requestAnimationFrame(()=>requestAnimationFrame(paginatePages));
  }
}

function clearAll() {
  if(!confirm('Clear all adventure data?')) return;
  state=JSON.parse(JSON.stringify(DEFAULT_STATE));
  const mapStatus=document.getElementById('map-status');
  const mapLbl=document.querySelector('label[for="f-mapfile"]');
  const fileInput=document.getElementById('f-mapfile');
  if(mapStatus){mapStatus.textContent='No image loaded';mapStatus.style.color='var(--ui-muted)';}
  if(mapLbl) mapLbl.textContent='Click to upload map image';
  if(fileInput) fileInput.value='';
  document.getElementById('maps-list').innerHTML='';

  saveState();buildSidebarFromState();renderPreview();
}

loadState();buildSidebarFromState();applyFlowMode();renderPreview();applyDarkModeInit();
</script>
</body>
</html>
