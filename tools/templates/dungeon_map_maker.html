        case 0: nx=base.x+base.w;  ny=base.y+ri(-(h-2), base.h-2); break;   // right of base
        case 1: nx=base.x-w;       ny=base.y+ri(-(h-2), base.h-2); break;   // left of base
        case 2: ny=base.y+base.h;  nx=base.x+ri(-(w-2), base.w-2); break;   // below base
        default:ny=base.y-h;       nx=base.x+ri(-(w-2), base.w-2); break;   // above base
      }
      const cand={x:nx,y:ny,w,h,round:false,cx:nx+w/2,cy:ny+h/2};
      if(rooms.some(r=>rectsOverlap(cand,r))) continue;                     // interior collision
      rooms.push(cand);
    }
  }
  // Put one door on every shared wall segment (≥2 cells long) between two rooms.
  // The accretion tree guarantees each room shares a wall with the map, so this
  // connects everything without corridors.
  function addAdjacencyDoors(rooms){
    const s2=v=>Math.round(v*2)/2, EPS=1e-6;
    for(let i=0;i<rooms.length;i++) for(let j=i+1;j<rooms.length;j++){
      const a=rooms[i], b=rooms[j]; let door=null;
      if(Math.abs((a.x+a.w)-b.x)<EPS || Math.abs((b.x+b.w)-a.x)<EPS){        // vertical shared wall
        const y0=Math.max(a.y,b.y), y1=Math.min(a.y+a.h,b.y+b.h);
        if(y1-y0>=2){ const x=Math.abs((a.x+a.w)-b.x)<EPS ? a.x+a.w : a.x;
          door={x, y:s2((y0+y1)/2), a:Math.PI/2}; }
      } else if(Math.abs((a.y+a.h)-b.y)<EPS || Math.abs((b.y+b.h)-a.y)<EPS){ // horizontal shared wall
        const x0=Math.max(a.x,b.x), x1=Math.min(a.x+a.w,b.x+b.w);
        if(x1-x0>=2){ const y=Math.abs((a.y+a.h)-b.y)<EPS ? a.y+a.h : a.y;
          door={x:s2((x0+x1)/2), y, a:0}; }
      }
      if(door){ door.id=uid(); door.len=(rng()<0.5?1:2); door._adj=true; map.doors.push(door); }
    }
  }
  function carveCorridor(A,B){
    // L-shaped corridor (random elbow order). Door goes on the wall each leg
    // actually passes through, so doors land at real thresholds.
    const ax=Math.round(A.cx),ay=Math.round(A.cy),bx=Math.round(B.cx),by=Math.round(B.cy);
    const horizFirst=rng()<0.5;
    const cw=rng()<0.5?1:2;                          // corridor width: 1 or 2 cells
    // Opening centre = leg start + cw/2, so the door lands on the wall line
    // centred in the gap; door length is sized to the corridor width.
    if(horizFirst){
      map.shapes.push(hall(Math.min(ax,bx),ay,Math.abs(bx-ax)+cw,cw));
      map.shapes.push(hall(bx,Math.min(ay,by),cw,Math.abs(by-ay)+cw));
      addDoor(A,"h",ay+cw/2,Math.sign(bx-ax)||1, bx,ay, cw);       // A exits left/right (elbow = bx,ay)
      addDoor(B,"v",bx+cw/2,Math.sign(ay-by)||1, bx,ay, cw);       // B entered top/bottom
    } else {
      map.shapes.push(hall(ax,Math.min(ay,by),cw,Math.abs(by-ay)+cw));
      map.shapes.push(hall(Math.min(ax,bx),by,Math.abs(bx-ax)+cw,cw));
      addDoor(A,"v",ax+cw/2,Math.sign(by-ay)||1, ax,by, cw);       // A exits top/bottom (elbow = ax,by)
      addDoor(B,"h",by+cw/2,Math.sign(ax-bx)||1, ax,by, cw);       // B entered left/right
    }
  }
  function hall(x,y,w,h){ return {id:uid(),type:"rect",x,y,w:Math.max(1,w),h:Math.max(1,h),corridor:true}; }
  // Place a door on `room` where a corridor leg crosses its wall. axis "h" ⇒
  // left/right wall (leaf vertical, a=π/2); "v" ⇒ top/bottom wall (leaf a=0).
  // `line` is the crossing coordinate; `side` picks which wall. Round rooms get
  // a radial door toward (tcx,tcy).
  function addDoor(room, axis, line, side, tcx, tcy, len){
    len = len || 1; const m=len/2;
    if(room.round){
      // Seat the door at the corridor mouth. The corridor centreline (`line`) is
      // grid-aligned, so the door's ALONG coordinate is on the grid; the ACROSS
      // coordinate is put exactly on the circle boundary, so the door meets the
      // visible curved wall instead of floating off it. finalizeDoors then fits
      // its length to the real opening and validates it like any other door.
      const cx=room.cx, cy=room.cy, r=Math.max(room.w,room.h)/2;
      if(axis==="h"){                                  // horizontal corridor → door on E/W arc (a=π/2, along=y)
        const y=Math.max(cy-r+0.4, Math.min(cy+r-0.4, line));
        const off=Math.sqrt(Math.max(0.04, r*r-(y-cy)*(y-cy)));
        map.doors.push({id:uid(), x:cx+(side>0?off:-off), y, a:Math.PI/2, len});
      } else {                                         // vertical corridor → door on N/S arc (a=0, along=x)
        const x=Math.max(cx-r+0.4, Math.min(cx+r-0.4, line));
        const off=Math.sqrt(Math.max(0.04, r*r-(x-cx)*(x-cx)));
        map.doors.push({id:uid(), x, y:cy+(side>0?off:-off), a:0, len});
      }
      return;
    }
    if(axis==="h"){ const x=side>0?room.x+room.w:room.x, y=Math.min(room.y+room.h-m,Math.max(room.y+m,line));
      map.doors.push({id:uid(), x, y, a:Math.PI/2, len}); }
    else { const y=side>0?room.y+room.h:room.y, x=Math.min(room.x+room.w-m,Math.max(room.x+m,line));
      map.doors.push({id:uid(), x, y, a:0, len}); }
  }

  // ════════════════════════════════════════════════════════════════
  // HISTORY / PERSISTENCE
  // ════════════════════════════════════════════════════════════════
  function snapshot(){ return JSON.stringify(map); }
  function pushHistory(){ history.push(snapshot()); if(history.length>60) history.shift(); future.length=0; syncUndo(); }
  function commit(){ markGeom(); render(); scheduleSave(); syncUndo(); }
  function undo(){ if(!history.length) return; future.push(snapshot()); map=JSON.parse(history.pop()); afterLoad(); syncUndo(); scheduleSave(); }
  function redo(){ if(!future.length) return; history.push(snapshot()); map=JSON.parse(future.pop()); afterLoad(); syncUndo(); scheduleSave(); }
  function syncUndo(){ $("undo").disabled=!history.length; $("redo").disabled=!future.length; }
  function afterLoad(){ sel=null; polyPts=null; draft=null; placing=null; stroke=null; markGeom();
    if(!Array.isArray(map.lights)) map.lights=[];        // maps exported before v37
    if(!Array.isArray(map.shadows)) map.shadows=[];      // …and before v38
    // Maps made before the switch existed keep their shadows on, so nothing
    // silently disappears; a map with none starts with it off, like Lights.
    if(map.shadowsOn==null) map.shadowsOn = map.shadows.length>0;
    if(map.darkness==null) map.darkness=0.55;
    syncGridOp(); syncZUI(); syncLightUI(); syncShadowUI();
    $("gridToggle").checked=map.grid!==false;
    snapOn=map.snap!==false; if($("snapToggle")) $("snapToggle").checked=snapOn;
    if($("darkToggle")) $("darkToggle").checked = map.theme==="dark";
    setThemeColors(map.theme==="dark" ? "dark" : "light");
    syncAdvancedUI();
    render(); }

  // Work is kept only in this browser (localStorage) so a refresh doesn't lose
  // it — nothing is saved to the site. Sharing / keeping a map is via Export.
  let saveTimer=null;
  function scheduleSave(){ if(embed) return; clearTimeout(saveTimer); saveTimer=setTimeout(doSave,700); }
  function doSave(){ try{ localStorage.setItem("dcc_map", snapshot()); }catch(e){} }

  function load(){
    let data=null;
    if(window.__ddState && (window.__ddState.shapes||window.__ddState.version)) data=window.__ddState;
    else { try{ const s=localStorage.getItem("dcc_map"); if(s) data=JSON.parse(s); }catch(e){} }
    if(data && (data.shapes||data.walls)) adoptMap(data);
  }
  // Replace the working map with a loaded/imported one, filling any gaps.
  function adoptMap(data){
    map=Object.assign(blankMap(), data);
    if(map.style){ map.style.floor=unalias(map.style.floor); map.style.wall=unalias(map.style.wall);
                   map.style.bg=unalias(map.style.bg); }
    for(const sh of map.shapes){ if(sh.floor!==undefined) sh.floor=unalias(sh.floor);
                                 if(sh.wall!==undefined) sh.wall=unalias(sh.wall); }
    for(const wl of map.walls) if(wl.wall!==undefined) wl.wall=unalias(wl.wall);
    map.shapes=data.shapes||[]; map.walls=data.walls||[]; map.doors=data.doors||[]; map.stairs=data.stairs||[];
    map.shadows=data.shadows||[]; map.lights=data.lights||[];
    // ⚠ A map saved before the Shadows switch existed carries shadows but no flag,
    // and blankMap()'s default of `false` would silently hide every one of them.
    // This has to live HERE, not only in afterLoad(): boot() goes load() ->
    // adoptMap() and never touches afterLoad().
    if(data.shadowsOn==null) map.shadowsOn = map.shadows.length>0;
    if(data.wallShadow==null) map.wallShadow = 0.55;
    for(const L of map.lights){
      if(L.pattern==="textured") L.pattern="fire";       // renamed in v46
      if(L.rot==null) L.rot=0;                           // rotatable since v49
    }
    if(!map.seedId) map.seedId=1+Math.max(0,...allIds());
  }
  function allIds(){ return [...map.shapes,...map.walls,...map.doors,...map.stairs].map(o=>o.id||0); }

  // ── Editable-file export / import ─────────────────────────────────
  // Export writes the full map object as a .json file the user keeps on their
  // own drive; Import reads one back. This is the only way to persist/share a
  // map (there is no server save).
  function safeName(){ return ((map.name||"").trim().replace(/[^\w\- ]+/g,"").replace(/\s+/g,"-").slice(0,60)) || "dungeon-map"; }
  // ── SAVING A FILE ──────────────────────────────────────────────────
  // There are two mechanisms and the wrong one fails SILENTLY. `<a download>` is
  // correct on desktop; **iOS Safari does not honour it** — the click does
  // nothing, or opens a viewer, while the toast cheerfully claimed success. The
  // Web Share API with `files` is the only route to "Save to Files" there.
  //
  // ⚠ navigator.share() MUST be reached synchronously from the user gesture. Do
  // not await anything before calling it (that includes canvas.toBlob) or iOS
  // rejects the call as untrusted — which looks exactly like the original bug.
  const COARSE = (function(){ try{ return matchMedia("(pointer:coarse)").matches; }catch(e){ return false; } })();
  const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent||"")
           || (navigator.platform==="MacIntel" && (navigator.maxTouchPoints||0) > 1);   // iPadOS lies
  function downloadFallback(blob, filename, label){
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=filename; a.rel="noopener";
    document.body.appendChild(a); a.click(); a.remove();      // must be IN the document for Firefox
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000); // Safari needs the URL alive past the click
    toast(label+" "+filename);
  }
  function saveFile(blob, filename, label){
    let file=null;
    try{ file=new File([blob], filename, {type:blob.type||"application/octet-stream"}); }catch(e){}
    if(file && (IOS||COARSE) && navigator.share && navigator.canShare){
      let ok=false;
      try{ ok=navigator.canShare({files:[file]}); }catch(e){ ok=false; }
      if(ok){
        navigator.share({files:[file], title:filename})
          .then(function(){ toast("Saved "+filename); })
          .catch(function(err){
            if(err && err.name==="AbortError") return;         // user dismissed the sheet
            downloadFallback(blob, filename, label);           // share refused — try the old way
          });
        return;
      }
    }
    downloadFallback(blob, filename, label);
  }
  // data: URL -> Blob, SYNCHRONOUSLY. canvas.toBlob() is async and awaiting it
  // would spend the user gesture that navigator.share needs.
  function dataURLToBlob(u){
    const i=u.indexOf(","), meta=u.slice(0,i), body=u.slice(i+1);
    const mime=(meta.match(/:(.*?)[;,]/)||[,"application/octet-stream"])[1];
    if(meta.indexOf("base64")<0) return new Blob([decodeURIComponent(body)], {type:mime});
    const bin=atob(body), n=bin.length, arr=new Uint8Array(n);
    for(let k=0;k<n;k++) arr[k]=bin.charCodeAt(k);
    return new Blob([arr], {type:mime});
  }
  function exportMap(){
    saveFile(new Blob([JSON.stringify(map)], {type:"application/json"}),
             safeName()+".json", "Exported");
  }
  function importMapFile(file){
    const rd=new FileReader();
    rd.onload=()=>{
      let data=null;
      try{ data=JSON.parse(rd.result); }catch(e){}
      if(!data || !(data.shapes||data.walls)){ toast("That file isn’t a map export."); return; }
      pushHistory();
      adoptMap(data);
      afterLoad();
      fitView();
      toast("Imported "+(file.name||"map"));
    };
    rd.onerror=()=>toast("Couldn’t read that file.");
    rd.readAsText(file);
  }


  // ════════════════════════════════════════════════════════════════
  // ADVANCED MODE — textured floors & background
  // ════════════════════════════════════════════════════════════════
  // Two texture sources, deliberately kept apart:
  //   • STARTER  — tiles generated for this site and served from /packs/starter.
  //                Safe to ship, always available, no import step.
  //   • packs    — a .dungeondraft_pack the user loads from their own machine.
  //                Parsed in the browser and stored in IndexedDB ONLY; nothing
  //                is uploaded and no third-party art lives in the repo.
  // `map.style = {mode, floor, bg}` stores ids, not pixels. If an id can't be
  // resolved (pack not loaded in this browser, or the tool opened offline) the
  // renderer just falls back to the classic flat colours — never an error.
  // Bundled art is described by /packs/bundled/bundled.json so adding or
  // swapping packs is a data change, not a code change. Only CREATIVE-COMMONS
  // packs belong in there — anything bundled is redistributed by the site.
  // (See public/packs/bundled/extract-pack.py.) Attribution is rendered
  // statically in the sidebar, never from this fetch, so it can't go missing.
  const BUNDLED_URL = "/packs/bundled/bundled.json";
  // Maps saved against the old generated placeholder set are migrated on load
  // to the nearest real texture, so existing work doesn't come back blank.
  const ALIAS = {
    "starter:flagstone":"bundled:2mtw-stone-paving", "starter:cobble":"bundled:2mtw-stone",
    "starter:tile":"bundled:2mtd-classic-stone-floor","starter:planks":"bundled:2mtw-floorboards-a",
    "starter:cavern":"bundled:2mtw-dirt",            "starter:sand":"bundled:2mtw-dirt",
    "starter:rockdark":"bg:slate",                   "starter:rocklight":"bg:parch",
    "starter:wallstone":"bundled:2mtw-wall-wall-stone-a",
    "starter:walldark":"bundled:2mtd-wall-dark",
    "starter:wallrubble":"bundled:2mtw-wall-wall-stone-b",
    "starter:walltimber":"bundled:2mtw-wall-wall-wood-a",
  };
  // A function DECLARATION, not a const: blankMap() runs while the module is
  // still initialising (`let map = blankMap()`), so a const here would be in the
  // temporal dead zone and every boot would throw.
  function DEFAULT_STYLE(){ return {mode:"classic", floor:"bundled:2mtd-classic-stone-floor",
                                    wall:"bundled:2mtd-wall-dark", bg:"bg:slate"}; }
  function unalias(id){ return (id && ALIAS[id]) || id; }

  const BG_SOLID = { "bg:theme":null, "bg:black":"#08080a", "bg:slate":"#171a21", "bg:parch":"#efe8d7" };
  const texReg = new Map();                       // id -> {id,name,kind,url,cells|thick|tile,img}
  let bundledPacks = [];                          // [{id,name,textures:[…]}] once the manifest lands
  let bundledError = null;                        // surfaced in the palette so a bad deploy is obvious
  let bundledCounts = null;                       // what the manifest actually contained
  let assetV = "";                                // ?v=<content hash> appended to every asset URL
  async function loadBundled(){
    let m;
    try{
      // NOT force-cache: that serves a cached copy WITHOUT revalidating, so a
      // freshly uploaded manifest can stay invisible for as long as the browser
      // keeps the old one. no-cache revalidates and takes a 304 when unchanged.
      const r = await fetch(BUNDLED_URL, {cache:"no-cache"});
      if(!r.ok) throw new Error("HTTP "+r.status);
      m = await r.json();
    }catch(e){ bundledError=e.message||String(e); buildObjGrid(); return; }
    assetV = m.version ? ("?v="+m.version) : "";
    bundledCounts = {};
    for(const p of (m.packs||[])) for(const t of (p.textures||[]))
      bundledCounts[t.kind]=(bundledCounts[t.kind]||0)+1;
    bundledPacks = m.packs || [];
    for(const p of bundledPacks) for(const t of p.textures)
      texReg.set(t.id, {id:t.id, name:t.name, kind:t.kind, pack:p.id, packName:p.name,
                        // `basic` packs are the set offered in NORMAL mode; the
                        // rest belong to Advanced Mode. The two never mix.
                        basic:!!p.basic,
                        cells:t.cells, thick:t.thick, tile:t.tile, w:t.w, h:t.h,
                        // Objects live in shared sprite ATLASES: `atlas`/`thumb` are
                        // {sheet,x,y,w,h,sw,sh} rects. Floors and walls stay whole files
                        // because they're used as repeating patterns.
                        atlas:t.atlas||null, thumbRect:t.thumb||null,
                        url:"/packs/bundled/"+(t.atlas ? t.atlas.sheet : t.file)+assetV, img:null});
    buildTexSelects(); buildObjGrid();

  }

  // Kick off a load the first time a texture is asked for; re-render when it
  // arrives. Returns the entry only once it's actually drawable.
  // Many object entries point at the SAME atlas sheet, so images are cached by
  // URL — otherwise 140 sprites would mean 140 downloads and decodes of 3 files.
  const sheets=new Map();
  function sheetImg(url, onload){
    let im=sheets.get(url);
    if(!im){ im=new Image(); sheets.set(url,im);
      im.onload=()=>{ if(onload) onload(); };
      im.onerror=()=>{ im.broken=true; };
      im.src=url; }
    return im;
  }
  function texGet(id){
    const t=texReg.get(id); if(!t || t.failed) return null;
    if(!t.img){
      if(!t.url) return null;
      t.img=sheetImg(t.url, ()=>render());
    }
    if(t.img.broken){ t.failed=true; return null; }
    return (t.img.complete && t.img.naturalWidth) ? t : null;
  }
  function applyStyle(){
    const st=(map && map.style) || null;
    // byId carries every texture the map actually references, so the engine can
    // resolve a per-shape `floor`/`wall` id without knowing anything about
    // loading. floor/wall stay the map-wide defaults for unstyled shapes.
    const byId={}, want=id=>{ if(id) byId[id]=texGet(id); };
    if(!st || st.mode!=="textured"){
      // NORMAL MODE still needs object sprites — the basic Axebane set is offered
      // here. Hand the engine a tex carrying ONLY byId, so every surface stays
      // classic ink. `null` when the map has no objects at all, which keeps the
      // classic render byte-identical by construction.
      for(const o of (map.objects||[])) want(o.tex);
      tex = Object.keys(byId).length
        ? {objectsOnly:true, floor:null, bg:null, wall:null, bgColor:null, byId} : null;
      return;
    }
    want(st.floor); want(st.wall);
    for(const sh of map.shapes){ want(sh.floor); want(sh.wall); }
    for(const wl of map.walls) want(wl.wall);
    for(const o of (map.objects||[])) want(o.tex);
    tex = { floor: texGet(st.floor), bg: texGet(st.bg), wall: texGet(st.wall), byId,
            bgColor: Object.prototype.hasOwnProperty.call(BG_SOLID, st.bg) ? BG_SOLID[st.bg] : null };
  }

  // ── IndexedDB: pack metadata + the texture blobs we kept ───────────
  const DB="dcc_packs";
  function idb(){ return new Promise((res,rej)=>{
    let r; try{ r=indexedDB.open(DB,1); }catch(e){ return rej(e); }
    r.onupgradeneeded=()=>{ const d=r.result;
      if(!d.objectStoreNames.contains("packs")) d.createObjectStore("packs");
      if(!d.objectStoreNames.contains("files")) d.createObjectStore("files"); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
  function idbTx(store, mode, fn){ return idb().then(d=>new Promise((res,rej)=>{
    const t=d.transaction(store,mode), o=t.objectStore(store); let out;
    out=fn(o); t.oncomplete=()=>res(out && ("result" in out) ? out.result : out);
    t.onerror=()=>rej(t.error); })); }
  const idbPut = (store,k,v)=> idbTx(store,"readwrite",o=>o.put(v,k));
  // One transaction for many blobs — a per-file transaction is the other half of
  // why importing a large pack crawled.
  const idbPutMany = (store,pairs)=> idbTx(store,"readwrite",o=>{ for(const [k,v] of pairs) o.put(v,k); });
  const idbDel = (store,k)  => idbTx(store,"readwrite",o=>o.delete(k));
  const idbGet = (store,k)  => idbTx(store,"readonly", o=>o.get(k));
  const idbAll = (store)    => idbTx(store,"readonly", o=>o.getAll());

  // ── Godot PCK reader (.dungeondraft_pack is a Godot 3 .pck) ────────
  // Header: "GDPC", pack format version, engine major/minor/rev, 16 reserved
  // u32s, then a file count and one entry per file: path length, path,
  // u64 offset, u64 size, 16-byte md5. File data follows at absolute offsets.
  function parsePack(ab){
    const dv=new DataView(ab), u8=new Uint8Array(ab), dec=new TextDecoder();
    if(u8.length<100 || String.fromCharCode(u8[0],u8[1],u8[2],u8[3])!=="GDPC")
      throw new Error("That isn't a Dungeondraft pack (no GDPC header).");
    let o=4; const fmt=dv.getUint32(o,true); o+=4;
    if(fmt!==1 && fmt!==2)
      throw new Error("Unsupported pack format v"+fmt+" (this reads Godot 3 and Godot 4 PCKs).");
    o+=12;                                   // engine major/minor/rev
    let base=0;
    if(fmt===2){                             // Godot 4 adds pack flags + a file base
      const packFlags=dv.getUint32(o,true); o+=4;
      base=Number(dv.getBigUint64(o,true)); o+=8;
      if(packFlags & 1) throw new Error("That pack is encrypted — Dungeondraft can open it, this can't.");
    }
    o+=16*4;                                 // reserved
    const n=dv.getUint32(o,true); o+=4;
    const out=[];
    for(let i=0;i<n;i++){
      const len=dv.getUint32(o,true); o+=4;
      const path=dec.decode(u8.subarray(o,o+len)).replace(/\0+$/,""); o+=len;
      let off=Number(dv.getBigUint64(o,true)); o+=8;
      const size=Number(dv.getBigUint64(o,true)); o+=8;
      o+=16;                                 // md5
      if(fmt===2){ o+=4; off+=base; }        // per-file flags; offsets are base-relative
      if(off>=0 && off+size<=u8.length) out.push({path,off,size});
    }
    return out;
  }
  // Which entries are usable as a floor fill: Dungeondraft's seamless terrain
  // and pattern textures. Objects/walls are sprites, not tiles — a later slice.
  // Floors: terrain/ and patterns/ are the plain seamless tiles. materials/ ships
  // a "<name>_tile" alongside a "<name>_border" — the tile half is a plain
  // repeating texture, the border isn't. Smart tilesets are counted and skipped:
  // they're a GRID of edge/corner variants, so tiling one looks like nonsense.
  const IMGEXT=/\.(webp|png|jpe?g)$/i;
  const TILEABLE=/\/textures\/(terrain|patterns)\/.*\.(webp|png|jpe?g)$|\/textures\/materials\/.*_tile\.(webp|png|jpe?g)$/i;
  // `textures/patterns/normal/` is the NORMAL-MAP half of a pattern: a bump map,
  // not colour art. 2MT gets away with shipping the colour image there verbatim
  // (so it deduped away harmlessly), but Forgotten Adventures ships real normal
  // maps — 30 of them, which imported as 30 lilac "floors" nobody could use.
  const NORMALMAP=/\/textures\/patterns\/normal\//i;
  const TILESET=/\/textures\/tilesets\//i;
  // `..._wall.webp` is Dungeondraft's repeating wall strip. The `_wall_end` caps
  // are excluded by requiring the extension right after "_wall".
  // Anything under textures/walls/ that isn't an end cap. Packs name these
  // inconsistently — "NAME_wall.webp", "basicbuilding_wall - stone.png" — so
  // matching on a "_wall" suffix (as this used to) silently drops whole packs'
  // worth of walls. Mirrors the rule in extract-pack.py.
  const WALLSTRIP=/\/textures\/walls\/.*\.(webp|png|jpe?g)$/i;
  const WALLEND=/_end\.(webp|png|jpe?g)$/i;
  // ── Dungeondraft has more than three texture roots ──────────────────
  // `textures/walls/` is only where the WALL tool's art lives. The PATH tool has
  // its own folder, and cliffs, ledges, shorelines, roads and borders are drawn
  // with the path tool — so a cliff-edge pack puts nearly all its linear art in
  // `textures/paths/` and this importer used to throw the entire folder away.
  // (2MT's own Cave Room Builder loses "Cave Room Builder Ledge" that way, and
  // the Welcome pack loses "Low Wall".) A path texture is the same thing as a
  // wall texture as far as this renderer cares: a horizontal repeating strip at
  // 256 px per cell, so it imports as a wall.
  //
  // `textures/caves/<name>/{floor,wall}.webp` is Dungeondraft's cave asset type
  // — a floor and a wall under a shared folder whose NAME is the asset's name,
  // so the file names alone ("wall.webp") are useless as labels.
  //
  // `textures/portals/` is doors and windows: real placeable sprites.
  const PATHSTRIP=/\/textures\/paths\/.*\.(webp|png|jpe?g)$/i;
  const CAVEWALL =/\/textures\/caves\/[^/]+\/wall\.(webp|png|jpe?g)$/i;
  const CAVEFLOOR=/\/textures\/caves\/[^/]+\/floor\.(webp|png|jpe?g)$/i;
  // `_border` is the non-tiling half of a materials/ pair — its `_tile` twin is
  // already taken as a floor, so this is a deliberate skip, not a miss.
  const BORDER=/_border\.(webp|png|jpe?g)$/i;
  const isWall=p=>(WALLSTRIP.test(p) || PATHSTRIP.test(p) || CAVEWALL.test(p))
                  && !WALLEND.test(p) && !BORDER.test(p);
  const isFloor=p=>(TILEABLE.test(p) || CAVEFLOOR.test(p)) && !BORDER.test(p) && !NORMALMAP.test(p);
  // Which of the three wall folders an entry came from, best first. Packs ship
  // byte-identical copies of the same strip under walls/ AND paths/ (15 of the
  // Welcome pack's 16 paths are exact duplicates), so the copies have to be
  // dropped — see the content dedupe in importPackFile — and this order decides
  // which copy survives, which decides the NAME. caves/ comes last on purpose:
  // its name has to be taken from the folder, and 2MT's Natural Cliffs pack
  // names the same six strips "Dark - Cave Wall 1" there and "Cave Wall 1 - Dark"
  // under paths/, where the other 42 already follow the second style.
  const wallFolder=p=>WALLSTRIP.test(p) ? 0 : PATHSTRIP.test(p) ? 1 : 2;
  const OBJECT=/\/textures\/(objects|portals)\/.*\.(webp|png|jpe?g)$/i;
  // "- Colorable" are greyscale masks for Dungeondraft's colour picker, "- End"
  // are wall end-caps the wall tool consumes, "Demo" is marketing art.
  // …and a whole `colorable64/` folder of them in FA's packs.
  const SKIP_OBJ=/( - Colorable| - End)\.(webp|png|jpe?g)$|Demo\.(webp|png|jpe?g)$|\/colorable\d*\//i;
  // Packs ship their wall kit as loose sprites too — straight runs, corners, half
  // circles, railings. The wall tool draws all of that properly, so they'd just be
  // clutter in the palette. The " - " separator matters: /^Wall\b/ would also eat
  // real props like "Wall buzzsaw" and "Wall spikes".
  const SKIP_WALL_OBJ=/^(Wall|Rail)\s*[-,]\s|^(Inside|Outside)\s+bend\b|Wall\s+End$/i;
  // Big commercial packs run to thousands of sprites. Nothing is decoded at
  // import any more (see imageSize + lazy thumbnails), so this ceiling exists
  // only to bound IndexedDB use, not CPU.
  const MAX_IMPORT_OBJECTS=4000;
  // DOM cells rendered at once; filter to see more. Advanced Mode is at 578 with
  // seven 2MT packs — a cap of 600 was one pack away from silently truncating the
  // palette. Thumbnails are CSS crops of shared atlases, so a cell costs DOM and
  // nothing else; measured ~40 ms to build 578.
  const MAX_GRID_CELLS=1400;
  // Floors/walls: drop the pack-name prefix, which is repeated on every file in
  // a pack ("Dungeon Room Builder - Dark" -> "Dark").
  function packLabel(p){
    // A cave asset is `textures/caves/<NAME>/wall.webp` — the file name is
    // literally "wall", so the label has to come from the parent folder.
    const cave=p.match(/\/textures\/caves\/([^/]+)\/(floor|wall)\.(webp|png|jpe?g)$/i);
    if(cave) return cave[1];
    // This used to cut everything before the first " - ", on the theory that a
    // pack repeats its own name there ("Dungeon Room Builder - Dark"). It does
    // not always: "Cliff Edge - Granite" became "Granite" and, once the
    // "Texture - " prefix was gone, "Dirt - 15x15" became "15x15". The repeated
    // prefix is now found by agreement across the group instead — see
    // stripCommonPrefix. Same cleanup as extract-pack.py's clean().
    let n=p.split("/").pop().replace(/\.(webp|png|jpe?g)$/i,"");
    n=n.replace(/^[a-z0-9]+_/,"");                  // basicbuilding_door - wide
    if(n && n[0]!==n[0].toUpperCase()) n=n[0].toUpperCase()+n.slice(1);
    n=n.replace(/^Texture\s*-\s*/i,"");
    n=n.replace(/_(wall|path|tile)$/i,"");
    n=n.replace(/\s*-\s*Convex$/i,"");
    n=n.replace(/\s*[-(]\s*\d+x\d+\s*\)?$/,"");    // "- 15x15" is the tile size
    return n.trim() || p.split("/").pop(); }
  // Floors and walls in one pack usually all carry the pack's own name up front.
  // Strip it only when MOST of the group agrees on it, so a lone
  // "Cliff Edge - Granite" keeps the half of its name that means something.
  function stripCommonPrefix(list){
    if(list.length<4) return;                       // too few to call it a pattern
    const pre={};
    for(const t of list){ const m=t.name.match(/^(.+?)\s-\s/); if(m) pre[m[1]]=(pre[m[1]]||0)+1; }
    const best=Object.keys(pre).sort((a,b)=>pre[b]-pre[a])[0];
    if(!best || pre[best] < 3 || pre[best] < list.length*0.6) return;
    for(const t of list){
      if(t.name.indexOf(best+" - ")!==0) continue;
      const rest=t.name.slice(best.length+3).trim();
      if(rest) t.name=rest;
    }
  }
  // Objects keep their FULL name — stripping to the first " - " would turn
  // "Wall - Straight (3x2)" into "Straight (3x2)", which both reads worse and
  // hides the prefix SKIP_WALL_OBJ needs to match on.
  function objLabel(p){ return p.split("/").pop().replace(/\.(webp|png|jpe?g)$/i,"")
    .replace(/^[a-z0-9]+_/,""); }

  // A pack wall strip is a wide image with the wall band somewhere inside a lot
  // of transparent padding. Crop to the opaque rows so the renderer can stretch
  // the band to an exact world thickness, and derive that thickness + the repeat
  // length from Dungeondraft's fixed 256 px per grid cell.
  function cropWallStrip(blob){
    return new Promise(res=>{
      const u=URL.createObjectURL(blob), im=new Image();
      im.onload=()=>{
        const w=im.naturalWidth, h=im.naturalHeight;
        const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(im,0,0);
        let d; try{ d=cv.getContext("2d").getImageData(0,0,w,h).data; }
        catch(e){ URL.revokeObjectURL(u); return res(null); }
        let top=-1, bot=-1, n=0;
        for(let y=0;y<h;y++){ let sum=0; n=0;
          for(let x=0;x<w;x+=4){ sum+=d[(y*w+x)*4+3]; n++; }
          if(n && sum/n>8){ if(top<0) top=y; bot=y; } }
        if(top<0){ URL.revokeObjectURL(u); return res(null); }
        const ch=bot-top+1;
        const c2=document.createElement("canvas"); c2.width=w; c2.height=ch;
        c2.getContext("2d").drawImage(im, 0, -top);
        c2.toBlob(b=>{ URL.revokeObjectURL(u);
          res(b ? {blob:b, thick:ch/256, tile:w/256} : null); }, "image/png");
      };
      im.onerror=()=>{ URL.revokeObjectURL(u); res(null); };
      im.src=u;
    });
  }

  async function importPackFile(file){
    toast("Reading "+file.name+"…");
    const buf=await file.arrayBuffer();
    let entries;
    try { entries=parsePack(buf); }
    catch(e){ toast(e.message||"Couldn't read that pack."); return; }
    let meta={name:file.name.replace(/\.dungeondraft_pack$/i,""), id:null};
    const j=entries.find(e=>/\/pack\.json$/i.test(e.path));
    if(j){ try{ meta=Object.assign(meta, JSON.parse(new TextDecoder().decode(new Uint8Array(buf,j.off,j.size)))); }catch(e){} }
    const packId="pack:"+(meta.id || meta.name).replace(/[^A-Za-z0-9_-]+/g,"");
    const allObjs=entries.filter(e=>OBJECT.test(e.path) && !SKIP_OBJ.test(e.path));
    let objs=allObjs.filter(e=>!SKIP_WALL_OBJ.test(objLabel(e.path)));
    const wallKit=allObjs.length-objs.length;
    let dropped=0;
    if(objs.length>MAX_IMPORT_OBJECTS){ dropped=objs.length-MAX_IMPORT_OBJECTS; objs=objs.slice(0,MAX_IMPORT_OBJECTS); }
    const tilesets=entries.filter(e=>TILESET.test(e.path)).length;
    // A pack that draws with the path tool keeps its cliffs and walls in paths/.
    // Some ALSO ship a caves/ brush whose wall/floor is the SAME art at a lower,
    // blend-edged resolution: 2MT's Natural Walls has caves/"Dark - Cave Wall 1"
    // that is the paths/ strip "Cave Wall 1 - Dark" re-cut. Those are not
    // byte-identical, so the content dedupe below can't collapse them, and the
    // pack ends up with six near-duplicate cave walls (and their floors named
    // after the wall folder). Drop a caves/ asset when a paths/ strip carries the
    // same set of words — but keep a lone cave with no path twin (a "Sea Cave"),
    // which is a genuine, unique asset. FA has no caves/, so this never fires
    // there. Mirrors the same rule in pack-inspector.html and packfolders.js.
    const wordKey=s=>s.toLowerCase().replace(/\.(webp|png|jpe?g)$/,"")
                      .split(/[^a-z0-9]+/i).filter(Boolean).sort().join(" ");
    const pathKeys=new Set(entries.filter(e=>PATHSTRIP.test(e.path)).map(e=>wordKey(packLabel(e.path))));
    const caveDupe=e=>(CAVEWALL.test(e.path)||CAVEFLOOR.test(e.path)) && pathKeys.has(wordKey(packLabel(e.path)));
    const caveDupes=entries.filter(e=>caveDupe(e) && IMGEXT.test(e.path)).length;
    // Wall strips come from three folders and packs ship byte-identical copies
    // across them, so take walls/ first, then caves/, then paths/ — the order
    // decides which copy's id ends up in saved maps.
    const strips=entries.filter(e=>isWall(e.path) && !caveDupe(e))
                        .sort((a,b)=>wallFolder(a.path)-wallFolder(b.path));
    const tiles=entries.filter(e=>isFloor(e.path) && !caveDupe(e)).concat(strips).concat(objs);
    // Anything left over that is an image under textures/ matched no rule at
    // all. That is how the paths/ folder went missing for months, so the import
    // report now names the folders rather than staying quiet about them.
    const claimed=new Set(tiles.map(e=>e.path));
    const orphanDirs={};
    for(const e of entries){
      if(claimed.has(e.path) || !IMGEXT.test(e.path)) continue;
      if(TILESET.test(e.path) || WALLEND.test(e.path) || BORDER.test(e.path)) continue;
      if(NORMALMAP.test(e.path)) continue;
      if(caveDupe(e)) continue;                               // caves/ twin of a paths/ strip
      if(OBJECT.test(e.path)) continue;                       // colorable / demo / wall kit
      const n=e.path.replace(/^res:\/\//,"").replace(/^packs\/[^/]+\//,"");
      const d=n.indexOf("/")<0 ? "(root)" : n.slice(0, n.lastIndexOf("/")).split("/").slice(0,2).join("/");
      if(!/^textures\//.test(d)) continue;                    // preview.png etc.
      orphanDirs[d]=(orphanDirs[d]||0)+1;
    }
    if(!tiles.length){ toast("No usable textures in that pack."); return; }
    const normals=entries.filter(e=>NORMALMAP.test(e.path) && IMGEXT.test(e.path)).length;
    const made=[], seen=new Set(), skip={dupe:0, unreadable:0};
    // Everything dedupes ACROSS folders by CONTENT. The same strip appears under
    // walls/ and paths/ with a different name in some packs and different
    // capitalisation in others, so neither the name nor the size alone is a
    // reliable test — but the bytes are, and comparing two 100 KB buffers costs
    // nothing next to decoding one.
    //
    // This crosses KINDS on purpose: 2MT's Natural Walls and Cliffs ships all 48
    // of its path strips a second time under textures/objects/, byte for byte,
    // which is why every cliff and ledge in that pack turned up in the object
    // palette. Floors and walls are collected first, so the strip wins and the
    // redundant sprite goes. Two genuinely different props cannot be byte
    // identical, so nothing real is ever merged. The trade is that a strip can
    // no longer also be hand-stamped as a sprite — the Edge and corner pieces,
    // which are unique files, are untouched.
    const bySize=new Map();              // size → [offsets already accepted]
    const sameBytes=(a,b,n)=>{
      const x=new Uint8Array(buf,a,n), y=new Uint8Array(buf,b,n);
      for(let i=0;i<n;i++) if(x[i]!==y[i]) return false;
      return true; };
    let batch=[], done=0;
    const flush=async()=>{ if(batch.length){ await idbPutMany("files", batch); batch=[]; } };
    for(const e of tiles){
      // Packs often ship the same tile under both terrain/ and patterns/ —
      // keep one entry per distinct file so the picker isn't full of duplicates.
      if(OBJECT.test(e.path)){        // cheap guard first: same name, same size
        const k=objLabel(e.path).toLowerCase()+"|"+e.size;
        if(seen.has(k)){ skip.dupe++; continue; }
        seen.add(k);
      }
      let bucket=bySize.get(e.size);
      if(bucket && bucket.some(off=>sameBytes(off, e.off, e.size))){ skip.dupe++; continue; }
      if(!bucket){ bucket=[]; bySize.set(e.size, bucket); }
      bucket.push(e.off);
      const bytes=new Uint8Array(buf, e.off, e.size);
      const id=packId+"/"+e.path;
      if(OBJECT.test(e.path)){
        // Header-only size read: nothing is decoded and no thumbnail is built
        // here. Thumbnails are made on first display and cached (ensureThumb).
        const sz=imageSize(bytes);
        if(!sz || !sz.w || !sz.h){ skip.unreadable++; continue; }
        batch.push([id, new Blob([bytes], {type:mimeOf(e.path)})]);
        made.push({id, name:objLabel(e.path), kind:"object",
                   w:+(sz.w/256).toFixed(3), h:+(sz.h/256).toFixed(3), pack:packId});
      } else if(isWall(e.path)){
        const cr=await cropWallStrip(new Blob([bytes], {type:mimeOf(e.path)}));
        if(!cr){ skip.unreadable++; continue; }
        batch.push([id, cr.blob]);
        made.push({id, name:packLabel(e.path), kind:"wall", thick:cr.thick, tile:cr.tile, pack:packId});
      } else {
        const blob=new Blob([bytes], {type:mimeOf(e.path)});
        batch.push([id, blob]);
        made.push({id, name:packLabel(e.path), kind:"floor", cells:await tileCells(blob), pack:packId});
      }
      if(batch.length>=200){ await flush(); }
      if(++done % 250 === 0) toast("Importing "+meta.name+"… "+done+"/"+tiles.length);
    }
    await flush();
    stripCommonPrefix(made.filter(m=>m.kind==="floor"));
    stripCommonPrefix(made.filter(m=>m.kind==="wall"));
    await idbPut("packs", packId, {id:packId, name:meta.name, textures:made});
    registerPack({id:packId, name:meta.name, textures:made});
    await refreshPackList();
    buildTexSelects(); buildObjGrid();
    const cnt=k=>made.filter(m=>m.kind===k).length;
    const bits=[];
    if(cnt("floor")) bits.push(cnt("floor")+" floor"+(cnt("floor")===1?"":"s"));
    if(cnt("wall"))  bits.push(cnt("wall")+" wall"+(cnt("wall")===1?"":"s"));
    if(cnt("object"))bits.push(cnt("object")+" object"+(cnt("object")===1?"":"s"));
    const notes=[];
    if(dropped) notes.push(dropped+" over the "+MAX_IMPORT_OBJECTS+" cap");
    if(skip.dupe) notes.push(skip.dupe+" duplicate");
    if(skip.unreadable) notes.push(skip.unreadable+" unreadable");
    if(wallKit) notes.push(wallKit+" wall-kit sprites");
    if(tilesets) notes.push(tilesets+" smart tilesets (not plain tiling textures)");
    if(normals) notes.push(normals+" normal maps");
    if(caveDupes) notes.push(caveDupes+" cave-brush duplicates");
    const od=Object.keys(orphanDirs).sort((a,b)=>orphanDirs[b]-orphanDirs[a]);
    if(od.length) notes.push(od.map(d=>orphanDirs[d]+" in "+d).join(", ")+" (no rule matches)");
    toast("Loaded "+meta.name+" — "+bits.join(" + ")
          + (notes.length ? " (skipped "+notes.join(", ")+")" : "")+".");
  }
  // Dungeondraft draws terrain at 256 px per grid cell, so the tile's cell span
  // is just its width / 256 (falling back to 4 for anything unexpected).
  function tileCells(blob){
    return new Promise(res=>{
      const u=URL.createObjectURL(blob), im=new Image();
      im.onload=()=>{ URL.revokeObjectURL(u); res(Math.max(1, Math.round(im.naturalWidth/256)) || 4); };
      im.onerror=()=>{ URL.revokeObjectURL(u); res(4); };
      im.src=u;
    });
  }
  // Read an object sprite's native size (Dungeondraft draws at 256 px/cell) and
  // bake a small palette thumbnail, so importing a large pack doesn't mean
  // decoding hundreds of full-resolution sprites just to draw the picker.
  const MIME={webp:"image/webp", png:"image/png", jpg:"image/jpeg", jpeg:"image/jpeg"};
  const mimeOf=p=>MIME[(p.split(".").pop()||"").toLowerCase()] || "application/octet-stream";

  // Pixel dimensions straight out of the file header — no decode, no canvas.
  // This is the difference between importing a 71 MB pack in a second and
  // decoding several thousand sprites one at a time.
  //   PNG  8-byte signature, then IHDR: two big-endian u32s at 16 and 20
  //   WebP RIFF….WEBP, then a VP8X / VP8L / VP8 chunk, each with its own layout
  //   JPEG walk the segment markers to the first SOFn
  function imageSize(b){
    if(b.length>24 && b[0]===0x89 && b[1]===0x50 && b[2]===0x4E && b[3]===0x47){
      const dv=new DataView(b.buffer, b.byteOffset, b.length);
      return {w:dv.getUint32(16,false), h:dv.getUint32(20,false)};
    }
    if(b.length>30 && b[0]===0x52&&b[1]===0x49&&b[2]===0x46&&b[3]===0x46
       && b[8]===0x57&&b[9]===0x45&&b[10]===0x42&&b[11]===0x50){
      const tag=String.fromCharCode(b[12],b[13],b[14],b[15]);
      if(tag==="VP8X") return {w:1+(b[24]|b[25]<<8|b[26]<<16), h:1+(b[27]|b[28]<<8|b[29]<<16)};
      if(tag==="VP8L"){ const v=(b[21]|b[22]<<8|b[23]<<16|b[24]<<24)>>>0;
        return {w:1+(v&0x3FFF), h:1+((v>>>14)&0x3FFF)}; }
      if(tag==="VP8 ") return {w:(b[26]|b[27]<<8)&0x3FFF, h:(b[28]|b[29]<<8)&0x3FFF};
    }
    if(b.length>4 && b[0]===0xFF && b[1]===0xD8){
      let i=2;
      while(i+9<b.length){
        if(b[i]!==0xFF){ i++; continue; }
        const m=b[i+1], len=(b[i+2]<<8)|b[i+3];
        if(m>=0xC0 && m<=0xCF && m!==0xC4 && m!==0xC8 && m!==0xCC)
          return {h:(b[i+5]<<8)|b[i+6], w:(b[i+7]<<8)|b[i+8]};
        if(len<2) break;
        i+=2+len;
      }
    }
    return null;
  }
  // Build a palette thumbnail from a full-size sprite. Called lazily, once, when
  // a cell first scrolls into view — never during import.
  function makeThumb(blob){
    return new Promise(res=>{
      const u=URL.createObjectURL(blob), im=new Image();
      im.onload=()=>{
        const sc=Math.min(1, 96/Math.max(im.naturalWidth, im.naturalHeight));
        const cv=document.createElement("canvas");
        cv.width=Math.max(1,Math.round(im.naturalWidth*sc));
        cv.height=Math.max(1,Math.round(im.naturalHeight*sc));
        cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
        cv.toBlob(t=>{ URL.revokeObjectURL(u); res(t); }, "image/webp", 0.8);
      };
      im.onerror=()=>{ URL.revokeObjectURL(u); res(null); };
      im.src=u;
    });
  }
  function objectMeta(blob){
    return new Promise(res=>{
      const u=URL.createObjectURL(blob), im=new Image();
      im.onload=()=>{
        const w=im.naturalWidth, h=im.naturalHeight;
        const sc=Math.min(1, 96/Math.max(w,h));
        const cv=document.createElement("canvas");
        cv.width=Math.max(1,Math.round(w*sc)); cv.height=Math.max(1,Math.round(h*sc));
        cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
        cv.toBlob(t=>{ URL.revokeObjectURL(u);
          res({w:+(w/256).toFixed(3), h:+(h/256).toFixed(3), thumb:t}); }, "image/webp", 0.8);
      };
      im.onerror=()=>{ URL.revokeObjectURL(u); res(null); };
      im.src=u;
    });
  }
  function registerPack(p){
    for(const t of p.textures){
      // The name used to be "<pack> · <texture>". With a pack called "2MT Natural
      // Walls and Cliffs" that is 32 characters of identical prefix in front of
      // every entry, in a picker row about 180 px wide — so the picker showed a
      // column of "2MT Natural Walls and Cli…" and nothing else. The pack name is
      // carried on `packName` and shown ONCE, as the picker's group heading.
      texReg.set(t.id, {id:t.id, name:t.name, kind:t.kind||"floor", cells:t.cells,
                        thick:t.thick, tile:t.tile, w:t.w, h:t.h,
                        pack:p.id, packName:p.name, imported:true, url:null, img:null, lazy:true});
    }
  }
  // Mint an imported object's THUMBNAIL blob URL and drop it straight into the
  // <img> that asked for it. This has to be independent of texGet: texGet only
  // runs for textures the MAP references, so before this existed an imported
  // prop's thumbnail only appeared once you had already placed one — which is a
  // useless order to discover art in.
  function ensureThumb(t, el){
    if(t.thumb){ if(el) el.src=t.thumb; return; }
    if(String(t.id).indexOf("pack:")!==0) return;        // bundled art uses the atlas
    if(t._thumbWait){ if(el) t._thumbWait.push(el); return; }   // one read, many waiters
    t._thumbWait = el ? [el] : [];
    const finish=(url)=>{ const w=t._thumbWait; t._thumbWait=null;
      if(!url) return; t.thumb=url; for(const e of (w||[])) if(e) e.src=url; };
    const key=t.id+"#thumb";
    idbGet("files", key).then(b=>{
      if(b) return finish(URL.createObjectURL(b));
      // Not cached: build it once from the full sprite and keep it. Import
      // deliberately doesn't do this — decoding thousands of sprites up front is
      // what made a large pack take minutes.
      return idbGet("files", t.id).then(full=>{
        if(!full) return finish(null);
        return makeThumb(full).then(tb=>{
          if(!tb) return finish(null);
          idbPut("files", key, tb).catch(()=>{});
          finish(URL.createObjectURL(tb));
        });
      });
    }).catch(()=>finish(null));
  }
  // Pack textures live as blobs; mint the full-size object URL the first time the
  // map actually uses one.
  const _texGet = texGet;
  texGet = function(id){
    const t=texReg.get(id);
    if(t && t.lazy && !t.url){
      t.lazy=false;
      idbGet("files", id).then(b=>{ if(b){ t.url=URL.createObjectURL(b); render(); } else { t.failed=true; } })
                         .catch(()=>{ t.failed=true; });
      return null;
    }
    return _texGet(id);
  };

  async function loadPacks(){
    let packs=[]; try{ packs=await idbAll("packs")||[]; }catch(e){ return; }
    packs.forEach(registerPack);
    await refreshPackList();
    buildTexSelects(); buildObjGrid();
  }
  async function refreshPackList(){
    const el=$("packList"); if(!el) return;
    let packs=[]; try{ packs=await idbAll("packs")||[]; }catch(e){}
    el.innerHTML="";
    for(const p of packs){
      const d=document.createElement("div"); d.className="pk";
      d.innerHTML='<span></span><button title="Remove from this browser">&times;</button>';
      d.querySelector("span").textContent=p.name+" ("+p.textures.length+")";
      d.querySelector("button").onclick=()=>removePack(p);
      el.appendChild(d);
    }
  }
  async function removePack(p){
    for(const t of p.textures){ try{ await idbDel("files", t.id); }catch(e){}
      try{ await idbDel("files", t.id+"#thumb"); }catch(e){}   // cached lazily, may or may not exist
      texReg.delete(t.id);
      for(const o of (map.objects||[])) if(o.tex===t.id) o.tex="";
    }
    try{ await idbDel("packs", p.id); }catch(e){}
    const st=map.style||{};
    if(st.floor && st.floor.indexOf(p.id)===0) st.floor=DEFAULT_STYLE().floor;
    if(st.wall  && st.wall.indexOf(p.id)===0)  st.wall =DEFAULT_STYLE().wall;
    await refreshPackList(); buildTexSelects(); buildObjGrid(); commit();
    toast("Removed "+p.name+".");
  }

  // ── selects ───────────────────────────────────────────────────────
  // New shapes/walls CAPTURE the current picker choice, so changing the picker
  // afterwards doesn't restyle what you already drew. Generated rooms are left
  // unstamped on purpose — they inherit map.style, so one picker change restyles
  // a whole generated dungeon at once.
  function stampStyle(o, kind){
    const st=map.style||{};
    if(st.mode!=="textured") return o;
    const p=pendingStyle();
    // Deco shapes have no floor, but they DO take the wall texture now, so they
    // get stamped with it like any other shape.
    if(kind==="shape"){ o.wall=p.wall||""; if(!o.deco) o.floor=p.floor||""; }
    else o.wall=p.wall||"";
    return o;
  }
  // The Floor / Walls pickers edit the SELECTED room (or interior wall) when
  // there is one, and the map-wide default otherwise.
  function styleTarget(){
    if(sel==null) return null;
    const o=objAt(sel); if(!o) return null;
    if(o.kind==="shape" && !o.obj.deco) return {kind:"shape", obj:o.obj};
    if(o.kind==="wall") return {kind:"wall", obj:o.obj};
    return null;
  }
  function setSel(v){ sel=v; syncStyleScope(); syncZUI(); syncLightUI(); syncShadowUI(); }

  // Style scope, in priority order:
  //   • a DRAWING tool is active  -> the pickers set `pending`, the style that new
  //     shapes get stamped with. map.style is untouched, so you can choose
  //     materials for the next room WITHOUT restyling a generated dungeon.
  //   • Select + something selected -> edit that object in place.
  //   • Select + nothing selected   -> edit map.style, the inherited default that
  //     every unstamped (generated) room follows.
  // `pending` is session-only on purpose: it's a "what am I about to draw with"
  // preference, not part of the map.
  let pending = null;
  function pendingStyle(){
    if(!pending){ const st=map.style||{}; pending={floor:st.floor||"", wall:st.wall||""}; }
    return pending;
  }
  function styleScope(){
    if(tool!=="select") return {kind:"new"};
    const t=styleTarget();
    return t ? {kind:"sel", target:t} : {kind:"default"};
  }
  function syncZUI(){
    const arr = sel && ({shape:map.shapes,wall:map.walls,door:map.doors,stair:map.stairs,object:map.objects})[sel.kind];
    const on = !!(arr && arr.length>1);
    if($("toFront")) $("toFront").disabled=!on;
    if($("toBack"))  $("toBack").disabled=!on;
  }
  // Draw order IS z-order: later in the array paints on top. For rooms that
  // decides whose floor texture wins in an overlap and which wall strokes sit
  // above; for objects it is the usual stacking. The inset-union wall erase is
  // order-independent, so raising a room never changes which walls survive.
  function reorderSel(toFront){
    if(sel==null) return;
    const o=objAt(sel); if(!o) return;
    const arr=({shape:map.shapes,wall:map.walls,door:map.doors,stair:map.stairs,object:map.objects})[sel.kind];
    if(!arr || arr.length<2) return;
    pushHistory();
    const item=arr.splice(sel.idx,1)[0];
    if(toFront) arr.push(item); else arr.unshift(item);
    markGeom();
    setSel({kind:sel.kind, idx: toFront ? arr.length-1 : 0});
    commit();
    toast(toFront ? "Brought to front" : "Sent to back");
  }

  // ── swatch pickers ────────────────────────────────────────────────
  // Native <select> can't show art, and you can't judge a floor or a wall by its
  // name. These are custom pickers: a button showing the current swatch, and one
  // shared position:fixed popup listing every option WITH its swatch. Fixed
  // rather than absolute because the sidebar scrolls and would clip it.
  const BG_LIST=[{id:"bg:theme", name:"Classic (theme)", col:"#efe8d7"},
                 {id:"bg:slate", name:"Slate (solid)",   col:"#171a21"},
                 {id:"bg:black", name:"Black (solid)",   col:"#08080a"},
                 {id:"bg:parch", name:"Parchment (solid)", col:"#efe8d7"}];
  const PICKERS={ wall:{el:"wallSel", none:"Classic ink"},
                  floor:{el:"floorSel", none:"Classic parchment"},
                  bg:{el:"bgSel", none:null} };

  // Paint a texture's swatch onto an element: an atlas crop for bundled art, a
  // lazily-built thumbnail for imported art, a flat colour for the solid bgs.
  function paintSwatch(el, id){
    el.style.backgroundImage=""; el.style.backgroundColor="#0f0f13"; el.style.backgroundSize="";
    if(!id){ el.style.backgroundColor="#f4efe3"; return; }              // classic
    const solid=BG_LIST.find(o=>o.id===id);
    if(solid){ el.style.backgroundColor=solid.col; return; }
    const t=texReg.get(id); if(!t) return;
    const r=t.thumbRect;
    if(r){
      const W=34, H=22, f=Math.max(W/r.w, H/r.h);                        // cover the swatch
      el.style.backgroundImage='url("/packs/bundled/'+r.sheet+assetV+'")';
      el.style.backgroundSize=(r.sw*f)+"px "+(r.sh*f)+"px";
      el.style.backgroundPosition=(-r.x*f + (W-r.w*f)/2)+"px "+(-r.y*f + (H-r.h*f)/2)+"px";
    } else {
      ensureThumb(t, {set src(v){ el.style.backgroundImage='url("'+v+'")';
                                  el.style.backgroundSize="cover"; }});
    }
  }
  function pickList(kind){
    const out=[];
    if(kind==="bg"){
      out.push({label:"", list:BG_LIST.map(o=>({id:o.id, name:o.name}))});
      // any floor tile also makes a good exterior
    } else if(PICKERS[kind].none!=null){
      out.push({label:"", list:[{id:"", name:PICKERS[kind].none}]});
    }
    const want = kind==="bg" ? "floor" : kind;
    for(const p of bundledPacks){
      const list=[...texReg.values()].filter(t=>t.kind===want && t.pack===p.id)
                                     .map(t=>({id:t.id, name:t.name}));
      if(list.length) out.push({label:p.name, list});
    }
    // One group per imported pack, headed by the pack's name — same treatment the
    // bundled packs get. A single "Imported packs" bucket could not say which
    // pack a texture came from, which is why the name carried the prefix.
    const imported=[...texReg.values()].filter(t=>t.kind===want && String(t.id).indexOf("pack:")===0);
    const order=[], byPack=new Map();
    for(const t of imported){
      const k=t.pack||"pack:?";
      if(!byPack.has(k)){ byPack.set(k, {label:t.packName||"Imported pack", list:[]}); order.push(k); }
      byPack.get(k).list.push({id:t.id, name:t.name});
    }
    for(const k of order) out.push(byPack.get(k));
    return out;
  }
  function currentPick(kind){
    const st=map.style||{}, sc=styleScope();
    if(kind==="bg") return st.bg||"bg:theme";
    if(sc.kind==="new") return pendingStyle()[kind]||"";
    if(sc.kind==="sel"){ const o=sc.target.obj;
      return o[kind]!==undefined ? o[kind] : (st[kind]||""); }
    return st[kind]||"";
  }
  function labelFor(kind, id){
    if(!id) return PICKERS[kind].none || "—";
    const solid=BG_LIST.find(o=>o.id===id); if(solid) return solid.name;
    const t=texReg.get(id);
    return t ? t.name : "(missing — load its pack)";
  }
  function buildTexSelects(){
    for(const kind in PICKERS){
      const b=$(PICKERS[kind].el); if(!b) continue;
      const id=currentPick(kind);
      const lbl=labelFor(kind,id);
      b.querySelector(".pl").textContent=lbl;
      b.title=lbl;                       // the button is narrow; hover for the rest
      paintSwatch(b.querySelector(".sw"), id);
    }
    const sc=styleScope();
    const fs=$("floorSel");
    if(fs) fs.disabled = !!(sc.kind==="sel" && sc.target.kind==="wall");
  }
  let pickOpen=null, pickScrollTop=0;
  function closePicker(){ const p=$("pickPop"); if(p) p.hidden=true; pickOpen=null; }
  function openPicker(kind){
    const btn=$(PICKERS[kind].el), pop=$("pickPop");
    if(!btn || !pop || btn.disabled) return;
    if(pickOpen===kind){ closePicker(); return; }
    pickOpen=kind;
    // The popup is position:fixed, so it must close when the sidebar scrolls —
    // but scroll events are delivered a frame LATE. Clicking a picker that had
    // to be scrolled into view therefore opened it and then immediately shut it
    // again on the stale event. Remember where we were and only close on a real
    // move. (Only started biting once the sidebar grew tall enough to scroll.)
    const sb0=document.querySelector(".sidebar");
    pickScrollTop = sb0 ? sb0.scrollTop : 0;
    const cur=currentPick(kind);
    pop.innerHTML="";
    for(const g of pickList(kind)){
      if(g.label){ const h=document.createElement("div"); h.className="gl"; h.textContent=g.label; pop.appendChild(h); }
      for(const o of g.list){
        const r=document.createElement("button"); r.type="button";
        r.className="opt"+(o.id===cur?" on":"");
        const sw=document.createElement("span"); sw.className="sw";
        const nm=document.createElement("span"); nm.textContent=o.name;
        r.title=(g.label ? g.label+" · " : "")+o.name;
        r.appendChild(sw); r.appendChild(nm);
        paintSwatch(sw, o.id);
        r.onclick=()=>{ closePicker(); setStyleKey(kind, o.id); };
        pop.appendChild(r);
      }
    }
    const rc=btn.getBoundingClientRect();
    pop.hidden=false;
    const below=window.innerHeight-rc.bottom-12, above=rc.top-12;
    const h=Math.min(340, Math.max(below, above));
    // Pinning the popup to the button's width meant every imported texture read
    // as "Texture - Dirt - Dark - D…". Nothing requires it to match: it is
    // position:fixed and free to overhang the canvas. Take up to 420 px, or
    // whatever room is left, and shift left rather than run off a narrow screen.
    const w=Math.max(rc.width, Math.min(420, window.innerWidth-16));
    const left=Math.max(8, Math.min(rc.left, window.innerWidth-8-w));
    pop.style.width=w+"px";
    pop.style.left=left+"px";
    pop.style.maxHeight=h+"px";
    pop.style.top = (below>=Math.min(340,above) ? rc.bottom+4 : Math.max(8, rc.top-4-h))+"px";
  }
  function setStyleKey(kind, val){
    if(kind==="bg"){ map.style.bg=val; commit(); buildTexSelects(); return; }
    const sc=styleScope();
    if(sc.kind==="new"){ pendingStyle()[kind]=val; syncStyleScope(); return; }   // map untouched
    if(sc.kind==="sel"){ pushHistory(); sc.target.obj[kind]=val; commit(); syncStyleScope(); return; }
    map.style[kind]=val; pendingStyle()[kind]=val;   // default and "next draw" stay in step
    commit(); syncStyleScope();
  }
  function syncStyleScope(){
    // The visible hint paragraphs were removed by request. The scope they
    // described is still real — a picker edits the selection, the next shape, or
    // the map default — so it lives on as the panel's tooltip rather than
    // disappearing entirely.
    const el=$("advBody"); if(!el) return;
    const sc=styleScope();
    el.title =
      sc.kind==="new"  ? "Setting the style for what you draw next — the rest of the map is untouched"
    : sc.kind==="sel"  ? ("Editing the selected "+(sc.target.kind==="shape"?"room":"wall")+" — Esc to edit defaults again")
    :                    "Editing the default for new rooms (and any unstyled ones)";
    const fs=$("floorSel");
    if(fs) fs.disabled = !!(sc.kind==="sel" && sc.target.kind==="wall");
    buildTexSelects();
  }

  // ── object palette ────────────────────────────────────────────────
  let armedObj=null;                       // texture id armed for placement
  // How the NEXT object will be placed. The ghost preview under the cursor draws
  // with these, and [ ] X + − edit them, so a prop can be turned and sized before
  // it is committed rather than placed-then-fixed. Reset when a different sprite
  // is armed (a carried-over size means nothing across a different base size),
  // kept while the same one stays armed so a rotated run can be laid in one go.
  let armRot=0, armScale=1, armFlip=false;
  let ghostPt=null;                        // world position of the cursor, or null
  function resetArm(){ armRot=0; armScale=1; armFlip=false; }
  let ghostRaf=0;
  function ghostRender(){ if(ghostRaf) return;
    ghostRaf=requestAnimationFrame(()=>{ ghostRaf=0; renderGhostOnly(); }); }
  let thumbObs=null;
  function observeThumb(el, id){
    if(!("IntersectionObserver" in window)){ const t=texReg.get(id); if(t) ensureThumb(t, el); return; }
    if(!thumbObs) thumbObs=new IntersectionObserver(es=>{
      for(const en of es){ if(!en.isIntersecting) continue;
        thumbObs.unobserve(en.target);
        const t=texReg.get(en.target.dataset.tid); if(t) ensureThumb(t, en.target); }
    }, {root:$("objGrid"), rootMargin:"150px"});
    el.dataset.tid=id;
    thumbObs.observe(el);
  }
  function buildObjGrid(){
    const g=$("objGrid"); if(!g) return;
    // Switching mode can hide whatever was armed — disarm it rather than leave a
    // loaded cursor pointing at a sprite that is no longer in the palette.
    if(armedObj){ const a=texReg.get(armedObj);
      const im=String(armedObj).indexOf("pack:")===0;
      const ok = a && (advOn() ? (im || !a.basic) : (!im && !!a.basic));
      if(!ok){ armedObj=null; ghostPt=null; resetArm(); if(tool==="object") setTool("select"); } }
    if(thumbObs){ thumbObs.disconnect(); thumbObs=null; }
    const q=(($("objFilter")||{}).value||"").trim().toLowerCase();
    g.innerHTML="";
    let n=0;
    // Two DISJOINT sets. Normal mode offers the `basic` bundled art only;
    // Advanced Mode offers everything else — the CC BY-NC packs and anything the
    // user imported. Placed objects are untouched either way: this filters the
    // palette, not the map, so a map built in one mode still renders in the other.
    const adv=advOn();
    const isImported=t=>String(t.id).indexOf("pack:")===0;
    const inMode=t=> adv ? (isImported(t) || !t.basic) : (!isImported(t) && !!t.basic);
    let all=[...texReg.values()].filter(t=>t.kind==="object" && inMode(t));
    // Pack filter: "all", "default" (everything that ships with the tool, i.e.
    // not imported) or one pack id. Rebuilt from THIS list, so the options only
    // ever offer packs that are actually available in the current mode.
    buildPackFilter(all, isImported);
    if(objPack==="default")   all=all.filter(t=>!isImported(t));
    else if(objPack!=="all")  all=all.filter(t=>t.pack===objPack);
    // Imported packs come FIRST. They're registered after the bundled set, so in
    // plain insertion order a freshly imported pack lands ~215 cells down and
    // reads as "nothing happened".
    for(const t of all.filter(isImported).concat(all.filter(t=>!isImported(t)))){
      if(q && (t.name+" "+(t.packName||"")).toLowerCase().indexOf(q)<0) continue;
      const b=document.createElement("button");
      // No group headings in the grid, so the tooltip is the only place the pack
      // name can appear — unlike the pickers, which head each group with it.
      b.title=(t.packName ? t.packName+" · " : "")+t.name+"  ("+(t.w||1)+"×"+(t.h||1)+" cells)";
      if(t.id===armedObj) b.className="on";
      const r=t.thumbRect;
      if(r){
        // Crop the sprite out of the shared thumb atlas with background-position —
        // one image request for the whole palette. The actual pixel size is applied
        // in sizeObjThumbs() once the grid has been laid out and a cell has a width.
        const d=document.createElement("span"); d.className="th";
        d.style.backgroundImage='url("/packs/bundled/'+r.sheet+assetV+'")';
        d.dataset.r=[r.x,r.y,r.w,r.h,r.sw,r.sh].join(",");
        b.appendChild(d);
      } else {
        const im=document.createElement("img");
        im.loading="lazy"; im.alt="";
        if(t.thumb) im.src=t.thumb;
        else observeThumb(im, t.id);       // imported: decoded on first scroll into view
        b.appendChild(im);
      }
      b.onclick=()=>{ const was=armedObj;
        armedObj = (armedObj===t.id) ? null : t.id;
        if(armedObj!==was) resetArm();
        ghostPt=null;
        setTool(armedObj ? "object" : "select"); buildObjGrid(); };
      g.appendChild(b);
      if(++n>=MAX_GRID_CELLS) break;
    }
    if(n>=MAX_GRID_CELLS){
      const more=document.createElement("div"); more.className="none";
      more.textContent="Showing the first "+MAX_GRID_CELLS+" — type in the filter to narrow it down.";
      g.appendChild(more);
    }
    sizeObjThumbs(); syncObjScope();
    if(!n){ const d=document.createElement("div"); d.className="none";
      if(q || objPack!=="all") d.textContent="No objects match that.";
      else if(bundledError) d.textContent="Couldn't load /packs/bundled/bundled.json ("+bundledError+") — is the pack folder uploaded?";
      else if(!bundledPacks.length) d.textContent="Loading asset packs…";
      else if(!advOn()) d.textContent="No basic objects loaded — re-upload public/packs/bundled/.";
      else {
        const c=bundledCounts||{};
        d.textContent="bundled.json has "+(c.floor||0)+" floors and "+(c.wall||0)+" walls but no objects"
          + " — public/packs/bundled/ is from an older build. Re-upload it (and hard-refresh).";
      }
      g.appendChild(d); }
  }
  // Session-only, like `pending`: which pack the palette is narrowed to.
  let objPack="all";
  function buildPackFilter(list, isImported){
    const sel=$("objPack"); if(!sel) return;
    const seen=new Map();
    for(const t of list) if(!seen.has(t.pack)) seen.set(t.pack, t.packName||t.pack);
    const opts=[["all","All"],["default","Default"]];
    for(const [id,name] of seen) opts.push([id,name]);
    // Rebuild only when the option set actually changed, or every palette
    // rebuild would blow away the user's open dropdown and their selection.
    const sig=opts.map(o=>o[0]).join("|");
    if(sel.dataset.sig!==sig){
      sel.dataset.sig=sig;
      sel.innerHTML="";
      for(const [id,name] of opts){
        const o=document.createElement("option"); o.value=id; o.textContent=name; sel.appendChild(o); }
    }
    // A pack that just went out of scope (mode switch, pack removed) falls back.
    if(objPack!=="all" && objPack!=="default" && !seen.has(objPack)) objPack="all";
    sel.value=objPack;
  }
  function syncObjScope(){
    const el=$("objGroup"); if(!el) return;
    el.title = advOn()
      ? "Advanced packs — 2-Minute Tabletop plus anything you have imported."
      : "Basic set — Axebane Games. Switch Advanced Mode on for the full packs.";
  }
  // Scale each atlas crop to the cell the grid actually gave it. Measured rather
  // than assumed, so it stays right at any sidebar width — including the stacked
  // phone layout.
  function sizeObjThumbs(){
    const g=$("objGrid"); if(!g) return;
    const cells=g.querySelectorAll("button"); if(!cells.length) return;
    const inner=Math.max(16, cells[0].clientWidth-4);            // 2px padding each side
    for(const cell of cells){
      const d=cell.querySelector(".th"); if(!d || !d.dataset.r) continue;
      const [x,y,w,h,sw,sh]=d.dataset.r.split(",").map(Number);
      const f=Math.min(inner/w, inner/h);
      d.style.width=(w*f)+"px"; d.style.height=(h*f)+"px";
      d.style.backgroundSize=(sw*f)+"px "+(sh*f)+"px";
      d.style.backgroundPosition=(-x*f)+"px "+(-y*f)+"px";
    }
  }
  // `[` / `]` snap to a 45 lattice; Shift gives a free 5 nudge. Shared by the
  // armed ghost and a placed selection so both feel the same.
  function spinStep(r, dir, fine){
    const S45=Math.PI/4, EPS=1e-6;
    if(fine) return r + dir*5*Math.PI/180;
    return dir>0 ? (Math.floor(r/S45 + EPS)+1)*S45
                 : (Math.ceil (r/S45 - EPS)-1)*S45;
  }
  // `+` / `-` step the LARGER side to the next quarter cell, aspect preserved, so
  // repeated presses land on sizes that line up with the grid instead of drifting
  // off it the way a fixed percentage would. Shift gives a free 5% nudge, the same
  // shape as the rotate keys. Returns null when the step would leave the range.
  function stepSize(w, h, dir, fine){
    w=w||1; h=h||1;
    const m=Math.max(w,h);
    let f;
    if(fine) f = dir>0 ? 1.05 : 1/1.05;
    else {
      const Q=0.25, EPS=1e-6;
      const m2 = dir>0 ? (Math.floor(m/Q + EPS)+1)*Q : (Math.ceil(m/Q - EPS)-1)*Q;
      if(m2 < Q-EPS) return null;
      f = m2/m;
    }
    const nw=w*f, nh=h*f;
    if(Math.min(nw,nh) < 0.08 || Math.max(nw,nh) > 80) return null;
    return [nw, nh];
  }
  function placeObject(wx,wy,keepArmed){
    const t=texReg.get(armedObj); if(!t) return;
    pushHistory();
    if(!map.objects) map.objects=[];
    const o={id:uid(), tex:t.id, x:snapHalf(wx), y:snapHalf(wy),
             w:(t.w||1)*armScale, h:(t.h||1)*armScale, rot:armRot};
    if(armFlip) o.flip=true;
    map.objects.push(o);
    const idx=map.objects.length-1;
    // A plain click hands you the object ready to nudge, rotate or scale.
    // SHIFT-click keeps the palette armed so you can lay down a run of them.
    if(!keepArmed) setTool("select");
    setSel({kind:"object", idx});
    commit();
  }

  // ── LIGHTS (Advanced Mode) ────────────────────────────────────────
  // Rendering lives in the engine (and its inlined twin); this is just the
  // controls. Scope mirrors the Floor/Walls pickers: with a light SELECTED the
  // sliders edit that light, otherwise they set what the next one will be.
  const LIGHT_PRESETS=[
    {name:"Torch",     col:"#ff9a3c"},
    {name:"Lantern",   col:"#ffd08a"},
    {name:"Candle",    col:"#ffc46b"},
    {name:"Moonlight", col:"#9fc4ff"},
    {name:"Arcane",    col:"#8f7bff"},
    {name:"Necrotic",  col:"#63ffab"},
  ];
  // Factory settings — Reset restores these, NOT whatever the sliders happen to
  // hold. `newLight` is a mutable copy (session-only, like `pending`).
  const LIGHT_DEFAULTS={ col:"#ff9a3c", r:2, bright:0.5, pattern:"soft", rot:0, spread:1.047 };
  let newLight=Object.assign({}, LIGHT_DEFAULTS);
  let lightGesture=false;                             // one undo entry per slider DRAG
  function lightTarget(){
    if(sel==null || sel.kind!=="light") return null;

  }
  function syncLightUI(){
    const on=!!map.lit;
    if($("lightToggle")) $("lightToggle").checked=on;
    if($("lightBody"))   $("lightBody").style.display = on ? "" : "none";
    const lt=document.querySelector('.tool[data-tool="light"]');
    if(lt) lt.classList.toggle("off", !on);
    const d=Math.round((map.darkness==null?0:map.darkness)*100);
    if($("darkness")) $("darkness").value=d;
    if($("darkV"))    $("darkV").textContent=d+"%";
    const t=lightTarget();
    const col = t ? (t.color||newLight.col) : newLight.col;
    let pat = (t ? (t.pattern||"soft") : newLight.pattern) || "soft";
    if(pat==="textured") pat="fire";                 // renamed in v46
    if($("lightPat")) $("lightPat").value=pat;
    if($("beamRow")) $("beamRow").style.display = (pat==="beam") ? "" : "none";
    const sp = t ? (t.spread==null?newLight.spread:t.spread) : newLight.spread;
    if($("lightSpread")) $("lightSpread").value=Math.round(sp*180/Math.PI);
    if($("lswV"))        $("lswV").textContent=Math.round(sp*180/Math.PI)+"°";
    const r   = t ? (t.r||newLight.r)       : newLight.r;
    const br  = t ? (t.bright==null?newLight.bright:t.bright) : newLight.bright;
    if($("lightColor"))  $("lightColor").value=col;
    // The slider counts HALF squares, so 2.5 / 3 / 3.5 are all reachable.
    if($("lightRadius")) $("lightRadius").value=Math.round(r*2);
    if($("lrV"))         $("lrV").textContent=(Math.round(r*2)/2)+" sq";
    if($("lightBright")) $("lightBright").value=Math.round(br*100);
    if($("lbV"))         $("lbV").textContent=Math.round(br*100)+"%";
    const lc=String(col).toLowerCase();
    const pre=LIGHT_PRESETS.filter(p=>p.col.toLowerCase()===lc)[0];
    if($("lightColorName")) $("lightColorName").textContent = pre ? pre.name : "Custom";
    const row=$("lightPresets");
    if(row) row.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.col.toLowerCase()===lc));
    if($("lightBody")) $("lightBody").title = t
      ? "Editing the selected light."
      : "Settings for the next light — pick the Light tool (L) and click the map.";
  }
  // Live edit while a slider is being dragged: mutate + redraw every tick, but
  // only ONE history entry per gesture (endLightEdit closes it on `change`).
  function liveLight(patch){
    const t=lightTarget();
    if(!t){
      if(patch.color!=null)  newLight.col=patch.color;
      if(patch.r!=null)      newLight.r=patch.r;
      if(patch.bright!=null) newLight.bright=patch.bright;
      if(patch.pattern!=null) newLight.pattern=patch.pattern;
      if(patch.spread!=null)  newLight.spread=patch.spread;
      if(patch.rot!=null)     newLight.rot=patch.rot;
      syncLightUI(); return;
    }
    if(!lightGesture){ pushHistory(); lightGesture=true; }
    if(patch.color!=null)  t.color=patch.color;
    if(patch.r!=null)      t.r=patch.r;
    if(patch.bright!=null) t.bright=patch.bright;
    if(patch.pattern!=null) t.pattern=patch.pattern;
    if(patch.spread!=null)  t.spread=patch.spread;
    if(patch.rot!=null)     t.rot=patch.rot;
    commit(); syncLightUI();
  }
  function endLightEdit(){ lightGesture=false; }
  // Reset: the SELECTED light back to a standard torch, or — with nothing
  // selected — the settings the next light will be born with. `map.darkness` is
  // map-wide, not a property of any one light, so it is deliberately left alone.
  function resetLight(){
    const t=lightTarget();
    if(t){ pushHistory();
      t.color=LIGHT_DEFAULTS.col; t.r=LIGHT_DEFAULTS.r; t.bright=LIGHT_DEFAULTS.bright;
      t.pattern=LIGHT_DEFAULTS.pattern; t.rot=LIGHT_DEFAULTS.rot; t.spread=LIGHT_DEFAULTS.spread;
      commit(); toast("Light reset to a standard torch."); }
    else { newLight=Object.assign({}, LIGHT_DEFAULTS); toast("New-light settings reset."); }
    endLightEdit(); syncLightUI();
  }
  function placeLight(wx,wy,keepPlacing){
    if(!map.lit) return;
    if(!Array.isArray(map.lights)) map.lights=[];
    pushHistory();
    map.lights.push({ id:uid(), x:snapHalf(wx), y:snapHalf(wy), r:newLight.r,
                      color:newLight.col, bright:newLight.bright, pattern:newLight.pattern,
                      rot:newLight.rot||0, spread:newLight.spread });
    commit();
    // Same rule as objects: auto-select and drop back to Select unless Shift.
    if(!keepPlacing){ setSel({kind:"light", idx:map.lights.length-1}); setTool("select"); }
    else syncLightUI();
  }
  function initLights(){
    const row=$("lightPresets");
    if(row && !row.childElementCount){
      for(const p of LIGHT_PRESETS){
        const b=document.createElement("button");
        b.type="button"; b.dataset.col=p.col; b.title=p.name; b.style.background=p.col;
        b.onclick=()=>{ liveLight({color:p.col}); endLightEdit(); };

      }
    }
    if($("lightToggle")) $("lightToggle").onchange=e=>{
      map.lit=e.target.checked;
      if(!map.lit && tool==="light") setTool("select");

    };
    if($("darkness")){
      // Same one-entry-per-drag rule as the per-light sliders: snapshot BEFORE
      // the first mutation, close the gesture on `change`.

      };

                          $("lightRadius").onchange=endLightEdit; }

                          $("lightBright").onchange=endLightEdit; }

                          $("lightSpread").onchange=endLightEdit; }
