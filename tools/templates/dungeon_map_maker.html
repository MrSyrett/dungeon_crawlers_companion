  // ── SHADOWS (Advanced Mode) ───────────────────────────────────────
  // Placed like a light, edited like an object: the scale/rotate handles and the
  // [ ] lattice both work on a selected shadow, and the sliders below follow the
  // same scope rule — selected shadow if there is one, otherwise the next one.
  const SHADOW_DEFAULTS={ w:1.6, h:1.1, soft:0.55, strength:0.6 };
  let newShadow=Object.assign({}, SHADOW_DEFAULTS);
  let shadowGesture=false;
  function advOn(){ return !!(map.style && map.style.mode==="textured"); }
  function shadowTarget(){
    if(sel==null || sel.kind!=="shadow") return null;
    const o=objAt(sel); return o ? o.obj : null;
  }
  function syncShadowUI(){
    const on=!!map.shadowsOn;
    const ws=(map.wallShadow==null)?0.55:map.wallShadow;
    if($("wallShadow")) $("wallShadow").value=Math.round(ws*100);
    if($("shwsV"))      $("shwsV").textContent=Math.round(ws*100)+"%";
    if($("shadowToggle")) $("shadowToggle").checked=on;
    if($("shadowBody"))   $("shadowBody").style.display = on ? "" : "none";
    const btn=document.querySelector('.tool[data-tool="shadow"]');
    if(btn) btn.classList.toggle("off", !on);
    const t=shadowTarget();
    const w  = t ? (t.w||newShadow.w) : newShadow.w;
    const h  = t ? (t.h||newShadow.h) : newShadow.h;
    const so = t ? (t.soft==null?newShadow.soft:t.soft) : newShadow.soft;
    const st = t ? (t.strength==null?newShadow.strength:t.strength) : newShadow.strength;
    if($("shW"))    $("shW").value=Math.round(w*10);
    if($("shwV"))   $("shwV").textContent=w.toFixed(1)+" sq";
    if($("shH"))    $("shH").value=Math.round(h*10);
    if($("shhV"))   $("shhV").textContent=h.toFixed(1)+" sq";
    if($("shSoft")) $("shSoft").value=Math.round(so*100);
    if($("shsV"))   $("shsV").textContent=Math.round(so*100)+"%";
    if($("shStr"))  $("shStr").value=Math.round(st*100);
    if($("shtV"))   $("shtV").textContent=Math.round(st*100)+"%";
    if($("shadowBody")) $("shadowBody").title = t
      ? "Editing the selected shadow — drag its handles to resize or turn it."
      : "Next shadow: click an object and it sizes itself to fit, or click bare floor for a free one.";
  }
  function liveShadow(patch){
    const t=shadowTarget();
    if(!t){ for(const k in patch) newShadow[k]=patch[k]; syncShadowUI(); return; }
    if(!shadowGesture){ pushHistory(); shadowGesture=true; }
    for(const k in patch) t[k]=patch[k];
    commit(); syncShadowUI();
  }
  function endShadowEdit(){ shadowGesture=false; }
  // Reset a shadow to the default softness/strength. Size goes back to the
  // default too — EXCEPT when it is sitting on an object, where it re-fits that
  // object's footprint, because the plain default is smaller than most sprites
  // and the shadow would simply vanish underneath one.
  function resetShadow(){
    const t=shadowTarget();
    if(t){ pushHistory();
      const u=objectUnder(t.x,t.y);
      t.w = u ? Math.max(0.3,(u.w||1)*1.45) : SHADOW_DEFAULTS.w;
      t.h = u ? Math.max(0.3,(u.h||1)*1.40) : SHADOW_DEFAULTS.h;
      t.rot = u ? (u.rot||0) : 0;
      t.soft=SHADOW_DEFAULTS.soft; t.strength=SHADOW_DEFAULTS.strength;
      commit(); toast(u ? "Shadow reset and re-fitted to the object under it."
                        : "Shadow reset to defaults."); }
    else { newShadow=Object.assign({}, SHADOW_DEFAULTS); toast("New-shadow settings reset."); }
    endShadowEdit(); syncShadowUI();
  }
  // Topmost OBJECT under a world point (hitTest would hand back lights/shadows too).
  function objectUnder(wx,wy){
    for(let i=(map.objects||[]).length-1;i>=0;i--){ const o=map.objects[i];
      const r=-(o.rot||0), c=Math.cos(r), sn=Math.sin(r);
      const dx=wx-o.x, dy=wy-o.y;
      const lx=dx*c-dy*sn, ly=dx*sn+dy*c;
      if(Math.abs(lx)<=(o.w||1)/2 && Math.abs(ly)<=(o.h||1)/2) return o; }
    return null;
  }
  function placeShadow(wx,wy,keepPlacing){
    if(!map.shadowsOn) return;
    if(!Array.isArray(map.shadows)) map.shadows=[];
    // Drop it on an object and it sizes itself to that object's footprint and
    // angle. Objects are drawn ON TOP of shadows, so a shadow smaller than the
    // sprite is completely invisible — the default 1.6×1.1 would vanish under
    // most furniture. Softness/strength still come from the sliders.
    const u=objectUnder(wx,wy);
    const W_=u ? Math.max(0.3,(u.w||1)*1.45) : newShadow.w;
    const H_=u ? Math.max(0.3,(u.h||1)*1.40) : newShadow.h;
    pushHistory();
    map.shadows.push({ id:uid(), x: u?u.x:snapHalf(wx), y: u?u.y:snapHalf(wy),
                       w:W_, h:H_, rot: u ? (u.rot||0) : 0,
                       soft:newShadow.soft, strength:newShadow.strength });
    commit();
    if(u) toast("Shadow sized to the object under it — drag the handles to adjust.");
    if(!keepPlacing){ setSel({kind:"shadow", idx:map.shadows.length-1}); setTool("select"); }
    else syncShadowUI();
  }
  function initShadows(){
    const bind=(id,f)=>{ const el=$(id); if(!el) return;
      el.oninput=e=>f(+e.target.value); el.onchange=endShadowEdit; };
    bind("shW",    v=>liveShadow({w:v/10}));
    bind("shH",    v=>liveShadow({h:v/10}));
    bind("shSoft", v=>liveShadow({soft:v/100}));
    bind("shStr",  v=>liveShadow({strength:v/100}));
    if($("wallShadow")){
      $("wallShadow").oninput=e=>{
        if(!shadowGesture){ pushHistory(); shadowGesture=true; }
        map.wallShadow=(+e.target.value)/100;
        if($("shwsV")) $("shwsV").textContent=Math.round(map.wallShadow*100)+"%";
        commit();
      };

    }
    if($("shadowReset")) $("shadowReset").onclick=resetShadow;
    if($("shadowToggle")) $("shadowToggle").onchange=e=>{
      map.shadowsOn=e.target.checked;

  }
  function syncGridOp(){
    const v = (map.gridOpacity==null) ? 1 : Math.max(0, Math.min(1, map.gridOpacity));
    if($("gridOp")) $("gridOp").value = Math.round(v*100);
    if($("gridOpV")) $("gridOpV").textContent = Math.round(v*100)+"%";
  }
  function syncAdvancedUI(){
    const st=map.style||(map.style=DEFAULT_STYLE());
    const on=st.mode==="textured";
    if($("advToggle")) $("advToggle").checked=on;
    if($("advBody")) $("advBody").style.display = on ? "" : "none";

  }
  function initAdvanced(){
    const st=map.style||(map.style=DEFAULT_STYLE());
    if($("advToggle")) $("advToggle").onchange=e=>{
      map.style.mode = e.target.checked ? "textured" : "classic";
      syncAdvancedUI(); commit();
    };
    for(const kind in PICKERS){
      const b=$(PICKERS[kind].el);
      if(b) b.onclick=(e)=>{ e.stopPropagation(); openPicker(kind); };
    }

      const pop=$("pickPop");

    const sb=document.querySelector(".sidebar");
    if(sb) sb.addEventListener("scroll", ()=>{
      if(pickOpen && Math.abs(sb.scrollTop - pickScrollTop) > 2) closePicker(); });
    if($("objFilter")) $("objFilter").oninput=()=>buildObjGrid();
    if($("objPack"))   $("objPack").onchange=e=>{ objPack=e.target.value; buildObjGrid(); };
    if($("packAdd"))  $("packAdd").onclick  =()=>$("packFile").click();
    if($("packFile")) $("packFile").onchange=e=>{ const f=e.target.files&&e.target.files[0];
      e.target.value=""; if(f) importPackFile(f).catch(err=>toast(err.message||"Import failed.")); };
    syncAdvancedUI(); syncStyleScope(); initLights(); initShadows();

  }

  // ════════════════════════════════════════════════════════════════
  // VIEW
  // ════════════════════════════════════════════════════════════════
  function contentBounds(){
    const pts=[];
    for(const s of map.shapes){ const b=bounds(s,"shape"); if(b){pts.push([b.x,b.y],[b.x+b.w,b.y+b.h]);} }
    for(const w of map.walls){ for(const p of wallPts(w)) pts.push(p); }   // arc/freehand can bow past its ends
    for(const o of (map.objects||[])){ const b=objBox(o); pts.push([b.x,b.y],[b.x+b.w,b.y+b.h]); }
    for(const d of map.doors) pts.push([d.x,d.y]);
    if(map.lit) for(const L of (map.lights||[])) pts.push([L.x,L.y]);
    for(const sd of (map.shadows||[])){ const b=objBox(sd); pts.push([b.x,b.y],[b.x+b.w,b.y+b.h]); }
    for(const s of map.stairs){ if(s.ax!==undefined){ pts.push([s.ax,s.ay],[s.bx,s.by],[s.tx,s.ty]); }
      else if(s.x1!==undefined){ pts.push([s.x1,s.y1],[s.x2,s.y2]); } else pts.push([s.x,s.y]); }
    if(!pts.length) return null;
    const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
    return {x:Math.min(...xs),y:Math.min(...ys),X:Math.max(...xs),Y:Math.max(...ys)};
  }
  function fitView(){
    const b=contentBounds();
    if(!b){ cam={x:0,y:0,scale:1}; render(); updateZoom(); return; }
    const cw=b.X-b.x||10, ch=b.Y-b.y||10, pad=2;
    const scale=Math.min(W/((cw+pad*2)*CELL), H/((ch+pad*2)*CELL));
    cam.scale=Math.max(0.15,Math.min(4,scale));
    cam.x=(b.x+b.X)/2; cam.y=(b.y+b.Y)/2;
    render(); updateZoom();
  }
  function updateZoom(){ $("zoomPct").textContent=Math.round(cam.scale*100)+"%"; }

  // ════════════════════════════════════════════════════════════════
  // PNG EXPORT
  // ════════════════════════════════════════════════════════════════
  let exporting=false, noRock=false;
  function exportPNG(transparent){
    const b=contentBounds(); if(!b){ toast("Nothing to export yet."); return; }
    const pad=1.5, res=2;                        // cells of margin, px multiplier
    const cw=(b.X-b.x+pad*2), ch=(b.Y-b.y+pad*2);
    const outW=Math.round(cw*CELL*res), outH=Math.round(ch*CELL*res);
    // stash view, retarget the visible canvas to export framing, grab pixels
    const savedCam={...cam}, savedW=W, savedH=H, savedDPR=DPR;
    DPR=1; W=outW; H=outH; cv.width=outW; cv.height=outH;
    cam=Object.assign({},cam,{scale:res, x:(b.x+b.X)/2, y:(b.y+b.Y)/2});
    exporting=true; noRock=!!transparent;
    render();
    exporting=false; noRock=false;
    const url=cv.toDataURL("image/png");
    // restore live view
    cam=savedCam; DPR=savedDPR; resize();
    const name=(map.name?slug(map.name):"dungeon-map")+(transparent?"-transparent":"")+".png";
    saveFile(dataURLToBlob(url), name, "Exported");
  }
  function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"map"; }

  // ════════════════════════════════════════════════════════════════
  // UI WIRING
  // ════════════════════════════════════════════════════════════════
  function $(id){ return document.getElementById(id); }
  let spaceDown=false;

  function setTool(t){
    // The Light tool needs somewhere to put light — Advanced Mode with Lights on.
    if(t==="light" && !map.lit){ toast("Switch Lights on first — the panel is in the sidebar."); return; }
    if(t==="shadow" && !map.shadowsOn){ toast("Switch Shadows on first — the panel is in the sidebar."); return; }
    tool=t;
    document.querySelectorAll(".tool").forEach(el=>el.classList.toggle("active",el.dataset.tool===t));
    if(t!=="polygon"&&polyPts){ polyPts=null; render(); }
    if(t!=="draw"&&stroke){ stroke=null; render(); }
    if(placing){ placing=null; render(); }
    if(t!=="object" && armedObj){ armedObj=null; resetArm(); buildObjGrid(); }
    if(t!=="object" && ghostPt){ ghostPt=null; render(); }
    syncStyleScope();          // picker scope follows the active tool
    cv.style.cursor = t==="select"?"default":(t==="erase"?"cell":"crosshair");
    const tips={rect:"Drag to draw a rectangular room.",circle:"Drag out a circular room.",
      polygon:"Click corners · click the first one again to close a room · Enter leaves it open as a wall.",
      draw:"Drag to trace. Finish near where you started for a room, anywhere else for a wall.",
      wall:"Click start, click end, then click to bow the curve (click the line for a straight wall).",
      door:"Click to start, move to aim, click again to place the door.",
      stair:"Click a base corner, click to set width, click the tip to place.",
      erase:"Click anything to delete it.",select:"Click to select · drag to move.",
      object:"Click to place. [ ] turn it, + − size it, X flips — all before you drop it.",
      light:"Click to drop a light. Shift-click to keep placing more.",
      shadow:"Click an object to shadow it, or bare floor for a free shadow. Shift-click to keep placing."};
    toast(tips[t]||"");
  }
  document.getElementById("toolbar").addEventListener("click", e=>{
    const t=e.target.closest(".tool"); if(t) setTool(t.dataset.tool); });

  // Rooms ⟷ Shapes: flip what Square/Circle/Polygon/Wall produce. Doors/stairs
  // are unaffected. In Shapes mode those tools make thin interior shapes (deco).
  const modeSeg=document.getElementById("modeSeg");
  function setMode(m){ drawMode=m;
    modeSeg.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.mode===m));
    if(placing){ placing=null; } if(draft){ draft=null; } render();
    toast(m==="shapes"
      ? "Shapes mode — Square / Circle / Polygon / Draw now make thin interior shapes."
      : "Rooms mode — Square / Circle / Polygon / Draw make rooms; leave a run open and it becomes a wall."); }
  modeSeg.addEventListener("click", e=>{ const b=e.target.closest("button"); if(b) setMode(b.dataset.mode); });

  // ── collapsible sidebar sections ──────────────────────────────────
  // A UI preference, not map data: its own localStorage key, so it survives Clear
  // and never rides along in an exported .json.
  const SECTIONS={ obj:"objBody", gen:"genBody" };
  let secShut={};
  try{ secShut=JSON.parse(localStorage.getItem("dcc_sections")||"{}")||{}; }catch(e){ secShut={}; }
  function syncSections(){
    for(const k in SECTIONS){
      const body=$(SECTIONS[k]), head=document.querySelector('.grp-head.sec[data-sec="'+k+'"]');
      if(!body || !head) continue;
      const shut=!!secShut[k];
      body.style.display = shut ? "none" : "";
      head.setAttribute("aria-expanded", shut ? "false" : "true");
      const c=head.querySelector(".caret"); if(c) c.classList.toggle("closed", shut);
    }
  }
  function toggleSection(k){
    if(!(k in SECTIONS)) return;
    secShut[k]=!secShut[k];
    try{ localStorage.setItem("dcc_sections", JSON.stringify(secShut)); }catch(e){}
    syncSections();
    // The object grid sizes its thumbnails from a cell's measured width, which is
    // 0 while the section is display:none — redo it once it has been laid out.
    if(k==="obj" && !secShut.obj) requestAnimationFrame(sizeObjThumbs);
  }
  document.querySelectorAll(".grp-head.sec").forEach(h=>{
    h.addEventListener("click", ()=>toggleSection(h.dataset.sec));
    h.addEventListener("keydown", e=>{
      if(e.key==="Enter" || e.key===" "){ e.preventDefault(); toggleSection(h.dataset.sec); } });
  });
  syncSections();

  let tipTimer=null;
  function toast(msg){ const el=$("tip"); if(!el||!msg) return; el.textContent=msg; el.classList.add("show");
    clearTimeout(tipTimer); tipTimer=setTimeout(()=>el.classList.remove("show"),2600); }

  // generator controls
  $("rooms").oninput=e=>$("roomsV").textContent=e.target.value;
  $("rsize").oninput=e=>$("sizeV").textContent=SIZE_LBL[+e.target.value];
  $("spread").oninput=e=>$("spreadV").textContent=SPREAD_LBL[+e.target.value];
  $("entrances").oninput=e=>$("entrancesV").textContent=e.target.value;
  // Same guard as Clear: rolling a dungeon throws the current map away, and it
  // is the one destructive button people hit by accident while experimenting.
  $("generate").onclick=()=>{
    const busy = map.shapes.length || map.walls.length || map.doors.length ||
                 map.stairs.length || (map.objects||[]).length ||
                 (map.lights||[]).length || (map.shadows||[]).length;
    if(busy && !confirm("Generate a new dungeon? This replaces everything on the map.")) return;
    generate();
  };

  $("gridToggle").onchange=e=>{ map.grid=e.target.checked; render(); scheduleSave(); };
  $("snapToggle").onchange=e=>{ snapOn=e.target.checked; map.snap=snapOn; scheduleSave(); };
  // Shift+S rather than plain S, which is already the Stairs tool.
  function toggleSnap(){ snapOn=!snapOn; map.snap=snapOn;
    if($("snapToggle")) $("snapToggle").checked=snapOn;
    scheduleSave(); toast("Snap to grid "+(snapOn?"on":"off")); }
  $("darkToggle").onchange=e=>setTheme(e.target.checked ? "dark" : "light");
  $("clear").onclick=()=>{ if(!map.shapes.length&&!map.walls.length){return;}
    if(confirm("Clear the whole map?")){ pushHistory(); const n=map.name; map=blankMap(); map.name=n; map.theme=theme; afterLoad(); commit(); } };
  $("fit").onclick=fitView;
  $("undo").onclick=undo; $("redo").onclick=redo;
  if($("toFront")) $("toFront").onclick=()=>reorderSel(true);
  if($("toBack"))  $("toBack").onclick =()=>reorderSel(false);
  $("export").onclick=exportMap;
  $("import").onclick=()=>$("importFile").click();
  $("importFile").onchange=e=>{ const f=e.target.files&&e.target.files[0]; if(f) importMapFile(f); e.target.value=""; };
  $("png").onclick=()=>exportPNG(false);
  $("pngT").onclick=()=>exportPNG(true);
  $("zoomIn").onclick=()=>{ cam.scale=Math.min(6,cam.scale*1.2); render(); updateZoom(); };
  $("zoomOut").onclick=()=>{ cam.scale=Math.max(0.15,cam.scale/1.2); render(); updateZoom(); };

  // keyboard
  window.addEventListener("keydown", e=>{
    if(e.target.tagName==="INPUT") return;
    if(!e.ctrlKey && !e.metaKey && !e.altKey){                 // never steal Ctrl+F / Cmd+B etc.
      if(e.key==="S"){ toggleSnap(); return; }                 // Shift+S — plain S is the Stairs tool
      if((e.key==="f"||e.key==="F")&&sel){ reorderSel(true); return; }
      if((e.key==="b"||e.key==="B")&&sel){ reorderSel(false); return; }
    }
    if(e.code==="Space"){ spaceDown=true; cv.style.cursor="grab"; }
    if((e.ctrlKey||e.metaKey)&&e.key==="z"){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
    if((e.ctrlKey||e.metaKey)&&e.key==="y"){ e.preventDefault(); redo(); return; }
    if(e.key==="\\"){ fitView(); return; }                        // \ = Fit view
    if(e.key==="Enter"&&polyPts){ finishPolygon(false); return; }
    if(e.key==="Escape"){ if(pickOpen){ closePicker(); return; }
      polyPts=null; draft=null; dragStart=null; setSel(null); placing=null; stroke=null; render(); return; }
    if((e.key==="Delete"||e.key==="Backspace")&&sel){ pushHistory(); removeHit({kind:sel.kind,idx:sel.idx,obj:objAt(sel).obj}); commit(); return; }
    if(tool==="object" && armedObj){
      const base=texReg.get(armedObj);
      if(base){
        if(e.key==="["||e.key==="{"){ armRot=spinStep(armRot,-1,e.shiftKey); renderGhostOnly(); return; }
        if(e.key==="]"||e.key==="}"){ armRot=spinStep(armRot,+1,e.shiftKey); renderGhostOnly(); return; }
        if(e.key==="x"||e.key==="X"){ armFlip=!armFlip; renderGhostOnly(); return; }
        if(e.key==="+"||e.key==="="||e.key==="-"||e.key==="_"){
          const dir=(e.key==="+"||e.key==="=") ? 1 : -1;
          const n=stepSize((base.w||1)*armScale, (base.h||1)*armScale, dir, e.shiftKey);
          if(n){ armScale = n[0]/(base.w||1); renderGhostOnly(); }
          return;
        }
      }
    }
    if((e.key==="+"||e.key==="="||e.key==="-"||e.key==="_") &&
       sel && (sel.kind==="object" || sel.kind==="shadow")){
      const o=objAt(sel);
      if(o){ const dir=(e.key==="+"||e.key==="=") ? 1 : -1;
        const n=stepSize(o.obj.w, o.obj.h, dir, e.shiftKey);
        if(n){ pushHistory(); o.obj.w=n[0]; o.obj.h=n[1]; commit(); } }
      return;
    }
    if(sel && (sel.kind==="object" || sel.kind==="shadow" || sel.kind==="light")){
      const o=objAt(sel); if(o){
        // [ and ] step around a 45° lattice and SNAP to it, so repeated presses
        // always land on clean orientations even if the object was free-rotated
        // with the handle first. Shift gives a free 5° nudge instead.
        const spin=(dir)=>spinStep(o.obj.rot||0, dir, e.shiftKey);
        // Accept the shifted characters too: Shift+] emits "}" on a real keyboard,
        // so matching only "]" would make the fine nudge silently do nothing.
        if(e.key==="["||e.key==="{"){ pushHistory(); o.obj.rot=spin(-1); commit(); return; }
        if(e.key==="]"||e.key==="}"){ pushHistory(); o.obj.rot=spin(+1); commit(); return; }
        if(e.key==="x"||e.key==="X"){ pushHistory(); o.obj.flip=!o.obj.flip; commit(); return; }
      }
    }
    if(e.key==="g"||e.key==="G"){ setMode(drawMode==="rooms"?"shapes":"rooms"); return; }  // toggle Rooms/Shapes
    // No `w` any more: the Wall tool is gone. An unclosed Polygon run gives the
    // same straight chain in one gesture, and Draw gives any curve at all.
    const keys={v:"select",r:"rect",c:"circle",p:"polygon",n:"draw",d:"door",s:"stair",e:"erase",l:"light",h:"shadow"};
    if(keys[e.key]) setTool(keys[e.key]);
  });
  window.addEventListener("keyup", e=>{ if(e.code==="Space"){ spaceDown=false; cv.style.cursor= tool==="select"?"default":"crosshair"; } });

  // ── resize ────────────────────────────────────────────────────────
  function resize(){
    const r=cv.parentElement.getBoundingClientRect();
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=Math.max(1,Math.round(r.width)); H=Math.max(1,Math.round(r.height));   // CSS-px logical size
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
    cv.style.width=W+"px"; cv.style.height=H+"px";
    render();
  }
  window.addEventListener("resize", resize);

  // ════════════════════════════════════════════════════════════════
  // BOOT
  // ════════════════════════════════════════════════════════════════
  function detectEmbed(){
    // The server's preview shim hides the sidebar; if it's not visible we are
    // embedded read-only (GM Screen / session prep). Check after layout.
    const sb=document.querySelector(".sidebar");
    const hidden = sb && getComputedStyle(sb).display==="none";
    embed = hidden;
    if(embed) document.body.classList.add("embed");
  }
  function boot(){
    load();
    detectEmbed();
    resize();
    $("gridToggle").checked=map.grid!==false;
    snapOn=map.snap!==false; $("snapToggle").checked=snapOn;
    $("darkToggle").checked = map.theme==="dark";
    setThemeColors(map.theme==="dark" ? "dark" : "light");
    initAdvanced();
    syncGridOp(); syncZUI();
    if($("gridOp")) $("gridOp").oninput=e=>{ map.gridOpacity=(+e.target.value)/100; syncGridOp(); commit(); };
    syncUndo();
    if(map.shapes.length||map.walls.length) fitView(); else render();
    if(!embed && !map.shapes.length) toast("Pick a tool, or roll a random dungeon →");
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot); else boot();

  // expose a tiny API for the host page if ever needed
  window.DungeonMap = { get:()=>map, load:(d)=>{ map=Object.assign(blankMap(),d); afterLoad(); fitView(); }, render, fitView };
})();
</script>
</body>
</html>
