<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Map Maker</title>
<!-- Shared generator + renderer. When served by the app this is the single source
     of truth (the GM Screen + Session Prep use it too). If it fails to load (e.g.
     the file opened standalone / offline), the tool falls back to its own inlined
     copy below, so it still works on its own. -->
<script src="/dungeon-engine.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0e11; --panel:#17171b; --panel2:#1e1e24; --line:#33333c;
    --ink:#e8e2d4; --muted:#9a948a; --gold:#c9a94a; --gold-dim:#8f7a35;
    --active:#2a2a33; --danger:#b5533f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Montserrat",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  .app{display:flex;height:100vh;width:100vw}

  /* ── Sidebar (hidden by the server's preview shim) ────────────────── */
  .sidebar{width:250px;flex:0 0 250px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow-y:auto;z-index:5}
  /* Slim, low-contrast scrollbars. scrollbar-gutter:stable reserves the track so
     a grid's last column can't get clipped when the bar appears. */
  .sidebar, .objgrid{scrollbar-width:thin; scrollbar-color:#3d3d47 transparent; scrollbar-gutter:stable}
  .sidebar::-webkit-scrollbar, .objgrid::-webkit-scrollbar{width:8px;height:8px}
  .sidebar::-webkit-scrollbar-track, .objgrid::-webkit-scrollbar-track{background:transparent}
  .sidebar::-webkit-scrollbar-thumb, .objgrid::-webkit-scrollbar-thumb{
    background:#3d3d47;border-radius:8px;border:2px solid transparent;background-clip:content-box}
  .sidebar:hover::-webkit-scrollbar-thumb, .objgrid:hover::-webkit-scrollbar-thumb{background:#55555f;
    background-clip:content-box}
  .sidebar::-webkit-scrollbar-thumb:active, .objgrid::-webkit-scrollbar-thumb:active{background:var(--gold-dim);
    background-clip:content-box}
  .hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:12px 16px;border-bottom:1px solid var(--line)}
  .sidebar h1{font-family:"Cinzel",Georgia,serif;font-size:14px;letter-spacing:.04em;
    color:var(--gold);margin:0;padding:0;border:none;line-height:1.2}
  /* dark-mode toggle switch (header, right-aligned) */
  .switch{position:relative;display:inline-block;width:38px;height:20px;flex:0 0 auto}
  .switch input{position:absolute;opacity:0;width:0;height:0}
  .switch .slider{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--line);
    border-radius:20px;cursor:pointer;transition:.15s}
  .switch .slider::before{content:"";position:absolute;width:14px;height:14px;left:2px;top:2px;
    background:var(--muted);border-radius:50%;transition:.15s}
  .switch input:checked + .slider{background:var(--gold-dim);border-color:var(--gold)}
  .switch input:checked + .slider::before{transform:translateX(18px);background:#1a1508}
  .chk-row{display:flex;gap:16px;margin-top:10px}
  .chk-row .chk{margin-top:0}
  .grp{padding:12px 14px;border-bottom:1px solid var(--line)}
  .grp.flush{border-bottom:none}
  .grp-title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
  .grp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .grp-head .grp-title{margin:0}
  /* collapsible section headers (Objects, Random Dungeon) */
  .grp-head.sec{cursor:pointer;user-select:none}
  .grp-head.sec:hover .grp-title,.grp-head.sec:hover .caret{color:var(--gold)}
  .caret{color:var(--muted);font-size:11px;line-height:1;display:inline-block;
    transition:transform .15s ease}
  .caret.closed{transform:rotate(-90deg)}
  /* Rooms ⟷ Shapes segmented toggle */
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:0 0 auto}
  .seg button{background:var(--panel2);color:var(--muted);border:0;padding:3px 9px;cursor:pointer;
    font:600 10px/1.5 "Montserrat",system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase}
  .seg button + button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--gold);color:#1a1508}
  .tools{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
  .tool{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px;
    background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--ink);
    cursor:pointer;font-size:10.5px;letter-spacing:.03em;user-select:none;transition:.12s}
  .tool:hover{border-color:var(--gold-dim)}
  .tool.active{background:var(--active);border-color:var(--gold);color:var(--gold)}
  .tool svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}
  .row{display:flex;gap:6px}
  .btn{flex:1;padding:8px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;
    color:var(--ink);cursor:pointer;font-size:11px;letter-spacing:.03em;transition:.12s;text-align:center}
  .btn:hover{border-color:var(--gold-dim)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.gold{background:linear-gradient(180deg,#c9a94a,#a9882f);border-color:var(--gold);
    color:#1a1508;font-weight:600}
  .btn.gold:hover{filter:brightness(1.07)}
  .btn.wide{width:100%}
  label.fld{display:block;font-size:11px;color:var(--muted);margin:10px 0 4px}
  label.fld b{color:var(--ink);font-weight:600;float:right}
  input[type=range]{width:100%;accent-color:var(--gold);margin:0}
  input[type=number],input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);
    border-radius:6px;color:var(--ink);padding:7px 8px;font-size:12px;font-family:inherit}
  input[type=number]:focus,input[type=text]:focus{outline:none;border-color:var(--gold)}
  .chk{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);cursor:pointer;margin-top:10px}
  .chk input{accent-color:var(--gold);width:15px;height:15px}
  .hint{font-size:10.5px;color:var(--muted);line-height:1.5;margin:8px 0 0}
  .credit{font-size:10px;color:var(--muted);line-height:1.7;margin:12px 0 0;text-align:center}
  .credit a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}
  .credit a:hover{color:var(--gold)}
  .sel{width:100%;padding:7px 8px;background:var(--panel2);border:1px solid var(--line);
    border-radius:7px;color:var(--ink);font:inherit;font-size:11.5px;cursor:pointer}
  .sel:focus{outline:none;border-color:var(--gold-dim)}
  .packs{margin-top:8px;display:flex;flex-direction:column;gap:4px}
  .packs .pk{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);
    background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
  .packs .pk span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .packs .pk button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;line-height:1;padding:0 2px}
  .packs .pk button:hover{color:#e88}
  /* minmax(0,1fr), not 1fr: a plain 1fr track has an AUTO minimum, so fixed-size
     thumbnails inside push the columns wider than the container and the last one
     gets clipped. With a 0 minimum the tracks divide the space and the thumbs are
     sized to fit them (see buildObjGrid). */
  .objgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;max-height:214px;overflow:auto;
    margin-top:6px;padding:4px;background:var(--panel2);border:1px solid var(--line);border-radius:7px}
  .objgrid button{aspect-ratio:1;background:#0f0f13;border:1px solid transparent;border-radius:5px;
    cursor:pointer;padding:2px;display:flex;align-items:center;justify-content:center}
  .objgrid button:hover{border-color:var(--gold-dim)}
  .objgrid button.on{border-color:var(--gold);background:var(--active)}
  .objgrid img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
  .objgrid .th{display:block;background-repeat:no-repeat;pointer-events:none}
  .objgrid .none{grid-column:1/-1;font-size:10.5px;color:var(--muted);text-align:center;padding:16px 4px}
  /* swatch pickers */
  .pick{display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;background:var(--panel2);
    border:1px solid var(--line);border-radius:7px;color:var(--ink);font:inherit;font-size:11.5px;
    cursor:pointer;text-align:left}
  .pick:hover{border-color:var(--gold-dim)}
  .pick .pl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pick .ca{color:var(--muted);font-size:10px}
  .sw{width:34px;height:22px;flex:0 0 auto;border-radius:4px;border:1px solid var(--line);
    background-repeat:no-repeat;background-position:center;background-color:#0f0f13}
  .pickpop{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.55);overflow:auto;padding:4px}
  .pickpop .gl{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    padding:7px 8px 3px}
  .pickpop .opt{display:flex;align-items:center;gap:8px;width:100%;padding:5px 7px;background:none;
    border:0;border-radius:6px;color:var(--ink);font:inherit;font-size:11.5px;cursor:pointer;text-align:left}
  .pickpop .opt:hover{background:var(--panel2)}
  .pickpop .opt.on{background:var(--active);color:var(--gold)}
  /* Imported names run long ("Texture - Dirt - Dark - Dirt Ledge"). The popup is
     position:fixed and can overhang the canvas, so it widens (see openPicker) and
     a name that still doesn't fit WRAPS to two lines rather than being cut. */
  .pickpop .opt span:last-child{flex:1;min-width:0;overflow:hidden;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
  .pickpop .opt{min-height:32px}
  .spacer{flex:1}
  .save-state{font-size:10px;color:var(--muted);padding:8px 14px;letter-spacing:.04em}

  /* ── Canvas area ──────────────────────────────────────────────────── */
  .preview-area{flex:1;position:relative;overflow:hidden;background:#d9d0bd}
  #map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
  .float{position:absolute;z-index:6;background:rgba(16,16,19,.82);border:1px solid var(--line);
    border-radius:8px;backdrop-filter:blur(4px);color:var(--ink)}
  .zoombar{bottom:14px;right:14px;display:flex;align-items:center;gap:2px;padding:4px}
  .zoombar button{width:30px;height:30px;background:none;border:none;color:var(--ink);font-size:17px;
    cursor:pointer;border-radius:6px}
  .zoombar button:hover{background:var(--active)}
  .zoombar span{font-size:11px;color:var(--muted);min-width:42px;text-align:center}
  .tip{top:12px;left:50%;transform:translateX(-50%);padding:7px 14px;font-size:11.5px;
    color:var(--muted);letter-spacing:.02em;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
  .tip.show{opacity:1}
  /* When embedded read-only (GM Screen / session prep preview) the shim hides
     the sidebar; make the canvas fill and disable editing affordances. */
  body.embed #map{cursor:default}

  /* ── Phone layout ──────────────────────────────────────────────────
     Stack the canvas on top (big enough to draw on) with the controls in a
     scrollable panel below. Draw with one finger; pinch to zoom, two fingers
     (or one finger on empty space with Select) to pan. Not applied when the
     tool is embedded read-only (the shim hides the sidebar). */
  @media (max-width: 640px){
    /* Use the DYNAMIC viewport (dvh) so the layout tracks the phone browser's
       collapsing address/nav bars — 100vh is the *large* viewport, which pushes
       the bottom of the sidebar (the Export/PNG buttons) under the browser
       chrome. The sidebar is the scroll container; the safe-area + extra
       bottom padding guarantees the last buttons clear the chrome. */
    body:not(.embed) .app{ flex-direction: column; height:100dvh; }
    body:not(.embed) .preview-area{ order:1; flex:0 0 auto; height:52dvh; }
    body:not(.embed) .sidebar{ order:2; width:auto; flex:1 1 auto; min-height:0;
      border-right:none; border-top:1px solid var(--line);
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); }
  }
  /* light colour presets */
  .lpre{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-top:4px}
  .lpre button{height:24px;border-radius:5px;border:1px solid rgba(0,0,0,.45);cursor:pointer;padding:0}
  .lpre button.on{outline:2px solid var(--gold);outline-offset:1px}
  .lcol{width:46px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;
        background:none;cursor:pointer;flex:0 0 auto}
  .tool.off{opacity:.4}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="hdr">
      <h1>⚔ Map Maker</h1>
      <label class="switch" title="Dark mode — darkens the background only"><input type="checkbox" id="darkToggle"><span class="slider"></span></label>
    </div>

    <div class="grp">
      <div class="grp-head">
        <p class="grp-title">Tools</p>
        <div class="seg" id="modeSeg" title="Rooms: Square/Circle/Polygon draw rooms, Wall draws interior walls. Shapes: the same tools draw thin interior shapes (pillars, dais, tables, pits). Doors and stairs are unaffected either way.">
          <button type="button" data-mode="rooms" class="on">Rooms</button>
          <button type="button" data-mode="shapes">Shapes</button>
        </div>
      </div>
      <div class="grp-head" style="margin:-2px 0 8px">
        <p class="grp-title" style="margin:0">Advanced</p>
        <label class="switch" title="Textured floors, walls and background instead of the classic ink-on-parchment look">
          <input type="checkbox" id="advToggle"><span class="slider"></span></label>
      </div>
      <div class="tools" id="toolbar">
        <div class="tool active" data-tool="select" title="Select / move (V)">
          <svg viewBox="0 0 24 24"><path d="M5 3l6 16 2-6 6-2z"/></svg>Select</div>
        <div class="tool" data-tool="erase" title="Erase (E)">
          <svg viewBox="0 0 24 24"><path d="M4 15l7-7 6 6-4 4H8z"/><path d="M9 20h11"/></svg>Erase</div>
        <div class="tool" data-tool="rect" title="Rectangle (R) — room, or thin interior shape in Shapes mode">
          <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1"/></svg>Square</div>
        <div class="tool" data-tool="circle" title="Circle (C) — round room, or a perfect thin circle in Shapes mode">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>Circle</div>
        <div class="tool" data-tool="polygon" title="Polygon (P) — click points · click the first point to close a room · Enter or double-click leaves it open as a wall">
          <svg viewBox="0 0 24 24"><path d="M12 3l8 6-3 10H7L4 9z"/></svg>Polygon</div>
        <div class="tool" data-tool="draw" title="Draw (N) — freehand caves, water and organic rooms · release near where you started to close a room, anywhere else to leave a wall">
          <svg viewBox="0 0 24 24"><path d="M3 19c2.2-6.2 4.8-7 6.6-4.2s3.4 1.6 4.6-2.4S17 3.8 21 4.6"/><circle cx="3" cy="19" r="1.8" fill="currentColor" stroke="none"/></svg>Draw</div>
        <div class="tool" data-tool="door" title="Door (D)">
          <svg viewBox="0 0 24 24"><path d="M6 4h9v16H6z"/><path d="M15 9l4 3-4 3"/></svg>Door</div>
        <div class="tool" data-tool="stair" title="Stairs (S)">
          <svg viewBox="0 0 24 24"><path d="M4 20h4v-4h4v-4h4V8h4"/></svg>Stairs</div>
        <div class="tool" data-tool="light" title="Light (L) — switch Lights on below, then click the map">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/></svg>Light</div>
        <div class="tool" data-tool="shadow" title="Shadow (H) — a soft contact shadow to sit under an object">
          <svg viewBox="0 0 24 24"><ellipse cx="12" cy="15" rx="8" ry="4.2"/><path d="M8 15a4 2.2 0 0 0 8 0" opacity=".55"/></svg>Shadow</div>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn" id="undo" title="Undo (Ctrl+Z)">↶ Undo</button>
        <button class="btn" id="redo" title="Redo (Ctrl+Y)">↷ Redo</button>
      </div>
      <div class="row" style="margin-top:6px">
        <button class="btn" id="toFront" title="Bring the selected room / object in front of the others (F)" disabled>⬆ Front</button>
        <button class="btn" id="toBack" title="Send the selected room / object behind the others (B)" disabled>⬇ Back</button>
      </div>
      <div id="advBody" style="display:none;margin-top:14px">
        <label class="fld">Walls</label>
        <button class="pick" id="wallSel" type="button"><span class="sw"></span><span class="pl">—</span><span class="ca">&#9662;</span></button>
        <label class="fld">Floor</label>
        <button class="pick" id="floorSel" type="button"><span class="sw"></span><span class="pl">—</span><span class="ca">&#9662;</span></button>
        <label class="fld">Background</label>
        <button class="pick" id="bgSel" type="button"><span class="sw"></span><span class="pl">—</span><span class="ca">&#9662;</span></button>
        <div class="row" style="margin-top:10px">
          <button class="btn" id="packAdd">+ Asset pack</button>
        </div>
        <input type="file" id="packFile" accept=".dungeondraft_pack" style="display:none">
        <div id="packList" class="packs"></div>
      </div>
    </div>

    <div class="grp" id="objGroup">
      <div class="grp-head sec" data-sec="obj" role="button" tabindex="0" aria-expanded="true">
        <p class="grp-title">Objects</p><span class="caret">&#9662;</span>
      </div>
      <div id="objBody">
        <select class="sel" id="objPack" style="margin-bottom:6px"></select>
        <input class="sel" id="objFilter" type="text" placeholder="Search" autocomplete="off">
        <div id="objGrid" class="objgrid"></div>
      </div>
    </div>

    <div class="grp">
      <div class="grp-head">
        <p class="grp-title">Lights</p>
        <label class="switch" title="Coloured lights that cast soft shadows off walls. Works in classic mode too.">
          <input type="checkbox" id="lightToggle"><span class="slider"></span></label>
      </div>
      <div id="lightBody" style="display:none">
        <label class="fld">Darkness <b id="darkV">55%</b></label>
        <input type="range" id="darkness" min="0" max="100" value="55">
        <label class="fld">Pattern</label>
        <select class="sel" id="lightPat" title="Soft: an even wash. Hard: a bright core with a sharp shoulder. Fire: three ragged, firelit steps. Beam: a directional cone — drag the handle to aim it. Swirl: soft with Starry-Night eddies. Caustics: rippling light off water. Spotted: dappled, like sun through leaves. Energy: crackling filaments.">
          <option value="soft">Soft</option>
          <option value="hard">Hard</option>
          <option value="fire">Fire</option>
          <option value="swirl">Swirl</option>
          <option value="beam">Beam</option>
          <option value="caustic">Caustics</option>
          <option value="spotted">Spotted</option>
          <option value="energy">Energy</option>
        </select>
        <label class="fld">Colour</label>
        <div class="lpre" id="lightPresets"></div>
        <div class="row" style="margin-top:6px;align-items:center;gap:8px">
          <input type="color" id="lightColor" value="#ff9a3c" class="lcol" title="Custom colour">
          <span class="hint" id="lightColorName" style="margin:0">Torch</span>
        </div>
        <div id="beamRow" style="display:none">
          <label class="fld">Beam width <b id="lswV">60°</b></label>
          <input type="range" id="lightSpread" min="10" max="180" value="60">
        </div>
        <label class="fld">Radius <b id="lrV">2 sq</b></label>
        <input type="range" id="lightRadius" min="1" max="80" value="4">
        <label class="fld">Brightness <b id="lbV">50%</b></label>
        <input type="range" id="lightBright" min="5" max="100" value="50">
        <div class="row" style="margin-top:10px">
          <button class="btn" id="lightReset" title="Put the selected light back to a standard torch — or, with nothing selected, reset the settings for the next one. Darkness is left alone.">↺ Reset light</button>
        </div>
      </div>
    </div>

    <div class="grp">
      <div class="grp-head">
        <p class="grp-title">Shadows</p>
        <label class="switch" title="Soft contact shadows you place under objects">
          <input type="checkbox" id="shadowToggle"><span class="slider"></span></label>
      </div>
      <div id="shadowBody" style="display:none">
      <label class="fld">Width <b id="shwV">1.6 sq</b></label>
      <input type="range" id="shW" min="2" max="120" value="16">
      <label class="fld">Height <b id="shhV">1.1 sq</b></label>
      <input type="range" id="shH" min="2" max="120" value="11">
      <label class="fld">Softness <b id="shsV">55%</b></label>
      <input type="range" id="shSoft" min="0" max="100" value="55">
      <label class="fld">Strength <b id="shtV">60%</b></label>
      <input type="range" id="shStr" min="5" max="100" value="60">
      <label class="fld" title="A soft dark band inside every room wall — it is what makes a room read as a room. Applies to the whole map.">Wall shadow <b id="shwsV">55%</b></label>
      <input type="range" id="wallShadow" min="0" max="100" value="55">
      <div class="row" style="margin-top:10px">
        <button class="btn" id="shadowReset" title="Put the selected shadow back to the default softness and strength, re-fitted to whatever object it sits on">↺ Reset shadow</button>
      </div>
      </div>
    </div>

    <div class="grp">
      <div class="chk-row">
        <label class="chk" title="Toggle with Shift+S"><input type="checkbox" id="snapToggle" checked> Snap to grid</label>
        <label class="chk"><input type="checkbox" id="gridToggle" checked> Show grid</label>
      </div>
      <label class="fld">Grid opacity <b id="gridOpV">50%</b></label>
      <input type="range" id="gridOp" min="0" max="100" value="50">
      <div class="row" style="margin-top:10px">
        <button class="btn" id="clear">Clear</button>
        <button class="btn" id="fit">Fit view</button>
      </div>
    </div>

    <div class="grp">
      <div class="grp-head sec" data-sec="gen" role="button" tabindex="0" aria-expanded="true">
        <p class="grp-title">Random Dungeon</p><span class="caret">&#9662;</span>
      </div>
      <div id="genBody">
      <label class="fld">Rooms <b id="roomsV">8</b></label>
      <input type="range" id="rooms" min="2" max="24" value="8">
      <label class="fld">Room size <b id="sizeV">Medium</b></label>
      <input type="range" id="rsize" min="1" max="5" value="3">
      <label class="fld">Layout <b id="spreadV">Balanced</b></label>
      <input type="range" id="spread" min="1" max="5" value="3">
      <label class="fld">Entrances <b id="entrancesV">2</b></label>
      <input type="range" id="entrances" min="0" max="6" value="2">
      <label class="chk"><input type="checkbox" id="corridors" checked> Connect with corridors</label>
      <label class="chk"><input type="checkbox" id="roundish"> Allow round rooms</label>
      <button class="btn gold wide" id="generate" style="margin-top:12px">🎲 Generate Dungeon</button>
      </div>
    </div>

    <div class="grp flush">
      <div class="row">
        <button class="btn" id="export" title="Download an editable map file (.json) you can re-open later">⬇ Export</button>
        <button class="btn" id="import" title="Open a previously exported map file">⬆ Import</button>
      </div>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none">
      <div class="row" style="margin-top:6px">
        <button class="btn" id="png">⬇ PNG</button>
        <button class="btn" id="pngT" title="Transparent background — floors only">⬇ PNG (transp.)</button>
      </div>
      <p class="credit">Assets by <a href="https://2minutetabletop.com/" target="_blank" rel="noopener noreferrer">2-Minute Tabletop</a>
        (<a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener noreferrer">CC BY-NC 4.0</a>)<br>
        and <a href="https://axebane.com/" target="_blank" rel="noopener noreferrer">Axebane Games</a>
        (<a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a>)</p>
    </div>

    <div class="spacer"></div>
  </aside>
  <!-- One shared picker popup, position:fixed so the scrolling sidebar can't clip it. -->
  <div id="pickPop" class="pickpop" hidden></div>

  <div class="preview-area">
    <canvas id="map"></canvas>
    <div class="float tip" id="tip"></div>
    <div class="float zoombar">
      <button id="zoomOut">−</button>
      <span id="zoomPct">100%</span>
      <button id="zoomIn">+</button>
    </div>
  </div>
</div>

<script>
"use strict";
(function(){
/* ════════════════════════════════════════════════════════════════════
   DUNGEON MAP MAKER — a compact, clean hand-drawn-ink dungeon drawer.
   Self-contained. Nothing is saved to a server: work is kept in the
   browser (localStorage key "dcc_map") so a refresh doesn't lose it, and
   a map is persisted / shared with Export & Import (.json) or the two PNG
   exports. Light + dark (blue-grey) themes via the Dark mode toggle.
   ════════════════════════════════════════════════════════════════════ */

  // ── Palette / theme (light parchment vs. dark blue-grey) ───────────
  // Grid + dots are deliberately darker than v1 so they read clearly.
  const THEMES = {
    light: {
      bg:"#d9d0bd",       // canvas area behind the map (CSS)
      rockHi:"#efe8d7",   // exterior background fill
      floor:"#f4efe3",    // room floor
      grid:"#1b2028",     // near-black blue-grey grid inside rooms
                          // (the exterior dot grid below stays mid-grey — it is
                          //  background texture in classic mode, not the grid)
      dot:"#8a8a8a",      // medium-grey dot grid
      hatch:"#33302a",
      ink:"#14120d",      // walls, doors, stairs (near-black ink)
      doorFill:"#fbf8f0", // door leaf interior (classic)
      doorWood:"#8b5e3c", // …and in Advanced Mode, so it reads as a wooden door
      shadow:"rgba(20,17,12,.18)",
      sel:"#c9a94a",
    },
  };
  // Dark mode changes ONLY the exterior background. Medium-grey grid + dots read
  // fine on both the light floors and the dark exterior, so they're shared;
  // walls, interior floors, doors, and stairs are identical to light mode.
  THEMES.dark = Object.assign({}, THEMES.light, {
    bg:"#171a21",         // dark bluish grey backdrop
    rockHi:"#232833",     // dark bluish grey exterior
  });
  const C = Object.assign({}, THEMES.light);   // active palette, mutated by setTheme
  let theme = "light";
  function setThemeColors(t){
    theme = (t === "dark") ? "dark" : "light";
    Object.assign(C, THEMES[theme]);
    const pa = document.querySelector(".preview-area");
    if(pa) pa.style.background = THEMES[theme].bg;
  }
  function setTheme(t){ setThemeColors(t); map.theme = theme; scheduleSave(); render(); }
  const CELL = 32;                 // world px per grid cell at scale 1
  const SIZE_MAP = {1:[3,4],2:[4,6],3:[5,8],4:[7,11],5:[9,15]};
  const SIZE_LBL = {1:"Tiny",2:"Small",3:"Medium",4:"Large",5:"Huge"};
  const SPREAD_LBL = {1:"Tight",2:"Cozy",3:"Balanced",4:"Sprawling",5:"Vast"};

  // ── State ─────────────────────────────────────────────────────────
  let map = blankMap();
  let tool = "select";
  let drawMode = "rooms";                    // "rooms" | "shapes" — Square/Circle/Polygon/Wall target
  let snapOn = true;                        // snap-to-grid toggle
  let cam = { x: 0, y: 0, scale: 1 };     // world→screen: s = (w - cam)*scale ... (see helpers)
  let history = [], future = [];
  let embed = false;                       // read-only preview

  const cv = document.getElementById("map");
  const ctx = cv.getContext("2d");
  let W = 0, H = 0, DPR = 1;

  function blankMap(){
    return { version:1, name:"", grid:true, gridOpacity:0.5, style:DEFAULT_STYLE(),
             lit:false, darkness:0.55, lights:[], shadowsOn:false, shadows:[], wallShadow:0.55,
             shapes:[], walls:[], doors:[], stairs:[], objects:[], seedId:1 };
  }
  function uid(){ return map.seedId++; }

  // ── Coordinate helpers (world cells ↔ screen px) ──────────────────
  function wpx(){ return CELL * cam.scale; }                 // screen px per cell

  // A repeating world-aligned pattern for a texture tile that is `cells` grid
  // cells wide: scaled so one tile spans exactly that many cells at the current
  // zoom, and translated so the tile grid lines up with world (0,0) — the same
  // origin the square grid uses, so texture and grid never drift apart.
  // `tex` is set by applyStyle(); null ⇒ classic flat-colour render.
  let tex = null;
  function patFor(c, t){
    if(!t || !t.img) return null;
    const img=t.img; if(!img.complete || !img.naturalWidth) return null;
    let p; try { p=c.createPattern(img, "repeat"); } catch(e){ return null; }
    if(!p || !p.setTransform || typeof DOMMatrix==="undefined") return null;
    const s=(wpx()*(t.cells||4))/img.naturalWidth, o=toScreen(0,0);
    try { p.setTransform(new DOMMatrix([s,0,0,s,o[0],o[1]])); } catch(e){ return null; }
    return p;
  }
  function toScreen(wx, wy){ return [ (wx - cam.x)*wpx() + W/2, (wy - cam.y)*wpx() + H/2 ]; }
  function toWorld(sx, sy){ return [ (sx - W/2)/wpx() + cam.x, (sy - H/2)/wpx() + cam.y ]; }
  function snap(v){ return snapOn? Math.round(v): v; }
  function snapPt(wx, wy){ return [ snap(wx), snap(wy) ]; }

  // ════════════════════════════════════════════════════════════════
  // RENDER
  // ════════════════════════════════════════════════════════════════
  // offscreen scratch buffers (CSS-px sized) for the floor fill & grid clip
  function oc(){ return document.createElement("canvas"); }
  const buf = { mask:oc(), tint:oc(), grid:oc(), wall:oc(), erode:oc(), deco:oc(), decoClip:oc(),
                 light:oc(), ltint:oc(), wsh:oc() };
  function sizeBufs(){ for(const k in buf){ if(buf[k].width!==W||buf[k].height!==H){ buf[k].width=W; buf[k].height=H; } } }

  // draw a single floor shape's path into a 2d context (screen space)
  function shapePath(c, sh){
    const p = wpx();
    if(sh.type==="rect"){
      const [x,y]=toScreen(sh.x, sh.y);
      c.rect(x, y, sh.w*p, sh.h*p);
    } else if(sh.type==="circle"){
      const [x,y]=toScreen(sh.cx, sh.cy);
      c.moveTo(x+sh.r*p, y);
      c.arc(x, y, sh.r*p, 0, Math.PI*2);
    } else if(sh.type==="polygon" && sh.pts.length>1){
      // Emit with the SAME winding as rect()/arc() (positive shoelace). These
      // subpaths are unioned via fill/clip "nonzero"; a polygon the user happened
      // to click the other way round winds −1, cancels against its neighbour and
      // punches a HOLE in the floor wherever two rooms overlap.
      const pts=sh.pts, n=pts.length; let a2=0;
      for(let i=0;i<n;i++){ const q=pts[(i+1)%n]; a2 += pts[i][0]*q[1] - q[0]*pts[i][1]; }
      const rev = a2 < 0;
      for(let i=0;i<n;i++){ const q = pts[rev ? n-1-i : i];
        const [x,y]=toScreen(q[0], q[1]); if(i===0) c.moveTo(x,y); else c.lineTo(x,y); }
      c.closePath();
    }
  }

  // stable pseudo-random from a world position — keeps wobble & hatch from
  // shimmering as the camera moves.
  function hash2(x,y){ const h=Math.sin(x*127.1 + y*311.7)*43758.5453; return h-Math.floor(h); }
  function seeded(x,y){ let s=(Math.floor(x*8191)^Math.floor(y*131071))>>>0; s=(s^0x9e3779b9)>>>0;
    return function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
  function pointInAny(wx,wy){ const S=map.shapes; for(let i=0;i<S.length;i++) if(pointInShape(wx,wy,S[i])) return true; return false; }

  // ── Union boundary as VECTOR contours (marching squares over a world grid).
  // Camera-independent, so it is cached and only rebuilt when geometry changes.
  let contours=[], hatchStrokes=[], geomDirty=true;
  function markGeom(){ geomDirty=true; }
  function ensureGeom(){ if(geomDirty){ geomDirty=false; buildGeometry(); } }

  function buildGeometry(){
    // Crosshatching was removed per request, and walls now render per-shape
    // (drawWalls) rather than from a union contour — so no geometry to build.
    contours=[]; hatchStrokes=[];
    return;
    /* eslint-disable no-unreachable */
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; const S=map.shapes;
    for(const s of S){ const b=bounds(s,"shape"); if(b){ x0=Math.min(x0,b.x); y0=Math.min(y0,b.y); x1=Math.max(x1,b.x+b.w); y1=Math.max(y1,b.y+b.h); } }
    const res=0.5;                                          // trace on the half-cell grid
    x0=Math.floor(x0/res)*res - res; y0=Math.floor(y0/res)*res - res;
    x1=Math.ceil(x1/res)*res + res;  y1=Math.ceil(y1/res)*res + res;
    const gw=Math.round((x1-x0)/res), gh=Math.round((y1-y0)/res);
    // Cell occupancy by centre test. Rooms are grid-aligned, so their edges fall
    // exactly on grid lines ⇒ the traced walls stay ON the grid and never drift.
    const occ=new Uint8Array(gw*gh);
    for(let j=0;j<gh;j++){ const cy=y0+(j+0.5)*res; for(let i=0;i<gw;i++){ occ[j*gw+i]=pointInAny(x0+(i+0.5)*res, cy)?1:0; } }
    const O=(i,j)=> (i<0||j<0||i>=gw||j>=gh)?0:occ[j*gw+i];
    const P=(i,j)=>[x0+i*res, y0+j*res];
    // Boundary = the cell edges that sit between an occupied and an empty cell —
    // axis-aligned unit segments on grid lines.
    const segs=[];
    for(let j=0;j<gh;j++) for(let i=0;i<gw;i++){ if(!O(i,j)) continue;
      if(!O(i,j-1)) segs.push([P(i,j),   P(i+1,j)]);        // top
      if(!O(i,j+1)) segs.push([P(i,j+1), P(i+1,j+1)]);      // bottom
      if(!O(i-1,j)) segs.push([P(i,j),   P(i,j+1)]);        // left
      if(!O(i+1,j)) segs.push([P(i+1,j), P(i+1,j+1)]);      // right
    }
    const loops=stitch(segs);
    // Merge collinear runs (drop mid-edge points, keep corners exactly on-grid;
    // also smooths circle/polygon stairsteps into chords).
    for(let lp of loops){ lp=rdp(lp, res*0.9); if(lp.length>=4) contours.push(lp); }
    hatchStrokes=buildHatchStrokes(contours);
  }

  function stitch(segs){
    const key=p=>Math.round(p[0]*1000)+"|"+Math.round(p[1]*1000);
    const adj=new Map(), pos=new Map();
    for(const [a,b] of segs){ const ka=key(a),kb=key(b); if(ka===kb) continue;
      pos.set(ka,a); pos.set(kb,b);
      (adj.get(ka)||adj.set(ka,[]).get(ka)).push(kb);
      (adj.get(kb)||adj.set(kb,[]).get(kb)).push(ka); }
    const usedEdge=new Set(), loops=[];
    const eid=(a,b)=> a<b? a+">"+b : b+">"+a;
    for(const start of adj.keys()){
      let has=false; for(const n of adj.get(start)) if(!usedEdge.has(eid(start,n))){ has=true; break; }
      if(!has) continue;
      let cur=start, prev=null; const loop=[]; let guard=0;
      while(cur && guard++<200000){
        loop.push(pos.get(cur));
        const nbrs=adj.get(cur)||[]; let nxt=null;
        for(const n of nbrs){ if(!usedEdge.has(eid(cur,n)) && n!==prev){ nxt=n; break; } }
        if(!nxt){ for(const n of nbrs){ if(!usedEdge.has(eid(cur,n))){ nxt=n; break; } } }
        if(!nxt) break;
        usedEdge.add(eid(cur,nxt)); prev=cur; cur=nxt;
        if(cur===start) break;
      }
      if(loop.length>=3) loops.push(loop);
    }
    return loops;
  }

  function perpDist(p,a,b){ const dx=b[0]-a[0],dy=b[1]-a[1]; const l=Math.hypot(dx,dy)||1;
    return Math.abs((p[0]-a[0])*dy-(p[1]-a[1])*dx)/l; }
  function rdp(pts,eps){
    if(pts.length<4) return pts;
    const keep=new Array(pts.length).fill(false); keep[0]=keep[pts.length-1]=true;
    const stack=[[0,pts.length-1]];
    while(stack.length){ const [s,e]=stack.pop(); let dmax=0,idx=-1;
      for(let i=s+1;i<e;i++){ const d=perpDist(pts[i],pts[s],pts[e]); if(d>dmax){ dmax=d; idx=i; } }
      if(dmax>eps && idx>0){ keep[idx]=true; stack.push([s,idx],[idx,e]); } }
    const out=[]; for(let i=0;i<pts.length;i++) if(keep[i]) out.push(pts[i]);
    const f=out[0], l=out[out.length-1];
    if(f && (f[0]!==l[0]||f[1]!==l[1])) out.push([f[0],f[1]]);
    return out;
  }

  // True crosshatching. A dense base layer of bundles roots on the wall and
  // leans outward. Each later generation spawns from points ALONG existing lines
  // (not their tips) and runs PERPENDICULAR to that line — so successive families
  // cross at right angles, weaving a proper crosshatch. Everything stays exterior.
  function buildHatchStrokes(loops){
    const out=[];        // [x1,y1,x2,y2]
    const strokes=[];    // {a:[x,y], b:[x,y]}
    const skew=0.5;      // outward lean of the base combs (radians off the normal)
    const ca=Math.cos(skew), sa=Math.sin(skew);
    const bundleGap=0.6, lineGap=0.14;
    // base layer — rooted on the wall
    for(const loop of loops){
      let carry=0.25;
      for(let i=0;i<loop.length-1;i++){
        const a=loop[i], b=loop[i+1];
        const dx=b[0]-a[0], dy=b[1]-a[1]; const segLen=Math.hypot(dx,dy); if(segLen<1e-4) continue;
        const tx=dx/segLen, ty=dy/segLen; let nx=-ty, ny=tx;
        const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
        if(pointInAny(mx+nx*0.15, my+ny*0.15)){ nx=-nx; ny=-ny; }   // outward
        const hx=nx*ca - ny*sa, hy=nx*sa + ny*ca;
        let d=carry;
        while(d<segLen){
          const bx=a[0]+tx*d, by=a[1]+ty*d;
          const r=seeded(bx*7.0, by*7.0);
          const N=3+Math.floor(r()*3);            // 3..5 lines per bundle
          const L=0.55 + r()*0.25;
          for(let k=0;k<N;k++){
            const o=(k-(N-1)/2)*lineGap;
            const sx=bx + tx*o, sy=by + ty*o;      // root ON the wall
            const ex=sx + hx*L, ey=sy + hy*L;
            if(pointInAny(ex,ey)) continue;
            const st={a:[sx,sy], b:[ex,ey]}; strokes.push(st); out.push([sx,sy,ex,ey]);
          }
          d += bundleGap;
        }
        carry = d - segLen;
      }
    }
    // crossing generations — spawn along each line, perpendicular to it
    let front=strokes, depth=0; const maxDepth=2;
    while(depth<maxDepth && front.length){
      const next=[];
      for(const s of front){
        const dx=s.b[0]-s.a[0], dy=s.b[1]-s.a[1]; const len=Math.hypot(dx,dy)||1;
        const px=-dy/len, py=dx/len;               // perpendicular to this line
        for(const f of [0.32, 0.6, 0.84]){          // points ALONG the line (not the tips)
          const cx=s.a[0]+dx*f, cy=s.a[1]+dy*f;
          const r=seeded(cx*17.0 + depth*2.3, cy*17.0);
          if(r()<0.4) continue;
          const dir = r()<0.5 ? 1 : -1;
          const L=0.34 + r()*0.26;
          const ex=cx + px*dir*L, ey=cy + py*dir*L;
          if(pointInAny(ex,ey) || pointInAny((cx+ex)/2,(cy+ey)/2)) continue;   // exterior only
          const st={a:[cx,cy], b:[ex,ey]}; next.push(st); out.push([cx,cy,ex,ey]);
        }
      }
      front=next; depth++;
    }
    return out;
  }

  // Render entry point. The MAP itself (floors/walls/doors/stairs/grid/dots) is
  // drawn by the shared DungeonEngine when it's loaded (single source of truth,
  // shared with the GM Screen + Session Prep); otherwise by the inlined
  // renderLocalMap() fallback. Tool-preview + selection overlays are always drawn
  // here on top.
  function render(){
    applyStyle();
    if(window.DungeonEngine && window.DungeonEngine.renderTo){
      window.DungeonEngine.renderTo(ctx, map, {cam, W, H, DPR, theme, transparent:noRock, tex});
    } else {
      renderLocalMap();
    }
    if(!exporting){
      // With an object armed the ghost moves far more often than the map changes,
      // and a lit textured map costs ~83 ms a frame. Keep a copy of the bare map
      // layer so a ghost-only frame is a blit (~1 ms) instead of a re-render. Only
      // while armed — the copy is a full-canvas drawImage and shouldn't be paid
      // for on every ordinary render.
      // …and DROP it the moment nothing is armed, or the next arm would blit a
      // map cached before whatever happened in between. Nothing renders on arming
      // itself, so a null cache makes the first ghost frame fall back to a full
      // render — which refills it.
      if(armedObj) snapMap(); else mapSnap=null;
      drawPreview(); drawLightMarkers(); drawSelection();
    }
  }
  let mapSnap=null;
  function snapMap(){
    if(!mapSnap) mapSnap=document.createElement("canvas");
    if(mapSnap.width!==cv.width || mapSnap.height!==cv.height){
      mapSnap.width=cv.width; mapSnap.height=cv.height; }
    const g=mapSnap.getContext("2d");
    g.setTransform(1,0,0,1,0,0);
    g.clearRect(0,0,mapSnap.width,mapSnap.height);
    g.drawImage(cv,0,0);
  }
  // Repaint the overlays over the cached map. Anything that actually changes the
  // map goes through render(), which refreshes the cache, so this can never show
  // a stale map — it just can't be used before the first armed render.
  function renderGhostOnly(){
    if(!mapSnap || mapSnap.width!==cv.width || mapSnap.height!==cv.height){ render(); return; }
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.drawImage(mapSnap,0,0);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    drawPreview(); drawLightMarkers(); drawSelection();
  }
  function renderLocalMap(){
    // Work in CSS-pixel logical space; scale once for crisp HiDPI output.
    ctx.setTransform(DPR,0,0,DPR,0,0);
    doorHalf=null;                      // per-door wall thickness, recomputed per frame
    lightSegs=null;                     // light occluders, likewise
    ctx.clearRect(0,0,W,H);
    if(!noRock){
      const bgPat = patFor(ctx, tex && tex.bg), bgCol = tex && tex.bgColor;
      ctx.fillStyle = bgPat || bgCol || C.rockHi; ctx.fillRect(0,0,W,H);
      if(!bgPat && !bgCol) drawDotGrid();   // dots would just fight a rock texture
    }

    const shapes = map.shapes;
    if(shapes.length){
      ensureGeom();
      sizeBufs();
      // floor mask (white union)
      const m=buf.mask.getContext("2d"); m.setTransform(1,0,0,1,0,0);
      m.clearRect(0,0,W,H); m.fillStyle="#fff"; m.beginPath();
      for(const sh of shapes){ if(sh.deco) continue; shapePath(m, sh); } m.fill("nonzero");
      // Floors are PER-SHAPE. Walk the shapes in z-order and batch CONSECUTIVE
      // runs that share a fill: the common single-floor map still costs one pass
      // (and renders byte-identically to before), while a mixed map stays correct
      // — a later shape paints over an earlier one exactly as it was drawn.
      const runs=[];
      for(const sh of shapes){ if(sh.deco) continue;
        const ft=shapeFloorTex(sh), last=runs[runs.length-1];
        if(last && last.t===ft) last.list.push(sh); else runs.push({t:ft, list:[sh]});
      }
      const tc=buf.tint.getContext("2d"); tc.setTransform(1,0,0,1,0,0);
      tc.clearRect(0,0,W,H); tc.globalCompositeOperation="source-over";
      // Untextured floors keep the original mask + `source-in` path so the classic
      // render stays byte-identical. Anything with a texture — one run or twenty —
      // goes through the clipped-fill path below, which is both faster and the
      // only way mixed floors can be composited cheaply.
      if(runs.length<=1 && !(runs.length && runs[0].t)){
        tc.drawImage(buf.mask,0,0);
        tc.globalCompositeOperation="source-in";
        tc.fillStyle = patFor(tc, runs.length?runs[0].t:null) || C.floor; tc.fillRect(0,0,W,H);
        tc.globalCompositeOperation="source-over";
      } else {
        // One CLIPPED pattern fill per run — no composite modes, no scratch
        // buffers. The obvious mask + `source-in` approach is a trap here:
        // source-in is defined over the WHOLE canvas (everything outside the
        // source is cleared), so it costs a full-canvas pass per run even when
        // the fill is tiny — ~180 ms on an 18-room, four-style map. Clipping
        // costs only the run's own box.
        for(const r of runs){
          const bb=runBox(r.list); if(!bb) continue;
          tc.save();
          tc.beginPath(); for(const sh of r.list) shapePath(tc, sh); tc.clip("nonzero");
          tc.fillStyle = patFor(tc, r.t) || C.floor;
          tc.fillRect(bb.x,bb.y,bb.w,bb.h);
          tc.restore();
        }
      }
      ctx.drawImage(buf.tint,0,0);
      // grid inside floor
      if(map.grid && gridOp()>0 && wpx()>7){
        const gc=buf.grid.getContext("2d"); gc.setTransform(1,0,0,1,0,0);
        gc.clearRect(0,0,W,H); gc.globalCompositeOperation="source-over";
        // Width scales with zoom so it's a constant fraction of a cell: 3px at
        // export scale (res=2, the look Michael liked) and correspondingly thinner
        // in the live preview instead of a fixed 3px that looks heavy there.
        gc.strokeStyle=C.grid; gc.lineWidth=Math.max(1,1.5*cam.scale); gc.globalAlpha=.85*gridOp();
        const p=wpx(); const [ox,oy]=toScreen(0,0); gc.beginPath();
        for(let x=ox%p;x<=W;x+=p){ gc.moveTo(x+.5,0); gc.lineTo(x+.5,H); }
        for(let y=oy%p;y<=H;y+=p){ gc.moveTo(0,y+.5); gc.lineTo(W,y+.5); }
        gc.stroke(); gc.globalAlpha=1;
        gc.globalCompositeOperation="destination-in"; gc.drawImage(buf.mask,0,0);
        ctx.drawImage(buf.grid,0,0);
      }
      drawWallInnerShadow();             // soft band inside every wall (Shadows switch)
      drawWalls();                       // rough-edged room walls (round circles), drop shadow
    }

    drawInteriorWalls();
    drawDecoShapes();
    for(const d of map.doors) drawDoor(d);
    for(const s of map.stairs) drawStair(s);
    drawShadows();
    drawObjects();
    drawLights();
  }

  // ── WALL SHADOW ────────────────────────────────────────────────────
  // A soft dark band hugging the INSIDE of every room wall — the trick that
  // makes a room read as a room rather than a texture swatch. Rides with the
  // Shadows switch; `map.wallShadow` (0..1) is its strength, 0 turns it off.
  // Drawn under the wall art so the band tucks beneath the stonework.
  const WALL_SHADOW_CELLS = 0.35;                 // band depth, between a quarter and a half square
  function drawWallInnerShadow(){
    if(!map || !map.shadowsOn) return;
    const amt = map.wallShadow==null ? 0.55 : Math.max(0, Math.min(1, map.wallShadow));
    if(amt<=0) return;
    const px = WALL_SHADOW_CELLS*wpx();
    if(px < 1.5) return;                          // too zoomed out to read as anything
    let any=false;
    for(const sh of map.shapes) if(!sh.deco){ any=true; break; }
    if(!any) return;
    sizeBufs();
    const c=buf.wsh.getContext("2d");
    c.setTransform(1,0,0,1,0,0); c.globalAlpha=1; c.filter="none";
    c.globalCompositeOperation="source-over"; c.clearRect(0,0,W,H);
    c.fillStyle="rgba(8,10,16,"+(0.78*amt).toFixed(3)+")"; c.fillRect(0,0,W,H);
    c.globalCompositeOperation="destination-in"; c.drawImage(buf.mask,0,0);   // floors only
    // …then carve the middle of the room back out with a blurred inset fill,
    // which leaves exactly the feathered band along the boundary.
    c.globalCompositeOperation="destination-out";
    c.filter="blur("+(px*0.38).toFixed(2)+"px)";
    c.fillStyle="#fff";
    // Inset by the WALL's own half-thickness as well, so the band is measured from
    // the wall's inner face inward. Insetting by the band alone puts most of it
    // underneath the stonework and only a sliver survives — and a thick cave wall
    // would swallow it entirely.
    for(const sh of map.shapes){ if(sh.deco) continue;
      fillInsetShape(c, sh, halfCellsFor(shapeWallTex(sh)) + WALL_SHADOW_CELLS); }
    c.filter="none"; c.globalCompositeOperation="source-over";
    ctx.save(); ctx.globalCompositeOperation="multiply"; ctx.drawImage(buf.wsh,0,0); ctx.restore();
  }

  // ══════════════════════ SHADOWS (Advanced Mode) ══════════════════════
  // Hand-placed contact shadows — soft ellipses drawn UNDER the objects so a
  // barrel reads as standing on the floor instead of floating on it.
  //   map.shadows[] = { id, x, y, w, h, rot, soft (0..1), strength (0..1) }
  // STATIC by design: they do not track the lights. See claude/map-maker-lights.md.
  // Composited with `multiply` so the floor texture darkens instead of being
  // greyed out by a flat black wash — a 60% black ellipse over stone reads as a
  // hole punched in the floor, the same trap the door leaf hit in classic mode.
  // Deliberately NOT clipped to the floor mask: clipping would cut a hard edge
  // along every room boundary, which looks far worse than a little spill.
  function drawShadows(){
    // v41: master switch, mirroring map.lit. Only an explicit false hides them, so
    // a caller that never sets the flag (or a map saved before v41) still draws.
    if(!map || map.shadowsOn===false) return;       // works in classic mode too (v39)
    const list=map.shadows||[]; if(!list.length) return;
    ctx.save(); ctx.globalCompositeOperation="multiply";
    for(let i=0;i<list.length;i++){
      const s=list[i];
      const a=Math.max(0, Math.min(1, s.strength==null ? 0.6 : s.strength));
      if(a<=0) continue;
      const rx=Math.max(0.05, s.w||1.6)/2*wpx(), ry=Math.max(0.05, s.h||1.1)/2*wpx();
      if(rx<0.4 || ry<0.4) continue;
      const soft=Math.max(0, Math.min(1, s.soft==null ? 0.55 : s.soft));
      const core=0.92*(1-soft);                     // fully opaque out to here, then fade
      const p=toScreen(s.x,s.y);
      ctx.save();
      ctx.translate(p[0],p[1]); ctx.rotate(s.rot||0); ctx.scale(rx,ry);
      const g=ctx.createRadialGradient(0,0,0,0,0,1);
      g.addColorStop(0, "rgba(6,8,14,"+a+")");
      if(core>0.001) g.addColorStop(core, "rgba(6,8,14,"+a+")");
      g.addColorStop(core+(1-core)*0.55, "rgba(6,8,14,"+(a*0.35).toFixed(4)+")");
      g.addColorStop(1, "rgba(6,8,14,0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,1,0,6.2832); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  // ══════════════════════ LIGHTS (Advanced Mode) ══════════════════════
  // A darkness wash laid over the finished map that every light carves a pool
  // out of, plus an additive colour tint on top. `map.darkness` (0..1) is the
  // one control: at 0 this is pure coloured glow on a fully lit map, at 1 it is
  // near-black outside the lights.
  //
  //   map.lit       — master switch, nothing here runs when it is off
  //   map.darkness  — 0..1 wash strength
  //   map.lights[]  — { id, x, y, r (cells), color, bright (0..1) }
  //
  // Shadows: each light gets a VISIBILITY POLYGON ray-marched against room
  // outlines and interior walls, which is then blurred so the shadow edges are
  // soft rather than geometric. Doors are deliberately NOT cut out of the
  // occluders — a door is closed, so it contains the light in its room.
  let lightSegs = null;                       // occluder cache, rebuilt per render
  // ⚠ A room edge that lies INSIDE another room is not a wall. The interior punch
  // (the union of per-shape inset fills) erases it so the two rooms read as one
  // space — a corridor meeting a room, two overlapping rooms. Blocking light on
  // those buried edges casts shadows off walls that are not on the map. Each edge
  // is therefore walked in short steps and only the runs that stay OUTSIDE every
  // other room survive, so a half-buried edge still occludes along the half you
  // can see. Interior walls (map.walls) always draw on top, so they are kept whole.
  function lightOccluders(){
    if(lightSegs) return lightSegs;
    lightSegs=[];
    const rooms=[], rb=[];
    for(const sh of map.shapes){ if(sh.deco) continue; rooms.push(sh); rb.push(bounds(sh,"shape")); }
    const hits=(bx0,by0,bx1,by1,i)=>{ const b=rb[i];
      return !!b && bx0<=b.x+b.w && bx1>=b.x && by0<=b.y+b.h && by1>=b.y; };
    for(let si=0; si<rooms.length; si++){
      const sh=rooms[si], o=shapeOutline(sh);
      for(let i=0;i<o.length;i++){
        const a=o[i], b=o[(i+1)%o.length];
        const dx=b[0]-a[0], dy=b[1]-a[1], len=Math.hypot(dx,dy);
        if(len<1e-6) continue;
        // Only edges overlapping another room's box can be buried — skip the walk
        // entirely otherwise, which is the common case.
        const ex0=Math.min(a[0],b[0]), ex1=Math.max(a[0],b[0]);
        const ey0=Math.min(a[1],b[1]), ey1=Math.max(a[1],b[1]);
        const cand=[];
        for(let j=0;j<rooms.length;j++) if(j!==si && hits(ex0,ey0,ex1,ey1,j)) cand.push(rooms[j]);
        if(!cand.length){ lightSegs.push([a[0],a[1],b[0],b[1]]); continue; }
        const n=Math.max(1, Math.min(64, Math.ceil(len/0.35)));
        let s0=null;
        const at=t=>[a[0]+dx*t, a[1]+dy*t];
        for(let k=0;k<n;k++){
          const tm=(k+0.5)/n, m=at(tm);
          let vis=true;
          for(let j=0;j<cand.length;j++) if(pointInShape(m[0],m[1],cand[j])){ vis=false; break; }
          if(vis && s0===null) s0=k/n;
          else if(!vis && s0!==null){ const p=at(s0), q=at(k/n);
            lightSegs.push([p[0],p[1],q[0],q[1]]); s0=null; }
        }
        if(s0!==null){ const p=at(s0); lightSegs.push([p[0],p[1],b[0],b[1]]); }
      }
    }
    for(const w of map.walls){ const s=wallPts(w);
      for(let i=0;i<s.length-1;i++) lightSegs.push([s[i][0],s[i][1],s[i+1][0],s[i+1][1]]); }
    return lightSegs;
  }
  // Distance from the ray origin to a segment, or -1. Parametric solve; `u` is
  // the position ALONG the segment so it must stay inside [0,1].
  function rayHitT(px,py,dx,dy,s){
    const ax=s[0], ay=s[1], bx=s[2]-s[0], by=s[3]-s[1];
    const den=dx*by - dy*bx; if(den>-1e-12 && den<1e-12) return -1;
    const t=((ax-px)*by - (ay-py)*bx)/den; if(t<=1e-9) return -1;
    const u=((ax-px)*dy - (ay-py)*dx)/den;
    return (u>=0 && u<=1) ? t : -1;
  }
  function segNear(s,px,py,r){
    const dx=s[2]-s[0], dy=s[3]-s[1], l2=dx*dx+dy*dy;
    let t=l2 ? ((px-s[0])*dx+(py-s[1])*dy)/l2 : 0; t=t<0?0:(t>1?1:t);
    const qx=px-(s[0]+t*dx), qy=py-(s[1]+t*dy);
    return qx*qx+qy*qy <= r*r;
  }
  // A uniform angular sweep (degrades gracefully, never misses a caster) PLUS
  // three rays at every occluder endpoint (so the shadow boundary lands exactly
  // on the corner that cast it instead of being rounded off by the sweep).
  function visPoly(L){
    const R=Math.max(0.4, L.r||6), near=lightOccluders().filter(s=>segNear(s,L.x,L.y,R));
    const N=Math.max(64, Math.min(288, Math.round(R*22)));
    const angs=new Array(N);
    for(let i=0;i<N;i++) angs[i]=i/N*Math.PI*2 - Math.PI;
    for(const s of near){
      for(let k=0;k<4;k+=2){
        const dx=s[k]-L.x, dy=s[k+1]-L.y;
        if(dx*dx+dy*dy > R*R) continue;
        const a=Math.atan2(dy,dx);
        angs.push(a-2e-4, a, a+2e-4);
      }
    }
    angs.sort(function(a,b){ return a-b; });
    const pts=[];
    for(let i=0;i<angs.length;i++){
      const a=angs[i], dx=Math.cos(a), dy=Math.sin(a);
      let t=R;
      for(let j=0;j<near.length;j++){ const h=rayHitT(L.x,L.y,dx,dy,near[j]); if(h>0 && h<t) t=h; }
      pts.push([L.x+dx*t, L.y+dy*t]);
    }
    return pts;
  }
  // Three falloff PROFILES (L.pattern), modelled on Dungeondraft's:
  //   soft      — smooth even wash, the original
  //   hard      — a small intense core, a sharp shoulder, then a long steady
  //                plateau; reads as a focused lamp rather than a glow
  //   textured  — the soft curve with concentric rings over it, like light
  //                through ribbed glass; broken up further by lightMottle()
  function lightFalloff(c, cx, cy, rpx, a, pat){
    const g=c.createRadialGradient(cx,cy,0,cx,cy,Math.max(1,rpx));
    const S=(t,v)=>g.addColorStop(t, "rgba(255,255,255,"+Math.max(0,Math.min(1,v)).toFixed(4)+")");
    if(pat==="hard"){
      S(0,a); S(0.15,a); S(0.23,a*0.40); S(0.55,a*0.29); S(0.86,a*0.14); S(1,0);
    } else {
      S(0,a); S(0.42,a*0.78); S(0.72,a*0.36); S(1,0);
    }
    return g;
  }
  // ── PATTERNED LIGHT PROFILES ───────────────────────────────────────
  // `textured` and `energy` can't be expressed as a radial gradient — they need
  // ANGULAR structure — so they are painted into a scratch canvas and applied to
  // the mask with destination-in, exactly where the gradient would have gone.
  const lprofCv = oc();
  // A closed circle whose radius wanders with angle: three harmonics, so the edge
  // reads as flame licks rather than a wavy ellipse. Seeded per light per ring.
  function wobblyCircle(c, cx, cy, R, seed, amp){
    // High harmonics carry the "fire" — with only 3/7/13 the edge undulates like
    // a wobbly balloon. 5/11/19/31 with weight kept on the fast terms gives the
    // licked, spiky boundary. N must out-resolve the fastest term or it aliases.
    const N=192;
    c.beginPath();
    for(let i=0;i<=N;i++){
      const t=i/N*Math.PI*2;
      const w = 1 + amp*(0.40*Math.sin(5*t+seed)
                       + 0.26*Math.sin(11*t+seed*1.7)
                       + 0.20*Math.sin(19*t+seed*2.3)
                       + 0.14*Math.sin(31*t+seed*3.1));
      const r=R*w, x=cx+Math.cos(t)*r, y=cy+Math.sin(t)*r;
      if(i===0) c.moveTo(x,y); else c.lineTo(x,y);
    }
    c.closePath();
  }
  // Patterns that are PAINTED rather than expressed as a gradient. Anything with
  // angular structure has to live here — a radial gradient has no way to say it.
  const PAINTED = { fire:1, swirl:1, caustic:1, spotted:1, energy:1, beam:1 };
  // `textured` was renamed to `fire` in v46; old maps still carry the old value.
  function patOf(L){ const p=(L && L.pattern) || "soft"; return p==="textured" ? "fire" : p; }
  function lightProfile(mw, mh, cx, cy, rpx, a, pat, seed, rot, spread){
    if(lprofCv.width!==mw || lprofCv.height!==mh){ lprofCv.width=mw; lprofCv.height=mh; }
    const c=lprofCv.getContext("2d");
    c.setTransform(1,0,0,1,0,0); c.globalAlpha=1; c.filter="none";
    c.globalCompositeOperation="source-over"; c.clearRect(0,0,mw,mh);
    c.fillStyle="#fff";
    const rnd=seeded(seed*13.7+1, seed*7.3+1);
    rot=rot||0;
    // Stamped patterns rotate by spinning the canvas about the light. The
    // per-pixel ones (caustic, beam) can't — they rotate their own coordinates.
    const spin = rot && pat!=="caustic" && pat!=="beam";
    if(spin){ c.save(); c.translate(cx,cy); c.rotate(rot); c.translate(-cx,-cy); }
    const softGrad=(mul)=>{
      const g=c.createRadialGradient(cx,cy,0,cx,cy,Math.max(1,rpx));
      g.addColorStop(0,    "rgba(255,255,255,"+(a*mul).toFixed(4)+")");
      g.addColorStop(0.42, "rgba(255,255,255,"+(a*mul*0.78).toFixed(4)+")");
      g.addColorStop(0.72, "rgba(255,255,255,"+(a*mul*0.36).toFixed(4)+")");
      g.addColorStop(1,    "rgba(255,255,255,0)");
      return g;
    };
    if(pat==="fire"){
      // Three TERRACES, each strictly dimmer going out — never brighter again.
      // (The first attempt modulated the falloff with a cosine, which alternated
      // light and dark and read as a bullseye. Steps only ever step down.)
      const R=[1.0, 0.62, 0.33], L=[0.26, 0.60, 1.0], AMP=[0.135, 0.125, 0.115];
      // Painted as overlapping DISCS from the outside in, with each alpha solved
      // so the composite lands exactly on the target level. Annuli would leave
      // anti-aliased seams at every shared boundary.
      let acc=0;
      for(let i=0;i<3;i++){
        const target=a*L[i];
        const alpha = acc>=1 ? 0 : (target-acc)/(1-acc);
        if(alpha>0.001){
          c.globalAlpha=Math.min(1,alpha);
          wobblyCircle(c, cx, cy, rpx*R[i], seed*1.3 + i*2.1, AMP[i]);
          c.fill();
        }
        acc=target;
      }
      c.globalAlpha=1;
    } else if(pat==="swirl"){
      // A Starry Night STAR. The first version drew long log-spiral arms and read
      // as a pinwheel; what the painting actually shows is a hot core wrapped in
      // concentric HALOES built from short tangential brush dabs. So: bands of
      // little arcs circling the centre, each jittered in radius, length, width
      // and brightness, drifting slightly in or out so the ring never closes into
      // a clean circle.
      c.fillStyle=softGrad(0.30); c.fillRect(0,0,mw,mh);
      c.globalCompositeOperation="lighter";
      c.lineCap="round"; c.lineJoin="round";
      const BANDS=6;
      const ox=cx+(rnd()-0.5)*rpx*0.10, oy=cy+(rnd()-0.5)*rpx*0.10;
      for(let bd=0; bd<BANDS; bd++){
        const t=(bd+0.5)/BANDS * (0.86+rnd()*0.28);    // 0..1 outward, unevenly spaced
        const rr=rpx*t;
        const level=a*(0.30*Math.pow(1-t,0.9)+0.05);   // dabs fade outward
        const dabs=Math.max(9, Math.round(12+t*34));
        const wid=Math.max(1, rpx*0.15*(1-0.40*t));
        for(let d=0; d<dabs; d++){
          const th0=(d/dabs)*Math.PI*2 + rnd()*0.6 + bd*0.8;
          const span=0.17+rnd()*0.30;                  // radians of arc per dab
          const rj=rr*(1+(rnd()-0.5)*0.30);
          const drift=(rnd()-0.5)*0.13*rpx;            // in/out lean = the swirl
          c.strokeStyle="rgba(255,255,255,"+(level*(0.55+rnd()*0.85)).toFixed(4)+")";
          c.lineWidth=wid*(0.55+rnd()*0.8);
          c.beginPath();
          const N=8;
          for(let i=0;i<=N;i++){
            const u=i/N, th=th0+span*u, r=rj+drift*u;
            const x=ox+Math.cos(th)*r, y=oy+Math.sin(th)*r;
            if(i===0) c.moveTo(x,y); else c.lineTo(x,y);
          }
          c.stroke();
        }
      }
      const sg=c.createRadialGradient(ox,oy,0,ox,oy,Math.max(1,rpx*0.28));
      sg.addColorStop(0,   "rgba(255,255,255,"+a.toFixed(4)+")");
      sg.addColorStop(0.5, "rgba(255,255,255,"+(a*0.72).toFixed(4)+")");
      sg.addColorStop(1,   "rgba(255,255,255,0)");
      c.fillStyle=sg; c.fillRect(0,0,mw,mh);
      c.globalCompositeOperation="source-over";
    } else if(pat==="caustic"){
      // The rippling net of light on a pool floor. Unlike every other pattern this
      // one is PER-PIXEL — a caustic web is an interference field, not something
      // you can stroke or stamp. It is only affordable because the profile is
      // built at the reduced mask resolution (<=192px, ~37k pixels).
      //
      // Three plane waves at different angles are summed; the bright filaments are
      // where that sum crosses ZERO, so `1-|s|` gives ridges and cubing thins them
      // into the characteristic thin, wandering lines with dark cells between.
      const img=c.createImageData(mw,mh), d=img.data;
      const f=7.0/Math.max(4,rpx);                    // wave scale, in radii
      const p1=rnd()*6.283, p2=rnd()*6.283, p3=rnd()*6.283;
      const inv=1/Math.max(1,rpx), r2px=rpx*rpx;
      const rc=Math.cos(-rot), rs=Math.sin(-rot);
      // Radial falloff via a 65-entry LUT rather than a pow() per pixel.
      const FALL=new Float32Array(65);
      for(let i=0;i<65;i++) FALL[i]=Math.pow(1-i/64, 0.85);
      for(let y=0;y<mh;y++){
        const dy=y-cy, hh=r2px-dy*dy;
        if(hh<=0) continue;                           // whole row outside the disc
        const half=Math.sqrt(hh);
        const xa=Math.max(0, Math.ceil(cx-half)), xb=Math.min(mw-1, Math.floor(cx+half));
        const vy=dy*f;
        // w1's inner sin depends only on y — hoist it out of the x loop.
        const k1=Math.sin(vy*1.30 + p1)*1.70 + p2, k2=vy*0.92 + p1;
        const dy2=dy*dy;
        for(let x=xa;x<=xb;x++){
          const dx=x-cx;
          const rr=Math.sqrt(dx*dx+dy2)*inv;
          if(rr>=1) continue;
          // rotate into the field's frame (k1/k2 were hoisted for rot=0 rows,
          // so with a rotation we pay the full two-axis transform per pixel)
          const fx=rot ? (dx*rc - dy*rs) : dx, fy=rot ? (dx*rs + dy*rc) : dy;
          const u=fx*f;
          const s = rot
            ? Math.sin(u + Math.sin(fy*f*1.30 + p1)*1.70 + p2)
              + Math.sin(fy*f*0.92 + p1 + Math.sin(u*1.15 + p3)*1.50)
            : Math.sin(u + k1) + Math.sin(k2 + Math.sin(u*1.15 + p3)*1.50);
          const a1=Math.abs(Math.sin(s*2.15)), a2=Math.abs(Math.sin(s*4.6 + 1.3));
          const q1=a1*a1, q2=a2*a2;                   // pow() by multiplication
          const t=0.76*(q1*q1*a1) + 0.24*(q2*q2*q2*q2);
          const al=a*(0.28 + 0.72*t)*FALL[(rr*64)|0];
          const o=((y*mw+x)<<2);
          d[o]=255; d[o+1]=255; d[o+2]=255;
          d[o+3]=al<=0 ? 0 : (al>=1 ? 255 : (al*255)|0);
        }
      }
      c.putImageData(img,0,0);                        // ignores composite ops — fine, it is first
    } else if(pat==="beam"){
      // A directional cone. Per-pixel like the caustic, but the only trig in the
      // loop is a divide: cos(angle from the axis) is just the dot product of the
      // pixel direction with the beam axis, so there is no atan2 anywhere.
      const img=c.createImageData(mw,mh), d=img.data;
      const half=Math.max(0.05, Math.min(Math.PI, (spread==null?1.05:spread)/2));
      const ux=Math.cos(rot), uy=Math.sin(rot);
      const cosIn=Math.cos(Math.max(0.02, half*0.72)), cosOut=Math.cos(half);
      const span=Math.max(1e-4, cosIn-cosOut);
      const inv=1/Math.max(1,rpx), r2px=rpx*rpx;
      const FALL=new Float32Array(65);
      for(let i=0;i<65;i++){ const t=i/64; FALL[i]=(1-t)*(0.35+0.65*(1-t)); }
      for(let y=0;y<mh;y++){
        const dy=y-cy, hh=r2px-dy*dy;
        if(hh<=0) continue;
        const w=Math.sqrt(hh);
        const xa=Math.max(0,Math.ceil(cx-w)), xb=Math.min(mw-1,Math.floor(cx+w));
        for(let x=xa;x<=xb;x++){
          const dx=x-cx, rl=Math.sqrt(dx*dx+dy*dy);
          const rr=rl*inv; if(rr>=1) continue;
          let ang;
          if(rl<1e-3) ang=1;
          else {
            const cs=(dx*ux+dy*uy)/rl;
            ang = cs>=cosIn ? 1 : (cs<=cosOut ? 0 : (cs-cosOut)/span);
            ang = ang*ang*(3-2*ang);                  // smoothstep the cone edge
          }
          // a little bulb glow at the source, so the emitter itself reads as lit
          const bulb=rr<0.16 ? (1-rr/0.16)*0.55 : 0;
          const al=a*FALL[(rr*64)|0]*Math.min(1, ang+bulb);
          const o=((y*mw+x)<<2);
          d[o]=255; d[o+1]=255; d[o+2]=255;
          d[o+3]=al<=0 ? 0 : (al>=1 ? 255 : (al*255)|0);
        }
      }
      c.putImageData(img,0,0);
    } else if(pat==="spotted"){
      // Dappled light — sun through a canopy. A soft pool with irregular GAPS
      // punched out of it, not bright blobs added on: the gaps are what make it
      // read as leaf shadow rather than confetti.
      c.fillStyle=softGrad(1); c.fillRect(0,0,mw,mh);
      c.globalCompositeOperation="destination-out";
      const N=170;
      for(let i=0;i<N;i++){
        // rejection-free polar placement, sqrt for even area density
        const th=rnd()*Math.PI*2, rr=Math.sqrt(rnd())*rpx*1.02;
        const bx=cx+Math.cos(th)*rr, by=cy+Math.sin(th)*rr;
        const br=rpx*(0.035+rnd()*0.105);
        const g=c.createRadialGradient(bx,by,0,bx,by,Math.max(1,br));
        const st=(0.25+rnd()*0.45).toFixed(3);
        g.addColorStop(0,   "rgba(0,0,0,"+st+")");
        g.addColorStop(0.6, "rgba(0,0,0,"+(st*0.7).toFixed(3)+")");
        g.addColorStop(1,   "rgba(0,0,0,0)");
        c.fillStyle=g;
        // squash each blob a little so they aren't all perfect circles
        c.save(); c.translate(bx,by); c.rotate(rnd()*Math.PI);
        c.scale(1, 0.6+rnd()*0.7); c.translate(-bx,-by);
        c.fillRect(bx-br*2, by-br*2, br*4, br*4);
        c.restore();
      }
      c.globalCompositeOperation="source-over";
    } else if(pat==="energy"){
      // A dim halo, jagged filaments crackling out of the middle, and a hot core.
      c.fillStyle=softGrad(0.44); c.fillRect(0,0,mw,mh);
      c.globalCompositeOperation="lighter";
      c.lineCap="round"; c.lineJoin="round";
      const N=9;
      for(let k=0;k<N;k++){
        let ang=(k/N)*Math.PI*2 + rnd()*0.6;
        const len=rpx*(0.5+rnd()*0.5), steps=5;
        let px=cx, py=cy;
        for(let s=1;s<=steps;s++){
          ang += (rnd()-0.5)*0.6;
          const r=len*s/steps, x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r;
          const f=1-(s-1)/steps;                       // taper outward
          c.strokeStyle="rgba(255,255,255,"+(a*0.45*f).toFixed(4)+")";
          c.lineWidth=Math.max(0.8, rpx*0.055*f);
          c.beginPath(); c.moveTo(px,py); c.lineTo(x,y); c.stroke();
          px=x; py=y;
        }
      }
      const cg=c.createRadialGradient(cx,cy,0,cx,cy,Math.max(1,rpx*0.2));
      cg.addColorStop(0,"rgba(255,255,255,"+a.toFixed(4)+")");
      cg.addColorStop(1,"rgba(255,255,255,0)");
      c.fillStyle=cg; c.fillRect(0,0,mw,mh);

    }
    if(spin) c.restore();
