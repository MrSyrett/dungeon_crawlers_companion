<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Map Maker</title>
<!-- Shared generator + renderer. When served by the app this is the single source
     of truth (the GM Screen + Session Prep use it too). If it fails to load (e.g.
     the file opened standalone / offline), the tool falls back to its own inlined
     copy below, so it still works on its own. -->
<script src="/dungeon-engine.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0e11; --panel:#17171b; --panel2:#1e1e24; --line:#33333c;
    --ink:#e8e2d4; --muted:#9a948a; --gold:#c9a94a; --gold-dim:#8f7a35;
    --active:#2a2a33; --danger:#b5533f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Montserrat",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  .app{display:flex;height:100vh;width:100vw}

  /* ── Sidebar (hidden by the server's preview shim) ────────────────── */
  .sidebar{width:250px;flex:0 0 250px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow-y:auto;z-index:5}
  /* Slim, low-contrast scrollbars. scrollbar-gutter:stable reserves the track so
     a grid's last column can't get clipped when the bar appears. */
  .sidebar, .objgrid{scrollbar-width:thin; scrollbar-color:#3d3d47 transparent; scrollbar-gutter:stable}
  .sidebar::-webkit-scrollbar, .objgrid::-webkit-scrollbar{width:8px;height:8px}
  .sidebar::-webkit-scrollbar-track, .objgrid::-webkit-scrollbar-track{background:transparent}
  .sidebar::-webkit-scrollbar-thumb, .objgrid::-webkit-scrollbar-thumb{
    background:#3d3d47;border-radius:8px;border:2px solid transparent;background-clip:content-box}
  .sidebar:hover::-webkit-scrollbar-thumb, .objgrid:hover::-webkit-scrollbar-thumb{background:#55555f;
    background-clip:content-box}
  .sidebar::-webkit-scrollbar-thumb:active, .objgrid::-webkit-scrollbar-thumb:active{background:var(--gold-dim);
    background-clip:content-box}
  .hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:12px 16px;border-bottom:1px solid var(--line)}
  .sidebar h1{font-family:"Cinzel",Georgia,serif;font-size:14px;letter-spacing:.04em;
    color:var(--gold);margin:0;padding:0;border:none;line-height:1.2}
  /* dark-mode toggle switch (header, right-aligned) */
  .switch{position:relative;display:inline-block;width:38px;height:20px;flex:0 0 auto}
  .switch input{position:absolute;opacity:0;width:0;height:0}
  .switch .slider{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--line);
    border-radius:20px;cursor:pointer;transition:.15s}
  .switch .slider::before{content:"";position:absolute;width:14px;height:14px;left:2px;top:2px;
    background:var(--muted);border-radius:50%;transition:.15s}
  .switch input:checked + .slider{background:var(--gold-dim);border-color:var(--gold)}
  .switch input:checked + .slider::before{transform:translateX(18px);background:#1a1508}
  .chk-row{display:flex;gap:16px;margin-top:10px}
  .chk-row .chk{margin-top:0}
  .grp{padding:12px 14px;border-bottom:1px solid var(--line)}
  .grp.flush{border-bottom:none}
  .grp-title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
  .grp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .grp-head .grp-title{margin:0}
  /* Rooms ⟷ Shapes segmented toggle */
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:0 0 auto}
  .seg button{background:var(--panel2);color:var(--muted);border:0;padding:3px 9px;cursor:pointer;
    font:600 10px/1.5 "Montserrat",system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase}
  .seg button + button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--gold);color:#1a1508}
  .tools{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
  .tool{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px;
    background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--ink);
    cursor:pointer;font-size:10.5px;letter-spacing:.03em;user-select:none;transition:.12s}
  .tool:hover{border-color:var(--gold-dim)}
  .tool.active{background:var(--active);border-color:var(--gold);color:var(--gold)}
  .tool svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}
  .row{display:flex;gap:6px}
  .btn{flex:1;padding:8px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;
    color:var(--ink);cursor:pointer;font-size:11px;letter-spacing:.03em;transition:.12s;text-align:center}
  .btn:hover{border-color:var(--gold-dim)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.gold{background:linear-gradient(180deg,#c9a94a,#a9882f);border-color:var(--gold);
    color:#1a1508;font-weight:600}
  .btn.gold:hover{filter:brightness(1.07)}
  .btn.wide{width:100%}
  label.fld{display:block;font-size:11px;color:var(--muted);margin:10px 0 4px}
  label.fld b{color:var(--ink);font-weight:600;float:right}
  input[type=range]{width:100%;accent-color:var(--gold);margin:0}
  input[type=number],input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);
    border-radius:6px;color:var(--ink);padding:7px 8px;font-size:12px;font-family:inherit}
  input[type=number]:focus,input[type=text]:focus{outline:none;border-color:var(--gold)}
  .chk{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);cursor:pointer;margin-top:10px}
  .chk input{accent-color:var(--gold);width:15px;height:15px}
  .hint{font-size:10.5px;color:var(--muted);line-height:1.5;margin:8px 0 0}
  .credit{font-size:10px;color:var(--muted);line-height:1.7;margin:12px 0 0;text-align:center}
  .credit a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}
  .credit a:hover{color:var(--gold)}
  .sel{width:100%;padding:7px 8px;background:var(--panel2);border:1px solid var(--line);
    border-radius:7px;color:var(--ink);font:inherit;font-size:11.5px;cursor:pointer}
  .sel:focus{outline:none;border-color:var(--gold-dim)}
  .packs{margin-top:8px;display:flex;flex-direction:column;gap:4px}
  .packs .pk{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);
    background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
  .packs .pk span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .packs .pk button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;line-height:1;padding:0 2px}
  .packs .pk button:hover{color:#e88}
  /* minmax(0,1fr), not 1fr: a plain 1fr track has an AUTO minimum, so fixed-size
     thumbnails inside push the columns wider than the container and the last one
     gets clipped. With a 0 minimum the tracks divide the space and the thumbs are
     sized to fit them (see buildObjGrid). */
  .objgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;max-height:214px;overflow:auto;
    margin-top:6px;padding:4px;background:var(--panel2);border:1px solid var(--line);border-radius:7px}
  .objgrid button{aspect-ratio:1;background:#0f0f13;border:1px solid transparent;border-radius:5px;
    cursor:pointer;padding:2px;display:flex;align-items:center;justify-content:center}
  .objgrid button:hover{border-color:var(--gold-dim)}
  .objgrid button.on{border-color:var(--gold);background:var(--active)}
  .objgrid img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
  .objgrid .th{display:block;background-repeat:no-repeat;pointer-events:none}
  .objgrid .none{grid-column:1/-1;font-size:10.5px;color:var(--muted);text-align:center;padding:16px 4px}
  /* swatch pickers */
  .pick{display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;background:var(--panel2);
    border:1px solid var(--line);border-radius:7px;color:var(--ink);font:inherit;font-size:11.5px;
    cursor:pointer;text-align:left}
  .pick:hover{border-color:var(--gold-dim)}
  .pick .pl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pick .ca{color:var(--muted);font-size:10px}
  .sw{width:34px;height:22px;flex:0 0 auto;border-radius:4px;border:1px solid var(--line);
    background-repeat:no-repeat;background-position:center;background-color:#0f0f13}
  .pickpop{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.55);overflow:auto;padding:4px}
  .pickpop .gl{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    padding:7px 8px 3px}
  .pickpop .opt{display:flex;align-items:center;gap:8px;width:100%;padding:5px 7px;background:none;
    border:0;border-radius:6px;color:var(--ink);font:inherit;font-size:11.5px;cursor:pointer;text-align:left}
  .pickpop .opt:hover{background:var(--panel2)}
  .pickpop .opt.on{background:var(--active);color:var(--gold)}
  .pickpop .opt span:last-child{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .spacer{flex:1}
  .save-state{font-size:10px;color:var(--muted);padding:8px 14px;letter-spacing:.04em}

  /* ── Canvas area ──────────────────────────────────────────────────── */
  .preview-area{flex:1;position:relative;overflow:hidden;background:#d9d0bd}
  #map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
  .float{position:absolute;z-index:6;background:rgba(16,16,19,.82);border:1px solid var(--line);
    border-radius:8px;backdrop-filter:blur(4px);color:var(--ink)}
  .zoombar{bottom:14px;right:14px;display:flex;align-items:center;gap:2px;padding:4px}
  .zoombar button{width:30px;height:30px;background:none;border:none;color:var(--ink);font-size:17px;
    cursor:pointer;border-radius:6px}
  .zoombar button:hover{background:var(--active)}
  .zoombar span{font-size:11px;color:var(--muted);min-width:42px;text-align:center}
  .tip{top:12px;left:50%;transform:translateX(-50%);padding:7px 14px;font-size:11.5px;
    color:var(--muted);letter-spacing:.02em;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
  .tip.show{opacity:1}
  /* When embedded read-only (GM Screen / session prep preview) the shim hides
     the sidebar; make the canvas fill and disable editing affordances. */
  body.embed #map{cursor:default}

  /* ── Phone layout ──────────────────────────────────────────────────
     Stack the canvas on top (big enough to draw on) with the controls in a
     scrollable panel below. Draw with one finger; pinch to zoom, two fingers
     (or one finger on empty space with Select) to pan. Not applied when the
     tool is embedded read-only (the shim hides the sidebar). */
  @media (max-width: 640px){
    /* Use the DYNAMIC viewport (dvh) so the layout tracks the phone browser's
       collapsing address/nav bars — 100vh is the *large* viewport, which pushes
       the bottom of the sidebar (the Export/PNG buttons) under the browser
       chrome. The sidebar is the scroll container; the safe-area + extra
       bottom padding guarantees the last buttons clear the chrome. */
    body:not(.embed) .app{ flex-direction: column; height:100dvh; }
    body:not(.embed) .preview-area{ order:1; flex:0 0 auto; height:52dvh; }
    body:not(.embed) .sidebar{ order:2; width:auto; flex:1 1 auto; min-height:0;
      border-right:none; border-top:1px solid var(--line);
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="hdr">
      <h1>⚔ Map Maker</h1>
      <label class="switch" title="Dark mode — darkens the background only"><input type="checkbox" id="darkToggle"><span class="slider"></span></label>
    </div>

    <div class="grp">
      <div class="grp-head">
        <p class="grp-title">Tools</p>
        <div class="seg" id="modeSeg" title="Rooms: Square/Circle/Polygon draw rooms, Wall draws interior walls. Shapes: the same tools draw thin interior shapes (pillars, dais, tables, pits). Doors and stairs are unaffected either way.">
          <button type="button" data-mode="rooms" class="on">Rooms</button>
          <button type="button" data-mode="shapes">Shapes</button>
        </div>
      </div>
      <div class="tools" id="toolbar">
        <div class="tool active" data-tool="select" title="Select / move (V)">
          <svg viewBox="0 0 24 24"><path d="M5 3l6 16 2-6 6-2z"/></svg>Select</div>
        <div class="tool" data-tool="erase" title="Erase (E)">
          <svg viewBox="0 0 24 24"><path d="M4 15l7-7 6 6-4 4H8z"/><path d="M9 20h11"/></svg>Erase</div>
        <div class="tool" data-tool="rect" title="Rectangle (R) — room, or thin interior shape in Shapes mode">
          <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1"/></svg>Square</div>
        <div class="tool" data-tool="circle" title="Circle (C) — round room, or a perfect thin circle in Shapes mode">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>Circle</div>
        <div class="tool" data-tool="polygon" title="Polygon (P) — room or interior shape · click points, Enter/dbl-click to close">
          <svg viewBox="0 0 24 24"><path d="M12 3l8 6-3 10H7L4 9z"/></svg>Polygon</div>
        <div class="tool" data-tool="wall" title="Wall (W) — 3 clicks: start, end, curve. Thin line in Shapes mode.">
          <svg viewBox="0 0 24 24"><path d="M4 19C9 7 15 7 20 5"/><circle cx="4" cy="19" r="1.6" fill="currentColor"/><circle cx="20" cy="5" r="1.6" fill="currentColor"/></svg>Wall</div>
        <div class="tool" data-tool="door" title="Door (D)">
          <svg viewBox="0 0 24 24"><path d="M6 4h9v16H6z"/><path d="M15 9l4 3-4 3"/></svg>Door</div>
        <div class="tool" data-tool="stair" title="Stairs (S)">
          <svg viewBox="0 0 24 24"><path d="M4 20h4v-4h4v-4h4V8h4"/></svg>Stairs</div>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn" id="undo" title="Undo (Ctrl+Z)">↶ Undo</button>
        <button class="btn" id="redo" title="Redo (Ctrl+Y)">↷ Redo</button>
      </div>
      <div class="row" style="margin-top:6px">
        <button class="btn" id="toFront" title="Bring the selected room / object in front of the others (F)" disabled>⬆ Front</button>
        <button class="btn" id="toBack" title="Send the selected room / object behind the others (B)" disabled>⬇ Back</button>
      </div>
    </div>

    <div class="grp">
      <div class="chk-row">
        <label class="chk" title="Toggle with Shift+S"><input type="checkbox" id="snapToggle" checked> Snap to grid</label>
        <label class="chk"><input type="checkbox" id="gridToggle" checked> Show grid</label>
      </div>
      <label class="fld">Grid opacity <b id="gridOpV">100%</b></label>
      <input type="range" id="gridOp" min="0" max="100" value="100">
      <div class="row" style="margin-top:10px">
        <button class="btn" id="clear">Clear</button>
        <button class="btn" id="fit">Fit view</button>
      </div>
    </div>

    <div class="grp">
      <div class="grp-head">
        <p class="grp-title">Advanced</p>
        <label class="switch" title="Textured floors and background instead of the classic ink-on-parchment look">
          <input type="checkbox" id="advToggle"><span class="slider"></span></label>
      </div>
      <div id="advBody" style="display:none">
        <p class="hint" id="styleScope" style="margin:0 0 2px"></p>
        <label class="fld">Walls</label>
        <button class="pick" id="wallSel" type="button"><span class="sw"></span><span class="pl">—</span><span class="ca">&#9662;</span></button>
        <label class="fld">Floor</label>
        <button class="pick" id="floorSel" type="button"><span class="sw"></span><span class="pl">—</span><span class="ca">&#9662;</span></button>
        <label class="fld">Background</label>
        <button class="pick" id="bgSel" type="button"><span class="sw"></span><span class="pl">—</span><span class="ca">&#9662;</span></button>
        <div class="row" style="margin-top:10px">
          <button class="btn" id="packAdd">+ Asset pack</button>
        </div>
        <input type="file" id="packFile" accept=".dungeondraft_pack" style="display:none">
        <div id="packList" class="packs"></div>
        <label class="fld" for="objFilter">Objects</label>
        <input class="sel" id="objFilter" type="text" placeholder="Filter objects…" autocomplete="off">
        <div id="objGrid" class="objgrid"></div>
        
        
      </div>
    </div>

    <div class="grp">
      <p class="grp-title">Random Dungeon</p>
      <label class="fld">Rooms <b id="roomsV">8</b></label>
      <input type="range" id="rooms" min="2" max="24" value="8">
      <label class="fld">Room size <b id="sizeV">Medium</b></label>
      <input type="range" id="rsize" min="1" max="5" value="3">
      <label class="fld">Layout <b id="spreadV">Balanced</b></label>
      <input type="range" id="spread" min="1" max="5" value="3">
      <label class="fld">Entrances <b id="entrancesV">2</b></label>
      <input type="range" id="entrances" min="0" max="6" value="2">
      <label class="chk"><input type="checkbox" id="corridors" checked> Connect with corridors</label>
      <label class="chk"><input type="checkbox" id="roundish"> Allow round rooms</label>
      <button class="btn gold wide" id="generate" style="margin-top:12px">🎲 Generate Dungeon</button>
      <p class="hint">Replaces the current map. Everything stays fully editable afterward.</p>
    </div>

    <div class="grp flush">
      <div class="row">
        <button class="btn" id="export" title="Download an editable map file (.json) you can re-open later">⬇ Export</button>
        <button class="btn" id="import" title="Open a previously exported map file">⬆ Import</button>
      </div>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none">
      <div class="row" style="margin-top:6px">
        <button class="btn" id="png">⬇ PNG</button>
        <button class="btn" id="pngT" title="Transparent background — floors only">⬇ PNG (transp.)</button>
      </div>
      <p class="credit">Assets by <a href="https://2minutetabletop.com/" target="_blank" rel="noopener noreferrer">2-Minute Tabletop</a><br>
        <a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener noreferrer">CC BY-NC 4.0</a></p>
    </div>

    <div class="spacer"></div>
  </aside>
  <!-- One shared picker popup, position:fixed so the scrolling sidebar can't clip it. -->
  <div id="pickPop" class="pickpop" hidden></div>

  <div class="preview-area">
    <canvas id="map"></canvas>
    <div class="float tip" id="tip"></div>
    <div class="float zoombar">
      <button id="zoomOut">−</button>
      <span id="zoomPct">100%</span>
      <button id="zoomIn">+</button>
    </div>
  </div>
</div>

<script>
"use strict";
(function(){
/* ════════════════════════════════════════════════════════════════════
   DUNGEON MAP MAKER — a compact, clean hand-drawn-ink dungeon drawer.
   Self-contained. Nothing is saved to a server: work is kept in the
   browser (localStorage key "dcc_map") so a refresh doesn't lose it, and
   a map is persisted / shared with Export & Import (.json) or the two PNG
   exports. Light + dark (blue-grey) themes via the Dark mode toggle.
   ════════════════════════════════════════════════════════════════════ */

  // ── Palette / theme (light parchment vs. dark blue-grey) ───────────
  // Grid + dots are deliberately darker than v1 so they read clearly.
  const THEMES = {
    light: {
      bg:"#d9d0bd",       // canvas area behind the map (CSS)
      rockHi:"#efe8d7",   // exterior background fill
      floor:"#f4efe3",    // room floor
      grid:"#1b2028",     // near-black blue-grey grid inside rooms
                          // (the exterior dot grid below stays mid-grey — it is
                          //  background texture in classic mode, not the grid)
      dot:"#8a8a8a",      // medium-grey dot grid
      hatch:"#33302a",
      ink:"#14120d",      // walls, doors, stairs (near-black ink)
      doorFill:"#fbf8f0", // door leaf interior (classic)
      doorWood:"#8b5e3c", // …and in Advanced Mode, so it reads as a wooden door
      shadow:"rgba(20,17,12,.18)",
      sel:"#c9a94a",
    },
  };
  // Dark mode changes ONLY the exterior background. Medium-grey grid + dots read
  // fine on both the light floors and the dark exterior, so they're shared;
  // walls, interior floors, doors, and stairs are identical to light mode.
  THEMES.dark = Object.assign({}, THEMES.light, {
    bg:"#171a21",         // dark bluish grey backdrop
    rockHi:"#232833",     // dark bluish grey exterior
  });
  const C = Object.assign({}, THEMES.light);   // active palette, mutated by setTheme
  let theme = "light";
  function setThemeColors(t){
    theme = (t === "dark") ? "dark" : "light";
    Object.assign(C, THEMES[theme]);
    const pa = document.querySelector(".preview-area");
    if(pa) pa.style.background = THEMES[theme].bg;
  }
  function setTheme(t){ setThemeColors(t); map.theme = theme; scheduleSave(); render(); }
  const CELL = 32;                 // world px per grid cell at scale 1
  const SIZE_MAP = {1:[3,4],2:[4,6],3:[5,8],4:[7,11],5:[9,15]};
  const SIZE_LBL = {1:"Tiny",2:"Small",3:"Medium",4:"Large",5:"Huge"};
  const SPREAD_LBL = {1:"Tight",2:"Cozy",3:"Balanced",4:"Sprawling",5:"Vast"};

  // ── State ─────────────────────────────────────────────────────────
  let map = blankMap();
  let tool = "select";
  let drawMode = "rooms";                    // "rooms" | "shapes" — Square/Circle/Polygon/Wall target
  let snapOn = true;                        // snap-to-grid toggle
  let cam = { x: 0, y: 0, scale: 1 };     // world→screen: s = (w - cam)*scale ... (see helpers)
  let history = [], future = [];
  let embed = false;                       // read-only preview

  const cv = document.getElementById("map");
  const ctx = cv.getContext("2d");
  let W = 0, H = 0, DPR = 1;

  function blankMap(){
    return { version:1, name:"", grid:true, gridOpacity:1, style:DEFAULT_STYLE(),
             shapes:[], walls:[], doors:[], stairs:[], objects:[], seedId:1 };
  }
  function uid(){ return map.seedId++; }

  // ── Coordinate helpers (world cells ↔ screen px) ──────────────────
  function wpx(){ return CELL * cam.scale; }                 // screen px per cell

  // A repeating world-aligned pattern for a texture tile that is `cells` grid
  // cells wide: scaled so one tile spans exactly that many cells at the current
  // zoom, and translated so the tile grid lines up with world (0,0) — the same
  // origin the square grid uses, so texture and grid never drift apart.
  // `tex` is set by applyStyle(); null ⇒ classic flat-colour render.
  let tex = null;
  function patFor(c, t){
    if(!t || !t.img) return null;
    const img=t.img; if(!img.complete || !img.naturalWidth) return null;
    let p; try { p=c.createPattern(img, "repeat"); } catch(e){ return null; }
    if(!p || !p.setTransform || typeof DOMMatrix==="undefined") return null;
    const s=(wpx()*(t.cells||4))/img.naturalWidth, o=toScreen(0,0);
    try { p.setTransform(new DOMMatrix([s,0,0,s,o[0],o[1]])); } catch(e){ return null; }
    return p;
  }
  function toScreen(wx, wy){ return [ (wx - cam.x)*wpx() + W/2, (wy - cam.y)*wpx() + H/2 ]; }
  function toWorld(sx, sy){ return [ (sx - W/2)/wpx() + cam.x, (sy - H/2)/wpx() + cam.y ]; }
  function snap(v){ return snapOn? Math.round(v): v; }
  function snapPt(wx, wy){ return [ snap(wx), snap(wy) ]; }

  // ════════════════════════════════════════════════════════════════
  // RENDER
  // ════════════════════════════════════════════════════════════════
  // offscreen scratch buffers (CSS-px sized) for the floor fill & grid clip
  function oc(){ return document.createElement("canvas"); }
  const buf = { mask:oc(), tint:oc(), grid:oc(), wall:oc(), erode:oc(), deco:oc(), decoClip:oc() };
  function sizeBufs(){ for(const k in buf){ if(buf[k].width!==W||buf[k].height!==H){ buf[k].width=W; buf[k].height=H; } } }

  // draw a single floor shape's path into a 2d context (screen space)
  function shapePath(c, sh){
    const p = wpx();
    if(sh.type==="rect"){
      const [x,y]=toScreen(sh.x, sh.y);
      c.rect(x, y, sh.w*p, sh.h*p);
    } else if(sh.type==="circle"){
      const [x,y]=toScreen(sh.cx, sh.cy);
      c.moveTo(x+sh.r*p, y);
      c.arc(x, y, sh.r*p, 0, Math.PI*2);
    } else if(sh.type==="polygon" && sh.pts.length>1){
      const [x0,y0]=toScreen(sh.pts[0][0], sh.pts[0][1]);
      c.moveTo(x0,y0);
      for(let i=1;i<sh.pts.length;i++){ const [x,y]=toScreen(sh.pts[i][0], sh.pts[i][1]); c.lineTo(x,y); }
      c.closePath();
    }
  }

  // stable pseudo-random from a world position — keeps wobble & hatch from
  // shimmering as the camera moves.
  function hash2(x,y){ const h=Math.sin(x*127.1 + y*311.7)*43758.5453; return h-Math.floor(h); }
  function seeded(x,y){ let s=(Math.floor(x*8191)^Math.floor(y*131071))>>>0; s=(s^0x9e3779b9)>>>0;
    return function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
  function pointInAny(wx,wy){ const S=map.shapes; for(let i=0;i<S.length;i++) if(pointInShape(wx,wy,S[i])) return true; return false; }

  // ── Union boundary as VECTOR contours (marching squares over a world grid).
  // Camera-independent, so it is cached and only rebuilt when geometry changes.
  let contours=[], hatchStrokes=[], geomDirty=true;
  function markGeom(){ geomDirty=true; }
  function ensureGeom(){ if(geomDirty){ geomDirty=false; buildGeometry(); } }

  function buildGeometry(){
    // Crosshatching was removed per request, and walls now render per-shape
    // (drawWalls) rather than from a union contour — so no geometry to build.
    contours=[]; hatchStrokes=[];
    return;
    /* eslint-disable no-unreachable */
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; const S=map.shapes;
    for(const s of S){ const b=bounds(s,"shape"); if(b){ x0=Math.min(x0,b.x); y0=Math.min(y0,b.y); x1=Math.max(x1,b.x+b.w); y1=Math.max(y1,b.y+b.h); } }
    const res=0.5;                                          // trace on the half-cell grid
    x0=Math.floor(x0/res)*res - res; y0=Math.floor(y0/res)*res - res;
    x1=Math.ceil(x1/res)*res + res;  y1=Math.ceil(y1/res)*res + res;
    const gw=Math.round((x1-x0)/res), gh=Math.round((y1-y0)/res);
    // Cell occupancy by centre test. Rooms are grid-aligned, so their edges fall
    // exactly on grid lines ⇒ the traced walls stay ON the grid and never drift.
    const occ=new Uint8Array(gw*gh);
    for(let j=0;j<gh;j++){ const cy=y0+(j+0.5)*res; for(let i=0;i<gw;i++){ occ[j*gw+i]=pointInAny(x0+(i+0.5)*res, cy)?1:0; } }
    const O=(i,j)=> (i<0||j<0||i>=gw||j>=gh)?0:occ[j*gw+i];
    const P=(i,j)=>[x0+i*res, y0+j*res];
    // Boundary = the cell edges that sit between an occupied and an empty cell —
    // axis-aligned unit segments on grid lines.
    const segs=[];
    for(let j=0;j<gh;j++) for(let i=0;i<gw;i++){ if(!O(i,j)) continue;
      if(!O(i,j-1)) segs.push([P(i,j),   P(i+1,j)]);        // top
      if(!O(i,j+1)) segs.push([P(i,j+1), P(i+1,j+1)]);      // bottom
      if(!O(i-1,j)) segs.push([P(i,j),   P(i,j+1)]);        // left
      if(!O(i+1,j)) segs.push([P(i+1,j), P(i+1,j+1)]);      // right
    }
    const loops=stitch(segs);
    // Merge collinear runs (drop mid-edge points, keep corners exactly on-grid;
    // also smooths circle/polygon stairsteps into chords).
    for(let lp of loops){ lp=rdp(lp, res*0.9); if(lp.length>=4) contours.push(lp); }
    hatchStrokes=buildHatchStrokes(contours);
  }

  function stitch(segs){
    const key=p=>Math.round(p[0]*1000)+"|"+Math.round(p[1]*1000);
    const adj=new Map(), pos=new Map();
    for(const [a,b] of segs){ const ka=key(a),kb=key(b); if(ka===kb) continue;
      pos.set(ka,a); pos.set(kb,b);
      (adj.get(ka)||adj.set(ka,[]).get(ka)).push(kb);
      (adj.get(kb)||adj.set(kb,[]).get(kb)).push(ka); }
    const usedEdge=new Set(), loops=[];
    const eid=(a,b)=> a<b? a+">"+b : b+">"+a;
    for(const start of adj.keys()){
      let has=false; for(const n of adj.get(start)) if(!usedEdge.has(eid(start,n))){ has=true; break; }
      if(!has) continue;
      let cur=start, prev=null; const loop=[]; let guard=0;
      while(cur && guard++<200000){
        loop.push(pos.get(cur));
        const nbrs=adj.get(cur)||[]; let nxt=null;
        for(const n of nbrs){ if(!usedEdge.has(eid(cur,n)) && n!==prev){ nxt=n; break; } }
        if(!nxt){ for(const n of nbrs){ if(!usedEdge.has(eid(cur,n))){ nxt=n; break; } } }
        if(!nxt) break;
        usedEdge.add(eid(cur,nxt)); prev=cur; cur=nxt;
        if(cur===start) break;
      }
      if(loop.length>=3) loops.push(loop);
    }
    return loops;
  }

  function perpDist(p,a,b){ const dx=b[0]-a[0],dy=b[1]-a[1]; const l=Math.hypot(dx,dy)||1;
    return Math.abs((p[0]-a[0])*dy-(p[1]-a[1])*dx)/l; }
  function rdp(pts,eps){
    if(pts.length<4) return pts;
    const keep=new Array(pts.length).fill(false); keep[0]=keep[pts.length-1]=true;
    const stack=[[0,pts.length-1]];
    while(stack.length){ const [s,e]=stack.pop(); let dmax=0,idx=-1;
      for(let i=s+1;i<e;i++){ const d=perpDist(pts[i],pts[s],pts[e]); if(d>dmax){ dmax=d; idx=i; } }
      if(dmax>eps && idx>0){ keep[idx]=true; stack.push([s,idx],[idx,e]); } }
    const out=[]; for(let i=0;i<pts.length;i++) if(keep[i]) out.push(pts[i]);
    const f=out[0], l=out[out.length-1];
    if(f && (f[0]!==l[0]||f[1]!==l[1])) out.push([f[0],f[1]]);
    return out;
  }

  // True crosshatching. A dense base layer of bundles roots on the wall and
  // leans outward. Each later generation spawns from points ALONG existing lines
  // (not their tips) and runs PERPENDICULAR to that line — so successive families
  // cross at right angles, weaving a proper crosshatch. Everything stays exterior.
  function buildHatchStrokes(loops){
    const out=[];        // [x1,y1,x2,y2]
    const strokes=[];    // {a:[x,y], b:[x,y]}
    const skew=0.5;      // outward lean of the base combs (radians off the normal)
    const ca=Math.cos(skew), sa=Math.sin(skew);
    const bundleGap=0.6, lineGap=0.14;
    // base layer — rooted on the wall
    for(const loop of loops){
      let carry=0.25;
      for(let i=0;i<loop.length-1;i++){
        const a=loop[i], b=loop[i+1];
        const dx=b[0]-a[0], dy=b[1]-a[1]; const segLen=Math.hypot(dx,dy); if(segLen<1e-4) continue;
        const tx=dx/segLen, ty=dy/segLen; let nx=-ty, ny=tx;
        const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
        if(pointInAny(mx+nx*0.15, my+ny*0.15)){ nx=-nx; ny=-ny; }   // outward
        const hx=nx*ca - ny*sa, hy=nx*sa + ny*ca;
        let d=carry;
        while(d<segLen){
          const bx=a[0]+tx*d, by=a[1]+ty*d;
          const r=seeded(bx*7.0, by*7.0);
          const N=3+Math.floor(r()*3);            // 3..5 lines per bundle
          const L=0.55 + r()*0.25;
          for(let k=0;k<N;k++){
            const o=(k-(N-1)/2)*lineGap;
            const sx=bx + tx*o, sy=by + ty*o;      // root ON the wall
            const ex=sx + hx*L, ey=sy + hy*L;
            if(pointInAny(ex,ey)) continue;
            const st={a:[sx,sy], b:[ex,ey]}; strokes.push(st); out.push([sx,sy,ex,ey]);
          }
          d += bundleGap;
        }
        carry = d - segLen;
      }
    }
    // crossing generations — spawn along each line, perpendicular to it
    let front=strokes, depth=0; const maxDepth=2;
    while(depth<maxDepth && front.length){
      const next=[];
      for(const s of front){
        const dx=s.b[0]-s.a[0], dy=s.b[1]-s.a[1]; const len=Math.hypot(dx,dy)||1;
        const px=-dy/len, py=dx/len;               // perpendicular to this line
        for(const f of [0.32, 0.6, 0.84]){          // points ALONG the line (not the tips)
          const cx=s.a[0]+dx*f, cy=s.a[1]+dy*f;
          const r=seeded(cx*17.0 + depth*2.3, cy*17.0);
          if(r()<0.4) continue;
          const dir = r()<0.5 ? 1 : -1;
          const L=0.34 + r()*0.26;
          const ex=cx + px*dir*L, ey=cy + py*dir*L;
          if(pointInAny(ex,ey) || pointInAny((cx+ex)/2,(cy+ey)/2)) continue;   // exterior only
          const st={a:[cx,cy], b:[ex,ey]}; next.push(st); out.push([cx,cy,ex,ey]);
        }
      }
      front=next; depth++;
    }
    return out;
  }

  // Render entry point. The MAP itself (floors/walls/doors/stairs/grid/dots) is
  // drawn by the shared DungeonEngine when it's loaded (single source of truth,
  // shared with the GM Screen + Session Prep); otherwise by the inlined
  // renderLocalMap() fallback. Tool-preview + selection overlays are always drawn
  // here on top.
  function render(){
    applyStyle();
    if(window.DungeonEngine && window.DungeonEngine.renderTo){
      window.DungeonEngine.renderTo(ctx, map, {cam, W, H, DPR, theme, transparent:noRock, tex});
    } else {
      renderLocalMap();
    }
    if(!exporting){ drawPreview(); drawSelection(); }
  }
  function renderLocalMap(){
    doorHalf=null;                      // per-door wall thickness, recomputed per frame
    // Work in CSS-pixel logical space; scale once for crisp HiDPI output.
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,H);
    if(!noRock){
      const bgPat = patFor(ctx, tex && tex.bg), bgCol = tex && tex.bgColor;
      ctx.fillStyle = bgPat || bgCol || C.rockHi; ctx.fillRect(0,0,W,H);
      if(!bgPat && !bgCol) drawDotGrid();   // dots would just fight a rock texture
    }

    const shapes = map.shapes;
    if(shapes.length){
      ensureGeom();
      sizeBufs();
      // floor mask (white union)
      const m=buf.mask.getContext("2d"); m.setTransform(1,0,0,1,0,0);
      m.clearRect(0,0,W,H); m.fillStyle="#fff"; m.beginPath();
      for(const sh of shapes){ if(sh.deco) continue; shapePath(m, sh); } m.fill("nonzero");
      // Floors are PER-SHAPE. Walk the shapes in z-order and batch CONSECUTIVE
      // runs that share a fill: the common single-floor map still costs one pass
      // (and renders byte-identically to before), while a mixed map stays correct
      // — a later shape paints over an earlier one exactly as it was drawn.
      const runs=[];
      for(const sh of shapes){ if(sh.deco) continue;
        const ft=shapeFloorTex(sh), last=runs[runs.length-1];
        if(last && last.t===ft) last.list.push(sh); else runs.push({t:ft, list:[sh]});
      }
      const tc=buf.tint.getContext("2d"); tc.setTransform(1,0,0,1,0,0);
      tc.clearRect(0,0,W,H); tc.globalCompositeOperation="source-over";
      // Untextured floors keep the original mask + `source-in` path so the classic
      // render stays byte-identical. Anything with a texture — one run or twenty —
      // goes through the clipped-fill path below, which is both faster and the
      // only way mixed floors can be composited cheaply.
      if(runs.length<=1 && !(runs.length && runs[0].t)){
        tc.drawImage(buf.mask,0,0);
        tc.globalCompositeOperation="source-in";
        tc.fillStyle = patFor(tc, runs.length?runs[0].t:null) || C.floor; tc.fillRect(0,0,W,H);
        tc.globalCompositeOperation="source-over";
      } else {
        // One CLIPPED pattern fill per run — no composite modes, no scratch
        // buffers. The obvious mask + `source-in` approach is a trap here:
        // source-in is defined over the WHOLE canvas (everything outside the
        // source is cleared), so it costs a full-canvas pass per run even when
        // the fill is tiny — ~180 ms on an 18-room, four-style map. Clipping
        // costs only the run's own box.
        for(const r of runs){
          const bb=runBox(r.list); if(!bb) continue;
          tc.save();
          tc.beginPath(); for(const sh of r.list) shapePath(tc, sh); tc.clip("nonzero");
          tc.fillStyle = patFor(tc, r.t) || C.floor;
          tc.fillRect(bb.x,bb.y,bb.w,bb.h);
          tc.restore();
        }
      }
      ctx.drawImage(buf.tint,0,0);
      // grid inside floor
      if(map.grid && gridOp()>0 && wpx()>7){
        const gc=buf.grid.getContext("2d"); gc.setTransform(1,0,0,1,0,0);
        gc.clearRect(0,0,W,H); gc.globalCompositeOperation="source-over";
        // Width scales with zoom so it's a constant fraction of a cell: 3px at
        // export scale (res=2, the look Michael liked) and correspondingly thinner
        // in the live preview instead of a fixed 3px that looks heavy there.
        gc.strokeStyle=C.grid; gc.lineWidth=Math.max(1,1.5*cam.scale); gc.globalAlpha=.85*gridOp();
        const p=wpx(); const [ox,oy]=toScreen(0,0); gc.beginPath();
        for(let x=ox%p;x<=W;x+=p){ gc.moveTo(x+.5,0); gc.lineTo(x+.5,H); }
        for(let y=oy%p;y<=H;y+=p){ gc.moveTo(0,y+.5); gc.lineTo(W,y+.5); }
        gc.stroke(); gc.globalAlpha=1;
        gc.globalCompositeOperation="destination-in"; gc.drawImage(buf.mask,0,0);
        ctx.drawImage(buf.grid,0,0);
      }
      drawWalls();                       // rough-edged room walls (round circles), drop shadow
    }

    drawInteriorWalls();
    drawDecoShapes();
    for(const d of map.doors) drawDoor(d);
    for(const s of map.stairs) drawStair(s);
    drawObjects();
  }

  function drawDotGrid(){ const p=wpx(); if(p<13) return; const go=gridOp(); if(go<=0) return;
    ctx.save(); ctx.fillStyle=C.dot; ctx.globalAlpha=.8*go;
    const [ox,oy]=toScreen(0,0); const r=Math.max(0.6,0.85*Math.min(2,cam.scale));
    for(let x=ox%p;x<W;x+=p) for(let y=oy%p;y<H;y+=p){ ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.fill(); }
    ctx.restore(); }

  function drawHatch(){ if(!hatchStrokes.length) return; ctx.save();
    ctx.strokeStyle=C.hatch; ctx.lineCap="round"; ctx.lineWidth=Math.max(0.8,1.05*cam.scale); ctx.globalAlpha=.5;
    ctx.beginPath();
    for(const s of hatchStrokes){ const [a,b]=toScreen(s[0],s[1]); const [c,d]=toScreen(s[2],s[3]);
      ctx.moveTo(a,b); ctx.lineTo(c,d); }
    ctx.stroke(); ctx.restore(); }

  // straight polyline through the actual contour vertices (used by the shadow)
  function strokeLoop(loop){ ctx.beginPath();
    for(let i=0;i<loop.length;i++){ const [sx,sy]=toScreen(loop[i][0],loop[i][1]);
      if(i===0) ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy); }
    ctx.stroke(); }

  function drawWallShadow(){ ctx.save(); ctx.strokeStyle=C.shadow; ctx.lineJoin="round"; ctx.lineCap="round";
    ctx.lineWidth=Math.max(3.5,5*cam.scale); const o=Math.min(2,cam.scale); ctx.translate(2.4*o,3*o);
    for(const loop of contours) strokeLoop(loop); ctx.restore(); }

  // A straight wall segment rendered as a FILLED ribbon whose centreline stays
  // exactly on the segment (no drift) but whose two long edges wander — the rough
  // marker/pen edge. Seeded by world position ⇒ stable. Used for interior walls.
  function roughSeg(c, aw, bw, halfW){
    const [ax,ay]=toScreen(aw[0],aw[1]), [bx,by]=toScreen(bw[0],bw[1]);
    const dx=bx-ax, dy=by-ay; const len=Math.hypot(dx,dy); if(len<0.5) return;
    const nx=-dy/len, ny=dx/len;
    const steps=Math.max(2, Math.round(len/Math.max(3,4*cam.scale)));
    c.beginPath();
    for(let k=0;k<=steps;k++){ const f=k/steps;
      const wx=aw[0]+(bw[0]-aw[0])*f, wy=aw[1]+(bw[1]-aw[1])*f;
      const amp=halfW*(0.7 + seeded(wx*29, wy*29)()*0.7);
      const px=ax+dx*f + nx*amp, py=ay+dy*f + ny*amp;
      if(k===0) c.moveTo(px,py); else c.lineTo(px,py);
    }
    for(let k=steps;k>=0;k--){ const f=k/steps;
      const wx=aw[0]+(bw[0]-aw[0])*f, wy=aw[1]+(bw[1]-aw[1])*f;
      const amp=halfW*(0.7 + seeded(wx*29+13, wy*29+7)()*0.7);
      const px=ax+dx*f - nx*amp, py=ay+dy*f - ny*amp;
      c.lineTo(px,py);
    }
    c.closePath(); c.fill();
    c.beginPath(); c.arc(ax,ay,halfW*1.02,0,6.2832); c.fill();
    c.beginPath(); c.arc(bx,by,halfW*1.02,0,6.2832); c.fill();
  }

  // A rough-edged ring around a closed world polyline. Densifies each edge, so
  // circles (sampled as real arcs) come out ROUND while rects stay crisp; both
  // get the wandering rough edge. Filled as an annulus (evenodd).
  function roughRing(c, pts, halfW){
    const dp=[]; const n=pts.length;
    for(let i=0;i<n;i++){ const a=pts[i], b=pts[(i+1)%n];
      const dx=b[0]-a[0], dy=b[1]-a[1]; const len=Math.hypot(dx,dy); if(len<1e-6) continue;
      const steps=Math.max(1, Math.round(len/0.16));
      for(let k=0;k<steps;k++){ const f=k/steps; dp.push([a[0]+dx*f, a[1]+dy*f]); } }
    const m=dp.length; if(m<3) return;
    const outer=[], inner=[];
    for(let i=0;i<m;i++){
      const p=dp[i], pa=dp[(i-1+m)%m], pb=dp[(i+1)%m];
      const ex=pb[0]-pa[0], ey=pb[1]-pa[1]; const l=Math.hypot(ex,ey)||1; const nx=-ey/l, ny=ex/l;
      const ao=halfW*(0.72 + seeded(p[0]*29, p[1]*29)()*0.66);
      const ai=halfW*(0.72 + seeded(p[0]*29+11, p[1]*29+5)()*0.66);
      const [sx,sy]=toScreen(p[0],p[1]);
      outer.push([sx+nx*ao, sy+ny*ao]); inner.push([sx-nx*ai, sy-ny*ai]);
    }
    c.beginPath();
    c.moveTo(outer[0][0],outer[0][1]); for(let i=1;i<m;i++) c.lineTo(outer[i][0],outer[i][1]); c.closePath();
    c.moveTo(inner[0][0],inner[0][1]); for(let i=1;i<m;i++) c.lineTo(inner[i][0],inner[i][1]); c.closePath();
    c.fill("evenodd");
  }
  // closed world outline for a shape (circle sampled as a true arc → round)
  function shapeOutline(sh){
    if(sh.type==="rect") return [[sh.x,sh.y],[sh.x+sh.w,sh.y],[sh.x+sh.w,sh.y+sh.h],[sh.x,sh.y+sh.h]];
    if(sh.type==="circle"){ const K=Math.max(28, Math.round(sh.r*8)); const o=[];
      for(let i=0;i<K;i++){ const a=i/K*Math.PI*2; o.push([sh.cx+Math.cos(a)*sh.r, sh.cy+Math.sin(a)*sh.r]); } return o; }
    if(sh.type==="polygon") return sh.pts.slice();
    return [];
  }
  // fill a shape's interior INSET inward by `e` (world units) onto ctx `c`
  function fillInsetShape(c, sh, e){
    if(sh.type==="rect"){ if(sh.w>2*e && sh.h>2*e){ const [x,y]=toScreen(sh.x+e, sh.y+e);
      c.fillRect(x, y, (sh.w-2*e)*wpx(), (sh.h-2*e)*wpx()); } }
    else if(sh.type==="circle"){ const rr=sh.r-e; if(rr>0){ const [x,y]=toScreen(sh.cx,sh.cy);
      c.beginPath(); c.arc(x,y, rr*wpx(), 0, 6.2832); c.fill(); } }
    else if(sh.type==="polygon"){ const pts=sh.pts; if(pts.length<3) return;
      let cx=0,cy=0; for(const p of pts){ cx+=p[0]; cy+=p[1]; } cx/=pts.length; cy/=pts.length;
      c.beginPath();
      for(let i=0;i<pts.length;i++){ let dx=pts[i][0]-cx, dy=pts[i][1]-cy; const l=Math.hypot(dx,dy)||1;
        const [sx,sy]=toScreen(pts[i][0]-dx/l*e, pts[i][1]-dy/l*e); if(i===0)c.moveTo(sx,sy); else c.lineTo(sx,sy); }
      c.closePath(); c.fill(); }
  }

  // Walls = each room's true outline (round circles!) rendered rough, then the
  // union interior (eroded) is punched out so overlaps merge and corridor mouths
  // stay open — the classic no-internal-walls union, but with real curves.

  // ── textured walls (Advanced Mode) ────────────────────────────────
  // Per-object styling: a shape/wall may carry its own `floor`/`wall` texture id.
  //   undefined ⇒ inherit the map default (so a generated dungeon restyles wholesale)
  //   ""        ⇒ explicitly classic ink / parchment
  //   an id     ⇒ that texture, resolved through tex.byId
  function texOf(id, dflt){
    if(id===undefined || id===null) return dflt || null;
    if(id==="") return null;
    return (tex && tex.byId && tex.byId[id]) || null;
  }
  function shapeFloorTex(sh){ return tex ? texOf(sh.floor, tex.floor) : null; }
  function shapeWallTex(sh){  return tex ? texOf(sh.wall,  tex.wall)  : null; }

  // Wall half-thickness for a given wall texture, in SCREEN px. With no texture
  // this returns exactly the classic ink value, so classic stays byte-identical.
  // User-controllable grid opacity (map.gridOpacity, 0..1, default 1). It scales
  // BOTH the in-floor grid and the exterior dot grid, so the default of 1 leaves
  // the classic render untouched.
  function gridOp(){ const v = map && map.gridOpacity; return (v==null) ? 1 : Math.max(0, Math.min(1, v)); }
  // Screen-space bounding box of a group of shapes, clamped to the canvas.
  function runBox(list){
    let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
    for(const sh of list){ const b=bounds(sh,"shape"); if(!b) continue;
      const p=toScreen(b.x,b.y), q=toScreen(b.x+b.w,b.y+b.h);
      if(p[0]<x0)x0=p[0]; if(p[1]<y0)y0=p[1]; if(q[0]>x1)x1=q[0]; if(q[1]>y1)y1=q[1]; }
    if(!isFinite(x0)) return null;
    x0=Math.max(0,Math.floor(x0-6)); y0=Math.max(0,Math.floor(y0-6));
    x1=Math.min(W,Math.ceil(x1+6));  y1=Math.min(H,Math.ceil(y1+6));
    return (x1<=x0||y1<=y0) ? null : {x:x0,y:y0,w:x1-x0,h:y1-y0};
  }
  function halfPxFor(t){ return t ? Math.max(1, 0.5*(t.thick||0.4)*wpx()) : Math.max(1.3,1.7*cam.scale); }
  // …and in world cells, or 0 for classic ink (also used as a "textured?" test).
  function halfCellsFor(t){ return t ? 0.5*(t.thick||0.4) : 0; }
  function wallHalfPx(){ return halfPxFor(tex && tex.wall); }

  // Doors take the thickness of the wall they actually sit in — the outline they
  // are nearest to — so a door in a thin wall doesn't get a fat leaf just because
  // some other room is thick. Rebuilt once per render.
  let doorHalf = null;
  function wallHalfCellsAt(d){
    if(!tex) return 0;
    if(!doorHalf){
      doorHalf = new Map();
      for(const dd of map.doors){
        let best=null, bd=Infinity;
        for(const sh of map.shapes){ if(sh.deco) continue;
          const o=shapeOutline(sh);
          for(let i=0;i<o.length;i++){ const a=o[i], b=o[(i+1)%o.length];
            const q=distToSeg(dd.x,dd.y,a[0],a[1],b[0],b[1]);
            if(q<bd){ bd=q; best=sh; } } }
        doorHalf.set(dd, halfCellsFor(best ? shapeWallTex(best) : (tex && tex.wall)));
      }
    }
    return doorHalf.get(d) || 0;
  }

  // Lay a wall strip along a world polyline. One rotated, clipped quad per
  // segment, with a running distance `s` so the texture flows continuously
  // around corners instead of restarting at every vertex. Each quad is extended
  // by the half-thickness at both ends, so neighbouring quads overlap and fill
  // the notch on the outside of a turn — no mitre maths needed.
  // Tiles alternate normal / mirrored: pack wall strips are NOT pixel-seamless
  // end-to-end (2MT's Dark strip differs by ~66/255 across the join), and
  // mirroring makes every repeat boundary exact by construction.
  // Insert points so no gap along a screen-space polyline exceeds `maxPx`. Used
  // to smooth curved interior walls for the strip renderer WITHOUT touching
  // wallSamples(), whose sampling the ink renderer's roughness is seeded from.
  function densify(pts, maxPx){
    const out=[]; const px=wpx();
    for(let i=0;i<pts.length-1;i++){
      const a=pts[i], b=pts[i+1];
      const d=Math.hypot(b[0]-a[0], b[1]-a[1])*px;
      const n=Math.max(1, Math.min(64, Math.ceil(d/maxPx)));
      for(let k=0;k<n;k++) out.push([a[0]+(b[0]-a[0])*k/n, a[1]+(b[1]-a[1])*k/n]);
    }
    out.push(pts[pts.length-1]);
    return out;
  }
  // A shape outline sampled by SCREEN arc length — a vertex roughly every 5 px —
  // so a round room's textured wall stays smooth at any zoom. The ink renderer
  // keeps shapeOutline()'s fixed sampling, so classic output is unchanged.
  function outlineDense(sh){
    if(sh.type!=="circle") return shapeOutline(sh);
    const K=Math.max(32, Math.min(400, Math.round(2*Math.PI*sh.r*wpx()/5)));
    const o=[];
    for(let i=0;i<K;i++){ const a=i/K*Math.PI*2; o.push([sh.cx+Math.cos(a)*sh.r, sh.cy+Math.sin(a)*sh.r]); }
    return o;
  }

  function stripPath(c, pts, closed, t, halfPx){
    if(!t || !t.img || !t.img.complete || !t.img.naturalWidth) return false;
    const P=pts.map(p=>toScreen(p[0],p[1]));
    let n=P.length;
    if(closed && n>1 && P[0][0]===P[n-1][0] && P[0][1]===P[n-1][1]){ P.pop(); n--; }
    if(n<2) return false;
    const segN = closed ? n : n-1;
    const dir=[], len=[];
    for(let i=0;i<segN;i++){
      const a=P[i], b=P[(i+1)%n];
      const dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy);
      dir.push(L>1e-6 ? [dx/L,dy/L] : null); len.push(L);
    }
    // MITRE JOINS. Each segment is clipped by the angle bisector at both ends, so
    // neighbouring quads tile the ribbon exactly — no notch on the outside of a
    // turn and no double-drawn overlap on the inside (the old code extended every
    // quad by the half-width and let them overlap, which left a visible mismatch
    // where the two rotations met). `k` is the cut line's slope in the segment's
    // own frame: local x = k*y, so the cut corners sit at (∓k·h, ∓h).
    const ML=4;                                     // miter limit, in half-widths
    // The mitre line through a vertex is the bisector of (−incoming) and
    // (outgoing) — one line, shared by both segments that meet there. `frame` is
    // the segment we're expressing it FOR, and it must be that segment's own
    // direction: a segment's END cut measured in the NEXT segment's frame comes
    // out sign-flipped (the frames differ by the turn angle), which cuts every
    // corner backwards — outer edge pulling back, inner edge overhanging.
    const cutK=(prev,next,frame)=>{
      if(!prev || !next) return 0;                  // open end ⇒ square cap
      let wx=next[0]-prev[0], wy=next[1]-prev[1];
      const wl=Math.hypot(wx,wy); if(wl<1e-6) return 0;
      wx/=wl; wy/=wl;
      const nx=-frame[1], ny=frame[0];
      const ly=wx*nx+wy*ny; if(Math.abs(ly)<1e-6) return 0;
      const k=(wx*frame[0]+wy*frame[1])/ly;
      return Math.max(-ML, Math.min(ML, k));
    };
    const tileW=Math.max(8,(t.tile||6)*wpx()), per=2*tileW;
    let s=0;
    for(let i=0;i<segN;i++){
      const u=dir[i], L=len[i];
      if(!u || L<0.01) continue;
      const prev = closed ? dir[(i-1+segN)%segN] : (i>0 ? dir[i-1] : null);
      const next = closed ? dir[(i+1)%segN]      : (i<segN-1 ? dir[i+1] : null);
      let kS=cutK(prev,u,u), kE=cutK(u,next,u);   // both in THIS segment's frame
      // Guard against a bow-tie when the segment is short relative to its cuts.
      const spread=Math.abs(kS-kE)*halfPx;
      if(spread > L*0.95 && spread>0){ const f=(L*0.95)/spread; kS*=f; kE*=f; }
      const h=halfPx, ext=(Math.abs(kS)+Math.abs(kE))*h+2;
      c.save();
      c.translate(P[i][0],P[i][1]); c.rotate(Math.atan2(u[1],u[0]));
      c.beginPath();
      c.moveTo(-kS*h,-h); c.lineTo(L-kE*h,-h); c.lineTo(L+kE*h,h); c.lineTo(kS*h,h);
      c.closePath(); c.clip();
      let x=-(s%per); while(x>-ext) x-=per;
      for(; x<L+ext; x+=per){
        c.drawImage(t.img, x, -h, tileW, 2*h);
        c.save(); c.translate(x+per,0); c.scale(-1,1);
        c.drawImage(t.img, 0, -h, tileW, 2*h); c.restore();
      }
      c.restore();
      s+=L;
    }
    return true;
  }

  function drawWalls(){
    if(!map.shapes.length) return;
    const wc=buf.wall.getContext("2d"); wc.setTransform(1,0,0,1,0,0); wc.clearRect(0,0,W,H);
    wc.globalCompositeOperation="source-over"; wc.fillStyle=C.ink;
    // Per-shape outlines (exact circles) stroked with THAT shape's wall texture,
    // then the inset-union erase below drops wall that lies inside another room —
    // same merge rule as the ink renderer.
    for(const sh of map.shapes){ if(sh.deco) continue;
      const wt=shapeWallTex(sh), hp=halfPxFor(wt);
      if(wt && stripPath(wc, outlineDense(sh), true, wt, hp)) continue;
      roughRing(wc, shapeOutline(sh), hp); }
    // Erase mask = union of each shape's fill INSET individually (not the eroded
    // union). A wall is removed only where it lies inside *another* shape's
    // interior (a real overlap). Two shapes that merely share an edge each inset
    // away from that edge, leaving a gap there, so the shared wall survives.
    const ec=buf.erode.getContext("2d"); ec.setTransform(1,0,0,1,0,0); ec.clearRect(0,0,W,H);
    ec.globalCompositeOperation="source-over"; ec.fillStyle="#fff";
    for(const sh of map.shapes){ if(sh.deco) continue;   // inset > that shape's own wall half-width
      fillInsetShape(ec, sh, (halfPxFor(shapeWallTex(sh))+1.4)/wpx()); }
    wc.globalCompositeOperation="destination-out"; wc.drawImage(buf.erode,0,0);
    for(const d of map.doors) punchDoorQuad(wc, d);   // opening scales with wall thickness   // transparent gap for each door
    // soft drop shadow taken from the real wall shape (round under circles)
    if(!noRock){ const o=Math.min(2,cam.scale); ctx.save(); ctx.globalAlpha=.16;
      ctx.drawImage(buf.wall, 2.3*o, 2.9*o); ctx.restore(); }
    ctx.drawImage(buf.wall,0,0);
  }

  // Sample a curved wall into world points as a HALF-ELLIPSE: the chord is the full
  // major axis and the clicked apex sets the minor axis. `cx,cy` is stored
  // Bézier-style (C = 2Q − midpoint) so the apex is Q = (C + midpoint)/2.
  // Why an ellipse and not the circle through the 3 points: an ellipse leaves the
  // curve PERPENDICULAR to the chord at BOTH ends for any apex depth, so two
  // mirrored walls on the same two endpoints meet tangent-to-tangent and close into
  // one smooth oval — a half circle when the apex depth equals half the chord.
  function wallSamples(wl){
    const x1=wl.x1,y1=wl.y1,x2=wl.x2,y2=wl.y2;
    const mx=(x1+x2)/2, my=(y1+y2)/2;
    const qx=(wl.cx+mx)/2, qy=(wl.cy+my)/2;              // the apex the wall bows through
    const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy);
    if(L<1e-9) return [[x1,y1],[x2,y2]];
    const a=L/2, ux=dx/L, uy=dy/L, nx=-uy, ny=ux;        // semi-chord + unit chord/normal axes
    const h=(qx-mx)*nx + (qy-my)*ny;                     // signed apex depth (either side)
    if(Math.abs(h)<1e-9) return [[x1,y1],[x2,y2]];       // apex on the chord ⇒ straight
    // Half-ellipse: semi-axis `a` along the chord, `h` along the normal, swept
    // t = π → 0 so it runs start → apex → end.
    const N=Math.max(12, Math.min(160, Math.round((a+Math.abs(h))*14)));
    const pts=[];
    for(let i=0;i<=N;i++){ const t=Math.PI*(1-i/N), c=Math.cos(t), s=Math.sin(t);
      pts.push([mx + a*c*ux + h*s*nx, my + a*c*uy + h*s*ny]); }
    return pts;
  }
  // A rough-edged ribbon along an open world polyline (curved wall / shape line).
  function roughCurve(c, worldPts, halfW){
    const n=worldPts.length; if(n<2) return;
    const S=worldPts.map(p=>toScreen(p[0],p[1]));
    const top=[], bot=[];
    for(let i=0;i<n;i++){
      const a=S[Math.max(0,i-1)], b=S[Math.min(n-1,i+1)];
      const dx=b[0]-a[0], dy=b[1]-a[1]; const l=Math.hypot(dx,dy)||1; const nx=-dy/l, ny=dx/l;
      const w=worldPts[i];
      const at=halfW*(0.7+seeded(w[0]*29,w[1]*29)()*0.7), ab=halfW*(0.7+seeded(w[0]*29+13,w[1]*29+7)()*0.7);
      top.push([S[i][0]+nx*at, S[i][1]+ny*at]); bot.push([S[i][0]-nx*ab, S[i][1]-ny*ab]);
    }
    c.beginPath(); c.moveTo(top[0][0],top[0][1]);
    for(let i=1;i<n;i++) c.lineTo(top[i][0],top[i][1]);
    for(let i=n-1;i>=0;i--) c.lineTo(bot[i][0],bot[i][1]);
    c.closePath(); c.fill();
    c.beginPath(); c.arc(S[0][0],S[0][1],halfW*1.02,0,6.2832); c.fill();
    c.beginPath(); c.arc(S[n-1][0],S[n-1][1],halfW*1.02,0,6.2832); c.fill();
  }
  function drawInteriorWalls(){ if(!map.walls.length) return; ctx.save(); ctx.fillStyle=C.ink;
    const normal=Math.max(1.3,1.7*cam.scale), thin=Math.max(0.6,0.85*cam.scale);
    for(const wl of map.walls){
      const wt = tex ? texOf(wl.wall, tex.wall) : null;
      const pts = (wl.cx===undefined || wl.cy===undefined) ? [[wl.x1,wl.y1],[wl.x2,wl.y2]] : wallSamples(wl);
      if(wt && stripPath(ctx, densify(pts,5), false, wt, halfPxFor(wt)*(wl.thin?0.5:1))) continue;
      const hw = wl.thin ? thin : normal;
      if(wl.cx===undefined || wl.cy===undefined) roughSeg(ctx, [wl.x1,wl.y1],[wl.x2,wl.y2], hw);
      else roughCurve(ctx, pts, hw); }
    ctx.restore(); }

  // Interior "shapes" (deco: pillars, dais, tables, pits) — thin rough OUTLINES
  // on top of the floor. They add no floor, no rock wall, no interior punch; a
  // Circle-tool shape is a perfect round outline. shapeOutline samples arcs.
  // ── objects (Advanced Mode) ───────────────────────────────────────
  // map.objects[] = { id, tex, x, y, w, h, rot, flip }
  //   x,y = CENTRE in world cells · w,h = size in cells · rot = radians
  // Drawn last, on top of floors, walls, doors and stairs — a prop sits on the
  // map. Resolved through tex.byId like every other texture, so objects appear
  // only in Advanced Mode and classic output stays pure ink by construction.
  function drawObjects(){
    if(!tex || !map.objects || !map.objects.length) return;
    for(const o of map.objects){
      const t=texOf(o.tex, null);
      if(!t || !t.img || !t.img.complete || !t.img.naturalWidth) continue;
      const p=toScreen(o.x,o.y), w=(o.w||1)*wpx(), h=(o.h||1)*wpx();
      ctx.save();
      ctx.translate(p[0],p[1]);
      if(o.rot) ctx.rotate(o.rot);
      if(o.flip) ctx.scale(-1,1);
      const a=t.atlas;
      if(a) ctx.drawImage(t.img, a.x, a.y, a.w, a.h, -w/2, -h/2, w, h);  // bundled: atlas sub-rect
      else  ctx.drawImage(t.img, -w/2, -h/2, w, h);                      // imported: whole file
      ctx.restore();
    }
  }
  // World-space AABB of a (possibly rotated) object.
  function objBox(o){
    const hw=(o.w||1)/2, hh=(o.h||1)/2, r=o.rot||0, c=Math.cos(r), s=Math.sin(r);
    const xs=[], ys=[];
    for(const [dx,dy] of [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]]){
      xs.push(o.x+dx*c-dy*s); ys.push(o.y+dx*s+dy*c); }
    const x=Math.min.apply(null,xs), y=Math.min.apply(null,ys);
    return {x, y, w:Math.max.apply(null,xs)-x, h:Math.max.apply(null,ys)-y};
  }

  // A Shapes-mode outline follows the shape's WALL texture, at half thickness —
  // the same treatment the thin Wall tool gets, so a pillar or dais reads as a
  // thin course of the same masonry rather than an ink line on a textured map.
  // Falls back to the rough ink ring when there's no texture.
  function drawDecoRing(c, sh, inkHalf){
    const wt=shapeWallTex(sh);
    if(wt && stripPath(c, outlineDense(sh), true, wt, Math.max(1, halfPxFor(wt)*0.5))) return;
    roughRing(c, shapeOutline(sh), inkHalf);
  }

  function drawDecoShapes(){
    let any=false, floor=false;
    for(const s of map.shapes){ if(s.deco) any=true; else floor=true; }
    if(!any) return;
    const thin=Math.max(0.6,0.85*cam.scale);
    // No rooms at all ⇒ nothing to clip against, draw the outlines as-is.
    if(!floor){ ctx.save(); ctx.fillStyle=C.ink;
      for(const sh of map.shapes){ if(sh.deco) drawDecoRing(ctx, sh, thin); }
      ctx.restore(); return; }
    // Otherwise a deco shape is CLIPPED to the dungeon interior: draw the thin
    // outlines to a scratch buffer, then keep only the pixels that land on the
    // floor union (inset by the room-wall half-width, so an outline stops at the
    // wall's inner edge instead of bleeding across it). Half a circle placed on an
    // exterior wall therefore shows only the half that is inside the room.
    sizeBufs();
    const dc=buf.deco.getContext("2d"); dc.setTransform(1,0,0,1,0,0); dc.clearRect(0,0,W,H);
    dc.globalCompositeOperation="source-over"; dc.fillStyle=C.ink;
    for(const sh of map.shapes){ if(!sh.deco) continue; drawDecoRing(dc, sh, thin); }
    const cc=buf.decoClip.getContext("2d"); cc.setTransform(1,0,0,1,0,0); cc.clearRect(0,0,W,H);
    cc.globalCompositeOperation="source-over"; cc.fillStyle="#fff";
    for(const sh of map.shapes){ if(sh.deco) continue;
      fillInsetShape(cc, sh, (halfPxFor(shapeWallTex(sh))+1.4)/wpx()); }
    dc.globalCompositeOperation="destination-in"; dc.drawImage(buf.decoClip,0,0);
    ctx.drawImage(buf.deco,0,0); }

  // Doors: {x,y,a,len} — a is the wall direction; a thin leaf sits in the opening.
  // world-space frame for a door. `len` is the FULL span between the two
  // placement clicks (the stub tips); the rectangle is inset from the tips by
  // the stub length, so the clicked points are the tips of the connector stubs.
  function doorGeom(d){
    const a=d.a||0, stub=0.13, hl=(d.len||1)/2;
    // `ht` drives BOTH the leaf (drawDoor) and the opening punched through the
    // wall (punchDoorQuad), so a thick textured wall gets a matching thick door
    // rather than a gap around a too-thin leaf. 0 in classic ⇒ 0.15 as before.
    return { cx:d.x, cy:d.y, alx:Math.cos(a), aly:Math.sin(a), acx:-Math.sin(a), acy:Math.cos(a),
             hl, rhl:Math.max(0.12, hl-stub), ht:Math.max(0.15, wallHalfCellsAt(d)), stub };   // hl=tip, rhl=rectangle half-length, ht=half thickness
  }
  // Clear the wall ONLY under the rectangle + the thin stub lines — everything
  // else in the door's footprint stays transparent so the walls aren't cut off.
  function punchDoorQuad(wc, d){
    const g=doorGeom(d);
    const rect=(sl0,sl1,st)=>{ const c=(sl,s)=>toScreen(g.cx+g.alx*sl+g.acx*s, g.cy+g.aly*sl+g.acy*s);
      const p1=c(sl0,-st),p2=c(sl1,-st),p3=c(sl1,st),p4=c(sl0,st);
      wc.beginPath(); wc.moveTo(p1[0],p1[1]); wc.lineTo(p2[0],p2[1]); wc.lineTo(p3[0],p3[1]); wc.lineTo(p4[0],p4[1]); wc.closePath(); wc.fill(); };
    rect(-g.rhl, g.rhl, g.ht*1.1);                       // the rectangle opening
    const sh=Math.max(0.05, wallHalfCellsAt(d) || (1.7*cam.scale)/wpx());      // stub strip ≈ the stub line's width
    rect(-g.hl, -g.rhl, sh);                              // left stub
    rect( g.rhl, g.hl, sh);                               // right stub
  }
  // Door = a filled leaf RECTANGLE (rough outline, all four sides), inset from the
  // stub tips, with a short wall-connector stub out of the CENTRE of each short
  // side reaching to the tips (which are the placement start/end points).
  function drawDoor(d){
    const g=doorGeom(d), halfW=Math.max(1.1,1.5*cam.scale);
    const w=(sl,st)=>[g.cx+g.alx*sl+g.acx*st, g.cy+g.aly*sl+g.acy*st];
    const s=(sl,st)=>toScreen(g.cx+g.alx*sl+g.acx*st, g.cy+g.aly*sl+g.acy*st);
    ctx.save();
    // filled leaf interior (outside the rectangle stays transparent)
    const A=s(-g.rhl,-g.ht),B=s(g.rhl,-g.ht),C2=s(g.rhl,g.ht),D=s(-g.rhl,g.ht);
    // Advanced Mode gets a wood-brown leaf; the near-white classic fill reads as a
    // hole punched in the wall once everything around it is textured stone.
    // `tex` is only set in textured mode, so classic output is untouched.
    ctx.fillStyle = tex ? C.doorWood : C.doorFill;
    ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.lineTo(C2[0],C2[1]); ctx.lineTo(D[0],D[1]); ctx.closePath(); ctx.fill();
    // rough black rectangle outline + centre stubs reaching to the tips
    ctx.fillStyle=C.ink;
    roughSeg(ctx, w(-g.rhl,-g.ht), w( g.rhl,-g.ht), halfW);   // long side
    roughSeg(ctx, w(-g.rhl, g.ht), w( g.rhl, g.ht), halfW);   // long side
    roughSeg(ctx, w(-g.rhl,-g.ht), w(-g.rhl, g.ht), halfW);   // short side
    roughSeg(ctx, w( g.rhl,-g.ht), w( g.rhl, g.ht), halfW);   // short side
    roughSeg(ctx, w(-g.rhl,0), w(-g.hl,0), halfW);            // left stub → tip
    roughSeg(ctx, w( g.rhl,0), w( g.hl,0), halfW);            // right stub → tip
    ctx.restore();
  }

  // Stairs = a triangle of rough rungs. base A→B is the wide starting edge, tip is
  // the apex; each rung runs parallel to the base and tapers in length toward the
  // tip. ~5–6 rungs per cell of run; rungs share the walls' rough-edge look.
  function drawStair(s){
    let a,b,tip;
    if(s.ax!==undefined){ a=[s.ax,s.ay]; b=[s.bx,s.by]; tip=[s.tx,s.ty]; }
    else if(s.x1!==undefined){                          // back-compat: old run+width schema
      const dx=s.x2-s.x1, dy=s.y2-s.y1, len=Math.hypot(dx,dy)||1, nx=-dy/len, ny=dx/len, hw=(s.w||2)/2;
      a=[s.x1+nx*hw, s.y1+ny*hw]; b=[s.x1-nx*hw, s.y1-ny*hw]; tip=[s.x2,s.y2];
    } else return;
    const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
    const travel=Math.hypot(tip[0]-mx, tip[1]-my);
    const steps=Math.max(2, Math.round(travel/0.18));   // ~5–6 rungs per cell of run
    const halfW=Math.max(0.7,1.0*cam.scale);
    ctx.save(); ctx.fillStyle=C.ink;
    for(let i=0;i<=steps;i++){ const t=i/steps;
      const la=[a[0]+(tip[0]-a[0])*t, a[1]+(tip[1]-a[1])*t];
      const lb=[b[0]+(tip[0]-b[0])*t, b[1]+(tip[1]-b[1])*t];
      if(Math.hypot(lb[0]-la[0], lb[1]-la[1])<0.06) continue;   // skip degenerate rung at the tip
      roughSeg(ctx, la, lb, halfW);
    }
    ctx.restore(); }

  // ── live tool preview ─────────────────────────────────────────────
  let draft = null;        // in-progress shape while dragging
  let polyPts = null;      // polygon vertices being placed
  let placing = null;      // {tool,start,end} — click-move-click door/stair
  function drawPreview(){
    ctx.save(); ctx.globalAlpha=.85;
    if(draft){
      ctx.setLineDash([5,4]); ctx.strokeStyle=C.sel; ctx.lineWidth=1.6; ctx.beginPath();
      if(draft.kind==="wall"){ const [a,b]=toScreen(draft.x1,draft.y1),[c,d]=toScreen(draft.x2,draft.y2);
        ctx.moveTo(a,b); ctx.lineTo(c,d); }
      else shapePath(ctx, draft);
      ctx.stroke(); ctx.setLineDash([]);
    }
    if(placing){
      const pts=placing.pts, hv=placing.hover;
      const dash=(a,b)=>{ if(!a||!b) return; const [ax,ay]=toScreen(a[0],a[1]),[bx,by]=toScreen(b[0],b[1]);
        ctx.save(); ctx.setLineDash([4,4]); ctx.strokeStyle=C.sel; ctx.lineWidth=1.2;
        ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke(); ctx.restore(); };
      if(placing.tool==="door"){
        const end=pts[1]||hv; if(end) drawDoor(doorFromPts(pts[0], end)); dash(pts[0], end);
      } else if(placing.tool==="wall"){
        const thinMode=(drawMode==="shapes");
        if(pts.length===1){ dash(pts[0], hv); }                        // dragging out the straight span
        else if(pts.length===2){                                       // span fixed, aiming the curve apex
          const wl=wallFromPts(pts[0], pts[1], hv, thinMode);
          if(wl){ ctx.save(); ctx.fillStyle=C.ink; const hw = thinMode ? Math.max(0.6,0.85*cam.scale) : Math.max(1.3,1.7*cam.scale);
            if(wl.cx===undefined) roughSeg(ctx,[wl.x1,wl.y1],[wl.x2,wl.y2],hw); else roughCurve(ctx, wallSamples(wl), hw); ctx.restore(); }
          dash([(pts[0][0]+pts[1][0])/2,(pts[0][1]+pts[1][1])/2], hv); // handle from chord midpoint to the apex
        }
      } else {
        if(pts.length===1){ dash(pts[0], hv); }                        // setting the width edge
        else if(pts.length===2){ const g=stairFromPts(pts[0], pts[1], hv);
          if(g) drawStair(g); dash(pts[0], pts[1]); }                  // base edge fixed, aiming the tip
      }
      ctx.fillStyle=C.sel;
      for(const p of pts){ const [sx,sy]=toScreen(p[0],p[1]); ctx.beginPath(); ctx.arc(sx,sy,3.5,0,7); ctx.fill(); }
    }
    if(polyPts && polyPts.length){
      ctx.strokeStyle=C.sel; ctx.fillStyle="rgba(201,169,74,.15)"; ctx.lineWidth=1.6;
      ctx.beginPath(); const [x0,y0]=toScreen(polyPts[0][0],polyPts[0][1]); ctx.moveTo(x0,y0);
      for(let i=1;i<polyPts.length;i++){ const [x,y]=toScreen(polyPts[i][0],polyPts[i][1]); ctx.lineTo(x,y); }
      if(hoverPt){ const [hx,hy]=toScreen(hoverPt[0],hoverPt[1]); ctx.lineTo(hx,hy); }
      ctx.stroke();
      for(const pt of polyPts){ const [x,y]=toScreen(pt[0],pt[1]);
        ctx.fillStyle=C.sel; ctx.beginPath(); ctx.arc(x,y,3.5,0,7); ctx.fill(); }
    }
    ctx.restore();
  }
  // Screen positions of an object's outline and its two drag handles.
  function objHandles(o){
    const c=toScreen(o.x,o.y), s=wpx(), r=o.rot||0;
    const hw=(o.w||1)*s/2, hh=(o.h||1)*s/2, co=Math.cos(r), si=Math.sin(r);
    const P=(x,y)=>[c[0]+x*co-y*si, c[1]+x*si+y*co];
    return { c, hw, hh,
             corners:[P(-hw,-hh),P(hw,-hh),P(hw,hh),P(-hw,hh)],
             scale:P(hw,hh), rotate:P(0,-hh-22) };
  }
  function drawSelection(){
    if(sel==null) return;
    const o=objAt(sel);
    if(!o) return;
    if(o.kind==="object"){
      const H=objHandles(o.obj);
      ctx.save(); ctx.strokeStyle=C.sel; ctx.lineWidth=1.6; ctx.setLineDash([5,4]);
      ctx.beginPath(); ctx.moveTo(H.corners[0][0],H.corners[0][1]);
      for(let i=1;i<4;i++) ctx.lineTo(H.corners[i][0],H.corners[i][1]);
      ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(H.c[0],H.c[1]); ctx.lineTo(H.rotate[0],H.rotate[1]); ctx.stroke();
      ctx.fillStyle=C.sel;
      ctx.beginPath(); ctx.arc(H.rotate[0],H.rotate[1],5.5,0,7); ctx.fill();      // rotate
      ctx.fillRect(H.scale[0]-5,H.scale[1]-5,10,10);                              // scale
      ctx.restore(); return;
    }
    ctx.save(); ctx.strokeStyle=C.sel; ctx.lineWidth=2; ctx.setLineDash([6,4]);
    const b=bounds(o.obj,o.kind);
    if(b){ const [x,y]=toScreen(b.x,b.y); ctx.strokeRect(x-4,y-4,b.w*wpx()+8,b.h*wpx()+8); }
    ctx.restore();
  }

  // ════════════════════════════════════════════════════════════════
  // GEOMETRY / HIT TESTING
  // ════════════════════════════════════════════════════════════════
  function bounds(o,kind){
    if(kind==="shape"){
      if(o.type==="rect") return {x:o.x,y:o.y,w:o.w,h:o.h};
      if(o.type==="circle") return {x:o.cx-o.r,y:o.cy-o.r,w:o.r*2,h:o.r*2};
      if(o.type==="polygon"){ const xs=o.pts.map(p=>p[0]),ys=o.pts.map(p=>p[1]);
        const x=Math.min(...xs),y=Math.min(...ys); return {x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y}; }
    }
    if(kind==="wall"){ const xs=[o.x1,o.x2], ys=[o.y1,o.y2];
      // a circular arc can bow outside the triangle of its 3 points — measure the samples
      if(o.cx!==undefined) for(const p of wallSamples(o)){ xs.push(p[0]); ys.push(p[1]); }
      const x=Math.min(...xs), y=Math.min(...ys); return {x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y}; }
    if(kind==="object") return objBox(o);
    if(kind==="door"){ const l=(o.len||1)/2+0.3; return {x:o.x-l,y:o.y-l,w:l*2,h:l*2}; }
    if(kind==="stair"){
      if(o.ax!==undefined){ const xs=[o.ax,o.bx,o.tx], ys=[o.ay,o.by,o.ty];
        const x=Math.min(...xs), y=Math.min(...ys); return {x,y,w:Math.max(...xs)-x, h:Math.max(...ys)-y}; }
      if(o.x1!==undefined){ const wm=(o.w||2)/2;
        return {x:Math.min(o.x1,o.x2)-wm,y:Math.min(o.y1,o.y2)-wm,w:Math.abs(o.x2-o.x1)+wm*2,h:Math.abs(o.y2-o.y1)+wm*2}; }
      return {x:o.x-(o.w||2)/2,y:o.y-(o.h||3)/2,w:(o.w||2),h:(o.h||3)}; }
    return null;
  }
  function pointInShape(wx,wy,sh){
    if(sh.type==="rect") return wx>=sh.x&&wx<=sh.x+sh.w&&wy>=sh.y&&wy<=sh.y+sh.h;
    if(sh.type==="circle") return Math.hypot(wx-sh.cx,wy-sh.cy)<=sh.r;
    if(sh.type==="polygon"){ let c=false,pts=sh.pts;
      for(let i=0,j=pts.length-1;i<pts.length;j=i++){
        if(((pts[i][1]>wy)!=(pts[j][1]>wy)) &&
           (wx<(pts[j][0]-pts[i][0])*(wy-pts[i][1])/(pts[j][1]-pts[i][1])+pts[i][0])) c=!c; }
      return c; }
    return false;
  }
  function distToSeg(px,py,x1,y1,x2,y2){
    const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;
    let t=l2?((px-x1)*dx+(py-y1)*dy)/l2:0; t=Math.max(0,Math.min(1,t));
    return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
  }
  // returns {kind,idx,obj} of topmost object under a world point
  function pointInTri(px,py, ax,ay, bx,by, cx,cy){
    const d1=(px-bx)*(ay-by)-(ax-bx)*(py-by);
    const d2=(px-cx)*(by-cy)-(bx-cx)*(py-cy);
    const d3=(px-ax)*(cy-ay)-(cx-ax)*(py-ay);
    const neg=(d1<0)||(d2<0)||(d3<0), pos=(d1>0)||(d2>0)||(d3>0);
    return !(neg&&pos);
  }
  function hitTest(wx,wy){
    // Objects are drawn last, so they're hit first. Test in the object's own
    // rotated frame rather than against its AABB.
    for(let i=(map.objects||[]).length-1;i>=0;i--){ const o=map.objects[i];
      const r=-(o.rot||0), c=Math.cos(r), sn=Math.sin(r);
      const dx=wx-o.x, dy=wy-o.y;
      const lx=dx*c-dy*sn, ly=dx*sn+dy*c;
      if(Math.abs(lx)<=(o.w||1)/2 && Math.abs(ly)<=(o.h||1)/2) return {kind:"object",idx:i,obj:o}; }
    for(let i=map.stairs.length-1;i>=0;i--){ const s=map.stairs[i];
      if(s.ax!==undefined){ if(pointInTri(wx,wy, s.ax,s.ay, s.bx,s.by, s.tx,s.ty)) return {kind:"stair",idx:i,obj:s}; }
      else if(s.x1!==undefined){ if(distToSeg(wx,wy,s.x1,s.y1,s.x2,s.y2)<=(s.w||2)/2+0.2) return {kind:"stair",idx:i,obj:s}; }
      else if(Math.abs(wx-s.x)<=(s.w||2)/2 && Math.abs(wy-s.y)<=(s.h||3)/2) return {kind:"stair",idx:i,obj:s}; }
    for(let i=map.doors.length-1;i>=0;i--){ const d=map.doors[i];
      if(Math.hypot(wx-d.x,wy-d.y)<=(d.len||1)/2+0.35) return {kind:"door",idx:i,obj:d}; }
    for(let i=map.walls.length-1;i>=0;i--){ const w=map.walls[i]; const tol=w.thin?0.28:0.4;
      if(w.cx===undefined||w.cy===undefined){ if(distToSeg(wx,wy,w.x1,w.y1,w.x2,w.y2)<=tol) return {kind:"wall",idx:i,obj:w}; }
      else { const s=wallSamples(w); for(let k=0;k<s.length-1;k++){ if(distToSeg(wx,wy,s[k][0],s[k][1],s[k+1][0],s[k+1][1])<=tol){ return {kind:"wall",idx:i,obj:w}; } } } }
    for(let i=map.shapes.length-1;i>=0;i--){ if(pointInShape(wx,wy,map.shapes[i]))
      return {kind:"shape",idx:i,obj:map.shapes[i]}; }
    return null;
  }
  let sel=null;                    // {kind,idx}
  let handle=null;                 // object scale/rotate handle drag
  function objAt(s){ const arr=({shape:map.shapes,wall:map.walls,door:map.doors,stair:map.stairs,object:map.objects})[s.kind];
    return arr&&arr[s.idx]?{kind:s.kind,obj:arr[s.idx]}:null; }

  // ════════════════════════════════════════════════════════════════
  // POINTER INTERACTION
  // ════════════════════════════════════════════════════════════════
  let dragStart=null, dragObj=null, panning=null, hoverPt=null, moved=false;
  // Touch: track active pointers so TWO fingers = pinch-zoom + two-finger pan.
  const pointers=new Map();        // pointerId → [screenX, screenY]
  let gesture=null;                // { d0, scale0, worldMid }
  function startPinch(){ const p=[...pointers.values()], a=p[0], b=p[1];
    const d0=Math.hypot(a[0]-b[0],a[1]-b[1])||1, mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    gesture={ d0, scale0:cam.scale, worldMid:toWorld(mid[0],mid[1]) }; }
  function updatePinch(){ const p=[...pointers.values()], a=p[0], b=p[1];
    const d=Math.hypot(a[0]-b[0],a[1]-b[1])||1, mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    cam.scale=Math.max(0.15,Math.min(6, gesture.scale0*(d/gesture.d0)));
    const wp=wpx();                                    // pin the start world-midpoint under the moving finger-midpoint
    cam.x=gesture.worldMid[0]-(mid[0]-W/2)/wp; cam.y=gesture.worldMid[1]-(mid[1]-H/2)/wp;
    render(); updateZoom(); }

  cv.addEventListener("pointerdown", e=>{
    cv.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, rel(e));
    // Second finger down → start a pinch/two-finger-pan gesture; abandon any
    // single-finger draft so a zoom never leaves a half-drawn shape.
    if(pointers.size===2){ draft=null; dragStart=null; dragObj=null; panning=null; hoverPt=null; startPinch(); render(); return; }
    if(pointers.size>2) return;
    const [sx,sy]=rel(e); const [wx,wy]=toWorld(sx,sy);
    moved=false;
    // middle mouse or space = pan; also pan in embed mode
    if(e.button===1 || e.button===2 || spaceDown || embed){ panning={sx,sy,cx:cam.x,cy:cam.y}; return; }
    if(embed) return;

    if(tool==="select"){
      // A selected object's handles take priority over anything under them.
      if(sel && sel.kind==="object"){
        const cur=objAt(sel);
        if(cur){ const H=objHandles(cur.obj), near=(p)=>Math.hypot(sx-p[0],sy-p[1])<12;
          if(near(H.scale) || near(H.rotate)){
            const o=cur.obj, ang=Math.atan2(wy-o.y, wx-o.x), d=Math.hypot(wx-o.x, wy-o.y);
            handle={mode:near(H.rotate)?"rotate":"scale", o, a0:ang, d0:Math.max(0.05,d),
                    rot0:o.rot||0, w0:o.w||1, h0:o.h||1, snap:objSnapshot({obj:o})};
            return; } } }
      const h=hitTest(wx,wy);
      if(h){ setSel({kind:h.kind,idx:h.idx});
        dragObj={h, ox:wx, oy:wy, snap:objSnapshot(h)}; }
      else { setSel(null); panning={sx,sy,cx:cam.x,cy:cam.y}; }   // drag empty space to pan (one-finger on touch)
      render(); return;
    }
    if(tool==="object"){ if(armedObj) placeObject(wx,wy,e.shiftKey); return; }
    if(tool==="erase"){ const h=hitTest(wx,wy); if(h){ pushHistory(); removeHit(h); commit(); } return; }
    if(tool==="polygon"){
      if(!polyPts) polyPts=[];
      const [gx,gy]=snapPt(wx,wy);
      if(polyPts.length>2 && Math.hypot(gx-polyPts[0][0],gy-polyPts[0][1])<0.6){ finishPolygon(); return; }
      polyPts.push([gx,gy]); render(); return;
    }
    if(tool==="door"||tool==="stair"||tool==="wall"){
      const lineTool = (tool==="wall");                   // wall snaps to the grid; door/stair to half-grid
      const gp = lineTool ? snapPt(wx,wy) : [snapHalf(wx),snapHalf(wy)];
      const need = tool==="door" ? 2 : 3;                 // door=2, stair/wall/shape=3 (3rd = curve)
      if(!placing){ placing={tool, pts:[gp], hover:gp.slice()}; render(); }
      else { placing.pts.push(gp); if(placing.pts.length>=need) commitPlacing(); else render(); }
      return;
    }
    // rect / circle / wall — start a drag
    dragStart=snapPt(wx,wy);
  });

  cv.addEventListener("pointermove", e=>{
    if(pointers.has(e.pointerId)) pointers.set(e.pointerId, rel(e));
    if(gesture){ if(pointers.size>=2) updatePinch(); return; }
    const [sx,sy]=rel(e); const [wx,wy]=toWorld(sx,sy);
    if(panning){ cam.x=panning.cx-(sx-panning.sx)/wpx(); cam.y=panning.cy-(sy-panning.sy)/wpx(); render(); return; }
    if(handle){
      const o=handle.o;
      if(handle.mode==="rotate"){
        let r=handle.rot0 + (Math.atan2(wy-o.y, wx-o.x) - handle.a0);
        if(snapOn) r=Math.round(r/(Math.PI/12))*(Math.PI/12);   // 15° steps while snap is on
        o.rot=r;
      } else {
        const f=Math.max(0.1, Math.hypot(wx-o.x, wy-o.y)/handle.d0);
        o.w=Math.max(0.1, handle.w0*f); o.h=Math.max(0.1, handle.h0*f);
      }
      moved=true; render(); return;
    }
    if(placing){ placing.hover = (placing.tool==="wall") ? snapPt(wx,wy) : [snapHalf(wx),snapHalf(wy)]; render(); return; }
    if(polyPts){ hoverPt=snapPt(wx,wy); render(); }
    if(dragObj){ moved=true; moveObj(dragObj, wx-dragObj.ox, wy-dragObj.oy); render(); return; }
    if(!dragStart) return;
    moved=true;
    const [gx,gy]=snapPt(wx,wy);
    if(tool==="rect") draft={type:"rect",x:Math.min(dragStart[0],gx),y:Math.min(dragStart[1],gy),
      w:Math.abs(gx-dragStart[0])||1,h:Math.abs(gy-dragStart[1])||1};
    // Circle radius snaps in HALF cells, so the diameter steps by whole squares and
    // the smallest circle you can draw is 1 square across (r = 0.5), not 2.
    else if(tool==="circle"){ const rr=Math.hypot(wx-dragStart[0],wy-dragStart[1]);
      const r=Math.max(0.5, snapOn? Math.round(rr*2)/2 : rr);
      draft={type:"circle",cx:dragStart[0],cy:dragStart[1],r}; }
    else if(tool==="wall") draft={kind:"wall",x1:dragStart[0],y1:dragStart[1],x2:gx,y2:gy};
    else if(tool==="stair"){ const hx=snapHalf(wx),hy=snapHalf(wy);
      draft={type:"rect",x:Math.min(dragStart[0],hx),y:Math.min(dragStart[1],hy),
             w:Math.abs(hx-dragStart[0])||1,h:Math.abs(hy-dragStart[1])||1}; }
    render();
  });

  cv.addEventListener("pointerup", e=>{
    pointers.delete(e.pointerId);
    if(gesture){ if(pointers.size<2){ gesture=null; panning=null; dragStart=null; draft=null; } return; }
    if(handle){ if(moved){ pushHistory(handle.snap); commit(); } handle=null; return; }
    if(panning){ panning=null; return; }
    if(dragObj){ if(moved){ pushHistory(dragObj.snap); commit(); } dragObj=null; return; }
    if(!dragStart){ return; }
    const [sx,sy]=rel(e); const [wx,wy]=toWorld(sx,sy);
    if(tool==="rect" && draft){ pushHistory(); draft.id=uid(); if(drawMode==="shapes") draft.deco=true;
      map.shapes.push(stampStyle(draft,"shape")); commit(); }
    else if(tool==="circle" && draft){ pushHistory(); draft.id=uid(); if(drawMode==="shapes") draft.deco=true;
      map.shapes.push(stampStyle(draft,"shape")); commit(); }
