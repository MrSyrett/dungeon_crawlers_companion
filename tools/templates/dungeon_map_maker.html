  }
  // How hard to feather each painted profile: enough that the edges aren't
  // vector-cut, little enough that the structure survives.
  const PROFILE_BLUR = { fire:0.9, swirl:1.4, caustic:0.7, spotted:1.5, energy:1.0, beam:1.1 };
  const LMASK_MAX = 192;        // per-light mask resolution cap (see drawLights)
  const lmaskCv = oc();
  function drawLights(){
    if(!map || !map.lit) return;          // works in classic mode too (v39)
    const lights=map.lights||[];
    const dark=Math.max(0, Math.min(1, map.darkness==null ? 0 : map.darkness));
    if(!lights.length && dark<=0) return;
    sizeBufs();
    const lc=buf.light.getContext("2d"), gc=buf.ltint.getContext("2d"), mc=lmaskCv.getContext("2d");
    for(let i=0;i<2;i++){ const c=[lc,gc][i];
      c.setTransform(1,0,0,1,0,0); c.globalAlpha=1; c.filter="none"; c.globalCompositeOperation="source-over"; }
    lc.clearRect(0,0,W,H); gc.clearRect(0,0,W,H);
    if(dark>0){ lc.fillStyle="rgba(5,7,13,"+dark+")"; lc.fillRect(0,0,W,H); }
    // Feather scales with zoom so shadows stay equally soft at any scale.
    const blur=Math.max(2.5, Math.min(22, 0.18*wpx()));
    let ux0=Infinity, uy0=Infinity, ux1=-Infinity, uy1=-Infinity;   // union of lit boxes
    for(let li=0; li<lights.length; li++){
      const L=lights[li]; if(L.on===false) continue;
      const R=Math.max(0.4, L.r||6);
      const a=Math.max(0, Math.min(1, L.bright==null ? 0.85 : L.bright));
      if(a<=0) continue;
      const cs=toScreen(L.x,L.y), cx=cs[0], cy=cs[1], rpx=R*wpx();
      // Everything stays inside the light's own box — a full-canvas pass per
      // light is the same trap that made the mixed-floor composite slow.
      const pad=blur*2+6;
      const bx=Math.max(0,Math.floor(cx-rpx-pad)), by=Math.max(0,Math.floor(cy-rpx-pad));
      const bw=Math.min(W,Math.ceil(cx+rpx+pad))-bx, bh=Math.min(H,Math.ceil(cy+rpx+pad))-by;
      if(bw<=0 || bh<=0) continue;                       // entirely off-screen
      // ⚠ PERF: the mask is a soft blob, so it is built at REDUCED resolution and
      // scaled back up. Canvas blur costs per pixel — a 540 px light box blurred
      // at full size was ~36 ms EACH (5 lights = 200 ms/frame); capped at 192 px
      // it is a few. Upscaling a blurred mask is visually free.
      const k=Math.min(1, LMASK_MAX/Math.max(bw,bh));
      const mw=Math.max(1,Math.round(bw*k)), mh=Math.max(1,Math.round(bh*k));
      if(lmaskCv.width!==mw || lmaskCv.height!==mh){ lmaskCv.width=mw; lmaskCv.height=mh; }
      else mc.clearRect(0,0,mw,mh);
      mc.setTransform(1,0,0,1,0,0); mc.globalAlpha=1; mc.globalCompositeOperation="source-over";
      // 1 — the visibility polygon, feathered into soft shadow edges
      const poly=visPoly(L);
      mc.save(); mc.filter="blur("+(blur*k).toFixed(2)+"px)"; mc.fillStyle="#fff"; mc.beginPath();
      for(let i=0;i<poly.length;i++){ const p=toScreen(poly[i][0],poly[i][1]);
        const mx=(p[0]-bx)*k, my=(p[1]-by)*k;
        if(i===0) mc.moveTo(mx,my); else mc.lineTo(mx,my); }
      mc.closePath(); mc.fill(); mc.restore();
      // 2 — multiply in the radial falloff
      mc.globalCompositeOperation="destination-in";
      const pat=patOf(L);
      if(PAINTED[pat]){
        // Painted profile — it carries angular structure a gradient cannot.
        lightProfile(mw, mh, (cx-bx)*k, (cy-by)*k, rpx*k, a, pat, (L.id||li)+1, L.rot||0, L.spread);
        mc.filter="blur("+(PROFILE_BLUR[pat]||1).toFixed(2)+"px)";
        mc.drawImage(lprofCv,0,0);
        mc.filter="none";
      } else {
        mc.fillStyle=lightFalloff(mc,(cx-bx)*k,(cy-by)*k,rpx*k,a,pat); mc.fillRect(0,0,mw,mh);
      }
      // 3 — punch the lit pool out of the darkness
      lc.globalCompositeOperation="destination-out";
      lc.drawImage(lmaskCv, 0,0,mw,mh, bx,by,bw,bh);
      lc.globalCompositeOperation="source-over";
      // 4 — recolour the same mask and accumulate it as additive tint
      mc.globalCompositeOperation="source-in";
      mc.fillStyle=L.color||"#ffb457"; mc.fillRect(0,0,mw,mh);
      mc.globalCompositeOperation="source-over";
      gc.globalCompositeOperation="lighter"; gc.globalAlpha=0.5;
      gc.drawImage(lmaskCv, 0,0,mw,mh, bx,by,bw,bh);
      gc.globalAlpha=1; gc.globalCompositeOperation="source-over";
      if(bx<ux0)ux0=bx; if(by<uy0)uy0=by;
      if(bx+bw>ux1)ux1=bx+bw; if(by+bh>uy1)uy1=by+bh;
    }
    if(dark>0){
      // A transparent PNG should not come back as a sheet of dark grey — keep
      // the wash inside the floors, which is the only thing being exported.
      if(noRock && map.shapes.length){
        lc.globalCompositeOperation="destination-in"; lc.drawImage(buf.mask,0,0);
        lc.globalCompositeOperation="source-over";
      }
      ctx.drawImage(buf.light,0,0);
    }
    // The tint only exists inside the lit boxes; compositing the rest is waste.
    if(ux1>ux0){ ctx.save(); ctx.globalCompositeOperation="lighter";
      ctx.drawImage(buf.ltint, ux0,uy0,ux1-ux0,uy1-uy0, ux0,uy0,ux1-ux0,uy1-uy0);
      ctx.restore(); }
  }
  function drawDotGrid(){ const p=wpx(); if(p<13) return; const go=gridOp(); if(go<=0) return;
    ctx.save(); ctx.fillStyle=C.dot; ctx.globalAlpha=.8*go;
    const [ox,oy]=toScreen(0,0); const r=Math.max(0.6,0.85*Math.min(2,cam.scale));
    for(let x=ox%p;x<W;x+=p) for(let y=oy%p;y<H;y+=p){ ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.fill(); }
    ctx.restore(); }

  function drawHatch(){ if(!hatchStrokes.length) return; ctx.save();
    ctx.strokeStyle=C.hatch; ctx.lineCap="round"; ctx.lineWidth=Math.max(0.8,1.05*cam.scale); ctx.globalAlpha=.5;
    ctx.beginPath();
    for(const s of hatchStrokes){ const [a,b]=toScreen(s[0],s[1]); const [c,d]=toScreen(s[2],s[3]);
      ctx.moveTo(a,b); ctx.lineTo(c,d); }
    ctx.stroke(); ctx.restore(); }

  // straight polyline through the actual contour vertices (used by the shadow)
  function strokeLoop(loop){ ctx.beginPath();
    for(let i=0;i<loop.length;i++){ const [sx,sy]=toScreen(loop[i][0],loop[i][1]);
      if(i===0) ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy); }
    ctx.stroke(); }

  // (Retired: the marching-squares drop shadow that went with buildGeometry().
  // It had no call site, but its NAME collided with the new drawWallInnerShadow
  // and hoisting made the dead copy win — see claude/map-maker-lights.md.)

  // A straight wall segment rendered as a FILLED ribbon whose centreline stays
  // exactly on the segment (no drift) but whose two long edges wander — the rough
  // marker/pen edge. Seeded by world position ⇒ stable. Used for interior walls.
  function roughSeg(c, aw, bw, halfW){
    const [ax,ay]=toScreen(aw[0],aw[1]), [bx,by]=toScreen(bw[0],bw[1]);
    const dx=bx-ax, dy=by-ay; const len=Math.hypot(dx,dy); if(len<0.5) return;
    const nx=-dy/len, ny=dx/len;
    const steps=Math.max(2, Math.round(len/Math.max(3,4*cam.scale)));
    c.beginPath();
    for(let k=0;k<=steps;k++){ const f=k/steps;
      const wx=aw[0]+(bw[0]-aw[0])*f, wy=aw[1]+(bw[1]-aw[1])*f;
      const amp=halfW*(0.7 + seeded(wx*29, wy*29)()*0.7);
      const px=ax+dx*f + nx*amp, py=ay+dy*f + ny*amp;
      if(k===0) c.moveTo(px,py); else c.lineTo(px,py);
    }
    for(let k=steps;k>=0;k--){ const f=k/steps;
      const wx=aw[0]+(bw[0]-aw[0])*f, wy=aw[1]+(bw[1]-aw[1])*f;
      const amp=halfW*(0.7 + seeded(wx*29+13, wy*29+7)()*0.7);
      const px=ax+dx*f - nx*amp, py=ay+dy*f - ny*amp;
      c.lineTo(px,py);
    }
    c.closePath(); c.fill();
    c.beginPath(); c.arc(ax,ay,halfW*1.02,0,6.2832); c.fill();
    c.beginPath(); c.arc(bx,by,halfW*1.02,0,6.2832); c.fill();
  }

  // A rough-edged ring around a closed world polyline. Densifies each edge, so
  // circles (sampled as real arcs) come out ROUND while rects stay crisp; both
  // get the wandering rough edge. Filled as an annulus (evenodd).
  function roughRing(c, pts, halfW){
    const dp=[]; const n=pts.length;
    for(let i=0;i<n;i++){ const a=pts[i], b=pts[(i+1)%n];
      const dx=b[0]-a[0], dy=b[1]-a[1]; const len=Math.hypot(dx,dy); if(len<1e-6) continue;
      const steps=Math.max(1, Math.round(len/0.16));
      for(let k=0;k<steps;k++){ const f=k/steps; dp.push([a[0]+dx*f, a[1]+dy*f]); } }
    const m=dp.length; if(m<3) return;
    const outer=[], inner=[];
    for(let i=0;i<m;i++){
      const p=dp[i], pa=dp[(i-1+m)%m], pb=dp[(i+1)%m];
      const ex=pb[0]-pa[0], ey=pb[1]-pa[1]; const l=Math.hypot(ex,ey)||1; const nx=-ey/l, ny=ex/l;
      const ao=halfW*(0.72 + seeded(p[0]*29, p[1]*29)()*0.66);
      const ai=halfW*(0.72 + seeded(p[0]*29+11, p[1]*29+5)()*0.66);
      const [sx,sy]=toScreen(p[0],p[1]);
      outer.push([sx+nx*ao, sy+ny*ao]); inner.push([sx-nx*ai, sy-ny*ai]);
    }
    c.beginPath();
    c.moveTo(outer[0][0],outer[0][1]); for(let i=1;i<m;i++) c.lineTo(outer[i][0],outer[i][1]); c.closePath();
    c.moveTo(inner[0][0],inner[0][1]); for(let i=1;i<m;i++) c.lineTo(inner[i][0],inner[i][1]); c.closePath();
    c.fill("evenodd");
  }
  // closed world outline for a shape (circle sampled as a true arc → round)
  function shapeOutline(sh){
    if(sh.type==="rect") return [[sh.x,sh.y],[sh.x+sh.w,sh.y],[sh.x+sh.w,sh.y+sh.h],[sh.x,sh.y+sh.h]];
    if(sh.type==="circle"){ const K=Math.max(28, Math.round(sh.r*8)); const o=[];
      for(let i=0;i<K;i++){ const a=i/K*Math.PI*2; o.push([sh.cx+Math.cos(a)*sh.r, sh.cy+Math.sin(a)*sh.r]); } return o; }
    if(sh.type==="polygon") return sh.pts.slice();
    return [];
  }
  // Shrink a closed polygon by `e` cells. Every EDGE slides along its own inward
  // normal and the neighbouring offset lines are re-intersected (mitre join,
  // bevelled once the corner gets too sharp to mitre sanely).
  //
  // This replaces a centroid pull — "drag every vertex `e` towards the middle" —
  // which is only right for a regular polygon. A long thin room inset unevenly,
  // and a CONCAVE outline (which every freehand cave is, in dozens of places)
  // inset *outwards* wherever the boundary bulged away from the centroid. Where
  // the offset over-runs a narrow neck the stray loop winds the other way and
  // cancels under the nonzero fill the callers already use.
  function insetPolyPts(pts, e){
    const n=pts.length; if(n<3) return null;
    let a2=0; for(let i=0;i<n;i++){ const q=pts[(i+1)%n]; a2 += pts[i][0]*q[1] - q[0]*pts[i][1]; }
    if(!a2) return null;
    const s = a2>0 ? 1 : -1;                       // which side of an edge is "inside"
    const N=[];                                    // unit inward normal per edge i → i+1
    for(let i=0;i<n;i++){ const a=pts[i], b=pts[(i+1)%n];
      const dx=b[0]-a[0], dy=b[1]-a[1], l=Math.hypot(dx,dy);
      N.push(l<1e-9 ? null : [s*(-dy/l), s*(dx/l)]); }
    const out=[];
    for(let i=0;i<n;i++){
      const n1=N[(i-1+n)%n], n2=N[i];              // the two edges meeting at vertex i
      const p=pts[i];
      if(!n1 || !n2){ const m=n1||n2; if(m) out.push([p[0]+m[0]*e, p[1]+m[1]*e]); continue; }
      const dot=n1[0]*n2[0]+n1[1]*n2[1];
      if(dot < -0.9){                              // a near-reversal: mitre runs to infinity
        out.push([p[0]+n1[0]*e, p[1]+n1[1]*e]);
        out.push([p[0]+n2[0]*e, p[1]+n2[1]*e]); continue; }
      const t = e/(1+dot);                         // (X−p)·n1 = (X−p)·n2 = e  along n1+n2
      out.push([p[0]+(n1[0]+n2[0])*t, p[1]+(n1[1]+n2[1])*t]);
    }
    return out;
  }
  // fill a shape's interior INSET inward by `e` (world units) onto ctx `c`
  function fillInsetShape(c, sh, e){
    if(sh.type==="rect"){ if(sh.w>2*e && sh.h>2*e){ const [x,y]=toScreen(sh.x+e, sh.y+e);
      c.fillRect(x, y, (sh.w-2*e)*wpx(), (sh.h-2*e)*wpx()); } }
    else if(sh.type==="circle"){ const rr=sh.r-e; if(rr>0){ const [x,y]=toScreen(sh.cx,sh.cy);
      c.beginPath(); c.arc(x,y, rr*wpx(), 0, 6.2832); c.fill(); } }
    else if(sh.type==="polygon"){ const q=insetPolyPts(sh.pts, e); if(!q) return;
      c.beginPath();
      for(let i=0;i<q.length;i++){ const [sx,sy]=toScreen(q[i][0], q[i][1]);

      c.closePath(); c.fill("nonzero"); }
  }

  // Walls = each room's true outline (round circles!) rendered rough, then the
  // union interior (eroded) is punched out so overlaps merge and corridor mouths
  // stay open — the classic no-internal-walls union, but with real curves.

  // ── textured walls (Advanced Mode) ────────────────────────────────
  // Per-object styling: a shape/wall may carry its own `floor`/`wall` texture id.
  //   undefined ⇒ inherit the map default (so a generated dungeon restyles wholesale)
  //   ""        ⇒ explicitly classic ink / parchment
  //   an id     ⇒ that texture, resolved through tex.byId
  function texOf(id, dflt){
    if(id===undefined || id===null) return dflt || null;
    if(id==="") return null;
    return (tex && tex.byId && tex.byId[id]) || null;
  }
  // `tex` is also handed in for OBJECT sprites alone — objects work in normal
  // mode, where floors/walls/background stay classic ink — so a non-null `tex`
  // no longer means "textured map". The host says which it is with `objectsOnly`.
  // Do NOT infer it from tex.floor/tex.wall being set: per-shape styling leaves
  // both empty on a fully textured map, and doors lose their wood leaf.
  function textured(){ return !!(tex && !tex.objectsOnly); }
  function shapeFloorTex(sh){ return tex ? texOf(sh.floor, tex.floor) : null; }
  function shapeWallTex(sh){  return tex ? texOf(sh.wall,  tex.wall)  : null; }

  // Wall half-thickness for a given wall texture, in SCREEN px. With no texture
  // this returns exactly the classic ink value, so classic stays byte-identical.
  // User-controllable grid opacity (map.gridOpacity, 0..1, default 1). It scales
  // BOTH the in-floor grid and the exterior dot grid, so the default of 1 leaves
  // the classic render untouched.
  function gridOp(){ const v = map && map.gridOpacity; return (v==null) ? 1 : Math.max(0, Math.min(1, v)); }
  // Screen-space bounding box of a group of shapes, clamped to the canvas.
  function runBox(list){
    let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
    for(const sh of list){ const b=bounds(sh,"shape"); if(!b) continue;
      const p=toScreen(b.x,b.y), q=toScreen(b.x+b.w,b.y+b.h);
      if(p[0]<x0)x0=p[0]; if(p[1]<y0)y0=p[1]; if(q[0]>x1)x1=q[0]; if(q[1]>y1)y1=q[1]; }
    if(!isFinite(x0)) return null;
    x0=Math.max(0,Math.floor(x0-6)); y0=Math.max(0,Math.floor(y0-6));
    x1=Math.min(W,Math.ceil(x1+6));  y1=Math.min(H,Math.ceil(y1+6));
    return (x1<=x0||y1<=y0) ? null : {x:x0,y:y0,w:x1-x0,h:y1-y0};
  }
  function halfPxFor(t){ return t ? Math.max(1, 0.5*(t.thick||0.4)*wpx()) : Math.max(1.3,1.7*cam.scale); }
  // …and in world cells, or 0 for classic ink (also used as a "textured?" test).
  function halfCellsFor(t){ return t ? 0.5*(t.thick||0.4) : 0; }
  function wallHalfPx(){ return halfPxFor(tex && tex.wall); }

  // How thick is the wall a door actually sits in? (nearest room outline). The
  // door LEAF no longer uses this — it is a fixed DOOR_HALF — but the OPENING
  // still cuts the full depth of the wall, so a door in a thick wall reads as a
  // real gap with the leaf hung in it. Memoised, rebuilt once per render.
  let doorHalf = null;
  function wallHalfCellsAt(d){
    if(!tex) return 0;
    if(!doorHalf){
      doorHalf = new Map();
      for(const dd of map.doors){
        let best=null, bd=Infinity;
        for(const sh of map.shapes){ if(sh.deco) continue;
          const o=shapeOutline(sh);
          for(let i=0;i<o.length;i++){ const a=o[i], b=o[(i+1)%o.length];
            const q=distToSeg(dd.x,dd.y,a[0],a[1],b[0],b[1]);
            if(q<bd){ bd=q; best=sh; } } }
        doorHalf.set(dd, halfCellsFor(best ? shapeWallTex(best) : (tex && tex.wall)));
      }
    }
    return doorHalf.get(d) || 0;
  }

  // Lay a wall strip along a world polyline. One rotated, clipped quad per
  // segment, with a running distance `s` so the texture flows continuously
  // around corners instead of restarting at every vertex. Each quad is extended
  // by the half-thickness at both ends, so neighbouring quads overlap and fill
  // the notch on the outside of a turn — no mitre maths needed.
  // Tiles alternate normal / mirrored: pack wall strips are NOT pixel-seamless
  // end-to-end (2MT's Dark strip differs by ~66/255 across the join), and
  // mirroring makes every repeat boundary exact by construction.
  // Insert points so no gap along a screen-space polyline exceeds `maxPx`. Used
  // to smooth curved interior walls for the strip renderer WITHOUT touching
  // wallSamples(), whose sampling the ink renderer's roughness is seeded from.
  function densify(pts, maxPx){
    const out=[]; const px=wpx();
    for(let i=0;i<pts.length-1;i++){
      const a=pts[i], b=pts[i+1];
      const d=Math.hypot(b[0]-a[0], b[1]-a[1])*px;
      const n=Math.max(1, Math.min(64, Math.ceil(d/maxPx)));
      for(let k=0;k<n;k++) out.push([a[0]+(b[0]-a[0])*k/n, a[1]+(b[1]-a[1])*k/n]);
    }
    out.push(pts[pts.length-1]);
    return out;
  }
  // A shape outline sampled by SCREEN arc length — a vertex roughly every 5 px —
  // so a round room's textured wall stays smooth at any zoom. The ink renderer
  // keeps shapeOutline()'s fixed sampling, so classic output is unchanged.
  function outlineDense(sh){
    if(sh.type!=="circle") return shapeOutline(sh);
    const K=Math.max(32, Math.min(400, Math.round(2*Math.PI*sh.r*wpx()/5)));
    const o=[];
    for(let i=0;i<K;i++){ const a=i/K*Math.PI*2; o.push([sh.cx+Math.cos(a)*sh.r, sh.cy+Math.sin(a)*sh.r]); }
    return o;
  }

  function stripPath(c, pts, closed, t, halfPx){
    if(!t || !t.img || !t.img.complete || !t.img.naturalWidth) return false;
    const P=pts.map(p=>toScreen(p[0],p[1]));
    let n=P.length;
    if(closed && n>1 && P[0][0]===P[n-1][0] && P[0][1]===P[n-1][1]){ P.pop(); n--; }
    if(n<2) return false;
    const segN = closed ? n : n-1;
    const dir=[], len=[];
    for(let i=0;i<segN;i++){
      const a=P[i], b=P[(i+1)%n];
      const dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy);
      dir.push(L>1e-6 ? [dx/L,dy/L] : null); len.push(L);
    }
    // MITRE JOINS. Each segment is clipped by the angle bisector at both ends, so
    // neighbouring quads tile the ribbon exactly — no notch on the outside of a
    // turn and no double-drawn overlap on the inside (the old code extended every
    // quad by the half-width and let them overlap, which left a visible mismatch
    // where the two rotations met). `k` is the cut line's slope in the segment's
    // own frame: local x = k*y, so the cut corners sit at (∓k·h, ∓h).
    const ML=4;                                     // miter limit, in half-widths
    // The mitre line through a vertex is the bisector of (−incoming) and
    // (outgoing) — one line, shared by both segments that meet there. `frame` is
    // the segment we're expressing it FOR, and it must be that segment's own
    // direction: a segment's END cut measured in the NEXT segment's frame comes
    // out sign-flipped (the frames differ by the turn angle), which cuts every
    // corner backwards — outer edge pulling back, inner edge overhanging.
    const cutK=(prev,next,frame)=>{
      if(!prev || !next) return 0;                  // open end ⇒ square cap
      let wx=next[0]-prev[0], wy=next[1]-prev[1];
      const wl=Math.hypot(wx,wy); if(wl<1e-6) return 0;
      wx/=wl; wy/=wl;
      const nx=-frame[1], ny=frame[0];
      const ly=wx*nx+wy*ny; if(Math.abs(ly)<1e-6) return 0;
      const k=(wx*frame[0]+wy*frame[1])/ly;
      return Math.max(-ML, Math.min(ML, k));
    };
    const tileW=Math.max(8,(t.tile||6)*wpx()), per=2*tileW;
    let s=0;
    for(let i=0;i<segN;i++){
      const u=dir[i], L=len[i];
      if(!u || L<0.01) continue;
      const prev = closed ? dir[(i-1+segN)%segN] : (i>0 ? dir[i-1] : null);
      const next = closed ? dir[(i+1)%segN]      : (i<segN-1 ? dir[i+1] : null);
      let kS=cutK(prev,u,u), kE=cutK(u,next,u);   // both in THIS segment's frame
      // Guard against a bow-tie when the segment is short relative to its cuts.
      const spread=Math.abs(kS-kE)*halfPx;
      if(spread > L*0.95 && spread>0){ const f=(L*0.95)/spread; kS*=f; kE*=f; }
      const h=halfPx, ext=(Math.abs(kS)+Math.abs(kE))*h+2;
      c.save();
      c.translate(P[i][0],P[i][1]); c.rotate(Math.atan2(u[1],u[0]));
      c.beginPath();
      c.moveTo(-kS*h,-h); c.lineTo(L-kE*h,-h); c.lineTo(L+kE*h,h); c.lineTo(kS*h,h);
      c.closePath(); c.clip();
      let x=-(s%per); while(x>-ext) x-=per;
      for(; x<L+ext; x+=per){
        c.drawImage(t.img, x, -h, tileW, 2*h);
        c.save(); c.translate(x+per,0); c.scale(-1,1);
        c.drawImage(t.img, 0, -h, tileW, 2*h); c.restore();
      }
      c.restore();
      s+=L;
    }
    return true;
  }

  function drawWalls(){
    if(!map.shapes.length) return;
    const wc=buf.wall.getContext("2d"); wc.setTransform(1,0,0,1,0,0); wc.clearRect(0,0,W,H);
    wc.globalCompositeOperation="source-over"; wc.fillStyle=C.ink;
    // Per-shape outlines (exact circles) stroked with THAT shape's wall texture,
    // then the inset-union erase below drops wall that lies inside another room —
    // same merge rule as the ink renderer.
    for(const sh of map.shapes){ if(sh.deco) continue;
      const wt=shapeWallTex(sh), hp=halfPxFor(wt);
      if(wt && stripPath(wc, outlineDense(sh), true, wt, hp)) continue;
      roughRing(wc, shapeOutline(sh), hp); }
    // Erase mask = union of each shape's fill INSET individually (not the eroded
    // union). A wall is removed only where it lies inside *another* shape's
    // interior (a real overlap). Two shapes that merely share an edge each inset
    // away from that edge, leaving a gap there, so the shared wall survives.
    const ec=buf.erode.getContext("2d"); ec.setTransform(1,0,0,1,0,0); ec.clearRect(0,0,W,H);
    ec.globalCompositeOperation="source-over"; ec.fillStyle="#fff";
    for(const sh of map.shapes){ if(sh.deco) continue;   // inset > that shape's own wall half-width
      fillInsetShape(ec, sh, (halfPxFor(shapeWallTex(sh))+1.4)/wpx()); }
    wc.globalCompositeOperation="destination-out"; wc.drawImage(buf.erode,0,0);
    for(const d of map.doors) punchDoorQuad(wc, d);   // opening cuts the full wall depth
    // soft drop shadow taken from the real wall shape (round under circles)
    if(!noRock){ const o=Math.min(2,cam.scale); ctx.save(); ctx.globalAlpha=.16;
      ctx.drawImage(buf.wall, 2.3*o, 2.9*o); ctx.restore(); }
    ctx.drawImage(buf.wall,0,0);
  }

  // Sample a curved wall into world points as a HALF-ELLIPSE: the chord is the full
  // major axis and the clicked apex sets the minor axis. `cx,cy` is stored
  // Bézier-style (C = 2Q − midpoint) so the apex is Q = (C + midpoint)/2.
  // Why an ellipse and not the circle through the 3 points: an ellipse leaves the
  // curve PERPENDICULAR to the chord at BOTH ends for any apex depth, so two
  // mirrored walls on the same two endpoints meet tangent-to-tangent and close into
  // one smooth oval — a half circle when the apex depth equals half the chord.
  function wallSamples(wl){
    const x1=wl.x1,y1=wl.y1,x2=wl.x2,y2=wl.y2;
    const mx=(x1+x2)/2, my=(y1+y2)/2;
    const qx=(wl.cx+mx)/2, qy=(wl.cy+my)/2;              // the apex the wall bows through
    const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy);
    if(L<1e-9) return [[x1,y1],[x2,y2]];
    const a=L/2, ux=dx/L, uy=dy/L, nx=-uy, ny=ux;        // semi-chord + unit chord/normal axes
    const h=(qx-mx)*nx + (qy-my)*ny;                     // signed apex depth (either side)
    if(Math.abs(h)<1e-9) return [[x1,y1],[x2,y2]];       // apex on the chord ⇒ straight
    // Half-ellipse: semi-axis `a` along the chord, `h` along the normal, swept
    // t = π → 0 so it runs start → apex → end.
    const N=Math.max(12, Math.min(160, Math.round((a+Math.abs(h))*14)));
    const pts=[];
    for(let i=0;i<=N;i++){ const t=Math.PI*(1-i/N), c=Math.cos(t), s=Math.sin(t);
      pts.push([mx + a*c*ux + h*s*nx, my + a*c*uy + h*s*ny]); }
    return pts;
  }
  // A rough-edged ribbon along an open world polyline (curved wall / shape line).
  function roughCurve(c, worldPts, halfW){
    const n=worldPts.length; if(n<2) return;
    const S=worldPts.map(p=>toScreen(p[0],p[1]));
    const top=[], bot=[];
    for(let i=0;i<n;i++){
      const a=S[Math.max(0,i-1)], b=S[Math.min(n-1,i+1)];
      const dx=b[0]-a[0], dy=b[1]-a[1]; const l=Math.hypot(dx,dy)||1; const nx=-dy/l, ny=dx/l;
      const w=worldPts[i];
      const at=halfW*(0.7+seeded(w[0]*29,w[1]*29)()*0.7), ab=halfW*(0.7+seeded(w[0]*29+13,w[1]*29+7)()*0.7);
      top.push([S[i][0]+nx*at, S[i][1]+ny*at]); bot.push([S[i][0]-nx*ab, S[i][1]-ny*ab]);
    }
    c.beginPath(); c.moveTo(top[0][0],top[0][1]);
    for(let i=1;i<n;i++) c.lineTo(top[i][0],top[i][1]);
    for(let i=n-1;i>=0;i--) c.lineTo(bot[i][0],bot[i][1]);
    c.closePath(); c.fill();
    c.beginPath(); c.arc(S[0][0],S[0][1],halfW*1.02,0,6.2832); c.fill();
    c.beginPath(); c.arc(S[n-1][0],S[n-1][1],halfW*1.02,0,6.2832); c.fill();
  }
  // The world polyline a wall actually follows. Three storage forms, oldest first:
  //   x1,y1 → x2,y2                straight span
  //   + cx,cy                      half-ellipse (legacy 3-click Wall tool)
  //   + pts[]                      an arbitrary chain — a freehand stroke that was
  //                                never closed, or an unclosed Polygon run
  // `pts` wins when present; x1/y1/x2/y2 stay in sync as its endpoints so hit
  // testing, bounds and every older reader keep working.
  function wallPts(wl){
    if(wl.pts && wl.pts.length>1) return wl.pts;
    return (wl.cx===undefined || wl.cy===undefined) ? [[wl.x1,wl.y1],[wl.x2,wl.y2]] : wallSamples(wl);
  }
  function drawInteriorWalls(){ if(!map.walls.length) return; ctx.save(); ctx.fillStyle=C.ink;
    const normal=Math.max(1.3,1.7*cam.scale), thin=Math.max(0.6,0.85*cam.scale);
    for(const wl of map.walls){
      const wt = tex ? texOf(wl.wall, tex.wall) : null;
      const pts = wallPts(wl);
      if(wt && stripPath(ctx, densify(pts,5), false, wt, halfPxFor(wt)*(wl.thin?0.5:1))) continue;
      const hw = wl.thin ? thin : normal;
      if(pts.length===2) roughSeg(ctx, pts[0], pts[1], hw);
      else roughCurve(ctx, pts, hw); }
    ctx.restore(); }

  // Interior "shapes" (deco: pillars, dais, tables, pits) — thin rough OUTLINES
  // on top of the floor. They add no floor, no rock wall, no interior punch; a
  // Circle-tool shape is a perfect round outline. shapeOutline samples arcs.
  // ── objects (Advanced Mode) ───────────────────────────────────────
  // map.objects[] = { id, tex, x, y, w, h, rot, flip }
  //   x,y = CENTRE in world cells · w,h = size in cells · rot = radians
  // Drawn last, on top of floors, walls, doors and stairs — a prop sits on the
  // map. Resolved through tex.byId like every other texture, so objects appear
  // only in Advanced Mode and classic output stays pure ink by construction.
  function drawObjects(){
    if(!tex || !map.objects || !map.objects.length) return;
    for(const o of map.objects){
      const t=texOf(o.tex, null);
      if(!t || !t.img || !t.img.complete || !t.img.naturalWidth) continue;
      const p=toScreen(o.x,o.y), w=(o.w||1)*wpx(), h=(o.h||1)*wpx();
      ctx.save();
      ctx.translate(p[0],p[1]);
      if(o.rot) ctx.rotate(o.rot);
      if(o.flip) ctx.scale(-1,1);
      const a=t.atlas;
      if(a) ctx.drawImage(t.img, a.x, a.y, a.w, a.h, -w/2, -h/2, w, h);  // bundled: atlas sub-rect
      else  ctx.drawImage(t.img, -w/2, -h/2, w, h);                      // imported: whole file
      ctx.restore();
    }
  }
  // World-space AABB of a (possibly rotated) object.
  function objBox(o){
    const hw=(o.w||1)/2, hh=(o.h||1)/2, r=o.rot||0, c=Math.cos(r), s=Math.sin(r);
    const xs=[], ys=[];
    for(const [dx,dy] of [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]]){
      xs.push(o.x+dx*c-dy*s); ys.push(o.y+dx*s+dy*c); }
    const x=Math.min.apply(null,xs), y=Math.min.apply(null,ys);
    return {x, y, w:Math.max.apply(null,xs)-x, h:Math.max.apply(null,ys)-y};
  }

  // A Shapes-mode outline follows the shape's WALL texture, at half thickness —
  // the same treatment the thin Wall tool gets, so a pillar or dais reads as a
  // thin course of the same masonry rather than an ink line on a textured map.
  // Falls back to the rough ink ring when there's no texture.
  function drawDecoRing(c, sh, inkHalf){
    const wt=shapeWallTex(sh);
    if(wt && stripPath(c, outlineDense(sh), true, wt, Math.max(1, halfPxFor(wt)*0.5))) return;
    roughRing(c, shapeOutline(sh), inkHalf);
  }

  function drawDecoShapes(){
    let any=false, floor=false;
    for(const s of map.shapes){ if(s.deco) any=true; else floor=true; }
    if(!any) return;
    const thin=Math.max(0.6,0.85*cam.scale);
    // No rooms at all ⇒ nothing to clip against, draw the outlines as-is.
    if(!floor){ ctx.save(); ctx.fillStyle=C.ink;
      for(const sh of map.shapes){ if(sh.deco) drawDecoRing(ctx, sh, thin); }
      ctx.restore(); return; }
    // Otherwise a deco shape is CLIPPED to the dungeon interior: draw the thin
    // outlines to a scratch buffer, then keep only the pixels that land on the
    // floor union (inset by the room-wall half-width, so an outline stops at the
    // wall's inner edge instead of bleeding across it). Half a circle placed on an
    // exterior wall therefore shows only the half that is inside the room.
    sizeBufs();
    const dc=buf.deco.getContext("2d"); dc.setTransform(1,0,0,1,0,0); dc.clearRect(0,0,W,H);
    dc.globalCompositeOperation="source-over"; dc.fillStyle=C.ink;
    for(const sh of map.shapes){ if(!sh.deco) continue; drawDecoRing(dc, sh, thin); }
    const cc=buf.decoClip.getContext("2d"); cc.setTransform(1,0,0,1,0,0); cc.clearRect(0,0,W,H);
    cc.globalCompositeOperation="source-over"; cc.fillStyle="#fff";
    for(const sh of map.shapes){ if(sh.deco) continue;
      fillInsetShape(cc, sh, (halfPxFor(shapeWallTex(sh))+1.4)/wpx()); }
    dc.globalCompositeOperation="destination-in"; dc.drawImage(buf.decoClip,0,0);
    ctx.drawImage(buf.deco,0,0); }

  // Doors: {x,y,a,len} — a is the wall direction; a thin leaf sits in the opening.
  // world-space frame for a door. `len` is the FULL span between the two
  // placement clicks (the stub tips); the rectangle is inset from the tips by
  // the stub length, so the clicked points are the tips of the connector stubs.
  // Door LEAF half-thickness, in world cells — CONSTANT. It deliberately does not
  // follow the wall it sits in: a 1.5-cell cave wall used to grow a door leaf five
  // times fatter than the same door in a railing. Only `len` varies now.
  const DOOR_HALF = 0.15;
  function doorGeom(d){
    const a=d.a||0, stub=0.13, hl=(d.len||1)/2;
    // `ht` = the leaf (drawDoor), FIXED. `wt` = how deep the opening is cut through
    // the wall (punchDoorQuad), which still tracks wall thickness so the doorway is
    // a real full-depth gap — the leaf just hangs in the middle of it.
    return { cx:d.x, cy:d.y, alx:Math.cos(a), aly:Math.sin(a), acx:-Math.sin(a), acy:Math.cos(a),
             hl, rhl:Math.max(0.12, hl-stub), ht:DOOR_HALF,
             wt:Math.max(DOOR_HALF, wallHalfCellsAt(d)), stub };   // hl=tip, rhl=rectangle half-length, ht=leaf half thickness
  }
  // Clear the wall ONLY under the rectangle + the thin stub lines — everything
  // else in the door's footprint stays transparent so the walls aren't cut off.
  function punchDoorQuad(wc, d){
    const g=doorGeom(d);
    const rect=(sl0,sl1,st)=>{ const c=(sl,s)=>toScreen(g.cx+g.alx*sl+g.acx*s, g.cy+g.aly*sl+g.acy*s);
      const p1=c(sl0,-st),p2=c(sl1,-st),p3=c(sl1,st),p4=c(sl0,st);
      wc.beginPath(); wc.moveTo(p1[0],p1[1]); wc.lineTo(p2[0],p2[1]); wc.lineTo(p3[0],p3[1]); wc.lineTo(p4[0],p4[1]); wc.closePath(); wc.fill(); };
    rect(-g.rhl, g.rhl, g.wt*1.1);                       // the rectangle opening (cut through the FULL wall)
    const sh=Math.max(0.05, wallHalfCellsAt(d) || (1.7*cam.scale)/wpx());      // stub strip ≈ the stub line's width
    rect(-g.hl, -g.rhl, sh);                              // left stub
    rect( g.rhl, g.hl, sh);                               // right stub
  }
  // Door = a filled leaf RECTANGLE (rough outline, all four sides), inset from the
  // stub tips, with a short wall-connector stub out of the CENTRE of each short
  // side reaching to the tips (which are the placement start/end points).
  function drawDoor(d){
    const g=doorGeom(d), halfW=Math.max(1.1,1.5*cam.scale);
    const w=(sl,st)=>[g.cx+g.alx*sl+g.acx*st, g.cy+g.aly*sl+g.acy*st];
    const s=(sl,st)=>toScreen(g.cx+g.alx*sl+g.acx*st, g.cy+g.aly*sl+g.acy*st);
    ctx.save();
    // filled leaf interior (outside the rectangle stays transparent)
    const A=s(-g.rhl,-g.ht),B=s(g.rhl,-g.ht),C2=s(g.rhl,g.ht),D=s(-g.rhl,g.ht);
    // Advanced Mode gets a wood-brown leaf; the near-white classic fill reads as a
    // hole punched in the wall once everything around it is textured stone.
    // `tex` is only set in textured mode, so classic output is untouched.
    ctx.fillStyle = textured() ? C.doorWood : C.doorFill;
    ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.lineTo(C2[0],C2[1]); ctx.lineTo(D[0],D[1]); ctx.closePath(); ctx.fill();
    // rough black rectangle outline + centre stubs reaching to the tips
    ctx.fillStyle=C.ink;
    roughSeg(ctx, w(-g.rhl,-g.ht), w( g.rhl,-g.ht), halfW);   // long side
    roughSeg(ctx, w(-g.rhl, g.ht), w( g.rhl, g.ht), halfW);   // long side
    roughSeg(ctx, w(-g.rhl,-g.ht), w(-g.rhl, g.ht), halfW);   // short side
    roughSeg(ctx, w( g.rhl,-g.ht), w( g.rhl, g.ht), halfW);   // short side
    roughSeg(ctx, w(-g.rhl,0), w(-g.hl,0), halfW);            // left stub → tip
    roughSeg(ctx, w( g.rhl,0), w( g.hl,0), halfW);            // right stub → tip
    ctx.restore();
  }

  // Stairs = a triangle of rough rungs. base A→B is the wide starting edge, tip is
  // the apex; each rung runs parallel to the base and tapers in length toward the
  // tip. ~5–6 rungs per cell of run; rungs share the walls' rough-edge look.
  function drawStair(s){
    let a,b,tip;
    if(s.ax!==undefined){ a=[s.ax,s.ay]; b=[s.bx,s.by]; tip=[s.tx,s.ty]; }
    else if(s.x1!==undefined){                          // back-compat: old run+width schema
      const dx=s.x2-s.x1, dy=s.y2-s.y1, len=Math.hypot(dx,dy)||1, nx=-dy/len, ny=dx/len, hw=(s.w||2)/2;
      a=[s.x1+nx*hw, s.y1+ny*hw]; b=[s.x1-nx*hw, s.y1-ny*hw]; tip=[s.x2,s.y2];
    } else return;
    const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
    const travel=Math.hypot(tip[0]-mx, tip[1]-my);
    const steps=Math.max(2, Math.round(travel/0.18));   // ~5–6 rungs per cell of run
    const halfW=Math.max(0.7,1.0*cam.scale);
    ctx.save(); ctx.fillStyle=C.ink;
    for(let i=0;i<=steps;i++){ const t=i/steps;
      const la=[a[0]+(tip[0]-a[0])*t, a[1]+(tip[1]-a[1])*t];
      const lb=[b[0]+(tip[0]-b[0])*t, b[1]+(tip[1]-b[1])*t];
      if(Math.hypot(lb[0]-la[0], lb[1]-la[1])<0.06) continue;   // skip degenerate rung at the tip
      roughSeg(ctx, la, lb, halfW);
    }
    ctx.restore(); }

  // ── live tool preview ─────────────────────────────────────────────
  let draft = null;        // in-progress shape while dragging
  let polyPts = null;      // polygon vertices being placed
  let placing = null;      // {tool,start,end} — click-move-click door/stair
  let stroke = null;       // raw freehand points (world cells, never snapped)
  // How close the end of a gesture has to come to its start before it counts as
  // "closed". A cave is drawn fast and sloppily, so this is generous — a full
  // grid square — and the preview shows a filled start dot the moment you're
  // inside it, so there is never any doubt which of the two you're about to get.
  const CLOSE_CELLS = 1.0;
  function drawPreview(){
    ctx.save(); ctx.globalAlpha=.85;
    if(draft){
      ctx.setLineDash([5,4]); ctx.strokeStyle=C.sel; ctx.lineWidth=1.6; ctx.beginPath();
      if(draft.kind==="wall"){ const [a,b]=toScreen(draft.x1,draft.y1),[c,d]=toScreen(draft.x2,draft.y2);
        ctx.moveTo(a,b); ctx.lineTo(c,d); }
      else shapePath(ctx, draft);
      ctx.stroke(); ctx.setLineDash([]);
    }
    if(placing){
      const pts=placing.pts, hv=placing.hover;
      const dash=(a,b)=>{ if(!a||!b) return; const [ax,ay]=toScreen(a[0],a[1]),[bx,by]=toScreen(b[0],b[1]);
        ctx.save(); ctx.setLineDash([4,4]); ctx.strokeStyle=C.sel; ctx.lineWidth=1.2;
        ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke(); ctx.restore(); };
      if(placing.tool==="door"){
        const end=pts[1]||hv; if(end) drawDoor(doorFromPts(pts[0], end)); dash(pts[0], end);
      } else if(placing.tool==="wall"){
        const thinMode=(drawMode==="shapes");
        if(pts.length===1){ dash(pts[0], hv); }                        // dragging out the straight span
        else if(pts.length===2){                                       // span fixed, aiming the curve apex
          const wl=wallFromPts(pts[0], pts[1], hv, thinMode);
          if(wl){ ctx.save(); ctx.fillStyle=C.ink; const hw = thinMode ? Math.max(0.6,0.85*cam.scale) : Math.max(1.3,1.7*cam.scale);
            if(wl.cx===undefined) roughSeg(ctx,[wl.x1,wl.y1],[wl.x2,wl.y2],hw); else roughCurve(ctx, wallSamples(wl), hw); ctx.restore(); }
          dash([(pts[0][0]+pts[1][0])/2,(pts[0][1]+pts[1][1])/2], hv); // handle from chord midpoint to the apex
        }
      } else {
        if(pts.length===1){ dash(pts[0], hv); }                        // setting the width edge
        else if(pts.length===2){ const g=stairFromPts(pts[0], pts[1], hv);
          if(g) drawStair(g); dash(pts[0], pts[1]); }                  // base edge fixed, aiming the tip
      }
      ctx.fillStyle=C.sel;
      for(const p of pts){ const [sx,sy]=toScreen(p[0],p[1]); ctx.beginPath(); ctx.arc(sx,sy,3.5,0,7); ctx.fill(); }
    }
    if(polyPts && polyPts.length){
      ctx.strokeStyle=C.sel; ctx.fillStyle="rgba(201,169,74,.15)"; ctx.lineWidth=1.6;
      ctx.beginPath(); const [x0,y0]=toScreen(polyPts[0][0],polyPts[0][1]); ctx.moveTo(x0,y0);
      for(let i=1;i<polyPts.length;i++){ const [x,y]=toScreen(polyPts[i][0],polyPts[i][1]); ctx.lineTo(x,y); }
      if(hoverPt){ const [hx,hy]=toScreen(hoverPt[0],hoverPt[1]); ctx.lineTo(hx,hy); }
      ctx.stroke();
      for(const pt of polyPts){ const [x,y]=toScreen(pt[0],pt[1]);
        ctx.fillStyle=C.sel; ctx.beginPath(); ctx.arc(x,y,3.5,0,7); ctx.fill(); }
      // Closing is now a real fork — click the first point for a ROOM, Enter or
      // double-click anywhere else for an open WALL — so say which one is armed.
      if(polyPts.length>2 && hoverPt &&
         Math.hypot(hoverPt[0]-polyPts[0][0], hoverPt[1]-polyPts[0][1])<0.6){
        ctx.fillStyle=C.sel; ctx.beginPath(); ctx.arc(x0,y0,7.5,0,7); ctx.fill();
        ctx.strokeStyle="rgba(255,255,255,.85)"; ctx.lineWidth=1.4; ctx.stroke();
      }
    }
    // The armed palette object rides the cursor, so you can see how big it is and
    // which way round it is BEFORE dropping it. texGet() also hydrates an imported
    // sprite's blob URL on first sight and re-renders, so the ghost appears for
    // pack art that has never been placed.
    if(tool==="object" && armedObj && ghostPt){
      const base=texReg.get(armedObj);
      if(base){
        const w=(base.w||1)*armScale*wpx(), h=(base.h||1)*armScale*wpx();
        const g=toScreen(ghostPt[0], ghostPt[1]);
        const t=texGet(armedObj);
        ctx.save(); ctx.translate(g[0],g[1]); if(armRot) ctx.rotate(armRot);
        if(t && t.img && t.img.complete && t.img.naturalWidth){
          ctx.globalAlpha=0.62;
          ctx.save(); if(armFlip) ctx.scale(-1,1);
          const a=t.atlas;
          if(a) ctx.drawImage(t.img, a.x, a.y, a.w, a.h, -w/2, -h/2, w, h);
          else  ctx.drawImage(t.img, -w/2, -h/2, w, h);
          ctx.restore();
          ctx.globalAlpha=1;
        }
        ctx.setLineDash([5,4]); ctx.strokeStyle=C.sel; ctx.lineWidth=1.4;
        ctx.strokeRect(-w/2,-h/2,w,h); ctx.setLineDash([]);
        ctx.restore();
      }
    }
    if(stroke && stroke.length>1){
      const S=stroke.map(p=>toScreen(p[0],p[1]));
      const last=stroke[stroke.length-1];
      const willClose = stroke.length>6 &&
        Math.hypot(last[0]-stroke[0][0], last[1]-stroke[0][1])<=CLOSE_CELLS;
      ctx.lineJoin="round"; ctx.lineCap="round"; ctx.lineWidth=2.2; ctx.strokeStyle=C.sel;
      ctx.beginPath(); ctx.moveTo(S[0][0],S[0][1]);
      for(let i=1;i<S.length;i++) ctx.lineTo(S[i][0],S[i][1]);
      if(willClose){ ctx.closePath(); ctx.fillStyle="rgba(201,169,74,.18)"; ctx.fill(); }
      ctx.stroke();
      ctx.beginPath(); ctx.arc(S[0][0],S[0][1], willClose?7.5:4.5, 0, 7);
      if(willClose){ ctx.fillStyle=C.sel; ctx.fill();
        ctx.strokeStyle="rgba(255,255,255,.85)"; ctx.lineWidth=1.4; ctx.stroke(); }
      else ctx.stroke();
    }
    ctx.restore();
  }
  // Screen positions of an object's outline and its two drag handles.
  // Lights get a rotate handle only — no scale grip, because radius is a
  // half-square slider and a free drag would land between the steps.
  function lightHandle(L){
    const p=toScreen(L.x,L.y), rp=Math.max(1,(L.r||2))*wpx(), a=L.rot||0;
    const d=rp+20;
    return [p[0]+Math.cos(a)*d, p[1]+Math.sin(a)*d];
  }
  function objHandles(o){
    const c=toScreen(o.x,o.y), s=wpx(), r=o.rot||0;
    const hw=(o.w||1)*s/2, hh=(o.h||1)*s/2, co=Math.cos(r), si=Math.sin(r);
    const P=(x,y)=>[c[0]+x*co-y*si, c[1]+x*si+y*co];
    return { c, hw, hh,
             corners:[P(-hw,-hh),P(hw,-hh),P(hw,hh),P(-hw,hh)],
             scale:P(hw,hh), rotate:P(0,-hh-22) };
  }
  // Lights are invisible geometry — only their effect shows — so mark each one
  // with a dot on screen. Drawn from render()'s overlay pass, which is skipped
  // while exporting, so markers never reach a PNG.
  function drawLightMarkers(){
    if(!map.lit) return;
    const ls=map.lights||[]; if(!ls.length) return;
    ctx.save();
    for(const L of ls){
      const p=toScreen(L.x,L.y);
      ctx.beginPath(); ctx.arc(p[0],p[1],5,0,6.2832);
      ctx.fillStyle=L.color||"#ffb457"; ctx.fill();
      ctx.lineWidth=1.5; ctx.strokeStyle="rgba(0,0,0,.7)"; ctx.stroke();
    }
    ctx.restore();
  }
  function drawSelection(){
    if(sel==null) return;
    const o=objAt(sel);
    if(!o) return;
    if(o.kind==="light"){
      const L=o.obj, p=toScreen(L.x,L.y), rp=Math.max(1,(L.r||6))*wpx();
      const h=lightHandle(L);
      ctx.save(); ctx.strokeStyle=C.sel; ctx.lineWidth=1.6; ctx.setLineDash([6,5]);
      ctx.beginPath(); ctx.arc(p[0],p[1],rp,0,6.2832); ctx.stroke();      // reach
      ctx.setLineDash([]); ctx.beginPath(); ctx.arc(p[0],p[1],8,0,6.2832); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(h[0],h[1]); ctx.stroke();
      ctx.fillStyle=C.sel; ctx.beginPath(); ctx.arc(h[0],h[1],5.5,0,6.2832); ctx.fill();
      ctx.restore(); return;
    }
    if(o.kind==="object" || o.kind==="shadow"){
      const H=objHandles(o.obj);
      ctx.save(); ctx.strokeStyle=C.sel; ctx.lineWidth=1.6; ctx.setLineDash([5,4]);
      ctx.beginPath(); ctx.moveTo(H.corners[0][0],H.corners[0][1]);
      for(let i=1;i<4;i++) ctx.lineTo(H.corners[i][0],H.corners[i][1]);
      ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(H.c[0],H.c[1]); ctx.lineTo(H.rotate[0],H.rotate[1]); ctx.stroke();
      ctx.fillStyle=C.sel;
      ctx.beginPath(); ctx.arc(H.rotate[0],H.rotate[1],5.5,0,7); ctx.fill();      // rotate
      ctx.fillRect(H.scale[0]-5,H.scale[1]-5,10,10);                              // scale
      ctx.restore(); return;
    }
    ctx.save(); ctx.strokeStyle=C.sel; ctx.lineWidth=2; ctx.setLineDash([6,4]);
    const b=bounds(o.obj,o.kind);
    if(b){ const [x,y]=toScreen(b.x,b.y); ctx.strokeRect(x-4,y-4,b.w*wpx()+8,b.h*wpx()+8); }
    ctx.restore();
  }

  // ════════════════════════════════════════════════════════════════
  // GEOMETRY / HIT TESTING
  // ════════════════════════════════════════════════════════════════
  function bounds(o,kind){
    if(kind==="shape"){
      if(o.type==="rect") return {x:o.x,y:o.y,w:o.w,h:o.h};
      if(o.type==="circle") return {x:o.cx-o.r,y:o.cy-o.r,w:o.r*2,h:o.r*2};
      if(o.type==="polygon"){ const xs=o.pts.map(p=>p[0]),ys=o.pts.map(p=>p[1]);
        const x=Math.min(...xs),y=Math.min(...ys); return {x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y}; }
    }
    if(kind==="wall"){ const xs=[], ys=[];
      // an arc bows outside the triangle of its 3 points and a freehand chain
      // goes wherever it likes — measure the polyline, not the endpoints
      for(const p of wallPts(o)){ xs.push(p[0]); ys.push(p[1]); }
      const x=Math.min(...xs), y=Math.min(...ys); return {x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y}; }
    if(kind==="object" || kind==="shadow") return objBox(o);
    if(kind==="door"){ const l=(o.len||1)/2+0.3; return {x:o.x-l,y:o.y-l,w:l*2,h:l*2}; }
    if(kind==="light") return {x:o.x-0.4,y:o.y-0.4,w:0.8,h:0.8};
    if(kind==="stair"){
      if(o.ax!==undefined){ const xs=[o.ax,o.bx,o.tx], ys=[o.ay,o.by,o.ty];
        const x=Math.min(...xs), y=Math.min(...ys); return {x,y,w:Math.max(...xs)-x, h:Math.max(...ys)-y}; }
      if(o.x1!==undefined){ const wm=(o.w||2)/2;
        return {x:Math.min(o.x1,o.x2)-wm,y:Math.min(o.y1,o.y2)-wm,w:Math.abs(o.x2-o.x1)+wm*2,h:Math.abs(o.y2-o.y1)+wm*2}; }
      return {x:o.x-(o.w||2)/2,y:o.y-(o.h||3)/2,w:(o.w||2),h:(o.h||3)}; }
    return null;
  }
  function pointInShape(wx,wy,sh){
    if(sh.type==="rect") return wx>=sh.x&&wx<=sh.x+sh.w&&wy>=sh.y&&wy<=sh.y+sh.h;
    if(sh.type==="circle") return Math.hypot(wx-sh.cx,wy-sh.cy)<=sh.r;
    if(sh.type==="polygon"){ let c=false,pts=sh.pts;
      for(let i=0,j=pts.length-1;i<pts.length;j=i++){
        if(((pts[i][1]>wy)!=(pts[j][1]>wy)) &&
           (wx<(pts[j][0]-pts[i][0])*(wy-pts[i][1])/(pts[j][1]-pts[i][1])+pts[i][0])) c=!c; }
      return c; }
    return false;
  }
  function distToSeg(px,py,x1,y1,x2,y2){
    const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;
    let t=l2?((px-x1)*dx+(py-y1)*dy)/l2:0; t=Math.max(0,Math.min(1,t));
    return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
  }
  // returns {kind,idx,obj} of topmost object under a world point
  function pointInTri(px,py, ax,ay, bx,by, cx,cy){
    const d1=(px-bx)*(ay-by)-(ax-bx)*(py-by);
    const d2=(px-cx)*(by-cy)-(bx-cx)*(py-cy);
    const d3=(px-ax)*(cy-ay)-(cx-ax)*(py-ay);
    const neg=(d1<0)||(d2<0)||(d3<0), pos=(d1>0)||(d2>0)||(d3>0);
    return !(neg&&pos);
  }
  function hitTest(wx,wy){
    // Lights composite over the whole map, so they take the click first. The
    // tolerance is in SCREEN px so a light stays grabbable at any zoom.
    if(map.lit) for(let i=(map.lights||[]).length-1;i>=0;i--){ const L=map.lights[i];
      if(Math.hypot(wx-L.x,wy-L.y) <= Math.max(0.3, 10/wpx())) return {kind:"light",idx:i,obj:L}; }
    // Objects are drawn last, so they're hit first. Test in the object's own
    // rotated frame rather than against its AABB.
    for(let i=(map.objects||[]).length-1;i>=0;i--){ const o=map.objects[i];
      const r=-(o.rot||0), c=Math.cos(r), sn=Math.sin(r);
      const dx=wx-o.x, dy=wy-o.y;
      const lx=dx*c-dy*sn, ly=dx*sn+dy*c;
      if(Math.abs(lx)<=(o.w||1)/2 && Math.abs(ly)<=(o.h||1)/2) return {kind:"object",idx:i,obj:o}; }
    // Shadows sit UNDER the objects, so the object on top wins the click. Tested
    // as a true ellipse in the shadow's own rotated frame.
    for(let i=(map.shadows||[]).length-1;i>=0;i--){ const sd=map.shadows[i];
      const r=-(sd.rot||0), c=Math.cos(r), sn=Math.sin(r);
      const dx=wx-sd.x, dy=wy-sd.y;
      const lx=(dx*c-dy*sn)/Math.max(0.05,(sd.w||1.6)/2), ly=(dx*sn+dy*c)/Math.max(0.05,(sd.h||1.1)/2);
      if(lx*lx+ly*ly<=1) return {kind:"shadow",idx:i,obj:sd}; }
    for(let i=map.stairs.length-1;i>=0;i--){ const s=map.stairs[i];
      if(s.ax!==undefined){ if(pointInTri(wx,wy, s.ax,s.ay, s.bx,s.by, s.tx,s.ty)) return {kind:"stair",idx:i,obj:s}; }
      else if(s.x1!==undefined){ if(distToSeg(wx,wy,s.x1,s.y1,s.x2,s.y2)<=(s.w||2)/2+0.2) return {kind:"stair",idx:i,obj:s}; }
      else if(Math.abs(wx-s.x)<=(s.w||2)/2 && Math.abs(wy-s.y)<=(s.h||3)/2) return {kind:"stair",idx:i,obj:s}; }
    for(let i=map.doors.length-1;i>=0;i--){ const d=map.doors[i];
      if(Math.hypot(wx-d.x,wy-d.y)<=(d.len||1)/2+0.35) return {kind:"door",idx:i,obj:d}; }
    for(let i=map.walls.length-1;i>=0;i--){ const w=map.walls[i]; const tol=w.thin?0.28:0.4;
      const s=wallPts(w);
      for(let k=0;k<s.length-1;k++){ if(distToSeg(wx,wy,s[k][0],s[k][1],s[k+1][0],s[k+1][1])<=tol) return {kind:"wall",idx:i,obj:w}; } }
    for(let i=map.shapes.length-1;i>=0;i--){ if(pointInShape(wx,wy,map.shapes[i]))
      return {kind:"shape",idx:i,obj:map.shapes[i]}; }
    return null;
  }
  let sel=null;                    // {kind,idx}
  let handle=null;                 // object scale/rotate handle drag
  function objAt(s){ const arr=({shape:map.shapes,wall:map.walls,door:map.doors,stair:map.stairs,object:map.objects,light:map.lights,shadow:map.shadows})[s.kind];
    return arr&&arr[s.idx]?{kind:s.kind,obj:arr[s.idx]}:null; }

  // ════════════════════════════════════════════════════════════════
  // POINTER INTERACTION
  // ════════════════════════════════════════════════════════════════
  let dragStart=null, dragObj=null, panning=null, hoverPt=null, moved=false;
  // Touch: track active pointers so TWO fingers = pinch-zoom + two-finger pan.
  const pointers=new Map();        // pointerId → [screenX, screenY]
  let gesture=null;                // { d0, scale0, worldMid }
  function startPinch(){ const p=[...pointers.values()], a=p[0], b=p[1];
    const d0=Math.hypot(a[0]-b[0],a[1]-b[1])||1, mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    stroke=null;                     // a second finger means "zoom", not "keep tracing"
    gesture={ d0, scale0:cam.scale, worldMid:toWorld(mid[0],mid[1]) }; }
  function updatePinch(){ const p=[...pointers.values()], a=p[0], b=p[1];
    const d=Math.hypot(a[0]-b[0],a[1]-b[1])||1, mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    cam.scale=Math.max(0.15,Math.min(6, gesture.scale0*(d/gesture.d0)));
    const wp=wpx();                                    // pin the start world-midpoint under the moving finger-midpoint
    cam.x=gesture.worldMid[0]-(mid[0]-W/2)/wp; cam.y=gesture.worldMid[1]-(mid[1]-H/2)/wp;
    render(); updateZoom(); }

  cv.addEventListener("pointerdown", e=>{
    cv.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, rel(e));
    // Second finger down → start a pinch/two-finger-pan gesture; abandon any
    // single-finger draft so a zoom never leaves a half-drawn shape.
    if(pointers.size===2){ draft=null; dragStart=null; dragObj=null; panning=null; hoverPt=null; startPinch(); render(); return; }
    if(pointers.size>2) return;
    const [sx,sy]=rel(e); const [wx,wy]=toWorld(sx,sy);
    moved=false;
    // middle mouse or space = pan; also pan in embed mode
    if(e.button===1 || e.button===2 || spaceDown || embed){ panning={sx,sy,cx:cam.x,cy:cam.y}; return; }
    if(embed) return;

    if(tool==="select"){
      // A selected object's handles take priority over anything under them.
      if(sel && sel.kind==="light"){
        const cur=objAt(sel);
        if(cur){ const hp=lightHandle(cur.obj);
          if(Math.hypot(sx-hp[0], sy-hp[1])<13){
            const o=cur.obj;
            handle={mode:"rotate", o, a0:Math.atan2(wy-o.y, wx-o.x), d0:1,
                    rot0:o.rot||0, w0:1, h0:1, snap:objSnapshot({obj:o})};
            return; } } }
      if(sel && (sel.kind==="object" || sel.kind==="shadow")){
        const cur=objAt(sel);
        if(cur){ const H=objHandles(cur.obj), near=(p)=>Math.hypot(sx-p[0],sy-p[1])<12;
          if(near(H.scale) || near(H.rotate)){
            const o=cur.obj, ang=Math.atan2(wy-o.y, wx-o.x), d=Math.hypot(wx-o.x, wy-o.y);
            handle={mode:near(H.rotate)?"rotate":"scale", o, a0:ang, d0:Math.max(0.05,d),
                    rot0:o.rot||0, w0:o.w||1, h0:o.h||1, snap:objSnapshot({obj:o})};
            return; } } }
      const h=hitTest(wx,wy);
      if(h){ setSel({kind:h.kind,idx:h.idx});
        dragObj={h, ox:wx, oy:wy, snap:objSnapshot(h)}; }
      else { setSel(null); panning={sx,sy,cx:cam.x,cy:cam.y}; }   // drag empty space to pan (one-finger on touch)
      render(); return;
    }
    if(tool==="object"){ if(armedObj) placeObject(wx,wy,e.shiftKey); return; }
    if(tool==="light"){ placeLight(wx,wy,e.shiftKey); return; }
    if(tool==="shadow"){ placeShadow(wx,wy,e.shiftKey); return; }
    if(tool==="erase"){ const h=hitTest(wx,wy); if(h){ pushHistory(); removeHit(h); commit(); } return; }
    if(tool==="draw"){ stroke=[[wx,wy]]; moved=false; render(); return; }
    if(tool==="polygon"){
      if(!polyPts) polyPts=[];
      const [gx,gy]=snapPt(wx,wy);
      // Landing back on the first point CLOSES the run into a room. Ending it any
      // other way (Enter, double-click) leaves it open and it becomes a wall.
      if(polyPts.length>2 && Math.hypot(gx-polyPts[0][0],gy-polyPts[0][1])<0.6){ finishPolygon(true); return; }
      polyPts.push([gx,gy]); render(); return;
    }
    if(tool==="door"||tool==="stair"||tool==="wall"){
      const lineTool = (tool==="wall");                   // wall snaps to the grid; door/stair to half-grid
      const gp = lineTool ? snapPt(wx,wy) : [snapHalf(wx),snapHalf(wy)];
      const need = tool==="door" ? 2 : 3;                 // door=2, stair/wall/shape=3 (3rd = curve)
      if(!placing){ placing={tool, pts:[gp], hover:gp.slice()}; render(); }
      else { placing.pts.push(gp); if(placing.pts.length>=need) commitPlacing(); else render(); }
      return;
    }
    // rect / circle / wall — start a drag
    dragStart=snapPt(wx,wy);
  });

  cv.addEventListener("pointermove", e=>{
    if(pointers.has(e.pointerId)) pointers.set(e.pointerId, rel(e));
    if(gesture){ if(pointers.size>=2) updatePinch(); return; }
    const [sx,sy]=rel(e); const [wx,wy]=toWorld(sx,sy);
    if(panning){ cam.x=panning.cx-(sx-panning.sx)/wpx(); cam.y=panning.cy-(sy-panning.sy)/wpx(); render(); return; }
    if(handle){
      const o=handle.o;
      if(handle.mode==="rotate"){
        let r=handle.rot0 + (Math.atan2(wy-o.y, wx-o.x) - handle.a0);
        if(snapOn) r=Math.round(r/(Math.PI/12))*(Math.PI/12);   // 15° steps while snap is on
        o.rot=r;
      } else {
        const f=Math.max(0.1, Math.hypot(wx-o.x, wy-o.y)/handle.d0);
        o.w=Math.max(0.1, handle.w0*f); o.h=Math.max(0.1, handle.h0*f);
      }
      moved=true; render(); return;
    }
    if(tool==="object" && armedObj){
      // A full render per mousemove is far too much on a lit textured map, where
      // one frame is tens of milliseconds. Two guards: the ghost sits on the
      // half-grid, so with snap on most moves don't change it at all and cost
      // nothing; and when snap is off, coalesce to one render per frame.
      const g=[snapHalf(wx), snapHalf(wy)];
      if(!ghostPt || ghostPt[0]!==g[0] || ghostPt[1]!==g[1]){ ghostPt=g; ghostRender(); }
      return;
    }
    if(stroke){ const p=stroke[stroke.length-1];
      // 0.06 cells between samples: fine enough that the line under the cursor
      // never lags, coarse enough that a slow careful trace doesn't log hundreds
      // of near-duplicate points for the simplifier to chew through.
      if(Math.hypot(wx-p[0],wy-p[1])>0.06){ stroke.push([wx,wy]); moved=true; render(); }
      return; }
    if(placing){ placing.hover = (placing.tool==="wall") ? snapPt(wx,wy) : [snapHalf(wx),snapHalf(wy)]; render(); return; }
    if(polyPts){ hoverPt=snapPt(wx,wy); render(); }
    if(dragObj){ moved=true; moveObj(dragObj, wx-dragObj.ox, wy-dragObj.oy); render(); return; }
    if(!dragStart) return;
    moved=true;
    const [gx,gy]=snapPt(wx,wy);
    if(tool==="rect") draft={type:"rect",x:Math.min(dragStart[0],gx),y:Math.min(dragStart[1],gy),
      w:Math.abs(gx-dragStart[0])||1,h:Math.abs(gy-dragStart[1])||1};
    // Circle radius snaps in HALF cells, so the diameter steps by whole squares and
    // the smallest circle you can draw is 1 square across (r = 0.5), not 2.
    else if(tool==="circle"){ const rr=Math.hypot(wx-dragStart[0],wy-dragStart[1]);
      const r=Math.max(0.5, snapOn? Math.round(rr*2)/2 : rr);
      draft={type:"circle",cx:dragStart[0],cy:dragStart[1],r}; }
    else if(tool==="wall") draft={kind:"wall",x1:dragStart[0],y1:dragStart[1],x2:gx,y2:gy};
    else if(tool==="stair"){ const hx=snapHalf(wx),hy=snapHalf(wy);
      draft={type:"rect",x:Math.min(dragStart[0],hx),y:Math.min(dragStart[1],hy),
             w:Math.abs(hx-dragStart[0])||1,h:Math.abs(hy-dragStart[1])||1}; }
    render();
  });

  cv.addEventListener("pointerup", e=>{
    pointers.delete(e.pointerId);
    if(gesture){ if(pointers.size<2){ gesture=null; panning=null; dragStart=null; draft=null; } return; }
    if(stroke){ finishStroke(); return; }
    if(handle){ if(moved){ pushHistory(handle.snap); commit(); } handle=null; return; }
    if(panning){ panning=null; return; }
    if(dragObj){ if(moved){ pushHistory(dragObj.snap); commit(); } dragObj=null; return; }
    if(!dragStart){ return; }
    const [sx,sy]=rel(e); const [wx,wy]=toWorld(sx,sy);
    if(tool==="rect" && draft){ pushHistory(); draft.id=uid(); if(drawMode==="shapes") draft.deco=true;
      map.shapes.push(stampStyle(draft,"shape")); commit(); }
    else if(tool==="circle" && draft){ pushHistory(); draft.id=uid(); if(drawMode==="shapes") draft.deco=true;
      map.shapes.push(stampStyle(draft,"shape")); commit(); }
    else if(tool==="wall" && draft && (draft.x1!==draft.x2||draft.y1!==draft.y2)){
      pushHistory(); map.walls.push(stampStyle({id:uid(),x1:draft.x1,y1:draft.y1,x2:draft.x2,y2:draft.y2},"wall")); commit(); }
    draft=null; dragStart=null;
  });

  // Leaving the canvas drops the ghost, so it doesn't sit frozen at the edge.
  cv.addEventListener("pointerleave", ()=>{ if(ghostPt){ ghostPt=null; render(); } });
  cv.addEventListener("pointercancel", e=>{ pointers.delete(e.pointerId);
    if(pointers.size<2) gesture=null;
    if(pointers.size===0){ panning=null; draft=null; dragStart=null; stroke=null; render(); } });
  cv.addEventListener("dblclick", ()=>{ if(polyPts&&polyPts.length>1) finishPolygon(false); });
  cv.addEventListener("contextmenu", e=>e.preventDefault());
  cv.addEventListener("wheel", e=>{ e.preventDefault();
    const [sx,sy]=rel(e); const [bwx,bwy]=toWorld(sx,sy);
    const f=e.deltaY<0?1.12:1/1.12; cam.scale=Math.max(0.15,Math.min(6,cam.scale*f));
    const [awx,awy]=toWorld(sx,sy); cam.x+=bwx-awx; cam.y+=bwy-awy; render(); updateZoom();
  },{passive:false});

  function rel(e){ const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; }
  function snapHalf(v){ return snapOn? Math.round(v*2)/2 : v; }

  // ── multi-click placement: door = 2 points (start, direction), stair = 3
  // points (base A, base B = starting width, tip = apex) ──────────────
  function doorFromPts(a, end){ const dx=end[0]-a[0], dy=end[1]-a[1], dist=Math.hypot(dx,dy);
    if(dist<0.2) return {x:a[0], y:a[1], a:0, len:1};
    return {x:a[0]+dx/2, y:a[1]+dy/2, a:Math.atan2(dy,dx), len:Math.max(0.6,dist)}; }
  function stairFromPts(a, b, tip){
    if(!a||!b||!tip) return null;
    if(Math.hypot(b[0]-a[0], b[1]-a[1])<0.2) return null;
    const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
    if(Math.hypot(tip[0]-mx, tip[1]-my)<0.2) return null;
    return {ax:a[0],ay:a[1], bx:b[0],by:b[1], tx:tip[0],ty:tip[1]}; }
  // Build a wall/shape object from start, end and the curve-apex click. The 3rd
  // click is the point the wall should bow THROUGH: for a quadratic Bézier that
  // passes through apex Q at t=0.5, the control point is 2Q − midpoint. If Q sits
  // on the chord (no bow), it stays a straight wall (no control point stored).
  function wallFromPts(a, b, apex, thin){
    if(!a||!b) return null;
    if(Math.hypot(b[0]-a[0], b[1]-a[1])<0.1) return null;
    const wl={ x1:a[0], y1:a[1], x2:b[0], y2:b[1] };
    if(apex){ const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
      if(distToSeg(apex[0],apex[1], a[0],a[1], b[0],b[1]) > 0.2){ wl.cx=2*apex[0]-mx; wl.cy=2*apex[1]-my; } }
    if(thin) wl.thin=true;
    return wl;
  }
  function commitPlacing(){
    if(placing.tool==="door"){ const g=doorFromPts(placing.pts[0], placing.pts[1]);
      pushHistory(); g.id=uid(); map.doors.push(g); commit(); }
    else if(placing.tool==="wall"){
      const wl=wallFromPts(placing.pts[0], placing.pts[1], placing.pts[2], drawMode==="shapes");
      if(wl){ pushHistory(); wl.id=uid(); map.walls.push(stampStyle(wl,"wall")); commit(); } }
    else { const g=stairFromPts(placing.pts[0], placing.pts[1], placing.pts[2]);
      if(g){ pushHistory(); g.id=uid(); map.stairs.push(g); commit(); } }
    placing=null;
  }

  // Finish the polygon run. `close` = the user landed back on the first point, so
  // it becomes a ROOM. Anything else (Enter, double-click) leaves the run OPEN and
  // it becomes a wall chain instead — which is what the old 3-click Wall tool was
  // for, except you get as many segments as you like in one gesture.
  function finishPolygon(close){
    let pts = polyPts ? polyPts.slice() : [];
    // A double-click drops a point on the first of its two downs, so the run
    // usually ends with a duplicate. Strip it or a 2-click line becomes a 1-point
    // nothing and a triangle becomes a degenerate quad.
    while(pts.length>1 && Math.hypot(pts[pts.length-1][0]-pts[pts.length-2][0],
                                     pts[pts.length-1][1]-pts[pts.length-2][1]) < 1e-6) pts.pop();
    if(close && pts.length>2){
      pushHistory();
      const poly={id:uid(),type:"polygon",pts}; if(drawMode==="shapes") poly.deco=true;
      stampStyle(poly,"shape");
      map.shapes.push(poly); commit();
    } else if(!close && pts.length>1){
      pushHistory(); map.walls.push(stampStyle(wallFromChain(pts),"wall")); commit();
    }
    polyPts=null; hoverPt=null; render(); }

  // ── freehand ──────────────────────────────────────────────────────
  // An open chain of world points as a wall. Two points is stored as a plain
  // straight span so it is byte-identical to what the old Wall tool produced;
  // anything longer carries `pts` and renders through roughCurve/stripPath.
  function wallFromChain(pts){
    const n=pts.length;
    const wl={ id:uid(), x1:pts[0][0], y1:pts[0][1], x2:pts[n-1][0], y2:pts[n-1][1] };
    if(n>2) wl.pts=pts;
    if(drawMode==="shapes") wl.thin=true;
    return wl;
  }
  // Ramer–Douglas–Peucker. A traced stroke arrives with a point every 0.06 cells;
  // kept as-is it would bloat the saved map and make the rough-ink edge shimmer,
  // so drop every point that sits within `tol` of the line its neighbours make.
  function simplifyPath(pts, tol){
    const n=pts.length; if(n<3) return pts.slice();
    const keep=new Uint8Array(n); keep[0]=1; keep[n-1]=1;
    const stack=[[0,n-1]];
    while(stack.length){
      const seg=stack.pop(), a=seg[0], b=seg[1];
      let idx=-1, dmax=0;
      for(let i=a+1;i<b;i++){
        const d=distToSeg(pts[i][0],pts[i][1], pts[a][0],pts[a][1], pts[b][0],pts[b][1]);
        if(d>dmax){ dmax=d; idx=i; } }
      if(idx>0 && dmax>tol){ keep[idx]=1; stack.push([a,idx],[idx,b]); }
    }
    const out=[]; for(let i=0;i<n;i++) if(keep[i]) out.push(pts[i]);
    return out;
  }
  // Chaikin corner cutting — replace each corner with the two points a quarter of
  // the way along its edges. Two passes turn the simplified polyline back into
  // something that reads as a smooth cave wall rather than a faceted one.
  function chaikin(pts, closed, iters){
    let p=pts;
    for(let it=0; it<iters; it++){
      const n=p.length; if(n<3) break;
      const q=[];
      if(!closed) q.push(p[0]);
      const segs = closed ? n : n-1;
      for(let i=0;i<segs;i++){ const a=p[i], b=p[(i+1)%n];
        q.push([a[0]*0.75+b[0]*0.25, a[1]*0.75+b[1]*0.25]);
        q.push([a[0]*0.25+b[0]*0.75, a[1]*0.25+b[1]*0.75]); }
      if(!closed) q.push(p[n-1]);
      p=q;
    }
    return p;
  }
  const round3=(pts)=>pts.map(p=>[Math.round(p[0]*1000)/1000, Math.round(p[1]*1000)/1000]);
  // Safety valve. A normal cave lands around 30–80 points; a very slow trace
  // across a whole map can run into the hundreds, and every vertex is paid for
  // again on each frame by the rough ink ring, the textured wall ribbon and the
  // light occluder walk. Back the tolerance off until it fits.
  const MAX_PTS = 200;
  function capPoints(pts, closed){
    let tol=0.04, out=simplifyPath(pts, tol);
    while(out.length>MAX_PTS && tol<2){ tol*=1.8; out=simplifyPath(pts, tol); }
    return (closed && out.length<3) ? pts : out;
  }
  // Turn the raw trace into geometry. Simplify hard, smooth, then simplify gently
  // again — Chaikin quadruples the point count and most of what it adds is
  // redundant on the straighter runs.
  function finishStroke(){
    const raw=stroke; stroke=null; moved=false;
    if(!raw || raw.length<3){ render(); return; }
    let pts=simplifyPath(raw, 0.12);
    const closed = raw.length>6 &&
      Math.hypot(raw[raw.length-1][0]-raw[0][0], raw[raw.length-1][1]-raw[0][1]) <= CLOSE_CELLS;
    if(closed){
      // The tail is about to be joined to the head anyway; a point sitting almost
      // on top of the first one only makes a spike.
      while(pts.length>3 && Math.hypot(pts[pts.length-1][0]-pts[0][0],
                                       pts[pts.length-1][1]-pts[0][1]) < 0.5) pts.pop();
      if(pts.length<3){ render(); return; }
      pts=round3(capPoints(chaikin(pts, true, 2), true));
      if(pts.length<3){ render(); return; }
      pushHistory();
      const poly={id:uid(), type:"polygon", pts};
      if(drawMode==="shapes") poly.deco=true;
      map.shapes.push(stampStyle(poly,"shape")); commit();
    } else {
      pts=round3(capPoints(chaikin(pts, false, 2), false));
      if(pts.length<2){ render(); return; }
      pushHistory(); map.walls.push(stampStyle(wallFromChain(pts),"wall")); commit();
    }
    render();
  }

  // move / snapshot / remove object helpers
  function objSnapshot(h){ return JSON.parse(JSON.stringify(h.obj)); }
  function moveObj(dragObj, dx, dy){
    const o=dragObj.h.obj, s=dragObj.snap;
    const sd=v=> snapOn?Math.round(v):v, hd=v=> snapOn?Math.round(v*2)/2:v;
    const gdx=sd(dx), gdy=sd(dy);
    if(dragObj.h.kind==="shape"){
      if(o.type==="rect"){ o.x=s.x+gdx; o.y=s.y+gdy; }
      else if(o.type==="circle"){ o.cx=s.cx+gdx; o.cy=s.cy+gdy; }
      else if(o.type==="polygon"){ o.pts=s.pts.map(p=>[p[0]+gdx,p[1]+gdy]); }
      markGeom();
    } else if(dragObj.h.kind==="wall"){ o.x1=s.x1+gdx;o.y1=s.y1+gdy;o.x2=s.x2+gdx;o.y2=s.y2+gdy;
      if(s.cx!==undefined){ o.cx=s.cx+gdx; o.cy=s.cy+gdy; }
      if(s.pts) o.pts=s.pts.map(p=>[p[0]+gdx,p[1]+gdy]); }
    else if(dragObj.h.kind==="door" || dragObj.h.kind==="object" || dragObj.h.kind==="light"
         || dragObj.h.kind==="shadow"){ o.x=s.x+hd(dx); o.y=s.y+hd(dy); }
    else if(dragObj.h.kind==="stair"){
      if(s.ax!==undefined){ o.ax=s.ax+gdx;o.ay=s.ay+gdy;o.bx=s.bx+gdx;o.by=s.by+gdy;o.tx=s.tx+gdx;o.ty=s.ty+gdy; }
      else if(s.x1!==undefined){ o.x1=s.x1+gdx;o.y1=s.y1+gdy;o.x2=s.x2+gdx;o.y2=s.y2+gdy; }
      else { o.x=s.x+gdx; o.y=s.y+gdy; } }
  }
  function removeHit(h){ const arr=({shape:map.shapes,wall:map.walls,door:map.doors,stair:map.stairs,object:map.objects,light:map.lights,shadow:map.shadows})[h.kind];
    if(arr) arr.splice(h.idx,1); setSel(null); }
  function nearestWallAngle(wx,wy){
    let best=1e9,ang=0;
    for(const w of map.walls){ const d=distToSeg(wx,wy,w.x1,w.y1,w.x2,w.y2);
      if(d<best){ best=d; ang=Math.atan2(w.y2-w.y1,w.x2-w.x1); } }
    // also consider room edges (axis-aligned) — snap to nearest of 0 / 90°
    if(best>1.2){ return 0; }
    return ang;
  }

  // ════════════════════════════════════════════════════════════════
  // RANDOM DUNGEON GENERATOR
  // ════════════════════════════════════════════════════════════════
  // Deterministic PRNG so a "seed" could be added later; seeded from counter.
  let rngState=0;
  function rng(){ rngState=(rngState*1664525+1013904223)>>>0; return rngState/4294967296; }
  function ri(a,b){ return a+Math.floor(rng()*(b-a+1)); }

  // Generate entry point. The map is built by the shared DungeonEngine when it's
  // loaded (single source of truth, shared with the GM Screen + Session Prep);
  // otherwise by the inlined generateLocal() fallback. Either way this wrapper
  // owns the surrounding UI concerns (history, name/grid, commit + fit).
  function generate(){
    const opts = {
      rooms: +$("rooms").value,
      size: +$("rsize").value,
      layout: +$("spread").value,
      entrances: +$("entrances").value,
      corridors: $("corridors").checked,
      roundRooms: $("roundish").checked,
      theme: theme
    };
    pushHistory();
    // The engine returns a brand-new map object, so carry the user's settings
    // across — otherwise rolling a dungeon silently resets Advanced Mode, the
    // chosen textures and the grid opacity. Generated ROOMS stay unstyled on
    // purpose, so they follow map.style and can be restyled in one move.
    const keepName = map.name, keepStyle = map.style, keepGridOp = map.gridOpacity, keepSnap = map.snap;
    const keepLit = map.lit, keepDark = map.darkness, keepShadowsOn = map.shadowsOn;
    map = (window.DungeonEngine && window.DungeonEngine.generate)
      ? window.DungeonEngine.generate(opts)
      : generateLocal(opts);
    map.name = keepName; map.grid = $("gridToggle").checked; map.theme = theme;
    if(keepStyle) map.style = keepStyle;
    if(keepGridOp!=null) map.gridOpacity = keepGridOp;
    if(keepSnap!=null) map.snap = keepSnap;
    map.lit = !!keepLit; map.darkness = (keepDark==null) ? 0.55 : keepDark;
    map.shadowsOn = !!keepShadowsOn;                       // the entities belong to the old map
    map.lights = []; map.shadows = [];
    commit(); syncAdvancedUI(); syncStyleScope(); syncLightUI(); fitView();
  }
  // Inlined fallback generator (used only when DungeonEngine isn't loaded, e.g.
  // the tool opened standalone). Builds into the module `map` and returns it.
  function generateLocal(opts){
    const nRooms=opts.rooms;
    const [smin,smax]=SIZE_MAP[opts.size];
    const spread=opts.layout;
    const doCorr=opts.corridors;
    const roundOk=opts.roundRooms;
    const nEntrances=opts.entrances;
    rngState=(Date.now()^(Math.floor(Math.random()*1e9)))>>>0;
    map=blankMap(); map.theme=opts.theme;

    // Field size derives from a target packing density (rooms fill ~this
    // fraction of the bounding area). Tighter layouts pack denser.
    const avg=(smin+smax)/2;
    const density=[0.5,0.4,0.32,0.25,0.18][spread-1];
    const field=Math.max(avg, Math.round(avg*Math.sqrt(nRooms/density)/2));
    const rooms=[];
    if(!doCorr){
      // Adjacency mode: every room butts flush against another, sharing a wall,
      // so no room floats alone. Rectangular only — a round room can only ever
      // touch a straight wall at a single point, never share a segment.
      placeAdjacentRooms(rooms, nRooms, smin, smax);
    } else {
      let tries=0, guard=nRooms*220;
      while(rooms.length<nRooms && tries++<guard){
        const round = roundOk && rng()<0.28;
        const w=ri(smin,smax), h=round?w:ri(smin,smax);
        const x=ri(-field, field), y=ri(-field, field);
        const gap=1;
        const nb={x:x-gap,y:y-gap,w:w+gap*2,h:h+gap*2};
        if(rooms.some(r=>rectsOverlap(nb,{x:r.x,y:r.y,w:r.w,h:r.h}))) continue;
        rooms.push({x,y,w,h,round,cx:x+w/2,cy:y+h/2});
      }
    }
    // add rooms as shapes
    for(const r of rooms){
      if(r.round){ const rad=Math.max(r.w,r.h)/2; map.shapes.push({id:uid(),type:"circle",cx:r.cx,cy:r.cy,r:Math.round(rad)}); }
      else map.shapes.push({id:uid(),type:"rect",x:r.x,y:r.y,w:r.w,h:r.h});
    }
    // connect via nearest-neighbour spanning tree, carve corridors + doors
    if(doCorr && rooms.length>1){
      const connected=[0], pending=rooms.map((_,i)=>i).slice(1);
      while(pending.length){
        let bi=-1,bj=-1,bd=1e9;
        for(const ci of connected) for(const pj of pending){
          const d=Math.hypot(rooms[ci].cx-rooms[pj].cx, rooms[ci].cy-rooms[pj].cy);
          if(d<bd){ bd=d; bi=ci; bj=pj; } }
        carveCorridor(rooms[bi], rooms[bj]);
        connected.push(bj); pending.splice(pending.indexOf(bj),1);
      }
      // a few extra loops for interesting layouts
      const extra=Math.floor(rooms.length*0.15);
      for(let k=0;k<extra;k++){ const a=ri(0,rooms.length-1),b=ri(0,rooms.length-1);
        if(a!==b && Math.hypot(rooms[a].cx-rooms[b].cx,rooms[a].cy-rooms[b].cy)<avg*5) carveCorridor(rooms[a],rooms[b]); }
    }
    else if(rooms.length>1){ addAdjacencyDoors(rooms); }
    // Snap each generated door to the grid, fit it to the real wall opening it
    // sits in, and drop any that don't span a visible, corridor-width wall.
    map.doors = finalizeDoors();
    // Then add the requested number of entrances — doors on EXTERIOR walls that
    // lead out of the whole dungeon (0 ⇒ none, e.g. stairs are the way in/out).
    placeEntrances(nEntrances);
    // Stairs are NOT auto-placed — drop them by hand with the Stairs tool.
    return map;
  }
  // Final pass over every generated door: measure the actual opening in the wall
  // it sits in, snap it onto the grid, size it to span that opening, and reject
  // anything that isn't a real, visible, corridor-width doorway. This is what
  // guarantees doors are (a) on the grid, (b) on a visible wall, and (c) fully
  // spanning 1- and 2-cell corridors — regardless of how they were first placed.
  function finalizeDoors(){
    const s2=v=>Math.round(v*2)/2;
    // both sides across the wall are floor ⇒ an open passage at this point
    const cross=(x,y,vx,vy)=> pointInAny(x+vx*0.5,y+vy*0.5) && pointInAny(x-vx*0.5,y-vy*0.5);
    const fitted=[];
    for(const d of map.doors){
      const a=d.a||0, ux=Math.cos(a),uy=Math.sin(a), vx=-Math.sin(a),vy=Math.cos(a);
      // Adjacency doors sit on a known-good shared wall where BOTH sides are floor
      // for the whole segment, so the opening-measure below can't judge them —
      // pass them through (already grid-snapped when placed).
      if(d._adj){ fitted.push({id:d.id, x:d.x, y:d.y, a, len:d.len||1}); continue; }
      // Nudge the centre onto the passage if it isn't quite there.
      let cx=d.x, cy=d.y;
      if(!cross(cx,cy,vx,vy)){
        let found=false;
        for(let t=0.25;t<=1.5 && !found;t+=0.25){
          if(cross(cx+ux*t,cy+uy*t,vx,vy)){ cx+=ux*t; cy+=uy*t; found=true; }
          else if(cross(cx-ux*t,cy-uy*t,vx,vy)){ cx-=ux*t; cy-=uy*t; found=true; }
        }
        if(!found) continue;                                   // no passage anywhere near → drop
      }
      // Walk along the wall to find the contiguous open run (the doorway gap).
      let lo=0; for(let t=-0.15;t>=-2.4;t-=0.15){ if(cross(cx+ux*t,cy+uy*t,vx,vy)) lo=t; else break; }
      let hi=0; for(let t=0.15;t<=2.4;t+=0.15){ if(cross(cx+ux*t,cy+uy*t,vx,vy)) hi=t; else break; }
      const width=hi-lo, mid=(lo+hi)/2;
      if(width<0.6 || width>2.4) continue;                     // no opening, or wider than a 2-cell corridor (hidden/merged wall)
      // Recentre on the opening; snap the ALONG coordinate to the grid (the
      // ACROSS coordinate already sits on the wall — a straight edge or the circle).
      let mx=cx+ux*mid, my=cy+uy*mid;
      if(Math.abs(ux)>=Math.abs(uy)) mx=s2(mx); else my=s2(my);
      const len=Math.min(2,Math.max(1,Math.round(width))), hl=len/2;
      // Both ends must butt into wall (passage CLOSED just past each end); if the
      // floor keeps going, the door is floating in open space, not in a wall.
      if(cross(mx+ux*(hl+0.35),my+uy*(hl+0.35),vx,vy)) continue;
      if(cross(mx-ux*(hl+0.35),my-uy*(hl+0.35),vx,vy)) continue;
      fitted.push({id:d.id, x:mx, y:my, a, len});
    }
    return dedupeDoors(fitted);
  }
  // Drop overlapping doors: parallel doors whose footprints overlap along the
  // wall, or any two doors sitting almost on the same spot.
  function dedupeDoors(arr){
    const out=[];
    for(const d of arr){ const dl=(d.len||1)/2;
      const dup=out.some(o=>{ const dist=Math.hypot(o.x-d.x,o.y-d.y), ol=(o.len||1)/2;
        const parallel=Math.abs(Math.sin((o.a||0)-(d.a||0)))<0.4;
        return dist < (parallel ? Math.max(0.6,(dl+ol)*0.85) : 0.4); });
      if(!dup) out.push(d); }
    return out;
  }
  // Add up to `n` ENTRANCE doors — doors on exterior walls (floor inside, empty
  // outside) that lead in/out of the whole dungeon. Runs AFTER finalizeDoors
  // because an entrance is a one-sided opening, not a two-sided passage, so it
  // can't go through the passage validator. Candidates are grid-aligned points on
  // straight rect edges (or a circle's N/S/E/W extremes) whose outside is empty.
  // Each candidate is tagged with its room, and NO two entrances share a room —
  // once a room gets an entrance, the rest of its candidates are dropped.
  function placeEntrances(n){
    if(n<=0) return;
    const floor=(x,y)=>pointInAny(x,y), empty=(x,y)=>!pointInAny(x,y);
    const cand=[];
    for(const sh of map.shapes){
      if(sh.corridor) continue;                                   // never on a corridor stub
      const room=sh.id;                                           // which room this candidate belongs to
      if(sh.type==="rect"){
        for(let x=sh.x+0.5; x<=sh.x+sh.w-0.5; x+=1){
          if(floor(x,sh.y+0.5)      && empty(x-0.5,sh.y-0.5)      && empty(x+0.5,sh.y-0.5))
            cand.push({x, y:sh.y, a:0, room});                    // top edge (outside = up)
          if(floor(x,sh.y+sh.h-0.5) && empty(x-0.5,sh.y+sh.h+0.5) && empty(x+0.5,sh.y+sh.h+0.5))
            cand.push({x, y:sh.y+sh.h, a:0, room});               // bottom edge
        }
        for(let y=sh.y+0.5; y<=sh.y+sh.h-0.5; y+=1){
          if(floor(sh.x+0.5,y)      && empty(sh.x-0.5,y-0.5)      && empty(sh.x-0.5,y+0.5))
            cand.push({x:sh.x, y, a:Math.PI/2, room});            // left edge (outside = left)
          if(floor(sh.x+sh.w-0.5,y) && empty(sh.x+sh.w+0.5,y-0.5) && empty(sh.x+sh.w+0.5,y+0.5))
            cand.push({x:sh.x+sh.w, y, a:Math.PI/2, room});       // right edge
        }
      } else if(sh.type==="circle"){
        const r=sh.r, s2=v=>Math.round(v*2)/2;
        const ext=[[sh.cx+r,sh.cy,Math.PI/2,1,0],[sh.cx-r,sh.cy,Math.PI/2,-1,0],
                   [sh.cx,sh.cy+r,0,0,1],[sh.cx,sh.cy-r,0,0,-1]];
        for(const [px,py,a,ox,oy] of ext){
          if(empty(px+ox*0.6,py+oy*0.6) && floor(px-ox*0.5,py-oy*0.5))
            cand.push(a===0 ? {x:s2(px), y:py, a, room} : {x:px, y:s2(py), a, room});
        }
      }
    }
    let pool=cand.filter(c=> !map.doors.some(d=>Math.hypot(d.x-c.x,d.y-c.y)<1.2));
    let placed=0;
    while(placed<n && pool.length){
      const c=pool.splice(Math.floor(rng()*pool.length),1)[0];
      map.doors.push({id:uid(), x:c.x, y:c.y, a:c.a, len:1});
      pool=pool.filter(o=> o.room!==c.room && Math.hypot(o.x-c.x,o.y-c.y)>3);  // one per room, and spread apart
      placed++;
    }
  }
  function rectsOverlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
  // Accretion placement: seed one room, then grow each new room flush against a
  // random side of an already-placed room so it SHARES that wall (overlap ≥2 so a
  // door fits). Edge-butting isn't an interior overlap, so rectsOverlap stays
  // false against the anchor; we reject only rooms whose interior crosses another.
  function placeAdjacentRooms(rooms, nRooms, smin, smax){
    const w0=ri(smin,smax), h0=ri(smin,smax);
    rooms.push({x:0,y:0,w:w0,h:h0,round:false,cx:w0/2,cy:h0/2});
    let tries=0, guard=nRooms*500;
    while(rooms.length<nRooms && tries++<guard){
      const base=rooms[ri(0,rooms.length-1)];
      const w=ri(smin,smax), h=ri(smin,smax);
      let nx,ny;
      switch(ri(0,3)){
