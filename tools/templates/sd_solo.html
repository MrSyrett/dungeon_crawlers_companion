<!DOCTYPE html>
<html lang="en">
<head>
<!-- SOLO PLAY — Shadowdark solo campaign page (SoloDark rules). Part of the removable
     Solo Play feature (see SOLO-REMOVAL.md). Served by app/solo/[id]/route.ts for a
     solo campaign whose module is a Shadowdark one; saved as a Document of tool
     "db-solo" under the "db_solo" key, like the Dragonbane campaigns. No Google
     Fonts: the faces come from /tokens.css via the injected head. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Shadowdark Solo Campaign</title>
<script src="/tools-data/sd-monsters.js"></script>
<script src="/tools-data/solo/sd-solo-tables.js"></script>
<script src="/tools-data/solo/sd-solo-dusk-queen.js"></script>
<style>
:root{
  --f-disp:"JSL Blackletter","UnifrakturMaguntia",ui-serif,Georgia,serif;
  --f-label:"Montserrat",ui-sans-serif,system-ui,sans-serif;
  --f-ui:"Montserrat",ui-sans-serif,system-ui,sans-serif;
  --bg:#e7e5e0;--card:#fbfaf7;--box:#f0eee9;--ink:#141414;--muted:#5e5b55;--rule:#cdc9c1;
  --acc:#1a1a1a;--acc-dk:#111;--acc-lt:#ece6d2;--on-acc:#fff;--gold:#8a6a10;--gold-lt:#c8a020;--red:#b3261e;--green:#2f7a46;
  --input-bg:#fff;--input-border:#aaa49a;--shadow:0 2px 8px rgba(20,20,20,.08);--light:#d98a1c;
}
body.dark{
  --bg:#0c0c0e;--card:#17171b;--box:#1f1f24;--ink:#ece9e2;--muted:#9a978f;--rule:#34343b;
  --acc:#c8a020;--acc-dk:#e2bf4a;--acc-lt:#2a2614;--on-acc:#141414;--gold:#c8a020;--gold-lt:#e2c37a;--red:#e0614f;--green:#5fae76;
  --input-bg:#141417;--input-border:#3a3a41;--shadow:0 2px 8px rgba(0,0,0,.45);--light:#f0a640;
}
/* the site's Shadowdark ground would win over a plain body rule */
:root[data-themed][data-system="SD"] body.so{background:var(--bg);background-image:none;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--f-ui);font-variant-numeric:lining-nums;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;font-size:15px;}
button,input,select,textarea{font-family:var(--f-ui);font-size:15px;}
.so-app{flex:none;display:flex;min-height:0;height:calc(100vh - var(--dd-bar-h,52px));}
.so-pane{width:460px;flex-shrink:0;overflow-y:auto;padding:14px 14px 40px;border-right:2px solid var(--acc);}
/* in play: the top (progress, clock, Story) stays put; the actions scroll beneath it */
body.playing .so-pane{display:flex;flex-direction:column;overflow:hidden;padding-bottom:14px;}
body.playing #so-root{flex:1;min-height:0;display:flex;flex-direction:column;}
body.playing .top-card{flex:none;}
body.playing .act-card{flex:1;min-height:0;display:flex;flex-direction:column;margin-bottom:0;}
body.playing .act-card .card-b{flex:1;min-height:0;overflow-y:auto;}
.so-sheet{flex:1;min-width:0;position:relative;background:var(--bg);display:flex;flex-direction:column;}
.so-frames{flex:1;position:relative;min-height:0;}
.so-frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg);}
/* party tabs hang down from the top edge over the sheet (no bar of their own) */
.so-heroes{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:4px;max-width:calc(100% - 24px);overflow-x:auto;pointer-events:none;scrollbar-width:none;}
.so-heroes::-webkit-scrollbar{display:none;}
.so-heroes .hero{pointer-events:auto;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:88px;padding:4px 12px 6px;border:1px solid var(--rule);border-top:0;border-radius:0 0 9px 9px;background:var(--box);color:var(--muted);cursor:pointer;font-family:var(--f-label);font-size:12.5px;letter-spacing:.03em;box-shadow:0 3px 8px rgba(0,0,0,.28);opacity:.92;}
.so-heroes .hero:hover{opacity:1;color:var(--ink);}
.so-heroes .hero.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc-dk);font-weight:700;opacity:1;padding-top:7px;}
.so-heroes .hero i{display:block;height:3px;width:100%;border-radius:2px;background:linear-gradient(90deg,var(--green) var(--hp),var(--rule) var(--hp));}
.so-heroes .hero.on i{background:linear-gradient(90deg,#9be3b2 var(--hp),rgba(255,255,255,.3) var(--hp));}
.so-heroes .hero em{font-style:normal;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--red);}
.so-heroes .hero.on em{color:#ffd2cc;}
.so-heroes .hero.dead{opacity:.6;}
.so-sheet .so-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;color:var(--muted);}
.so-tabs{display:none;}
@media (max-width:900px){
  .so-app{flex-direction:column;height:auto;min-height:calc(100vh - var(--dd-bar-h,52px));}
  .so-pane{width:100%;border-right:0;padding-bottom:90px;}
  body.playing .so-pane{height:calc(100vh - var(--dd-bar-h,52px) - 56px);padding-bottom:10px;}
  .top-card .jr{height:120px;}
  .so-sheet{height:calc(100vh - var(--dd-bar-h,52px) - 56px);}
  body.party .so-tabs button[data-tab="sheet"]::after{content:" · " attr(data-who);}
  body[data-tab="adventure"] .so-sheet{display:none;}
  body[data-tab="sheet"] .so-pane{display:none;}
  .so-tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:2px solid var(--acc);}
  .so-tabs button{flex:1;padding:14px 4px;background:none;border:0;color:var(--muted);font-family:var(--f-label);letter-spacing:.08em;text-transform:uppercase;font-size:13px;}
  .so-tabs button.on{color:var(--acc-dk);font-weight:700;}
}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px 7px;border-bottom:1px solid var(--rule);}
.card-h h2,.card-h h3{font-family:var(--f-disp);font-weight:400;color:var(--acc-dk);letter-spacing:.04em;}
.card-h h2{font-size:24px;} .card-h h3{font-size:20px;}
.card-b{padding:10px 12px 12px;}
.lbl{font-family:var(--f-label);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.muted{color:var(--muted);} .small{font-size:13.5px;} .tiny{font-size:12px;}
.read{font-family:"EB Garamond",Georgia,serif;font-size:16.5px;font-style:italic;line-height:1.5;border-left:3px solid var(--gold-lt);padding:2px 0 2px 10px;margin:6px 0 8px;}
p{line-height:1.45;margin:4px 0;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--acc);background:transparent;color:var(--acc-dk);border-radius:7px;padding:6px 11px;cursor:pointer;font-family:var(--f-label);font-size:13px;letter-spacing:.03em;line-height:1.1;}
.btn:hover{background:var(--acc-lt);}
.btn.pri{background:var(--acc);color:var(--on-acc);border-color:var(--acc-dk);} .btn.pri:hover{filter:brightness(1.12);}
.btn.warn{border-color:var(--red);color:var(--red);} .btn.warn:hover{background:rgba(179,38,30,.1);}
.btn.ghost{border-color:var(--rule);color:var(--muted);}
.btn:disabled{opacity:.45;cursor:default;}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.stack{display:flex;flex-direction:column;gap:8px;}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--rule);border-radius:999px;padding:1px 9px;font-size:13px;background:var(--box);}
.chip.bad{border-color:var(--red);color:var(--red);}
.chip .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:11px;line-height:1;padding:0 0 0 3px;}
.chip .x:hover{color:var(--red);}
.chip.good{border-color:var(--green);color:var(--green);}
/* character strip */
.pc{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.pc-name{font-weight:700;font-size:18px;}
.bar{position:relative;height:20px;border-radius:5px;background:var(--box);border:1px solid var(--rule);overflow:hidden;min-width:96px;flex:1;}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--green);} .bar.wp i{background:#3f7fbf;}
.bar span{position:relative;z-index:1;font-size:12px;padding-left:6px;line-height:19px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);white-space:nowrap;}
/* route */
.route{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 10px;}
.route .wp{flex:1 1 0;min-width:34px;text-align:center;font-size:11px;font-family:var(--f-label);padding:5px 2px;border-radius:6px;border:1px solid var(--rule);background:var(--box);color:var(--muted);cursor:default;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.route .wp.done{background:var(--acc-lt);color:var(--acc-dk);}
.route .wp.cur{border-color:var(--acc);border-width:2px;color:var(--ink);font-weight:700;}
.route .wp.obj{border-style:double;border-width:3px;}
.route .wp.sunk{background:repeating-linear-gradient(135deg,rgba(63,127,191,.28) 0 6px,transparent 6px 12px);}
.sink{background:rgba(63,127,191,.12);border:1px solid #3f7fbf;border-radius:8px;padding:8px 10px;margin:6px 0;}
.score-big{font-family:var(--f-disp);font-size:26px;color:var(--acc-dk);}
/* challenges */
.ch{border:1px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--box);}
.ch.ok{border-color:var(--green);} .ch.fail{border-color:var(--red);}
.ch-h{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.ch-h b{font-weight:700;}
.res{margin-top:5px;font-size:14px;}
.res.ok{color:var(--green);} .res.fail{color:var(--red);}
.secret{border:1px dashed var(--gold-lt);border-radius:8px;padding:7px 10px;font-size:14px;}
.sug{font-family:var(--f-label);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);}
/* threat clock */
.clock{display:flex;gap:5px;margin:6px 0;}
.clock span{width:30px;height:30px;border-radius:7px;border:2px solid var(--rule);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted);}
.clock span.on{background:var(--red);border-color:var(--red);color:#fff;}
.trig{background:rgba(179,38,30,.12);border:1px solid var(--red);border-radius:8px;padding:8px 10px;margin:6px 0;}
/* tools */
.tabs{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:8px;}
.tabs button{border:1px solid var(--rule);background:var(--box);color:var(--muted);border-radius:6px;padding:4px 8px;font-family:var(--f-label);font-size:12px;cursor:pointer;}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc);}
.out{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--box);border:1px solid var(--rule);min-height:20px;}
.out b.big{font-size:20px;}
select,input[type=text],input[type=number],textarea{background:var(--input-bg);color:var(--ink);border:1px solid var(--input-border);border-radius:6px;padding:5px 8px;}
textarea{width:100%;min-height:54px;resize:vertical;}
/* journal */
.jr{display:flex;flex-direction:column;gap:6px;height:240px;overflow-y:auto;padding:2px 4px 2px 0;}
.jr .new{background:var(--acc-lt);border-radius:0 6px 6px 0;padding-top:4px;padding-bottom:4px;}
.jr .st.new{font-size:16.5px;}
/* status bar */
.status .card-b{padding:9px 12px 10px;}
.st-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--f-disp);font-size:17px;color:var(--acc-dk);}
.st-h b{font-weight:400;letter-spacing:.04em;}
.status .route{margin:6px 0 6px;}
.st-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;}
.st-cell{display:flex;flex-direction:column;gap:2px;}
.st-cell .clock{margin:0;gap:4px;} .st-cell .clock span{width:24px;height:24px;font-size:13px;border-radius:6px;}
.st-score{margin-left:auto;align-items:flex-end;} .st-score .score-big{line-height:1;}
.sink-n{font-size:14px;color:#3f7fbf;font-weight:600;}
/* the scene */
.wyd{margin-top:10px;padding-top:10px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:6px;}
.wyd-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--f-disp);font-size:17px;color:var(--acc-dk);letter-spacing:.04em;}
.hchip{cursor:pointer;font-family:var(--f-label);} .hchip.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc);}
.hchip.done{opacity:.55;text-decoration:line-through;cursor:default;}
.tiny-btn{padding:3px 8px;font-size:12px;}
.top-card .jr{height:190px;margin-top:8px;}
.top-btns{margin-top:8px;justify-content:flex-end;}
.bubbles{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px;}
.bub{border:1px solid var(--rule);background:var(--box);color:var(--muted);border-radius:999px;padding:3px 10px;font-family:var(--f-label);font-size:12px;cursor:pointer;}
.bub:hover{color:var(--acc-dk);border-color:var(--acc);} .bub.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc);}
.party-turns{margin:2px 0 6px;}
.ch.act.move{border-left:3px solid var(--acc);} .ch.act.locked{opacity:.6;}
.dlg-b.wide{max-width:900px;}
.map-tabs{margin-bottom:8px;gap:5px;}
.dlg-b figure.map img{max-height:65vh;}
ul.jl{margin:4px 0 0 18px;display:flex;flex-direction:column;gap:5px;font-size:14px;}
figure.map{margin:0 0 10px;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--box);}
figure.map img{display:block;width:100%;max-height:340px;object-fit:contain;background:#d8d2c2;}
figure.map figcaption{font-family:var(--f-label);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:4px 8px;}
.allies{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px;color:var(--muted);}
.intent{font-size:12px;color:#b56a1f;font-style:italic;}
.rsum{border:1px dashed var(--rule);border-radius:8px;padding:6px 9px;margin:6px 0;font-size:13.5px;background:var(--box);}
ul.disc{margin:4px 0 0 18px;font-size:13.5px;display:flex;flex-direction:column;gap:2px;} ul.disc li{color:var(--muted);} ul.disc li.on{color:var(--ink);}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:4px;}
.ach .a{border:1px solid var(--rule);border-radius:8px;padding:6px 8px;font-size:12.5px;color:var(--muted);background:var(--box);display:flex;flex-direction:column;gap:2px;}
.ach .a.on{color:var(--ink);border-color:var(--gold-lt);} .ach .a.new{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,161,74,.35);} .ach .a span{font-size:11.5px;color:var(--muted);}
.jr .ln.k-talk{border-color:var(--acc);font-style:italic;} .jr .ln.k-hint{border-color:var(--gold-lt);} .jr .ln.k-ach{border-color:var(--gold);} .jr .ln.k-ach b{color:var(--gold);}
.party-turns{gap:5px;}
.so-heroes .hero .act-dot{position:absolute;top:5px;left:6px;width:7px;height:7px;border-radius:50%;background:var(--gold-lt);box-shadow:0 0 0 2px rgba(0,0,0,.25);}
.jr .ln.k-turn{border-color:var(--acc);color:var(--acc-dk);font-family:var(--f-label);letter-spacing:.04em;}
.jr .ln.k-clue{border-color:var(--gold);} .jr .ln.k-clue b{color:var(--gold);}
.danger{border:2px solid var(--red);border-radius:8px;padding:8px 10px;background:rgba(179,38,30,.07);display:flex;flex-direction:column;gap:6px;}
.dg-h{font-family:var(--f-label);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);font-weight:700;}
.jr .st{font-family:"EB Garamond",Georgia,serif;font-size:15.5px;font-style:italic;line-height:1.5;margin:2px 0;padding-left:10px;border-left:3px solid var(--gold-lt);}
.jr .sh{font-family:var(--f-label);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc-dk);margin-top:8px;padding-top:6px;border-top:1px solid var(--rule);}
.jr .sh span{text-transform:none;letter-spacing:0;color:var(--muted);font-family:var(--f-ui);font-size:13px;}
.jr .ln{font-size:12.5px;color:var(--muted);padding-left:10px;border-left:3px solid var(--rule);}
.jr .ln b{font-weight:600;color:var(--ink);}
.jr .ln.k-score{border-color:var(--gold);color:var(--gold);} .jr .ln.k-score b{color:var(--gold);}
.jr .ln.k-roll{border-color:var(--acc);} .jr .ln.k-threat{border-color:var(--red);} .jr .ln.k-combat{border-color:#b56a1f;} .jr .ln.k-note{border-color:var(--gold-lt);}
/* scroll bars in the page's colours */
*{scrollbar-width:thin;scrollbar-color:var(--acc) transparent;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--acc);border-radius:8px;border:2px solid var(--bg);}
::-webkit-scrollbar-thumb:hover{background:var(--acc-dk);}
::-webkit-scrollbar-corner{background:transparent;}
/* combat */
.foe{border:1px solid var(--rule);border-radius:8px;padding:7px 9px;background:var(--box);}
.foe.dead{opacity:.45;} .foe.turn{border-color:#b56a1f;border-width:2px;}
.foe-h{display:flex;justify-content:space-between;gap:6px;align-items:center;}
.cards{display:inline-flex;gap:3px;}
.cardn{display:inline-flex;align-items:center;justify-content:center;width:20px;height:26px;border-radius:3px;background:#f1e7cc;color:#1b1a17;border:1px solid #b89a4e;font-weight:700;font-size:13px;}
.cardn.used{opacity:.35;}
.order{display:flex;flex-direction:column;gap:3px;margin:6px 0;}
.order div{display:flex;gap:8px;align-items:center;padding:3px 6px;border-radius:6px;font-size:14px;}
.order div.cur{background:rgba(181,106,31,.16);font-weight:700;}
.order div.past{opacity:.5;}
.attack{border:1px solid #b56a1f;border-radius:8px;padding:8px 10px;margin:6px 0;background:rgba(181,106,31,.08);}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:14px;}
.dlg.open{display:flex;}
.dlg-b{background:var(--card);color:var(--ink);border-radius:12px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;padding:16px;border:1px solid var(--rule);}
.dlg-b h3{font-family:var(--f-disp);font-weight:400;color:var(--acc-dk);font-size:20px;margin-bottom:8px;}
.list{display:flex;flex-direction:column;gap:6px;}
.list button{text-align:left;justify-content:flex-start;}
.mission{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--box);}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1f1f24;color:#eee;padding:8px 14px;border-radius:8px;font-size:14px;z-index:120;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;}
.toast.on{opacity:1;}
/* ── Shadowdark: the light, the crawl, luck ── */
.lightbar{display:flex;gap:3px;align-items:center;}
.lightbar span{width:9px;height:18px;border-radius:2px;border:1px solid var(--rule);background:var(--box);}
.lightbar span.on{background:var(--light);border-color:var(--light);box-shadow:0 0 6px rgba(240,166,64,.55);}
.lightbar span.low{background:#a33;border-color:#a33;box-shadow:none;}
.dark-badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:#000;border:1px solid #444;border-radius:6px;padding:3px 8px;}
.st-row{align-items:flex-start;} .st-cell{min-height:44px;} .st-cell .big{font-family:var(--f-label);font-weight:700;font-size:18px;line-height:1.1;}
.luck{display:inline-flex;gap:3px;} .luck i{width:12px;height:12px;border-radius:50%;border:1px solid var(--gold-lt);display:inline-block;} .luck i.on{background:var(--gold-lt);}
.darkness{background:#0b0b0d;color:#e9e6de;border:1px solid #333;border-radius:8px;padding:8px 10px;font-size:13.5px;}
.darkness b{color:#f0a640;}
.oracle-out{margin-top:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--rule);background:var(--box);}
.oracle-out .ans{font-family:var(--f-disp);font-size:30px;line-height:1;color:var(--acc-dk);}
.oracle-q{width:100%;margin:6px 0 8px;}
.hp-mini{font-size:11px;color:var(--muted);}

<body class="so" data-tab="adventure">
<div class="so-app">
  <section class="so-pane" id="so-pane"><div id="so-root"></div></section>
  <section class="so-sheet" id="so-sheet"><div class="so-frames" id="so-frames"><div class="so-heroes" id="so-heroes" style="display:none" role="tablist" aria-label="Party sheets"></div><div class="so-empty" id="so-sheet-empty">No heroes in this campaign.</div></div></section>
</div>
<nav class="so-tabs"><button data-tab="adventure" class="on">Adventure</button><button data-tab="sheet">Character Sheet</button></nav>
<div class="dlg" id="dlg"><div class="dlg-b" id="dlg-b"></div></div>
<div class="toast" id="toast"></div>
<script>
/* ═══ Shadowdark SOLO CAMPAIGN ══════════════════════════════════════════════
   SoloDark-style solo play in the browser, built on the same page as the
   Dragonbane solo campaign (db_solo.html): an adventure's places, what you can
   do there, its people, items and endings come from a module file
   (window.SD_SOLO_MODULES). Shadowdark's own rules run the rest:
   - checks are d20 + ability modifier against the DC the adventure gives (set
     when the adventure was converted), with advantage/disadvantage;
   - the CRAWL: every action takes a crawling round; light sources last 10 rounds
     (SoloDark); a random-encounter check every N rounds by the danger level, and
     every round in total darkness (where every check has disadvantage);
   - LUCK (SoloDark): a natural 20 earns a luck token, up to one per hero in the
     party; new heroes start with one; spend one to re-roll a failed roll;
   - the ORACLE (d20: 1–9 No, 10 Twist, 11–20 Yes; odd = "but"; 1/20 extreme) and
     the verb + noun PROMPTS;
   - COMBAT with group initiative (one roll per side; Chaos Mode re-rolls it each
     round), automatic monster turns against your AC, the dying rules and morale;
   - XP from treasure.
   The heroes' own Shadowdark sheets are embedded on the right (?embed=1&solo=1)
   and talk to this page through postMessage (the SOLO PLAY BRIDGE block at the
   end of sd_character_sheet.html), so every roll is the sheet's real roll.
   Saved as a "db-solo" document under the "db_solo" key, like the Dragonbane
   campaigns (the key names the solo feature, not the system).
   Part of the removable Solo Play feature — see SOLO-REMOVAL.md. */
(function(){
"use strict";
var T=window.SD_SOLO_TABLES||{}, MODS=window.SD_SOLO_MODULES||[];
var $=function(id){ return document.getElementById(id); };
var A=function(x){ return Array.isArray(x)?x:[]; };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function d(n){ return 1+Math.floor(Math.random()*n); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function rollExpr(expr,crit){ // "2d6", "1d4+2", "1d8+1d4", "3"
  var total=0, parts=[]; String(expr||'').toLowerCase().replace(/\s+/g,'').replace(/-/g,'+-').split('+').forEach(function(t){ if(!t) return;
    var neg=t.charAt(0)==='-'; if(neg) t=t.slice(1);
    var m=/^(\d*)d(\d+)$/.exec(t); if(m){ var n=+(m[1]||1)*(crit?2:1), s=+m[2], r=[]; for(var i=0;i<n;i++) r.push(d(s)); var sum=r.reduce(function(a,b){ return a+b; },0); total+=neg?-sum:sum; parts.push((neg?'−':'')+n+'d'+s+'('+r.join(',')+')'); }
    else if(/^\d+$/.test(t)){ total+=neg?-(+t):+t; parts.push((neg?'−':'')+t); } });
  return {total:Math.max(0,total),text:parts.join(' + ')}; }
function toast(t){ var el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(function(){ el.classList.remove('on'); },2600); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function sgn(n){ n=+n||0; return (n>=0?'+':'')+n; }
var STATN={str:'STR',dex:'DEX',con:'CON',int:'INT',wis:'WIS',cha:'CHA'};
function statKey(x){ var k=String(x||'').toLowerCase(); return STATN[k]?k:null; }

// ── state ──────────────────────────────────────────────────────────────────
var KEY='db_solo';
var S=(function(){ var raw=(window.__ddState||{})[KEY]; var o={}; try{ o=typeof raw==='string'?JSON.parse(raw):(raw||{}); }catch(e){ o={}; } return o; })();
S.v=1; S.system='SD'; S.name=S.name||'Solo campaign'; S.moduleId=S.moduleId||(MODS[0]&&MODS[0].id);
S.journal=A(S.journal); S.done=S.done||{}; S.m=S.m||null; S.combat=S.combat||null; S.summary=S.summary||{};
S.favor=S.favor||{}; S.dead=S.dead||{}; S.chaos=S.chaos!==false;
var MOD=MODS.find(function(m){ return m.id===S.moduleId; })||MODS[0];
function L(k,def){ return (MOD&&MOD.labels&&MOD.labels[k])||def; }
function mTitle(i){ var mi=MOD.missions[i]; return MOD.missions.length>1?'Part '+(i+1)+': '+mi.title:mi.title; }
// ── party (1–4 heroes) ──────────────────────────────────────────────────────
var PCS={}, PC=null;
if(!Array.isArray(S.party)) S.party=S.character?[S.character]:[];
S.party=S.party.filter(function(p){ return p&&p.id; }).slice(0,4);
if(!S.acting||!S.party.some(function(p){ return p.id===S.acting; })) S.acting=S.party[0]?S.party[0].id:null;
function syncChar(){ S.character=S.party[0]||null; }
syncChar();
function solo(){ return S.party.length<=1; }
function heroName(id){ var p=S.party.find(function(x){ return x.id===id; }); var s=PCS[id]; return (s&&s.name)||(p&&p.name)||'Hero'; }
function isDead(id){ return !!S.dead[id]; }
function petrified(id){ return !!(S.m&&S.m.stone&&S.m.stone[id]); }
function aliveHeroes(){ return S.party.map(function(p){ return p.id; }).filter(function(id){ return !isDead(id)&&!petrified(id); }); }
function hpOf(id){ var s=PCS[id]; return s?s.hp:1; }
function dyingOf(id){ return S.m&&S.m.dying&&S.m.dying[id]; }
function standing(id){ return !isDead(id)&&!petrified(id)&&hpOf(id)>0; }
function standingHeroes(){ return aliveHeroes().filter(standing); }
var saveT=null;
function save(){ refreshSummary(); if(saveT) clearTimeout(saveT); saveT=setTimeout(function(){ saveT=null; try{ if(window.__ddSave){ var o={}; o[KEY]=JSON.stringify(S); window.__ddSave(o); } }catch(e){} },500); }
function refreshSummary(){
  var mi=S.m?MOD.missions[S.m.idx]:null, one=MOD.missions.length===1, cw=S.m&&S.m.wps&&S.m.wps[S.m.cur];
  S.summary={ system:'SD', module:MOD?MOD.title:'', mission:mi&&!one?mTitle(S.m.idx):'', party:S.party.map(function(p){ return p.name; }),
    progress: !S.party.length?'No heroes chosen': !S.m? (one?(S.done[MOD.missions[0].id]==='won'?'Adventure complete':S.done[MOD.missions[0].id]==='lost'?'Party lost':'Not started'):(Object.keys(S.done).length+' of '+MOD.missions.length+' parts done')) :
      S.m.status==='briefing'?'Preparing': S.m.status==='won'?(S.m.lost?'Party lost':'Adventure complete'):
      ((cw?'At '+cw.name.replace(/^\d+\.\s*/,''):'')+' · round '+(S.m.crawl||0)+(S.combat?' · in combat':'')) };
}
function jlog(k,h,x){ S.journal.unshift({t:Date.now(),k:k,h:h,x:x||''}); if(S.journal.length>1000) S.journal.length=1000; }
function story(x){ if(x) jlog('story','',String(x)); }

// ── the embedded sheets (one per hero, bridge) ─────────────────────────────
var frames={}, reqs={}, ORIGIN=window.location.origin;
function mountSheets(){
  var host=$('so-frames'), ids=S.party.map(function(p){ return p.id; });
  Object.keys(frames).forEach(function(id){ if(ids.indexOf(id)<0){ frames[id].remove(); delete frames[id]; delete PCS[id]; } });
  $('so-sheet-empty').style.display=ids.length?'none':'';
  ids.forEach(function(id){ if(frames[id]) return; var f=document.createElement('iframe'); f.title='Character sheet'; f.src='/tools/sd-character/'+encodeURIComponent(id)+'?embed=1&solo=1'; host.appendChild(f); frames[id]=f; });
  PC=PCS[S.acting]||null; showSheet(); renderHeroTabs(); }
var VIEW=null;
function showSheet(){ var vis=VIEW&&frames[VIEW]?VIEW:S.acting; Object.keys(frames).forEach(function(id){ var on=id===vis; frames[id].style.visibility=on?'visible':'hidden'; frames[id].style.zIndex=on?'1':'0'; }); }
function setActing(id,quiet){ if(!id||!frames[id]) return; S.acting=id; VIEW=null; PC=PCS[id]||null; showSheet(); renderHeroTabs(); if(!quiet) render(); }
function renderHeroTabs(){ var el=$('so-heroes'); if(!el) return;
  if(solo()){ el.style.display='none'; document.body.classList.remove('party'); return; }
  document.body.classList.add('party'); el.style.display=''; var tb=document.querySelector('.so-tabs [data-tab="sheet"]'); if(tb) tb.dataset.who=heroName(S.acting);
  el.innerHTML=S.party.map(function(p){ var s=PCS[p.id], hp=s&&s.hpMax?Math.max(0,Math.min(100,s.hp/s.hpMax*100)):100;
    var vis=VIEW&&frames[VIEW]?VIEW:S.acting, dead=isDead(p.id);
    return '<button type="button" role="tab" aria-selected="'+(p.id===vis)+'" class="hero'+(p.id===vis?' on':'')+(dead?' dead':'')+'" data-a="view" data-id="'+esc(p.id)+'" title="Show '+esc(heroName(p.id))+'\'s sheet'+(p.id===S.acting&&!solo()?' — acting now':'')+'">'+(p.id===S.acting&&!solo()?'<b class="act-dot" aria-label="acting now"></b>':'')+'<span>'+esc(heroName(p.id))+'</span><i style="--hp:'+hp+'%"></i>'+(dead?'<em>dead</em>':petrified(p.id)?'<em>stone</em>':dyingOf(p.id)?'<em>dying</em>':'')+'</button>'; }).join(''); }
function send(cmd,extra,cb,who){ var f=frames[who||S.acting]; if(!f||!f.contentWindow){ toast('The character sheet is still loading'); return; }
  var m=Object.assign({src:'sd-solo',cmd:cmd},extra||{}); if(cb){ m.req=uid(); reqs[m.req]=cb; }
  f.contentWindow.postMessage(m, ORIGIN); }
window.addEventListener('message',function(e){
  if(e.origin!==ORIGIN) return; var id=Object.keys(frames).find(function(k){ return frames[k].contentWindow===e.source; }); if(!id) return;
  var m=e.data||{}; if(m.src!=='sd-sheet') return;
  if(m.kind==='state'){ var first=!PCS[id], was=PCS[id]; PCS[id]=m; if(id===S.acting) PC=m;
    var p=S.party.find(function(x){ return x.id===id; }); if(p&&m.name&&p.name!==m.name){ p.name=m.name; syncChar(); save(); }
    hpWatch(id,was,m); renderHeroTabs(); if(first&&id===S.acting) render(); else if(S.m&&S.m.status==='active'&&!$('dlg').classList.contains('open')) renderSoon(); return; }
  if(m.kind==='roll'){ onRoll(m,id); return; }
  if(m.kind==='light'){ onLight(id,m.source); return; }
  if(m.kind==='useFailed'){ toast(heroName(id)+' has no '+m.name); return; }
  if(m.kind==='log'){ if(!solo()) S.party.forEach(function(p){ if(p.id!==id&&frames[p.id]&&frames[p.id].contentWindow) send('relay',{label:heroName(id)+' · '+m.label,result:m.result,detail:m.detail,type:m.type},null,p.id); }); return; }
});
var rsT=null; function renderSoon(){ if(rsT) return; rsT=setTimeout(function(){ rsT=null; render(); },150); }

// ── rolls through the sheets ───────────────────────────────────────────────
// A Shadowdark check: d20 + modifier vs DC. A natural 20 always succeeds, a natural 1 always fails.
function checkOk(r,dc){ if(r.nat===20) return true; if(r.nat===1) return false; return (+r.total||0)>=(+dc||10); }
function rollWord(r,dc){ return (r.nat===20?'Natural 20! ':r.nat===1?'Natural 1. ':'')+(checkOk(r,dc)?'Success':'Failure'); }
// advantage + disadvantage cancel; total darkness gives disadvantage on everything
function advMode(adv,dis){ var a=!!adv, b=!!dis||isDark(); return a&&b?null:a?'advantage':b?'disadvantage':null; }
function onRoll(m,pid){
  if(m.nat===20) grantLuck(pid,'Natural 20'+(m.label?' — '+m.label:''));
  var cb=m.req&&reqs[m.req]; if(cb){ delete reqs[m.req]; cb(m); return; }
  if(m.none) return;
  // a roll the player made on the sheet themselves
  var c=S.combat, P=c&&c.pending;
  if(c&&P&&P.type==='pc'&&P.pid===pid&&(m.type==='attack'||m.type==='spell')){ pcAction(m,pid); return; }
  if(m.type==='spell'&&m.success&&/^light$/i.test(m.label||'')){ setLight(pid,'Light spell'); jlog('roll',heroName(pid)+' casts Light',m.total+''); actionDone(); save(); render(); return; }
  if(c&&alive().length&&(m.type==='attack'||m.type==='spell')){ toast(P&&P.type==='pc'?'It\'s '+heroName(P.pid)+'\'s turn':'Wait for your side\'s turn'); jlog('combat',heroName(pid)+' acts out of turn','The roll is ignored'); save(); renderJournal(); return; }
  if(m.type==='spell'&&m.success&&m.healing&&m.dmg) { offerHeal(pid,m); return; }
  if(m.type==='check') jlog('roll',(solo()?'':heroName(pid)+': ')+m.label+' check',m.total+' (d20 '+m.nat+')');
  save(); renderJournal();
}
// spec: {stat, dc, adv, dis, label}; who = a hero id (default: the acting hero)
function rollSheet(spec,cb,who){ who=who||S.acting;
  if(!PCS[who]){ toast('Waiting for '+heroName(who)+'\'s sheet…'); return; }
  if(who!==S.acting) setActing(who,true);
  var st=statKey(spec.stat)||'wis';
  send('roll',{stat:st,adv:advMode(spec.adv,spec.dis),label:spec.label?spec.label+' ('+STATN[st]+')':STATN[st]},function(r){ r.hero=who; cb&&cb(r); },who);
}
function rollEach(ids,spec,done){ var out=[], i=0; (function next(){ if(i>=ids.length){ done(out); return; } var id=ids[i++]; rollSheet(spec,function(r){ out.push(r); setTimeout(next,400); },id); })(); }
function specLine(c){ var st=statKey(c.stat); return (st?STATN[st]:'')+(c.dc?' DC '+c.dc:''); }

// ── LUCK (SoloDark): a natural 20 earns a token, up to one per hero in the party ──
function luckOf(id){ var s=PCS[id]; return s?(+s.luck||0):0; }
function partyLuck(){ return S.party.reduce(function(t,p){ return t+(isDead(p.id)?0:luckOf(p.id)); },0); }
function luckCap(){ return Math.max(1,aliveHeroes().length); }
function grantLuck(pid,why){ if(!S.m||S.m.status!=='active'||isDead(pid)) return; if(partyLuck()>=luckCap()) return;
  if(PCS[pid]) PCS[pid].luck=luckOf(pid)+1; send('luck',{add:1,why:why},null,pid); jlog('luck','Luck token'+(solo()?'':' — '+heroName(pid)),why); toast('Luck token! '+why); }
function spendLuck(pid){ if(luckOf(pid)<=0) return false; if(PCS[pid]) PCS[pid].luck=luckOf(pid)-1; send('luck',{add:-1},null,pid); jlog('luck','Luck token spent'+(solo()?'':' — '+heroName(pid)),'Re-roll'); return true; }
// Fortune's Favor: a hero new to the campaign starts with a luck token
function fortunesFavor(){ S.party.forEach(function(p){ if(S.favor[p.id]) return; var s=PCS[p.id]; if(!s) return; S.favor[p.id]=true; if(luckOf(p.id)<1){ s.luck=1; send('luck',{set:1,why:'Fortune\'s Favor — a new hero starts with a luck token'},null,p.id); } }); }

// ── rendering ──────────────────────────────────────────────────────────────
var UI={};
function render(){
  var r=$('so-root'); var h='';
  if(!S.party.length) h+=partyCard(true);
  else if(!S.m) h+=hubCard()+partyCard(false);
  else if(S.m.status==='briefing') h+=briefingCard();
  else if(S.m.status==='won') h+=debriefCard();
  else h+=topCard()+actCard();
  document.body.classList.toggle('playing', !!(S.party.length&&S.m&&S.m.status==='active'));
  r.innerHTML=h; renderJournal(); renderHeroTabs();
}
function partyCard(first){
  if(!first) return '<div class="card"><div class="card-h"><h3>'+(solo()?'Your hero':'Your party')+'</h3><span class="tiny muted">'+(solo()?'One hero':S.party.length+' heroes')+'</span></div><div class="card-b"><div class="row">'+
    S.party.map(function(p){ return '<span class="chip'+(isDead(p.id)?' bad':'')+'">'+esc(heroName(p.id))+(isDead(p.id)?' (dead)':'')+'</span>'; }).join('')+'</div><p class="tiny muted" style="margin-top:6px">Set when the campaign was created.</p></div></div>';
  return '<div class="card"><div class="card-h"><h3>No heroes</h3></div><div class="card-b"><p class="small">This campaign has no heroes. Start a new solo campaign from the Campaigns page and choose your Shadowdark characters there.</p></div></div>';
}
function hubCard(){
  var h='<div class="card"><div class="card-h"><h3>'+esc(MOD.intro.title)+'</h3></div><div class="card-b">';
  h+='<p class="read">'+esc(MOD.intro.text)+'</p>';
  if(MOD.hub) h+='<div class="lbl" style="margin-top:8px">'+esc(MOD.hub.name)+'</div><p class="small">'+esc(MOD.hub.text)+'</p>';
  h+='<div class="lbl" style="margin-top:10px">'+esc(L('missions','Adventure'))+'</div><div class="stack" style="margin-top:4px">';
  MOD.missions.forEach(function(mi,i){ var st=S.done[mi.id];
    h+='<div class="mission"><div><b>'+(MOD.missions.length>1?(i+1)+'. ':'')+esc(mi.title)+'</b><div class="tiny muted">'+esc(mi.objective)+'</div>'+bestHtml(mi)+'</div>'+
      '<div class="row">'+(st==='won'?'<span class="chip good">Done</span>':st==='lost'?'<span class="chip bad">Lost</span>':'')+'<button class="btn '+(st?'ghost':'pri')+'" data-a="brief" data-i="'+i+'">'+(st?'Play again':'Begin')+'</button></div></div>'; });
  h+='</div>';
  if(Object.keys(S.dead).length) h+='<p class="small" style="margin-top:8px"><b>Fallen:</b> '+esc(Object.keys(S.dead).map(heroName).join(', '))+'. Dead heroes stay dead; play again with the others, or start a new campaign with a fresh hero.</p>';
  return h+'</div></div>';
}
function briefingCard(){
  var mi=MOD.missions[S.m.idx];
  var h='<div class="card"><div class="card-h"><h3>'+esc(mTitle(S.m.idx))+'</h3><button class="btn ghost" data-a="hub">Back</button></div><div class="card-b">';
  h+='<p class="read">'+esc(mi.briefing)+'</p><p><b>Goal:</b> '+esc(mi.objective)+'</p>';
  if(mi.level) h+='<p class="small"><b>For</b> '+esc(mi.level)+(solo()?' — alone, it will be deadly. SoloDark suggests a lone hero start a few levels higher.':'.')+'</p>';
  if(mi.danger) h+='<p class="small"><b>Danger level: '+esc(mi.danger.label)+'.</b> A random-encounter check every '+mi.danger.every+' crawling rounds — and every round in total darkness.</p>';
  h+='<p class="small"><b>Light.</b> A torch, candle or lantern flask burns for 10 rounds; every action is a round. Light one as you go in — in the dark every check has disadvantage.</p>';
  h+='<p class="small"><b>Luck.</b> A natural 20 earns a luck token (the party holds up to one per hero); spend one to re-roll a failed roll.</p>';
  A(mi.notes).forEach(function(n){ h+='<p class="small"><b>'+esc(n[0])+'.</b> '+esc(n[1])+'</p>'; });
  if(A(mi.rumors).length){
    h+='<div class="lbl" style="margin-top:10px">Rumors</div>';
    var got=A(S.m.rumors);
    if(got.length) h+='<ul class="jl">'+got.map(function(n){ var r=mi.rumors.find(function(x){ return x.roll===n; }); return r?'<li>'+esc(r.text)+'</li>':''; }).join('')+'</ul><p class="tiny muted" style="margin-top:4px">They\'re in your Journal. Not every rumor is true.</p>';
    else h+='<p class="small">Before you set out, each hero asks around: one rumor each (d6).</p><div class="row" style="margin-top:6px"><button class="btn" data-a="rumors">Ask around (roll '+(solo()?'a rumor':S.party.length+' rumors')+')</button></div>';
  }
  h+='<div class="row" style="margin-top:12px"><button class="btn pri" data-a="enter">'+esc(L('enter','Enter the dungeon'))+'</button></div>';
  return h+'</div></div>';
}
function curMission(){ return S.m?MOD.missions[S.m.idx]:null; }
function curWp(){ return S.m&&S.m.wps&&S.m.wps[S.m.cur]; }
function wpDef(w){ var mi=curMission(); return w&&w.def?mi.waypoints.find(function(x){ return x.id===w.def; }):null; }
function wpName(w){ return w.name; }
function lightPips(){ var lt=S.m.light||{}; var n=lt.lit?lt.left:0; var out=''; for(var i=1;i<=10;i++) out+='<span class="'+(i<=n?(n<=2?'on low':'on'):'')+'"></span>'; return out; }
function statusBar(){
  var mi=curMission(), h='';
  h+='<div class="st-h"><b>'+esc(mTitle(S.m.idx))+'</b>'+(S.m.objective?'<span class="chip good">Goal done</span>':'')+'</div>';
  h+='<div class="tiny muted">'+esc(mi.objective)+'</div>';
  // where you've been is on the Map; here just how much of the dungeon you've seen
  var seen=S.m.wps.filter(function(w){ return w.visited; }).length;
  h+='<div class="tiny muted" style="margin-bottom:6px">'+seen+' of '+S.m.wps.length+' places explored'+(mi.map?' · the Map shows them':'')+'</div>';
  h+='<div class="st-row">';
  var lt=S.m.light||{};
  h+='<div class="st-cell" title="'+esc(lt.lit?(lt.src||'Light')+(lt.who?' — '+heroName(lt.who):'')+': '+lt.left+' round'+(lt.left===1?'':'s')+' left':'Total darkness: disadvantage on every check, and an encounter check every round')+'"><span class="lbl">Light</span>'+(lt.lit?'<span class="lightbar">'+lightPips()+'</span>':'<span class="dark-badge">● Dark</span>')+'</div>';
  var every=(mi.danger&&mi.danger.every)||3, cr=S.m.crawl||0, nextIn=isDark()?1:every-(cr%every);

// ── the CRAWL clock: rounds pass; light burns; random-encounter checks by the danger level

// ── DYING (Shadowdark): at 0 HP a hero is dying — a death timer of 1d4 + CON rounds;
// a natural 20 on the d20 each turn brings them back with 1 HP. Another hero can

    jlog('combat',heroName(id)+' is dying','Death timer: '+t+' round'+(t===1?'':'s')); story(heroName(id)+' falls.'); toast(heroName(id)+' is dying!'); save(); }
  if(m.hp>0&&(S.m.dying[id]||S.m.stable[id])){ delete S.m.dying[id]; delete S.m.stable[id]; jlog('combat',heroName(id)+' is back on their feet',m.hp+' HP'); save(); }
}
function deathRoll(id){ var dy=dyingOf(id); if(!dy) return; var r=d(20);

  dy.left--; jlog('combat',heroName(id)+': death roll '+r,dy.left>0?dy.left+' round'+(dy.left===1?'':'s')+' left':'');

// a group written for a full party shrinks for fewer heroes: `solo` is the number for one hero
function scaledN(spec,full){ var all=spec.count||1; if(typeof all==='string') all=rollExpr(all).total||1; if(full||spec.solo==null) return all; var n=Math.max(1,Math.min(4,S.party.length||1)); return Math.max(1,Math.round(spec.solo+(all-spec.solo)*(n-1)/3)); }

  var said=S.m.saidOpts||{}, opts=A(n.options).filter(function(o){ return hasReq(o.requires,w)&&!anyOn(o.hideIf,w)&&!(o.once&&said[optKey(tid,o)]); }); UI.talkOpts=opts;
  var h='<h3>'+esc(t.name)+'</h3>'+(n.text?'<p class="read">'+esc(n.text)+'</p>':'');
  if(n.end||!opts.length) h+='<div class="row" style="margin-top:10px"><button class="btn pri" data-a="talk-end">'+esc(n.endLabel||'Done')+'</button></div>';
  else h+='<div class="list" style="margin-top:8px">'+opts.map(function(o,i){ var r=o.stat?specLine(o):''; return '<button class="btn" data-a="talk-opt" data-i="'+i+'">'+esc(o.label)+(r?' <span class="tiny muted">· '+esc(r)+'</span>':'')+'</button>'; }).join('')+'</div>'+(n.noLeave?'':'<div class="row" style="margin-top:8px"><button class="btn ghost" data-a="talk-end">Leave it there</button></div>');
  dlg(h); save(); renderJournal(); }
function talkOpt(i){ var o=A(UI.talkOpts)[i]; if(!o||!UI.talk) return; var tid=UI.talk.id, w=curWp(), def=wpDef(w);

  if(o.stat){ closeDlg(); rollSheet({stat:o.stat,adv:!!o.adv,dis:!!o.dis,label:o.label},function(r){ var ok=checkOk(r,o.dc); jlog('roll',o.label+' — '+rollWord(r,o.dc),r.total+' vs DC '+o.dc); openTalk(tid,ok?o.success:o.failure); }); return; }
  if(o.to) openTalk(tid,o.to); else talkEnd(); }

// Reaction (Shadowdark): 2d6 + CHA — 2–6 hostile, 7–8 suspicious, 9 neutral, 10–11 curious, 12+ friendly.
function reactionBand(n){ return n<=6?'hostile':n<=8?'suspicious':n===9?'neutral':n<=11?'curious':'friendly'; }
function evOption(i){ var w=curWp(), D=dangerHere(); if(!D||D.type!=='event') return; var o=A(D.ev.options)[i]; if(!o) return; var def=wpDef(w);
  var fin=function(fx,txt){ clearDanger(); if(txt) story(txt); applyEffects(fx,w,def,{label:o.label}); if(!o.free) actionDone(); save(); render(); };
  if(o.reaction){ var s=PCS[S.acting], ch=(s&&s.mods&&s.mods.cha)||0, r=d(6)+d(6), t=r+ch, band=reactionBand(t); jlog('roll','Reaction: '+band,'2d6 '+r+' '+sgn(ch)+' CHA = '+t); var b=(o.bands||{})[band]||{}; fin(b.fx,b.text); return; }
  if(o.stat){ rollSheet({stat:o.stat,label:o.label},function(r){ var ok=checkOk(r,o.dc); jlog('roll',o.label+' — '+rollWord(r,o.dc),r.total+' vs DC '+o.dc); fin(ok?o.onSuccess:o.onFail,ok?o.success:o.failure); }); return; }
  fin(o.fx,o.text); }
// ── Companions: mission.companions = { id:{ name, hp, ac, atk:'1 dagger +2 (1d4)', helps:['dex'], note } }.
// They fight on your side's turn; out of a fight they give advantage on the checks they're good at.
function allies(){ return A(S.m&&S.m.allies).filter(function(a){ return !a.down; }); }
function joinAlly(id){ var mi=curMission(), d0=(mi.companions||{})[id]; if(!d0||!S.m||A(S.m.allies).some(function(a){ return a.id===id; })) return;
  S.m.allies=A(S.m.allies); S.m.allies.push({id:id,name:d0.name,hp:d0.hp,hpMax:d0.hp,ac:d0.ac||11,atk:d0.atk||'1 dagger +1 (1d4)',helps:A(d0.helps),note:d0.note||''});
  jlog('mission',d0.name+' joins you',d0.note||''); }
function allyHelp(stat){ var k=statKey(stat); var a=allies().find(function(x){ return k&&x.helps.indexOf(k)>=0; }); return a?'Help from '+a.name:null; }
function allyTurn(a){ var foes=alive(); if(!foes.length) return; var f=pick(foes), at=(parseAtk(a.atk)[0]||[])[0]||{bonus:1,dmg:'1d4',name:'dagger'};
  var r=d(20), t=r+(at.bonus||0), hit=r===20||(r!==1&&t>=f.ac);
  if(!hit){ jlog('combat',a.name+' attacks '+f.name,'Miss ('+t+' vs AC '+f.ac+')'); return; }
  var dm=rollExpr(at.dmg||'1d4',r===20); var n=dmgAfter(f,dm.total,false,false);
  if(f.images>0){ f.images--; jlog('combat',a.name+' strikes an illusion',''); return; }
  jlog('combat',a.name+' hits '+f.name,at.name+' '+dm.text); hurtFoe(f,n,{why:a.name}); }
// ── Hints: mission.hints = [{ at, requires, unless, text }] — only what you've earned.
function hintFor(){ var mi=curMission(), w=curWp(); if(!mi||!w) return null;
  return A(mi.hints).find(function(hn){ return (!hn.at||arr1(hn.at).indexOf(w.def)>=0)&&hasReq(hn.requires,w)&&!anyOn(hn.unless,w); })||null; }
function giveHint(){ var hn=hintFor(); S.m.hints=(S.m.hints||0)+1;
  var txt=hn?hn.text:'Nothing you know yet points anywhere. Look closer at what\'s around you — and what you\'ve heard.';
  jlog('hint','Hint',txt); dlgQ('<h3>A thought</h3><p class="read">'+esc(txt)+'</p><div class="row" style="margin-top:10px"><button class="btn pri" data-a="close">Thanks</button></div>'); save(); renderJournal(); }
// ── Endings ──
function epilogueLines(){ var mi=curMission(); return A(mi.epilogue).filter(function(e){ return hasReq(e.requires)&&!anyOn(e.unless); }).map(function(e){ return e.text; }); }
function discoveriesFound(){ var mi=curMission(); return A(mi.discoveries).filter(function(x){ return flagOn(x.flag); }); }
function settleEnding(){ var mi=curMission(); if(!mi) return;
  S.best=S.best||{}; S.bestDisc=S.bestDisc||{}; S.achievements=S.achievements||{};
  S.best[mi.id]=Math.max(S.best[mi.id]==null?-1:S.best[mi.id],S.m.xp||0);
  S.bestDisc[mi.id]=Math.max(S.bestDisc[mi.id]||0,discoveriesFound().length);
  S.m.newAch=[]; A(mi.achievements).forEach(function(a){ if(!S.achievements[a.id]&&hasReq(a.requires)&&!anyOn(a.unless)){ S.achievements[a.id]=Date.now(); S.m.newAch.push(a.id); jlog('ach','Achievement: '+a.label,a.desc||''); } }); }
function endingHtml(){ var mi=curMission(), h='';
  var ep=S.m.lost?[]:epilogueLines(); if(ep.length) h+='<div class="lbl" style="margin-top:10px">Epilogue</div>'+ep.map(function(t){ return '<p class="read">'+esc(t)+'</p>'; }).join('');
  var all=A(mi.discoveries), got=discoveriesFound(); if(all.length) h+='<div class="lbl" style="margin-top:10px">Secrets found: '+got.length+' of '+all.length+'</div><ul class="disc">'+all.map(function(x){ var on=got.indexOf(x)>=0; return '<li class="'+(on?'on':'')+'">'+(on?'✓ '+esc(x.label):'? ? ?')+'</li>'; }).join('')+'</ul>';
  var ach=A(mi.achievements); if(ach.length){ var mine=S.achievements||{}; h+='<div class="lbl" style="margin-top:10px">Achievements: '+ach.filter(function(a){ return mine[a.id]; }).length+' of '+ach.length+'</div><div class="ach">'+ach.map(function(a){ var on=!!mine[a.id], nu=A(S.m.newAch).indexOf(a.id)>=0; return '<div class="a'+(on?' on':'')+(nu?' new':'')+'" title="'+esc(on?a.desc||'':'Not yet')+'"><b>'+(nu?'★ ':'')+esc(on?a.label:'Locked')+'</b>'+(on&&a.desc?'<span>'+esc(a.desc)+'</span>':'')+'</div>'; }).join('')+'</div>'; }
  if(S.m.hints) h+='<p class="tiny muted" style="margin-top:6px">Hints used: '+S.m.hints+'</p>';
  return h; }

// ── events ─────────────────────────────────────────────────────────────────
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]'); if(!t) return; var a=t.dataset.a;
  if(e.target.closest('.so-tabs')) return;
  switch(a){
    case 'close': closeDlg(); break;
    case 'brief': startBriefing(+t.dataset.i); break;
    case 'rumors': rollRumors(); break;
    case 'mapdlg': openMapDlg(); break;
    case 'journal': openJournalDlg(); break;
    case 'skip-turn': if(!solo()&&S.m){ actionDone(); save(); render(); } break;
    case 'hint': giveHint(); break;
    case 'oracle': openOracle(); break;
    case 'oracle-roll': oracleRoll(t.dataset.o); break;
    case 'prompt': { var pr=rollPrompt(); jlog('oracle','Prompt',pr); var out=$('oracle-out'); if(out) out.innerHTML='<div class="oracle-out"><div class="ans" style="font-size:24px">'+esc(pr)+'</div><p class="tiny muted">Verb + noun — what does it suggest?</p></div>'; save(); renderJournal(); break; }
    case 'light': openLight(); break;
    case 'light-do': { var lo=A(UI.lightOpts)[+t.dataset.i]; closeDlg(); doLight(lo); break; }
    case 'use-item': openUseItem(); break;
    case 'use-pick': pickUseItem(+t.dataset.i); break;
    case 'use-do': { var uo=A(UI.useOpts)[+t.dataset.i]; closeDlg(); if(uo) doUse(uo,UI.useIt); break; }
    case 'talk': openTalk(t.dataset.t); break;
    case 'talk-opt': talkOpt(+t.dataset.i); break;
    case 'talk-end': talkEnd(); break;
    case 'ev-opt': evOption(+t.dataset.i); break;
    case 'hero': if(!canAct(t.dataset.id)){ toast(heroName(t.dataset.id)+' has already acted this round'); break; } setActing(t.dataset.id); break;
    case 'c-hero': { var c0=S.combat; if(c0&&c0.pending&&c0.pending.type==='pc'&&!c0.done[t.dataset.id]){ c0.pending.pid=t.dataset.id; setActing(t.dataset.id,true); if(isDark()) send('adv',{mode:'disadvantage'},null,t.dataset.id); save(); render(); } break; }
    case 'view': VIEW=t.dataset.id===S.acting?null:t.dataset.id; showSheet(); renderHeroTabs(); break;
    case 'stabilize': { var sid=t.dataset.id, hid=t.dataset.h; rollSheet({stat:'int',label:'Stabilize '+heroName(sid)},function(r){ var ok=checkOk(r,15); jlog('roll',heroName(hid)+' tries to stabilize '+heroName(sid)+' — '+(ok?'stable':'not yet'),r.total+' vs DC 15');
        if(ok){ delete S.m.dying[sid]; S.m.stable[sid]=true; story(heroName(sid)+' is stable — unconscious, but no longer dying. Healing or a rest brings them round.'); } actionDone(); save(); render(); },hid); break; }
    case 'sneak': { var Dn=dangerHere(); if(!Dn||Dn.type!=='fight') break; var en=findEncounter(Dn.enc), dc=en.sneakDc||12;
      rollEach(standingHeroes(),{stat:'dex',label:'Sneak past: '+en.label},function(rs){ var bad=rs.filter(function(r){ return !checkOk(r,dc); });
        rs.forEach(function(r){ jlog('roll',(solo()?'':heroName(r.hero)+': ')+'Sneak past — '+rollWord(r,dc),r.total+' vs DC '+dc); });
        if(bad.length){ story((solo()?'They':'They spot '+heroName(bad[0].hero)+' — they')+' notice you.'); save(); startFight(en,false); return; }
        var wv=curWp(); wv.evaded=wv.evaded||{}; wv.evaded[en.id]=true; clearDanger(); story(solo()?'You slip past unseen.':'The party slips past unseen.'); if(en.onEvade) applyEffects(en.onEvade,wv,wpDef(wv),{label:en.label}); actionDone(); save(); render(); }); break; }
    case 'd-calm': { var Dc=dangerHere(); var ecl=Dc&&findEncounter(Dc.enc); if(!ecl||!ecl.endable) break; clearDanger(); jlog('note',ecl.endable.label,''); applyEffects(ecl.endable.fx,curWp(),wpDef(curWp()),{label:ecl.label}); S.m.flags['won:'+ecl.id]=true; save(); render(); break; }
    case 'retreat': { if(!S.m.trail.length) break; var from=curWp(); S.m.cur=S.m.trail.pop(); jlog('mission','Back to '+curWp().name,'Backing away'); tick(1); save(); render(); break; }
    case 'hub': S.m=null; S.combat=null; save(); render(); break;
    case 'enter': enterMission(); break;
    case 'ch': doChallenge(t.dataset.c); break;
    case 'ch-luck': luckReroll(t.dataset.c); break;
    case 'ch-accept': acceptFail(t.dataset.c); break;
    case 'ch-choice': doChoice(t.dataset.c); break;
    case 'ch-opt': doOption(t.dataset.c,t.dataset.o); break;
    case 'opt-luck': { var ol=UI.optLuck; closeDlg(); if(ol&&spendLuck(ol.hero)){ setActing(ol.hero,true); doOption(ol.cid,ol.oid,true); } break; }
    case 'opt-fail': { closeDlg(); if(UI.optFin){ var f0=UI.optFin; UI.optFin=null; f0(false); } break; }
    case 'loot-take': takeLoot(); break;
    case 'c-act': { var c1=S.combat; if(!c1) break; var enc1=findEncounter(c1.enc)||{}; var x=A(enc1.combatActions)[+t.dataset.i]; if(!x) break; c1.acts=c1.acts||{}; c1.acts[x.id]=(c1.acts[x.id]||0)+1; jlog('combat',x.label,'');
      if(x.chance&&d(x.chance[1])>x.chance[0]){ story(x.miss||'Nothing.'); pcTurnDone(); save(); render(); break; }
      applyEffects(x.fx,curWp(),wpDef(curWp()),{label:x.label}); pcTurnDone(); save(); render(); break; }
    case 'calm': { var ec=findEncounter(S.combat.enc); jlog('combat','The fight ends',ec&&ec.endable?ec.endable.label:''); var fxc=ec&&ec.endable&&ec.endable.fx; S.combat=null; if(ec) S.m.flags['won:'+ec.id]=true; if(fxc) applyEffects(fxc,curWp(),wpDef(curWp()),{label:'Fight'}); save(); render(); break; }
    case 'exit': { if(dangerHere()){ toast('Deal with the danger first'); break; } var dx=wpDef(curWp()), ex=A(dx&&dx.exits)[+t.dataset.i]; if(!ex) break; if(ex.fx) applyEffects(ex.fx,curWp(),dx,{label:ex.label}); goTo(ex.to); save(); render(); break; }
    case 'escape': { var de=wpDef(curWp()), es=A(de&&de.escapes)[+t.dataset.i]; if(!es) break;
      if(!es.stat){ applyEffects(es.fx,curWp(),de,{label:es.label}); escapeDungeon(es.done||es.label); break; }
      rollEach(standingHeroes(),{stat:es.stat,label:es.label},function(rs){ var fails=rs.filter(function(r){ return !checkOk(r,es.dc); }).length;
        if(fails&&es.mustPass){ toast('Not everyone makes it'); save(); render(); return; } setTimeout(function(){ escapeDungeon(es.done||es.label); },300); }); break; }
    case 'search': { var ws=curWp(), dfs=wpDef(ws), left=searchLeft(ws,dfs);
      if(!left.length){ story('You search carefully. Nothing more here.'); jlog('note','Search','Nothing found'); actionDone(); save(); render(); break; }
      var tgt=left[0], fin2=function(ok,r){ if(ok){ ws.found=ws.found||{}; ws.found[tgt.id]=true; story(tgt.text); applyEffects(tgt.fx,ws,dfs,{label:'Search'}); } else story(tgt.failure||'You search, but find nothing you can make sense of.'); actionDone(); save(); render(); };

    case 'rest': if(dangerHere()) break; dlg('<h3>Make camp</h3><p class="small">A rest takes the night: each hero eats a ration (their sheet does it), then regains their hit points and spells. You snuff the light while you sleep. One random-encounter check — trouble cuts the rest short.</p><div class="row" style="margin-top:8px"><button class="btn pri" data-a="rest-go">Make camp</button><button class="btn ghost" data-a="close">Not now</button></div>'); break;
    case 'rest-go': { closeDlg(); var rr=d(6); jlog('check','Encounter check (rest)','d6 '+rr+(rr===1?' — interrupted!':' — quiet'));
      if(rr===1){ story('Something finds your camp in the night.'); randomEncounter(); save(); render(); break; }
      aliveHeroes().forEach(function(id){ send('rest',{},null,id); }); if(S.m.stable) S.m.stable={}; story('You rest in the dark, taking turns at watch. Morning, or what passes for it down here, comes.'); jlog('note','Rest','Hit points and spells restored on the sheets'); newPartyRound(); save(); render(); break; }
    case 'heal-to': { var hl=UI.heal; closeDlg(); if(!hl) break; send('heal',{n:hl.n,why:'Healed by '+heroName(hl.pid)},null,t.dataset.id); jlog('roll',heroName(hl.pid)+' heals '+heroName(t.dataset.id),'+'+hl.n+' HP'); UI.heal=null; if(hl.fight) pcTurnDone(); else actionDone(); save(); render(); break; }
    case 'fight': { var e2=findEncounter(t.dataset.e); if(e2) startFight(e2,t.dataset.full==='1',{first:t.dataset.first||null}); break; }

function finishMission(){
  closeDlg(); var mi=curMission(); if(!mi||!S.m) return;

  if(S.m.lost){ S.done[mi.id]=S.done[mi.id]==='won'?'won':'lost'; S.m.status='won'; story(mi.lostText); jlog('mission','Lost: '+mi.title,''); }
  else { S.done[mi.id]='won'; S.m.status='won'; if(mi.reward) story(mi.reward.text); jlog('mission','Adventure complete: '+mi.title,(S.m.xp||0)+' XP'); }
  S.combat=null; save(); render();
}
