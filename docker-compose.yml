# Local-development Postgres only. Production uses Railway's Postgres plugin.
# Start with:  docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dungeon
      POSTGRES_PASSWORD: dungeon
      POSTGRES_DB: dungeondesk
    ports:
      - "5432:5432"
    volumes:
      - dd_pgdata:/var/lib/postgresql/data

volumes:
  dd_pgdata:
